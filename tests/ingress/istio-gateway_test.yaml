- interval: 1m
  input_series:
  - series: istio_requests_total{cluster="c1",namespace="istio-ingress",job="istio-ingress",destination_service_namespace="serverless",destination_service_name="orders-00003",reporter="source",response_code="200",request_protocol="http",response_flags="-"}
    values: 0+20x20
  - series: istio_requests_total{cluster="c1",namespace="istio-ingress",job="istio-ingress",destination_service_namespace="serverless",destination_service_name="orders-00003",reporter="source",response_code="503",request_protocol="http",response_flags="UF"}
    values: 0+5x20
  alert_rule_test:
  - eval_time: 10m
    alertname: IstioGatewayHigh5xxErrorRate
    exp_alerts: []
  - eval_time: 10m
    alertname: IstioGatewayDestinationHigh5xxErrorRate
    exp_alerts: []
- interval: 1m
  input_series:
  - series: istio_requests_total{cluster="c1",namespace="istio-ingress",job="istio-ingress",destination_service_namespace="serverless",destination_service_name="orders-00003",reporter="source",response_code="200",request_protocol="http",response_flags="-"}
    values: 0+600x20
  - series: istio_requests_total{cluster="c1",namespace="istio-ingress",job="istio-ingress",destination_service_namespace="serverless",destination_service_name="orders-00003",reporter="source",response_code="503",request_protocol="http",response_flags="UF"}
    values: 0x10 0+60x10
  alert_rule_test:
  - eval_time: 18m
    alertname: IstioGatewayHigh5xxErrorRate
    exp_alerts: []
- interval: 1m
  input_series:
  - series: istio_requests_total{cluster="c1",namespace="istio-ingress",job="istio-ingress",destination_service_namespace="serverless",destination_service_name="orders-00003",reporter="source",response_code="200",request_protocol="http",response_flags="-"}
    values: 0+300x40
  - series: istio_requests_total{cluster="c1",namespace="istio-ingress",job="istio-ingress",destination_service_namespace="serverless",destination_service_name="orders-00003",reporter="source",response_code="404",request_protocol="http",response_flags="NR"}
    values: 0+100x40
  alert_rule_test:
  - eval_time: 25m
    alertname: IstioGatewayHigh4xxErrorRate
    exp_alerts:
    - exp_labels:
        sourceType: metric
        severity: warning
        priority: P2
        notify_every: 2h
        tech_stack: istio
        signal: symptom
        category: ingress
        runbook: runbooks/ingress/istio-gateway.yaml
        query: |
          (
            sum by (cluster, namespace, job) (
              increase(istio_requests_total{job=~"istio-ingress.*",reporter="source",request_protocol=~"http|http2",response_code=~"4.."}[10m])
            )
            /
            sum by (cluster, namespace, job) (
              increase(istio_requests_total{job=~"istio-ingress.*",reporter="source",request_protocol=~"http|http2",response_code=~"[2-5].."}[10m])
            )
          ) > 0.20
          and on (cluster, namespace, job)
          sum by (cluster, namespace, job) (
            increase(istio_requests_total{job=~"istio-ingress.*",reporter="source",request_protocol=~"http|http2",response_code=~"4.."}[10m])
          ) >= 100
          and on (cluster, namespace, job)
          sum by (cluster, namespace, job) (
            increase(istio_requests_total{job=~"istio-ingress.*",reporter="source",request_protocol=~"http|http2",response_code=~"[2-5].."}[10m])
          ) >= 600
        cluster: c1
        namespace: istio-ingress
        job: istio-ingress
      exp_annotations:
        summary: Istio ingress gateway 4xx error rate is above 20%
        description: 25% of completed HTTP requests through Istio ingress gateway istio-ingress/istio-ingress in cluster c1 returned 4xx responses over the last 10 minutes, with at least 100 errors and 600 completed requests in the window, and the condition has held for 10 minutes. Clients may be failing authentication or authorization, calling routes that no longer exist, or sending invalid requests. Common causes are a recent VirtualService, Gateway or AuthorizationPolicy change (404 NR, 403 RBAC), expired or misconfigured credentials or JWT policies (401), rate limiting (429), a client release calling removed endpoints, or scanner traffic. Break the errors down by response_code, response_flags and destination_service_name to find the source.
        runbook_url: https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/ingress/istio-gateway.yaml
  - eval_time: 25m
    alertname: IstioGatewayDestinationHigh4xxErrorRate
    exp_alerts:
    - exp_labels:
        sourceType: metric
        severity: warning
        priority: P3
        notify_every: 6h
        tech_stack: istio
        signal: symptom
        category: ingress
        runbook: runbooks/ingress/istio-gateway.yaml
        query: |
          (
            sum by (cluster, namespace, job, destination_service_namespace, destination_service_name) (
              increase(istio_requests_total{job=~"istio-ingress.*",reporter="source",request_protocol=~"http|http2",destination_service_name=~".+",destination_service_name!="unknown",destination_service_namespace=~".+",destination_service_namespace!="unknown",response_code=~"4.."}[10m])
            )
            /
            sum by (cluster, namespace, job, destination_service_namespace, destination_service_name) (
              increase(istio_requests_total{job=~"istio-ingress.*",reporter="source",request_protocol=~"http|http2",destination_service_name=~".+",destination_service_name!="unknown",destination_service_namespace=~".+",destination_service_namespace!="unknown",response_code=~"[2-5].."}[10m])
            )
          ) > 0.20
          and on (cluster, namespace, job, destination_service_namespace, destination_service_name)
          sum by (cluster, namespace, job, destination_service_namespace, destination_service_name) (
            increase(istio_requests_total{job=~"istio-ingress.*",reporter="source",request_protocol=~"http|http2",destination_service_name=~".+",destination_service_name!="unknown",destination_service_namespace=~".+",destination_service_namespace!="unknown",response_code=~"4.."}[10m])
          ) >= 50
          and on (cluster, namespace, job, destination_service_namespace, destination_service_name)
          sum by (cluster, namespace, job, destination_service_namespace, destination_service_name) (
            increase(istio_requests_total{job=~"istio-ingress.*",reporter="source",request_protocol=~"http|http2",destination_service_name=~".+",destination_service_name!="unknown",destination_service_namespace=~".+",destination_service_namespace!="unknown",response_code=~"[2-5].."}[10m])
          ) >= 300
        cluster: c1
        namespace: istio-ingress
        job: istio-ingress
        destination_service_namespace: serverless
        destination_service_name: orders-00003
      exp_annotations:
        summary: Destination service behind the Istio ingress gateway has a 4xx error rate above 20%
        description: 25% of completed HTTP requests from Istio ingress gateway istio-ingress/istio-ingress to destination service serverless/orders-00003 in cluster c1 returned 4xx responses over the last 10 minutes, with at least 50 errors and 300 completed requests in the window, and the condition has held for 10 minutes. Clients of this service are being rejected, which may indicate an authentication or authorization change, removed or renamed API routes, request validation failures, or a client release sending invalid requests. Break the errors down by response_code and response_flags and compare against recent deployments of the service and its clients.
        runbook_url: https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/ingress/istio-gateway.yaml
  - eval_time: 25m
    alertname: IstioGatewayHigh5xxErrorRate
    exp_alerts: []
