            increase(istio_requests_total{job=~"istio-ingress.*",reporter="source",request_protocol=~"http|http2",response_code=~"[2-5].."}[5m])
          ) >= 300
        cluster: c1
        namespace: istio-ingress
        job: istio-ingress
      exp_annotations:
        summary: Istio ingress gateway 5xx error rate is above 5%
        description: 66.67% of completed HTTP requests through Istio ingress gateway istio-ingress/istio-ingress in cluster c1 returned 5xx responses over the last 5 minutes, with at least 20 errors and 300 completed requests in the window, and the condition has held for 10 minutes. External users and API clients routed through this gateway are seeing failed requests, gateway errors, or timeouts. The errors may come from the backend applications, or be generated by Envoy itself when upstreams are unhealthy, have no ready endpoints, refuse connections, or exceed route timeouts (503 UF/UH/NR, 504 UT). Break the errors down by destination_service_name, response_code and response_flags to tell a single failing backend apart from a gateway-wide problem.
        runbook_url: https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/ingress/istio-gateway.yaml
