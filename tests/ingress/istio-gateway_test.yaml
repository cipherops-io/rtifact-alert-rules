          ) >= 300
        cluster: c1
        namespace: istio-ingress
        job: istio-ingress
      exp_annotations:
        summary: Istio ingress gateway 5xx error rate is critically high
        description: '66.67% of completed HTTP requests through Istio ingress gateway istio-ingress/istio-ingress in cluster c1 returned 5xx responses over the last 5 minutes, with at least 20 errors and 300 completed requests in the window, and the condition has held for 5 minutes. A large share of external users and API clients routed through this gateway cannot complete requests, and client retries may add load to the gateway and backends. Break the errors down by destination_service_name, response_code and response_flags: errors concentrated on one destination point to a failing backend, while errors spread across destinations point to the gateway pods, a recent Gateway/VirtualService/AuthorizationPolicy change, or a shared dependency.'
