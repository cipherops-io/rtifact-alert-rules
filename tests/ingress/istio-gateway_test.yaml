# Unit tests for rules/metrics/ingress/istio-gateway.yml
rule_files:
- ../../rules/metrics/ingress/istio-gateway.yml
evaluation_interval: 1m
tests:
- interval: 1m
  input_series:
  - series: up{cluster="c1",namespace="istio-ingress",job="istio-ingress",instance="10.0.0.1:15090",pod="10.0.0.1"}
    values: '0x15'
  - series: up{cluster="c1",namespace="istio-ingress",job="istio-ingress",instance="10.0.0.2:15090",pod="10.0.0.2"}
    values: '0x15'
  alert_rule_test:
  - eval_time: 10m
    alertname: IstioGatewayDown
    exp_alerts:
    - exp_labels:
        sourceType: metric
        severity: critical
        priority: P0
        notify_every: 10m
        tech_stack: istio
        signal: symptom
        category: ingress
        runbook: runbooks/ingress/istio-gateway.yaml
        query: |
          sum by (cluster, namespace, job) (
            up{job=~"istio-ingress.*"}
          ) == 0
          or
          (
            sum by (cluster, namespace, job) (
              max_over_time(up{job=~"istio-ingress.*"}[24h])
            )
            unless
            sum by (cluster, namespace, job) (
              up{job=~"istio-ingress.*"}
            )
          ) * 0
        cluster: c1
        namespace: istio-ingress
        job: istio-ingress
      exp_annotations:
        summary: All Istio ingress gateway targets are unavailable
        description: 'No healthy scrape target has been available for Istio ingress gateway istio-ingress/istio-ingress in cluster c1 for 5 minutes, either because every target is down or because the targets have disappeared. External HTTP and HTTPS traffic entering through this gateway may no longer reach any service, and because no requests are recorded, the gateway error-rate alerts cannot fire. Check the gateway Deployment replicas, pod status, restarts and node health, the gateway Service and its external load balancer, and whether the deployment was scaled to zero or deleted. This alert is based on scrape availability: if many unrelated targets disappeared at the same moment, the metrics agent is the more likely cause.'
        runbook_url: https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/ingress/istio-gateway.yaml
  - eval_time: 10m
    alertname: IstioGatewayReplicaDown
    exp_alerts:
    - exp_labels:
        sourceType: metric
        severity: warning
        priority: P2
        notify_every: 2h
        tech_stack: istio
        signal: cause
        category: ingress
        runbook: runbooks/ingress/istio-gateway.yaml
        query: |
          up{job=~"istio-ingress.*"} == 0
        cluster: c1
        namespace: istio-ingress
        job: istio-ingress
        instance: 10.0.0.1:15090
        pod: 10.0.0.1
      exp_annotations:
        summary: An Istio ingress gateway replica is unavailable
        description: Istio ingress gateway target 10.0.0.1:15090 (pod 10.0.0.1) of istio-ingress/istio-ingress in cluster c1 has been unreachable for 5 minutes. Other replicas may still route traffic, but gateway capacity and redundancy are reduced, and the external load balancer may still be sending some connections to this replica. Check the pod's readiness, restarts and termination reason, its node, and whether the Envoy stats port (15090) is reachable from the metrics agent.
        runbook_url: https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/ingress/istio-gateway.yaml
    - exp_labels:
        sourceType: metric
        severity: warning
        priority: P2
        notify_every: 2h
        tech_stack: istio
        signal: cause
        category: ingress
        runbook: runbooks/ingress/istio-gateway.yaml
        query: |
          up{job=~"istio-ingress.*"} == 0
        cluster: c1
        namespace: istio-ingress
        job: istio-ingress
        instance: 10.0.0.2:15090
        pod: 10.0.0.2
      exp_annotations:
        summary: An Istio ingress gateway replica is unavailable
        description: Istio ingress gateway target 10.0.0.2:15090 (pod 10.0.0.2) of istio-ingress/istio-ingress in cluster c1 has been unreachable for 5 minutes. Other replicas may still route traffic, but gateway capacity and redundancy are reduced, and the external load balancer may still be sending some connections to this replica. Check the pod's readiness, restarts and termination reason, its node, and whether the Envoy stats port (15090) is reachable from the metrics agent.
        runbook_url: https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/ingress/istio-gateway.yaml
- interval: 1m
  input_series:
  - series: up{cluster="c1",namespace="istio-ingress",job="istio-ingress",instance="10.0.0.1:15090",pod="10.0.0.1"}
    values: 1x5 stale
  - series: up{cluster="c1",namespace="istio-ingress",job="istio-ingress",instance="10.0.0.2:15090",pod="10.0.0.2"}
    values: 1x5 stale
