        destination_service_namespace: serverless
        destination_service_name: orders-00003
      exp_annotations:
        summary: Low-traffic destination service behind the Istio ingress gateway is failing most requests
        description: 66.67% of completed HTTP requests from Istio ingress gateway istio-ingress/istio-ingress to destination service serverless/orders-00003 in cluster c1 returned 5xx responses over the last 5 minutes, with at least 5 errors but fewer than 150 completed requests in the window, and the condition has held for 5 minutes. The service gets too little traffic for the standard destination 5xx alert, but most of its requests are failing, which usually means it is effectively down. Check response_flags (UH = no ready endpoints, UF/UR = connection failures or resets, UT = timeout, '-' = application error), then the destination pods' readiness, restarts and logs. For Knative services, check whether the revision is failing to scale from zero.
