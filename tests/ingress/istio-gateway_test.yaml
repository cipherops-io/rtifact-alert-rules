- interval: 1m
  input_series:
  - series: up{cluster="c1",namespace="istio-ingress",job="knative-local-gateway",instance="10.0.0.1:15090",pod="10.0.0.1"}
    values: '0x15'
  alert_rule_test:
  - eval_time: 10m
    alertname: IstioGatewayDown
    exp_alerts: []
  - eval_time: 10m
    alertname: IstioGatewayReplicaDown
    exp_alerts: []
- interval: 1m
  input_series:
  - series: istio_requests_total{cluster="c1",namespace="istio-ingress",job="istio-ingress",destination_service_namespace="serverless",destination_service_name="orders-00003",reporter="source",response_code="200",request_protocol="http",response_flags="-"}
    values: 0+600x20
  - series: istio_requests_total{cluster="c1",namespace="istio-ingress",job="istio-ingress",destination_service_namespace="serverless",destination_service_name="orders-00003",reporter="source",response_code="503",request_protocol="http",response_flags="UF"}
    values: 0+60x20
  - series: istio_requests_total{cluster="c1",namespace="istio-ingress",job="istio-ingress",destination_service_namespace="serverless",destination_service_name="orders-00003",reporter="source",response_code="0",request_protocol="http",response_flags="DC"}
    values: 0+5000x20
  - series: istio_requests_total{cluster="c1",namespace="istio-ingress",job="istio-ingress",destination_service_namespace="serverless",destination_service_name="orders-00003",reporter="source",response_code="503"}
    values: 0+600x20
  - series: istio_requests_total{cluster="c1",namespace="istio-ingress",job="knative-local-gateway",destination_service_namespace="serverless",destination_service_name="orders-00003",reporter="source",response_code="200",request_protocol="http",response_flags="-"}
    values: 0+600x20
  - series: istio_requests_total{cluster="c1",namespace="istio-ingress",job="knative-local-gateway",destination_service_namespace="serverless",destination_service_name="orders-00003",reporter="source",response_code="503",request_protocol="http",response_flags="UF"}
    values: 0+60x20
  alert_rule_test:
  - eval_time: 15m
    alertname: IstioGatewayHigh5xxErrorRate
    exp_alerts:
    - exp_labels:
        sourceType: metric
        severity: warning
        priority: P2
        notify_every: 2h
        tech_stack: istio
        signal: symptom
        category: ingress
        runbook: runbooks/ingress/istio-gateway.yaml
        query: |
          (
            sum by (cluster, namespace, job) (
              increase(istio_requests_total{job=~"istio-ingress.*",reporter="source",request_protocol=~"http|http2",response_code=~"5.."}[5m])
            )
            /
            sum by (cluster, namespace, job) (
              increase(istio_requests_total{job=~"istio-ingress.*",reporter="source",request_protocol=~"http|http2",response_code=~"[2-5].."}[5m])
            )
          ) > 0.05
          and on (cluster, namespace, job)
          sum by (cluster, namespace, job) (
            increase(istio_requests_total{job=~"istio-ingress.*",reporter="source",request_protocol=~"http|http2",response_code=~"5.."}[5m])
          ) >= 20
          and on (cluster, namespace, job)
          sum by (cluster, namespace, job) (
            increase(istio_requests_total{job=~"istio-ingress.*",reporter="source",request_protocol=~"http|http2",response_code=~"[2-5].."}[5m])
          ) >= 300
        cluster: c1
        namespace: istio-ingress
        job: istio-ingress
      exp_annotations:
        summary: Istio ingress gateway 5xx error rate is above 5%
        description: 9.091% of completed HTTP requests through Istio ingress gateway istio-ingress/istio-ingress in cluster c1 returned 5xx responses over the last 5 minutes, with at least 20 errors and 300 completed requests in the window, and the condition has held for 10 minutes. External users and API clients routed through this gateway are seeing failed requests, gateway errors, or timeouts. The errors may come from the backend applications, or be generated by Envoy itself when upstreams are unhealthy, have no ready endpoints, refuse connections, or exceed route timeouts (503 UF/UH/NR, 504 UT). Break the errors down by destination_service_name, response_code and response_flags to tell a single failing backend apart from a gateway-wide problem.
        runbook_url: https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/ingress/istio-gateway.yaml
  - eval_time: 15m
    alertname: IstioGatewayCritical5xxErrorRate
    exp_alerts: []
  - eval_time: 15m
    alertname: IstioGatewayDestinationHigh5xxErrorRate
    exp_alerts:
    - exp_labels:
        sourceType: metric
        severity: warning
        priority: P2
        notify_every: 2h
        tech_stack: istio
        signal: symptom
        category: ingress
        runbook: runbooks/ingress/istio-gateway.yaml
        query: |
          (
            sum by (cluster, namespace, job, destination_service_namespace, destination_service_name) (
              increase(istio_requests_total{job=~"istio-ingress.*",reporter="source",request_protocol=~"http|http2",destination_service_name=~".+",destination_service_name!="unknown",destination_service_namespace=~".+",destination_service_namespace!="unknown",response_code=~"5.."}[5m])
            )
            /
            sum by (cluster, namespace, job, destination_service_namespace, destination_service_name) (
              increase(istio_requests_total{job=~"istio-ingress.*",reporter="source",request_protocol=~"http|http2",destination_service_name=~".+",destination_service_name!="unknown",destination_service_namespace=~".+",destination_service_namespace!="unknown",response_code=~"[2-5].."}[5m])
            )
          ) > 0.05
          and on (cluster, namespace, job, destination_service_namespace, destination_service_name)
          sum by (cluster, namespace, job, destination_service_namespace, destination_service_name) (
            increase(istio_requests_total{job=~"istio-ingress.*",reporter="source",request_protocol=~"http|http2",destination_service_name=~".+",destination_service_name!="unknown",destination_service_namespace=~".+",destination_service_namespace!="unknown",response_code=~"5.."}[5m])
          ) >= 10
          and on (cluster, namespace, job, destination_service_namespace, destination_service_name)
          sum by (cluster, namespace, job, destination_service_namespace, destination_service_name) (
            increase(istio_requests_total{job=~"istio-ingress.*",reporter="source",request_protocol=~"http|http2",destination_service_name=~".+",destination_service_name!="unknown",destination_service_namespace=~".+",destination_service_namespace!="unknown",response_code=~"[2-5].."}[5m])
          ) >= 150
        cluster: c1
        namespace: istio-ingress
        job: istio-ingress
        destination_service_namespace: serverless
        destination_service_name: orders-00003
      exp_annotations:
        summary: Destination service behind the Istio ingress gateway has a 5xx error rate above 5%
        description: 9.091% of completed HTTP requests from Istio ingress gateway istio-ingress/istio-ingress to destination service serverless/orders-00003 in cluster c1 returned 5xx responses over the last 5 minutes, with at least 10 errors and 150 completed requests in the window, and the condition has held for 5 minutes. External requests to this service are failing while other routes through the gateway may be healthy. Check response_flags to separate application errors (flag '-') from Envoy-generated failures such as no healthy upstream (UH), connection failure (UF), upstream reset (UR) or route timeout (UT), then check the destination pods' readiness, restarts, logs and recent deployments. For Knative services, also check activator and revision scale-from-zero behaviour.
        runbook_url: https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/ingress/istio-gateway.yaml
  - eval_time: 15m
    alertname: IstioGatewayHigh4xxErrorRate
    exp_alerts: []
