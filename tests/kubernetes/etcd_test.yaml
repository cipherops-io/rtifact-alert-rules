# Unit tests for rules/metrics/kubernetes/etcd.yml
rule_files:
  - ../../rules/metrics/kubernetes/etcd.yml

evaluation_interval: 1m

tests:
  # ============================================================
  # EtcdNoLeader: positive — has_leader == 0 for > 1m
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'etcd_server_has_leader{instance="etcd-0:2379"}'
        values: '0 0 0'
    alert_rule_test:
      - eval_time: 2m
        alertname: EtcdNoLeader
        exp_alerts:
          - exp_labels:
              sourceType: metric
              severity: critical
              priority: P0
              tech_stack: etcd
              signal: symptom
              category: control-plane
              runbook: runbooks/kubernetes/etcd.yaml
              query: "etcd_server_has_leader == 0"
              instance: "etcd-0:2379"
            exp_annotations:
              summary: "etcd has no leader: cluster= env= svc="
              description: "etcd reports no active leader for >1m. Context: instance=etcd-0:2379, cluster=, env=, service=. Without a leader, control-plane writes are blocked and Kubernetes API behavior becomes critically degraded."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/kubernetes/etcd.yaml"

  # ============================================================
  # EtcdNoLeader: negative — has_leader == 1
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'etcd_server_has_leader{instance="etcd-0:2379"}'
        values: '1 1 1'
    alert_rule_test:
      - eval_time: 2m
        alertname: EtcdNoLeader
        exp_alerts: []

  # ============================================================
  # EtcdDBSizeHigh: positive — > 6GB for > 5m
  # EtcdDBSizeCritical: also fires above 7GB
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'etcd_mvcc_db_total_size_in_bytes{instance="etcd-0:2379"}'
        values: '7600000000 7600000000 7600000000 7600000000 7600000000 7600000000 7600000000'
    alert_rule_test:
      - eval_time: 6m
        alertname: EtcdDBSizeHigh
        exp_alerts:
          - exp_labels:
              sourceType: metric
              severity: warning
              priority: P2
              tech_stack: etcd
              signal: cause
              category: control-plane
              runbook: runbooks/kubernetes/etcd.yaml
              query: "etcd_mvcc_db_total_size_in_bytes > 6442450944"
              instance: "etcd-0:2379"
            exp_annotations:
              summary: "etcd DB size high: 7.078GiB instance=etcd-0:2379"
              description: "etcd database size is 7.078GiB (warning threshold: >6GiB) on instance=etcd-0:2379. Context: cluster=, env=, service=. Near-quota growth increases risk of write rejection; plan compaction and defragmentation."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/kubernetes/etcd.yaml"
      - eval_time: 6m
        alertname: EtcdDBSizeCritical
        exp_alerts:
          - exp_labels:
              sourceType: metric
              severity: critical
              priority: P1
              tech_stack: etcd
              signal: cause
              category: control-plane
              runbook: runbooks/kubernetes/etcd.yaml
              query: "etcd_mvcc_db_total_size_in_bytes > 7516192768"
              instance: "etcd-0:2379"
            exp_annotations:
              summary: "etcd DB size CRITICAL: 7.078GiB instance=etcd-0:2379"
              description: "etcd database size is 7.078GiB (critical threshold: >7GiB), dangerously close to the 8GiB backend quota. Context: cluster=, env=, service=. Immediate compaction/defrag is required to avoid write outages."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/kubernetes/etcd.yaml"

  # ============================================================
  # EtcdBackendQuotaExhausted: positive — db size >= quota for > 1m
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'etcd_mvcc_db_total_size_in_bytes{instance="etcd-0:2379"}'
        values: '8589934592 8589934592 8589934592'
      - series: 'etcd_server_quota_backend_bytes{instance="etcd-0:2379"}'
        values: '8589934592 8589934592 8589934592'
    alert_rule_test:
      - eval_time: 2m
        alertname: EtcdBackendQuotaExhausted
        exp_alerts:
          - exp_labels:
              sourceType: metric
              severity: critical
              priority: P0
              tech_stack: etcd
              signal: symptom
              category: control-plane
              runbook: runbooks/kubernetes/etcd.yaml
              query: "etcd_mvcc_db_total_size_in_bytes >= etcd_server_quota_backend_bytes"
              instance: "etcd-0:2379"
            exp_annotations:
              summary: "etcd quota exhausted: instance=etcd-0:2379 cluster= env="
              description: "etcd backend quota has been exhausted on instance=etcd-0:2379. Context: cluster=, env=, service=. New writes are rejected, causing severe Kubernetes API failures. Compact and defragment immediately, then verify etcd health and API recovery."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/kubernetes/etcd.yaml"
