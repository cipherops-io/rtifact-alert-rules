  # ============================================================
  - interval: 1m
    input_series:
      - series: 'chi_clickhouse_event_ReplicatedPartFailedFetches{chi="prod3",hostname="chi-prod3-cluster-0-0"}'
        values: '_ _ _ _ _ 1+0x40'
    alert_rule_test:
      - eval_time: 11m
        alertname: ClickHouseReplicatedPartFetchFailures
        exp_alerts:
          - exp_labels:
              sourceType: "metric"
              severity: "warning"
              priority: "P2"
              tech_stack: "clickhouse"
              signal: "cause"
              category: "data"
              runbook: "runbooks/databases/clickhouse.md"
              query: |
                increase(chi_clickhouse_event_ReplicatedPartFailedFetches[15m]) > 0
                or (chi_clickhouse_event_ReplicatedPartFailedFetches > 0 unless chi_clickhouse_event_ReplicatedPartFailedFetches offset 15m)
              chi: "prod3"
              hostname: "chi-prod3-cluster-0-0"
            exp_annotations:
              summary: "ClickHouse is failing to fetch parts from its replicas"
              description: "Host chi-prod3-cluster-0-0 (CHI prod3) failed 1 part fetch(es) in the last 15m. Every failed fetch is a part this replica still does not have, so it stays behind on those tables and its replication queue keeps retrying. Look for an unreachable or overloaded source replica, the interserver port being blocked, or a full disk on either side."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/clickhouse.md#clickhousereplicatedpartfetchfailures"

