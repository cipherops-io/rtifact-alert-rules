  # ============================================================
  # ClickHouseKeeperSessionUnstable: positive — three concurrent
  # Keeper sessions where a healthy server holds one.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'chi_clickhouse_metric_ZooKeeperSession{chi="prod3",hostname="chi-prod3-cluster-0-0"}'
        values: '3+0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: ClickHouseKeeperSessionUnstable
        exp_alerts:
          - exp_labels:
              sourceType: "metric"
              severity: "warning"
              priority: "P2"
              tech_stack: "clickhouse"
              signal: "cause"
              category: "data"
              runbook: "runbooks/databases/clickhouse.md"
              query: "chi_clickhouse_metric_ZooKeeperSession > 1"
              chi: "prod3"
              hostname: "chi-prod3-cluster-0-0"
            exp_annotations:
              summary: "ClickHouse holds more than one Keeper/ZooKeeper session"
              description: "Host chi-prod3-cluster-0-0 (CHI prod3) has held 3 concurrent Keeper/ZooKeeper sessions for 5 minutes. A healthy server holds exactly one; more than one means it is re-establishing sessions because the old ones expired, and reads through those sessions can see stale metadata. Sessions that keep expiring end with replicas going read-only."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/clickhouse.md#clickhousekeepersessionunstable"

  # ============================================================
  # ClickHouseKeeperSessionUnstable: negative — exactly one session.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'chi_clickhouse_metric_ZooKeeperSession{chi="prod3",hostname="chi-prod3-cluster-0-0"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: ClickHouseKeeperSessionUnstable
        exp_alerts: []

  # ============================================================
  # ClickHouseKeeperHardwareExceptions: positive — one connection-level
  # Keeper failure in the 10m window.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'chi_clickhouse_event_ZooKeeperHardwareExceptions{chi="prod3",hostname="chi-prod3-cluster-0-0"}'
        values: '0 1+0x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: ClickHouseKeeperHardwareExceptions
        exp_alerts:
          - exp_labels:
              sourceType: "metric"
              severity: "warning"
              priority: "P2"
              tech_stack: "clickhouse"
              signal: "cause"
              category: "data"
              runbook: "runbooks/databases/clickhouse.md"
              query: |
                increase(chi_clickhouse_event_ZooKeeperHardwareExceptions[10m]) > 0
                or (chi_clickhouse_event_ZooKeeperHardwareExceptions > 0 unless chi_clickhouse_event_ZooKeeperHardwareExceptions offset 10m)
              chi: "prod3"
              hostname: "chi-prod3-cluster-0-0"
            exp_annotations:
              summary: "ClickHouse cannot talk to Keeper/ZooKeeper reliably"
              description: "Host chi-prod3-cluster-0-0 (CHI prod3) hit 1 Keeper/ZooKeeper hardware exception(s) in the last 10m — connection loss or session timeout, not a logical error. Every replicated INSERT, merge assignment and ALTER needs Keeper, so while this continues writes stall and replicas drift towards read-only. Check the Keeper/ZooKeeper ensemble before treating this as a ClickHouse problem."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/clickhouse.md#clickhousekeeperhardwareexceptions"

  # ============================================================
  # ClickHouseKeeperHardwareExceptions: negative — Keeper is stable.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'chi_clickhouse_event_ZooKeeperHardwareExceptions{chi="prod3",hostname="chi-prod3-cluster-0-0"}'
        values: '0+0x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: ClickHouseKeeperHardwareExceptions
        exp_alerts: []

  # ============================================================
  # ClickHouseRejectedInserts: positive — one insert rejected with
  # 'Too many parts' inside the 10m window.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'chi_clickhouse_event_RejectedInserts{chi="prod3",hostname="chi-prod3-cluster-0-0"}'
        values: '0 1+0x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: ClickHouseRejectedInserts
        exp_alerts:
          - exp_labels:
              sourceType: "metric"
              severity: "critical"
              priority: "P1"
              tech_stack: "clickhouse"
              signal: "symptom"
              category: "data"
              runbook: "runbooks/databases/clickhouse.md"
              query: |
                increase(chi_clickhouse_event_RejectedInserts[10m]) > 0
                or (chi_clickhouse_event_RejectedInserts > 0 unless chi_clickhouse_event_RejectedInserts offset 10m)
              chi: "prod3"
              hostname: "chi-prod3-cluster-0-0"
            exp_annotations:
              summary: "ClickHouse is rejecting inserts"
              description: "Host chi-prod3-cluster-0-0 (CHI prod3) rejected 1 insert(s) in the last 10m with 'Too many parts'. These writes failed outright — the client either retries or loses the data. Merges are not keeping up with the insert rate on at least one table, usually because inserts arrive in many small batches or the background merge pool is saturated."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/clickhouse.md#clickhouserejectedinserts"

  # ============================================================
  # ClickHouseRejectedInserts: negative — nothing is being rejected.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'chi_clickhouse_event_RejectedInserts{chi="prod3",hostname="chi-prod3-cluster-0-0"}'
        values: '0+0x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: ClickHouseRejectedInserts
        exp_alerts: []

  # ============================================================
  # ClickHouseDelayedInserts: positive — inserts are throttled
  # continuously. The counter keeps climbing (1/min), giving
  # increase()==10 over the window.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'chi_clickhouse_event_DelayedInserts{chi="prod3",hostname="chi-prod3-cluster-0-0"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: ClickHouseDelayedInserts
        exp_alerts:
          - exp_labels:
              sourceType: "metric"
              severity: "warning"
              priority: "P2"
              tech_stack: "clickhouse"
              signal: "symptom"
              category: "data"
              runbook: "runbooks/databases/clickhouse.md"
              query: |
                increase(chi_clickhouse_event_DelayedInserts[10m]) > 0
                or (chi_clickhouse_event_DelayedInserts > 0 unless chi_clickhouse_event_DelayedInserts offset 10m)
              chi: "prod3"
              hostname: "chi-prod3-cluster-0-0"
            exp_annotations:
              summary: "ClickHouse is throttling inserts"
              description: "Host chi-prod3-cluster-0-0 (CHI prod3) delayed 10 insert(s) in the last 10m. ClickHouse throttles writers once a partition crosses parts_to_delay_insert, so producers are already seeing slower INSERTs and ingest lag builds up upstream. This is the stage before outright rejection — if the part count keeps climbing, ClickHouseRejectedInserts follows."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/clickhouse.md#clickhousedelayedinserts"

  # ============================================================
  # ClickHouseDelayedInserts: negative — no throttling.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'chi_clickhouse_event_DelayedInserts{chi="prod3",hostname="chi-prod3-cluster-0-0"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: ClickHouseDelayedInserts
        exp_alerts: []

  # ============================================================
  # ClickHouseMaxPartCountForPartition: positive — 250 active parts
  # in the busiest partition, above the threshold of 100.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'chi_clickhouse_metric_MaxPartCountForPartition{chi="prod3",hostname="chi-prod3-cluster-0-0"}'
        values: '250+0x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: ClickHouseMaxPartCountForPartition
        exp_alerts:
          - exp_labels:
              sourceType: "metric"
              severity: "warning"
              priority: "P2"
              tech_stack: "clickhouse"
              signal: "cause"
              category: "data"
              runbook: "runbooks/databases/clickhouse.md"
              query: "chi_clickhouse_metric_MaxPartCountForPartition > 100"
              chi: "prod3"
              hostname: "chi-prod3-cluster-0-0"
            exp_annotations:
              summary: "ClickHouse has too many parts in a single partition"
              description: "The busiest partition on host chi-prod3-cluster-0-0 (CHI prod3) holds 250 active parts (threshold 100). Merges are falling behind the insert rate. Every query over that partition has to open all of those parts, so reads get slower as the count grows, and once it reaches parts_to_delay_insert / parts_to_throw_insert the server starts throttling and then rejecting writes."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/clickhouse.md#clickhousemaxpartcountforpartition"

  # ============================================================
  # ClickHouseMaxPartCountForPartition: negative — merges are
  # keeping up.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'chi_clickhouse_metric_MaxPartCountForPartition{chi="prod3",hostname="chi-prod3-cluster-0-0"}'
        values: '20+0x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: ClickHouseMaxPartCountForPartition
        exp_alerts: []

  # ============================================================
  # ClickHouseDistributedFilesToInsertHigh: positive — 120 files
  # queued for shards, above the threshold of 50.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'chi_clickhouse_metric_DistributedFilesToInsert{chi="prod3",hostname="chi-prod3-cluster-0-0"}'
        values: '120+0x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: ClickHouseDistributedFilesToInsertHigh
        exp_alerts:
          - exp_labels:
              sourceType: "metric"
              severity: "warning"
              priority: "P2"
              tech_stack: "clickhouse"
              signal: "symptom"
              category: "data"
              runbook: "runbooks/databases/clickhouse.md"
              query: "chi_clickhouse_metric_DistributedFilesToInsert > 50"
              chi: "prod3"
              hostname: "chi-prod3-cluster-0-0"
            exp_annotations:
              summary: "ClickHouse distributed inserts are queueing on disk"
              description: "Host chi-prod3-cluster-0-0 (CHI prod3) has 120 pending files waiting to be sent to shards by Distributed tables (threshold 50). Rows already accepted from clients are sitting on local disk and are not queryable on their target shards yet, so reads return incomplete results and the backlog is lost if this host's volume is lost. Usual cause: one shard is down, slow, or rejecting writes."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/clickhouse.md#clickhousedistributedfilestoinserthigh"

  # ============================================================
  # ClickHouseDistributedFilesToInsertHigh: negative — the queue
  # drains as fast as it fills.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'chi_clickhouse_metric_DistributedFilesToInsert{chi="prod3",hostname="chi-prod3-cluster-0-0"}'
        values: '5+0x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: ClickHouseDistributedFilesToInsertHigh
        exp_alerts: []

  # ============================================================
  # ClickHouseSmallInsertBatches: positive — 300 inserts in 30m
  # carrying 500 rows each, under the 1000-row threshold.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'chi_clickhouse_event_InsertQuery{chi="prod3",hostname="chi-prod3-cluster-0-0"}'
        values: '0+10x40'
      - series: 'chi_clickhouse_event_InsertedRows{chi="prod3",hostname="chi-prod3-cluster-0-0"}'
        values: '0+5000x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: ClickHouseSmallInsertBatches
        exp_alerts:
          - exp_labels:
              sourceType: "metric"
              severity: "warning"
              priority: "P3"
              tech_stack: "clickhouse"
              signal: "cause"
              category: "data"
              runbook: "runbooks/databases/clickhouse.md"
              query: |
                increase(chi_clickhouse_event_InsertQuery[30m]) > 100
                and
                increase(chi_clickhouse_event_InsertedRows[30m]) / increase(chi_clickhouse_event_InsertQuery[30m]) < 1000
              chi: "prod3"
              hostname: "chi-prod3-cluster-0-0"
            exp_annotations:
              summary: "ClickHouse is being written to in very small batches"
              description: "Host chi-prod3-cluster-0-0 (CHI prod3) is averaging under 1000 rows per INSERT over the last 30m across 300 inserts. Every INSERT creates at least one part, so small batches generate parts far faster than merges can consume them — this is the root cause behind most ClickHouseMaxPartCountForPartition, ClickHouseDelayedInserts and ClickHouseRejectedInserts incidents. Batch on the client side or put async_insert in front of these writers."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/clickhouse.md#clickhousesmallinsertbatches"

  # ============================================================
  # ClickHouseSmallInsertBatches: negative — the same insert rate
  # but 5000 rows per insert.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'chi_clickhouse_event_InsertQuery{chi="prod3",hostname="chi-prod3-cluster-0-0"}'
        values: '0+10x40'
      - series: 'chi_clickhouse_event_InsertedRows{chi="prod3",hostname="chi-prod3-cluster-0-0"}'
        values: '0+50000x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: ClickHouseSmallInsertBatches
        exp_alerts: []

