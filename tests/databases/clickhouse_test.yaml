  # ============================================================
  # ClickHouseTooManyRunningQueries: positive — 120 queries minus 10
  # pending async inserts leaves 110 real queries, above 80.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'chi_clickhouse_metric_Query{chi="prod3",hostname="chi-prod3-cluster-0-0"}'
        values: '120+0x10'
      - series: 'chi_clickhouse_metric_PendingAsyncInsert{chi="prod3",hostname="chi-prod3-cluster-0-0"}'
        values: '10+0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: ClickHouseTooManyRunningQueries
        exp_alerts:
          - exp_labels:
              sourceType: "metric"
              severity: "warning"
              priority: "P2"
              tech_stack: "clickhouse"
              signal: "symptom"
              category: "data"
              runbook: "runbooks/databases/clickhouse.md"
              query: |
                ((chi_clickhouse_metric_Query - chi_clickhouse_metric_PendingAsyncInsert) or chi_clickhouse_metric_Query) > 80
              chi: "prod3"
              hostname: "chi-prod3-cluster-0-0"
            exp_annotations:
              summary: "ClickHouse is running too many concurrent queries"
              description: "Host chi-prod3-cluster-0-0 (CHI prod3) has been running 110 concurrent queries for 5 minutes (threshold 80). Queries are arriving faster than they complete, so latency rises for everyone on this host, memory pressure grows with each concurrent query, and once max_concurrent_queries is reached new queries are rejected outright."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/clickhouse.md#clickhousetoomanyrunningqueries"

  # ============================================================
  # ClickHouseTooManyRunningQueries: negative — 50 queries, 10 of
  # which are pending async inserts.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'chi_clickhouse_metric_Query{chi="prod3",hostname="chi-prod3-cluster-0-0"}'
        values: '50+0x10'
      - series: 'chi_clickhouse_metric_PendingAsyncInsert{chi="prod3",hostname="chi-prod3-cluster-0-0"}'
        values: '10+0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: ClickHouseTooManyRunningQueries
        exp_alerts: []

  # ============================================================
  # ClickHouseLongestRunningQuery: positive — a query has been
  # running for 15 minutes, past the 10m threshold.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'chi_clickhouse_metric_LongestRunningQuery{chi="prod3",hostname="chi-prod3-cluster-0-0"}'
        values: '900+0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: ClickHouseLongestRunningQuery
        exp_alerts:
          - exp_labels:
              sourceType: "metric"
              severity: "warning"
              priority: "P3"
              tech_stack: "clickhouse"
              signal: "cause"
              category: "data"
              runbook: "runbooks/databases/clickhouse.md"
              query: "chi_clickhouse_metric_LongestRunningQuery > 600"
              chi: "prod3"
              hostname: "chi-prod3-cluster-0-0"
            exp_annotations:
              summary: "A ClickHouse query has been running for too long"
              description: "The oldest query on host chi-prod3-cluster-0-0 (CHI prod3) has been running for 15m 0s (threshold 10m). It holds its memory and thread slots for as long as it runs, crowding out other queries, and a client that has already timed out will not consume the result. Usually a missing PREWHERE/partition filter, a runaway JOIN, or an unbounded ad-hoc query."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/clickhouse.md#clickhouselongestrunningquery"

  # ============================================================
  # ClickHouseLongestRunningQuery: negative — the oldest query is a
  # minute old.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'chi_clickhouse_metric_LongestRunningQuery{chi="prod3",hostname="chi-prod3-cluster-0-0"}'
        values: '60+0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: ClickHouseLongestRunningQuery
        exp_alerts: []

  # ============================================================
  # ClickHouseQueryPreempted: positive — two queries have been
  # preempted for the whole 10m grace.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'chi_clickhouse_metric_QueryPreempted{chi="prod3",hostname="chi-prod3-cluster-0-0"}'
        values: '2+0x15'
    alert_rule_test:
      - eval_time: 11m
        alertname: ClickHouseQueryPreempted
        exp_alerts:
          - exp_labels:
              sourceType: "metric"
              severity: "warning"
              priority: "P3"
              tech_stack: "clickhouse"
              signal: "symptom"
              category: "data"
              runbook: "runbooks/databases/clickhouse.md"
              query: "chi_clickhouse_metric_QueryPreempted > 0"
              chi: "prod3"
              hostname: "chi-prod3-cluster-0-0"
            exp_annotations:
              summary: "ClickHouse queries are being preempted"
              description: "2 query(s) on host chi-prod3-cluster-0-0 (CHI prod3) have been stopped and waiting for 10 minutes because higher-priority queries are running. Preempted queries make no progress while they wait, so low-priority workloads (reports, backfills) can stall indefinitely whenever the high-priority workload is busy. Either the priority settings are too aggressive or the host is simply oversubscribed."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/clickhouse.md#clickhousequerypreempted"

  # ============================================================
  # ClickHouseQueryPreempted: negative — nothing is preempted.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'chi_clickhouse_metric_QueryPreempted{chi="prod3",hostname="chi-prod3-cluster-0-0"}'
        values: '0+0x15'
    alert_rule_test:
      - eval_time: 11m
        alertname: ClickHouseQueryPreempted
        exp_alerts: []

  # ============================================================
  # ClickHouseTooManyConnections: positive — 60 HTTP + 50 native +
  # 5 MySQL connections sum to 115, above the threshold of 100.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'chi_clickhouse_metric_HTTPConnection{chi="prod3",hostname="chi-prod3-cluster-0-0"}'
        values: '60+0x15'
      - series: 'chi_clickhouse_metric_TCPConnection{chi="prod3",hostname="chi-prod3-cluster-0-0"}'
        values: '50+0x15'
      - series: 'chi_clickhouse_metric_MySQLConnection{chi="prod3",hostname="chi-prod3-cluster-0-0"}'
        values: '5+0x15'
    alert_rule_test:
      - eval_time: 11m
        alertname: ClickHouseTooManyConnections
        exp_alerts:
          - exp_labels:
              sourceType: "metric"
              severity: "warning"
              priority: "P3"
              tech_stack: "clickhouse"
              signal: "cause"
              category: "data"
              runbook: "runbooks/databases/clickhouse.md"
              query: |
                sum without (__name__) ({__name__=~"chi_clickhouse_metric_(HTTPConnection|TCPConnection|MySQLConnection|PostgreSQLConnection)"}) > 100
              chi: "prod3"
              hostname: "chi-prod3-cluster-0-0"
            exp_annotations:
              summary: "ClickHouse has too many client connections"
              description: "Host chi-prod3-cluster-0-0 (CHI prod3) has held 115 client connections (HTTP + native + MySQL + PostgreSQL) for 10 minutes, above the threshold of 100. Each connection costs a server thread and memory, and once max_connections is reached new clients are refused. A count that only grows usually means a client pool that opens connections without closing them, or clients retrying against a host whose queries are already slow."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/clickhouse.md#clickhousetoomanyconnections"

  # ============================================================
  # ClickHouseTooManyConnections: negative — the same protocols with
  # a normal connection count.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'chi_clickhouse_metric_HTTPConnection{chi="prod3",hostname="chi-prod3-cluster-0-0"}'
        values: '10+0x15'
      - series: 'chi_clickhouse_metric_TCPConnection{chi="prod3",hostname="chi-prod3-cluster-0-0"}'
        values: '5+0x15'
      - series: 'chi_clickhouse_metric_MySQLConnection{chi="prod3",hostname="chi-prod3-cluster-0-0"}'
        values: '1+0x15'
    alert_rule_test:
      - eval_time: 11m
        alertname: ClickHouseTooManyConnections
        exp_alerts: []

  # ============================================================
  # ClickHouseDiskSpaceLow: positive — 5GB free of 100GB is 5%,
  # under the 10% threshold.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'chi_clickhouse_metric_DiskFreeBytes{chi="prod3",hostname="chi-prod3-cluster-0-0",disk="default"}'
        values: '5000000000+0x15'
      - series: 'chi_clickhouse_metric_DiskTotalBytes{chi="prod3",hostname="chi-prod3-cluster-0-0",disk="default"}'
        values: '100000000000+0x15'
    alert_rule_test:
      - eval_time: 11m
        alertname: ClickHouseDiskSpaceLow
        exp_alerts:
          - exp_labels:
              sourceType: "metric"
              severity: "critical"
              priority: "P1"
              tech_stack: "clickhouse"
              signal: "cause"
              category: "storage"
              runbook: "runbooks/databases/clickhouse.md"
              query: "chi_clickhouse_metric_DiskFreeBytes / chi_clickhouse_metric_DiskTotalBytes < 0.1"
              chi: "prod3"
              hostname: "chi-prod3-cluster-0-0"
              disk: "default"
            exp_annotations:
              summary: "ClickHouse disk is nearly full"
              description: "Disk default on host chi-prod3-cluster-0-0 (CHI prod3) has only 5% free space left. ClickHouse needs free space to merge — a merge needs room for the whole output part before it can delete the inputs — so merges stop first, part counts climb, and inserts start failing. When the volume fills completely the server cannot write at all and replicas go read-only."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/clickhouse.md#clickhousediskspacelow"

  # ============================================================
  # ClickHouseDiskSpaceLow: negative — half the volume is free.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'chi_clickhouse_metric_DiskFreeBytes{chi="prod3",hostname="chi-prod3-cluster-0-0",disk="default"}'
        values: '50000000000+0x15'
      - series: 'chi_clickhouse_metric_DiskTotalBytes{chi="prod3",hostname="chi-prod3-cluster-0-0",disk="default"}'
        values: '100000000000+0x15'
    alert_rule_test:
      - eval_time: 11m
        alertname: ClickHouseDiskSpaceLow
        exp_alerts: []

  # ============================================================
  # ClickHouseDiskWillFillWithin24h: positive — 29GB of 100GB free,
  # dropping 100MB every 5 minutes. Extrapolating that 6h slope over
  # 24h lands well below zero.
  # ============================================================
  - interval: 5m
    input_series:
      - series: 'chi_clickhouse_metric_DiskFreeBytes{chi="prod3",hostname="chi-prod3-cluster-0-0",disk="default"}'
        values: '29000000000-100000000x100'
      - series: 'chi_clickhouse_metric_DiskTotalBytes{chi="prod3",hostname="chi-prod3-cluster-0-0",disk="default"}'
        values: '100000000000+0x100'
    alert_rule_test:
      - eval_time: 7h
        alertname: ClickHouseDiskWillFillWithin24h
        exp_alerts:
          - exp_labels:
              sourceType: "metric"
              severity: "warning"
              priority: "P2"
              tech_stack: "clickhouse"
              signal: "cause"
              category: "storage"
              runbook: "runbooks/databases/clickhouse.md"
              query: |
                predict_linear(chi_clickhouse_metric_DiskFreeBytes[6h], 24 * 3600) < 0
                and chi_clickhouse_metric_DiskFreeBytes / chi_clickhouse_metric_DiskTotalBytes < 0.3
              chi: "prod3"
              hostname: "chi-prod3-cluster-0-0"
              disk: "default"
            exp_annotations:
              summary: "ClickHouse disk will be full within 24 hours"
              description: "Disk default on host chi-prod3-cluster-0-0 (CHI prod3) is under 30% free and, at the rate it has been filling over the last 6 hours, will be full within 24 hours. Act while there is still headroom: a PVC resize needs free space to complete, and once the disk is full merges stop and inserts fail. The 6h trend also catches a retention policy that has silently stopped deleting old partitions."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/clickhouse.md#clickhousediskwillfillwithin24h"

  # ============================================================
  # ClickHouseDiskWillFillWithin24h: negative — the same 29% free
  # but flat, so the 24h prediction stays positive.
  # ============================================================
  - interval: 5m
    input_series:
      - series: 'chi_clickhouse_metric_DiskFreeBytes{chi="prod3",hostname="chi-prod3-cluster-0-0",disk="default"}'
        values: '29000000000+0x100'
      - series: 'chi_clickhouse_metric_DiskTotalBytes{chi="prod3",hostname="chi-prod3-cluster-0-0",disk="default"}'
        values: '100000000000+0x100'
    alert_rule_test:
      - eval_time: 7h
        alertname: ClickHouseDiskWillFillWithin24h
        exp_alerts: []

  # ============================================================
  # ClickHouseDetachedPartsPresent: positive — three parts detached
