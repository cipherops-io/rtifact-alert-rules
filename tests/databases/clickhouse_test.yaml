  # ============================================================
  - interval: 1m
    input_series:
      - series: 'chi_clickhouse_metric_DetachedParts{chi="prod3",hostname="chi-prod3-cluster-0-0",database="analytics",table="events",disk="default",reason="detached_by_user"}'
        values: '5+0x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: ClickHouseDetachedPartsPresent
        exp_alerts: []

