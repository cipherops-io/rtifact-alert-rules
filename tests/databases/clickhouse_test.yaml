  #             runbook: "runbooks/databases/clickhouse.md"
  #             query: |
  #               increase(chi_clickhouse_event_DataAfterMergeDiffersFromReplica[15m]) > 0
  #               or (chi_clickhouse_event_DataAfterMergeDiffersFromReplica > 0 unless chi_clickhouse_event_DataAfterMergeDiffersFromReplica offset 15m)
  #             chi: "prod3"
  #             hostname: "chi-prod3-cluster-0-0"
  #           exp_annotations:
  #             summary: "ClickHouse merge result differs between replicas"
  #             description: "Host chi-prod3-cluster-0-0 (CHI prod3) merged data 1 time(s) in the last 15m and got a different result than its replica, so it discarded its own result and fetched the other copy. The cluster self-heals, but the divergence itself is the warning: replicas running different ClickHouse versions, non-deterministic expressions in the table's ORDER BY/materialized columns, or silent storage corruption on one host."
  #             runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/clickhouse.md#clickhousedataaftermergediffersfromreplica"

  # # ============================================================
  # # ClickHouseDataAfterMergeDiffersFromReplica: negative — merges
  # # agree across replicas.
  # # ============================================================
  # - interval: 1m
  #   input_series:
  #     - series: 'chi_clickhouse_event_DataAfterMergeDiffersFromReplica{chi="prod3",hostname="chi-prod3-cluster-0-0"}'
