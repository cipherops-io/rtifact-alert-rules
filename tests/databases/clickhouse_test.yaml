  # ============================================================
  # ClickHouseNetworkErrors: positive — one network error inside the
  # 10m window. NETWORK_ERROR comes from system.errors; the DNSError
  # half of the or is absent here.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'chi_clickhouse_metric_SystemErrors_NETWORK_ERROR{chi="prod3",hostname="chi-prod3-cluster-0-0"}'
        values: '0 1+0x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: ClickHouseNetworkErrors
        exp_alerts:
          - exp_labels:
              sourceType: "metric"
              severity: "warning"
              priority: "P3"
              tech_stack: "clickhouse"
              signal: "cause"
              category: "network"
              runbook: "runbooks/databases/clickhouse.md"
              query: |
                increase(chi_clickhouse_metric_SystemErrors_NETWORK_ERROR[10m]) > 0 or increase(chi_clickhouse_event_DNSError[10m]) > 0
                or (chi_clickhouse_metric_SystemErrors_NETWORK_ERROR > 0 unless chi_clickhouse_metric_SystemErrors_NETWORK_ERROR offset 10m)
                or (chi_clickhouse_event_DNSError > 0 unless chi_clickhouse_event_DNSError offset 10m)
              chi: "prod3"
              hostname: "chi-prod3-cluster-0-0"
            exp_annotations:
              summary: "ClickHouse is hitting network or DNS errors"
              description: "Host chi-prod3-cluster-0-0 (CHI prod3) recorded 1 network or DNS error(s) in the last 10m — NETWORK_ERROR in system.errors, or DNSError in system.events. ClickHouse resolves replica and shard hostnames through cluster DNS on every new connection, so DNS or network flakiness shows up as failed fetches, failed distributed queries and dropped Keeper sessions before it shows up as anything else."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/clickhouse.md#clickhousenetworkerrors"

  # ============================================================
  # ClickHouseNetworkErrors: negative — no network or DNS errors.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'chi_clickhouse_metric_SystemErrors_NETWORK_ERROR{chi="prod3",hostname="chi-prod3-cluster-0-0"}'
        values: '0+0x10'
      - series: 'chi_clickhouse_event_DNSError{chi="prod3",hostname="chi-prod3-cluster-0-0"}'
        values: '0+0x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: ClickHouseNetworkErrors
        exp_alerts: []

