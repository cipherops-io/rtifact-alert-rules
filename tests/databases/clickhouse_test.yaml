# Unit tests for rules/metrics/databases/clickhouse.yml (clickhouse-operator.rules group)
#
# Run with:
#   promtool test rules tests/databases/clickhouse_test.yaml
#
# Format reference:
#   https://prometheus.io/docs/prometheus/latest/configuration/unit_testing_rules/
#
# NOTE ON EVAL TIMES: each positive case is evaluated at exactly the width of the
# rule's range selector (t=15m for [15m], t=30m for [30m], t=60m for [1h]) with
# samples starting at t=0. That puts the first and last sample exactly on the
# window boundaries, so increase() does no extrapolation and $value is an exact
# integer. Evaluating at other times yields fractional values that make the
# expected annotations unreadable.

rule_files:
  - ../../rules/metrics/databases/clickhouse.yml

evaluation_interval: 1m

tests:
  # ============================================================
  # ClickHouseOperatorMetricsAbsent: positive — the operator's own
  # metrics never appear, so absent() holds past the 10m grace.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'up{job="clickhouse-operator"}'
        values: '1+0x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: ClickHouseOperatorMetricsAbsent
        exp_alerts:
          - exp_labels:
              sourceType: metric
              severity: warning
              priority: P2
              tech_stack: clickhouse
              signal: cause
              category: data
              runbook: runbooks/databases/clickhouse.md
              query: absent(clickhouse_operator_chi)
            exp_annotations:
              summary: "clickhouse-operator is exporting no metrics"
              description: "No clickhouse_operator_chi series has been scraped for 10 minutes. Either the clickhouse-operator deployment is down or its metrics endpoint is unreachable. While this is firing, every other ClickHouse operator alert is blind: reconcile failures, aborted reconciles, and host restarts will go undetected, and CHI spec changes may not be applied to the cluster at all."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/clickhouse.md#clickhouseoperatormetricsabsent"

  # ============================================================
  # ClickHouseOperatorMetricsAbsent: negative — the operator is
  # exporting normally.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'clickhouse_operator_chi{namespace="clickhouse",chi="prod3"}'
        values: '1+0x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: ClickHouseOperatorMetricsAbsent
        exp_alerts: []

  # ============================================================
  # ClickHouseOperatorHostReconcileErrors: positive — one host
  # reconcile error inside the 15m window.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'clickhouse_operator_host_reconciles_errors{namespace="clickhouse",chi="prod3"}'
        values: '0 1+0x15'
    alert_rule_test:
      - eval_time: 15m
        alertname: ClickHouseOperatorHostReconcileErrors
        exp_alerts:
          - exp_labels:
              sourceType: metric
              severity: warning
              priority: P2
              tech_stack: clickhouse
              signal: cause
              category: data
              runbook: runbooks/databases/clickhouse.md
              query: increase(clickhouse_operator_host_reconciles_errors[15m]) > 0
              chi: "prod3"
              namespace: "clickhouse"
            exp_annotations:
              summary: "clickhouse-operator is failing to reconcile a ClickHouse host"
              description: "clickhouse-operator recorded 1 host reconcile error(s) in the last 15m for CHI prod3 in namespace clickhouse. The desired StatefulSet/ConfigMap/service state is not being applied to at least one host, so recent CHI changes (image, settings, resources, topology) may be partially or entirely unapplied while the cluster still reports as running."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/clickhouse.md#clickhouseoperatorhostreconcileerrors"

  # ============================================================
  # ClickHouseOperatorHostReconcileErrors: negative — the counter
  # exists but has never incremented.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'clickhouse_operator_host_reconciles_errors{namespace="clickhouse",chi="prod3"}'
        values: '0+0x15'
    alert_rule_test:
      - eval_time: 15m
        alertname: ClickHouseOperatorHostReconcileErrors
        exp_alerts: []

  # ============================================================
  # ClickHouseOperatorHostReconcileErrorsSustained: positive —
  # 6 errors in the hour, at or above the >= 5 threshold.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'clickhouse_operator_host_reconciles_errors{namespace="clickhouse",chi="prod3"}'
        values: '0 1 2 3 4 5 6+0x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: ClickHouseOperatorHostReconcileErrorsSustained
        exp_alerts:
          - exp_labels:
              sourceType: metric
              severity: critical
              priority: P1
              tech_stack: clickhouse
              signal: cause
              category: data
              runbook: runbooks/databases/clickhouse.md
              query: increase(clickhouse_operator_host_reconciles_errors[1h]) >= 5
              chi: "prod3"
              namespace: "clickhouse"
            exp_annotations:
              summary: "clickhouse-operator cannot converge a ClickHouse host"
              description: "clickhouse-operator recorded 6 host reconcile errors in the last hour for CHI prod3 in namespace clickhouse — it is retrying and failing, not making progress. The cluster is stuck between its current and desired state; a rolling upgrade may be halted midway, leaving hosts on mixed configurations or mixed versions."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/clickhouse.md#clickhouseoperatorhostreconcileerrorssustained"

  # ============================================================
  # ClickHouseOperatorHostReconcileErrorsSustained: negative —
  # 4 errors in the hour stays under the threshold (the transient
  # ClickHouseOperatorHostReconcileErrors warning covers this).
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'clickhouse_operator_host_reconciles_errors{namespace="clickhouse",chi="prod3"}'
        values: '0 1 2 3 4+0x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: ClickHouseOperatorHostReconcileErrorsSustained
        exp_alerts: []

  # ============================================================
  # ClickHouseOperatorCHIReconcileAborted: positive — one aborted
  # CHI reconcile.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'clickhouse_operator_chi_reconciles_aborted{namespace="clickhouse",chi="prod3"}'
        values: '0 1+0x15'
    alert_rule_test:
      - eval_time: 15m
        alertname: ClickHouseOperatorCHIReconcileAborted
        exp_alerts:
          - exp_labels:
              sourceType: metric
              severity: warning
              priority: P2
              tech_stack: clickhouse
              signal: cause
              category: data
              runbook: runbooks/databases/clickhouse.md
              query: increase(clickhouse_operator_chi_reconciles_aborted[15m]) > 0
              chi: "prod3"
              namespace: "clickhouse"
            exp_annotations:
              summary: "A ClickHouseInstallation reconcile was aborted"
              description: "1 CHI reconcile(s) were aborted in the last 15m for CHI prod3 in namespace clickhouse. An aborted reconcile never reaches completion, so the CHI spec on the cluster is not what is committed in Git/the CRD. Common causes: the CHI was edited again mid-reconcile, the operator restarted, or a host became unreachable partway through the rollout."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/clickhouse.md#clickhouseoperatorchireconcileaborted"

  # ============================================================
  # ClickHouseOperatorCHIReconcileAborted: negative — no aborts.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'clickhouse_operator_chi_reconciles_aborted{namespace="clickhouse",chi="prod3"}'
        values: '0+0x15'
    alert_rule_test:
      - eval_time: 15m
        alertname: ClickHouseOperatorCHIReconcileAborted
        exp_alerts: []

  # ============================================================
  # ClickHouseOperatorCHIReconcileStuck: positive — a reconcile
  # started and never completed or aborted.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'clickhouse_operator_chi_reconciles_started{namespace="clickhouse",chi="prod3"}'
        values: '0 1+0x60'
      - series: 'clickhouse_operator_chi_reconciles_completed{namespace="clickhouse",chi="prod3"}'
        values: '0+0x60'
      - series: 'clickhouse_operator_chi_reconciles_aborted{namespace="clickhouse",chi="prod3"}'
        values: '0+0x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: ClickHouseOperatorCHIReconcileStuck
        exp_alerts:
          - exp_labels:
              sourceType: metric
              severity: warning
              priority: P2
              tech_stack: clickhouse
              signal: cause
              category: data
              runbook: runbooks/databases/clickhouse.md
              query: |
                sum by (namespace, chi) (increase(clickhouse_operator_chi_reconciles_started[1h]))
                - sum by (namespace, chi) (increase(clickhouse_operator_chi_reconciles_completed[1h]))
                - sum by (namespace, chi) (increase(clickhouse_operator_chi_reconciles_aborted[1h]))
                > 0
              chi: "prod3"
              namespace: "clickhouse"
            exp_annotations:
              summary: "A ClickHouseInstallation reconcile started but never finished"
              description: "1 CHI reconcile(s) for prod3 in namespace clickhouse started in the last hour and have neither completed nor aborted — the rollout is hung. Hosts may be sitting partially updated, and subsequent CHI edits will queue behind this one. A healthy reconcile finishes in seconds to a few minutes; anything pending for over 15 minutes is stuck."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/clickhouse.md#clickhouseoperatorchireconcilestuck"

  # ============================================================
  # ClickHouseOperatorCHIReconcileStuck: negative — the reconcile
  # that started also completed.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'clickhouse_operator_chi_reconciles_started{namespace="clickhouse",chi="prod3"}'
        values: '0 1+0x60'
      - series: 'clickhouse_operator_chi_reconciles_completed{namespace="clickhouse",chi="prod3"}'
        values: '0 1+0x60'
      - series: 'clickhouse_operator_chi_reconciles_aborted{namespace="clickhouse",chi="prod3"}'
        values: '0+0x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: ClickHouseOperatorCHIReconcileStuck
        exp_alerts: []

  # ============================================================
  # ClickHouseOperatorCHIReconcileStuck: negative — the reconcile
  # aborted rather than hanging (ClickHouseOperatorCHIReconcileAborted
  # owns that case; this rule must not double-fire on it).
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'clickhouse_operator_chi_reconciles_started{namespace="clickhouse",chi="prod3"}'
        values: '0 1+0x60'
      - series: 'clickhouse_operator_chi_reconciles_completed{namespace="clickhouse",chi="prod3"}'
        values: '0+0x60'
      - series: 'clickhouse_operator_chi_reconciles_aborted{namespace="clickhouse",chi="prod3"}'
        values: '0 1+0x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: ClickHouseOperatorCHIReconcileStuck
        exp_alerts: []

  # ============================================================
  # ClickHouseOperatorHostReconcileSlow: positive — one reconcile
  # took 900s, averaging above the 600s threshold.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'clickhouse_operator_host_reconciles_timings_sum{namespace="clickhouse",chi="prod3"}'
        values: '0 900+0x60'
      - series: 'clickhouse_operator_host_reconciles_timings_count{namespace="clickhouse",chi="prod3"}'
        values: '0 1+0x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: ClickHouseOperatorHostReconcileSlow
        exp_alerts:
          - exp_labels:
              sourceType: metric
              severity: warning
              priority: P3
              tech_stack: clickhouse
              signal: cause
              category: data
              runbook: runbooks/databases/clickhouse.md
              query: |
                increase(clickhouse_operator_host_reconciles_timings_sum[1h])
                / increase(clickhouse_operator_host_reconciles_timings_count[1h])
                > 600
              chi: "prod3"
              namespace: "clickhouse"
            exp_annotations:
              summary: "clickhouse-operator host reconciles are taking too long"
              description: "Host reconciles for CHI prod3 in namespace clickhouse are averaging 15m 0s over the last hour (threshold 10m). Slow reconciles stretch rolling upgrades far beyond their maintenance window and usually mean hosts are slow to become ready — long ClickHouse startup, replica resync after restart, image pull delays, or pods stuck Pending on scheduling/PVC binding."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/clickhouse.md#clickhouseoperatorhostreconcileslow"

  # ============================================================
  # ClickHouseOperatorHostReconcileSlow: negative — a 300s
  # reconcile is well under the threshold.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'clickhouse_operator_host_reconciles_timings_sum{namespace="clickhouse",chi="prod3"}'
        values: '0 300+0x60'
      - series: 'clickhouse_operator_host_reconciles_timings_count{namespace="clickhouse",chi="prod3"}'
        values: '0 1+0x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: ClickHouseOperatorHostReconcileSlow
        exp_alerts: []

  # ============================================================
  # ClickHouseOperatorHostRestartsHigh: positive — 3 restarts in
  # the hour, above the > 2 rolling-upgrade allowance.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'clickhouse_operator_host_reconciles_restarts{namespace="clickhouse",chi="prod3"}'
        values: '0 1 2 3+0x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: ClickHouseOperatorHostRestartsHigh
        exp_alerts:
          - exp_labels:
              sourceType: metric
              severity: warning
              priority: P2
              tech_stack: clickhouse
              signal: symptom
              category: data
              runbook: runbooks/databases/clickhouse.md
              query: increase(clickhouse_operator_host_reconciles_restarts[1h]) > 2
              chi: "prod3"
              namespace: "clickhouse"
            exp_annotations:
              summary: "clickhouse-operator is repeatedly restarting a ClickHouse host"
              description: "clickhouse-operator restarted hosts of CHI prod3 in namespace clickhouse 3 times in the last hour — more than a planned rolling upgrade would need. Every restart drops in-flight queries, breaks client connections, and forces the replica to resync on startup. Repeated restarts point at a crash-looping ClickHouse container, a failing readiness probe, or a reconcile loop that keeps deciding the host needs to be recreated."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/clickhouse.md#clickhouseoperatorhostrestartshigh"

  # ============================================================
  # ClickHouseOperatorHostRestartsHigh: negative — 2 restarts is
  # a normal rolling upgrade and must stay quiet.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'clickhouse_operator_host_reconciles_restarts{namespace="clickhouse",chi="prod3"}'
        values: '0 1 2+0x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: ClickHouseOperatorHostRestartsHigh
        exp_alerts: []

  # ============================================================
  # ClickHouseOperatorPodsDisappearing: positive — 2 deletes but
  # only 1 add, so the cluster is a pod short.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'clickhouse_operator_pod_delete_events{namespace="clickhouse",chi="prod3"}'
        values: '0 1 2+0x30'
      - series: 'clickhouse_operator_pod_add_events{namespace="clickhouse",chi="prod3"}'
        values: '0 1+0x31'
    alert_rule_test:
      - eval_time: 30m
        alertname: ClickHouseOperatorPodsDisappearing
        exp_alerts:
          - exp_labels:
              sourceType: metric
              severity: warning
              priority: P2
              tech_stack: clickhouse
              signal: symptom
              category: data
              runbook: runbooks/databases/clickhouse.md
              query: |
                sum by (namespace, chi) (increase(clickhouse_operator_pod_delete_events[30m]))
                - sum by (namespace, chi) (increase(clickhouse_operator_pod_add_events[30m]))
                > 0
              chi: "prod3"
              namespace: "clickhouse"
            exp_annotations:
              summary: "ClickHouse pods are being deleted and not coming back"
              description: "CHI prod3 in namespace clickhouse saw 1 more pod delete than pod add event(s) over the last 30m — the cluster is losing hosts rather than cycling them. During a healthy rolling restart deletes and adds balance out within minutes. A sustained deficit means pods are being evicted, descheduled, or failing to be recreated, which reduces replica count and query capacity."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/clickhouse.md#clickhouseoperatorpodsdisappearing"

  # ============================================================
  # ClickHouseOperatorPodsDisappearing: negative — a rolling
  # restart, where every delete is matched by an add.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'clickhouse_operator_pod_delete_events{namespace="clickhouse",chi="prod3"}'
        values: '0 1 2+0x30'
      - series: 'clickhouse_operator_pod_add_events{namespace="clickhouse",chi="prod3"}'
        values: '0 1 2+0x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: ClickHouseOperatorPodsDisappearing
        exp_alerts: []

  # ##########################################################################
  # clickhouse-server.rules — the ClickHouse servers themselves, via the
  # chi_clickhouse_* metrics exported by the operator's metrics-exporter.
  #
  # Same eval-time convention as above: counter cases are evaluated at exactly
  # the width of the rule's range selector so increase() does no extrapolation
  # and $value is an exact integer.
  # ##########################################################################

  # ============================================================
  # ClickHouseServerDown: positive — the exporter cannot read
  # system.metrics from the host, past the 2m grace. Dotted fetch_type,
  # as written by operator 0.25.x and earlier.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'chi_clickhouse_metric_fetch_errors{chi="prod3",hostname="chi-prod3-cluster-0-0",fetch_type="system.metrics"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: ClickHouseServerDown
        exp_alerts:
          - exp_labels:
              sourceType: "metric"
              severity: "critical"
              priority: "P1"
              tech_stack: "clickhouse"
              signal: "symptom"
              category: "data"
              runbook: "runbooks/databases/clickhouse.md"
              query: "chi_clickhouse_metric_fetch_errors{fetch_type=~\"system[._ ]metrics\"} > 0"
              chi: "prod3"
              hostname: "chi-prod3-cluster-0-0"
              fetch_type: "system.metrics"
            exp_annotations:
              summary: "ClickHouse server is not answering queries"
              description: "The metrics-exporter has been unable to read system.metrics from ClickHouse host chi-prod3-cluster-0-0 (CHI prod3) for over 2 minutes — the server is not answering queries on its native port. Clients routed to this host get connection errors or timeouts. If this is the only live replica of its shard, that shard's data cannot be read or written, and distributed queries that touch it fail."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/clickhouse.md#clickhouseserverdown"

  # ============================================================
  # ClickHouseServerDown: positive — same failure, underscored
  # fetch_type as written by operator 0.27.x and master. Both spellings
  # must match the same rule.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'chi_clickhouse_metric_fetch_errors{chi="prod3",hostname="chi-prod3-cluster-0-0",fetch_type="system_metrics"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: ClickHouseServerDown
        exp_alerts:
          - exp_labels:
              sourceType: "metric"
              severity: "critical"
              priority: "P1"
              tech_stack: "clickhouse"
              signal: "symptom"
              category: "data"
              runbook: "runbooks/databases/clickhouse.md"
              query: "chi_clickhouse_metric_fetch_errors{fetch_type=~\"system[._ ]metrics\"} > 0"
              chi: "prod3"
              hostname: "chi-prod3-cluster-0-0"
              fetch_type: "system_metrics"
            exp_annotations:
              summary: "ClickHouse server is not answering queries"
              description: "The metrics-exporter has been unable to read system.metrics from ClickHouse host chi-prod3-cluster-0-0 (CHI prod3) for over 2 minutes — the server is not answering queries on its native port. Clients routed to this host get connection errors or timeouts. If this is the only live replica of its shard, that shard's data cannot be read or written, and distributed queries that touch it fail."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/clickhouse.md#clickhouseserverdown"

  # ============================================================
  # ClickHouseServerDown: negative — fetches are succeeding.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'chi_clickhouse_metric_fetch_errors{chi="prod3",hostname="chi-prod3-cluster-0-0",fetch_type="system.metrics"}'
        values: '0+0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: ClickHouseServerDown
        exp_alerts: []

  # ============================================================
  # ClickHouseServerMetricsAbsent: positive — no chi_clickhouse_*
  # series at all for longer than the 15m grace.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'up{job="clickhouse-operator"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: ClickHouseServerMetricsAbsent
        exp_alerts:
          - exp_labels:
              sourceType: "metric"
              severity: "warning"
              priority: "P2"
              tech_stack: "clickhouse"
              signal: "cause"
              category: "data"
              runbook: "runbooks/databases/clickhouse.md"
              query: "absent(chi_clickhouse_metric_Uptime)"
            exp_annotations:
              summary: "No ClickHouse server metrics are being scraped"
              description: "No chi_clickhouse_metric_* series has been scraped for 15 minutes. Either the metrics-exporter container is down, it cannot reach any ClickHouse host, or the scrape config no longer matches its endpoint. While this is firing every ClickHouse server alert is blind: a readonly replica, rejected inserts, replication lag, or a filling disk will all go undetected."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/clickhouse.md#clickhouseservermetricsabsent"

  # ============================================================
  # ClickHouseServerMetricsAbsent: negative — the exporter is
  # scraping ClickHouse normally.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'chi_clickhouse_metric_Uptime{chi="prod3",hostname="chi-prod3-cluster-0-0"}'
        values: '86400+60x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: ClickHouseServerMetricsAbsent
        exp_alerts: []

  # ============================================================
  # ClickHouseMetricsFetchErrors: positive — system.metrics still
  # works but the system.disks fetch keeps failing (dotted spelling).
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'chi_clickhouse_metric_fetch_errors{chi="prod3",hostname="chi-prod3-cluster-0-0",fetch_type="system.disks"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: ClickHouseMetricsFetchErrors
        exp_alerts:
          - exp_labels:
              sourceType: "metric"
              severity: "warning"
              priority: "P3"
              tech_stack: "clickhouse"
              signal: "cause"
              category: "data"
              runbook: "runbooks/databases/clickhouse.md"
              query: "chi_clickhouse_metric_fetch_errors{fetch_type!~\"system[._ ]metrics\"} > 0"
              chi: "prod3"
              hostname: "chi-prod3-cluster-0-0"
              fetch_type: "system.disks"
            exp_annotations:
              summary: "metrics-exporter cannot fetch part of the ClickHouse metric set"
              description: "The metrics-exporter has been failing the system.disks fetch on host chi-prod3-cluster-0-0 (CHI prod3) for over 15 minutes, while system.metrics still succeeds — so the server is up but one metric family is missing. Whichever alerts depend on that family (parts, mutations, disks, detached parts or replicas) are blind until it recovers. Common causes: the exporter user lacks SELECT on that system table, or the query times out on a cluster with very many tables."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/clickhouse.md#clickhousemetricsfetcherrors"

  # ============================================================
  # ClickHouseMetricsFetchErrors: positive — 'system parts' is a
  # distinct fetch from 'system.metrics'; the space-separated spelling
  # must not be swallowed by the system[._ ]metrics matcher.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'chi_clickhouse_metric_fetch_errors{chi="prod3",hostname="chi-prod3-cluster-0-0",fetch_type="system parts"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: ClickHouseMetricsFetchErrors
        exp_alerts:
          - exp_labels:
              sourceType: "metric"
              severity: "warning"
              priority: "P3"
              tech_stack: "clickhouse"
              signal: "cause"
              category: "data"
              runbook: "runbooks/databases/clickhouse.md"
              query: "chi_clickhouse_metric_fetch_errors{fetch_type!~\"system[._ ]metrics\"} > 0"
              chi: "prod3"
              hostname: "chi-prod3-cluster-0-0"
              fetch_type: "system parts"
            exp_annotations:
              summary: "metrics-exporter cannot fetch part of the ClickHouse metric set"
              description: "The metrics-exporter has been failing the system parts fetch on host chi-prod3-cluster-0-0 (CHI prod3) for over 15 minutes, while system.metrics still succeeds — so the server is up but one metric family is missing. Whichever alerts depend on that family (parts, mutations, disks, detached parts or replicas) are blind until it recovers. Common causes: the exporter user lacks SELECT on that system table, or the query times out on a cluster with very many tables."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/clickhouse.md#clickhousemetricsfetcherrors"

  # ============================================================
  # ClickHouseMetricsFetchErrors: negative — a failing system.metrics
  # fetch belongs to ClickHouseServerDown, not here; this rule must
  # stay silent for it.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'chi_clickhouse_metric_fetch_errors{chi="prod3",hostname="chi-prod3-cluster-0-0",fetch_type="system.metrics"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: ClickHouseMetricsFetchErrors
        exp_alerts: []

  # ============================================================
  # ClickHouseMetricsFetchErrors: negative — every non-metrics fetch
  # is succeeding.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'chi_clickhouse_metric_fetch_errors{chi="prod3",hostname="chi-prod3-cluster-0-0",fetch_type="system.disks"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: ClickHouseMetricsFetchErrors
        exp_alerts: []

  # ============================================================
  # ClickHouseServerRestarted: positive — uptime is 3 minutes and
  # climbing, so the server came up very recently.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'chi_clickhouse_metric_Uptime{chi="prod3",hostname="chi-prod3-cluster-0-0"}'
        values: '120+60x5'
    alert_rule_test:
      - eval_time: 1m
        alertname: ClickHouseServerRestarted
        exp_alerts:
          - exp_labels:
              sourceType: "metric"
              severity: "info"
              priority: "P3"
              tech_stack: "clickhouse"
              signal: "symptom"
              category: "data"
              runbook: "runbooks/databases/clickhouse.md"
              query: "chi_clickhouse_metric_Uptime < 300"
              chi: "prod3"
              hostname: "chi-prod3-cluster-0-0"
            exp_annotations:
              summary: "ClickHouse server restarted recently"
              description: "ClickHouse host chi-prod3-cluster-0-0 (CHI prod3) has been up for only 3m 0s. A restart drops every in-flight query and open connection, and the replica has to reload its parts and catch up on its replication queue before it serves complete results. Expect this during a planned rolling upgrade; outside one, check whether the container was OOMKilled or crashed."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/clickhouse.md#clickhouseserverrestarted"

  # ============================================================
  # ClickHouseServerRestarted: negative — the server has been up
  # for a day.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'chi_clickhouse_metric_Uptime{chi="prod3",hostname="chi-prod3-cluster-0-0"}'
        values: '86400+60x5'
    alert_rule_test:
      - eval_time: 1m
        alertname: ClickHouseServerRestarted
        exp_alerts: []

  # ============================================================
  # ClickHouseReadonlyReplica: positive — two replicated tables are
  # read-only for longer than the 5m grace.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'chi_clickhouse_metric_ReadonlyReplica{chi="prod3",hostname="chi-prod3-cluster-0-0"}'
        values: '2+0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: ClickHouseReadonlyReplica
        exp_alerts:
          - exp_labels:
              sourceType: "metric"
              severity: "critical"
              priority: "P1"
              tech_stack: "clickhouse"
              signal: "symptom"
              category: "data"
              runbook: "runbooks/databases/clickhouse.md"
              query: "chi_clickhouse_metric_ReadonlyReplica > 0"
              chi: "prod3"
              hostname: "chi-prod3-cluster-0-0"
            exp_annotations:
              summary: "ClickHouse has replicated tables stuck in read-only mode"
              description: "2 replicated table(s) on host chi-prod3-cluster-0-0 (CHI prod3) have been read-only for over 5 minutes. A replica goes read-only when it loses its ZooKeeper/Keeper session or cannot find its metadata there, and while it is read-only every INSERT, ALTER and merge on those tables is rejected. Writes routed to this host fail outright; reads still work but drift further behind the other replicas the longer this lasts."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/clickhouse.md#clickhousereadonlyreplica"

  # ============================================================
  # ClickHouseReadonlyReplica: negative — no read-only replicas.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'chi_clickhouse_metric_ReadonlyReplica{chi="prod3",hostname="chi-prod3-cluster-0-0"}'
        values: '0+0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: ClickHouseReadonlyReplica
        exp_alerts: []

  # ============================================================
  # ClickHouseReplicationLagHigh: positive — 10 minutes behind,
  # twice the 5m threshold.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'chi_clickhouse_metric_ReplicasMaxAbsoluteDelay{chi="prod3",hostname="chi-prod3-cluster-0-0"}'
        values: '600+0x15'
    alert_rule_test:
      - eval_time: 11m
        alertname: ClickHouseReplicationLagHigh
        exp_alerts:
          - exp_labels:
              sourceType: "metric"
              severity: "warning"
              priority: "P2"
              tech_stack: "clickhouse"
              signal: "symptom"
              category: "data"
              runbook: "runbooks/databases/clickhouse.md"
              query: "chi_clickhouse_metric_ReplicasMaxAbsoluteDelay > 300"
              chi: "prod3"
              hostname: "chi-prod3-cluster-0-0"
            exp_annotations:
              summary: "ClickHouse replication is lagging"
              description: "The most delayed replicated table on host chi-prod3-cluster-0-0 (CHI prod3) is 10m 0s behind (threshold 5m). Queries that land on this replica return stale results — rows written elsewhere are simply missing — and if the leader is lost now, everything still in this replica's queue is at risk. Usual causes: merges and fetches saturating the host, a slow or full disk, or a Keeper/ZooKeeper ensemble that is not keeping up."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/clickhouse.md#clickhousereplicationlaghigh"

  # ============================================================
  # ClickHouseReplicationLagHigh: negative — a minute of lag is
  # normal on a busy cluster.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'chi_clickhouse_metric_ReplicasMaxAbsoluteDelay{chi="prod3",hostname="chi-prod3-cluster-0-0"}'
        values: '60+0x15'
    alert_rule_test:
      - eval_time: 11m
        alertname: ClickHouseReplicationLagHigh
        exp_alerts: []

  # ============================================================
  # ClickHouseReplicationQueueHigh: positive — the queue sits at 250
  # entries and does not drain.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'chi_clickhouse_metric_ReplicasMaxQueueSize{chi="prod3",hostname="chi-prod3-cluster-0-0"}'
        values: '250+0x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: ClickHouseReplicationQueueHigh
        exp_alerts:
          - exp_labels:
              sourceType: "metric"
              severity: "warning"
              priority: "P2"
              tech_stack: "clickhouse"
              signal: "cause"
              category: "data"
              runbook: "runbooks/databases/clickhouse.md"
              query: "chi_clickhouse_metric_ReplicasMaxQueueSize > 100"
              chi: "prod3"
              hostname: "chi-prod3-cluster-0-0"
            exp_annotations:
              summary: "ClickHouse replication queue is backing up"
              description: "The largest replication queue on host chi-prod3-cluster-0-0 (CHI prod3) holds 250 entries (threshold 100) and has not drained for 15 minutes. The replica is being handed fetches, merges and mutations faster than it can apply them; replication lag and part count grow from here, and a queue entry that keeps failing will retry forever and block everything queued behind it."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/clickhouse.md#clickhousereplicationqueuehigh"

  # ============================================================
  # ClickHouseReplicationQueueHigh: negative — a small queue that is
  # being worked off.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'chi_clickhouse_metric_ReplicasMaxQueueSize{chi="prod3",hostname="chi-prod3-cluster-0-0"}'
        values: '10+0x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: ClickHouseReplicationQueueHigh
        exp_alerts: []

  # # ============================================================
  # # ClickHouseReplicatedDataLoss: positive — one data-loss event in
  # # the 10m window.
  # # ============================================================
  # - interval: 1m
  #   input_series:
  #     - series: 'chi_clickhouse_event_ReplicatedDataLoss{chi="prod3",hostname="chi-prod3-cluster-0-0"}'
