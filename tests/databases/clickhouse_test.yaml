              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/clickhouse.md#clickhousedetachedpartspresent"

  # ============================================================
  # ClickHouseDetachedPartsPresent: negative — parts detached by an
