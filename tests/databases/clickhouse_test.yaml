  # # ##########################################################################
  # # First-appearance cases. A system.events counter does not exist until the
  # # event has happened once; it then shows up carrying its value and stays
  # # flat. increase() cannot see that 0 -> N step (there is no earlier sample
  # # to compare against), so each of these rules carries a second branch:
  # #   <counter> > 0 unless <counter> offset <window>
  # # These cases cover exactly that: the series is absent until t=5m, then sits
  # # at 1 forever. Without the second branch every one of them would be silent.
  # # ##########################################################################

