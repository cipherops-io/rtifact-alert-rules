              category: "data"
              runbook: "runbooks/databases/clickhouse.md"
              query: "chi_clickhouse_metric_DetachedParts{reason!=\"detached_by_user\"} > 0"
              chi: "prod3"
              hostname: "chi-prod3-cluster-0-0"
              database: "analytics"
              table: "events"
              disk: "default"
              reason: "broken"
            exp_annotations:
