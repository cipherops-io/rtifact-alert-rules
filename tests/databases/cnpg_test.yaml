# Unit tests for rules/metrics/databases/cnpg.yml
#
# Run with:
#   promtool test rules tests/databases/cnpg_test.yaml
#
# Format reference:
#   https://prometheus.io/docs/prometheus/latest/configuration/unit_testing_rules/

rule_files:
  - ../../rules/metrics/databases/cnpg.yml

evaluation_interval: 1m

tests:
  # ============================================================
  # CNPGClusterDown: positive — collector reports 0 for >1m
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'cnpg_collector_up{cnpg_cluster="prod-pg",pod="prod-pg-1"}'
        values: '0 0 0 0 0 0'
    alert_rule_test:
      - eval_time: 5m
        alertname: CNPGClusterDown
        exp_alerts:
          - exp_labels:
              severity: critical
              priority: P1
              notify_every: "15m"
              tech_stack: cnpg
              signal: symptom
              category: data
              runbook: runbooks/databases/cnpg.yaml
              cnpg_cluster: prod-pg
              pod: prod-pg-1
            exp_annotations:
              summary: "CloudNativePG cluster collector is down"
              description: "CloudNativePG cluster prod-pg collector is down — pod prod-pg-1."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/cnpg.yaml#cnpgclusterdown"

  # ============================================================
  # CNPGClusterDown: negative — collector reports 1 (healthy)
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'cnpg_collector_up{cnpg_cluster="prod-pg",pod="prod-pg-1"}'
        values: '1 1 1 1 1 1'
    alert_rule_test:
      - eval_time: 5m
        alertname: CNPGClusterDown
        exp_alerts: []

  # ============================================================
  # CNPGClusterDegraded: positive — fewer ready than desired
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'cnpg_cluster_ready_instances{cnpg_cluster="prod-pg"}'
        values: '2 2 2 2 2 2 2 2 2 2'
      - series: 'cnpg_cluster_instances{cnpg_cluster="prod-pg"}'
        values: '3 3 3 3 3 3 3 3 3 3'
    alert_rule_test:
      - eval_time: 6m
        alertname: CNPGClusterDegraded
        exp_alerts:
          - exp_labels:
              severity: critical
              priority: P1
              notify_every: "30m"
              tech_stack: cnpg
              signal: symptom
              category: data
              runbook: runbooks/databases/cnpg.yaml
              cnpg_cluster: prod-pg
            exp_annotations:
              summary: "CloudNativePG cluster has fewer ready instances than desired"
              description: "CNPG cluster prod-pg has 2 ready instances, less than desired."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/cnpg.yaml#cnpgclusterdegraded"

  # ============================================================
  # CNPGClusterDegraded: negative — equal ready and desired
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'cnpg_cluster_ready_instances{cnpg_cluster="prod-pg"}'
        values: '3 3 3 3 3 3 3 3 3 3'
      - series: 'cnpg_cluster_instances{cnpg_cluster="prod-pg"}'
        values: '3 3 3 3 3 3 3 3 3 3'
    alert_rule_test:
      - eval_time: 6m
        alertname: CNPGClusterDegraded
        exp_alerts: []

  # ============================================================
  # CNPGClusterReplicationLagWarning: positive — lag > 30s
  # CNPGClusterReplicationLagCritical: also fires when > 120s
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'cnpg_pg_replication_lag{cnpg_cluster="prod-pg"}'
        values: '150 150 150 150'
    alert_rule_test:
      - eval_time: 3m
        alertname: CNPGClusterReplicationLagWarning
        exp_alerts:
          - exp_labels:
              severity: warning
              priority: P2
              notify_every: "30m"
              tech_stack: cnpg
              signal: cause
              category: data
              runbook: runbooks/databases/cnpg.yaml
              cnpg_cluster: prod-pg
            exp_annotations:
              summary: "CloudNativePG replica is lagging behind primary"
              description: "CNPG cluster prod-pg replica is 2m 30s behind primary."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/cnpg.yaml#cnpgclusterreplicationlagwarning"
      - eval_time: 3m
        alertname: CNPGClusterReplicationLagCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              priority: P1
              notify_every: "15m"
              tech_stack: cnpg
              signal: cause
              category: data
              runbook: runbooks/databases/cnpg.yaml
              cnpg_cluster: prod-pg
            exp_annotations:
              summary: "CloudNativePG replica replication lag is critical"
              description: "CNPG cluster prod-pg replica is 2m 30s behind primary — exceeds 2-minute critical threshold. Failover RPO is at risk."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/cnpg.yaml#cnpgclusterreplicationlagcritical"

  # ============================================================
  # CNPGClusterPrimaryNotReady: positive — primary uptime is 0
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'cnpg_cluster_primary_uptime_seconds{cnpg_cluster="prod-pg"}'
        values: '0 0 0 0'
    alert_rule_test:
      - eval_time: 3m
        alertname: CNPGClusterPrimaryNotReady
        exp_alerts:
          - exp_labels:
              severity: critical
              priority: P0
              notify_every: "10m"
              tech_stack: cnpg
              signal: symptom
              category: data
              runbook: runbooks/databases/cnpg.yaml
              cnpg_cluster: prod-pg
            exp_annotations:
              summary: "CloudNativePG primary pod is not ready"
              description: "CNPG cluster prod-pg primary pod is not ready — writes are failing."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/cnpg.yaml#cnpgclusterprimarynotready"

  # ============================================================
  # CNPGClusterDeadReplicationSlot: positive — inactive HA slot on the
  # PRIMARY retaining WAL fires; the standby's mirrored copy of the same
  # slot (in_recovery=1) must not fire a second alert.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'cnpg_pg_replication_in_recovery{namespace="db",pod="prod-pg-1"}'
        values: '0x15'
      - series: 'cnpg_pg_replication_in_recovery{namespace="db",pod="prod-pg-2"}'
        values: '1x15'
      - series: 'cnpg_pg_replication_slots_active{namespace="db",pod="prod-pg-1",slot_name="_cnpg_prod_pg_3",slot_type="physical"}'
        values: '0x15'
      - series: 'cnpg_pg_replication_slots_pg_wal_lsn_diff{namespace="db",pod="prod-pg-1",slot_name="_cnpg_prod_pg_3",slot_type="physical"}'
        values: '989852824x15'
      - series: 'cnpg_pg_replication_slots_active{namespace="db",pod="prod-pg-2",slot_name="_cnpg_prod_pg_3",slot_type="physical"}'
        values: '0x15'
      - series: 'cnpg_pg_replication_slots_pg_wal_lsn_diff{namespace="db",pod="prod-pg-2",slot_name="_cnpg_prod_pg_3",slot_type="physical"}'
        values: '989852824x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: CNPGClusterDeadReplicationSlot
        exp_alerts:
          - exp_labels:
              sourceType: metric
              severity: critical
              priority: P1
              notify_every: "15m"
              tech_stack: cnpg
              signal: cause
              category: data
              runbook: runbooks/databases/cnpg.yaml
              query: |
                cnpg_pg_replication_slots_active == 0
                and cnpg_pg_replication_slots_pg_wal_lsn_diff > 0
                and on (namespace, pod) cnpg_pg_replication_in_recovery == 0
              cnpg_cluster: prod-pg
              namespace: db
              pod: prod-pg-1
              slot_name: _cnpg_prod_pg_3
              slot_type: physical
            exp_annotations:
              summary: "CloudNativePG has an inactive replication slot"
              description: "CNPG cluster  (namespace db) pod prod-pg-1 has an inactive physical replication slot _cnpg_prod_pg_3 still holding WAL — pg_wal will grow unboundedly until the consumer returns or the slot is dropped."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/cnpg.yaml#cnpgclusterdeadreplicationslot"

  # ============================================================
  # CNPGClusterDeadReplicationSlot: negative — only a standby's mirrored
  # HA slot is inactive with a little WAL retained (normal CNPG behaviour).
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'cnpg_pg_replication_in_recovery{namespace="db",pod="prod-pg-2"}'
        values: '1x15'
      - series: 'cnpg_pg_replication_slots_active{namespace="db",pod="prod-pg-2",slot_name="_cnpg_prod_pg_3",slot_type="physical"}'
        values: '0x15'
      - series: 'cnpg_pg_replication_slots_pg_wal_lsn_diff{namespace="db",pod="prod-pg-2",slot_name="_cnpg_prod_pg_3",slot_type="physical"}'
        values: '51576x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: CNPGClusterDeadReplicationSlot
        exp_alerts: []
