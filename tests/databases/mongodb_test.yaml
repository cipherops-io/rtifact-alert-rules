        description: 'Secondary mongodb-1:27017 of replica set rs0 (job mongodb-metrics, namespace mongo, cluster c1) is 6m 40s behind the primary and has been more than 30 seconds behind for 5 minutes. Reads routed to this member return stale data, and it is a poor failover candidate: if the primary fails, writes this member has not applied yet may be rolled back. Common causes are write bursts the secondary cannot apply fast enough, slow disk or CPU on the secondary, missing indexes that make replicated updates and deletes slow, or a poor sync source. Check rs.printSecondaryReplicationInfo() and the secondary''s resource usage.'
