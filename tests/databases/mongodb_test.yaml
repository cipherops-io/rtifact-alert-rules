              - ignoring (member_idx, member_state) group_right
              mongodb_rs_members_optimeDate{member_state="SECONDARY"}
            ) / 1000 > 30
          )
          unless on (cluster, namespace, job, rs_nm, member_idx)
          (
            {__name__=~"mongodb_rs_cfg_members_(secondaryDelaySecs|slaveDelay)"} > 0
          )
        cluster: c1
        namespace: mongo
        job: mongodb-metrics
        rs_nm: rs0
        member_idx: mongodb-1:27017
