# Unit tests for rules/metrics/databases/mongodb.yml
rule_files:
- ../../rules/metrics/databases/mongodb.yml
evaluation_interval: 1m
tests:
- interval: 1m
  input_series:
  - series: up{cluster="c1",namespace="mongo",job="mongodb-metrics",instance="mongodb-3:9216",pod="mongodb-3"}
    values: '0x10'
  - series: up{cluster="c1",namespace="mongo",job="mongodb-metrics",instance="mongodb-1:9216",pod="mongodb-1"}
    values: 1x10
  - series: up{cluster="c1",namespace="mongo",job="mongodb-atlas",instance="atlas:9216"}
    values: '0x10'
  alert_rule_test:
  - eval_time: 6m
    alertname: MongoDBExporterDown
    exp_alerts:
    - exp_labels:
        sourceType: metric
        severity: warning
        priority: P2
        notify_every: 2h
        tech_stack: mongodb
        signal: cause
        category: monitoring
        runbook: runbooks/databases/mongodb.md
        query: |
          up{job=~".*mongo.*", job!~".*atlas.*"} == 0
        cluster: c1
        namespace: mongo
        job: mongodb-metrics
        instance: mongodb-3:9216
        pod: mongodb-3
      exp_annotations:
        summary: MongoDB exporter target is not being scraped
        description: Every scrape of MongoDB exporter target mongodb-3:9216 (job mongodb-metrics) in namespace mongo, cluster c1 has failed for 5 minutes. While the exporter is down, none of the MongoDB alerts for the instance it monitors can fire, including MongoDBDown, replication lag and connection saturation. Check that the exporter container is running and ready, that its metrics port (9216 by default) is reachable from the metrics agent, and the exporter log for authentication or connection errors.
        runbook_url: https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/mongodb.md#mongodbexporterdown
  - eval_time: 4m
    alertname: MongoDBExporterDown
    exp_alerts: []
- interval: 1m
  input_series:
  - series: mongodb_up{cluster="c1",namespace="mongo",job="mongodb-metrics",instance="mongodb-0:9216",pod="mongodb-0",cluster_role="mongod"}
    values: '0x10'
  - series: mongodb_up{cluster="c1",namespace="mongo",job="mongodb-metrics",instance="mongodb-1:9216",pod="mongodb-1",cluster_role="mongod"}
    values: 1x10
  - series: mongodb_up{cluster="c1",namespace="mongo",job="mongodb-metrics",instance="mongodb-2:9216",pod="mongodb-2",cluster_role="mongod"}
    values: 1x10
  alert_rule_test:
  - eval_time: 3m
    alertname: MongoDBDown
    exp_alerts:
    - exp_labels:
        sourceType: metric
        severity: critical
        priority: P1
        notify_every: 30m
        tech_stack: mongodb
        signal: symptom
        category: data
        runbook: runbooks/databases/mongodb.md
        query: |
          mongodb_up == 0
        cluster: c1
        namespace: mongo
        job: mongodb-metrics
        instance: mongodb-0:9216
        pod: mongodb-0
        cluster_role: mongod
      exp_annotations:
        summary: MongoDB instance is unreachable
        description: The MongoDB exporter at mongodb-0:9216 (job mongodb-metrics) in namespace mongo, cluster c1 has been unable to ping its mongod for 2 minutes. If this node was the primary, writes fail until a new primary is elected; if it is a secondary, the replica set has lost redundancy and reads routed to it fail; if it is a standalone, the database is unavailable. Check whether mongod is running (process or container status, OOM kills, restarts), the mongod log for a fatal assertion, crash or disk-full shutdown, and whether the exporter's credentials and network path to mongod still work.
        runbook_url: https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/mongodb.md#mongodbdown
  - eval_time: 1m
    alertname: MongoDBDown
    exp_alerts: []
  - eval_time: 5m
    alertname: MongoDBAllInstancesDown
    exp_alerts: []
- interval: 1m
  input_series:
  - series: mongodb_up{cluster="c1",namespace="mongo",job="mongodb-metrics",instance="mongodb-0:9216",pod="mongodb-0",cluster_role="mongod"}
    values: '0x10'
  - series: mongodb_up{cluster="c1",namespace="mongo",job="mongodb-metrics",instance="mongodb-1:9216",pod="mongodb-1",cluster_role="mongod"}
    values: '0x10'
  - series: mongodb_up{cluster="c1",namespace="mongo",job="mongodb-metrics",instance="mongodb-2:9216",pod="mongodb-2",cluster_role="mongod"}
    values: '0x10'
  - series: mongodb_up{cluster="c1",namespace="mongo",job="orders-mongodb-metrics",instance="orders-0:9216",pod="orders-0",cluster_role="mongod"}
    values: 1x10
  alert_rule_test:
  - eval_time: 3m
    alertname: MongoDBAllInstancesDown
    exp_alerts:
    - exp_labels:
        sourceType: metric
        severity: critical
        priority: P0
        notify_every: 10m
        tech_stack: mongodb
        signal: symptom
        category: data
        runbook: runbooks/databases/mongodb.md
        query: |
          max by (cluster, namespace, job) (
            mongodb_up
          ) == 0
        cluster: c1
        namespace: mongo
        job: mongodb-metrics
      exp_annotations:
        summary: Every MongoDB instance of the service is unreachable
        description: Every MongoDB exporter of job mongodb-metrics in namespace mongo, cluster c1 has been unable to reach its mongod for 2 minutes. No member can serve reads or writes, so every application that uses this database is failing. Check the mongod pods or hosts, their logs for the shutdown reason (OOM kill, disk full, fatal assertion, failed upgrade), the data volumes and the nodes they run on. If the mongod processes look healthy, look for a credential or network change that affects all exporters at once.
        runbook_url: https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/mongodb.md#mongodballinstancesdown
  - eval_time: 1m
    alertname: MongoDBAllInstancesDown
    exp_alerts: []
- interval: 1m
  input_series:
  - series: mongodb_rs_myState{cluster="c1",namespace="mongo",job="mongodb-metrics",instance="mongodb-1:9216",pod="mongodb-1",rs_nm="rs0",rs_state="2"}
    values: 2x10
  - series: mongodb_rs_myState{cluster="c1",namespace="mongo",job="mongodb-metrics",instance="mongodb-2:9216",pod="mongodb-2",rs_nm="rs0",rs_state="2"}
    values: 2x10
  - series: mongodb_rs_members_state{cluster="c1",namespace="mongo",job="mongodb-metrics",instance="mongodb-1:9216",pod="mongodb-1",rs_nm="rs0",rs_state="2",member_idx="mongodb-0:27017",member_state="(not reachable/healthy)"}
    values: 8x10
  - series: mongodb_rs_members_state{cluster="c1",namespace="mongo",job="mongodb-metrics",instance="mongodb-2:9216",pod="mongodb-2",rs_nm="rs0",rs_state="2",member_idx="mongodb-0:27017",member_state="(not reachable/healthy)"}
    values: 8x10
  - series: mongodb_rs_members_state{cluster="c1",namespace="mongo",job="mongodb-metrics",instance="mongodb-1:9216",pod="mongodb-1",rs_nm="rs0",rs_state="2",member_idx="mongodb-1:27017",member_state="SECONDARY"}
    values: 2x10
  - series: mongodb_rs_members_state{cluster="c1",namespace="mongo",job="mongodb-metrics",instance="mongodb-1:9216",pod="mongodb-1",rs_nm="rs0",rs_state="2",member_idx="mongodb-2:27017",member_state="SECONDARY"}
    values: 2x10
  - series: mongodb_rs_members_state{cluster="c1",namespace="mongo",job="mongodb-metrics",instance="mongodb-2:9216",pod="mongodb-2",rs_nm="rs0",rs_state="2",member_idx="mongodb-1:27017",member_state="SECONDARY"}
    values: 2x10
  - series: mongodb_rs_members_state{cluster="c1",namespace="mongo",job="mongodb-metrics",instance="mongodb-2:9216",pod="mongodb-2",rs_nm="rs0",rs_state="2",member_idx="mongodb-2:27017",member_state="SECONDARY"}
    values: 2x10
  - series: mongodb_rs_myState{cluster="c1",namespace="mongo",job="mongodb-metrics",instance="shard1-0:9216",pod="shard1-0",rs_nm="rs1",rs_state="1"}
    values: 1x10
  - series: mongodb_rs_members_state{cluster="c1",namespace="mongo",job="mongodb-metrics",instance="shard1-0:9216",pod="shard1-0",rs_nm="rs1",rs_state="1",member_idx="shard1-0:27017",member_state="PRIMARY"}
    values: 1x10
  alert_rule_test:
  - eval_time: 2m
    alertname: MongoDBReplicaSetNoPrimary
    exp_alerts:
    - exp_labels:
        sourceType: metric
        severity: critical
        priority: P0
        notify_every: 10m
        tech_stack: mongodb
        signal: symptom
        category: data
        runbook: runbooks/databases/mongodb.md
        query: |
          count by (cluster, namespace, job, rs_nm) (
            mongodb_rs_myState
          )
          unless
          count by (cluster, namespace, job, rs_nm) (
            mongodb_rs_members_state == 1
          )
        cluster: c1
        namespace: mongo
        job: mongodb-metrics
        rs_nm: rs0
      exp_annotations:
        summary: MongoDB replica set has no primary
        description: 'No member of replica set rs0 (job mongodb-metrics, namespace mongo, cluster c1) has seen a PRIMARY for 1 minute, while 2 member(s) are still reporting. All writes and primary reads fail until a primary is elected. A normal election completes in about 10 to 12 seconds, so this usually means a majority of voting members cannot reach each other: members are down, the network is partitioned, or a reconfiguration left too few voting members. Run rs.status() on a reachable member and check members[].health, stateStr and lastHeartbeatMessage.'
        runbook_url: https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/mongodb.md#mongodbreplicasetnoprimary
  - eval_time: 30s
    alertname: MongoDBReplicaSetNoPrimary
    exp_alerts: []
- interval: 1m
  input_series:
  - series: mongodb_rs_members_health{cluster="c1",namespace="mongo",job="mongodb-metrics",instance="mongodb-0:9216",pod="mongodb-0",rs_nm="rs0",rs_state="1",member_idx="mongodb-0:27017",member_state="PRIMARY"}
    values: 1x20
  - series: mongodb_rs_members_health{cluster="c1",namespace="mongo",job="mongodb-metrics",instance="mongodb-0:9216",pod="mongodb-0",rs_nm="rs0",rs_state="1",member_idx="mongodb-1:27017",member_state="SECONDARY"}
    values: 1x20
  - series: mongodb_rs_members_health{cluster="c1",namespace="mongo",job="mongodb-metrics",instance="mongodb-0:9216",pod="mongodb-0",rs_nm="rs0",rs_state="1",member_idx="mongodb-2:27017",member_state="(not reachable/healthy)"}
    values: '0x20'
  - series: mongodb_rs_members_health{cluster="c1",namespace="mongo",job="mongodb-metrics",instance="mongodb-1:9216",pod="mongodb-1",rs_nm="rs0",rs_state="2",member_idx="mongodb-0:27017",member_state="PRIMARY"}
    values: 1x20
  - series: mongodb_rs_members_health{cluster="c1",namespace="mongo",job="mongodb-metrics",instance="mongodb-1:9216",pod="mongodb-1",rs_nm="rs0",rs_state="2",member_idx="mongodb-1:27017",member_state="SECONDARY"}
    values: 1x20
  - series: mongodb_rs_members_health{cluster="c1",namespace="mongo",job="mongodb-metrics",instance="mongodb-1:9216",pod="mongodb-1",rs_nm="rs0",rs_state="2",member_idx="mongodb-2:27017",member_state="(not reachable/healthy)"}
    values: '0x20'
  - series: mongodb_rs_members_state{cluster="c1",namespace="mongo",job="mongodb-metrics",instance="mongodb-0:9216",pod="mongodb-0",rs_nm="rs0",rs_state="1",member_idx="mongodb-3:27017",member_state="RECOVERING"}
    values: 3x20
  - series: mongodb_rs_members_state{cluster="c1",namespace="mongo",job="mongodb-metrics",instance="mongodb-0:9216",pod="mongodb-0",rs_nm="rs0",rs_state="1",member_idx="mongodb-4:27017",member_state="STARTUP2"}
    values: 5x9
  - series: mongodb_rs_members_state{cluster="c1",namespace="mongo",job="mongodb-metrics",instance="mongodb-0:9216",pod="mongodb-0",rs_nm="rs0",rs_state="1",member_idx="mongodb-4:27017",member_state="SECONDARY"}
    values: _x10 2x10
  - series: mongodb_rs_members_state{cluster="c1",namespace="mongo",job="mongodb-metrics",instance="mongodb-1:9216",pod="mongodb-1",rs_nm="rs0",rs_state="2",member_idx="mongodb-3:27017",member_state="RECOVERING"}
    values: 3x20
  - series: mongodb_rs_members_state{cluster="c1",namespace="mongo",job="mongodb-metrics",instance="mongodb-1:9216",pod="mongodb-1",rs_nm="rs0",rs_state="2",member_idx="mongodb-4:27017",member_state="STARTUP2"}
    values: 5x9
  - series: mongodb_rs_members_state{cluster="c1",namespace="mongo",job="mongodb-metrics",instance="mongodb-1:9216",pod="mongodb-1",rs_nm="rs0",rs_state="2",member_idx="mongodb-4:27017",member_state="SECONDARY"}
    values: _x10 2x10
  alert_rule_test:
  - eval_time: 3m
    alertname: MongoDBReplicationMemberUnhealthy
    exp_alerts:
    - exp_labels:
        sourceType: metric
        severity: critical
        priority: P1
        notify_every: 30m
        tech_stack: mongodb
        signal: cause
        category: data
        runbook: runbooks/databases/mongodb.md
        query: |
          min by (cluster, namespace, job, rs_nm, member_idx) (
            mongodb_rs_members_health
          ) == 0
        cluster: c1
        namespace: mongo
        job: mongodb-metrics
        rs_nm: rs0
        member_idx: mongodb-2:27017
      exp_annotations:
        summary: MongoDB replica set member is unreachable
        description: Replica set rs0 (job mongodb-metrics, namespace mongo, cluster c1) has reported member mongodb-2:27017 as unreachable for 2 minutes. The set keeps working while a majority of voting members is up, but it has less redundancy and one more failure can leave it without a primary. Check whether mongod on mongodb-2:27017 is running, its log, DNS resolution and the network path between members, and rs.status().members[].lastHeartbeatMessage.
        runbook_url: https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/mongodb.md#mongodbreplicationmemberunhealthy
  - eval_time: 1m
    alertname: MongoDBReplicationMemberUnhealthy
    exp_alerts: []
  - eval_time: 16m
    alertname: MongoDBReplicaSetMemberNotServing
    exp_alerts:
    - exp_labels:
        sourceType: metric
        severity: warning
        priority: P2
        notify_every: 2h
        tech_stack: mongodb
        signal: cause
        category: data
        runbook: runbooks/databases/mongodb.md
        query: |
          max by (cluster, namespace, job, rs_nm, member_idx) (
            mongodb_rs_members_state{member_state=~"STARTUP|STARTUP2|RECOVERING|ROLLBACK|UNKNOWN|REMOVED"}
          )
        cluster: c1
        namespace: mongo
        job: mongodb-metrics
        rs_nm: rs0
        member_idx: mongodb-3:27017
      exp_annotations:
        summary: MongoDB replica set member is not serving
        description: Member mongodb-3:27017 of replica set rs0 (job mongodb-metrics, namespace mongo, cluster c1) has been in replica set state 3 for 15 minutes instead of PRIMARY, SECONDARY or ARBITER (0 = STARTUP, 3 = RECOVERING, 5 = STARTUP2, 6 = UNKNOWN, 9 = ROLLBACK, 10 = REMOVED). It is reachable but serves no reads and does not acknowledge majority writes, so the set has less redundancy. A member stuck in RECOVERING has usually fallen off the oplog ('too stale to catch up') and needs a resync; STARTUP2 is expected while an initial sync runs, which can take hours on a large data set; ROLLBACK means writes that never reached a majority are being undone. Check rs.status() and the member's mongod log.
        runbook_url: https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/mongodb.md#mongodbreplicasetmembernotserving
  - eval_time: 10m
    alertname: MongoDBReplicaSetMemberNotServing
    exp_alerts: []
- interval: 1m
  input_series:
  - series: mongodb_rs_members_electionDate{cluster="c1",namespace="mongo",job="mongodb-metrics",instance="mongodb-0:9216",pod="mongodb-0",rs_nm="rs0",rs_state="1",member_idx="mongodb-0:27017",member_state="PRIMARY"}
    values: 300000x40
  - series: mongodb_rs_members_electionDate{cluster="c1",namespace="mongo",job="mongodb-metrics",instance="mongodb-1:9216",pod="mongodb-1",rs_nm="rs0",rs_state="2",member_idx="mongodb-0:27017",member_state="PRIMARY"}
    values: 300000x40
  alert_rule_test:
  - eval_time: 10m
    alertname: MongoDBReplicaSetPrimaryElected
    exp_alerts:
    - exp_labels:
        sourceType: metric
        severity: info
        priority: P3
        notify_every: 24h
        tech_stack: mongodb
        signal: cause
        category: data
        runbook: runbooks/databases/mongodb.md
        query: |
          time()
          - max by (cluster, namespace, job, rs_nm, member_idx) (
            mongodb_rs_members_electionDate{member_state="PRIMARY"}
          ) / 1000
          < 900
        cluster: c1
        namespace: mongo
        job: mongodb-metrics
        rs_nm: rs0
        member_idx: mongodb-0:27017
      exp_annotations:
        summary: MongoDB replica set elected a new primary
        description: Member mongodb-0:27017 became the primary of replica set rs0 (job mongodb-metrics, namespace mongo, cluster c1) 5m 0s ago. Elections happen during planned maintenance (stepdown, rolling restart, upgrade) and when the previous primary failed or lost contact with the majority. Writes fail for several seconds during an election, and drivers retry them or return errors. If no maintenance was planned, check the previous primary's mongod log for why it stepped down.
        runbook_url: https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/mongodb.md#mongodbreplicasetprimaryelected
  - eval_time: 30m
    alertname: MongoDBReplicaSetPrimaryElected
    exp_alerts: []
- interval: 1m
  input_series:
  - series: mongodb_rs_term{cluster="c1",namespace="mongo",job="mongodb-metrics",instance="mongodb-0:9216",pod="mongodb-0",rs_nm="rs0",rs_state="1"}
    values: 1x10 2x10 3x10 4x45
  - series: mongodb_rs_term{cluster="c1",namespace="mongo",job="mongodb-metrics",instance="mongodb-1:9216",pod="mongodb-1",rs_nm="rs0",rs_state="2"}
    values: 1x10 2x10 3x10 4x45
  alert_rule_test:
  - eval_time: 67m
    alertname: MongoDBReplicaSetFrequentElections
    exp_alerts:
    - exp_labels:
        sourceType: metric
        severity: warning
        priority: P2
        notify_every: 2h
        tech_stack: mongodb
        signal: symptom
        category: data
        runbook: runbooks/databases/mongodb.md
        query: |
          max by (cluster, namespace, job, rs_nm) (
            mongodb_rs_term
          )
          - max by (cluster, namespace, job, rs_nm) (
            mongodb_rs_term offset 1h
          )
          >= 3
        cluster: c1
        namespace: mongo
        job: mongodb-metrics
        rs_nm: rs0
      exp_annotations:
        summary: MongoDB replica set is holding repeated elections
        description: Replica set rs0 (job mongodb-metrics, namespace mongo, cluster c1) has advanced its election term 3 times in the last hour. Each election makes writes fail for several seconds, so applications see repeated bursts of errors. Repeated elections usually come from members missing heartbeats (an overloaded or stalled node, packet loss, DNS problems), from priority takeovers after a member restarts, or from a crash-looping primary. Compare electionDate in rs.status() with the members' mongod logs ('Starting an election', 'Stepping down').
        runbook_url: https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/mongodb.md#mongodbreplicasetfrequentelections
  - eval_time: 75m
    alertname: MongoDBReplicaSetFrequentElections
    exp_alerts: []
- interval: 1m
  input_series:
  - series: mongodb_rs_members_optimeDate{cluster="c1",namespace="mongo",job="mongodb-metrics",instance="mongodb-0:9216",pod="mongodb-0",rs_nm="rs0",rs_state="1",member_idx="mongodb-0:27017",member_state="PRIMARY"}
    values: 100000x10
  - series: mongodb_rs_members_optimeDate{cluster="c1",namespace="mongo",job="mongodb-metrics",instance="mongodb-0:9216",pod="mongodb-0",rs_nm="rs0",rs_state="1",member_idx="mongodb-1:27017",member_state="SECONDARY"}
    values: 55000x10
  - series: mongodb_rs_members_optimeDate{cluster="c1",namespace="mongo",job="mongodb-metrics",instance="mongodb-0:9216",pod="mongodb-0",rs_nm="rs0",rs_state="1",member_idx="mongodb-2:27017",member_state="SECONDARY"}
    values: 100000x10
  - series: mongodb_rs_members_optimeDate{cluster="c1",namespace="mongo",job="mongodb-metrics",instance="mongodb-0:9216",pod="mongodb-0",rs_nm="rs0",rs_state="1",member_idx="mongodb-3:27017",member_state="SECONDARY"}
    values: '0x10'
  - series: mongodb_rs_members_optimeDate{cluster="c1",namespace="mongo",job="mongodb-metrics",instance="mongodb-1:9216",pod="mongodb-1",rs_nm="rs0",rs_state="2",member_idx="mongodb-0:27017",member_state="PRIMARY"}
    values: 98000x10
  - series: mongodb_rs_members_optimeDate{cluster="c1",namespace="mongo",job="mongodb-metrics",instance="mongodb-1:9216",pod="mongodb-1",rs_nm="rs0",rs_state="2",member_idx="mongodb-1:27017",member_state="SECONDARY"}
    values: 55000x10
  - series: mongodb_rs_cfg_members_secondaryDelaySecs{cluster="c1",namespace="mongo",job="mongodb-metrics",instance="mongodb-0:9216",pod="mongodb-0",rs_nm="rs0",rs_state="1",member_idx="mongodb-1:27017"}
    values: '0x10'
  - series: mongodb_rs_cfg_members_secondaryDelaySecs{cluster="c1",namespace="mongo",job="mongodb-metrics",instance="mongodb-0:9216",pod="mongodb-0",rs_nm="rs0",rs_state="1",member_idx="mongodb-3:27017"}
    values: 3600x10
  alert_rule_test:
  - eval_time: 6m
    alertname: MongoDBReplicationLagHigh
    exp_alerts:
    - exp_labels:
        sourceType: metric
        severity: warning
        priority: P2
        notify_every: 2h
        tech_stack: mongodb
        signal: cause
        category: data
        runbook: runbooks/databases/mongodb.md
        query: |
          (
            max by (cluster, namespace, job, rs_nm, member_idx) (
              max without (member_idx, member_state) (
                mongodb_rs_members_optimeDate{member_state="PRIMARY"}
              )
              - ignoring (member_idx, member_state) group_right
              mongodb_rs_members_optimeDate{member_state="SECONDARY"}
            ) / 1000 > 30
          )
          unless on (cluster, namespace, job, rs_nm, member_idx)
          (
            {__name__=~"mongodb_rs_cfg_members_(secondaryDelaySecs|slaveDelay)"} > 0
          )
        cluster: c1
        namespace: mongo
        job: mongodb-metrics
        rs_nm: rs0
        member_idx: mongodb-1:27017
      exp_annotations:
        summary: MongoDB secondary is lagging behind the primary
        description: 'Secondary mongodb-1:27017 of replica set rs0 (job mongodb-metrics, namespace mongo, cluster c1) is 45s behind the primary and has been more than 30 seconds behind for 5 minutes. Reads routed to this member return stale data, and it is a poor failover candidate: if the primary fails, writes this member has not applied yet may be rolled back. Common causes are write bursts the secondary cannot apply fast enough, slow disk or CPU on the secondary, missing indexes that make replicated updates and deletes slow, or a poor sync source. Check rs.printSecondaryReplicationInfo() and the secondary''s resource usage.'
        runbook_url: https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/mongodb.md#mongodbreplicationlaghigh
  - eval_time: 4m
    alertname: MongoDBReplicationLagHigh
    exp_alerts: []
  - eval_time: 6m
    alertname: MongoDBReplicationLagCritical
    exp_alerts: []
- interval: 1m
  input_series:
  - series: mongodb_rs_members_optimeDate{cluster="c1",namespace="mongo",job="mongodb-metrics",instance="mongodb-0:9216",pod="mongodb-0",rs_nm="rs0",rs_state="1",member_idx="mongodb-0:27017",member_state="PRIMARY"}
    values: 500000x10
  - series: mongodb_rs_members_optimeDate{cluster="c1",namespace="mongo",job="mongodb-metrics",instance="mongodb-0:9216",pod="mongodb-0",rs_nm="rs0",rs_state="1",member_idx="mongodb-1:27017",member_state="SECONDARY"}
    values: 100000x10
  alert_rule_test:
  - eval_time: 6m
    alertname: MongoDBReplicationLagHigh
    exp_alerts:
    - exp_labels:
        sourceType: metric
        severity: warning
        priority: P2
        notify_every: 2h
        tech_stack: mongodb
        signal: cause
