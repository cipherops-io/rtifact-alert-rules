# Unit tests for rules/databases/redis.yaml
rule_files:
  - ../../rules/databases/redis.yaml

evaluation_interval: 1m

tests:
  # ============================================================
  # RedisDown: positive — redis_up == 0 for > 1m
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'redis_up{instance="redis:6379"}'
        values: '0 0 0 0'
    alert_rule_test:
      - eval_time: 3m
        alertname: RedisDown
        exp_alerts:
          - exp_labels:
              severity: critical
              priority: P1
              tech_stack: redis
              signal: symptom
              category: data
              runbook: runbooks/databases/redis.yaml
              instance: "redis:6379"
            exp_annotations:
              summary: "Redis instance is down"
              description: "Redis instance redis:6379 has been unreachable for more than 1 minute. Applications using this Redis endpoint may fail cache reads/writes, sessions, locks, queues, rate limits, or pub/sub."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/redis.yaml#redisdown"

  # ============================================================
  # RedisDown: negative — redis_up == 1
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'redis_up{instance="redis:6379"}'
        values: '1 1 1 1'
    alert_rule_test:
      - eval_time: 3m
        alertname: RedisDown
        exp_alerts: []

  # ============================================================
  # RedisHighMemoryUsage: positive — used / max > 0.80 (max > 0) for > 5m
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'redis_memory_used_bytes{instance="redis:6379"}'
        values: '900 900 900 900 900 900 900 900'
      - series: 'redis_memory_max_bytes{instance="redis:6379"}'
        values: '1000 1000 1000 1000 1000 1000 1000 1000'
    alert_rule_test:
      - eval_time: 7m
        alertname: RedisHighMemoryUsage
        exp_alerts:
          - exp_labels:
              severity: warning
              priority: P2
              tech_stack: redis
              signal: cause
              category: data
              runbook: runbooks/databases/redis.yaml
              instance: "redis:6379"
            exp_annotations:
              summary: "Redis memory usage is high"
              description: "Redis memory usage is above 80% of configured maxmemory on redis:6379 — approaching eviction/rejection risk."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/redis.yaml#redishighmemoryusage"

  # ============================================================
  # RedisHighMemoryUsage: negative — maxmemory unset (0) must NOT fire
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'redis_memory_used_bytes{instance="redis:6379"}'
        values: '900 900 900 900 900 900 900 900'
      - series: 'redis_memory_max_bytes{instance="redis:6379"}'
        values: '0 0 0 0 0 0 0 0'
    alert_rule_test:
      - eval_time: 7m
        alertname: RedisHighMemoryUsage
        exp_alerts: []

  # ============================================================
  # RedisNotEnoughConnections: positive — connected_clients < 5 for > 5m
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'redis_connected_clients{instance="redis:6379"}'
        values: '2 2 2 2 2 2 2 2'
    alert_rule_test:
      - eval_time: 6m
        alertname: RedisNotEnoughConnections
        exp_alerts:
          - exp_labels:
              severity: warning
              priority: P3
              tech_stack: redis
              signal: symptom
              category: data
              runbook: runbooks/databases/redis.yaml
              instance: "redis:6379"
            exp_annotations:
              summary: "Redis has very few client connections"
              description: "Redis instance redis:6379 has fewer than 5 connected clients for 5 minutes. For a normally-busy instance this may indicate client connectivity failures; for idle/standby instances it may be expected and should be filtered."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/redis.yaml#redisnotenoughconnections"

  # ============================================================
  # RedisSlowLogGrowing: positive — slowlog_last_id increasing for > 5m
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'redis_slowlog_last_id{instance="redis:6379"}'
        values: '0 1 2 3 4 5 6 7'
    alert_rule_test:
      - eval_time: 7m
        alertname: RedisSlowLogGrowing
        exp_alerts:
          - exp_labels:
              severity: warning
              priority: P3
              tech_stack: redis
              signal: cause
              category: data
              runbook: runbooks/databases/redis.yaml
              instance: "redis:6379"
            exp_annotations:
              summary: "Redis slowlog is growing"
              description: "New Redis slowlog entries observed on redis:6379 — commands exceeding the slowlog threshold may raise latency for all clients (Redis command execution is largely single-threaded)."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/redis.yaml#redisslowloggrowing"
