# Unit tests for rules/metrics/databases/redis.yml
rule_files:
  - ../../rules/metrics/databases/redis.yml

evaluation_interval: 1m

tests:
  # ============================================================
  # RedisDown: positive — redis_up == 0 for > 1m
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'redis_up{instance="redis:6379"}'
        values: '0 0 0 0'
    alert_rule_test:
      - eval_time: 3m
        alertname: RedisDown
        exp_alerts:
          - exp_labels:
              severity: critical
              priority: P1
              notify_every: "10m"
              tech_stack: redis
              signal: symptom
              category: data
              runbook: runbooks/databases/redis.yaml
              instance: "redis:6379"
            exp_annotations:
              summary: "Redis instance is down"
              description: "Redis instance redis:6379 has been unreachable for more than 1 minute. Applications using this Redis endpoint may fail cache reads/writes, sessions, locks, queues, rate limits, or pub/sub."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/redis.yaml#redisdown"

  # ============================================================
  # RedisDown: negative — redis_up == 1
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'redis_up{instance="redis:6379"}'
        values: '1 1 1 1'
    alert_rule_test:
      - eval_time: 3m
        alertname: RedisDown
        exp_alerts: []

  # ============================================================
  # RedisHighMemoryUsage: positive — used / max > 0.80 (max > 0) for > 5m
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'redis_memory_used_bytes{instance="redis:6379"}'
        values: '900 900 900 900 900 900 900 900'
      - series: 'redis_memory_max_bytes{instance="redis:6379"}'
        values: '1000 1000 1000 1000 1000 1000 1000 1000'
    alert_rule_test:
      - eval_time: 7m
        alertname: RedisHighMemoryUsage
        exp_alerts:
          - exp_labels:
              severity: warning
              priority: P2
              notify_every: "1h"
              tech_stack: redis
              signal: cause
              category: data
              runbook: runbooks/databases/redis.yaml
              instance: "redis:6379"
            exp_annotations:
              summary: "Redis memory usage is high"
              description: "Redis memory usage is above 80% of configured maxmemory on redis:6379 — approaching eviction/rejection risk."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/redis.yaml#redishighmemoryusage"

  # ============================================================
  # RedisHighMemoryUsage: negative — maxmemory unset (0) must NOT fire
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'redis_memory_used_bytes{instance="redis:6379"}'
        values: '900 900 900 900 900 900 900 900'
      - series: 'redis_memory_max_bytes{instance="redis:6379"}'
        values: '0 0 0 0 0 0 0 0'
    alert_rule_test:
      - eval_time: 7m
        alertname: RedisHighMemoryUsage
        exp_alerts: []

  # ============================================================
  # RedisNotEnoughConnections: positive — connected_clients < 5 for > 5m
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'redis_connected_clients{instance="redis:6379"}'
        values: '2 2 2 2 2 2 2 2'
    alert_rule_test:
      - eval_time: 6m
        alertname: RedisNotEnoughConnections
        exp_alerts:
          - exp_labels:
              severity: warning
              priority: P3
              notify_every: "2h"
              tech_stack: redis
              signal: symptom
              category: data
              runbook: runbooks/databases/redis.yaml
              instance: "redis:6379"
            exp_annotations:
              summary: "Redis has very few client connections"
              description: "Redis instance redis:6379 has fewer than 5 connected clients for 5 minutes. For a normally-busy instance this may indicate client connectivity failures; for idle/standby instances it may be expected and should be filtered."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/redis.yaml#redisnotenoughconnections"

  # ============================================================
  # RedisSlowLogGrowing: positive — real Redis, 6 new slow entries/min (30 per 5m), id only goes up
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'redis_slowlog_last_id{instance="redis:6379"}'
        values: '0+6x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: RedisSlowLogGrowing
        exp_alerts: []
      - eval_time: 20m
        alertname: RedisSlowLogGrowing
        exp_alerts:
          - exp_labels:
              sourceType: metric
              severity: warning
              priority: P3
              notify_every: "2h"
              tech_stack: redis
              signal: cause
              category: data
              runbook: runbooks/databases/redis.yaml
              query: |
                increase(redis_slowlog_last_id[5m]) >= 20
                and
                resets(redis_slowlog_last_id[1h]) == 0
              instance: "redis:6379"
            exp_annotations:
              summary: "Redis slowlog is growing"
              description: "30 new slowlog entries were recorded on redis:6379 in the last 5m (threshold 20, sustained for 10m). One or more commands are exceeding the configured slowlog threshold and may be increasing request latency for all clients because Redis command execution is largely single-threaded. Expensive commands, large keys, broad scans, Lua scripts, or slow disk/network conditions can delay unrelated cache, session, lock, queue, and rate-limit operations. Run SLOWLOG GET to see the exact commands."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/redis.yaml#redisslowloggrowing"

  # ============================================================
  # RedisSlowLogGrowing: negative — Dragonfly per-thread slowlog. The exported id flips between two
  # thread counters (~900 and ~10), so increase() sees a "reset" every few minutes and reports
  # hundreds of phantom entries (this is the compro platform-redis false alarm). The id goes
  # backwards inside the last hour, so the rule must skip it.
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'redis_slowlog_last_id{instance="redis://platform-redis.cmtndata.svc:6379"}'
        values: '900 901 10 11 902 903 12 13 904 905 14 15 906 907 16 17 908 909 18 19 910 911 20 21 912 913 22 23 914 915 24 25 916 917 26 27 918 919 28 29 920'
    alert_rule_test:
      - eval_time: 20m
        alertname: RedisSlowLogGrowing
        exp_alerts: []
      - eval_time: 40m
        alertname: RedisSlowLogGrowing
        exp_alerts: []

  # ============================================================
  # RedisSlowLogGrowing: negative — real Redis, only 2 new slow entries/min (10 per 5m, below 20)
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'redis_slowlog_last_id{instance="redis:6379"}'
        values: '0+2x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: RedisSlowLogGrowing
        exp_alerts: []

  # ============================================================
  # RedisSlowLogGrowing: real Redis restart at 11m (id 5060 -> 0), then 6 slow entries/min.
  # Paused while the restart is inside the 1h window, fires again once it ages out (70m + for 10m).
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'redis_slowlog_last_id{instance="redis:6379"}'
        values: '5000+6x10 0+6x100'
    alert_rule_test:
      - eval_time: 60m
        alertname: RedisSlowLogGrowing
        exp_alerts: []
      - eval_time: 85m
        alertname: RedisSlowLogGrowing
        exp_alerts:
          - exp_labels:
              sourceType: metric
              severity: warning
              priority: P3
              notify_every: "2h"
              tech_stack: redis
              signal: cause
              category: data
              runbook: runbooks/databases/redis.yaml
              query: |
                increase(redis_slowlog_last_id[5m]) >= 20
                and
                resets(redis_slowlog_last_id[1h]) == 0
              instance: "redis:6379"
            exp_annotations:
              summary: "Redis slowlog is growing"
              description: "30 new slowlog entries were recorded on redis:6379 in the last 5m (threshold 20, sustained for 10m). One or more commands are exceeding the configured slowlog threshold and may be increasing request latency for all clients because Redis command execution is largely single-threaded. Expensive commands, large keys, broad scans, Lua scripts, or slow disk/network conditions can delay unrelated cache, session, lock, queue, and rate-limit operations. Run SLOWLOG GET to see the exact commands."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/redis.yaml#redisslowloggrowing"

  # ============================================================
  # RedisCommandLatencyHigh: positive — HGETALL at 10 calls/s averaging 25ms (normal is < 1ms)
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'redis_commands_total{instance="redis:6379",cmd="hgetall"}'
        values: '0+600x40'
      - series: 'redis_commands_duration_seconds_total{instance="redis:6379",cmd="hgetall"}'
        values: '0+15x40'
    alert_rule_test:
      - eval_time: 5m
        alertname: RedisCommandLatencyHigh
        exp_alerts: []
      - eval_time: 25m
        alertname: RedisCommandLatencyHigh
        exp_alerts:
          - exp_labels:
              sourceType: metric
              severity: warning
              priority: P3
              notify_every: "1h"
              tech_stack: redis
              signal: symptom
              category: data
              runbook: runbooks/databases/redis.yaml
              query: |
                (
                  rate(redis_commands_duration_seconds_total{cmd!~"(info|config|slowlog|client|ping|latency|cluster|monitor|sync|psync|replconf|dfly|blpop|brpop|brpoplpush|blmove|blmpop|bzpopmin|bzpopmax|bzmpop|xread|xreadgroup|wait|waitaof|subscribe|psubscribe|ssubscribe)([|].*)?"}[5m])
                  /
                  rate(redis_commands_total[5m])
                ) > 0.01
                and
                rate(redis_commands_total[5m]) > 1
              instance: "redis:6379"
              cmd: "hgetall"
            exp_annotations:
              summary: "Redis command hgetall is slow"
              description: "Command hgetall on redis:6379 has averaged 25ms per call for more than 10m (threshold 10ms; a healthy Redis/Dragonfly serves commands in well under 1ms). Slow commands hold the event loop (one per thread on Dragonfly) and delay every client of this instance. Check whether CPU is saturated, whether this command is hitting a very large key (HGETALL/SMEMBERS/ZRANGE on big collections, KEYS, Lua scripts), and whether a traffic surge or a new release started at the same time. SLOWLOG GET shows the exact commands and keys."
              runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/redis.yaml#rediscommandlatencyhigh"

  # ============================================================
  # RedisCommandLatencyHigh: negative — normal traffic, HGETALL at 10 calls/s averaging 0.2ms
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'redis_commands_total{instance="redis:6379",cmd="hgetall"}'
        values: '0+600x40'
      - series: 'redis_commands_duration_seconds_total{instance="redis:6379",cmd="hgetall"}'
        values: '0+0.12x40'
    alert_rule_test:
      - eval_time: 25m
        alertname: RedisCommandLatencyHigh
        exp_alerts: []

  # ============================================================
  # RedisCommandLatencyHigh: negative — rare slow command: KEYS once every 2 minutes at 500ms
  # (0.008 calls/s, below the 1 call/s traffic guard)
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'redis_commands_total{instance="redis:6379",cmd="keys"}'
        values: '0+0.5x40'
      - series: 'redis_commands_duration_seconds_total{instance="redis:6379",cmd="keys"}'
        values: '0+0.25x40'
    alert_rule_test:
      - eval_time: 25m
        alertname: RedisCommandLatencyHigh
        exp_alerts: []

  # ============================================================
  # RedisCommandLatencyHigh: negative — commands that must never fire:
  #   blpop       blocking command, waits ~2s by design (excluded)
  #   config|get  Redis 7 subcommand name from the exporter's own scrape, 50ms (excluded)
  #   select      duration counter moved but call counter did not -> ratio is +Inf (traffic guard)
  # ============================================================
  - interval: 1m
    input_series:
      - series: 'redis_commands_total{instance="redis:6379",cmd="blpop"}'
        values: '0+300x40'
      - series: 'redis_commands_duration_seconds_total{instance="redis:6379",cmd="blpop"}'
        values: '0+600x40'
      - series: 'redis_commands_total{instance="redis:6379",cmd="config|get"}'
        values: '0+120x40'
      - series: 'redis_commands_duration_seconds_total{instance="redis:6379",cmd="config|get"}'
        values: '0+6x40'
      - series: 'redis_commands_total{instance="redis:6379",cmd="select"}'
        values: '100x40'
      - series: 'redis_commands_duration_seconds_total{instance="redis:6379",cmd="select"}'
        values: '0+0.5x40'
    alert_rule_test:
      - eval_time: 25m
        alertname: RedisCommandLatencyHigh
        exp_alerts: []
