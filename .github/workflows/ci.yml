name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: lint (promtool + yamllint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install promtool
        run: |
          PROM_VERSION="${PROM_VERSION:-2.55.1}"
          curl -sSL "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz" \
            | tar xz --strip-components=1 "prometheus-${PROM_VERSION}.linux-amd64/promtool"
          sudo mv promtool /usr/local/bin/promtool
          promtool --version
      - name: Install yamllint
        run: pip install yamllint
      - name: Run make lint
        run: make lint

  test:
    name: unit tests (promtool test rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install promtool
        run: |
          PROM_VERSION="${PROM_VERSION:-2.55.1}"
          curl -sSL "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz" \
            | tar xz --strip-components=1 "prometheus-${PROM_VERSION}.linux-amd64/promtool"
          sudo mv promtool /usr/local/bin/promtool
      - name: Run make test
        run: make test

  validate-labels:
    name: label-contract validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: python3 scripts/validate_labels.py

  catalog-fresh:
    name: catalog is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Regenerate catalog and diff
        run: |
          python3 scripts/generate_catalog.py > /tmp/catalog.md
          if ! diff -u docs/catalog.md /tmp/catalog.md > /dev/null; then
            echo "::error::docs/catalog.md is stale. Run 'make catalog' and commit the result."
            diff -u docs/catalog.md /tmp/catalog.md || true
            exit 1
          fi
          echo "Catalog is up to date."
