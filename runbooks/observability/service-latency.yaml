tech_stack: service-observability
version: "1.0"
description: "Runbook for service-level latency/error anomaly alerts raised by proactive monitoring (no Kubernetes failure object). Grounds RCA in OBI/eBPF service-graph, span, and OTel HTTP metrics so the assessment names the slow edge, pod, dependency, or span instead of generic 'check logs' guidance."

match_keywords:
  - latency spike
  - latency high
  - api latency
  - slow requests
  - response time degradation
  - error rate spike
  - internal lock errors

categories:
  - API
  - APPLICATION

common_alerts:
  - name: "ServiceLatencySpike"
    patterns:
      [
        "latency spike",
        "latency high",
        "high request latency",
        "elevated latency",
        "api latency high",
        "p99 latency",
        "p95 latency",
        "response time",
        "latency degradation",
        "slow requests",
        "internal lock errors",
        "event loop blocking",
      ]
    priority: P2
    diagnostic_steps:
      - step: 1
        title: "Confirm the inbound latency symptom from eBPF service-graph data"
        description: >-
          OBI (eBPF) service-graph metrics measure real request latency on the wire,
          per edge and per pod, without app instrumentation — confirm the symptom on
          the SERVER side of the $service inbound edge before blaming anything.
          Interpret: inbound_p99_ms much higher than inbound_p50_ms with flat
          inbound_req_per_s (compare vs the 1h-ago rate) => NOT traffic-driven,
          suspect a dependency or internal contention. inbound_req_per_s up 2x+ vs
          1h ago => load-driven latency, scaling is on the table. If
          slowest_pod_p99_ms (labels name the pod) is far above inbound_p99_ms, a
          single bad pod is the outlier — target THAT pod (restart/profile it), not
          the whole deployment; the per-pod p99 panel shows whether that pod has been
          the outlier for the whole window or only since a specific moment. If inbound
          p99 is normal, the alert window has passed or the anomaly was internal-only
          (locks/GC) — weight the log evidence in step 4 higher. inbound_failed_pct is
          guarded to return 0 when there are no failed requests, so 0 means "measured,
          none" — only a MISSING value means this service has no eBPF coverage.
          The inbound queries deliberately aggregate over EVERY caller rather than
          filtering to one `client` label value: collectors name off-mesh callers
          differently per environment (a synthetic "incoming", the node hostname, the
          ingress pod), so any hardcoded client value returns zero series on the
          clusters that use another convention. slowest_client_p99_ms and the
          per-caller p99 panel do the attribution instead — its labels NAME the slow
          caller edge. Interpret the caller: an in-mesh service name => that caller's
          traffic pattern is driving the latency (check retries/fan-out from it); a
          node hostname/IP, "incoming", or a monitoring client (prometheus/agent
          names) => off-mesh traffic, i.e. kubelet probes, ingress or scrapes rather
          than user requests. CRITICAL low-traffic branch: if inbound_req_per_s is
          very low (a few req/s or less, roughly probe cadence) and the caller and
          route evidence point at health/scrape endpoints, then the percentile is
          computed over a handful of probe requests — SAY that the alert reflects
          probe/health-check latency with no evidence of user-facing impact, and do
          NOT dress it up as a service-wide degradation.
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "Inbound (server-side) p50/p95/p99 across all callers, request rate now vs 1h ago, per-caller and per-pod p99 attribution, and failed-request ratio from OBI service-graph histograms."
            params:
              queries:
                - name: inbound_p99_ms
                  unit: "ms"
                  query: 'histogram_quantile(0.99, sum by (le) (rate(traces_service_graph_request_server_bucket{server="$service"}[5m])))*1000'
                  panel: true
                  panel_title: "Inbound p99 (eBPF)"
                  panel_id: "svc-inbound-p99"
                - name: inbound_p95_ms
                  unit: "ms"
                  query: 'histogram_quantile(0.95, sum by (le) (rate(traces_service_graph_request_server_bucket{server="$service"}[5m])))*1000'
                  panel: true
                  panel_title: "Inbound p95 (eBPF)"
                  panel_id: "svc-inbound-p95"
                - name: inbound_p50_ms
                  unit: "ms"
                  query: 'histogram_quantile(0.50, sum by (le) (rate(traces_service_graph_request_server_bucket{server="$service"}[5m])))*1000'
                - name: inbound_req_per_s
                  unit: "req/s"
                  query: 'sum(rate(traces_service_graph_request_total{server="$service"}[5m]))'
                  panel: true
                  panel_title: "Inbound Request Rate (eBPF)"
                  panel_id: "svc-inbound-req-rate"
                - name: inbound_req_per_s_1h_ago
                  unit: "req/s"
                  query: 'sum(rate(traces_service_graph_request_total{server="$service"}[5m] offset 1h))'
                - name: slowest_client_p99_ms
                  unit: "ms"
                  query: 'topk(1, histogram_quantile(0.99, sum by (le, client) (rate(traces_service_graph_request_server_bucket{server="$service"}[5m]))))*1000'
                - name: inbound_p99_by_client_ms
                  unit: "ms"
                  query: 'histogram_quantile(0.99, sum by (le, client) (rate(traces_service_graph_request_server_bucket{server="$service"}[5m])))*1000'
                  panel: true
                  panel_title: "Inbound p99 by Caller"
                  panel_id: "svc-inbound-p99-by-client"
                - name: busiest_client_req_per_s
                  unit: "req/s"
                  query: 'topk(1, sum by (client) (rate(traces_service_graph_request_total{server="$service"}[5m])))'
                - name: slowest_pod_p99_ms
                  unit: "ms"
                  query: 'topk(1, histogram_quantile(0.99, sum by (le, k8s.pod.name) (rate(traces_service_graph_request_server_bucket{server="$service"}[5m]))))*1000'
                - name: inbound_p99_by_pod_ms
                  unit: "ms"
                  query: 'histogram_quantile(0.99, sum by (le, k8s.pod.name) (rate(traces_service_graph_request_server_bucket{server="$service"}[5m])))*1000'
                  panel: true
                  panel_title: "Inbound p99 by Pod"
                  panel_id: "svc-inbound-p99-by-pod"
                # `or vector(0)` on the numerator: a service with zero failed requests has NO
                # traces_service_graph_request_failed_total series at all, and an unguarded
                # division then returns no data — indistinguishable from "not instrumented".
                - name: inbound_failed_pct
                  unit: "%"
                  query: '100 * (sum(rate(traces_service_graph_request_failed_total{server="$service"}[5m])) or vector(0)) / sum(rate(traces_service_graph_request_total{server="$service"}[5m]))'
                  panel: true
                  panel_title: "Failed Request %"
                  panel_id: "svc-inbound-failed-pct"
      - step: 2
        title: "Attribute the latency to a downstream dependency (outbound edges)"
        description: >-
          The most common cause of a latency spike with flat traffic is a slow or
          failing downstream dependency. Each outbound edge of $service is measured
          client-side by OBI; the labels on slowest_dependency_p99_ms NAME the edge
          (server="..."). Interpret: slowest_dependency_p99_ms within ~80% of
          inbound_p99_ms => that dependency IS the user-facing latency — name it as
          the root cause (external SaaS/LLM endpoints count; they won't appear in
          k8s metrics). worst_edge_failed_pct > 1% => internal retries are masking
          dependency failures even when top-level HTTP error rate is 0 — mention the
          retry amplification. busiest_dependency_req_per_s spiking vs steady inbound
          traffic => fan-out/retry storm toward that dependency. If all outbound
          edges are fast, the delay is INSIDE $service — go to step 3. The two per-edge
          panels (dependency p99 / request rate, one series per downstream `server`) show
          WHEN each edge degraded — use them to say whether the dependency slowed BEFORE
          the inbound p99 rose (dependency-driven) or at the same moment (shared cause,
          e.g. the node or network), instead of only comparing current values.
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "Slowest/busiest outbound edges, per-edge p99 and request rate as one series each, per-edge failure ratio, and total failed edge traffic from OBI service-graph client histograms."
            params:
              queries:
                - name: slowest_dependency_p99_ms
                  unit: "ms"
                  query: 'topk(1, histogram_quantile(0.99, sum by (le, server) (rate(traces_service_graph_request_client_bucket{client="$service"}[5m]))))*1000'
                - name: dependency_p99_by_edge_ms
                  unit: "ms"
                  query: 'histogram_quantile(0.99, sum by (le, server) (rate(traces_service_graph_request_client_bucket{client="$service"}[5m])))*1000'
                  panel: true
                  panel_title: "Dependency p99 by Edge"
                  panel_id: "svc-dependency-p99-by-edge"
                - name: busiest_dependency_req_per_s
                  unit: "req/s"
                  query: 'topk(1, sum by (server) (rate(traces_service_graph_request_total{client="$service"}[5m])))'
                - name: dependency_req_per_s_by_edge
                  unit: "req/s"
                  query: 'sum by (server) (rate(traces_service_graph_request_total{client="$service"}[5m]))'
                  panel: true
                  panel_title: "Dependency Request Rate by Edge"
                  panel_id: "svc-dependency-req-rate-by-edge"
                - name: dependency_edge_count
                  query: 'count(sum by (server) (rate(traces_service_graph_request_total{client="$service"}[5m])))'
                - name: worst_edge_failed_pct
                  unit: "%"
                  query: 'topk(1, 100 * (sum by (server) (rate(traces_service_graph_request_failed_total{client="$service"}[5m])) or sum by (server) (rate(traces_service_graph_request_total{client="$service"}[5m])) * 0) / sum by (server) (rate(traces_service_graph_request_total{client="$service"}[5m])))'
                - name: failed_edge_req_per_s
                  unit: "req/s"
                  query: 'sum(rate(traces_service_graph_request_failed_total{client="$service"}[5m]))'
      - step: 3
        title: "Pinpoint the internal bottleneck route and supporting OTel signals"
        description: >-
          Attribute the latency to a specific ROUTE inside $service. slowest_route_p95_ms
          names it (http.route="..."), and route_p95_by_route / route_req_per_s_by_route
          graph every route separately. IMPORTANT: read the route names before concluding —
          if the only routes are probes/scrape endpoints (/health, /ready, /metrics,
          /actuator/*), then this service's real traffic is NOT OTel-HTTP-instrumented and
          the route breakdown says nothing about user latency; say so and fall back to the
          service-graph evidence from steps 1-2. Cross-check that against step 1's
          inbound_req_per_s: when the eBPF inbound rate is the same order as the probe
          route's rate, the probes are not merely the instrumented traffic, they are the
          ONLY traffic — the alert is probe latency on an idle service, which is a finding
          in itself, not an instrumentation gap to recommend more sampling for.
          Interpret: one real route's p95 far above the rest => that operation is the bottleneck; pair it with the step-2 edge (e.g. a
          /tts route that calls an LLM proxy). Values pinned at a histogram bucket edge (e.g.
          exactly 4.75ms or 10000ms) mean the true latency lies inside/above that bucket —
          report "~value" or ">= value", not an exact figure. requests_by_status_code and
          error_rate_pct separate "slow" from "failing": a rising 5xx line alongside the
          latency means requests are erroring out (often after a timeout), not just queuing.
          db_p99_ms attributes time to a database client (db.system.name names which).
          OBI SPAN metrics are deliberately NOT used here: in this fleet OBI emits
          traces_spanmetrics_* with span.name="AGGREGATED" (no per-operation split), so
          per-route attribution comes from the OTel http.server.* family only.
          http_server_p99_ms / db_p99_ms / dns_p95_ms may be n/a when a workload is not
          OTel-instrumented — do NOT invent them; the service-graph numbers from steps 1-2
          are the primary evidence.
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "Slowest and busiest HTTP route (+ per-route breakdown), OTel HTTP server p99, request mix by status code, error ratio, DB operation p99, and DNS lookup p95."
            params:
              queries:
                - name: slowest_route_p95_ms
                  unit: "ms"
                  query: 'topk(1, histogram_quantile(0.95, sum by (le, http.route) (rate({__name__="http.server.request.duration_bucket",service.name="$service"}[10m])))*1000)'
                - name: route_p95_by_route_ms
                  unit: "ms"
                  query: 'topk(5, histogram_quantile(0.95, sum by (le, http.route) (rate({__name__="http.server.request.duration_bucket",service.name="$service"}[10m])))*1000)'
                  panel: true
                  panel_title: "p95 by Route"
                  panel_id: "svc-p95-by-route"
                - name: busiest_route_req_per_s
                  unit: "req/s"
                  query: 'topk(1, sum by (http.route) (rate({__name__="http.server.request.duration_count",service.name="$service"}[10m])))'
                - name: http_server_p99_ms
                  unit: "ms"
                  query: 'histogram_quantile(0.99, sum by (le) (rate({__name__="http.server.request.duration_bucket",service.name="$service"}[10m])))*1000'
                - name: requests_by_status_code
                  unit: "req/s"
                  query: 'sum by (http.response.status_code) (rate({__name__="http.server.request.duration_count",service.name="$service"}[10m]))'
                  panel: true
                  panel_title: "Requests by Status Code"
                  panel_id: "svc-requests-by-status"
                # Guarded numerator — a service with no 4xx/5xx has no such series, and an
                # unguarded ratio would return no data instead of a truthful 0%.
                - name: error_rate_pct
                  unit: "%"
                  query: '100 * (sum(rate({__name__="http.server.request.duration_count",service.name="$service",http.response.status_code=~"[45].."}[10m])) or vector(0)) / sum(rate({__name__="http.server.request.duration_count",service.name="$service"}[10m]))'
                  panel: true
                  panel_title: "Error Rate %"
                  panel_id: "svc-error-rate-pct"
                - name: db_p99_ms
                  unit: "ms"
                  query: 'topk(1, histogram_quantile(0.99, sum by (le, db.system.name) (rate({__name__="db.client.operation.duration_bucket",service.name="$service"}[10m]))))*1000'
                  panel: true
                  panel_title: "DB Client p99"
                  panel_id: "svc-db-p99"
                - name: dns_p95_ms
                  unit: "ms"
                  query: 'histogram_quantile(0.95, sum by (le) (rate({__name__="dns.lookup.duration_bucket",service.name="$service"}[10m])))*1000'
      - step: 4
        title: "Correlate with pod health, log volume, and error signatures"
        description: >-
          Cross-check the metric story against runtime state: pod restarts in the
          window => crash/OOM contribution; a log-volume spike or NEW error
          signatures (e.g. lock acquisition RuntimeErrors named in the alert) =>
          internal contention; neither => pure dependency-side latency.
        tool_calls:
          - tool_id: "tool.capture_diagnostics"
            description: "Pod restarts, log-volume baseline ratio, new error signatures, and OTel HTTP probes for the service."
      - step: 5
        title: "Read the exact error lines"
        description: >-
          Pull current logs filtered for the contention/timeout signatures
          (lock acquisition failures, thread/connection-pool exhaustion, timeouts,
          retries, slow query warnings). The goal is the exact line that ties the
          metric story together — e.g. a lock timeout inside the span named in
          step 3 while waiting on the dependency named in step 2.
        tool_calls:
          - tool_id: "tool.read_logs"
            description: "Service logs filtered for lock/timeout/pool/retry signatures."
            params:
              tail_lines: 200
    remediation: # only for suggestion — never auto-executed (forge.* are approval-gated)
      - action: "restart_deployment"
        description: "Only when internal lock contention or a wedged worker is confirmed (step 4/5 evidence) AND outbound dependencies are healthy — clears the stuck state but is NOT a fix for dependency-side latency."
        tool_id: "forge.restart_deployment"
        requires_approval: true
      - action: "scale_out_replicas"
        description: "Only when step 1 proves the latency is traffic-driven (inbound req/s up materially vs 1h ago) and CPU/memory headroom exists — spreading load does not fix a slow dependency."
        tool_id: "forge.scale_deployment"
        requires_approval: true
      - action: "rollback_deployment"
        description: "Roll back if a deployment of $service shortly preceded the spike (correlated change present)."
        tool_id: "forge.revert_deployment"
        requires_approval: true
    escalation: "Owning service team with the named span/dependency; platform SRE if the slow edge is shared infrastructure (LLM proxy, storage, DNS) impacting multiple callers."
    follow_up:
      - "If the slow edge is an external endpoint (SaaS/LLM), file the latency evidence with the provider or add client-side timeouts/circuit breaking instead of restarting the caller."
      - "If a route's p95 is pinned at a histogram bucket edge, raise the histogram bucket resolution or add explicit tracing on that route to see the true tail."
      - "If step 3 found only probe/scrape routes (/health, /ready, /metrics, /actuator/*), the service lacks OTel HTTP instrumentation on its real traffic — per-route attribution stays unavailable until it is added, and OBI span metrics cannot substitute (span.name is AGGREGATED)."
