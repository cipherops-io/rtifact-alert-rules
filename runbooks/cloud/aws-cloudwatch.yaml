              summary_chars: 2500
          - tool_id: mcp.cloudwatch.analyze_metric
            description: WriteIOPS, 5-minute resolution.
            params:
              arguments:
                namespace: AWS/RDS
                metricName: WriteIOPS
                dimensions: [{Name: DBInstanceIdentifier, Value: $DBInstanceIdentifier}]
                statistic: Average
                period: 300
              timeout: 30
              summary_chars: 1500
          - tool_id: mcp.cloudwatch.analyze_metric
            description: TransactionLogsGeneration, 5-minute resolution.
            params:
              arguments:
                namespace: AWS/RDS
                metricName: TransactionLogsGeneration
                dimensions: [{Name: DBInstanceIdentifier, Value: $DBInstanceIdentifier}]
                statistic: Average
                period: 300
              timeout: 30
              summary_chars: 1500
          - tool_id: mcp.cloudwatch.analyze_metric
            description: DiskQueueDepth, 5-minute resolution.
            params:
              arguments:
                namespace: AWS/RDS
                metricName: DiskQueueDepth
                dimensions: [{Name: DBInstanceIdentifier, Value: $DBInstanceIdentifier}]
                statistic: Average
                period: 300
              timeout: 30
              summary_chars: 1500
          - tool_id: mcp.cloudwatch.analyze_metric
            description: BurstBalance (gp2 storage only), 5-minute resolution.
            params:
              arguments:
                namespace: AWS/RDS
                metricName: BurstBalance
                dimensions: [{Name: DBInstanceIdentifier, Value: $DBInstanceIdentifier}]
                statistic: Minimum
                period: 300
              timeout: 30
              summary_chars: 1500
      - step: 3
        title: Find the writers and long transactions (live, when routed)
        description: >-
          Name the statements with the most execution time and temp writes, and any long
          transactions. Active sessions waiting on IO:WALWrite or IO:WALSync confirm commits wait
          for the disk now; Lock waits point at contention rather than storage.
        tool_calls:
          - *rds_pg_top_statements
          - *rds_pg_long_transactions
    remediation:
      - action: reduce_write_bursts
        description: Spread bulk loads and batch updates over time and commit in larger batches,
          with the service owner.
        tool_id: ''
        requires_approval: true
      - action: raise_storage_performance
        description: If the volume is throttled or at its IOPS limit, move gp2 to gp3 or provision
          more IOPS (gp3, io1, io2).
        tool_id: ''
        requires_approval: true
    escalation: P2 DB owner; raise to P1 when commits time out in the application.
    follow_up:
      - Confirm WriteLatency returns under the threshold and the contributor returns to OK.

  - name: AwsRdsReplicaLagHigh
    patterns:
      - rtifact-rds-replica-lag-above-60s
      - rds_replica_lag_above_60s
      - 'RDS: Replica lag above 60 seconds'
    priority: P2
    diagnostic_steps:
      - step: 1
        title: Confirm the alarm and this replica's transitions
        description: >-
          Rule: MAX(ReplicaLag) > 60 seconds on every one of 5 consecutive 1-minute periods.
          Only read replicas publish ReplicaLag, so the alert's instance is the REPLICA. Its
          source instance is not in the alert and DescribeDBInstances is not available in v1:
          name the source as unknown unless the live replication read shows it.
        tool_calls:
          - tool_id: mcp.cloudwatch.describe_alarms
            description: Alarm configuration and alarm-level state.
            params:
              arguments:
                alarmNames: ['rtifact-rds-replica-lag-above-60s']
              timeout: 20
              rows: 'MetricAlarms[*]'
              max_rows: 5
              summary_chars: 2000
              fields:
                - 'name=AlarmName'
                - 'state=StateValue'
                - 'reason=StateReason'
                - 'state_updated=StateUpdatedTimestamp'
                - 'threshold=Threshold'
                - 'periods=EvaluationPeriods'
                - 'query=Metrics[0].Expression'
          - tool_id: mcp.cloudwatch.get_alarm_history
            description: State transitions in the last 24 hours, one row per instance.
            params:
              arguments:
                alarmName: rtifact-rds-replica-lag-above-60s
                historyItemType: StateUpdate
                limit: 50
              timeout: 20
              rows: 'AlarmHistoryItems[*]'
              max_rows: 25
              summary_chars: 3000
              fields:
                - 'time=Timestamp'
                - 'db=AlarmContributorAttributes.DBInstanceIdentifier'
                - 'summary=HistorySummary'
      - step: 2
        title: Measure lag and whether the replica keeps up with replay
        description: >-
          A lag that climbs steadily means the replica cannot replay WAL as fast as the source
          writes it; a sawtooth that returns to near zero means bursts it catches up on. High
          replica CPU or WriteLatency points at the replica being undersized for replay (it must
          apply every write the source makes). A lag that grows linearly with no recovery can
          mean replication stopped. The source's write rate is not available without its
          instance ID.
        tool_calls:
          - tool_id: mcp.cloudwatch.analyze_metric
            description: ReplicaLag maximum, 1-minute resolution.
            params:
              arguments:
                namespace: AWS/RDS
                metricName: ReplicaLag
                dimensions: [{Name: DBInstanceIdentifier, Value: $DBInstanceIdentifier}]
                statistic: Maximum
                period: 60
              timeout: 30
              summary_chars: 2500
          - tool_id: mcp.cloudwatch.analyze_metric
            description: Replica CPUUtilization, 5-minute resolution.
            params:
              arguments:
                namespace: AWS/RDS
                metricName: CPUUtilization
                dimensions: [{Name: DBInstanceIdentifier, Value: $DBInstanceIdentifier}]
                statistic: Average
                period: 300
              timeout: 30
              summary_chars: 1500
          - tool_id: mcp.cloudwatch.analyze_metric
            description: Replica WriteLatency, 5-minute resolution.
            params:
              arguments:
                namespace: AWS/RDS
                metricName: WriteLatency
                dimensions: [{Name: DBInstanceIdentifier, Value: $DBInstanceIdentifier}]
                statistic: Average
                period: 300
              timeout: 30
              summary_chars: 1500
      - step: 3
        title: Read the replication view and queries holding replay back (live, when routed)
        description: >-
          On the replica, replay_delay_seconds and receive_replay_gap_bytes say whether WAL is
          arriving but not being applied (replay is slow or paused by a conflicting query) or
          not arriving at all (wal_receiver_status not "streaming": network or source issue).
          Long transactions on the replica can pause replay up to max_standby_streaming_delay.
          If the connection reaches the source instead, standbys[] shows each replica's lag in
          seconds and bytes.
        tool_calls:
          - *rds_pg_replication
          - *rds_pg_long_transactions
    remediation:
      - action: size_replica_for_replay
        description: Give the replica at least the source's instance class and storage performance
          so it can apply every write the source makes.
        tool_id: ''
        requires_approval: true
      - action: limit_replica_queries
        description: Move long reporting queries off the replica or review
          max_standby_streaming_delay and hot_standby_feedback with the DB owner (feedback adds
          bloat on the source).
        tool_id: ''
        requires_approval: true
      - action: recreate_replica
        description: If replication stopped and does not resume, recreate the read replica from the
          source after the DB owner confirms.
        tool_id: ''
        requires_approval: true
    escalation: P2 DB owner; raise to P1 when applications read stale data that matters or the lag
      keeps growing without recovery.
    follow_up:
      - Confirm ReplicaLag returns near zero and the contributor returns to OK.

  - name: AwsRdsTransactionIdWraparound
    patterns:
      - rtifact-rds-transaction-ids-above-1b
      - rds_transaction_ids_above_1b
      - 'RDS PostgreSQL: Transaction IDs used above 1 billion'
    priority: P1
    diagnostic_steps:
      - step: 1
        title: Confirm the alarm and this instance's transitions
        description: >-
          Rule: MAX(MaximumUsedTransactionIDs) > 1,000,000,000 on every one of 5 consecutive
          1-minute periods, per PostgreSQL instance. The metric is the age of the oldest
          unfrozen transaction ID; PostgreSQL stops accepting writes near 2.1 billion to
          prevent wraparound, so the gap to that is the urgency.
        tool_calls:
          - tool_id: mcp.cloudwatch.describe_alarms
            description: Alarm configuration and alarm-level state.
            params:
              arguments:
                alarmNames: ['rtifact-rds-transaction-ids-above-1b']
              timeout: 20
              rows: 'MetricAlarms[*]'
              max_rows: 5
              summary_chars: 2000
              fields:
                - 'name=AlarmName'
                - 'state=StateValue'
                - 'reason=StateReason'
                - 'state_updated=StateUpdatedTimestamp'
                - 'threshold=Threshold'
                - 'periods=EvaluationPeriods'
                - 'query=Metrics[0].Expression'
          - tool_id: mcp.cloudwatch.get_alarm_history
            description: State transitions in the last 24 hours, one row per instance.
            params:
              arguments:
                alarmName: rtifact-rds-transaction-ids-above-1b
                historyItemType: StateUpdate
                limit: 50
              timeout: 20
              rows: 'AlarmHistoryItems[*]'
              max_rows: 25
              summary_chars: 3000
              fields:
                - 'time=Timestamp'
                - 'db=AlarmContributorAttributes.DBInstanceIdentifier'
                - 'summary=HistorySummary'
      - step: 2
        title: Measure whether the age is still climbing
        description: >-
          A steadily RISING line means anti-wraparound vacuum is not keeping up: something
          blocks it (step 3). A sawtooth that drops back means vacuum IS freezing and this is a
          peak. Estimate how long until 2.1 billion only as a projection from this window.
        tool_calls:
          - tool_id: mcp.cloudwatch.analyze_metric
            description: MaximumUsedTransactionIDs, 5-minute resolution.
            params:
              arguments:
                namespace: AWS/RDS
                metricName: MaximumUsedTransactionIDs
                dimensions: [{Name: DBInstanceIdentifier, Value: $DBInstanceIdentifier}]
                statistic: Maximum
                period: 300
              timeout: 30
              summary_chars: 2500
      - step: 3
        title: Find what stops vacuum from freezing, and the oldest tables (live, when routed)
        description: >-
          Vacuum cannot freeze past the OLDEST snapshot anyone holds. Read xmin_horizon first; it
          names the blocker: oldest_backend (a long or idle-in-transaction session: quote pid,
          usename, application_name, tx_age_seconds), prepared_xacts > 0 with a large
          oldest_prepared_xact_age (an abandoned two-phase transaction), oldest_slot_xmin_age (a
          replication slot, often an inactive one) or oldest_standby_feedback_xmin_age (a
          replica with hot_standby_feedback running long queries). If none is old, vacuum is
          not reaching the tables: oldest_xid_tables[] lists them. running_vacuums[] with
          to_prevent_wraparound=true means the emergency vacuum is already running; do not
          promise its finish time. autovacuum = off explains it on its own.
        tool_calls:
          - *rds_pg_vacuum
          - *rds_pg_long_transactions
    remediation:
      - action: remove_the_horizon_blocker
        description: Clear what step 3 named as holding the xmin horizon - end the old session after
          its owner confirms (rds_superuser can run pg_terminate_backend), resolve the abandoned
          prepared transaction, or drop the inactive replication slot. Vacuum makes progress only
          once it is gone.
        tool_id: ''
        requires_approval: true
      - action: vacuum_freeze_oldest_tables
        description: Once nothing blocks the horizon, run VACUUM (FREEZE, VERBOSE) on the oldest
          tables step 3 listed, biggest first. Do not cancel an anti-wraparound autovacuum that is
          already running; it restarts from the beginning.
        tool_id: ''
        requires_approval: true
      - action: tune_autovacuum_for_freeze
        description: Prevent recurrence by raising autovacuum_max_workers or maintenance_work_mem, or
          lowering autovacuum_freeze_max_age for hot tables, in the parameter group.
        tool_id: ''
        requires_approval: true
    escalation: P1 DB owner immediately - writes stop near 2.1 billion. Include the blocker step 3
      named so the owner of that session, slot or prepared transaction is pulled in.
    follow_up:
      - Track the age falling after the blocker is removed; it drops only when vacuum finishes the
        oldest table, which can take hours on large tables.
      - Add alerts on long idle-in-transaction sessions and inactive replication slots; they are
        the usual root cause.

  - name: AwsRdsBurstBalanceLow
    patterns:
      - rtifact-rds-burst-balance-below-20
      - rds_burst_balance_below_20
      - 'RDS: Storage burst balance below 20%'
    priority: P2
    diagnostic_steps:
      - step: 1
        title: Confirm the alarm and this instance's transitions
        description: >-
          Rule: MIN(BurstBalance) < 20% on every one of 5 consecutive 1-minute periods. Only gp2
          volumes publish BurstBalance. A gp2 volume earns 3 IOPS per GiB (at least 100) and
          bursts to 3,000 IOPS while it has credits; at zero it drops to that baseline. The
          volume size is not available in v1, so do not state the baseline.
        tool_calls:
          - tool_id: mcp.cloudwatch.describe_alarms
            description: Alarm configuration and alarm-level state.
            params:
              arguments:
                alarmNames: ['rtifact-rds-burst-balance-below-20']
              timeout: 20
              rows: 'MetricAlarms[*]'
              max_rows: 5
              summary_chars: 2000
              fields:
                - 'name=AlarmName'
                - 'state=StateValue'
                - 'reason=StateReason'
                - 'state_updated=StateUpdatedTimestamp'
                - 'threshold=Threshold'
                - 'periods=EvaluationPeriods'
                - 'query=Metrics[0].Expression'
          - tool_id: mcp.cloudwatch.get_alarm_history
            description: State transitions in the last 24 hours, one row per instance.
            params:
              arguments:
                alarmName: rtifact-rds-burst-balance-below-20
                historyItemType: StateUpdate
                limit: 50
              timeout: 20
              rows: 'AlarmHistoryItems[*]'
              max_rows: 25
              summary_chars: 3000
              fields:
                - 'time=Timestamp'
                - 'db=AlarmContributorAttributes.DBInstanceIdentifier'
                - 'summary=HistorySummary'
      - step: 2
        title: Measure how fast credits drain and the I/O spending them
        description: >-
          A steady decline means sustained I/O above the volume's baseline; a sharp drop means a
          burst (batch job, vacuum, backup, index build). ReadIOPS plus WriteIOPS shows which
          side spends the credits. Rising ReadLatency or WriteLatency once the balance nears zero
          is the user-visible effect.
        tool_calls:
          - tool_id: mcp.cloudwatch.analyze_metric
            description: BurstBalance minimum, 5-minute resolution.
            params:
              arguments:
                namespace: AWS/RDS
                metricName: BurstBalance
                dimensions: [{Name: DBInstanceIdentifier, Value: $DBInstanceIdentifier}]
                statistic: Minimum
                period: 300
              timeout: 30
              summary_chars: 2500
          - tool_id: mcp.cloudwatch.analyze_metric
            description: ReadIOPS, 5-minute resolution.
            params:
              arguments:
                namespace: AWS/RDS
                metricName: ReadIOPS
                dimensions: [{Name: DBInstanceIdentifier, Value: $DBInstanceIdentifier}]
                statistic: Average
                period: 300
              timeout: 30
              summary_chars: 1500
          - tool_id: mcp.cloudwatch.analyze_metric
            description: WriteIOPS, 5-minute resolution.
            params:
              arguments:
                namespace: AWS/RDS
                metricName: WriteIOPS
                dimensions: [{Name: DBInstanceIdentifier, Value: $DBInstanceIdentifier}]
                statistic: Average
                period: 300
              timeout: 30
              summary_chars: 1500
          - tool_id: mcp.cloudwatch.analyze_metric
            description: ReadLatency, 5-minute resolution.
            params:
              arguments:
                namespace: AWS/RDS
                metricName: ReadLatency
                dimensions: [{Name: DBInstanceIdentifier, Value: $DBInstanceIdentifier}]
                statistic: Average
                period: 300
              timeout: 30
              summary_chars: 1500
      - step: 3
        title: Find the statements doing the I/O (live, when routed)
        description: >-
          Statements with high shared_blks_read or temp_blks_written spend the credits; a running
          vacuum on a large table can too. Name them as candidates and tie them to the drain only
          when their timing fits step 2.
        tool_calls:
          - *rds_pg_top_statements
          - *rds_pg_vacuum
    remediation:
      - action: move_to_gp3
        description: Change the storage type from gp2 to gp3, which has a 3,000 IOPS baseline and no
          burst credits. The change runs online but adds I/O while the volume optimizes.
        tool_id: ''
        requires_approval: true
      - action: reduce_io
        description: Index the statements step 3 named, and schedule batch jobs and maintenance off
          peak.
        tool_id: ''
        requires_approval: true
    escalation: P2 DB owner; raise to P1 if latency is already rising and the balance is near zero.
    follow_up:
      - Confirm BurstBalance recovers above the threshold and the contributor returns to OK.

general_diagnostic:
  steps:
    - step: 1
      title: Read the instance's main RDS metrics
      description: >-
        For a CloudWatch alert that matches no entry (for example a customer's own alarm). These
        calls need DBInstanceIdentifier; for an alarm on another AWS service they are NOT RUN and
        the alert's NewStateReason and entities are the only evidence. Report which of CPU, free
        storage, freeable memory and connections moved at the alert's start time; do not name a
        cause from one series.
      tool_calls:
        - tool_id: mcp.cloudwatch.analyze_metric
          description: CPUUtilization, 5-minute resolution.
          params:
            arguments:
              namespace: AWS/RDS
              metricName: CPUUtilization
              dimensions: [{Name: DBInstanceIdentifier, Value: $DBInstanceIdentifier}]
              statistic: Average
              period: 300
            timeout: 30
            summary_chars: 1500
        - tool_id: mcp.cloudwatch.analyze_metric
          description: FreeStorageSpace, 5-minute resolution.
          params:
            arguments:
              namespace: AWS/RDS
              metricName: FreeStorageSpace
              dimensions: [{Name: DBInstanceIdentifier, Value: $DBInstanceIdentifier}]
              statistic: Minimum
              period: 300
            timeout: 30
            summary_chars: 1500
        - tool_id: mcp.cloudwatch.analyze_metric
          description: FreeableMemory, 5-minute resolution.
          params:
            arguments:
              namespace: AWS/RDS
              metricName: FreeableMemory
              dimensions: [{Name: DBInstanceIdentifier, Value: $DBInstanceIdentifier}]
              statistic: Minimum
              period: 300
            timeout: 30
            summary_chars: 1500
        - tool_id: mcp.cloudwatch.analyze_metric
          description: DatabaseConnections, 5-minute resolution.
          params:
            arguments:
              namespace: AWS/RDS
              metricName: DatabaseConnections
              dimensions: [{Name: DBInstanceIdentifier, Value: $DBInstanceIdentifier}]
              statistic: Average
              period: 300
            timeout: 30
            summary_chars: 1500
    - step: 2
      title: Read the live connection picture (when routed)
      description: >-
        Connection totals against max_connections, state mix and active waits on the routed
        instance, as context for the alarm. NOT RUN without a routing rule.
      tool_calls:
        - *rds_pg_connections

escalation: |-
  P1 for free storage and transaction ID wraparound (writes stop); P2 for the others. Raise a P2 to P1 when the application reports errors or timeouts against the instance. Always name the instance, the alarm and the evidence gaps.
follow_up:
  - Close on a newer OK contributor event for the same instance, not on the absence of new ALARM events.
  - Keep the evidence and the stated gaps in the final report even when the cause is not established.
  - For customer-impacting alerts, ask the owning team to confirm application recovery separately.
