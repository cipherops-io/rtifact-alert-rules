tech_stack: istio
version: "1.0"
description: >-
  Runbook for the Istio ingress gateway HTTP error alerts, grounded in the standard
  istio_requests_total counter as reported by the gateway's own Envoy
  (reporter="source"). Each assessment names WHICH object fired: either the gateway
  (by `cluster` + `namespace` + `job`) or a destination service seen through it (adds
  `destination_service_namespace` + `destination_service_name`). It then classifies the
  failure as an application error or an Envoy-generated one using `response_flags`:
  '-' means the upstream itself answered with the error, while UH/UF/UR/UT/NR/URX/UO/RL/DC
  mean Envoy produced or recorded the failure (no healthy upstream, connect failure,
  upstream reset, route timeout, no route, retry limit, overflow/circuit breaker,
  rate limited, downstream disconnect).
  SCOPING: `namespace` and `job` on these series are the GATEWAY's (e.g. istio-ingress /
  istio-ingress), not the backend's; the backend is destination_service_namespace /
  destination_service_name. For Knative services, destination_workload is `activator`
  (in knative-serving) and destination_service_name is the revision service (e.g.
  my-svc-00003), so name the revision service rather than the activator.
  DEDUPLICATION CAVEATS: (1) other scrape jobs such as knative-local-gateway can scrape
  the SAME gateway pods, so every query keeps job=~"istio-ingress.*" to avoid
  double-counting. (2) Some pipelines also emit a parallel copy of istio_requests_total
  without request_protocol / response_flags that carries the same values; every query
  keeps request_protocol=~"http|http2" so only the standard series is counted.
  (3) response_code="0" (usually response_flags=DC, the client disconnected before a
  response) and 1xx (websocket 101) are excluded from the error ratio. Report DC volume
  separately if it is large, but it is not a server error.

match_keywords:
  - istio
  - istio ingress
  - istio gateway
  - ingress gateway
  - envoy
  - service mesh
  - 5xx
  - 4xx
  - 503
  - 504
  - response_flags
  - knative

categories:
  - INGRESS
  - NETWORKING
  - SERVICE_MESH

common_alerts:
  # ============================================================ GATEWAY AVAILABILITY
  - name: "IstioGatewayDown"
    patterns:
      [
        "IstioGatewayDown",
        "IstioGatewayReplicaDown",
        "istio gateway down",
        "istio ingress unreachable",
        "gateway replica down",
      ]
    priority: P0
    diagnostic_steps:
      - step: 1
        title: "Confirm how many gateway targets exist and how many are healthy (full vs partial outage)"
        description: >-
          This entry serves IstioGatewayDown (every target of the gateway job down, or the targets
          disappeared within the last 24h, for 5m, critical/P0) and IstioGatewayReplicaDown (one
          target up==0 for 5m, warning/P2). targets_total counts the gateway's current scrape
          targets, targets_healthy how many are up, and up_by_pod names each replica's state.
          Interpret: targets_total==0 with targets_seen_24h>0 means the targets DISAPPEARED (gateway
          Deployment scaled to 0 or deleted, pods evicted, or service discovery stopped finding
          them). targets_total>0 and targets_healthy==0 means every replica is unreachable (full
          outage). targets_healthy < targets_total means a partial outage: name the pod(s) with
          up==0. This is scrape availability, so confirm traffic impact in step 2.
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "Current vs healthy gateway scrape targets, targets seen in the last 24h, and each replica's up state."
            params:
              queries:
                - name: targets_total
                  query: 'count(up{cluster="$cluster",namespace="$namespace",job="$job"}) or vector(0)'
                  panel: true
                  panel_title: "Gateway Targets Total"
                  panel_id: "istio-gw-targets-total"
                - name: targets_healthy
                  query: 'sum(up{cluster="$cluster",namespace="$namespace",job="$job"}) or vector(0)'
                  panel: true
                  panel_title: "Gateway Targets Healthy"
                  panel_id: "istio-gw-targets-healthy"
                - name: targets_seen_24h
                  query: 'count(max_over_time(up{cluster="$cluster",namespace="$namespace",job="$job"}[24h])) or vector(0)'
                - name: up_by_pod
                  query: 'max by (pod, instance) (up{cluster="$cluster",namespace="$namespace",job="$job"})'
                  panel: true
                  panel_title: "Up by Gateway Pod"
                  panel_id: "istio-gw-up-by-pod"
      - step: 2
        title: "Separate a real gateway outage from a scrape problem"
        description: >-
          request_rate is the traffic the gateway is still recording; the pod-state queries name a
          crashed, OOMKilled, pending or not-ready gateway pod. Interpret: request_rate dropping to 0
          together with pod failures means a real outage. Pods Running and Ready but up==0 means the
          metrics agent cannot reach port 15090 (network policy, agent problem) while the gateway may
          still serve traffic. If many unrelated jobs lost their targets at the same moment, the
          metrics agent itself is down, not the gateway. No gateway pods at all means the Deployment
          was scaled to 0 or deleted.
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "Gateway request rate and KSM state of the gateway pods."
            params:
              queries:
                - name: request_rate
                  query: 'sum(rate(istio_requests_total{cluster="$cluster",namespace="$namespace",job="$job",reporter="source",request_protocol=~"http|http2"}[5m])) or vector(0)'
                  panel: true
                  panel_title: "Gateway Request Rate"
                  panel_id: "istio-gw-request-rate"
                - name: gateway_pod_restarts_30m
                  query: 'topk(5, increase(kube_pod_container_status_restarts_total{namespace="$namespace",container="istio-proxy"}[30m]))'
                - name: gateway_pod_last_terminated
                  query: 'kube_pod_container_status_last_terminated_reason{namespace="$namespace",container="istio-proxy",reason=~"OOMKilled|Error|ContainerCannotRun"} == 1'
                - name: gateway_pod_waiting
                  query: 'kube_pod_container_status_waiting_reason{namespace="$namespace",container="istio-proxy",reason=~"CrashLoopBackOff|ImagePullBackOff|ErrImagePull|CreateContainerConfigError"} == 1'
                - name: gateway_pod_notready
                  query: 'kube_pod_status_ready{namespace="$namespace",condition="true"} == 0'
                - name: gateway_deployment_replicas
                  query: 'kube_deployment_status_replicas_available{namespace="$namespace"}'
          - tool_id: "tool.capture_diagnostics"
            description: "Gateway pod state, restarts, OOM and scheduling events in the gateway namespace."
          - tool_id: "tool.read_logs"
            description: "istio-proxy logs on the gateway pods filtered for xDS connection errors to istiod, certificate errors, OOM, panic and shutdown signatures."
            params:
              tail_lines: 200
    remediation:
      - action: "recover_gateway"
        description: "Crash or OOM: raise the gateway's resources or fix the bad config and restart the gateway Deployment. Scaled to 0 or deleted: restore the replicas. Pending pods: fix node capacity, taints or PDBs. If pods are healthy and only the scrape fails, fix the metrics path instead and do not restart the gateway."
        tool_id: "forge.restart_deployment"
        requires_approval: true
      - action: "restore_scrape"
        description: "When the gateway serves traffic but up==0: fix network policy to port 15090, the scrape config or the metrics agent. Monitoring is blind, but users are not affected."
        tool_id: ""
        requires_approval: true
    escalation: "Platform/networking on-call immediately for IstioGatewayDown (all ingress through this gateway at risk, P0). IstioGatewayReplicaDown is reduced capacity; escalate faster if it leaves a single healthy replica."
    follow_up:
      - "Confirm up returns to 1 for every gateway target and request_rate returns to baseline."
      - "Run at least two gateway replicas with a PodDisruptionBudget so one replica failing is not an outage."

  # ============================================================ GATEWAY 5xx / 4xx
  - name: "IstioGatewayErrorRate"
    patterns:
      [
        "IstioGatewayHigh5xxErrorRate",
        "IstioGatewayCritical5xxErrorRate",
        "IstioGatewayHigh4xxErrorRate",
        "istio gateway 5xx",
        "istio gateway 4xx",
        "istio ingress error rate",
        "ingress gateway errors",
      ]
    priority: P1
    diagnostic_steps:
      - step: 1
        title: "Recompute the gateway error ratio and gauge absolute impact"
        description: >-
          This entry serves IstioGatewayHigh5xxErrorRate (more than 5% 5xx with at least 20 errors and
          300 completed requests in 5m, held for 10m, warning/P2), IstioGatewayCritical5xxErrorRate
          (more than 20% 5xx, same volume guards, held for 5m, critical/P1) and IstioGatewayHigh4xxErrorRate (more than
          20% 4xx over 10m with at least 100 errors and 600 requests, warning/P2). Note which one fired.
          error_pct_5xx / error_pct_4xx are the gateway-wide shares; total_rps is completed HTTP
          request volume; dc_rps is client disconnects (response_code=0), which are excluded from
          the ratio. Interpret: a high ratio with high total_rps means major user-facing impact. A
          high ratio with low total_rps means a severe ratio but a small absolute blast radius. A
          sudden drop in total_rps at the same time can mean clients are giving up or an upstream
          LB stopped sending traffic. Always report against the alert's own gateway
          ($namespace/$job in $cluster).
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "Gateway-wide 5xx and 4xx share, completed request rate and client-disconnect rate."
            params:
              queries:
                - name: error_pct_5xx
                  unit: "%"
                  query: '100 * sum by (cluster, namespace, job) (rate(istio_requests_total{cluster="$cluster",namespace="$namespace",job="$job",reporter="source",request_protocol=~"http|http2",response_code=~"5.."}[5m])) / sum by (cluster, namespace, job) (rate(istio_requests_total{cluster="$cluster",namespace="$namespace",job="$job",reporter="source",request_protocol=~"http|http2",response_code=~"[2-5].."}[5m]))'
                  panel: true
                  panel_title: "Gateway 5xx %"
                  panel_id: "istio-gw-5xx-pct"
                - name: error_pct_4xx
                  unit: "%"
                  query: '100 * sum by (cluster, namespace, job) (rate(istio_requests_total{cluster="$cluster",namespace="$namespace",job="$job",reporter="source",request_protocol=~"http|http2",response_code=~"4.."}[10m])) / sum by (cluster, namespace, job) (rate(istio_requests_total{cluster="$cluster",namespace="$namespace",job="$job",reporter="source",request_protocol=~"http|http2",response_code=~"[2-5].."}[10m]))'
                  panel: true
                  panel_title: "Gateway 4xx %"
                  panel_id: "istio-gw-4xx-pct"
                - name: total_rps
                  query: 'sum by (cluster, namespace, job) (rate(istio_requests_total{cluster="$cluster",namespace="$namespace",job="$job",reporter="source",request_protocol=~"http|http2",response_code=~"[2-5].."}[5m]))'
                  panel: true
                  panel_title: "Gateway Completed Requests/s"
                  panel_id: "istio-gw-total-rps"
                - name: dc_rps
                  query: 'sum by (cluster, namespace, job) (rate(istio_requests_total{cluster="$cluster",namespace="$namespace",job="$job",reporter="source",request_protocol=~"http|http2",response_code="0"}[5m])) or vector(0)'
      - step: 2
        title: "Find which destinations, status codes and Envoy flags carry the errors"
        description: >-
          errors_by_destination lists the destination services producing the errors;
          errors_by_code_flags breaks the errors down by response_code and response_flags.
          Interpret: one or two destinations dominate, so the problem is backend-specific (continue
          with the IstioGatewayDestinationErrorRate entry for that service). Errors spread across
          many destinations point to a gateway-wide or shared cause: gateway pod saturation, a bad
          Gateway/VirtualService push, mTLS or certificate problems, or a shared dependency.
          Flag '-' means the upstream application returned the error. 503 UH = no healthy upstream
          (no ready endpoints or all ejected by outlier detection). 503 UF = upstream connect
          failure. 503 UR/URX = upstream reset or retries exhausted. 504 UT = route timeout.
          404 NR = no route matched (routing config). 403 with an RBAC-denied flag = AuthorizationPolicy.
          429 RL = rate limited. 503 UO = circuit breaker overflow.
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "Error volume by destination service, and by response_code + response_flags."
            params:
              queries:
                - name: errors_by_destination
                  query: 'topk(10, sum by (destination_service_namespace, destination_service_name, response_code) (rate(istio_requests_total{cluster="$cluster",namespace="$namespace",job="$job",reporter="source",request_protocol=~"http|http2",response_code=~"[45].."}[5m])))'
                  panel: true
                  panel_title: "Errors by Destination"
                  panel_id: "istio-gw-errors-by-destination"
                - name: errors_by_code_flags
                  query: 'topk(10, sum by (response_code, response_flags) (rate(istio_requests_total{cluster="$cluster",namespace="$namespace",job="$job",reporter="source",request_protocol=~"http|http2",response_code=~"[45].."}[5m])))'
                  panel: true
                  panel_title: "Errors by Code and Flags"
                  panel_id: "istio-gw-errors-by-code-flags"
      - step: 3
        title: "Rule out the gateway pods themselves"
        description: >-
          When errors are spread across destinations, check the gateway pods. Restarts, OOM kills,
          not-ready pods or CPU throttling on the gateway explain gateway-wide 503s and resets.
          A recent istiod config push (Gateway, VirtualService, DestinationRule, AuthorizationPolicy,
          PeerAuthentication) that lines up with the error onset is the most common cause of a
          sudden gateway-wide 404 NR or 503 spike.
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "Gateway pod restarts, termination reasons and readiness."
            params:
              queries:
                - name: gateway_pod_restarts_30m
                  query: 'topk(5, increase(kube_pod_container_status_restarts_total{namespace="$namespace",container="istio-proxy"}[30m]))'
                - name: gateway_pod_last_terminated
                  query: 'kube_pod_container_status_last_terminated_reason{namespace="$namespace",container="istio-proxy",reason=~"OOMKilled|Error"} == 1'
                - name: gateway_pod_notready
                  query: 'kube_pod_status_ready{namespace="$namespace",condition="true"} == 0'
          - tool_id: "tool.read_logs"
            description: "istio-proxy access logs on the gateway pods filtered for 5xx/4xx responses and their response flags and upstream cluster."
            params:
              tail_lines: 200
    remediation:
      - action: "fix_failing_backend"
        description: "When step 2 shows one or a few destinations dominating: treat it as a backend incident. Restore ready endpoints, roll back a bad deployment or fix the dependency (see IstioGatewayDestinationErrorRate)."
        tool_id: ""
        requires_approval: true
      - action: "revert_mesh_config_change"
        description: "When a recent Gateway/VirtualService/DestinationRule/AuthorizationPolicy change lines up with the onset (NR, RBAC-denied, mTLS failures): revert or correct the resource and confirm the error ratio recovers."
        tool_id: ""
        requires_approval: true
      - action: "recover_gateway_pods"
        description: "When the gateway pods are OOMKilled, crashlooping or throttled: raise their resources, scale the gateway deployment, or restart unhealthy replicas."
        tool_id: "forge.restart_deployment"
        requires_approval: true
    escalation: "Platform/networking on-call immediately for IstioGatewayCritical5xxErrorRate (user-facing outage, P1). IstioGatewayHigh5xxErrorRate is degraded service; work it urgently but it does not page. IstioGatewayHigh4xxErrorRate is usually a config, auth or client issue; work it during the day unless it follows a mesh config change that broke a production route."
    follow_up:
      - "Confirm the gateway 5xx/4xx share returns below threshold and total request volume returns to baseline."
      - "If a mesh config change caused it, add validation (istioctl analyze in CI) for that resource type."

  # ============================================================ DESTINATION 5xx / 4xx
  - name: "IstioGatewayDestinationErrorRate"
    patterns:
      [
        "IstioGatewayDestinationHigh5xxErrorRate",
        "IstioGatewayDestinationLowTrafficHigh5xxErrorRate",
        "IstioGatewayDestinationHigh4xxErrorRate",
        "istio destination 5xx",
        "istio destination 4xx",
        "backend error rate through gateway",
      ]
    priority: P2
    diagnostic_steps:
      - step: 1
        title: "Recompute the destination's error ratio and classify it with response_flags"
        description: >-
          This entry serves IstioGatewayDestinationHigh5xxErrorRate (more than 5% 5xx over 5m with at
          least 10 errors and 150 requests, warning/P2), IstioGatewayDestinationLowTrafficHigh5xxErrorRate
          (more than 50% 5xx with at least 5 errors but fewer than 150 requests in 5m, warning/P2;
          a low-traffic service that is effectively down) and IstioGatewayDestinationHigh4xxErrorRate
          (more than 20% 4xx over 10m with at least 50 errors and 300 requests, warning/P3).
          Name the destination as $destination_service_namespace/$destination_service_name.
          codes_and_flags splits its errors by response_code and response_flags. Interpret: flag '-'
          means the application answered with the error (look at the app). UH means no healthy or
          ready endpoints. UF/UR mean connections to the pods fail or reset (pods crashing, wrong
          port, mTLS mismatch). UT means the route timeout was hit (slow backend). For Knative
          revisions, 503/504 through the activator usually mean the revision failed to scale from
          zero or its pods are not becoming ready.
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "The destination's error share, request rate and breakdown by response_code + response_flags."
            params:
              queries:
                - name: error_pct_5xx
                  unit: "%"
                  query: '100 * sum(rate(istio_requests_total{cluster="$cluster",namespace="$namespace",job="$job",reporter="source",request_protocol=~"http|http2",destination_service_namespace="$destination_service_namespace",destination_service_name="$destination_service_name",response_code=~"5.."}[5m])) / sum(rate(istio_requests_total{cluster="$cluster",namespace="$namespace",job="$job",reporter="source",request_protocol=~"http|http2",destination_service_namespace="$destination_service_namespace",destination_service_name="$destination_service_name",response_code=~"[2-5].."}[5m]))'
                  panel: true
                  panel_title: "Destination 5xx %"
                  panel_id: "istio-dest-5xx-pct"
                - name: error_pct_4xx
                  unit: "%"
                  query: '100 * sum(rate(istio_requests_total{cluster="$cluster",namespace="$namespace",job="$job",reporter="source",request_protocol=~"http|http2",destination_service_namespace="$destination_service_namespace",destination_service_name="$destination_service_name",response_code=~"4.."}[10m])) / sum(rate(istio_requests_total{cluster="$cluster",namespace="$namespace",job="$job",reporter="source",request_protocol=~"http|http2",destination_service_namespace="$destination_service_namespace",destination_service_name="$destination_service_name",response_code=~"[2-5].."}[10m]))'
                  panel: true
                  panel_title: "Destination 4xx %"
                  panel_id: "istio-dest-4xx-pct"
                - name: total_rps
                  query: 'sum(rate(istio_requests_total{cluster="$cluster",namespace="$namespace",job="$job",reporter="source",request_protocol=~"http|http2",destination_service_namespace="$destination_service_namespace",destination_service_name="$destination_service_name",response_code=~"[2-5].."}[5m]))'
                - name: codes_and_flags
                  query: 'sum by (response_code, response_flags) (rate(istio_requests_total{cluster="$cluster",namespace="$namespace",job="$job",reporter="source",request_protocol=~"http|http2",destination_service_namespace="$destination_service_namespace",destination_service_name="$destination_service_name",response_code=~"[45].."}[5m]))'
                  panel: true
                  panel_title: "Destination Errors by Code and Flags"
                  panel_id: "istio-dest-errors-by-code-flags"
      - step: 2
        title: "Check the destination pods"
        description: >-
          Check readiness, restarts and termination reasons for the pods behind the destination
          service. Not-ready or crashlooping pods explain UH/UF/UR. OOMKilled points to memory
          limits. If the pods look healthy and the flag is '-', read the application logs for the
          error responses and compare against the latest deployment.
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "Destination pod readiness, restarts and termination reasons."
            params:
              queries:
                - name: dest_pod_notready
                  query: 'kube_pod_status_ready{namespace="$destination_service_namespace",condition="true"} == 0'
                - name: dest_pod_restarts_30m
                  query: 'topk(5, increase(kube_pod_container_status_restarts_total{namespace="$destination_service_namespace"}[30m]))'
                - name: dest_pod_last_terminated
                  query: 'kube_pod_container_status_last_terminated_reason{namespace="$destination_service_namespace",reason=~"OOMKilled|Error"} == 1'
          - tool_id: "tool.capture_diagnostics"
            description: "Pod state, events and recent rollouts in the destination namespace."
          - tool_id: "tool.read_logs"
            description: "Application logs for the destination pods filtered for errors around the alert onset."
            params:
              tail_lines: 200
    remediation:
      - action: "rollback_or_fix_destination"
        description: "When the error onset lines up with a deployment of the destination service: roll back. When pods are not ready or crashlooping: fix the cause (resources, config, dependency) so endpoints return."
        tool_id: "forge.restart_deployment"
        requires_approval: true
      - action: "fix_routing_or_auth_config"
        description: "For 4xx (404 NR, 403 RBAC-denied, 401) or mTLS-related UF: correct the VirtualService, AuthorizationPolicy, RequestAuthentication or DestinationRule for this service."
        tool_id: ""
        requires_approval: true
    escalation: "Owning team of the destination service for 5xx with flag '-' (application errors). Platform/networking on-call when flags show UH/UF/UR across replicas, or when a mesh config change is involved."
    follow_up:
      - "Confirm the destination's 5xx/4xx share returns below threshold."
      - "If the service regularly scales from zero (Knative), review min-scale and readiness so cold starts do not surface as 503/504 at the gateway."

  # ============================================================ LATENCY
  - name: "IstioGatewayLatency"
    patterns:
      [
        "IstioGatewayHighLatency",
        "IstioGatewayDestinationHighLatency",
        "istio gateway latency",
        "istio p99 latency",
        "slow requests through gateway",
      ]
    priority: P2
    diagnostic_steps:
      - step: 1
        title: "Recompute p99/p50 for successful requests and find which destinations are slow"
        description: >-
          This entry serves IstioGatewayHighLatency (gateway-wide p99 of successful 2xx/3xx requests
          above 2.5s with at least 300 requests in 5m, held for 10m, warning/P2) and
          IstioGatewayDestinationHighLatency (one destination's p99 above 5s with at least 150
          requests in 5m, held for 15m, warning/P3). Durations are measured by the gateway's Envoy
          from request start to response completion, so they include backend time and response
          transfer. p99_by_destination ranks destinations by p99. Interpret: one destination far
          above the rest means a backend-specific slowdown (step 2). Many destinations slow at once
          means a gateway-wide or shared cause: gateway pod CPU saturation, a shared dependency
          (database, auth service), or node/network problems. p99 high but p50 normal means a slow
          tail (some requests or some pods); p50 also high means the whole service is slow.
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "Gateway p99/p50 for successful requests and the slowest destinations by p99."
            params:
              queries:
                - name: gateway_p99_s
                  unit: "s"
                  query: 'histogram_quantile(0.99, sum by (le) (rate(istio_request_duration_milliseconds_bucket{cluster="$cluster",namespace="$namespace",job="$job",reporter="source",request_protocol=~"http|http2",response_code=~"[23].."}[5m]))) / 1000'
                  panel: true
                  panel_title: "Gateway p99 (successful)"
                  panel_id: "istio-gw-p99"
                - name: gateway_p50_s
                  unit: "s"
                  query: 'histogram_quantile(0.50, sum by (le) (rate(istio_request_duration_milliseconds_bucket{cluster="$cluster",namespace="$namespace",job="$job",reporter="source",request_protocol=~"http|http2",response_code=~"[23].."}[5m]))) / 1000'
                - name: p99_by_destination
                  unit: "s"
                  query: 'topk(10, histogram_quantile(0.99, sum by (le, destination_service_namespace, destination_service_name) (rate(istio_request_duration_milliseconds_bucket{cluster="$cluster",namespace="$namespace",job="$job",reporter="source",request_protocol=~"http|http2",response_code=~"[23].."}[5m]))) / 1000)'
                  panel: true
                  panel_title: "p99 by Destination"
                  panel_id: "istio-gw-p99-by-destination"
      - step: 2
        title: "Rule out larger responses, timeouts and saturation"
        description: >-
          avg_response_bytes compares the destination's current average response size with a day
          ago: a jump means the slowdown is transfer time (a release returning much bigger payloads,
          or clients downloading large files), not slower processing. timeout_rps shows requests
          already failing with 504 UT (those are excluded from the latency alert and belong to the
          5xx alerts; rising timeouts with rising p99 means the backend is degrading toward an
          outage). For the pods behind the destination, CPU throttling, restarts or recent rollouts
          lining up with the onset point to the cause. For Knative revisions, check whether
          instances are scaling up from zero or are capped by max-scale/concurrency.
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "Response size now vs a day ago, gateway timeouts, and CPU throttling of the destination's pods."
            params:
              queries:
                - name: avg_response_bytes
                  query: 'sum(rate(istio_response_bytes_sum{cluster="$cluster",namespace="$namespace",job="$job",reporter="source",destination_service_namespace="$destination_service_namespace",destination_service_name="$destination_service_name"}[5m])) / sum(rate(istio_response_bytes_count{cluster="$cluster",namespace="$namespace",job="$job",reporter="source",destination_service_namespace="$destination_service_namespace",destination_service_name="$destination_service_name"}[5m]))'
                - name: avg_response_bytes_1d_ago
                  query: 'sum(rate(istio_response_bytes_sum{cluster="$cluster",namespace="$namespace",job="$job",reporter="source",destination_service_namespace="$destination_service_namespace",destination_service_name="$destination_service_name"}[5m] offset 1d)) / sum(rate(istio_response_bytes_count{cluster="$cluster",namespace="$namespace",job="$job",reporter="source",destination_service_namespace="$destination_service_namespace",destination_service_name="$destination_service_name"}[5m] offset 1d))'
                - name: timeout_rps
                  query: 'sum by (destination_service_name) (rate(istio_requests_total{cluster="$cluster",namespace="$namespace",job="$job",reporter="source",request_protocol=~"http|http2",response_code="504"}[5m])) or vector(0)'
                - name: dest_cpu_throttling
                  query: 'topk(5, sum by (pod) (rate(container_cpu_cfs_throttled_periods_total{namespace="$destination_service_namespace"}[5m])) / sum by (pod) (rate(container_cpu_cfs_periods_total{namespace="$destination_service_namespace"}[5m])))'
          - tool_id: "tool.capture_diagnostics"
            description: "Pod state, events and recent rollouts in the destination namespace."
    remediation:
      - action: "fix_slow_backend"
        description: "When one destination is slow: roll back a deployment that lines up with the onset, relieve CPU throttling (raise limits or scale out), or fix the slow dependency. For Knative, raise min-scale or adjust concurrency so requests are not queued behind cold starts."
        tool_id: "forge.scale_deployment"
        requires_approval: true
      - action: "accept_or_tune_threshold"
        description: "When the slowness comes from larger responses or an endpoint that is slow by design (exports, reports, downloads): no incident; raise the threshold for that destination instead of silencing the alert."
        tool_id: ""
        requires_approval: true
    escalation: "Owning team of the slow destination service. Platform/networking on-call when many destinations are slow at once or the gateway pods are saturated."
    follow_up:
      - "Confirm p99 for successful requests returns below threshold."
      - "If a destination is legitimately slow, record its normal p99 and set a per-service threshold."
