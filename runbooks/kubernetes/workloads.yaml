key_metrics:
  - name: "kube_pod_container_status_waiting_reason"
    threshold: "reason=CrashLoopBackOff, ErrImagePull, ImagePullBackOff"
    severity: high
  - name: "kube_pod_container_status_restarts_total"
    threshold: "increase > 5 in 15m"
    severity: critical
  - name: "container_cpu_cfs_throttled_periods_total / container_cpu_cfs_periods_total"
    threshold: "> 25% throttled periods for 10m"
    severity: medium
  - name: "kube_pod_status_ready"
    threshold: "condition=true equals 0 for 15m"
    severity: high
  - name: "kube_deployment_status_replicas_available"
    threshold: "below desired replicas for 15m"
    severity: high
  - name: "kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes"
    threshold: "< 15% warning, < 5% critical"
    severity: high
  - name: "kube_horizontalpodautoscaler_status_desired_replicas"
    threshold: "equal to max replicas for 15m"
    severity: medium

escalation:
  P1: "Immediate page: SRE + owning service team. Production impact likely."
  P2: "Notify platform and service owner in on-call channel; investigate within 15 minutes."
  P3: "Open scheduled follow-up task; resolve during business hours."
