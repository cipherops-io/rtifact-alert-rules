tech_stack: kubernetes-workloads
version: "1.0"
description: "Runbook for Kubernetes workload alerts across pods, rollouts, batch jobs, autoscaling, and persistent volumes. Includes diagnosis flows, remediation guidance, and escalation rules for production operations."

match_keywords:
  - kubernetes workloads
  - crashloopbackoff
  - oomkilled
  - cpu throttling
  - imagepullbackoff
  - pod pending
  - rollout stuck
  - hpa max replicas
  - pvc full
  - persistent volume failed
  - cronjob suspended

categories:
  - CONTAINER
  - APPLICATION
  - INFRASTRUCTURE
  - STORAGE
  - AUTOSCALING

common_alerts:
  - name: "KubePodCrashLooping"
    patterns: ["KubePodCrashLooping", "CrashLoopBackOff", "container restart loop"]
    priority: P1
    diagnostic_steps:
      - step: 1
        title: "Confirm the crash loop and classify the termination"
        description: >-
          Pull the live crash-loop metric pack from VictoriaMetrics so the RCA names a
          concrete failure class instead of "pod is crash looping, check logs". The
          exit code and last terminated reason are the primary classifiers — branch on
          them BEFORE anything else:
          exit_code=0  / reason=Completed         => process exited cleanly but the
            controller expects a long-running service (wrong command/args/mode).
          exit_code=1  / reason=Error             => generic app/config/runtime failure
            (missing env/secret/configmap, bad config, failed dependency at startup).
          exit_code=2                              => CLI usage / bad argument.
          exit_code=126 / reason=ContainerCannotRun=> command found but not executable
            (permission / exec-bit / shell mismatch).
          exit_code=127                            => command not found / bad image
            entrypoint / missing binary / bad PATH.
          exit_code=137 / reason=OOMKilled         => SIGKILL, almost always OOM — jump
            to step 2 and treat as a memory-sizing problem, NOT a generic crash loop.
          exit_code=139                            => SIGSEGV / native crash.
          exit_code=143 / reason=Error+SIGTERM     => graceful-stop signal, usually
            rollout/preemption/shutdown, not an app bug.
          Use restarts_15m / restart_rate to gauge severity, and container_ready=0 with
          pod_ready=0 to confirm the workload is actually down (not a single flap).
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "Confirm CrashLoopBackOff, restart count/rate, last terminated reason (OOMKilled/Error/Completed/ContainerCannotRun), exit code, and readiness."
            params:
              queries:
                - name: crashloop_active
                  query: 'max(max_over_time(kube_pod_container_status_waiting_reason{namespace="$namespace",pod=~"$workload-.*",container="$container",reason="CrashLoopBackOff"}[5m]))'
                - name: last_exit_code
                  query: 'max(kube_pod_container_status_last_terminated_exitcode{namespace="$namespace",pod=~"$workload-.*",container="$container"})'
                - name: term_reason_oomkilled
                  query: 'max(kube_pod_container_status_last_terminated_reason{namespace="$namespace",pod=~"$workload-.*",container="$container",reason="OOMKilled"})'
                - name: term_reason_error
                  query: 'max(kube_pod_container_status_last_terminated_reason{namespace="$namespace",pod=~"$workload-.*",container="$container",reason="Error"})'
                - name: term_reason_completed
                  query: 'max(kube_pod_container_status_last_terminated_reason{namespace="$namespace",pod=~"$workload-.*",container="$container",reason="Completed"})'
                - name: term_reason_cannot_run
                  query: 'max(kube_pod_container_status_last_terminated_reason{namespace="$namespace",pod=~"$workload-.*",container="$container",reason="ContainerCannotRun"})'
                - name: restarts_15m
                  query: 'max(increase(kube_pod_container_status_restarts_total{namespace="$namespace",pod=~"$workload-.*",container="$container"}[15m]))'
                - name: restarts_6h
                  query: 'max(increase(kube_pod_container_status_restarts_total{namespace="$namespace",pod=~"$workload-.*",container="$container"}[6h]))'
                - name: restart_rate_per_min_5m
                  unit: "restarts/min"
                  query: 'max(rate(kube_pod_container_status_restarts_total{namespace="$namespace",pod=~"$workload-.*",container="$container"}[5m]))*60'
                - name: container_ready
                  query: 'max(kube_pod_container_status_ready{namespace="$namespace",pod=~"$workload-.*",container="$container"})'
                - name: container_running
                  query: 'max(kube_pod_container_status_running{namespace="$namespace",pod=~"$workload-.*",container="$container"})'
                - name: pod_ready
                  query: 'max(kube_pod_status_ready{namespace="$namespace",pod=~"$workload-.*",condition="true"})'
      - step: 2
        title: "Rule out OOMKilled and resource starvation"
        description: >-
          CrashLoopBackOff and OOMKilled overlap heavily, so explicitly disprove memory
          before blaming the app. Interpret: term_reason_oomkilled==1 OR last_exit_code==137
          => this is an OOM, root cause = container exceeded its memory limit (right-size
          memory, request==limit per policy) — do NOT keep hunting config/dependency.
          mem_peak_pct >= 90 with positive mem_slope and no traffic => leak/unbounded
          growth approaching the limit. cpu_throttle_pct high with a cpu_limit set =>
          CFS throttling can stall startup and trip liveness probes (platform policy is
          no CPU limit). If memory/CPU are comfortably below limits, eliminate resources
          as the cause and proceed to app/config/image analysis.
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "Memory working-set vs limit %, 6h peak %, growth slope, request==limit, CPU limit policy + throttling, node memory pressure."
            params:
              queries:
                - name: mem_util_pct
                  unit: "%"
                  query: '100*max(container_memory_working_set_bytes{namespace="$namespace",pod=~"$workload-.*",container="$container"})/max(kube_pod_container_resource_limits{namespace="$namespace",pod=~"$workload-.*",container="$container",resource="memory"})'
                - name: mem_peak_pct_6h
                  unit: "%"
                  query: '100*max(max_over_time(container_memory_working_set_bytes{namespace="$namespace",pod=~"$workload-.*",container="$container"}[6h]))/max(kube_pod_container_resource_limits{namespace="$namespace",pod=~"$workload-.*",container="$container",resource="memory"})'
                - name: mem_slope_mib_per_min
                  unit: "MiB/min"
                  query: 'max(deriv(container_memory_working_set_bytes{namespace="$namespace",pod=~"$workload-.*",container="$container"}[2h]))*60/1024/1024'
                - name: mem_request_minus_limit_mib
                  unit: "MiB"
                  query: '(max(kube_pod_container_resource_requests{namespace="$namespace",pod=~"$workload-.*",container="$container",resource="memory"})-max(kube_pod_container_resource_limits{namespace="$namespace",pod=~"$workload-.*",container="$container",resource="memory"}))/1024/1024'
                - name: cpu_limit_cores
                  unit: "cores"
                  query: 'max(kube_pod_container_resource_limits{namespace="$namespace",pod=~"$workload-.*",container="$container",resource="cpu"})'
                - name: cpu_throttle_pct
                  unit: "%"
                  query: '100*max(rate(container_cpu_cfs_throttled_periods_total{namespace="$namespace",pod=~"$workload-.*",container="$container"}[5m]))/max(rate(container_cpu_cfs_periods_total{namespace="$namespace",pod=~"$workload-.*",container="$container"}[5m]))'
                - name: node_memory_pressure
                  query: 'max(kube_node_status_condition{node="$node",condition="MemoryPressure",status="true"})'
      - step: 3
        title: "Check image/config waiting reasons and rollout drift"
        description: >-
          Separate "container never started" from "container started then crashed", and
          check whether a rollout introduced the failure. Interpret:
          waiting_image>0 (ImagePullBackOff/ErrImagePull) => bad tag, registry auth, or
          missing image — not an app crash. waiting_config>0 (CreateContainerConfigError/
          CreateContainerError) => missing/renamed ConfigMap/Secret/env/volume reference.
          newest_rs_age_min small (roughly <30m) AND the crash window lines up with it,
          or deploy_generation_lag>0 / deploy_unavailable>0 => a recent rollout shipped a
          bad image/config — rollback is the fast path. If no rollout and no image/config
          waiting reason, the failure is in-process (config drift, rotated secret, expired
          cert, dependency outage) and the previous-container logs in step 5 are decisive.
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "Image-pull / config-error waiting reasons and deployment rollout drift (generation lag, unavailable replicas, newest ReplicaSet age)."
            params:
              queries:
                - name: waiting_image
                  query: 'max(max_over_time(kube_pod_container_status_waiting_reason{namespace="$namespace",pod=~"$workload-.*",container="$container",reason=~"ImagePullBackOff|ErrImagePull"}[15m]))'
                - name: waiting_config
                  query: 'max(max_over_time(kube_pod_container_status_waiting_reason{namespace="$namespace",pod=~"$workload-.*",container="$container",reason=~"CreateContainerConfigError|CreateContainerError"}[15m]))'
                - name: deploy_generation_lag
                  query: 'max(kube_deployment_metadata_generation{namespace="$namespace",deployment="$workload"})-max(kube_deployment_status_observed_generation{namespace="$namespace",deployment="$workload"})'
                - name: deploy_unavailable
                  query: 'max(kube_deployment_status_replicas_unavailable{namespace="$namespace",deployment="$workload"})'
                - name: newest_rs_age_min
                  unit: "min"
                  query: '(time()-max(kube_replicaset_created{namespace="$namespace",owner_name="$workload"}))/60'
      - step: 4
        title: "Capture pod state, events, and crash metadata"
        description: "Confirm the metric pack against describe/events — BackOff, probe failures (Liveness/Readiness/Startup), Killing, FailedMount, and the last-state termination block (reason, exit code, finishedAt, restartCount)."
        tool_calls:
          - tool_id: "tool.capture_diagnostics"
            description: "Pod status / warning events / describe — BackOff, probe failures, config-mount errors, last terminated reason and exit code."
          - tool_id: "tool.get_crash_context"
            description: "Crash reason, container, exit code, and recent failures for the crashed pod."
      - step: 5
        title: "Read crash context from the previous (killed) container"
        description: "Inspect the PREVIOUS container's logs (not the freshly restarted one) for the exact fatal line — config/env/secret errors, dependency timeout/DNS/auth/TLS failures, probe path errors, permission/filesystem errors, or language stack traces (Traceback/panic/NPE)."
        tool_calls:
          - tool_id: "tool.read_logs"
            description: "Previous-container logs filtered for fatal/panic/config/secret/dependency/permission/probe signatures."
            params:
              previous: true
              tail_lines: 200
    remediation:   # only for suggestion — never auto-executed (forge.* are approval-gated)
      - action: "rollback_deployment"
        description: "Primary fix when the crash loop began right after a rollout (small newest_rs_age_min, generation lag, or a bad image/config in the new revision)."
        tool_id: "forge.revert_deployment"
        requires_approval: true
      - action: "patch_resources"
        description: "ONLY if step 2 proved OOM (reason=OOMKilled / exit 137 / mem_peak_pct high): right-size memory, raising request AND limit together (keep request==limit) to ~1.3x the observed 6h peak."
        tool_id: "forge.patch_resources"
        requires_approval: true
      - action: "restart_deployment"
        description: "Only to restore availability when the cause is a transient external dependency (e.g. DB not ready at startup) and config is valid. NOT a fix for a deterministic config/code crash — it will just loop back into the same failure."
        tool_id: "forge.restart_deployment"
        requires_approval: true
    escalation: "App team and SRE on-call if multiple replicas are impacted or customer traffic is degraded. Route by exit code — 137: SRE (memory sizing); 1/2/139: app team (code/config); 126/127/ImagePull/config-error: platform (image, secret, configmap)."
    follow_up:
      - "Once the previous-container logs name the exact failure, file the concrete fix (config key, secret, image tag, command/args) rather than a generic 'enable tracing'."
      - "If a rollout caused it, confirm the offending revision and verify the new revision's config/secret references before re-rolling."

  - name: "KubePodOOMKilled"
    patterns: ["KubePodOOMKilled", "OOMKilled", "out of memory"]
    priority: P1
    diagnostic_steps:
      - step: 1
        title: "Quantify the OOM kill and memory headroom"
        description: >-
          Pull the live OOM metric pack from VictoriaMetrics. Percentages, the 6h
          peak and the growth slope are pre-computed in PromQL so the RCA is
          grounded in real numbers, not a generic 'memory spike'. Interpret:
          peak_pct >= 90 with request==limit => limit too low / undersized;
          positive slope with no traffic => leak/unbounded growth;
          node_memory_pressure or pod_evicted => node-level, not just the container.
          If util/peak is LOW despite an OOM, do NOT recommend raising the limit —
          suspect a transient spike or a sibling container and capture a profile.
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "Confirm exit 137 / OOMKilled, memory working-set vs limit %, 6h peak %, growth slope, request==limit and CPU-limit policy, node memory pressure."
            params:
              queries:
                - name: oom_confirmed
                  query: 'max(kube_pod_container_status_last_terminated_reason{namespace="$namespace",pod=~"$workload-.*",container="$container",reason="OOMKilled"})'
                - name: last_exit_code
                  query: 'max(kube_pod_container_status_last_terminated_exitcode{namespace="$namespace",pod=~"$workload-.*",container="$container"})'
                - name: restarts_6h
                  query: 'max(increase(kube_pod_container_status_restarts_total{namespace="$namespace",pod=~"$workload-.*",container="$container"}[6h]))'
                - name: mem_working_set_mib
                  unit: "MiB"
                  query: 'max(container_memory_working_set_bytes{namespace="$namespace",pod=~"$workload-.*",container="$container"})/1024/1024'
                - name: mem_limit_mib
                  unit: "MiB"
                  query: 'max(kube_pod_container_resource_limits{namespace="$namespace",pod=~"$workload-.*",container="$container",resource="memory"})/1024/1024'
                - name: mem_request_mib
                  unit: "MiB"
                  query: 'max(kube_pod_container_resource_requests{namespace="$namespace",pod=~"$workload-.*",container="$container",resource="memory"})/1024/1024'
                - name: mem_util_pct
                  unit: "%"
                  query: '100*max(container_memory_working_set_bytes{namespace="$namespace",pod=~"$workload-.*",container="$container"})/max(kube_pod_container_resource_limits{namespace="$namespace",pod=~"$workload-.*",container="$container",resource="memory"})'
                - name: mem_peak_6h_mib
                  unit: "MiB"
                  query: 'max(max_over_time(container_memory_working_set_bytes{namespace="$namespace",pod=~"$workload-.*",container="$container"}[6h]))/1024/1024'
                - name: mem_peak_pct
                  unit: "%"
                  query: '100*max(max_over_time(container_memory_working_set_bytes{namespace="$namespace",pod=~"$workload-.*",container="$container"}[6h]))/max(kube_pod_container_resource_limits{namespace="$namespace",pod=~"$workload-.*",container="$container",resource="memory"})'
                - name: mem_slope_mib_per_min
                  unit: "MiB/min"
                  query: 'max(deriv(container_memory_working_set_bytes{namespace="$namespace",pod=~"$workload-.*",container="$container"}[2h]))*60/1024/1024'
                - name: cpu_limit_cores
                  unit: "cores"
                  query: 'max(kube_pod_container_resource_limits{namespace="$namespace",pod=~"$workload-.*",container="$container",resource="cpu"})'
                - name: node_memory_pressure
                  query: 'max(kube_node_status_condition{node="$node",condition="MemoryPressure",status="true"})'
                - name: pod_evicted
                  query: 'max(kube_pod_status_reason{namespace="$namespace",pod=~"$workload-.*",reason="Evicted"})'
      - step: 2
        title: "Confirm termination reason and OOM events"
        description: "Cross-check the metric pack with KSM OOM-kill events and the pod describe/events bundle (Last State: Terminated, Reason: OOMKilled, Exit Code: 137)."
        tool_calls:
          - tool_id: "tool.get_oom_events"
            description: "OOM kill events and affected containers for the workload."
          - tool_id: "tool.capture_diagnostics"
            description: "Pod status / warning events / describe — confirm OOMKilled termination and restart count."
      - step: 3
        title: "Assess resource saturation and QoS policy"
        description: "Compare memory usage against requests/limits and QoS; verify the desired policy (memory request==limit, no CPU limit => Burstable, not Guaranteed)."
        tool_calls:
          - tool_id: "tool.get_resource_saturation"
            description: "CPU/memory saturation vs requests/limits and pod QoS class."
      - step: 4
        title: "Read crash context from the killed container"
        description: "Inspect the PREVIOUS container's logs (not the freshly restarted one) for leak, large-payload/file-processing, or unbounded-cache signatures."
        tool_calls:
          - tool_id: "tool.get_crash_context"
            description: "Crash reason, container, exit code, and last log lines of the crashed pod."
          - tool_id: "tool.read_logs"
            description: "Previous-container logs filtered for memory/OOM/large-payload signatures."
            params:
              previous: true
              tail_lines: 200
    remediation:   # only for suggestion — never auto-executed (forge.* are approval-gated)
      - action: "patch_resources"
        description: "Right-size memory: raise request AND limit together (keep request==limit per policy) to ~1.3x the observed 6h peak. Primary fix when peak/util is high against the limit."
        tool_id: "forge.patch_resources"
        requires_approval: true
      - action: "remove_cpu_limit"
        description: "If a CPU limit is set, remove it (platform policy: no CPU limits, avoid CFS throttling); keep memory request==limit."
        tool_id: "forge.patch_resources"
        requires_approval: true
      - action: "rollback_deployment"
        description: "Roll back if a deployment shortly preceded the OOM (memory regression in the new revision)."
        tool_id: "forge.revert_deployment"
        requires_approval: true
      - action: "scale_out_replicas"
        description: "Only if traffic/concurrency is driving memory pressure — spreads load, does NOT fix a per-request leak."
        tool_id: "forge.scale_deployment"
        requires_approval: true
      - action: "restart_deployment"
        description: "Only to restore availability if the pod is crashlooping/stuck after the OOM. Not a root-cause fix."
        tool_id: "forge.restart_deployment"
        requires_approval: true
    escalation: "SRE for limit tuning; app team if leak or runaway workload behavior is suspected."
    follow_up:
      - "If the slope indicates a leak, capture a heap/profile dump from a live pod before the next kill."
      - "Confirm the memory request==limit and no-CPU-limit policy is applied to this workload."

  - name: "KubePodCPUThrottlingHigh"
    patterns: ["KubePodCPUThrottlingHigh", "CPU throttling", "container CPU throttled", "CFS throttling"]
    priority: P2
    diagnostic_steps:
      - step: 1
        title: "Confirm throttling ratio"
        description: "Validate that throttled CFS periods are sustained above the threshold and isolate the affected container."
        tool_calls:
          - tool_id: "tool.fetch_metrics"
            description: "Compare container_cpu_cfs_throttled_periods_total and container_cpu_cfs_periods_total for the affected namespace/pod/container."
      - step: 2
        title: "Compare CPU usage with limits"
        description: "Check whether the workload is hitting a low CPU limit, running under burstable QoS, or contending with other pods on the node."
        tool_calls:
          - tool_id: "tool.get_resource_saturation"
            description: "Review CPU usage, CPU requests/limits, pod QoS, and node CPU saturation for the alert window."
      - step: 3
        title: "Inspect workload impact"
        description: "Correlate throttling with latency, timeout spikes, failed requests, or slowed background processing."
        tool_calls:
          - tool_id: "tool.read_logs"
            description: "Review application logs for timeouts, queue buildup, deadline exceeded errors, and slow processing during the throttling window."
    remediation:
      - action: "patch_resources"
        description: "Tune CPU limits/requests when throttling is caused by an undersized limit. Consider removing CPU limits for latency-sensitive workloads after review."
        tool_id: "forge.patch_resources"
        requires_approval: true
      - action: "scale_out_replicas"
        description: "Temporarily add replicas if throttling is load-driven and the service can scale horizontally."
        tool_id: "forge.scale_deployment"
        requires_approval: true
    escalation: "SRE and owning service team if throttling correlates with latency, timeout spikes, or failed customer traffic."

  - name: "KubeContainerWaiting"
    patterns: ["KubeContainerWaiting", "ContainerCreating", "CreateContainerConfigError", "ErrImagePull"]
    priority: P2
    diagnostic_steps:
      - step: 1
        title: "Identify waiting reason"    # check if waiting reason is provided by capture diagnostics         # review from vm
        description: "Reason label determines path: pull issues, config errors, or runtime startup failures."
        tool_calls:
          - tool_id: "tool.capture_diagnostics"
            description: "Inspect waiting reason and related events."
    remediation: []   # only for suggestion
    escalation: "Platform team if wait reason is image pull or secret/config reference failures."

  - name: "KubePodNotReady"
    patterns: ["KubePodNotReady", "readiness probe failed", "pod not ready"]
    priority: P2
    diagnostic_steps:
      - step: 1
        title: "Check readiness failures"
        description: "Validate probe endpoint response, startup timing, and dependency readiness."
        tool_calls:
          - tool_id: "tool.capture_diagnostics"
            description: "Collect readiness events and probe configuration from pod spec."
      - step: 2
        title: "Inspect app logs"
        description: "Find endpoint failures, dependency errors, or startup timeouts."
        tool_calls:
          - tool_id: "tool.read_logs"
            description: "Review logs around probe failures and restarts."
    remediation:  # suggest only
      - action: "restart_deployment"
        description: "Apply rolling restart only for transient stuck states."
        tool_id: "forge.restart_deployment"
        requires_approval: true
    escalation: "App team if readiness endpoint is failing due to application behavior."

  - name: "KubeDeploymentReplicasMismatch"
    patterns: ["KubeDeploymentReplicasMismatch", "deployment replicas mismatch"]
    priority: P2
    diagnostic_steps:
      - step: 1
        title: "Compare desired vs available replicas"
        description: "Determine whether pods are pending, crashing, or evicted."
        tool_calls:
          - tool_id: "tool.capture_diagnostics"  # need to add what is desired and required pod cnt in capture_diagnostics tool
            description: "Inspect deployment conditions and associated pod status."
    remediation: []
    escalation: "SRE if sustained mismatch impacts availability for more than one release window."

  - name: "KubeDeploymentRolloutStuck"
    patterns: ["KubeDeploymentRolloutStuck", "ProgressDeadlineExceeded", "rollout stuck"]
    priority: P1
    diagnostic_steps:
      - step: 1
        title: "Identify failing revision"
        description: "Inspect rollout history and identify new ReplicaSet pods failing readiness/scheduling."
        tool_calls:
          - tool_id: "tool.capture_diagnostics"
            description: "Review deployment conditions and new pod lifecycle events."
      - step: 2
        title: "Validate application startup"
        description: "Check failing pods for config, migration, and dependency startup errors."
        tool_calls:
          - tool_id: "tool.read_logs"
            description: "Read logs from pods in the new revision."
    remediation: # only suggest
      - action: "rollback_deployment"
        description: "Rollback to last known good revision to restore service quickly."
        tool_id: "forge.revert_deployment"
        requires_approval: true
    escalation: "Immediate app-team + SRE escalation for production rollout failures."

  - name: "KubeStatefulSetReplicasMismatch"   # need to reproduce
    patterns: ["KubeStatefulSetReplicasMismatch", "statefulset not ready"]
    priority: P1
    diagnostic_steps:
      - step: 1
        title: "Check ordinal readiness"
        description: "StatefulSets progress in order; inspect the first non-ready ordinal pod."
        tool_calls:
          - tool_id: "tool.capture_diagnostics"
            description: "Sort pods by name and inspect lowest failing ordinal."
    remediation: []
    escalation: "App team + storage owners if stateful workload health is blocked by storage or bootstrapping."

  - name: "KubeDaemonSetNotScheduled"  # need to reproduce
    patterns: ["KubeDaemonSetNotScheduled", "daemonset not scheduled", "taint mismatch"]
    priority: P2
    diagnostic_steps:
      - step: 1
        title: "Validate scheduling constraints"
        description: "Review taints/tolerations, node selectors, and resource requests."
        tool_calls:
          - tool_id: "tool.capture_diagnostics"
            description: "Inspect DaemonSet desired/current/ready and node scheduling events."
    remediation: []
    escalation: "Platform team if daemon workload is required for node observability or security controls."

  - name: "KubePodImagePullBackOff"
    patterns: ["KubePodImagePullBackOff", "ImagePullBackOff", "ErrImagePull"]
    priority: P2
    diagnostic_steps:
      - step: 1
        title: "Determine pull failure mode"
        description: "Differentiate auth failure, missing tag, registry outage, or DNS/network issue."
        tool_calls:
          - tool_id: "tool.capture_diagnostics"
            description: "Review pull event messages from describe output."
    remediation:  # only suggestion
      - action: "rollback_deployment"
        description: "Rollback when image/tag regression is confirmed."
        tool_id: "forge.revert_deployment"
        requires_approval: true
    escalation: "Platform team if pull secrets, registry credentials, or connectivity are broken."

  - name: "KubeJobFailed"
    patterns: ["KubeJobFailed", "job failed", "BackoffLimitExceeded"]
    priority: P2
    diagnostic_steps:
      - step: 1
        title: "Inspect failed job pods"
        description: "Review failed pod logs and job status counters."
        tool_calls:
          - tool_id: "tool.read_logs"   # need to add new tool to get job fail reason
            description: "Collect logs from failed job pods using job label selectors."
    remediation: []
    escalation: "App team for batch logic failures; SRE for repeated infrastructure-induced failures."

  - name: "KubeCronJobSuspended"  # need to reproduce
    patterns: ["KubeCronJobSuspended", "cronjob suspended", "spec.suspend"]
    priority: P3
    diagnostic_steps:
      - step: 1
        title: "Confirm intended suspension"
        description: "Verify whether suspension is planned maintenance or accidental state drift."
        tool_calls:
          - tool_id: "tool.capture_diagnostics"
            description: "Inspect cronjob spec and recent schedule history."
    remediation: []
    escalation: "Service owner if missed schedules impact downstream SLAs."

  - name: "KubePodEvicted"
    patterns: ["KubePodEvicted", "evicted", "node pressure"]
    priority: P2
    diagnostic_steps:
      - step: 1
        title: "Identify eviction cause"
        description: "Map pod eviction to node pressure: memory, disk, or PID."
        tool_calls:
          - tool_id: "tool.capture_diagnostics"
            description: "Inspect pod events and node conditions."
      - step: 2
        title: "Assess node health"
        description: "Confirm cluster-wide vs node-local resource pressure."
        tool_calls:
          - tool_id: "tool.fetch_metrics"    # need to add node pressure tool call instead of fetch metrics
            description: "Check node utilization and pressure conditions."
    remediation: []
    escalation: "SRE and infrastructure teams for sustained node pressure or repeated mass evictions."

  - name: "KubePodPendingTooLong"
    patterns: ["KubePodPendingTooLong", "pod pending", "FailedScheduling", "Unschedulable"]
    priority: P2
    diagnostic_steps:
      - step: 1
        title: "Inspect scheduler events"
        description: "Validate if pending is due to capacity, affinity, taints, or PVC binding."
        tool_calls:
          - tool_id: "tool.capture_diagnostics"    # need to add new tool
            description: "Review scheduling events and placement constraints."
    remediation: []
    escalation: "SRE if unschedulable condition persists and affects service availability."

  - name: "KubePersistentVolumeError"    # need to reproduce
    patterns: ["KubePersistentVolumeError", "persistent volume failed", "volume lost", "phase pending"]
    priority: P1
    diagnostic_steps:
      - step: 1
        title: "Check PV lifecycle state"
        description: "Inspect PV phase and storage backend errors from CSI/controller logs."
        tool_calls:
          - tool_id: "tool.capture_diagnostics"   # need to add support for pv
            description: "Collect PV state, bound PVC, and storage event trail."
    remediation: []
    escalation: "Storage/platform team immediately when PV enters Failed or Lost state."

  - name: "KubePVCFillingUp"
    patterns: ["KubePVCFillingUp", "pvc filling up", "volume low free space"]
    priority: P2
    diagnostic_steps:
      - step: 1
        title: "Confirm free space trend"
        description: "Validate sustained growth and identify consuming workloads."
        tool_calls:
          - tool_id: "tool.fetch_metrics"    # need to handle separately pvc thing
            description: "Inspect PVC consumption and associated pod disk usage."
    remediation: []
    escalation: "Service owner and storage team if growth trend indicates near-term exhaustion."

  - name: "KubePVCCriticalFull"
    patterns: ["KubePVCCriticalFull", "pvc critical full", "disk nearly full"]
    priority: P1
    diagnostic_steps:
      - step: 1
        title: "Stabilize critical storage usage"
        description: "Identify immediate cleanup or emergency expansion options."
        tool_calls:
          - tool_id: "tool.fetch_metrics"   # need to handle separately
            description: "Confirm available bytes and current write pressure."
    remediation: []
    escalation: "Immediate page to storage/platform and owning service team."

  - name: "KubeHpaMaxedOut"
    patterns: ["KubeHpaMaxedOut", "hpa max replicas", "ScalingLimited"]
    priority: P2
    diagnostic_steps:
      - step: 1
        title: "Validate scaling saturation"
        description: "Confirm HPA desired replicas are pinned at max and identify driving metric."
        tool_calls:
          - tool_id: "tool.get_hpa_state"  # need to optimize the tool response
            description: "Collect min/max/current/desired values and metric targets."
      - step: 2
        title: "Correlate with pod pressure"
        description: "Check whether pods remain CPU/memory constrained even at max replicas."
        tool_calls:
          - tool_id: "tool.fetch_metrics"
            description: "Compare pod utilization against requests and limits."
    remediation: []
    escalation: "SRE and service owner for HPA policy/limit tuning and capacity planning."

general_diagnostic:
  steps:
    - step: 1
      title: "Capture initial snapshot"
      tool_calls:
        - tool_id: "tool.capture_diagnostics"
          description: "Collect pod status, events, deployment conditions, and related objects."
    - step: 2
      title: "Inspect logs and metrics"
      tool_calls:
        - tool_id: "tool.read_logs"
          description: "Read current and previous logs for failing containers."
        - tool_id: "tool.fetch_metrics"
          description: "Review pod/node resource utilization and saturation indicators."
    - step: 3
      title: "Generate RCA narrative"
      tool_calls:
        - tool_id: "tool.generate_root_cause"
          description: "Produce root-cause summary with confidence and blast-radius estimate."

available_tools:
  - tool_id: "tool.read_logs"
    endpoint: "/api/tools/read-logs"
    description: "Read logs for target workloads/services."
    params: ["namespace", "service", "pod", "container", "since", "tail_lines"]
  - tool_id: "tool.fetch_metrics"
    endpoint: "/api/tools/fetch-metrics"
    description: "Fetch metrics for services, pods, nodes, and cluster entities."
    params: ["namespace", "service", "pod", "node", "window", "metric_filter"]
  - tool_id: "tool.query_metrics"
    endpoint: "/api/tools/query-metrics"
    description: >-
      Run named PromQL queries against VictoriaMetrics and return pre-computed
      values. Generic across alert classes: each diagnostic step supplies its own
      `queries` list (name + PromQL), with $namespace/$workload/$container/$node/
      $pod/$cluster placeholders auto-substituted from the alert. Use it to ground
      the RCA in real numbers (ratios, peaks, slopes) rather than generic text.
    params: ["namespace", "pod", "container", "workload", "node", "queries"]
  - tool_id: "tool.list_services"
    endpoint: "/api/tools/list-services"
    description: "List discovered services and their health context."
    params: ["namespace", "label_selector"]
  - tool_id: "tool.detect_anomalies"
