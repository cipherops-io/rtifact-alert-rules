tech_stack: kubernetes-workloads
version: "1.0"
description: "Runbook for Kubernetes workload alerts across pods, rollouts, batch jobs, autoscaling, and persistent volumes. Includes diagnosis flows, remediation guidance, and escalation rules for production operations."

match_keywords:
  - kubernetes workloads
  - crashloopbackoff
  - oomkilled
  - cpu throttling
  - imagepullbackoff
  - pod pending
  - rollout stuck
  - hpa max replicas
  - pvc full
  - persistent volume failed
  - cronjob suspended

categories:
  - CONTAINER
  - APPLICATION
  - INFRASTRUCTURE
  - STORAGE
  - AUTOSCALING

common_alerts:
  - name: "KubePodCrashLooping"
    patterns: ["KubePodCrashLooping", "CrashLoopBackOff", "container restart loop"]
    priority: P1
    diagnostic_steps:
      - step: 1
        title: "Confirm the crash loop and classify the termination"
        description: >-
          Pull the live crash-loop metric pack from VictoriaMetrics so the RCA names a
          concrete failure class instead of "pod is crash looping, check logs". The
          exit code and last terminated reason are the primary classifiers — branch on
          them BEFORE anything else:
          exit_code=0  / reason=Completed         => process exited cleanly but the
            controller expects a long-running service (wrong command/args/mode).
          exit_code=1  / reason=Error             => generic app/config/runtime failure
            (missing env/secret/configmap, bad config, failed dependency at startup).
          exit_code=2                              => CLI usage / bad argument.
          exit_code=126 / reason=ContainerCannotRun=> command found but not executable
            (permission / exec-bit / shell mismatch).
          exit_code=127                            => command not found / bad image
            entrypoint / missing binary / bad PATH.
          exit_code=137 / reason=OOMKilled         => SIGKILL, almost always OOM — jump
            to step 2 and treat as a memory-sizing problem, NOT a generic crash loop.
          exit_code=139                            => SIGSEGV / native crash.
          exit_code=143 / reason=Error+SIGTERM     => graceful-stop signal, usually
            rollout/preemption/shutdown, not an app bug.
          Use restarts_15m / restart_rate to gauge severity, and container_ready=0 with
          pod_ready=0 to confirm the workload is actually down (not a single flap).
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "Confirm CrashLoopBackOff, restart count/rate, last terminated reason (OOMKilled/Error/Completed/ContainerCannotRun), exit code, and readiness."
            params:
              queries:
                - name: crashloop_active
                  query: 'max(max_over_time(kube_pod_container_status_waiting_reason{namespace="$namespace",pod=~"$workload-.*",container="$container",reason="CrashLoopBackOff"}[5m]))'
                - name: last_exit_code
                  query: 'max(kube_pod_container_status_last_terminated_exitcode{namespace="$namespace",pod=~"$workload-.*",container="$container"})'
                - name: term_reason_oomkilled
                  query: 'max(kube_pod_container_status_last_terminated_reason{namespace="$namespace",pod=~"$workload-.*",container="$container",reason="OOMKilled"})'
                - name: term_reason_error
                  query: 'max(kube_pod_container_status_last_terminated_reason{namespace="$namespace",pod=~"$workload-.*",container="$container",reason="Error"})'
                - name: term_reason_completed
                  query: 'max(kube_pod_container_status_last_terminated_reason{namespace="$namespace",pod=~"$workload-.*",container="$container",reason="Completed"})'
                - name: term_reason_cannot_run
                  query: 'max(kube_pod_container_status_last_terminated_reason{namespace="$namespace",pod=~"$workload-.*",container="$container",reason="ContainerCannotRun"})'
                - name: restarts_15m
                  query: 'max(increase(kube_pod_container_status_restarts_total{namespace="$namespace",pod=~"$workload-.*",container="$container"}[15m]))'
                  panel: true
                  panel_title: "Restarts (15m)"
                  panel_id: "kube-restarts-15m"
                - name: restarts_6h
                  query: 'max(increase(kube_pod_container_status_restarts_total{namespace="$namespace",pod=~"$workload-.*",container="$container"}[6h]))'
                  panel: true
                  panel_title: "Restarts (6h)"
                  panel_id: "kube-restarts-6h"
                - name: restart_rate_per_min_5m
                  unit: "restarts/min"
                  query: 'max(rate(kube_pod_container_status_restarts_total{namespace="$namespace",pod=~"$workload-.*",container="$container"}[5m]))*60'
                  panel: true
                  panel_title: "Restart Rate /min"
                  panel_id: "kube-restart-rate"
                - name: container_ready
                  query: 'max(kube_pod_container_status_ready{namespace="$namespace",pod=~"$workload-.*",container="$container"})'
                  panel: true
                  panel_title: "Container Ready"
                  panel_id: "kube-container-ready"
                - name: container_running
                  query: 'max(kube_pod_container_status_running{namespace="$namespace",pod=~"$workload-.*",container="$container"})'
                - name: pod_ready
                  query: 'max(kube_pod_status_ready{namespace="$namespace",pod=~"$workload-.*",condition="true"})'
      - step: 2
        title: "Rule out OOMKilled and resource starvation"
        description: >-
          CrashLoopBackOff and OOMKilled overlap heavily, so explicitly disprove memory
          before blaming the app. Interpret: term_reason_oomkilled==1 OR last_exit_code==137
          => this is an OOM, root cause = container exceeded its memory limit (right-size
          memory, request==limit per policy) — do NOT keep hunting config/dependency.
          mem_peak_pct >= 90 with positive mem_slope and no traffic => leak/unbounded
          growth approaching the limit. cpu_throttle_pct high with a cpu_limit set =>
          CFS throttling can stall startup and trip liveness probes (platform policy is
          no CPU limit). If memory/CPU are comfortably below limits, eliminate resources
          as the cause and proceed to app/config/image analysis.
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "Memory working-set vs limit %, 6h peak %, growth slope, request==limit, CPU limit policy + throttling, node memory pressure."
            params:
              queries:
                - name: mem_util_pct
                  unit: "%"
                  query: '100*max(container_memory_working_set_bytes{namespace="$namespace",pod=~"$workload-.*",container="$container"})/max(kube_pod_container_resource_limits{namespace="$namespace",pod=~"$workload-.*",container="$container",resource="memory"})'
                - name: mem_peak_pct_6h
                  unit: "%"
                  query: '100*max(max_over_time(container_memory_working_set_bytes{namespace="$namespace",pod=~"$workload-.*",container="$container"}[6h]))/max(kube_pod_container_resource_limits{namespace="$namespace",pod=~"$workload-.*",container="$container",resource="memory"})'
                  panel: true
                  panel_title: "Peak Memory vs Limit % (6h)"
                  panel_id: "kube-mem-peak-pct-6h"
                - name: mem_slope_mib_per_min
                  unit: "MiB/min"
                  query: 'max(deriv(container_memory_working_set_bytes{namespace="$namespace",pod=~"$workload-.*",container="$container"}[2h]))*60/1024/1024'
                - name: mem_request_minus_limit_mib
                  unit: "MiB"
                  query: '(max(kube_pod_container_resource_requests{namespace="$namespace",pod=~"$workload-.*",container="$container",resource="memory"})-max(kube_pod_container_resource_limits{namespace="$namespace",pod=~"$workload-.*",container="$container",resource="memory"}))/1024/1024'
                - name: cpu_limit_cores
                  unit: "cores"
                  query: 'max(kube_pod_container_resource_limits{namespace="$namespace",pod=~"$workload-.*",container="$container",resource="cpu"})'
                - name: cpu_throttle_pct
                  unit: "%"
                  query: '100*max(rate(container_cpu_cfs_throttled_periods_total{namespace="$namespace",pod=~"$workload-.*",container="$container"}[5m]))/max(rate(container_cpu_cfs_periods_total{namespace="$namespace",pod=~"$workload-.*",container="$container"}[5m]))'
                - name: node_memory_pressure
                  query: 'max(kube_node_status_condition{node="$node",condition="MemoryPressure",status="true"})'
      - step: 3
        title: "Check image/config waiting reasons and rollout drift"
        description: >-
          Separate "container never started" from "container started then crashed", and
          check whether a rollout introduced the failure. Interpret:
          waiting_image>0 (ImagePullBackOff/ErrImagePull) => bad tag, registry auth, or
          missing image — not an app crash. waiting_config>0 (CreateContainerConfigError/
          CreateContainerError) => missing/renamed ConfigMap/Secret/env/volume reference.
          newest_rs_age_min small (roughly <30m) AND the crash window lines up with it,
          or deploy_generation_lag>0 / deploy_unavailable>0 => a recent rollout shipped a
          bad image/config — rollback is the fast path. If no rollout and no image/config
          waiting reason, the failure is in-process (config drift, rotated secret, expired
          cert, dependency outage) and the previous-container logs in step 5 are decisive.
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "Image-pull / config-error waiting reasons and deployment rollout drift (generation lag, unavailable replicas, newest ReplicaSet age)."
            params:
              queries:
                - name: waiting_image
                  query: 'max(max_over_time(kube_pod_container_status_waiting_reason{namespace="$namespace",pod=~"$workload-.*",container="$container",reason=~"ImagePullBackOff|ErrImagePull"}[15m]))'
                - name: waiting_config
                  query: 'max(max_over_time(kube_pod_container_status_waiting_reason{namespace="$namespace",pod=~"$workload-.*",container="$container",reason=~"CreateContainerConfigError|CreateContainerError"}[15m]))'
                - name: deploy_generation_lag
                  query: 'max(kube_deployment_metadata_generation{namespace="$namespace",deployment="$workload"})-max(kube_deployment_status_observed_generation{namespace="$namespace",deployment="$workload"})'
                - name: deploy_unavailable
                  query: 'max(kube_deployment_status_replicas_unavailable{namespace="$namespace",deployment="$workload"})'
                - name: newest_rs_age_min
                  unit: "min"
                  query: '(time()-max(kube_replicaset_created{namespace="$namespace",owner_name="$workload"}))/60'
      - step: 4
        title: "Capture pod state, events, and crash metadata"
        description: "Confirm the metric pack against describe/events — BackOff, probe failures (Liveness/Readiness/Startup), Killing, FailedMount, and the last-state termination block (reason, exit code, finishedAt, restartCount)."
        tool_calls:
          - tool_id: "tool.capture_diagnostics"
            description: "Pod status / warning events / describe — BackOff, probe failures, config-mount errors, last terminated reason and exit code."
          - tool_id: "tool.get_crash_context"
            description: "Crash reason, container, exit code, and recent failures for the crashed pod."
      - step: 5
        title: "Read crash context from the previous (killed) container"
        description: "Inspect the PREVIOUS container's logs (not the freshly restarted one) for the exact fatal line — config/env/secret errors, dependency timeout/DNS/auth/TLS failures, probe path errors, permission/filesystem errors, or language stack traces (Traceback/panic/NPE)."
        tool_calls:
          - tool_id: "tool.read_logs"
            description: "Previous-container logs filtered for fatal/panic/config/secret/dependency/permission/probe signatures."
            params:
              previous: true
              tail_lines: 200
    remediation:   # only for suggestion — never auto-executed (forge.* are approval-gated)
      - action: "rollback_deployment"
        description: "Primary fix when the crash loop began right after a rollout (small newest_rs_age_min, generation lag, or a bad image/config in the new revision)."
        tool_id: "forge.revert_deployment"
        requires_approval: true
      - action: "patch_resources"
        description: "ONLY if step 2 proved OOM (reason=OOMKilled / exit 137 / mem_peak_pct high): right-size memory, raising request AND limit together (keep request==limit) to ~1.3x the observed 6h peak."
        tool_id: "forge.patch_resources"
        requires_approval: true
      - action: "restart_deployment"
        description: "Only to restore availability when the cause is a transient external dependency (e.g. DB not ready at startup) and config is valid. NOT a fix for a deterministic config/code crash — it will just loop back into the same failure."
        tool_id: "forge.restart_deployment"
        requires_approval: true
    escalation: "App team and SRE on-call if multiple replicas are impacted or customer traffic is degraded. Route by exit code — 137: SRE (memory sizing); 1/2/139: app team (code/config); 126/127/ImagePull/config-error: platform (image, secret, configmap)."
    follow_up:
      - "Once the previous-container logs name the exact failure, file the concrete fix (config key, secret, image tag, command/args) rather than a generic 'enable tracing'."
      - "If a rollout caused it, confirm the offending revision and verify the new revision's config/secret references before re-rolling."

  - name: "KubePodOOMKilled"
    patterns: ["KubePodOOMKilled", "OOMKilled", "out of memory"]
    priority: P1
    diagnostic_steps:
      - step: 1
        title: "Quantify the OOM kill and memory headroom"
        description: >-
          Pull the live OOM metric pack from VictoriaMetrics. Percentages, the 6h
          peak and the growth slope are pre-computed in PromQL so the RCA is
          grounded in real numbers, not a generic 'memory spike'. Interpret:
          peak_pct >= 90 with request==limit => limit too low / undersized;
          positive slope with no traffic => leak/unbounded growth;
          node_memory_pressure or pod_evicted => node-level, not just the container.
          If util/peak is LOW despite an OOM, do NOT recommend raising the limit —
          suspect a transient spike or a sibling container and capture a profile.
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "Confirm exit 137 / OOMKilled, memory working-set vs limit %, 6h peak %, growth slope, request==limit and CPU-limit policy, node memory pressure."
            params:
              queries:
                - name: oom_confirmed
                  query: 'max(kube_pod_container_status_last_terminated_reason{namespace="$namespace",pod=~"$workload-.*",container="$container",reason="OOMKilled"})'
                - name: last_exit_code
                  query: 'max(kube_pod_container_status_last_terminated_exitcode{namespace="$namespace",pod=~"$workload-.*",container="$container"})'
                - name: restarts_6h
                  query: 'max(increase(kube_pod_container_status_restarts_total{namespace="$namespace",pod=~"$workload-.*",container="$container"}[6h]))'
                  panel: true
                  panel_title: "Restarts (6h)"
                  panel_id: "kube-restarts-6h"
                - name: mem_working_set_mib
                  unit: "MiB"
                  query: 'max(container_memory_working_set_bytes{namespace="$namespace",pod=~"$workload-.*",container="$container"})/1024/1024'
                  panel: true
                  panel_title: "Memory Working Set"
                  panel_id: "kube-mem-working-set"
                - name: mem_limit_mib
                  unit: "MiB"
                  query: 'max(kube_pod_container_resource_limits{namespace="$namespace",pod=~"$workload-.*",container="$container",resource="memory"})/1024/1024'
                - name: mem_request_mib
                  unit: "MiB"
                  query: 'max(kube_pod_container_resource_requests{namespace="$namespace",pod=~"$workload-.*",container="$container",resource="memory"})/1024/1024'
                - name: mem_util_pct
                  unit: "%"
                  query: '100*max(container_memory_working_set_bytes{namespace="$namespace",pod=~"$workload-.*",container="$container"})/max(kube_pod_container_resource_limits{namespace="$namespace",pod=~"$workload-.*",container="$container",resource="memory"})'
                  panel: true
                  panel_title: "Memory vs Limit %"
                  panel_id: "kube-mem-util-pct"
                - name: mem_peak_6h_mib
                  unit: "MiB"
                  query: 'max(max_over_time(container_memory_working_set_bytes{namespace="$namespace",pod=~"$workload-.*",container="$container"}[6h]))/1024/1024'
                - name: mem_peak_pct
                  unit: "%"
                  query: '100*max(max_over_time(container_memory_working_set_bytes{namespace="$namespace",pod=~"$workload-.*",container="$container"}[6h]))/max(kube_pod_container_resource_limits{namespace="$namespace",pod=~"$workload-.*",container="$container",resource="memory"})'
                  panel: true
                  panel_title: "Peak Memory vs Limit % (6h)"
                  panel_id: "kube-mem-peak-pct-6h"
                - name: mem_slope_mib_per_min
                  unit: "MiB/min"
                  query: 'max(deriv(container_memory_working_set_bytes{namespace="$namespace",pod=~"$workload-.*",container="$container"}[2h]))*60/1024/1024'
                  panel: true
                  panel_title: "Memory Growth Rate"
                  panel_id: "kube-mem-slope"
                - name: cpu_limit_cores
                  unit: "cores"
                  query: 'max(kube_pod_container_resource_limits{namespace="$namespace",pod=~"$workload-.*",container="$container",resource="cpu"})'
                - name: node_memory_pressure
                  query: 'max(kube_node_status_condition{node="$node",condition="MemoryPressure",status="true"})'
                - name: pod_evicted
                  query: 'max(kube_pod_status_reason{namespace="$namespace",pod=~"$workload-.*",reason="Evicted"})'
      - step: 2
        title: "Confirm termination reason and OOM events"
        description: "Cross-check the metric pack with KSM OOM-kill events and the pod describe/events bundle (Last State: Terminated, Reason: OOMKilled, Exit Code: 137)."
        tool_calls:
          - tool_id: "tool.get_oom_events"
            description: "OOM kill events and affected containers for the workload."
          - tool_id: "tool.capture_diagnostics"
            description: "Pod status / warning events / describe — confirm OOMKilled termination and restart count."
      - step: 3
        title: "Assess resource saturation and QoS policy"
        description: "Compare memory usage against requests/limits and QoS; verify the desired policy (memory request==limit, no CPU limit => Burstable, not Guaranteed)."
        tool_calls:
          - tool_id: "tool.get_resource_saturation"
            description: "CPU/memory saturation vs requests/limits and pod QoS class."
      - step: 4
        title: "Read crash context from the killed container"
        description: "Inspect the PREVIOUS container's logs (not the freshly restarted one) for leak, large-payload/file-processing, or unbounded-cache signatures."
        tool_calls:
          - tool_id: "tool.get_crash_context"
            description: "Crash reason, container, exit code, and last log lines of the crashed pod."
          - tool_id: "tool.read_logs"
            description: "Previous-container logs filtered for memory/OOM/large-payload signatures."
            params:
              previous: true
              tail_lines: 200
    remediation:   # only for suggestion — never auto-executed (forge.* are approval-gated)
      - action: "patch_resources"
        description: "Right-size memory: raise request AND limit together (keep request==limit per policy) to ~1.3x the observed 6h peak. Primary fix when peak/util is high against the limit."
        tool_id: "forge.patch_resources"
        requires_approval: true
      - action: "remove_cpu_limit"
        description: "If a CPU limit is set, remove it (platform policy: no CPU limits, avoid CFS throttling); keep memory request==limit."
        tool_id: "forge.patch_resources"
        requires_approval: true
      - action: "rollback_deployment"
        description: "Roll back if a deployment shortly preceded the OOM (memory regression in the new revision)."
        tool_id: "forge.revert_deployment"
        requires_approval: true
      - action: "scale_out_replicas"
        description: "Only if traffic/concurrency is driving memory pressure — spreads load, does NOT fix a per-request leak."
        tool_id: "forge.scale_deployment"
        requires_approval: true
      - action: "restart_deployment"
        description: "Only to restore availability if the pod is crashlooping/stuck after the OOM. Not a root-cause fix."
        tool_id: "forge.restart_deployment"
        requires_approval: true
    escalation: "SRE for limit tuning; app team if leak or runaway workload behavior is suspected."
    follow_up:
      - "If the slope indicates a leak, capture a heap/profile dump from a live pod before the next kill."
      - "Confirm the memory request==limit and no-CPU-limit policy is applied to this workload."

  - name: "KubePodCPUThrottlingHigh"
    patterns: ["KubePodCPUThrottlingHigh", "CPU throttling", "container CPU throttled", "CFS throttling"]
    priority: P2
    diagnostic_steps:
      - step: 1
        title: "Quantify CPU throttling and limit headroom"
        description: "Confirm the throttled CFS period ratio, current CPU usage, configured request/limit, and whether usage is near the limit."
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "Run exact pod/container KSM and cAdvisor queries for throttling, usage, request, limit, and usage-vs-limit."
            params:
              queries:
                - name: "cpu_throttle_pct"
                  unit: "%"
                  query: '100*sum(rate(container_cpu_cfs_throttled_periods_total{namespace="$namespace",pod="$pod",container="$container"}[5m]))/sum(rate(container_cpu_cfs_periods_total{namespace="$namespace",pod="$pod",container="$container"}[5m]))'
                  panel: true
                  panel_title: "CPU Throttling %"
                  panel_id: "kube-cpu-throttle-pct"
                - name: "cpu_usage_cores"
                  unit: "cores"
                  query: 'sum(rate(container_cpu_usage_seconds_total{namespace="$namespace",pod="$pod",container="$container"}[5m]))'
                  panel: true
                  panel_title: "CPU Usage (cores)"
                  panel_id: "kube-cpu-usage-cores"
                - name: "cpu_limit_cores"
                  unit: "cores"
                  query: 'max(kube_pod_container_resource_limits{namespace="$namespace",pod="$pod",container="$container",resource="cpu"})'
                  panel: true
                  panel_title: "CPU Limit (cores)"
                  panel_id: "kube-cpu-limit-cores"
                - name: "cpu_request_cores"
                  unit: "cores"
                  query: 'max(kube_pod_container_resource_requests{namespace="$namespace",pod="$pod",container="$container",resource="cpu"})'
                - name: "cpu_usage_vs_limit_pct"
                  unit: "%"
                  query: '100*sum(rate(container_cpu_usage_seconds_total{namespace="$namespace",pod="$pod",container="$container"}[5m]))/max(kube_pod_container_resource_limits{namespace="$namespace",pod="$pod",container="$container",resource="cpu"})'
                  panel: true
                  panel_title: "CPU Usage vs Limit %"
                  panel_id: "kube-cpu-usage-vs-limit"
      - step: 2
        title: "Check node contention and workload impact"
        description: "Determine whether throttling is isolated to the container, caused by node CPU contention, or correlated with request/Kafka processing load."
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "Compare node CPU, request rate, latency, and Kafka processing metrics around the throttling window."
            params:
              queries:
                - name: "node_cpu_pct"
                  unit: "%"
                  # node-exporter in this fleet carries the node name on `rtf_node`
                  # (`instance` is an ip:port and there is no plain `node` label), so the
                  # rtf_node form is tried FIRST; the instance/node forms stay as fallbacks
                  # for fleets that relabel node-exporter differently.
                  query: '(100 - avg(rate(node_cpu_seconds_total{mode="idle",rtf_node="$node"}[5m])) * 100) or (100 - avg(rate(node_cpu_seconds_total{mode="idle",instance="$node"}[5m])) * 100) or (100 - avg(rate(node_cpu_seconds_total{mode="idle",node="$node"}[5m])) * 100)'
                  panel: true
                  panel_title: "Node CPU %"
                  panel_id: "kube-node-cpu-pct"
                - name: "request_rate_rps"
                  unit: "req/s"
                  query: 'sum(rate({__name__=~"http.server.request.duration_count|http.server.duration_count",service.name="$service"}[5m]))'
                - name: "p95_latency_ms"
                  unit: "ms"
                  query: 'histogram_quantile(0.95, sum by (le) (rate({__name__=~"http.server.request.duration_bucket|http.server.duration_bucket",service.name="$service"}[5m]))) * 1000'
                - name: "kafka_processing_rate"
                  unit: "ops/s"
                  query: 'sum(rate({__name__=~"messaging.process.duration_count|messaging.process.duration_count_total",service.name="$service"}[5m]))'
          - tool_id: "tool.capture_diagnostics"
            description: "Collect logs, OTel probes, and config summary to correlate throttling with service impact."
      - step: 3
        title: "Inspect workload impact"
        description: "Correlate throttling with Kafka rebalances, consumer lag catch-up, GC, timeouts, slow processing, or batch activity."
        tool_calls:
          - tool_id: "tool.read_logs"
            description: "Review logs for rebalance, consumer lag, gc, timeout, slow, processing, or batch messages during the throttling window."
            params:
              tail_lines: 300
    remediation:
      - action: "patch_resources"
        description: "If a CPU limit exists and throttling is high, remove or raise the CPU limit per policy; keep an appropriate CPU request."
        tool_id: "forge.patch_resources"
        requires_approval: true
      - action: "scale_out_replicas"
        description: "Scale replicas or tune HPA only when request/Kafka processing load is driving CPU demand beyond available capacity."
        tool_id: "forge.scale_deployment"
        requires_approval: true
    escalation: "SRE for CPU request/limit policy and node contention; owning service team if throttling correlates with Kafka lag, GC, latency, timeouts, or failed customer traffic."

  - name: "KubeContainerWaiting"
    patterns: ["KubeContainerWaiting", "container waiting too long", "ContainerCreating", "CreateContainerConfigError", "ErrImagePull"]
    priority: P2
    diagnostic_steps:
      - step: 1
        title: "Confirm the container is waiting and classify the reason"
        description: >-
          KubeContainerWaiting means a container is stuck in Waiting — it has not started.
          The waiting reason IS the classifier; branch on it before anything else (queries
          are scoped to the exact pod/container from the alert). Interpret:
          waiting_image>0 (ImagePullBackOff/ErrImagePull/InvalidImageName) => image pull
            problem — bad tag, registry auth, or missing image. Pod EVENTS carry the exact
            registry error (step 3), not app logs. Follow KubePodImagePullBackOff.
          waiting_config>0 (CreateContainerConfigError/CreateContainerError) => a referenced
            Secret/ConfigMap/env/volume is missing or renamed — the container can't be
            constructed. Step 3 events name the missing object.
          waiting_crashloop>0 (CrashLoopBackOff) => the container started then crashed and is
            backing off — this is a crash, not a never-started case; classify it in step 2
            by last terminated reason + exit code and follow KubePodCrashLooping.
          waiting_creating>0 (ContainerCreating) => still pulling image / mounting volumes /
            wiring the network — a node/CSI/CNI startup delay; if young it may self-resolve,
            if persistent the mount or CNI is stuck (step 3 FailedMount/sandbox events).
          waiting_creating>0 as PodInitializing => the MAIN container is blocked by an INIT
            container — jump to step 2 (init state) before blaming the app container.
          container_ready==0 confirms it is not serving. Do NOT recommend a fix from this
            step alone — it only classifies.
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "Exact-container waiting reasons (image / config / crashloop / creating-or-initializing), readiness, and restarts."
            params:
              queries:
                - name: waiting_image
                  query: 'max(max_over_time(kube_pod_container_status_waiting_reason{namespace="$namespace",pod="$pod",container="$container",reason=~"ImagePullBackOff|ErrImagePull|InvalidImageName"}[15m]))'
                  panel: true
                  panel_title: "Waiting: Image Pull"
                  panel_id: "kube-waiting-image"
                - name: waiting_config
                  query: 'max(max_over_time(kube_pod_container_status_waiting_reason{namespace="$namespace",pod="$pod",container="$container",reason=~"CreateContainerConfigError|CreateContainerError"}[15m]))'
                - name: waiting_crashloop
                  query: 'max(max_over_time(kube_pod_container_status_waiting_reason{namespace="$namespace",pod="$pod",container="$container",reason="CrashLoopBackOff"}[15m]))'
                  panel: true
                  panel_title: "Waiting: CrashLoopBackOff"
                  panel_id: "kube-waiting-crashloop"
                - name: waiting_creating
                  query: 'max(max_over_time(kube_pod_container_status_waiting_reason{namespace="$namespace",pod="$pod",container="$container",reason=~"ContainerCreating|PodInitializing"}[15m]))'
                - name: container_ready
                  query: 'max(kube_pod_container_status_ready{namespace="$namespace",pod="$pod",container="$container"})'
                  panel: true
                  panel_title: "Container Ready"
                  panel_id: "kube-container-ready"
                - name: restarts_15m
                  query: 'max(increase(kube_pod_container_status_restarts_total{namespace="$namespace",pod="$pod",container="$container"}[15m]))'
                  panel: true
                  panel_title: "Restarts (15m)"
                  panel_id: "kube-restarts-15m"
      - step: 2
        title: "Check init containers and crash classification"
        description: >-
          A waiting (PodInitializing) main container is most often blocked by an INIT
          container, and a CrashLoopBackOff needs its termination classified. Interpret:
          init_crashloop>0 OR init_restarts_15m>0 => an INIT container is failing and
            blocking the main container (init_term_reason names why: Error/exit 1 =
            config/dependency/CRD/migration failure; OOMKilled = init memory). Root cause is
            the init step — read ITS logs in step 4; do NOT call this a main-app problem.
          For a CrashLoopBackOff main container, branch on the last termination:
          last_term_oom==1 OR last_exit==137 => OOMKilled — size memory (KubePodOOMKilled).
          last_term_error==1 / last_exit==1 => generic app/config/dependency failure.
          last_exit==127 => command not found / bad image entrypoint / missing binary.
          last_exit==126 => command not executable (permission / exec-bit).
          If waiting_creating with NO init failure and NO crashloop => genuinely still
            creating (image pull in progress, volume mount, CNI) — the cause is node/CSI/CNI,
            confirmed by the FailedMount / sandbox / pull events in step 3.
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "Init-container waiting/restarts/last-terminated, plus the main container's last terminated reason (OOM/Error) and exit code."
            params:
              queries:
                - name: init_crashloop
                  query: 'max(max_over_time(kube_pod_init_container_status_waiting_reason{namespace="$namespace",pod="$pod",reason="CrashLoopBackOff"}[15m]))'
                - name: init_restarts_15m
                  query: 'max(increase(kube_pod_init_container_status_restarts_total{namespace="$namespace",pod="$pod"}[15m]))'
                - name: init_term_reason_error
                  query: 'max(kube_pod_init_container_status_last_terminated_reason{namespace="$namespace",pod="$pod",reason="Error"})'
                - name: init_term_reason_oom
                  query: 'max(kube_pod_init_container_status_last_terminated_reason{namespace="$namespace",pod="$pod",reason="OOMKilled"})'
                - name: last_term_error
                  query: 'max(kube_pod_container_status_last_terminated_reason{namespace="$namespace",pod="$pod",container="$container",reason="Error"})'
                - name: last_term_oom
                  query: 'max(kube_pod_container_status_last_terminated_reason{namespace="$namespace",pod="$pod",container="$container",reason="OOMKilled"})'
                - name: last_exit
                  query: 'max(kube_pod_container_status_last_terminated_exitcode{namespace="$namespace",pod="$pod",container="$container"})'
      - step: 3
        title: "Capture pod events and waiting metadata"
        description: "The container never ran, so pod EVENTS — not app logs — carry the exact cause: 'Failed to pull image' (manifest unknown / unauthorized / timeout), 'CreateContainerConfigError' naming the missing Secret/ConfigMap, FailedMount / volume attach errors, FailedCreatePodSandBox (CNI), and BackOff / init-container failure messages."
        tool_calls:
          - tool_id: "tool.capture_diagnostics"
            description: "Pod status / warning events / describe — image pull, config/secret, mount, sandbox/CNI, and init-container failure messages."
          - tool_id: "tool.get_crash_context"
            description: "Crash/termination reason, container (incl. init), and exit code for the waiting pod."
      - step: 4
        title: "Read the exact failing line"
        description: >-
          Read logs from the container the previous steps blamed. If step 2 pointed to an
          INIT container, read THAT init container for the fatal line (config/CRD/migration/
          dependency error). For a CrashLoopBackOff main container, read the PREVIOUS
          container. For image/config waiting reasons the container produced no logs — rely
          on the step 3 events. Name the exact missing object / failed command, not "waiting".
        tool_calls:
          - tool_id: "tool.read_logs"
            description: "Logs filtered for image/pull/registry, config/secret/configmap/env, and init/startup/dependency signatures."
            params:
              previous: true
              tail_lines: 200
    remediation:   # only for suggestion — never auto-executed (forge.* are approval-gated)
      - action: "rollback_deployment"
        description: "Primary fix when a recent rollout shipped the bad image tag or config/secret reference that the container is now waiting on (image-pull or config-error reason that began with the new revision). Restores the last-working revision."
        tool_id: "forge.revert_deployment"
        requires_approval: true
      - action: "patch_resources"
        description: "ONLY if step 2 showed the container/init was OOMKilled (last_term_oom / init_term_reason_oom / exit 137): right-size memory (raise request AND limit together, keep request==limit) to ~1.3x the observed peak."
        tool_id: "forge.patch_resources"
        requires_approval: true
      - action: "restart_deployment"
        description: "Only to clear a TRANSIENT stuck state — a ContainerCreating wedged on a mount/sandbox that has since cleared, or an init step waiting on a now-recovered dependency. NOT a fix for a missing image/secret/configmap or a deterministic init/CRD failure — it will wait again."
        tool_id: "forge.restart_deployment"
        requires_approval: true
    escalation: >-
      Route by waiting reason — image pull: platform (registry creds / tag / connectivity);
      config error: platform + service owner (missing Secret/ConfigMap/env); init/CRD/
      migration failure: the owning team for that init step; ContainerCreating stuck on
      mount/CNI: platform (CSI/CNI/node). Page if multiple replicas are waiting and
      availability is degraded.
    follow_up:
      - "Once the waiting reason is classified, file the concrete fix (image tag, the missing Secret/ConfigMap key, the failing init command/CRD, or the stuck volume/CNI) — not a generic 'investigate'."
      - "If a rollout introduced a bad image/config reference, validate the new revision's image and Secret/ConfigMap references before re-rolling."

  - name: "KubePodNotReady"
    patterns: ["KubePodNotReady", "pod not ready", "readiness probe failed", "not ready for >15m"]
    priority: P2
    diagnostic_steps:
      - step: 1
        title: "Confirm not-ready and locate the failing container"
        description: >-
          KubePodNotReady is a SYMPTOM, not a root cause — the pod's Ready condition is
          false. The job of this step is to split the pod into one of three macro-states
          so the rest of the tree routes correctly, instead of emitting "pod not ready,
          check logs". Interpret:
          pod_ready_false==1 / pod_ready_true==0 => confirmed not ready (proceed).
          container_running==0 AND container_ready==0 => the main container NEVER STARTED
            — this is a waiting/startup problem (init, image, config, scheduling). Go to
            step 2 and classify the waiting reason; the readiness-probe path does NOT apply
            (there is no running process to probe yet).
          container_running==1 AND container_ready==0 => container is UP but failing its
            readiness probe — this is the probe / app-health / dependency path. Resource
            and OBI checks in step 3 are decisive; logs in step 6 carry the probe error.
          phase_pending==1 => pod is Pending (unscheduled or stuck initializing) — confirm
            via step 2 (init state) and step 4 (replica availability); do not blame the app.
          restarts_15m>0 with container flapping => a crash/probe loop, not a single flap.
          NEVER recommend a fix from this step alone — it only classifies.
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "Confirm Ready=false and split into never-started vs running-but-unready vs Pending; main-container running/ready, pod phase, restarts."
            params:
              queries:
                - name: pod_ready_false
                  query: 'max(kube_pod_status_ready{namespace="$namespace",pod=~"$workload-.*",condition="false"})'
                - name: pod_ready_true
                  query: 'max(kube_pod_status_ready{namespace="$namespace",pod=~"$workload-.*",condition="true"})'
                  panel: true
                  panel_title: "Pod Ready"
                  panel_id: "kube-pod-ready"
                - name: container_ready
                  query: 'min(kube_pod_container_status_ready{namespace="$namespace",pod=~"$workload-.*",container="$container"})'
                  panel: true
                  panel_title: "Container Ready"
                  panel_id: "kube-container-ready"
                - name: container_running
                  query: 'max(kube_pod_container_status_running{namespace="$namespace",pod=~"$workload-.*",container="$container"})'
                - name: phase_running
                  query: 'max(kube_pod_status_phase{namespace="$namespace",pod=~"$workload-.*",phase="Running"})'
                - name: phase_pending
                  query: 'max(kube_pod_status_phase{namespace="$namespace",pod=~"$workload-.*",phase="Pending"})'
                - name: restarts_15m
                  query: 'max(increase(kube_pod_container_status_restarts_total{namespace="$namespace",pod=~"$workload-.*",container="$container"}[15m]))'
                  panel: true
                  panel_title: "Restarts (15m)"
                  panel_id: "kube-restarts-15m"
                - name: pod_age_min
                  unit: "min"
                  query: '(time()-max(kube_pod_created{namespace="$namespace",pod=~"$workload-.*"}))/60'
      - step: 2
        title: "Classify the waiting / terminated state — main AND init containers"
        description: >-
          When the container never started (step 1), the waiting reason names the exact
          class. CRITICAL: check INIT containers too — a stuck/looping init container keeps
          the main container in PodInitializing and the pod Pending/not-ready, and the main
          container's own waiting reason will misleadingly read "PodInitializing" while the
          true failure is the init step. Interpret, in priority order:
          init_crashloop==1 OR init_restarts_15m>0 => an INIT container is failing
            (init_term_reason names why: Error/exit 1 = config/dependency/CRD/migration
            failure; OOMKilled = init memory). Root cause is the init step — read its logs
            in step 6 (name the init container). Do NOT call this a main-app crash.
          waiting_crashloop==1 => main container CrashLoopBackOff => follow KubePodCrashLooping.
          term_oom==1 OR last_exit==137 => OOMKilled => follow KubePodOOMKilled (size memory).
          waiting_image==1 => ImagePullBackOff/ErrImagePull => follow KubePodImagePullBackOff.
          waiting_config==1 => CreateContainerConfigError => missing/renamed Secret/ConfigMap/env.
          waiting_init==1 with NO init failure and NO crashloop => genuinely still pulling/
            mounting/initializing (volume, network, node startup) — correlate with pod_age_min
            and step 4; if young it may self-resolve, if old it is stuck.
          All zero AND container_running==1 => not a waiting problem; this is readiness-probe/
            app-health/dependency — go to step 3.
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "Main + init container waiting reasons (CrashLoopBackOff/ImagePull/Config/PodInitializing), init restarts and last-terminated reason, OOM and exit code."
            params:
              queries:
                - name: waiting_crashloop
                  query: 'max(max_over_time(kube_pod_container_status_waiting_reason{namespace="$namespace",pod=~"$workload-.*",reason="CrashLoopBackOff"}[15m]))'
                - name: waiting_image
                  query: 'max(max_over_time(kube_pod_container_status_waiting_reason{namespace="$namespace",pod=~"$workload-.*",reason=~"ImagePullBackOff|ErrImagePull|InvalidImageName"}[15m]))'
                - name: waiting_config
                  query: 'max(max_over_time(kube_pod_container_status_waiting_reason{namespace="$namespace",pod=~"$workload-.*",reason=~"CreateContainerConfigError|CreateContainerError"}[15m]))'
                - name: waiting_init
                  query: 'max(max_over_time(kube_pod_container_status_waiting_reason{namespace="$namespace",pod=~"$workload-.*",reason=~"PodInitializing|ContainerCreating"}[15m]))'
                - name: init_crashloop
                  query: 'max(max_over_time(kube_pod_init_container_status_waiting_reason{namespace="$namespace",pod=~"$workload-.*",reason="CrashLoopBackOff"}[15m]))'
                - name: init_restarts_15m
                  query: 'max(increase(kube_pod_init_container_status_restarts_total{namespace="$namespace",pod=~"$workload-.*"}[15m]))'
                - name: init_term_reason_error
                  query: 'max(kube_pod_init_container_status_last_terminated_reason{namespace="$namespace",pod=~"$workload-.*",reason="Error"})'
                - name: init_term_reason_oom
                  query: 'max(kube_pod_init_container_status_last_terminated_reason{namespace="$namespace",pod=~"$workload-.*",reason="OOMKilled"})'
                - name: term_oom
                  query: 'max(kube_pod_container_status_last_terminated_reason{namespace="$namespace",pod=~"$workload-.*",container="$container",reason="OOMKilled"})'
                - name: last_exit
                  query: 'max(kube_pod_container_status_last_terminated_exitcode{namespace="$namespace",pod=~"$workload-.*",container="$container"})'
      - step: 3
        title: "If running-but-unready: rule out resources and pin the failing dependency"
        description: >-
          Only relevant when step 1 showed container_running==1 AND container_ready==0
          (the container is up but its readiness probe keeps failing). Interpret:
          mem_util_pct >= 90 => near the memory limit; GC pauses/allocation stalls can fail
            the probe — treat as a sizing problem (KubePodOOMKilled path).
          cpu_throttle_pct high with a CPU limit set => CFS throttling stalls the event loop
            and trips readiness/liveness timeouts (platform policy: no CPU limit).
          dep_client_p95_ms high OR svc_graph_failed > 0 => a DOWNSTREAM dependency is slow/
            failing and the readiness probe gates on it — the topk label names WHICH edge/
            server. Root cause is the dependency, not this pod.
          If mem/cpu are comfortably below limits and there is no downstream failure, the
            probe itself is misconfigured (wrong path/port/threshold) or the app is
            internally unhealthy — step 6 logs carry the probe error line.
          HONEST GAP: OBI/OTel only exists for instrumented HTTP/gRPC services. For
            controllers, operators, jobs and other non-HTTP workloads these return n/a —
            say "no service telemetry for this workload" rather than inventing a dependency.
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "Memory vs limit %, CPU throttling, and (for instrumented services) downstream client p95 + failed service-graph edges with topk attribution."
            params:
              queries:
                - name: mem_util_pct
                  unit: "%"
                  query: '100*max(container_memory_working_set_bytes{namespace="$namespace",pod=~"$workload-.*",container="$container"})/max(kube_pod_container_resource_limits{namespace="$namespace",pod=~"$workload-.*",container="$container",resource="memory"})'
                  panel: true
                  panel_title: "Memory vs Limit %"
                  panel_id: "kube-mem-util-pct"
                - name: cpu_throttle_pct
                  unit: "%"
                  query: '100*max(rate(container_cpu_cfs_throttled_periods_total{namespace="$namespace",pod=~"$workload-.*",container="$container"}[5m]))/max(rate(container_cpu_cfs_periods_total{namespace="$namespace",pod=~"$workload-.*",container="$container"}[5m]))'
                - name: dep_client_p95_ms
                  unit: "ms"
                  query: 'histogram_quantile(0.95, sum by (le, server_address) (rate({__name__="http.client.request.duration_bucket",k8s_namespace_name="$namespace",k8s_owner_name="$workload"}[5m]))) * 1000'
                - name: svc_graph_failed
                  unit: "req/s"
                  query: 'topk(1, sum by (client, server) (rate(traces_service_graph_request_failed_total{client="$workload"}[5m])))'
      - step: 4
        title: "Check rollout drift and replica availability"
        description: >-
          Decide whether a recent rollout introduced the not-ready pods, and how wide the
          blast radius is. Interpret:
          replicas_ready < replicas_desired => the not-ready pod(s) are eating into
            availability; replicas_ready==0 means the workload is fully down.
          deploy_gen_lag>0 OR deploy_unavailable>0 with newest_rs_age_min small (roughly
            <30m) => a fresh rollout shipped a bad image/config/probe and is the fast path —
            rollback. If newest_rs_age_min is large and no generation lag, the failure is
            NOT rollout-driven (config drift, rotated secret, expired cert, dependency
            outage, or a node/init problem) — rely on steps 2/3 and the logs.
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "Desired vs ready/unavailable replicas, deployment generation lag, and newest ReplicaSet age."
            params:
              queries:
                - name: replicas_desired
                  unit: "pods"
                  query: 'max(kube_deployment_spec_replicas{namespace="$namespace",deployment="$workload"})'
                - name: replicas_ready
                  unit: "pods"
                  query: 'max(kube_deployment_status_replicas_ready{namespace="$namespace",deployment="$workload"})'
                - name: deploy_unavailable
                  unit: "pods"
                  query: 'max(kube_deployment_status_replicas_unavailable{namespace="$namespace",deployment="$workload"})'
                  panel: true
                  panel_title: "Replicas Unavailable"
                  panel_id: "kube-replicas-unavailable"
                - name: deploy_gen_lag
                  query: 'max(kube_deployment_metadata_generation{namespace="$namespace",deployment="$workload"})-max(kube_deployment_status_observed_generation{namespace="$namespace",deployment="$workload"})'
                - name: newest_rs_age_min
                  unit: "min"
                  query: '(time()-max(kube_replicaset_created{namespace="$namespace"} * on(replicaset,namespace) group_left(owner_name) kube_replicaset_owner{namespace="$namespace",owner_name="$workload"}))/60'
      - step: 5
        title: "Capture pod state, events, and probe metadata"
        description: "Confirm the metric pack against describe/events — Unhealthy (Readiness/Liveness/Startup probe failed), BackOff, Killing, FailedMount, FailedScheduling, and the init-container/last-state termination block (reason, exit code, message)."
        tool_calls:
          - tool_id: "tool.capture_diagnostics"
            description: "Pod status / warning events / describe — probe failures, init-container errors, scheduling/mount failures, last terminated reason and exit code."
          - tool_id: "tool.get_crash_context"
            description: "Crash/termination reason, container (incl. init), exit code, and recent failures for the not-ready pod."
      - step: 6
        title: "Read the exact failing line"
        description: >-
          Read logs from the container the previous steps blamed. If step 2 pointed to an
          INIT container, read THAT init container's logs for the fatal line (config/CRD/
          migration/dependency error). If a main container crashed, read the PREVIOUS
          container. If the container is running-but-unready, read current logs for the
          readiness/probe/dependency failure (connection refused, deadline exceeded, DNS,
          TLS, 503/504, "not ready", "waiting for"). Name the exact cause, not "check logs".
        tool_calls:
          - tool_id: "tool.read_logs"
            description: "Logs filtered for readiness/health/probe, init/config/secret/CRD/migration, and dependency (connection refused/timeout/DNS/TLS/503) signatures."
            params:
              previous: true
              tail_lines: 200
    remediation:   # only for suggestion — never auto-executed (forge.* are approval-gated)
      - action: "rollback_deployment"
        description: "Primary fix when step 4 shows a fresh rollout caused it (small newest_rs_age_min, generation lag, or a bad image/config/probe in the new revision). Restores the last-ready revision fastest."
        tool_id: "forge.revert_deployment"
        requires_approval: true
      - action: "patch_resources"
        description: "ONLY if a container/init was OOMKilled (step 2 term_oom/init_term_reason_oom) or step 3 showed mem_util_pct high: right-size memory (raise request AND limit together, keep request==limit) to ~1.3x the observed peak. If a CPU limit is throttling and stalling the probe, remove the CPU limit per policy."
        tool_id: "forge.patch_resources"
        requires_approval: true
      - action: "restart_deployment"
        description: "Only to restore availability when the cause is a TRANSIENT external dependency (e.g. an init step waiting on a now-recovered DB/registry) and config is valid. NOT a fix for a deterministic init/config/probe failure — it will loop straight back into not-ready."
        tool_id: "forge.restart_deployment"
        requires_approval: true
    escalation: >-
      Route by the classified cause — init/config/image/CRD: platform (the failing init step,
      secret, configmap, or registry); OOM/throttle: SRE (resource sizing/policy); readiness
      probe or app-health: app team. Page SRE + owning team if replicas_ready==0 or customer
      traffic is degraded.
    follow_up:
      - "Once the blocking container is named (init or main), file the concrete fix (the failing init command, CRD/migration, secret/config key, probe path/port, or image tag) — not a generic 'check logs'."
      - "If a rollout caused it, confirm the offending revision and validate the new revision's image/config/probe references before re-rolling."

  - name: "KubeDeploymentReplicasMismatch"
    patterns: ["KubeDeploymentReplicasMismatch", "deployment replicas mismatch"]
    priority: P2
    diagnostic_steps:
      - step: 1
        title: "Compare desired vs available replicas"
        description: "Quantify the replica gap and rollout generation lag from KSM before touching pods."
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "Pull desired/available/unavailable/updated replicas and generation lag for the deployment."
            params:
              queries:
                - name: "replicas_desired"
                  unit: "pods"
                  query: 'max(kube_deployment_spec_replicas{namespace="$namespace",deployment="$workload"})'
                  panel: true
                  panel_title: "Replicas Desired"
                  panel_id: "kube-replicas-desired"
                - name: "replicas_available"
                  unit: "pods"
                  query: 'max(kube_deployment_status_replicas_available{namespace="$namespace",deployment="$workload"})'
                  panel: true
                  panel_title: "Replicas Available"
                  panel_id: "kube-replicas-available"
                - name: "replicas_ready"
                  unit: "pods"
                  query: 'max(kube_deployment_status_replicas_ready{namespace="$namespace",deployment="$workload"})'
                - name: "replicas_unavailable"
                  unit: "pods"
                  query: 'max(kube_deployment_status_replicas_unavailable{namespace="$namespace",deployment="$workload"})'
                  panel: true
                  panel_title: "Replicas Unavailable"
                  panel_id: "kube-replicas-unavailable"
                - name: "replicas_updated"
                  unit: "pods"
                  query: 'max(kube_deployment_status_replicas_updated{namespace="$namespace",deployment="$workload"})'
                  panel: true
                  panel_title: "Replicas Updated"
                  panel_id: "kube-replicas-updated"
                - name: "generation_lag"
                  unit: ""
                  query: 'max(kube_deployment_metadata_generation{namespace="$namespace",deployment="$workload"}) - max(kube_deployment_status_observed_generation{namespace="$namespace",deployment="$workload"})'
      - step: 2
        title: "Find the pod-level cause"
        description: "The mismatch is a symptom — classify unavailable pods: Pending, CrashLoopBackOff, ImagePullBackOff, OOMKilled, or not-ready."
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "Count pods of this workload in each failure state."
            params:
              queries:
                - name: "pods_pending"
                  unit: "pods"
                  query: 'sum(kube_pod_status_phase{namespace="$namespace",pod=~"$workload-.*",phase="Pending"})'
                - name: "pods_crashloop"
                  unit: "pods"
                  query: 'sum(max by (pod) (kube_pod_container_status_waiting_reason{namespace="$namespace",pod=~"$workload-.*",reason="CrashLoopBackOff"}))'
                - name: "pods_image_pull_waiting"
                  unit: "pods"
                  query: 'sum(max by (pod) (kube_pod_container_status_waiting_reason{namespace="$namespace",pod=~"$workload-.*",reason=~"ImagePullBackOff|ErrImagePull|InvalidImageName"}))'
                - name: "pods_oom_recent"
                  unit: "pods"
                  query: 'sum(max by (pod) (max_over_time(kube_pod_container_status_last_terminated_reason{namespace="$namespace",pod=~"$workload-.*",reason="OOMKilled"}[1h])))'
                - name: "pods_not_ready"
                  unit: "pods"
                  query: 'sum(kube_pod_status_ready{namespace="$namespace",pod=~"$workload-.*",condition="false"})'
                  panel: true
                  panel_title: "Pods Not Ready"
                  panel_id: "kube-pods-not-ready"
          - tool_id: "tool.capture_diagnostics"
            description: "Inspect deployment conditions and associated pod status."
      - step: 3
        title: "Read logs from unavailable pods"
        description: "Confirm the pod-level cause (probe failures, startup errors, dependency failures)."
        tool_calls:
          - tool_id: "tool.read_logs"
            description: "Review recent error logs for the workload."
    remediation:  # suggest only
      - action: "rollback_deployment"
        description: "Roll back when the mismatch started with a new rollout (generation lag or updated<desired with new-revision pods failing)."
        tool_id: "forge.revert_deployment"
        requires_approval: true
      - action: "patch_resources"
        description: "Right-size memory/CPU when unavailable pods are OOMKilled or unschedulable due to resource requests."
        tool_id: "forge.patch_resources"
        requires_approval: true
    escalation: "SRE if sustained mismatch impacts availability for more than one release window."

  - name: "KubeDeploymentRolloutStuck"
    patterns: ["KubeDeploymentRolloutStuck", "deployment rollout stuck", "ProgressDeadlineExceeded", "rollout stuck"]
    priority: P1
    diagnostic_steps:
      - step: 1
        title: "Confirm the rollout is stuck and locate the failure stage"
        description: >-
          The rollout is not progressing (Progressing=false / ProgressDeadlineExceeded).
          Pinpoint WHERE it is stuck before looking at pods. Interpret:
          gen_lag>0 (metadata_generation > observed_generation) => the controller has NOT
            yet observed the latest spec — a controller/apiserver problem, not the pods;
            the new ReplicaSet may not even exist yet.
          updated < desired => the rollout is not creating/updating enough new-revision
            pods (often blocked by surge/unavailable limits while old pods can't drain, or
            quota).
          available < desired (especially available==0) => new pods are being created but
            NOT becoming Available — the dominant case; go to step 2 to classify why.
          unavailable>0 => exactly those not-yet-Available replicas; with available==0 the
            workload is fully down.
          cond_progressing_false==1 => the rollout tripped its progress deadline.
          Do NOT recommend a fix from this step alone — it only locates the stage.
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "Generation lag, desired/updated/available/unavailable replicas, and Progressing/Available conditions for the deployment."
            params:
              queries:
                - name: gen_lag
                  query: 'max(kube_deployment_metadata_generation{namespace="$namespace",deployment="$workload"})-max(kube_deployment_status_observed_generation{namespace="$namespace",deployment="$workload"})'
                  panel: true
                  panel_title: "Generation Lag"
                  panel_id: "kube-generation-lag"
                - name: replicas_desired
                  unit: "pods"
                  query: 'max(kube_deployment_spec_replicas{namespace="$namespace",deployment="$workload"})'
                  panel: true
                  panel_title: "Replicas Desired"
                  panel_id: "kube-replicas-desired"
                - name: replicas_updated
                  unit: "pods"
                  query: 'max(kube_deployment_status_replicas_updated{namespace="$namespace",deployment="$workload"})'
                  panel: true
                  panel_title: "Replicas Updated"
                  panel_id: "kube-replicas-updated"
                - name: replicas_available
                  unit: "pods"
                  query: 'max(kube_deployment_status_replicas_available{namespace="$namespace",deployment="$workload"})'
                  panel: true
                  panel_title: "Replicas Available"
                  panel_id: "kube-replicas-available"
                - name: replicas_unavailable
                  unit: "pods"
                  query: 'max(kube_deployment_status_replicas_unavailable{namespace="$namespace",deployment="$workload"})'
                - name: cond_progressing_false
                  query: 'max(kube_deployment_status_condition{namespace="$namespace",deployment="$workload",condition="Progressing",status="false"})'
                - name: cond_available_false
                  query: 'max(kube_deployment_status_condition{namespace="$namespace",deployment="$workload",condition="Available",status="false"})'
                - name: newest_rs_age_min
                  unit: "min"
                  query: '(time()-max(kube_replicaset_created{namespace="$namespace"} * on(replicaset,namespace) group_left(owner_name) kube_replicaset_owner{namespace="$namespace",owner_name="$workload"}))/60'
                  panel: true
                  panel_title: "Newest ReplicaSet Age"
                  panel_id: "kube-newest-rs-age"
      - step: 2
        title: "Classify why the new-revision pods are not becoming available"
        description: >-
          The stuck rollout is a symptom — the new pods are failing for a specific reason.
          Count the new-revision pods in each failure state and classify the crash, in
          priority order. Interpret:
          pods_image_pull>0 => bad image tag/registry auth in the new revision — the fast,
            certain rollback case (KubePodImagePullBackOff).
          pods_config_err>0 => the new revision references a missing/renamed Secret/ConfigMap/
            env — rollback or fix the reference (the config didn't ship with the rollout).
          pods_crashloop>0 => the new image crashes on startup — classify by termination:
            last_term_oom==1 / last_exit==137 => OOMKilled, the new revision needs more
              memory (KubePodOOMKilled).
            last_term_completed==1 / last_exit==0 => the process EXITS CLEANLY but the
              Deployment expects a long-running service — wrong command/args/mode, or a
              one-shot task deployed as a Deployment. NOT a resource problem.
            last_term_error==1 / last_exit==1 => generic app/config/dependency startup
              failure in the new code.
            last_exit==127 => bad entrypoint / missing binary in the new image.
          pods_pending>0 => the new pods can't be scheduled — insufficient CPU/memory/quota
            or affinity/taint (KubePodPendingTooLong); the cluster can't place the new revision.
          pods_not_ready>0 with none of the above => new pods run but fail their readiness
            probe — probe misconfig or a dependency the new revision can't reach (step 4 logs).
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "Count new-revision pods per failure state (image/config/crashloop/pending/not-ready) and classify the crash via last terminated reason + exit code."
            params:
              queries:
                - name: pods_not_ready
                  unit: "pods"
                  query: 'sum(kube_pod_status_ready{namespace="$namespace",pod=~"$workload-.*",condition="false"})'
                - name: pods_crashloop
                  unit: "pods"
                  query: 'sum(max by (pod)(kube_pod_container_status_waiting_reason{namespace="$namespace",pod=~"$workload-.*",reason="CrashLoopBackOff"}))'
                - name: pods_image_pull
                  unit: "pods"
                  query: 'sum(max by (pod)(kube_pod_container_status_waiting_reason{namespace="$namespace",pod=~"$workload-.*",reason=~"ImagePullBackOff|ErrImagePull|InvalidImageName"}))'
                - name: pods_config_err
                  unit: "pods"
                  query: 'sum(max by (pod)(kube_pod_container_status_waiting_reason{namespace="$namespace",pod=~"$workload-.*",reason=~"CreateContainerConfigError|CreateContainerError"}))'
                - name: pods_pending
                  unit: "pods"
                  query: 'sum(kube_pod_status_phase{namespace="$namespace",pod=~"$workload-.*",phase="Pending"})'
                - name: restarts_15m
                  query: 'sum(increase(kube_pod_container_status_restarts_total{namespace="$namespace",pod=~"$workload-.*"}[15m]))'
                - name: last_term_oom
                  query: 'max(kube_pod_container_status_last_terminated_reason{namespace="$namespace",pod=~"$workload-.*",reason="OOMKilled"})'
                - name: last_term_error
                  query: 'max(kube_pod_container_status_last_terminated_reason{namespace="$namespace",pod=~"$workload-.*",reason="Error"})'
                - name: last_term_completed
                  query: 'max(kube_pod_container_status_last_terminated_reason{namespace="$namespace",pod=~"$workload-.*",reason="Completed"})'
                - name: last_exit
                  query: 'max(kube_pod_container_status_last_terminated_exitcode{namespace="$namespace",pod=~"$workload-.*"})'
      - step: 3
        title: "Capture rollout conditions and new-pod events"
        description: "Confirm the metric pack against the deployment conditions and the new ReplicaSet's pod events — ProgressDeadlineExceeded, FailedCreate (quota/limit-range), 'Failed to pull image', CreateContainerConfigError naming the missing object, probe Unhealthy, FailedScheduling, and the last-state termination block (reason, exit code)."
        tool_calls:
          - tool_id: "tool.capture_diagnostics"
            description: "Deployment conditions + new-revision pod events (pull/config/probe/scheduling/quota) and last terminated reason/exit code."
          - tool_id: "tool.get_crash_context"
            description: "Crash/termination reason, container, and exit code for the failing new-revision pods."
      - step: 4
        title: "Read the new revision's failing line"
        description: >-
          Read logs from the NEW-revision pods to name the exact failure. For a crashing
          container read the PREVIOUS container for the fatal line (startup/config/migration/
          dependency error, or a clean exit indicating the wrong command/mode). For image/
          config waiting reasons the container produced no logs — rely on the step 3 events.
          State the concrete cause (image tag, missing Secret/ConfigMap, wrong command,
          failed migration, unreachable dependency), not "rollout stuck".
        tool_calls:
          - tool_id: "tool.read_logs"
            description: "New-revision pod logs (previous container) filtered for startup/config/secret/migration/dependency and clean-exit signatures."
            params:
              previous: true
              tail_lines: 200
    remediation:   # only for suggestion — never auto-executed (forge.* are approval-gated)
      - action: "rollback_deployment"
        description: "Primary fix — the new revision is the thing that broke (bad image, config/secret reference, crash, or OOM shipped in this rollout). Roll back to the last-ready revision to restore availability fast, then fix forward off-cycle. Lead action for a stuck rollout."
        tool_id: "forge.revert_deployment"
        requires_approval: true
      - action: "patch_resources"
        description: "ONLY if step 2 showed the new pods are OOMKilled (last_term_oom / exit 137) or Pending due to resource requests: right-size memory (request==limit ~1.3x peak) or lower an unschedulable request so the new revision can be placed."
        tool_id: "forge.patch_resources"
        requires_approval: true
      - action: "restart_deployment"
        description: "Rarely useful — only to retrigger creation when gen_lag>0 cleared or pods are wedged in a transient ContainerCreating that has since resolved. NOT a fix for a bad image/config/crash in the new revision; it will stick again."
        tool_id: "forge.restart_deployment"
        requires_approval: true
    escalation: >-
      Immediate app-team + SRE for a production rollout failure. Route by classified cause —
      image/config: platform + service owner (registry/tag, missing Secret/ConfigMap);
      crash/wrong-command/migration: app team (the new code/command); OOM/Pending-on-resources:
      SRE (sizing/capacity). Page if available==0 (workload fully down).
    follow_up:
      - "After rollback, reproduce the failure on the bad revision off-cycle and file the concrete fix (image tag, command/args, Secret/ConfigMap key, migration, or memory size) before re-rolling."
      - "If exit was clean (Completed/0), confirm whether the workload is actually long-running or was mistakenly shipped as a Deployment instead of a Job/CronJob."

  - name: "KubeStatefulSetReplicasMismatch"
    patterns: ["KubeStatefulSetReplicasMismatch", "statefulset not ready", "statefulset replicas not ready"]
    priority: P1
    diagnostic_steps:
      - step: 1
        title: "Confirm the replica gap and locate the rollout stage"
        description: >-
          Ready replicas are below desired. StatefulSets progress in STRICT ORDINAL ORDER —
          one stuck pod (name-0, then name-1, …) blocks every higher ordinal — so the gap is
          a symptom and the lowest failing ordinal is the real target. Interpret:
          replicas_ready < replicas_desired => mismatch confirmed; replicas_ready==0 means
            the stateful workload is fully down.
          generation_lag>0 (metadata_generation > observed_generation) => the controller has
            NOT observed the latest spec — controller/apiserver problem, not the pods.
          replicas_updated < replicas_desired => an ordered update/rollout is blocked partway
            (a lower ordinal won't go Ready, so the rest never update).
          replicas_current < replicas_desired => the StatefulSet controller has not even
            created all pods yet (often the lowest ordinal is unschedulable / PVC unbound).
          Do NOT recommend a fix from this step — it only locates the stage; step 2 classifies
          the failing ordinal and step 3 checks its storage.
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "Pull desired/ready/current/updated replica counts and generation lag for the statefulset."
            params:
              queries:
                - name: "replicas_desired"
                  unit: "pods"
                  query: 'max(kube_statefulset_replicas{namespace="$namespace",statefulset="$workload"})'
                  panel: true
                  panel_title: "Replicas Desired"
                  panel_id: "kube-replicas-desired"
                - name: "replicas_ready"
                  unit: "pods"
                  query: 'max(kube_statefulset_status_replicas_ready{namespace="$namespace",statefulset="$workload"})'
                  panel: true
                  panel_title: "Replicas Ready"
                  panel_id: "kube-replicas-ready"
                - name: "replicas_current"
                  unit: "pods"
                  query: 'max(kube_statefulset_status_replicas_current{namespace="$namespace",statefulset="$workload"})'
                  panel: true
                  panel_title: "Replicas Current"
                  panel_id: "kube-replicas-current"
                - name: "replicas_updated"
                  unit: "pods"
                  query: 'max(kube_statefulset_status_replicas_updated{namespace="$namespace",statefulset="$workload"})'
                  panel: true
                  panel_title: "Replicas Updated"
                  panel_id: "kube-replicas-updated"
                - name: "generation_lag"
                  unit: ""
                  query: 'max(kube_statefulset_metadata_generation{namespace="$namespace",statefulset="$workload"}) - max(kube_statefulset_status_observed_generation{namespace="$namespace",statefulset="$workload"})'
                  panel: true
                  panel_title: "Generation Lag"
                  panel_id: "kube-generation-lag"
      - step: 2
        title: "Classify the failing ordinal pod(s)"
        description: >-
          Count the StatefulSet's ordinal pods (name-0, name-1, …) in each failure state and
          branch in priority order — the LOWEST failing ordinal is the blocker. Interpret:
          pods_image_pull>0 => bad image tag/registry auth (KubePodImagePullBackOff).
          pods_config_err>0 => missing/renamed Secret/ConfigMap/env reference.
          pods_crashloop>0 OR restarts_15m high => the app crashes on start; if pods_oom_recent>0
            it is OOMKilled (size memory, KubePodOOMKilled), else classify via logs (step 4).
          pods_pending>0 => the ordinal can't be scheduled — most often its PVC is unbound
            (step 3) or there is no node/resource room (KubePodPendingTooLong).
          pods_not_ready>0 with none of the above => the pod runs but fails its readiness probe
            — probe misconfig, slow stateful bootstrap (replication/quorum/recovery), or a
            dependency the pod can't reach. Step 4 logs are decisive.
          If counts are zero and replicas are healthy now, the alert has RECOVERED — say so
          with the live numbers rather than inventing a failure.
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "Count ordinal pods (name-0, name-1, …) in each failure state: pending, crashloop, image-pull, config-error, OOM, not-ready, restarts."
            params:
              queries:
                - name: "pods_pending"
                  unit: "pods"
                  query: 'sum(kube_pod_status_phase{namespace="$namespace",pod=~"$workload-[0-9]+",phase="Pending"})'
                - name: "pods_crashloop"
                  unit: "pods"
                  query: 'sum(max by (pod) (kube_pod_container_status_waiting_reason{namespace="$namespace",pod=~"$workload-[0-9]+",reason="CrashLoopBackOff"}))'
                - name: "pods_image_pull_waiting"
                  unit: "pods"
                  query: 'sum(max by (pod) (kube_pod_container_status_waiting_reason{namespace="$namespace",pod=~"$workload-[0-9]+",reason=~"ImagePullBackOff|ErrImagePull|InvalidImageName"}))'
                - name: "pods_config_err"
                  unit: "pods"
                  query: 'sum(max by (pod) (kube_pod_container_status_waiting_reason{namespace="$namespace",pod=~"$workload-[0-9]+",reason=~"CreateContainerConfigError|CreateContainerError"}))'
                - name: "pods_oom_recent"
                  unit: "pods"
                  query: 'sum(max by (pod) (max_over_time(kube_pod_container_status_last_terminated_reason{namespace="$namespace",pod=~"$workload-[0-9]+",reason="OOMKilled"}[1h])))'
                - name: "pods_not_ready"
                  unit: "pods"
                  query: 'sum(kube_pod_status_ready{namespace="$namespace",pod=~"$workload-[0-9]+",condition="false"})'
                - name: "restarts_15m"
                  query: 'sum(increase(kube_pod_container_status_restarts_total{namespace="$namespace",pod=~"$workload-[0-9]+"}[15m]))'
      - step: 3
        title: "Check the StatefulSet's storage (PVC binding / volume)"
        description: >-
          Storage is the StatefulSet-specific failure mode — each ordinal owns a PVC from the
          volumeClaimTemplate, and an unbound/lost volume keeps its pod Pending or not-ready
          and blocks the ordinal sequence. PVCs are named <template>-<statefulset>-<ordinal>.
          Interpret:
          pvc_pending>0 => a PVC is not binding — no matching PV / provisioner failing / wrong
            StorageClass / quota; the pod cannot start until it binds (storage backend RCA).
          pvc_lost>0 => a bound volume was LOST — storage backend / CSI failure; data-loss risk,
            escalate to storage immediately.
          pvc_bound == replicas_desired with pods still not ready => storage is fine; the
            blocker is app/probe/crash (steps 2 and 4), not the volume.
          HONEST GAP: PVC attach/mount failures (FailedMount, attach timeouts) live in pod
            EVENTS, not these phase gauges — confirm in step 4's capture_diagnostics.
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "PVC phase counts (Bound/Pending/Lost) for this statefulset's claims."
            params:
              queries:
                - name: "pvc_bound"
                  unit: "pvc"
                  query: 'sum(kube_persistentvolumeclaim_status_phase{namespace="$namespace",persistentvolumeclaim=~".*$workload.*",phase="Bound"})'
                - name: "pvc_pending"
                  unit: "pvc"
                  query: 'sum(kube_persistentvolumeclaim_status_phase{namespace="$namespace",persistentvolumeclaim=~".*$workload.*",phase="Pending"})'
                - name: "pvc_lost"
                  unit: "pvc"
                  query: 'sum(kube_persistentvolumeclaim_status_phase{namespace="$namespace",persistentvolumeclaim=~".*$workload.*",phase="Lost"})'
          - tool_id: "tool.capture_diagnostics"
            description: "Inspect the lowest failing ordinal's events — FailedMount / volume attach / FailedScheduling / probe Unhealthy — and confirm PVC binding."
          - tool_id: "tool.get_crash_context"
            description: "Crash/termination reason, container, and exit code for the failing ordinal pod."
      - step: 4
        title: "Read the failing ordinal's logs"
        description: >-
          Read logs from the LOWEST failing ordinal (name-0 before name-1). Separate storage
          signatures (volume/mount/attach/permission/read-only filesystem) from app-startup
          signatures (config/secret/migration/dependency, or replication/quorum/recovery for
          clustered stateful apps). For a crashed container read the PREVIOUS container. Name
          the concrete blocker (unbound PVC, failed mount, missing secret, quorum wait), not
          "statefulset not ready".
        tool_calls:
          - tool_id: "tool.read_logs"
            description: "Lowest-ordinal pod logs filtered for storage (volume/mount/attach/permission/read-only) and app-startup (config/secret/migration/dependency/quorum) signatures."
            params:
              previous: true
              tail_lines: 200
    remediation:   # only for suggestion — never auto-executed (forge.* are approval-gated)
      - action: "patch_resources"
        description: "ONLY if step 2 showed the ordinal was OOMKilled (pods_oom_recent>0): right-size memory (raise request AND limit together, keep request==limit) to ~1.3x the observed peak. The most common safe fix for a stateful pod that won't stay ready."
        tool_id: "forge.patch_resources"
        requires_approval: true
      - action: "restart_deployment"
        description: "Use with CARE on a StatefulSet — only to clear a TRANSIENT stuck state (a now-recovered dependency or a wedged mount that has since cleared). Deleting the blocked ordinal lets the controller recreate it in order. NOT a fix for an unbound PVC, lost volume, missing secret, or a deterministic crash — it will block on the same ordinal again."
        tool_id: "forge.restart_deployment"
        requires_approval: true
    escalation: >-
      Route by classified cause — PVC Pending/Lost or FailedMount: STORAGE/platform team
      immediately (Lost volume = data-loss risk); image/config: platform + service owner;
      OOM: SRE (sizing); crash/quorum/replication: the owning stateful-app team. Page if
      replicas_ready==0 (workload fully down). StatefulSet rollbacks are risky (data/schema) —
      coordinate with the data owner before reverting a revision.
    follow_up:
      - "Name the lowest failing ordinal and its concrete blocker (unbound PVC + StorageClass, failed mount, missing secret, OOM size, or quorum/bootstrap wait) — not a generic 'check storage'."
      - "If a PVC will not bind, verify the StorageClass, provisioner health, and namespace storage quota before recreating the pod."

  - name: "KubeDaemonSetNotScheduled"
    patterns: ["KubeDaemonSetNotScheduled", "daemonset not scheduled", "daemonset not fully ready", "taint mismatch"]
    priority: P2
    diagnostic_steps:
      - step: 1
        title: "Quantify the scheduling gap"
        description: "Compare desired vs scheduled/ready DaemonSet pods and check for misscheduled pods."
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "Pull DaemonSet desired/scheduled/ready/unavailable/misscheduled counts from KSM."
            params:
              queries:
                - name: "ds_desired"
                  unit: "pods"
                  query: 'max(kube_daemonset_status_desired_number_scheduled{namespace="$namespace",daemonset="$workload"})'
                  panel: true
                  panel_title: "Desired Scheduled"
                  panel_id: "kube-ds-desired"
                - name: "ds_scheduled"
                  unit: "pods"
                  query: 'max(kube_daemonset_status_current_number_scheduled{namespace="$namespace",daemonset="$workload"})'
                  panel: true
                  panel_title: "Currently Scheduled"
                  panel_id: "kube-ds-scheduled"
                - name: "ds_ready"
                  unit: "pods"
                  query: 'max(kube_daemonset_status_number_ready{namespace="$namespace",daemonset="$workload"})'
                  panel: true
                  panel_title: "Ready"
                  panel_id: "kube-ds-ready"
                - name: "ds_unavailable"
                  unit: "pods"
                  query: 'max(kube_daemonset_status_number_unavailable{namespace="$namespace",daemonset="$workload"})'
                  panel: true
                  panel_title: "Unavailable"
                  panel_id: "kube-ds-unavailable"
                - name: "ds_misscheduled"
                  unit: "pods"
                  query: 'max(kube_daemonset_status_number_misscheduled{namespace="$namespace",daemonset="$workload"})'
      - step: 2
        title: "Check node-level blockers"
        description: "DaemonSet gaps are usually node problems: NotReady nodes, cordons, resource pressure, or taints the DaemonSet does not tolerate."
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "Count cluster nodes that are NotReady, cordoned, or under memory/disk pressure."
            params:
              queries:
                - name: "nodes_total"
                  unit: "nodes"
                  query: 'count(kube_node_info)'
                - name: "nodes_not_ready"
                  unit: "nodes"
                  query: 'sum(kube_node_status_condition{condition="Ready",status="false"})'
                  panel: true
                  panel_title: "Nodes Not Ready"
                  panel_id: "kube-nodes-not-ready"
                - name: "nodes_unschedulable"
                  unit: "nodes"
                  query: 'sum(kube_node_spec_unschedulable)'
                - name: "nodes_memory_pressure"
                  unit: "nodes"
                  query: 'sum(kube_node_status_condition{condition="MemoryPressure",status="true"})'
                - name: "nodes_disk_pressure"
                  unit: "nodes"
                  query: 'sum(kube_node_status_condition{condition="DiskPressure",status="true"})'
          - tool_id: "tool.capture_diagnostics"
            description: "Inspect DaemonSet desired/current/ready and node scheduling events."
      - step: 3
        title: "Validate scheduling constraints"
        description: "If no node is unhealthy, review taints/tolerations, node selectors, affinity, and per-node resource requests (requires kubectl describe ds / describe node — metrics cannot prove taint mismatches)."
        tool_calls:
          - tool_id: "tool.read_logs"
            description: "Review DaemonSet pod logs for scheduling/startup errors on the affected nodes."
    remediation: []
    escalation: "Platform team if daemon workload is required for node observability or security controls."

  - name: "KubePodImagePullBackOff"
    patterns: ["KubePodImagePullBackOff", "ImagePullBackOff", "ErrImagePull"]
    priority: P2
    diagnostic_steps:
      - step: 1
        title: "Confirm the pull failure state"
        description: "Verify the container is waiting on an image pull and whether it has ever started. The container never runs, so pod events — not app logs — carry the exact registry error."
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "Check waiting reasons (ImagePullBackOff/ErrImagePull/InvalidImageName) and pod phase for the exact pod."
            params:
              queries:
                - name: "waiting_image_pull_backoff"
                  unit: ""
                  query: 'max(kube_pod_container_status_waiting_reason{namespace="$namespace",pod="$pod",container="$container",reason="ImagePullBackOff"})'
                  panel: true
                  panel_title: "Waiting: ImagePullBackOff"
                  panel_id: "kube-waiting-imagepullbackoff"
                - name: "waiting_err_image_pull"
                  unit: ""
                  query: 'max(kube_pod_container_status_waiting_reason{namespace="$namespace",pod="$pod",container="$container",reason="ErrImagePull"})'
                  panel: true
                  panel_title: "Waiting: ErrImagePull"
                  panel_id: "kube-waiting-errimagepull"
                - name: "waiting_invalid_image"
                  unit: ""
                  query: 'max(kube_pod_container_status_waiting_reason{namespace="$namespace",pod="$pod",container="$container",reason="InvalidImageName"})'
                - name: "pod_phase_pending"
                  unit: ""
                  query: 'max(kube_pod_status_phase{namespace="$namespace",pod="$pod",phase="Pending"})'
                  panel: true
                  panel_title: "Pod Pending"
                  panel_id: "kube-pod-pending"
                - name: "container_ready"
                  unit: ""
                  query: 'max(kube_pod_container_status_ready{namespace="$namespace",pod="$pod",container="$container"})'
                  panel: true
                  panel_title: "Container Ready"
                  panel_id: "kube-container-ready"
                - name: "restarts_6h"
                  unit: ""
                  query: 'max(increase(kube_pod_container_status_restarts_total{namespace="$namespace",pod="$pod",container="$container"}[6h]))'
                  panel: true
                  panel_title: "Restarts (6h)"
                  panel_id: "kube-restarts-6h"
      - step: 2
        title: "Determine pull failure mode"
        description: "Differentiate auth failure, missing tag, registry outage, or DNS/network issue. The pod events (Failed to pull image: manifest unknown / unauthorized / timeout) are the primary RCA artifact."
        tool_calls:
          - tool_id: "tool.capture_diagnostics"
            description: "Review pull event messages from describe output."
    remediation:  # only suggestion
      - action: "rollback_deployment"
        description: "Rollback when image/tag regression is confirmed."
        tool_id: "forge.revert_deployment"
        requires_approval: true
    escalation: "Platform team if pull secrets, registry credentials, or connectivity are broken."

  - name: "KubeJobFailed"
    patterns: ["KubeJobFailed", "job failed", "BackoffLimitExceeded"]
    priority: P2
    diagnostic_steps:
      - step: 1
        title: "Confirm the Job failed and scope the run"
        description: >-
          Confirm from the Job's own counters before touching pods (the pods are often
          already gone — see step 2). Queries are scoped to the Job via $job (KSM label
          job_name). Interpret:
          failed>0 AND succeeded==0 => the Job failed and never produced a successful
            completion — confirmed failure.
          active==0 AND succeeded==0 => the Job has ended without success (no pods still
            running) — it will not self-recover; the failure is terminal until re-run.
          failed >= spec_backoff_limit (or failed climbing) => BackoffLimitExceeded — the
            Job retried to its limit and gave up; the per-attempt cause is in steps 2/4.
          succeeded == spec_completions => the Job actually completed — likely a stale/
            flapping alert; say so with the live counts rather than inventing a failure.
          Do NOT recommend a fix from this step — it only confirms; step 2 classifies why.
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "Job failed/succeeded/active counts, required completions/parallelism, and backoff limit."
            params:
              queries:
                - name: failed
                  query: 'max(kube_job_status_failed{namespace="$namespace",job_name="$job"})'
                  panel: true
                  panel_title: "Failed Pods"
                  panel_id: "kube-job-failed"
                - name: succeeded
                  query: 'max(kube_job_status_succeeded{namespace="$namespace",job_name="$job"})'
                  panel: true
                  panel_title: "Succeeded Pods"
                  panel_id: "kube-job-succeeded"
                - name: active
                  query: 'max(kube_job_status_active{namespace="$namespace",job_name="$job"})'
                  panel: true
                  panel_title: "Active Pods"
                  panel_id: "kube-job-active"
                - name: spec_completions
                  query: 'max(kube_job_spec_completions{namespace="$namespace",job_name="$job"})'
                  panel: true
                  panel_title: "Spec Completions"
                  panel_id: "kube-job-completions"
                - name: spec_parallelism
                  query: 'max(kube_job_spec_parallelism{namespace="$namespace",job_name="$job"})'
                - name: spec_backoff_limit
                  query: 'max(kube_job_spec_backoff_limit{namespace="$namespace",job_name="$job"})'
                - name: cond_failed
                  query: 'max(kube_job_status_condition{namespace="$namespace",job_name="$job",condition="Failed",status="true"})'
      - step: 2
        title: "Classify the failure via the Job's pod(s)"
        description: >-
          The Job's pods are named <job_name>-<hash>; classify their termination to name the
          cause. Interpret:
          last_term_oom>0 OR last_exit==137 => OOMKilled — the task exceeded its memory limit
            (size memory in the Job template, KubePodOOMKilled).
          waiting_image>0 => ImagePullBackOff/ErrImagePull — bad image tag / registry auth.
          waiting_config>0 => CreateContainerConfigError — missing/renamed Secret/ConfigMap/env.
          last_exit==1 => generic app error / failed dependency / bad data — logs (step 4) decisive.
          last_exit==2 => CLI usage / bad argument. last_exit==127 => command not found /
            bad entrypoint. last_exit==126 => not executable (permission/exec-bit).
          HONEST GAP: Kubernetes garbage-collects Job pods after they finish (ttlSecondsAfter
            Finished / failed-pod cleanup), so these pod-level metrics are FREQUENTLY n/a even
            though the Job's failed counter (step 1) persists. If they are all n/a, say the
            failed pods have been cleaned up and rely on the Job status (step 1) plus the LOGS
            (step 4) — which Loki retains by pod/job label past pod deletion. Do NOT invent an
            exit code that isn't there.
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "Job-pod last terminated reason (OOM/Error), exit code, image/config waiting reasons, and restarts — may be n/a if pods were garbage-collected."
            params:
              queries:
                - name: last_term_oom
                  query: 'max(kube_pod_container_status_last_terminated_reason{namespace="$namespace",pod=~"$job-.*",reason="OOMKilled"})'
                - name: last_term_error
                  query: 'max(kube_pod_container_status_last_terminated_reason{namespace="$namespace",pod=~"$job-.*",reason="Error"})'
                - name: last_exit
                  query: 'max(kube_pod_container_status_last_terminated_exitcode{namespace="$namespace",pod=~"$job-.*"})'
                - name: waiting_image
                  query: 'max(max_over_time(kube_pod_container_status_waiting_reason{namespace="$namespace",pod=~"$job-.*",reason=~"ImagePullBackOff|ErrImagePull|InvalidImageName"}[30m]))'
                - name: waiting_config
                  query: 'max(max_over_time(kube_pod_container_status_waiting_reason{namespace="$namespace",pod=~"$job-.*",reason=~"CreateContainerConfigError|CreateContainerError"}[30m]))'
                - name: restarts_30m
                  query: 'sum(increase(kube_pod_container_status_restarts_total{namespace="$namespace",pod=~"$job-.*"}[30m]))'
                  panel: true
                  panel_title: "Restarts (30m)"
                  panel_id: "kube-restarts-30m"
      - step: 3
        title: "Capture Job conditions and pod events"
        description: "Confirm the metric pack against the Job/pod events — the Job's Failed condition reason (BackoffLimitExceeded, DeadlineExceeded/ActiveDeadlineSeconds), and, if any pod still exists, 'Failed to pull image', CreateContainerConfigError naming the missing object, FailedScheduling, and the last-state termination block (reason, exit code)."
        tool_calls:
          - tool_id: "tool.capture_diagnostics"
            description: "Job status/conditions (BackoffLimitExceeded/DeadlineExceeded) and any surviving pod events (pull/config/scheduling) + last terminated reason/exit code."
          - tool_id: "tool.get_crash_context"
            description: "Crash/termination reason, container, and exit code for the Job's failed pod, if still present."
      - step: 4
        title: "Read the Job's failure logs"
        description: >-
          Logs are the primary artifact for a failed Job because the pods are usually gone —
          Loki retains them by pod/job label past pod deletion. Read for the exact fatal line:
          application error / unhandled exception / stack trace, bad input/data, a failed
          dependency (connection refused / timeout / DNS / unauthorized / forbidden), or a
          missing config/secret/env. Name the concrete failure, not "job failed".
        tool_calls:
          - tool_id: "tool.read_logs"
            description: "Job pod logs (by job/pod label) filtered for error/exception/fatal/traceback and config/secret/dependency signatures."
            params:
              previous: true
              tail_lines: 200
    remediation:   # only for suggestion — never auto-executed (forge.* are approval-gated)
      - action: "patch_resources"
        description: "ONLY if step 2 proved OOMKilled (last_term_oom / exit 137): right-size memory in the JOB's pod template (raise request AND limit, keep request==limit) so the next run survives. Patches the template only — it does NOT re-run the failed Job."
        tool_id: "forge.patch_resources"
        requires_approval: true
    escalation: >-
      Route by classified cause — app error / bad command / bad data (exit 1/2/127): the
      owning batch/app team; image or config/secret: platform; OOM: SRE (sizing);
      DeadlineExceeded: app team (the task is too slow or wedged). NOTE: re-running a failed
      Job is a manual/platform action (delete + recreate, or re-trigger the owning CronJob) —
      forge does not auto-re-run Jobs; fix the root cause first, then re-run.
    follow_up:
      - "Name the concrete failure from the logs (the exception, missing config/secret, failed dependency, bad input, or OOM size) — not a generic 'job failed'."
      - "If this Job is driven by a CronJob, confirm whether prior runs failed the same way (systemic) or this is a one-off (bad input / transient dependency) before re-running."

  - name: "KubeCronJobSuspended"
    patterns:
      [
        "KubeCronJobSuspended",
        "cronjob suspended",
        "cronjob not scheduling",
        "spec.suspend",
      ]
    priority: P3
    diagnostic_steps:
      - step: 1
        title: "Confirm the suspension and how long scheduling has actually been stopped"
        description: >-
          `spec.suspend=true` stops the controller creating new Jobs; running Jobs are NOT
          killed. The question is never "is it suspended" (the alert says so) but "was that
          intended, and what has been missed". Report against the CronJob named in the alert
          ($cronjob). Interpret:
          cj_suspended == 1 => suspension confirmed on the object.
          cj_suspended == 0 => the CronJob is NOT suspended any more — someone already resumed
            it, or the alert is stale. Say so and check cj_min_since_last to confirm it has
            since run, instead of recommending a resume.
          min_since_last_schedule >> the schedule interval (from cj_schedule) => real missed
            runs; multiply out how many runs were skipped and name the interval. This is the
            business impact of the suspension.
          min_since_last_schedule <= one interval => suspended only moments ago; nothing missed
            yet — the fix is cheap if unintended.
          cj_active > 0 => a Job from before the suspension is STILL running; do not treat the
            pipeline as fully stopped, and do not delete the CronJob while it runs.
          cj_min_to_next negative => the next scheduled time has passed with no Job created —
            consistent with the suspension (or, if not suspended, a controller problem).
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "Suspend flag, minutes since the last schedule and until the next, active Jobs, and the CronJob's own schedule/concurrency policy (lifted into labels so the RCA can quote the cron expression)."
            params:
              queries:
                - name: cj_suspended
                  query: 'max(kube_cronjob_spec_suspend{namespace="$namespace",cronjob="$cronjob"})'
                  panel: true
                  panel_title: "Suspended"
                  panel_id: "kube-cronjob-suspended"
                - name: cj_min_since_last_schedule
                  unit: "min"
                  query: '(time() - max(kube_cronjob_status_last_schedule_time{namespace="$namespace",cronjob="$cronjob"})) / 60'
                  panel: true
                  panel_title: "Minutes Since Last Schedule"
                  panel_id: "kube-cronjob-min-since-last"
                - name: cj_min_to_next_schedule
                  unit: "min"
                  query: '(max(kube_cronjob_next_schedule_time{namespace="$namespace",cronjob="$cronjob"}) - time()) / 60'
                  panel: true
                  panel_title: "Minutes to Next Schedule"
                  panel_id: "kube-cronjob-min-to-next"
                - name: cj_active
                  unit: "jobs"
                  query: 'max(kube_cronjob_status_active{namespace="$namespace",cronjob="$cronjob"})'
                  panel: true
                  panel_title: "Active Jobs"
                  panel_id: "kube-cronjob-active"
                # `by (schedule, concurrency_policy)` lifts the cron expression into the result
                # labels so the RCA can state the real interval instead of guessing it.
                - name: cj_schedule
                  query: 'max by (schedule, concurrency_policy) (kube_cronjob_info{namespace="$namespace",cronjob="$cronjob"})'
      - step: 2
        title: "Decide intentional vs accidental from the Job history and the blast radius"
        description: >-
          A deliberate suspension (maintenance, migration, cost) looks different from drift.
          Interpret:
          cj_jobs_failed_24h > 0 AND cj_jobs_succeeded_24h == 0 => the CronJob was very likely
            suspended BECAUSE it was failing — resuming it without fixing the Job will just
            resume the failures. Investigate the failed Job first (KubeJobFailed).
          cj_jobs_succeeded_24h > 0 => it was healthy right up to the suspension — accidental
            drift or planned maintenance is far more likely than a deliberate stop for failure.
          cj_ns_suspended >> 1 or cj_cluster_suspended >> 1 => a batch of CronJobs was suspended
            together (namespace freeze, migration, cost exercise) — almost certainly deliberate;
            treat as expected state and confirm with the owner rather than resuming unilaterally.
            These counts are label-free blast-radius scalars ONLY — keep reporting the alert's
            own CronJob by name.
          Whether the suspension is intentional CANNOT be proven from metrics — say which
          evidence points which way and ask the owner; do not assert intent.
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "Failed/succeeded Jobs spawned by this CronJob in the last 24h, and how many other CronJobs are suspended in the namespace and cluster."
            params:
              queries:
                # CronJob-spawned Jobs are named <cronjob>-<timestamp>, so job_name=~"$cronjob-.*"
                # attributes Job outcomes back to this CronJob.
                - name: cj_jobs_failed_24h
                  unit: "jobs"
                  query: 'sum(max_over_time(kube_job_status_failed{namespace="$namespace",job_name=~"$cronjob-.*"}[24h])) or vector(0)'
                  panel: true
                  panel_title: "Jobs Failed (24h)"
                  panel_id: "kube-cronjob-jobs-failed-24h"
                - name: cj_jobs_succeeded_24h
                  unit: "jobs"
                  query: 'sum(max_over_time(kube_job_status_succeeded{namespace="$namespace",job_name=~"$cronjob-.*"}[24h])) or vector(0)'
                  panel: true
                  panel_title: "Jobs Succeeded (24h)"
                  panel_id: "kube-cronjob-jobs-succeeded-24h"
                - name: cj_ns_suspended
                  unit: "cronjobs"
                  query: 'count(kube_cronjob_spec_suspend{namespace="$namespace"} == 1) or vector(0)'
                - name: cj_cluster_suspended
                  unit: "cronjobs"
                  query: 'count(kube_cronjob_spec_suspend == 1) or vector(0)'
          - tool_id: "tool.capture_diagnostics"
            description: "Collect the CronJob object (spec.suspend, schedule, concurrencyPolicy, last-applied annotation) and its recent Job history."
    remediation:
      - action: "Resume the CronJob (set spec.suspend=false)"
        description: >-
          ONLY if step 2 showed the CronJob was healthy before suspension (cj_jobs_succeeded_24h
          > 0, no failures) and the owner confirms the stop was unintended. Do NOT resume when
          cj_jobs_failed_24h > 0 with no successes — fix the failing Job first, or the failures
          resume with it. Also do not resume when a namespace-wide freeze is in effect
          (cj_ns_suspended >> 1) without the owner's go-ahead.
        tool_id: "forge.patch_resources"
        requires_approval: true
    escalation: "Service owner — only they can confirm whether the suspension was planned and whether the missed runs need a manual backfill."
    follow_up: >-
      Metrics cannot show WHO suspended the CronJob or why; that lives in the object's
      annotations / audit log / change record. Forge reports the state, the missed-run count and
      the pre-suspension health, and says intent is unproven rather than inferring it. There is
      also no metric for a backfill requirement — whether skipped runs must be re-run is a
      business decision for the owner.

  - name: "KubePodEvicted"
    patterns: ["KubePodEvicted", "pod evicted", "evicted", "node pressure"]
    priority: P2
    diagnostic_steps:
      - step: 1
        title: "Confirm the eviction and the pod's eviction priority"
        description: >-
          Eviction is a NODE-level action by the kubelet, not an app crash — the kubelet
          reclaims resources by killing pods, lowest QoS first. IMPORTANT: an evicted pod is
          usually deleted quickly, so these pod-scoped metrics are FREQUENTLY n/a by the time
          you look — the alert event itself is the eviction evidence; treat the eviction as
          confirmed and lean on the node-level signals in step 2. Interpret:
          evicted_reason>0 OR pod_phase_failed>0 => the evicted pod object still exists in
            Failed/Evicted state — confirmed directly.
          qos_besteffort>0 => the pod had NO resource requests (BestEffort) — it is the FIRST
            target under node pressure; the durable fix is to set requests (step remediation).
          qos_burstable>0 => requests < limits — evicted after BestEffort, before Guaranteed.
          mem_peak_30m_mib high relative to the node => the pod itself may have driven the
            memory pressure that triggered eviction (noisy neighbor), vs being a victim.
          If all n/a => the pod was already removed; do NOT invent values — say the eviction
            is confirmed by the alert and proceed to node pressure.
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "Evicted reason / Failed phase, the pod's QoS class (BestEffort/Burstable/Guaranteed), and its 30m peak memory before eviction — all best-effort (n/a if the pod was already deleted)."
            params:
              queries:
                - name: evicted_reason
                  query: 'max(max_over_time(kube_pod_status_reason{namespace="$namespace",pod="$pod",reason="Evicted"}[6h]))'
                  panel: true
                  panel_title: "Evicted"
                  panel_id: "kube-pod-evicted"
                - name: pod_phase_failed
                  query: 'max(max_over_time(kube_pod_status_phase{namespace="$namespace",pod="$pod",phase="Failed"}[6h]))'
                - name: qos_besteffort
                  query: 'max(kube_pod_status_qos_class{namespace="$namespace",pod="$pod",qos_class="BestEffort"})'
                - name: qos_burstable
                  query: 'max(kube_pod_status_qos_class{namespace="$namespace",pod="$pod",qos_class="Burstable"})'
                - name: qos_guaranteed
                  query: 'max(kube_pod_status_qos_class{namespace="$namespace",pod="$pod",qos_class="Guaranteed"})'
                - name: mem_peak_30m_mib
                  unit: "MiB"
                  query: 'max(max_over_time(container_memory_working_set_bytes{namespace="$namespace",pod="$pod",container!="POD"}[30m]))/1024/1024'
                  panel: true
                  panel_title: "Peak Memory (30m)"
                  panel_id: "kube-mem-peak-30m"
      - step: 2
        title: "Identify the node pressure that caused it (and the blast radius)"
        description: >-
          The root cause of an eviction is node pressure; the evicted pod's node is often
          unknown once it is deleted, so check pressure CLUSTER-WIDE plus how many pods were
          evicted (one node-local victim vs a node-wide reclaim). Interpret:
          nodes_mem_pressure>0 (now or in 6h) => MemoryPressure drove the eviction — a node
            ran low on memory; over-committed memory requests or a memory-hungry neighbor.
          nodes_disk_pressure>0 => DiskPressure — node root/ephemeral disk or image cache
            filled; pods writing to emptyDir/logs/tmp, or low node disk.
          nodes_pid_pressure>0 => PIDPressure — process/thread exhaustion on the node.
          evicted_cluster_6h or evicted_ns_6h >> 1 => a NODE-LEVEL reclaim hit many pods
            (capacity/noisy-neighbor/node-degraded), not a single pod problem — escalate as
            node capacity.
          evicted == ~1 AND no node pressure now => a transient/past pressure spike that has
            cleared, or pod-local ephemeral-storage overrun (the pod exceeded its
            ephemeral-storage limit) — confirm via the pod events in step 3.
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "Cluster node MemoryPressure/DiskPressure/PIDPressure (current and over the lookback) and the count of evicted pods in the namespace and cluster-wide."
            params:
              queries:
                - name: nodes_mem_pressure
                  unit: "nodes"
                  query: 'sum(kube_node_status_condition{condition="MemoryPressure",status="true"})'
                  panel: true
                  panel_title: "Nodes Under Memory Pressure"
                  panel_id: "kube-nodes-mem-pressure"
                - name: nodes_disk_pressure
                  unit: "nodes"
                  query: 'sum(kube_node_status_condition{condition="DiskPressure",status="true"})'
                  panel: true
                  panel_title: "Nodes Under Disk Pressure"
                  panel_id: "kube-nodes-disk-pressure"
                - name: nodes_pid_pressure
                  unit: "nodes"
                  query: 'sum(kube_node_status_condition{condition="PIDPressure",status="true"})'
                - name: nodes_mem_pressure_6h
                  unit: "nodes"
                  query: 'sum(max_over_time(kube_node_status_condition{condition="MemoryPressure",status="true"}[6h]))'
                - name: nodes_disk_pressure_6h
                  unit: "nodes"
                  query: 'sum(max_over_time(kube_node_status_condition{condition="DiskPressure",status="true"}[6h]))'
                - name: evicted_ns_6h
                  unit: "pods"
                  query: 'sum(max_over_time(kube_pod_status_reason{namespace="$namespace",reason="Evicted"}[6h]))'
                - name: evicted_cluster_6h
                  unit: "pods"
                  query: 'sum(max_over_time(kube_pod_status_reason{reason="Evicted"}[6h]))'
                  panel: true
                  panel_title: "Cluster Evictions (6h)"
                  panel_id: "kube-evicted-cluster-6h"
      - step: 3
        title: "Capture node pressure detail and pod eviction events"
        description: "Confirm the metric pack against node conditions and the pod's eviction event — the kubelet message names the exact trigger (e.g. 'The node was low on resource: memory/ephemeral-storage', 'Pod ephemeral local storage usage exceeds the total limit of containers'), the node, and the QoS-based victim selection."
        tool_calls:
          - tool_id: "tool.get_node_pressure"
            description: "Node memory/disk/PID/ephemeral pressure status and conditions for the node(s) hosting this workload."
          - tool_id: "tool.capture_diagnostics"
            description: "Pod eviction event / kubelet message (low-on-resource reason, ephemeral-storage overrun) and node conditions."
      - step: 4
        title: "Read pressure / storage logs"
        description: >-
          Often n/a (the evicted pod is gone), but when logs are retained read for the
          eviction trigger: out-of-memory / node-pressure messages, or disk/ephemeral
          signatures (no space left, filesystem full, large tmp/cache/log writes) that point
          to the pod overrunning its ephemeral storage. State the concrete trigger (which
          pressure, which resource), not "pod evicted".
        tool_calls:
          - tool_id: "tool.read_logs"
            description: "Logs filtered for eviction/memorypressure/diskpressure/ephemeral and disk-full (no space/filesystem/tmp/cache) signatures."
            params:
              tail_lines: 200
    remediation:   # only for suggestion — never auto-executed (forge.* are approval-gated)
      - action: "patch_resources"
        description: "Primary durable fix when step 1 showed the pod was BestEffort or under-requested: set memory (and ephemeral-storage) requests — and for memory keep request==limit — so the pod becomes Guaranteed/Burstable and is no longer the first eviction target. For a disk-pressure eviction, set an ephemeral-storage request/limit to bound the pod's local storage."
        tool_id: "forge.patch_resources"
        requires_approval: true
      - action: "restart_deployment"
        description: "Only to reschedule the workload if its replacement pod did not come back after the eviction. NOT a fix for the underlying node pressure — if the node is still under pressure the new pod can be evicted again."
        tool_id: "forge.restart_deployment"
        requires_approval: true
    escalation: >-
      Route by pressure type — MemoryPressure / many pods evicted on a node: SRE +
      infrastructure (node capacity, over-commit, node autoscaling); DiskPressure: platform
      (node disk / image-cache / ephemeral-storage limits); PIDPressure: platform (pid limits /
      runaway process). Page if evictions are recurring or mass (node degraded). Single
      BestEffort pod evicted with no node pressure now => owning team to set resource requests.
    follow_up:
      - "Name the concrete trigger (which node pressure, or the pod's ephemeral-storage overrun) and the victim-selection reason (QoS), not a generic 'node pressure'."
      - "If the pod was BestEffort/under-requested, set requests so it gets a higher QoS; if a node repeatedly evicts pods, treat it as a capacity/node-health problem (cordon/drain/replace)."

  - name: "KubePodPendingTooLong"
    patterns: ["KubePodPendingTooLong", "pod pending too long", "pod pending", "FailedScheduling", "Unschedulable"]
    priority: P2
    diagnostic_steps:
      - step: 1
        title: "Confirm Pending and split scheduled vs unscheduled"
        description: >-
          The pod has been Pending too long. The decisive fork is whether the scheduler has
          PLACED it yet — this routes the entire investigation. Interpret:
          phase_pending==1 with high age_min => PendingTooLong confirmed (a large age means
            genuinely stuck, not just slow startup).
          scheduled_false==1 (or unschedulable==1) => the SCHEDULER cannot place the pod —
            no node satisfies its requirements. Go to step 2 (PVC/capacity) and step 3 (the
            FailedScheduling event names the exact reason: insufficient cpu/memory, taint,
            affinity, nodeSelector, quota). Container/image have NOT started — they are
            irrelevant until placement succeeds.
          scheduled_true==1 but still Pending => the pod IS placed; the delay is STARTUP, not
            scheduling. Branch on the waiting reason:
            waiting_creating (ContainerCreating) => volume attach / CSI / CNI / sandbox is
              slow or stuck (step 2 PVC + step 3 events).
            waiting_init (PodInitializing) => an INIT container is blocking — follow
              KubeContainerWaiting / read the init logs; NOT a scheduling problem.
            waiting_image (ImagePullBackOff/ErrImagePull) => image pull, not scheduling.
          Do NOT recommend a fix from this step — it only routes.
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "Pod phase, age, scheduled/unschedulable status, and container waiting reason — to split scheduler-placement from startup delay."
            params:
              queries:
                - name: phase_pending
                  query: 'max(kube_pod_status_phase{namespace="$namespace",pod="$pod",phase="Pending"})'
                  panel: true
                  panel_title: "Pod Pending"
                  panel_id: "kube-pod-pending"
                - name: age_min
                  unit: "min"
                  query: '(time()-max(kube_pod_created{namespace="$namespace",pod="$pod"}))/60'
                  panel: true
                  panel_title: "Pod Age"
                  panel_id: "kube-pod-age"
                - name: scheduled_false
                  query: 'max(kube_pod_status_scheduled{namespace="$namespace",pod="$pod",condition="false"})'
                - name: scheduled_true
                  query: 'max(kube_pod_status_scheduled{namespace="$namespace",pod="$pod",condition="true"})'
                  panel: true
                  panel_title: "Pod Scheduled"
                  panel_id: "kube-pod-scheduled"
                - name: unschedulable
                  query: 'max(kube_pod_status_unschedulable{namespace="$namespace",pod="$pod"})'
                - name: waiting_creating
                  query: 'max(max_over_time(kube_pod_container_status_waiting_reason{namespace="$namespace",pod="$pod",reason="ContainerCreating"}[15m]))'
                - name: waiting_init
                  query: 'max(max_over_time(kube_pod_container_status_waiting_reason{namespace="$namespace",pod="$pod",reason="PodInitializing"}[15m]))'
                - name: waiting_image
                  query: 'max(max_over_time(kube_pod_container_status_waiting_reason{namespace="$namespace",pod="$pod",reason=~"ImagePullBackOff|ErrImagePull|InvalidImageName"}[15m]))'
      - step: 2
        title: "Rule out PVC binding and node capacity"
        description: >-
          The two metric-visible placement blockers are an unbound volume and no eligible
          node. Interpret:
          pvc_pending>0 => a PersistentVolumeClaim is not Bound — the scheduler will not place
            a pod whose volume can't be provisioned/bound (wrong StorageClass, provisioner
            failing, quota); this is a storage RCA, fix the PVC first.
          nodes_ready small / nodes_notready>0 / nodes_unschedulable(cordoned)>0 => fewer
            schedulable nodes than usual — capacity/health reduced the placement options.
          nodes_pressure>0 => nodes under Memory/Disk/PID pressure are not accepting new pods.
          If PVC is bound and nodes are healthy, the blocker is NOT raw capacity — it is a soft
            constraint (taint/toleration, nodeSelector/affinity, or a resource REQUEST larger
            than any node's allocatable), which only the FailedScheduling event (step 3) spells out.
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "PVC pending count (namespace + this pod's claims) and cluster node readiness / schedulability / pressure."
            params:
              queries:
                - name: pvc_pending_pod
                  unit: "pvc"
                  query: 'sum(kube_persistentvolumeclaim_status_phase{namespace="$namespace",persistentvolumeclaim=~".*$workload.*",phase="Pending"})'
                - name: pvc_pending_ns
                  unit: "pvc"
                  query: 'sum(kube_persistentvolumeclaim_status_phase{namespace="$namespace",phase="Pending"})'
                - name: nodes_ready
                  unit: "nodes"
                  query: 'sum(kube_node_status_condition{condition="Ready",status="true"})'
                  panel: true
                  panel_title: "Nodes Ready"
                  panel_id: "kube-nodes-ready"
                - name: nodes_notready
                  unit: "nodes"
                  query: 'sum(kube_node_status_condition{condition="Ready",status!="true"})'
                - name: nodes_unschedulable
                  unit: "nodes"
                  query: 'sum(kube_node_spec_unschedulable)'
                  panel: true
                  panel_title: "Nodes Unschedulable"
                  panel_id: "kube-nodes-unschedulable"
                - name: nodes_pressure
                  unit: "nodes"
                  query: 'sum(kube_node_status_condition{condition=~"MemoryPressure|DiskPressure|PIDPressure",status="true"})'
      - step: 3
        title: "Read the scheduling reason from events"
        description: "Metrics show capacity but not WHY the scheduler rejected each node — the FailedScheduling event does ('0/N nodes are available: M Insufficient cpu, K node(s) had untolerated taint, J node(s) didn't match node selector/affinity, pod has unbound immediate PersistentVolumeClaims'). For a scheduled-but-creating pod, the events instead show FailedMount / FailedCreatePodSandBox (CSI/CNI). This is the decisive artifact for the unscheduled case."
        tool_calls:
          - tool_id: "tool.get_pending_pods"
            description: "Pending pods with their FailedScheduling reasons (insufficient resources, taints, affinity, nodeSelector, unbound PVC)."
          - tool_id: "tool.capture_diagnostics"
            description: "Pod scheduling events and placement constraints; mount/sandbox events for a scheduled-but-creating pod."
          - tool_id: "tool.get_node_pressure"
            description: "Node memory/disk/PID pressure and allocatable headroom across the cluster."
      - step: 4
        title: "Read scheduling / volume logs"
        description: >-
          Usually sparse — an unscheduled pod has no running container, so rely on step 3
          events. When logs exist (scheduled-but-creating), read for volume/binding/
          provisioning/StorageClass and CNI/sandbox signatures. Name the concrete blocker
          (insufficient cpu on all nodes, untolerated taint, unbound PVC + StorageClass,
          failed mount), not "pod pending".
        tool_calls:
          - tool_id: "tool.read_logs"
            description: "Logs filtered for scheduling (unschedulable/insufficient/taint/affinity/quota) and PVC/volume/provisioning signatures."
            params:
              tail_lines: 150
    remediation:   # only for suggestion — never auto-executed (forge.* are approval-gated)
      - action: "patch_resources"
        description: "ONLY when step 3 shows the pod is unschedulable because its resource REQUEST exceeds any node's allocatable (Insufficient cpu/memory): lower the request to fit a real node. Do NOT apply for taint/affinity/nodeSelector/PVC causes — those are not resource problems."
        tool_id: "forge.patch_resources"
        requires_approval: true
      - action: "restart_deployment"
        description: "Only to force re-creation/re-scheduling after the underlying blocker is fixed (e.g. capacity added, taint removed, PVC bound). NOT a fix on its own — a pod that can't be placed will just go Pending again."
        tool_id: "forge.restart_deployment"
        requires_approval: true
    escalation: >-
      Route by classified blocker — insufficient cpu/memory / no eligible nodes: SRE +
      infrastructure (capacity / node autoscaling); taint/affinity/nodeSelector: the owning
      team (pod placement spec) + platform (node labels/taints); unbound PVC: storage/platform
      (StorageClass / provisioner / quota); ContainerCreating stuck on mount/CNI: platform
      (CSI/CNI). Page if a production workload cannot schedule any replica.
    follow_up:
      - "Name the exact scheduling rejection from the FailedScheduling event (which resource, taint, affinity, or unbound PVC) — not a generic 'pending'."
      - "If unschedulable due to resource requests, reconcile the request against real node allocatable; if due to taints/affinity, confirm whether the constraint or the node pool is wrong."

  - name: "KubePersistentVolumeError"
    patterns:
      [
        "KubePersistentVolumeError",
        "KubePersistentVolumeFailed",
        "persistent volume failed",
        "volume lost",
        "pvc pending",
      ]
    priority: P1
    diagnostic_steps:
      - step: 1
        title: "Establish which lifecycle state the volume is actually in"
        description: >-
          The phase decides everything downstream — each one has a different cause and a
          different fix, so name the phase before proposing anything. pv_phase lifts the phase
          into the result labels, so report the phase by NAME for the PV in the alert
          ($persistentvolume). Interpret:
          phase Failed => the volume's automatic reclaim (delete/recycle) FAILED; the backing
            disk may still exist and still cost money. Data is usually intact — do NOT delete
            the PV before the storage team confirms the backend state.
          phase Lost => the PV's backing storage is GONE (deleted out-of-band, subscription /
            resource-group / disk removed). Any bound PVC is unusable and its data is
            unrecoverable from k8s — this is a data-loss event, escalate immediately.
          phase Pending => the volume never finished provisioning (CSI driver error, quota,
            zone/topology mismatch, bad StorageClass) — no data at risk yet, but nothing can
            mount it.
          phase Released => the PVC was deleted and the reclaim policy is Retain; the volume is
            holding data intentionally and is NOT an error. If Released is the only phase set,
            say the alert reflects normal Retain behaviour rather than a fault.
          phase Available/Bound => the PV is healthy NOW; the alert has cleared. Say so instead
            of manufacturing a fault.
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "The PV's current phase (name lifted into labels), its capacity, storage class and bound claim; plus whether the paired PVC is itself Pending or Lost."
            params:
              queries:
                # `== 1` keeps only the ACTIVE phase and `by (phase)` lifts its name, so the RCA
                # can state the phase instead of reading a bare 0/1.
                - name: pv_phase
                  query: 'max by (phase) (kube_persistentvolume_status_phase{persistentvolume="$persistentvolume"} == 1)'
                  panel: true
                  panel_title: "PV Phase"
                  panel_id: "kube-pv-phase"
                - name: pv_capacity_gib
                  unit: "GiB"
                  query: 'max(kube_persistentvolume_capacity_bytes{persistentvolume="$persistentvolume"}) / 1024 / 1024 / 1024'
                  panel: true
                  panel_title: "PV Capacity"
                  panel_id: "kube-pv-capacity"
                # claim_ref names the PVC (and its namespace) this PV belongs to — that is how
                # the RCA can say WHICH workload's storage is affected.
                - name: pv_claim_ref
                  query: 'max by (name, claim_namespace) (kube_persistentvolume_claim_ref{persistentvolume="$persistentvolume"})'
                - name: pv_storageclass
                  query: 'max by (storageclass) (kube_persistentvolume_info{persistentvolume="$persistentvolume"})'
                - name: pvc_phase
                  query: 'max by (phase, persistentvolumeclaim) (kube_persistentvolumeclaim_status_phase{namespace="$namespace",persistentvolumeclaim="$persistentvolumeclaim"} == 1)'
                  panel: true
                  panel_title: "PVC Phase"
                  panel_id: "kube-pvc-phase"
      - step: 2
        title: "Find the impact — is a workload blocked on this volume right now"
        description: >-
          A broken PV only matters through the pods that need it. Interpret:
          pods_pending > 0 in the claim's namespace => pods cannot start because the volume will
            not bind/mount; this is live impact — name the pending workload.
          pods_pending == 0 AND phase is Failed/Released => nothing is waiting; the problem is
            orphaned capacity and cost, not availability. Lower the urgency accordingly and say
            so rather than implying an outage.
          container_ready == 0 for the mounting workload => the pod exists but cannot become
            ready — typically a mount/attach failure rather than a scheduling failure.
          cluster_pv_failed / cluster_pv_pending >> 1 => a STORAGE-BACKEND or CSI-driver level
            problem, not one bad volume (driver crashloop, quota exhausted, zone outage) —
            escalate as a platform incident. Label-free blast-radius counts ONLY; keep naming
            the alert's own PV.
          cluster_pvc_lost > 0 => other claims have lost their storage too; treat as a
            data-loss incident with a wider scope.
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "Pods stuck Pending in the claim's namespace, readiness of the mounting workload, and cluster-wide counts of Failed/Pending PVs and Lost PVCs."
            params:
              queries:
                - name: pods_pending
                  unit: "pods"
                  query: 'sum(kube_pod_status_phase{namespace="$namespace",phase="Pending"}) or vector(0)'
                  panel: true
                  panel_title: "Pods Pending in Namespace"
                  panel_id: "kube-pv-pods-pending"
                - name: container_ready
                  query: 'min(kube_pod_container_status_ready{namespace="$namespace",pod=~"$workload-.*"})'
                - name: cluster_pv_failed
                  unit: "volumes"
                  query: 'count(kube_persistentvolume_status_phase{phase="Failed"} == 1) or vector(0)'
                  panel: true
                  panel_title: "Failed PVs (cluster)"
                  panel_id: "kube-pv-failed-cluster"
                - name: cluster_pv_pending
                  unit: "volumes"
                  query: 'count(kube_persistentvolume_status_phase{phase="Pending"} == 1) or vector(0)'
                  panel: true
                  panel_title: "Pending PVs (cluster)"
                  panel_id: "kube-pv-pending-cluster"
                - name: cluster_pvc_lost
                  unit: "claims"
                  query: 'count(kube_persistentvolumeclaim_status_phase{phase="Lost"} == 1) or vector(0)'
                  panel: true
                  panel_title: "Lost PVCs (cluster)"
                  panel_id: "kube-pvc-lost-cluster"
                - name: cluster_pvc_pending
                  unit: "claims"
                  query: 'count(kube_persistentvolumeclaim_status_phase{phase="Pending"} == 1) or vector(0)'
          - tool_id: "tool.capture_diagnostics"
            description: "Collect the PV and its PVC, the StorageClass/CSI driver, and the volume attach/mount events that explain the phase."
      - step: 3
        title: "Read the blocked workload's logs and mount errors"
        description: >-
          For Pending/mount failures the real cause is in the events and the kubelet's mount
          error — quota exceeded, topology/zone mismatch, driver not found, attach timeout,
          multi-attach on a ReadWriteOnce volume. Quote the actual error. If the logs and events
          are clean, say the failure is on the storage-backend side and not visible from the
          cluster, rather than guessing a cause.
        tool_calls:
          - tool_id: "tool.read_logs"
            description: "Recent errors from the workload waiting on this volume (mount/attach failures, permission denied, multi-attach)."
    remediation:
      - action: "Re-provision or re-bind the volume"
        description: >-
          ONLY for phase Pending where step 3 identified a fixable provisioning cause (wrong
          StorageClass, zone/topology mismatch, exhausted quota): correct the PVC's storageClass
          / size / topology so a new volume can be provisioned. Never apply this to a Failed or
          Lost volume — that risks destroying recoverable data.
        tool_id: "forge.patch_resources"
        requires_approval: true
      - action: "Restart the workload blocked on the mount"
        description: >-
          ONLY when the volume itself is healthy (phase Bound/Available) and step 3 showed a
          stale attach or multi-attach that a fresh pod would clear. Pointless while the PV is
          Failed/Lost/Pending — the new pod will block on the same volume.
        tool_id: "forge.restart_deployment"
        requires_approval: true
    escalation: >-
      Page storage/platform immediately for phase Lost (data loss) or when
      cluster_pv_failed/cluster_pv_pending indicate a CSI-driver or backend-wide failure. PV
      deletion and backend disk recovery must be done by the storage owner, never automatically.
    follow_up: >-
      KSM exposes the PV's PHASE but not the underlying CSI/cloud error string — the reason a
      reclaim failed or a provision was rejected lives in the CSI controller logs and the cloud
      provider's API, which forge does not read today. The runbook narrows to the phase, the
      affected claim/workload and the blast radius, and says the backend reason is unavailable
      instead of inventing one.

  - name: "KubePVCFillingUp"
    patterns:
      [
        "KubePVCFillingUp",
        "KubePersistentVolumeFillingUp",
        "pvc filling up",
        "volume low free space",
      ]
    priority: P2
    diagnostic_steps:
      - step: 1
        title: "Confirm the fill level on THIS claim and measure the trend"
        description: >-
          A PVC alert is about ONE volume — report against the claim named in the alert
          ($persistentvolumeclaim), never the cluster's worst volume. used_pct is the current
          fill; the trend decides whether this is an emergency or a capacity plan.
          NOTE: fill level comes from kubelet_volume_stats_* (scraped from the node that mounts
          the volume), so a volume whose pod is NOT running has NO samples — if every value is
          n/a, say the volume is currently unmounted rather than reporting 0%. Interpret:
          used_pct >= 97 AND hours_to_full < 6 => imminent exhaustion; writes will start failing
            (read-only remount / app write errors) — expand now, do not wait for cleanup.
          used_pct 85-97 AND fill_rate_mib_per_hour > 0 => steady growth; use hours_to_full to
            decide expand-now vs schedule. Report the projected exhaustion time explicitly.
          fill_rate_mib_per_hour <= 0 => NOT filling; the volume is simply sized close to its
            working set. A one-off cleanup will not help — right-size the request instead.
          growth_6h_gib large AND fill_rate high => a recent step change (log burst, retention
            change, backup/dump left behind, WAL/segment accumulation), not organic growth —
            look for what started writing; cleanup is likely to reclaim real space.
          inodes_used_pct > 85 while used_pct is low => INODE exhaustion, not byte exhaustion —
            millions of small files; expanding bytes will NOT fix it, the fix is deleting files
            (or a filesystem with more inodes).
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "Current fill level, free/used/total bytes, the 6h fill rate, projected hours-to-full, and inode usage for the alerting PVC."
            params:
              queries:
                - name: used_pct
                  unit: "%"
                  query: '100 * max(kubelet_volume_stats_used_bytes{namespace="$namespace",persistentvolumeclaim="$persistentvolumeclaim"}) / max(kubelet_volume_stats_capacity_bytes{namespace="$namespace",persistentvolumeclaim="$persistentvolumeclaim"})'
                  panel: true
                  panel_title: "Volume Used %"
                  panel_id: "kube-pvc-used-pct"
                - name: available_gib
                  unit: "GiB"
                  query: 'max(kubelet_volume_stats_available_bytes{namespace="$namespace",persistentvolumeclaim="$persistentvolumeclaim"}) / 1024 / 1024 / 1024'
                  panel: true
                  panel_title: "Free Space"
                  panel_id: "kube-pvc-available"
                - name: used_gib
                  unit: "GiB"
                  query: 'max(kubelet_volume_stats_used_bytes{namespace="$namespace",persistentvolumeclaim="$persistentvolumeclaim"}) / 1024 / 1024 / 1024'
                - name: capacity_gib
                  unit: "GiB"
                  query: 'max(kubelet_volume_stats_capacity_bytes{namespace="$namespace",persistentvolumeclaim="$persistentvolumeclaim"}) / 1024 / 1024 / 1024'
                # deriv() over 6h is the fill SLOPE; `max by (persistentvolumeclaim)` keeps the
                # claim name in the result labels so the RCA can echo WHICH volume is filling.
                - name: fill_rate_mib_per_hour
                  unit: "MiB/h"
                  query: 'max by (persistentvolumeclaim) (deriv(kubelet_volume_stats_used_bytes{namespace="$namespace",persistentvolumeclaim="$persistentvolumeclaim"}[6h])) * 3600 / 1024 / 1024'
                  panel: true
                  panel_title: "Fill Rate"
                  panel_id: "kube-pvc-fill-rate"
                # clamp_min(...,1) keeps the projection finite when the slope is flat/negative;
                # a huge value therefore means "not filling", not "about to fill".
                - name: hours_to_full
                  unit: "h"
                  query: '(max(kubelet_volume_stats_available_bytes{namespace="$namespace",persistentvolumeclaim="$persistentvolumeclaim"}) / clamp_min(max(deriv(kubelet_volume_stats_used_bytes{namespace="$namespace",persistentvolumeclaim="$persistentvolumeclaim"}[6h])), 1)) / 3600'
                  panel: true
                  panel_title: "Projected Hours to Full"
                  panel_id: "kube-pvc-hours-to-full"
                - name: growth_6h_gib
                  unit: "GiB"
                  query: '(max(kubelet_volume_stats_used_bytes{namespace="$namespace",persistentvolumeclaim="$persistentvolumeclaim"}) - max(min_over_time(kubelet_volume_stats_used_bytes{namespace="$namespace",persistentvolumeclaim="$persistentvolumeclaim"}[6h]))) / 1024 / 1024 / 1024'
                - name: inodes_used_pct
                  unit: "%"
                  query: '100 * max(kubelet_volume_stats_inodes_used{namespace="$namespace",persistentvolumeclaim="$persistentvolumeclaim"}) / max(kubelet_volume_stats_inodes{namespace="$namespace",persistentvolumeclaim="$persistentvolumeclaim"})'
                  panel: true
                  panel_title: "Inodes Used %"
                  panel_id: "kube-pvc-inodes-used-pct"
      - step: 2
        title: "Identify what the volume is attached to, and whether expansion is possible"
        description: >-
          Name the workload that owns the claim — the fix (clean up vs expand vs rotate logs)
          depends on what writes to it. Interpret:
          mounting_pods == 0 => nothing currently mounts the claim; the data is stale/orphaned
            and reclaiming it may be safe — verify with the owner before deleting anything.
          mounting_pods >= 1 => report the owning workload by name; a StatefulSet volume
            (claim name ends in -<ordinal>) must be expanded per-replica.
          requested_gib > capacity_gib => an expansion is already in flight (the PVC request was
            raised, the filesystem has not grown yet) — the volume may resize on its own; check
            before requesting another expansion.
          pvc_phase_bound == 0 => the claim is NOT Bound; this is a claim/PV problem rather than
            a fill problem — follow KubePersistentVolumeError instead.
          ns_pvcs_over_85 / cluster_pvcs_over_85 >> 1 => many volumes are filling together;
            suspect a shared cause (retention/backup policy, log-level change) rather than one
            runaway workload. These counts are label-free blast-radius scalars ONLY — never
            rename the alert's object to whatever the cluster's worst volume is.
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "Requested size vs actual capacity (in-flight expansion), claim bind state, how many pods mount the claim, and how many other volumes are also above 85%."
            params:
              queries:
                - name: requested_gib
                  unit: "GiB"
                  query: 'max(kube_persistentvolumeclaim_resource_requests_storage_bytes{namespace="$namespace",persistentvolumeclaim="$persistentvolumeclaim"}) / 1024 / 1024 / 1024'
                  panel: true
                  panel_title: "Requested Size"
                  panel_id: "kube-pvc-requested"
                - name: pvc_phase_bound
                  query: 'max(kube_persistentvolumeclaim_status_phase{namespace="$namespace",persistentvolumeclaim="$persistentvolumeclaim",phase="Bound"})'
                - name: mounting_pods
                  unit: "pods"
                  query: 'count(kube_pod_spec_volumes_persistentvolumeclaims_info{namespace="$namespace",persistentvolumeclaim="$persistentvolumeclaim"}) or vector(0)'
                - name: ns_pvcs_over_85
                  unit: "volumes"
                  query: 'count(100 * kubelet_volume_stats_used_bytes{namespace="$namespace"} / kubelet_volume_stats_capacity_bytes{namespace="$namespace"} > 85) or vector(0)'
                - name: cluster_pvcs_over_85
                  unit: "volumes"
                  query: 'count(100 * kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes > 85) or vector(0)'
          - tool_id: "tool.capture_diagnostics"
            description: "Collect the PVC object, its StorageClass (allowVolumeExpansion) and the owning workload spec."
      - step: 3
        title: "Read the owning workload's logs for write-amplifying behaviour"
        description: >-
          Only useful when step 1 showed a recent step change in growth. Look for retention or
          rotation failures, repeated large writes, backup/dump jobs, or "no space left on
          device" errors already appearing. If the logs are clean, say so — do not speculate.
        tool_calls:
          - tool_id: "tool.read_logs"
            description: "Recent errors from the workload mounting this claim (disk-full errors, rotation/retention failures)."
    remediation:
      - action: "Expand the PersistentVolumeClaim"
        description: >-
          ONLY if step 1 showed sustained growth (fill_rate > 0) and step 2 confirmed the
          StorageClass has allowVolumeExpansion=true and no expansion is already in flight
          (requested_gib == capacity_gib). Raise spec.resources.requests.storage; expansion is
          ONE-WAY (a PVC cannot be shrunk). For a StatefulSet, every replica's claim must be
          expanded. Does NOT apply when inodes_used_pct is the constraint.
        tool_id: "forge.patch_resources"
        requires_approval: true
      - action: "Reclaim space on the volume"
        description: >-
          ONLY if step 1/3 identified reclaimable data (a step change in growth, rotation
          failure, or inode exhaustion where expansion cannot help). Delete/rotate the
          identified files or lower the application's retention — not a k8s operation, so it is
          suggestion-only: hand the owning team the file/directory evidence from step 3.
        tool_id: ""
        requires_approval: false
    escalation: "Storage/platform team when the StorageClass does not allow expansion, or when hours_to_full < 6."
    follow_up: >-
      Fill level is available only while the volume is MOUNTED (kubelet_volume_stats_*), so an
      unmounted claim reports n/a rather than its real usage. Per-directory attribution (WHICH
      path grew) needs an in-pod `du`, which forge cannot run today — the runbook narrows to the
      owning workload and the growth rate, and says so instead of guessing the directory.

  - name: "KubePVCCriticalFull"
    patterns:
      [
        "KubePVCCriticalFull",
        "pvc critical full",
        "volume critically full",
        "disk nearly full",
      ]
    priority: P1
    diagnostic_steps:
      - step: 1
        title: "Confirm how little headroom is left and how fast it is going"
        description: >-
          This is the CRITICAL tier of KubePVCFillingUp — treat it as imminent write failure on
          the claim named in the alert. Interpret:
          available_gib near 0 OR used_pct >= 99 => writes are failing or about to; many
            filesystems also reserve blocks, so an app can fail before 100%. Expand immediately;
            cleanup is usually too slow at this point.
          hours_to_full < 2 => no time for a cleanup cycle — expand.
          fill_rate_mib_per_hour <= 0 AND used_pct >= 95 => not growing, but with no headroom;
            the volume is under-sized for its working set — right-size it rather than chase files.
          inodes_used_pct > 95 => inode exhaustion: "no space left on device" with bytes free.
            Expanding capacity will NOT fix it — files must be deleted.
          All values n/a => the volume is not currently mounted (no kubelet samples); say so
            rather than reporting 0%.
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "Free space, fill percentage, fill rate, projected hours-to-full and inode usage for the alerting PVC."
            params:
              queries:
                - name: available_gib
                  unit: "GiB"
                  query: 'max(kubelet_volume_stats_available_bytes{namespace="$namespace",persistentvolumeclaim="$persistentvolumeclaim"}) / 1024 / 1024 / 1024'
                  panel: true
                  panel_title: "Free Space"
                  panel_id: "kube-pvc-available"
                - name: used_pct
                  unit: "%"
                  query: '100 * max(kubelet_volume_stats_used_bytes{namespace="$namespace",persistentvolumeclaim="$persistentvolumeclaim"}) / max(kubelet_volume_stats_capacity_bytes{namespace="$namespace",persistentvolumeclaim="$persistentvolumeclaim"})'
                  panel: true
                  panel_title: "Volume Used %"
                  panel_id: "kube-pvc-used-pct"
                - name: capacity_gib
                  unit: "GiB"
                  query: 'max(kubelet_volume_stats_capacity_bytes{namespace="$namespace",persistentvolumeclaim="$persistentvolumeclaim"}) / 1024 / 1024 / 1024'
                - name: fill_rate_mib_per_hour
                  unit: "MiB/h"
                  query: 'max by (persistentvolumeclaim) (deriv(kubelet_volume_stats_used_bytes{namespace="$namespace",persistentvolumeclaim="$persistentvolumeclaim"}[6h])) * 3600 / 1024 / 1024'
                  panel: true
                  panel_title: "Fill Rate"
                  panel_id: "kube-pvc-fill-rate"
                - name: hours_to_full
                  unit: "h"
                  query: '(max(kubelet_volume_stats_available_bytes{namespace="$namespace",persistentvolumeclaim="$persistentvolumeclaim"}) / clamp_min(max(deriv(kubelet_volume_stats_used_bytes{namespace="$namespace",persistentvolumeclaim="$persistentvolumeclaim"}[6h])), 1)) / 3600'
                  panel: true
                  panel_title: "Projected Hours to Full"
                  panel_id: "kube-pvc-hours-to-full"
                - name: inodes_used_pct
                  unit: "%"
                  query: '100 * max(kubelet_volume_stats_inodes_used{namespace="$namespace",persistentvolumeclaim="$persistentvolumeclaim"}) / max(kubelet_volume_stats_inodes{namespace="$namespace",persistentvolumeclaim="$persistentvolumeclaim"})'
                  panel: true
                  panel_title: "Inodes Used %"
                  panel_id: "kube-pvc-inodes-used-pct"
      - step: 2
        title: "Check whether the workload is already failing, and whether expansion is possible"
        description: >-
          A full volume shows up as application errors and restarts, not just a metric.
          Interpret:
          restarts_15m > 0 OR container_ready == 0 => the workload is already breaking on the
            full volume — this is customer-impacting now.
          requested_gib > capacity_gib => an expansion is already in flight; wait for the
            filesystem resize rather than issuing another.
          mounting_pods == 0 => nothing mounts the claim; the alert is about stale data, so the
            urgency drops — confirm with the owner before reclaiming.
          ns_pvcs_over_95 / cluster_pvcs_over_95 >> 1 => a shared cause across volumes
            (retention/backup policy) — label-free blast-radius counts ONLY; keep reporting the
            alert's own claim by name.
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "Whether the owning workload is already restarting/unready, in-flight expansion, mount count, and how many other volumes are also above 95%."
            params:
              queries:
                - name: restarts_15m
                  unit: "restarts"
                  query: 'sum(increase(kube_pod_container_status_restarts_total{namespace="$namespace",pod=~"$workload-.*"}[15m])) or vector(0)'
                  panel: true
                  panel_title: "Restarts (15m)"
                  panel_id: "kube-restarts-15m"
                - name: container_ready
                  query: 'min(kube_pod_container_status_ready{namespace="$namespace",pod=~"$workload-.*"})'
                - name: requested_gib
                  unit: "GiB"
                  query: 'max(kube_persistentvolumeclaim_resource_requests_storage_bytes{namespace="$namespace",persistentvolumeclaim="$persistentvolumeclaim"}) / 1024 / 1024 / 1024'
                  panel: true
                  panel_title: "Requested Size"
                  panel_id: "kube-pvc-requested"
                - name: mounting_pods
                  unit: "pods"
                  query: 'count(kube_pod_spec_volumes_persistentvolumeclaims_info{namespace="$namespace",persistentvolumeclaim="$persistentvolumeclaim"}) or vector(0)'
                - name: ns_pvcs_over_95
                  unit: "volumes"
                  query: 'count(100 * kubelet_volume_stats_used_bytes{namespace="$namespace"} / kubelet_volume_stats_capacity_bytes{namespace="$namespace"} > 95) or vector(0)'
                - name: cluster_pvcs_over_95
                  unit: "volumes"
                  query: 'count(100 * kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes > 95) or vector(0)'
          - tool_id: "tool.capture_diagnostics"
            description: "Collect the PVC, its StorageClass (allowVolumeExpansion) and the owning workload spec."
      - step: 3
        title: "Read the workload's logs for disk-full errors"
        description: >-
          Confirm real impact with real lines — "no space left on device", read-only filesystem,
          WAL/segment write failures, checkpoint or flush errors. If the logs are clean the app
          may not have written yet; say that instead of assuming failure.
        tool_calls:
          - tool_id: "tool.read_logs"
            description: "Recent errors from the workload mounting this claim (ENOSPC, read-only filesystem, write/flush failures)."
    remediation:
      - action: "Expand the PersistentVolumeClaim immediately"
        description: >-
          Primary fix when step 2 confirmed the StorageClass allows expansion and none is in
          flight. Raise spec.resources.requests.storage; expansion is ONE-WAY. Expand every
          replica's claim for a StatefulSet. Not applicable when inodes_used_pct is the
          constraint — expanding bytes does not add inodes.
        tool_id: "forge.patch_resources"
        requires_approval: true
      - action: "Emergency space reclaim on the volume"
        description: >-
          ONLY if expansion is unavailable (StorageClass forbids it) or inode-bound. Delete the
          reclaimable files identified in step 3 / lower retention. Not a k8s operation —
          suggestion-only; hand the owning team the evidence.
        tool_id: ""
        requires_approval: false
    escalation: "Page storage/platform immediately — a full volume usually means active data loss or write failure for the owning service."
    follow_up: >-
      Same limits as KubePVCFillingUp: no samples while the volume is unmounted, and no
      per-directory attribution without an in-pod `du`. State those gaps rather than guessing
      which path filled the disk.

  - name: "KubeHpaMaxedOut"
    patterns: ["KubeHpaMaxedOut", "HPA maxed out", "hpa max replicas", "ScalingLimited"]
    priority: P2
    diagnostic_steps:
      - step: 1
        title: "Confirm the HPA is maxed and classify the scaling state"
        description: >-
          KubeHpaMaxedOut means desired replicas reached maxReplicas — capacity PRESSURE,
          not necessarily app failure. Split the state so the rest of the tree routes
          correctly (queries are HPA-scoped via $hpa; the target deployment is resolved
          automatically for the resource/health steps). Interpret:
          maxed_flag==1 (desired_replicas >= max_replicas) => maxed confirmed.
          current_replicas == max_replicas (replica_gap==0) => HPA is fully EXHAUSTED — all
            allowed replicas exist and are counted. The driver is real load/resource demand
            (step 2) or unhealthy replicas faking demand (step 3). The fix is more capacity
            (raise maxReplicas / add nodes) or less load — NOT "scaling is stuck".
          current_replicas < desired_replicas (replica_gap>0) => the HPA WANTS more but new
            replicas are not coming up — scaling is BLOCKED. Jump to step 3 (pods not ready/
            crashlooping/image pull) and step 4 (cluster has no room). This is the more
            urgent path: capacity is not actually being added.
          scaling_limited==1 => KSM confirms the autoscaler hit its ceiling.
          Do NOT recommend a fix from this step alone — it only classifies.
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "HPA desired/current/max, maxed flag, ScalingLimited condition, and the desired-vs-current replica gap."
            params:
              queries:
                - name: desired_replicas
                  unit: "pods"
                  query: 'max(kube_horizontalpodautoscaler_status_desired_replicas{namespace="$namespace",horizontalpodautoscaler="$hpa"})'
                  panel: true
                  panel_title: "Desired Replicas"
                  panel_id: "kube-hpa-desired-replicas"
                - name: current_replicas
                  unit: "pods"
                  query: 'max(kube_horizontalpodautoscaler_status_current_replicas{namespace="$namespace",horizontalpodautoscaler="$hpa"})'
                  panel: true
                  panel_title: "Current Replicas"
                  panel_id: "kube-hpa-current-replicas"
                - name: max_replicas
                  unit: "pods"
                  query: 'max(kube_horizontalpodautoscaler_spec_max_replicas{namespace="$namespace",horizontalpodautoscaler="$hpa"})'
                  panel: true
                  panel_title: "Max Replicas"
                  panel_id: "kube-hpa-max-replicas"
                - name: min_replicas
                  unit: "pods"
                  query: 'max(kube_horizontalpodautoscaler_spec_min_replicas{namespace="$namespace",horizontalpodautoscaler="$hpa"})'
                - name: maxed_flag
                  query: '(max(kube_horizontalpodautoscaler_status_desired_replicas{namespace="$namespace",horizontalpodautoscaler="$hpa"}) >= bool max(kube_horizontalpodautoscaler_spec_max_replicas{namespace="$namespace",horizontalpodautoscaler="$hpa"}))'
                - name: scaling_limited
                  query: 'max(kube_horizontalpodautoscaler_status_condition{namespace="$namespace",horizontalpodautoscaler="$hpa",condition="ScalingLimited",status="true"})'
                - name: replica_gap
                  unit: "pods"
                  query: 'max(kube_horizontalpodautoscaler_status_desired_replicas{namespace="$namespace",horizontalpodautoscaler="$hpa"})-max(kube_horizontalpodautoscaler_status_current_replicas{namespace="$namespace",horizontalpodautoscaler="$hpa"})'
      - step: 2
        title: "Identify the scaling driver — resource saturation, which pods, and downstream load"
        description: >-
          An HPA scales on a metric vs its TARGET, and CPU/memory utilization is computed as
          usage ÷ resource REQUEST. So always read these as "% of the request", NOT absolute
          cores/MiB. CRITICAL for the narrative: state it in plain terms, e.g.
          "cpu_util_vs_req_pct=154 means the pods are using ~1.5x the CPU they reserve
          (request-relative — this is what the HPA scales on); in absolute terms that may be a
          small fraction of a core, which is why a CPU dashboard panel can read much lower —
          they are different denominators, not a contradiction." Interpret:
          cpu_util_vs_req_pct / mem_util_vs_req_pct at/above the HPA target (often ~80-85%) =>
            CPU/memory-driven scale-out. Far above 100% with healthy pods => the request is
            undersized vs real usage (right-size the request) and/or genuine demand.
          PER-POD spread (cpu_peak_pod_pct / mem_peak_pod_pct name the HOTTEST pod;
            pods_above_cpu_target = how many of the replicas are over target): if ALL replicas
            are over target it is uniform demand (the workload genuinely needs capacity); if
            ONE pod is far hotter than the rest it is a skew/hot-shard/uneven-load problem
            (rebalancing or a stuck partition, not just more replicas). Always name the hottest pod.
          cpu_throttle_pct high with a CPU limit set => CFS throttling inflates CPU demand —
            remove the CPU limit per policy (keep the request).
          DOWNSTREAM / traffic: req_rate_rps / p95_latency_ms / errors_5xx_rps cover inbound
            HTTP for instrumented servers. For a WORKER/consumer (no http.server series) the
            demand instead shows as OUTBOUND calls — downstream_total_rps and the top edge
            (downstream_top_call labels name WHICH dependency it is driving, e.g. a DB / queue /
            internal API). Interpret: high downstream_total_rps with downstream_failed_rps≈0 =>
            the workload is genuinely busy calling healthy dependencies (real demand — raise
            capacity). downstream_failed_rps>0 => a failing dependency is causing retries that
            inflate load — fix the dependency FIRST, do not just raise maxReplicas.
          NONE elevated while still maxed => suspect the HPA config (stale/bad custom metric,
            target too low, or min==max). HONEST GAP: OBI/service-graph need OTel spans; if the
            real service.name is unknown or uninstrumented these are n/a — say so, do not invent.
          REQUIRED in the RCA narrative (do NOT collapse into a generic "high utilization" line):
            (1) name the HOTTEST pod from cpu_peak_pod_pct's pod label with its %, e.g.
            "pod <name> is hottest at 182% of CPU request"; (2) state pods_above_cpu_target out
            of the replica count to show uniform demand vs a single hot pod; (3) for a worker,
            name the top downstream dependency from downstream_top_call's server label with its
            call rate and whether downstream_failed_rps is ~0, e.g. "drives <server> at 23 req/s
            with 0 failures — healthy dependency, real demand" (failures>0 => retry storm, fix
            the dependency first).
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "CPU/mem utilization vs request (aggregate + per-pod hottest + spread), CPU throttling, inbound HTTP (for servers), and outbound downstream call/failure rate with the top dependency named (for workers)."
            params:
              queries:
                - name: cpu_util_vs_req_pct
                  unit: "%"
                  query: '100*sum(rate(container_cpu_usage_seconds_total{namespace="$namespace",pod=~"$workload-.*",container!="POD"}[5m]))/sum(kube_pod_container_resource_requests{namespace="$namespace",pod=~"$workload-.*",resource="cpu"})'
                  panel: true
                  panel_title: "CPU vs Request %"
                  panel_id: "kube-hpa-cpu-vs-request"
                - name: mem_util_vs_req_pct
                  unit: "%"
                  query: '100*sum(container_memory_working_set_bytes{namespace="$namespace",pod=~"$workload-.*",container!="POD"})/sum(kube_pod_container_resource_requests{namespace="$namespace",pod=~"$workload-.*",resource="memory"})'
                  panel: true
                  panel_title: "Memory vs Request %"
                  panel_id: "kube-hpa-mem-vs-request"
                - name: cpu_peak_pod_pct
                  unit: "%"
                  query: 'topk(1, 100*sum by (pod)(rate(container_cpu_usage_seconds_total{namespace="$namespace",pod=~"$workload-.*",container!="POD"}[5m])) / on(pod) sum by (pod)(kube_pod_container_resource_requests{namespace="$namespace",pod=~"$workload-.*",resource="cpu"}))'
                - name: mem_peak_pod_pct
                  unit: "%"
                  query: 'topk(1, 100*sum by (pod)(container_memory_working_set_bytes{namespace="$namespace",pod=~"$workload-.*",container!="POD"}) / on(pod) sum by (pod)(kube_pod_container_resource_requests{namespace="$namespace",pod=~"$workload-.*",resource="memory"}))'
                - name: pods_above_cpu_target
                  unit: "pods"
                  query: 'count(100*sum by (pod)(rate(container_cpu_usage_seconds_total{namespace="$namespace",pod=~"$workload-.*",container!="POD"}[5m])) / on(pod) sum by (pod)(kube_pod_container_resource_requests{namespace="$namespace",pod=~"$workload-.*",resource="cpu"}) >= 80)'
                - name: cpu_throttle_pct
                  unit: "%"
                  query: '100*sum(rate(container_cpu_cfs_throttled_periods_total{namespace="$namespace",pod=~"$workload-.*",container!="POD"}[5m]))/sum(rate(container_cpu_cfs_periods_total{namespace="$namespace",pod=~"$workload-.*",container!="POD"}[5m]))'
                - name: req_rate_rps
                  unit: "req/s"
                  query: 'sum(rate({__name__=~"http.server.request.duration_count|http.server.duration_count",service.name="$service"}[5m]))'
                - name: p95_latency_ms
                  unit: "ms"
                  query: 'histogram_quantile(0.95, sum by (le) (rate({__name__=~"http.server.request.duration_bucket|http.server.duration_bucket",service.name="$service"}[5m]))) * 1000'
                - name: errors_5xx_rps
                  unit: "req/s"
                  query: 'sum(rate({__name__=~"http.server.request.duration_count|http.server.duration_count",service.name="$service",http_response_status_code=~"5.."}[5m]))'
                - name: downstream_total_rps
                  unit: "req/s"
                  query: 'sum(rate(traces_service_graph_request_total{client="$service"}[5m]))'
                - name: downstream_top_call
                  unit: "req/s"
                  query: 'topk(1, sum by (server)(rate(traces_service_graph_request_total{client="$service"}[5m])))'
                - name: downstream_failed_rps
                  unit: "req/s"
                  query: 'topk(1, sum by (server)(rate(traces_service_graph_request_failed_total{client="$service"}[5m])))'
      - step: 3
        title: "Check whether the scaled replicas are actually healthy"
        description: >-
          A maxed HPA with replica_gap>0 (step 1) often means new replicas are NOT becoming
          ready, so the autoscaler keeps requesting more while none come up — the maxout is a
          SYMPTOM of replica churn, not real demand. Queries cover the HPA's target
          deployment. Interpret:
          deploy_unavailable>0 OR pods_not_ready>0 => replicas exist but aren't Ready —
            fix the readiness/startup problem FIRST; scaling/maxReplicas changes won't help.
          pods_crashloop>0 OR restarts_15m high => crashlooping replicas churn capacity and
            inflate desired replicas — follow KubePodCrashLooping for the failing container.
          pods_image_pull>0 => new replicas can't pull their image — follow KubePodImagePullBackOff.
          All healthy (unavailable==0, not_ready==0, no crashloop) => the maxout is REAL
            demand; the cause is the driver from step 2, and capacity is the lever.
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "Target-deployment desired/available/unavailable replicas plus not-ready / crashloop / image-pull / restart counts across its pods."
            params:
              queries:
                - name: dep_desired
                  unit: "pods"
                  query: 'max(kube_deployment_spec_replicas{namespace="$namespace",deployment="$workload"})'
                - name: dep_available
                  unit: "pods"
                  query: 'max(kube_deployment_status_replicas_available{namespace="$namespace",deployment="$workload"})'
                - name: dep_unavailable
                  unit: "pods"
                  query: 'max(kube_deployment_status_replicas_unavailable{namespace="$namespace",deployment="$workload"})'
                - name: pods_not_ready
                  unit: "pods"
                  query: 'sum(kube_pod_status_ready{namespace="$namespace",pod=~"$workload-.*",condition="false"})'
                - name: pods_crashloop
                  unit: "pods"
                  query: 'sum(max by (pod)(kube_pod_container_status_waiting_reason{namespace="$namespace",pod=~"$workload-.*",reason="CrashLoopBackOff"}))'
                - name: pods_image_pull
                  unit: "pods"
                  query: 'sum(max by (pod)(kube_pod_container_status_waiting_reason{namespace="$namespace",pod=~"$workload-.*",reason=~"ImagePullBackOff|ErrImagePull|InvalidImageName"}))'
                - name: restarts_15m
                  query: 'sum(increase(kube_pod_container_status_restarts_total{namespace="$namespace",pod=~"$workload-.*"}[15m]))'
      - step: 4
        title: "Rule out cluster capacity as the scaling blocker"
        description: >-
          When replica_gap>0 (step 1) and replicas are otherwise healthy (step 3), the
          blocker is usually the CLUSTER having no room to place new pods. Interpret:
          pods_pending>0 for the target deployment => new replicas are Unschedulable — the
            cluster is out of CPU/memory/quota for this pod shape; add nodes or free
            capacity (this is the real fix, not an app change).
          nodes_not_ready>0 OR nodes_unschedulable>0 => fewer schedulable nodes than usual.
          nodes_memory_pressure>0 / nodes_disk_pressure>0 => node-level pressure preventing
            placement. If nothing is pending and nodes are healthy, capacity is NOT the
            blocker — the maxout is demand/driver-based (step 2).
        tool_calls:
          - tool_id: "tool.query_metrics"
            description: "Pending pods for the target deployment and cluster node readiness / schedulability / pressure."
            params:
              queries:
                - name: pods_pending
                  unit: "pods"
                  query: 'sum(kube_pod_status_phase{namespace="$namespace",pod=~"$workload-.*",phase="Pending"})'
                - name: nodes_not_ready
                  unit: "nodes"
                  query: 'sum(kube_node_status_condition{condition="Ready",status="false"})'
                - name: nodes_unschedulable
                  unit: "nodes"
                  query: 'sum(kube_node_spec_unschedulable)'
                - name: nodes_memory_pressure
                  unit: "nodes"
                  query: 'sum(kube_node_status_condition{condition="MemoryPressure",status="true"})'
                - name: nodes_disk_pressure
                  unit: "nodes"
                  query: 'sum(kube_node_status_condition{condition="DiskPressure",status="true"})'
      - step: 5
        title: "Capture HPA conditions and recent events"
        description: "Confirm the metric pack against the live HPA object — min/max/current/desired, the active metric and its current value vs target, ScalingActive/AbleToScale/ScalingLimited conditions, and FailedGetResourceMetric / FailedComputeMetricsReplicas events that indicate a broken metric source."
        tool_calls:
          - tool_id: "tool.get_hpa_state"
            description: "HPA min/max/current/desired replicas, metric targets and current values, and scaling conditions/events."
      - step: 6
        title: "Read overload / scaling-symptom logs"
        description: >-
          Correlate the maxout with what the workload is doing. Read the target deployment's
          logs for overload signatures (timeout, too many requests, rate limit, queue full,
          backpressure, slow), startup/readiness delays (when replica_gap>0), or a stuck/
          erroring custom-metric source. Name the concrete pressure, not "high load".
        tool_calls:
          - tool_id: "tool.read_logs"
            description: "Logs filtered for overload (timeout/rate limit/queue full/backpressure), readiness/startup delay, and metric-source errors during the maxed window."
            params:
              tail_lines: 200
    remediation:   # only for suggestion — never auto-executed (forge.* are approval-gated)
      - action: "patch_resources"
        description: "Primary resource fix. If step 2 showed cpu_throttle_pct high with a CPU limit, REMOVE the CPU limit (platform policy; keep the request). If mem_util_vs_req_pct is far above the target because the memory REQUEST is undersized, right-size the request to real usage — both relieve utilization-driven scale-out. Do NOT apply if the maxout is pure traffic demand with correctly-sized resources."
        tool_id: "forge.patch_resources"
        requires_approval: true
      - action: "scale_out_replicas"
        description: "When step 2 confirms real CPU/memory/traffic demand AND step 3 shows replicas are healthy AND step 4 shows the cluster has room: raise the replica floor to add capacity. NOTE: the durable fix is raising the HPA maxReplicas (a spec change outside forge actions) — bumping replicas under an active HPA is a stopgap."
        tool_id: "forge.scale_deployment"
        requires_approval: true
      - action: "restart_deployment"
        description: "ONLY when step 3 shows replicas are unhealthy (crashlooping/not-ready) and that churn is inflating desired replicas — restoring healthy replicas removes the false demand. Not a fix for genuine capacity pressure."
        tool_id: "forge.restart_deployment"
        requires_approval: true
    escalation: >-
      Route by classified driver — traffic/CPU/memory demand with healthy replicas: SRE +
      service owner to raise maxReplicas or add cluster capacity (page if p95/5xx are
      rising); replicas unhealthy or unschedulable: platform (readiness/image/scheduling);
      no demand but maxed: service owner to fix the HPA metric source / target / min==max.
    follow_up:
      - "If demand is real and sustained, raise maxReplicas (and verify cluster capacity / node autoscaling can back it) rather than leaving the workload pinned at the ceiling."
      - "If utilization-driven, confirm requests are right-sized so the HPA scales on real pressure, not on under-set requests."
      - "If no metric was elevated, validate the HPA's metric source and target — a stale/failing custom metric or an over-aggressive target maxes the HPA without real load."

general_diagnostic:
  steps:
    - step: 1
      title: "Capture initial snapshot"
      tool_calls:
        - tool_id: "tool.capture_diagnostics"
          description: "Collect pod status, events, deployment conditions, and related objects."
    - step: 2
      title: "Inspect logs and metrics"
      tool_calls:
        - tool_id: "tool.read_logs"
          description: "Read current and previous logs for failing containers."
        - tool_id: "tool.fetch_metrics"
          description: "Review pod/node resource utilization and saturation indicators."
    - step: 3
      title: "Generate RCA narrative"
      tool_calls:
        - tool_id: "tool.generate_root_cause"
          description: "Produce root-cause summary with confidence and blast-radius estimate."

available_tools:
  - tool_id: "tool.read_logs"
    endpoint: "/api/tools/read-logs"
    description: "Read logs for target workloads/services."
    params: ["namespace", "service", "pod", "container", "since", "tail_lines"]
  - tool_id: "tool.fetch_metrics"
    endpoint: "/api/tools/fetch-metrics"
    description: "Fetch metrics for services, pods, nodes, and cluster entities."
    params: ["namespace", "service", "pod", "node", "window", "metric_filter"]
  - tool_id: "tool.query_metrics"
    endpoint: "/api/tools/query-metrics"
    description: >-
      Run named PromQL queries against VictoriaMetrics and return pre-computed
      values. Generic across alert classes: each diagnostic step supplies its own
      `queries` list (name + PromQL), with $namespace/$workload/$container/$node/
      $pod/$cluster placeholders auto-substituted from the alert. Use it to ground
      the RCA in real numbers (ratios, peaks, slopes) rather than generic text.
    params: ["namespace", "pod", "container", "workload", "node", "queries"]
  - tool_id: "tool.list_services"
    endpoint: "/api/tools/list-services"
    description: "List discovered services and their health context."
    params: ["namespace", "label_selector"]
  - tool_id: "tool.detect_anomalies"
    endpoint: "/api/tools/detect-anomalies"
    description: "Run anomaly detection against selected telemetry windows."
    params: ["scope", "window", "signals"]
  - tool_id: "tool.get_service_health"
    endpoint: "/api/tools/get-service-health"
    description: "Fetch service-level health summary and status."
    params: ["namespace", "service"]
  - tool_id: "tool.detect_log_spike"
    endpoint: "/api/tools/detect-log-spike"
    description: "Detect sudden spikes in log volume/error logs."
    params: ["namespace", "service", "window"]
  - tool_id: "tool.cluster_error_patterns"
    endpoint: "/api/tools/cluster-error-patterns"
    description: "Analyze recurring cluster-wide error signatures."
    params: ["window", "namespace", "service"]
  - tool_id: "tool.find_new_error_signatures"
