tech_stack: kubernetes-kube-state-metrics
version: "1.0"
description: "Runbook for kube-state-metrics alert handling, covering exporter availability, Kubernetes API list/watch failures, and sharding health mismatches or missing shard coverage."

match_keywords:
  - kube state metrics down
  - ksm unreachable
  - kube state metrics list errors
  - kube state metrics watch errors
  - ksm sharding mismatch
  - ksm shards missing
  - kubernetes object metrics missing

categories:
  - MONITORING
  - CONTROL_PLANE
  - RELIABILITY
  - PERFORMANCE

common_alerts:
  - name: "KubeStateMetricsDown"
    patterns: ["KubeStateMetricsDown", "ksm down", "kube-state-metrics unreachable"]
    priority: P2
    diagnostic_steps:
      - step: 1
        title: "Validate KSM availability and scrape health"
        description: "Confirm if failure is pod unavailability, service endpoint issue, or scrape path mismatch."
        tool_calls:
          - tool_id: "tool.capture_diagnostics"
            description: "Collect KSM pod status, endpoints, service monitor mapping, and logs."
      - step: 2
        title: "Assess alerting blind spot impact"
        description: "Estimate which `kube_*` metrics and dependent alerts are impacted."
        tool_calls:
          - tool_id: "tool.fetch_metrics"
            description: "Compare expected Kubernetes object metric families vs currently scraped series."
    remediation: []
    escalation: "Platform monitoring owner if downtime exceeds one alert cycle or affects multiple clusters."

  - name: "KubeStateMetricsListErrors"
    patterns: ["KubeStateMetricsListErrors", "ksm list error", "kube state metrics api list failures"]
    priority: P2
    diagnostic_steps:
      - step: 1
        title: "Identify failing list resources"
        description: "Pinpoint which resource kinds are failing list calls against API server."
        tool_calls:
          - tool_id: "tool.capture_diagnostics"
            description: "Parse KSM logs and counters for list failures grouped by resource."
      - step: 2
        title: "Validate API server and RBAC dependencies"
        description: "Differentiate API server overload/timeouts from RBAC permission regressions."
        tool_calls:
          - tool_id: "tool.capture_diagnostics"
            description: "Check clusterrole bindings and denied API operations for KSM service account."
    remediation: []
    escalation: "SRE/platform team if list failure ratio remains >1% for 15m."

  - name: "KubeStateMetricsWatchErrors"
    patterns: ["KubeStateMetricsWatchErrors", "ksm watch error", "watch stream failures"]
    priority: P2
    diagnostic_steps:
      - step: 1
        title: "Inspect watch stream errors"
        description: "Determine if watch errors are API timeout related, permission related, or object-specific."
        tool_calls:
          - tool_id: "tool.capture_diagnostics"
            description: "Collect watch error counters and log signatures by resource/watch endpoint."
      - step: 2
        title: "Check API server stability"
        description: "Correlate watch failures with API server latency/error alerts."
        tool_calls:
          - tool_id: "tool.get_service_health"
            description: "Review API latency and 5xx trends during watch failure window."
    remediation: []
    escalation: "Platform SRE when sustained watch failures risk stale object-state metrics."

  - name: "KubeStateMetricsShardingMismatch"
    patterns: ["KubeStateMetricsShardingMismatch", "ksm shard mismatch", "total shard disagreement"]
    priority: P3
    diagnostic_steps:
      - step: 1
        title: "Validate shard configuration consistency"
        description: "Check all shard pods agree on `total_shards` and shard ordinal wiring."
        tool_calls:
          - tool_id: "tool.capture_diagnostics"
            description: "Collect per-pod shard env/config and emitted shard metadata metrics."
    remediation: []
    escalation: "Platform monitoring team for config drift correction."

  - name: "KubeStateMetricsShardsMissing"
    patterns: ["KubeStateMetricsShardsMissing", "missing ksm shard", "partial shard coverage"]
    priority: P2
    diagnostic_steps:
      - step: 1
        title: "Identify missing shard ordinals"
        description: "Determine which shard ordinals are absent and whether pod scheduling failures exist."
        tool_calls:
          - tool_id: "tool.capture_diagnostics"
            description: "List shard ordinals reported vs expected and map to pod readiness."
      - step: 2
        title: "Check statefulset/deployment health"
        description: "Verify desired replica count and scheduling constraints for missing shard pods."
        tool_calls:
          - tool_id: "tool.capture_diagnostics"
            description: "Inspect controller status, pending pods, and recent rollout changes."
    remediation: []
    escalation: "SRE/monitoring owners if shard gaps persist and metric coverage is degraded."

general_diagnostic:
  steps:
    - step: 1
      title: "Capture kube-state-metrics baseline"
      tool_calls:
        - tool_id: "tool.capture_diagnostics"
          description: "Collect pod/service health, logs, and scrape status."
    - step: 2
      title: "Validate API dependency and permissions"
      tool_calls:
        - tool_id: "tool.get_service_health"
          description: "Review API server health and request error/latency indicators."
        - tool_id: "tool.capture_diagnostics"
          description: "Audit KSM service account permissions and denies."
    - step: 3
      title: "Generate RCA summary"
      tool_calls:
        - tool_id: "tool.generate_root_cause"
          description: "Produce root-cause narrative including data-loss and alerting blind-spot impact."

available_tools:
