key_metrics:
  - name: "up{job=~'.*kube-state-metrics.*'}"
    threshold: "absent for 10m"
    severity: warning
  - name: "rate(kube_state_metrics_list_total{result='error'}[5m]) / rate(kube_state_metrics_list_total[5m])"
    threshold: "> 1% for 15m"
    severity: warning
  - name: "rate(kube_state_metrics_watch_total{result='error'}[5m]) / rate(kube_state_metrics_watch_total[5m])"
    threshold: "> 1% for 15m"
    severity: warning
  - name: "stdvar(kube_state_metrics_total_shards)"
    threshold: "!= 0 for 15m"
    severity: warning
  - name: "missing shard ordinal bitset expression"
    threshold: "!= 0 for 15m"
    severity: warning

escalation:
  P2: "Notify platform monitoring/SRE on-call and triage within 15 minutes."
  P3: "Schedule configuration consistency fix in maintenance window if no immediate impact."
