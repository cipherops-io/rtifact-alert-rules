    endpoint: "/api/tools/read-logs"
    description: "Read logs for target workloads/services."
    params: ["namespace", "service", "pod", "container", "since", "tail_lines"]
  - tool_id: "tool.fetch_metrics"
    endpoint: "/api/tools/fetch-metrics"
    description: "Fetch metrics for services, pods, nodes, and cluster entities."
    params: ["namespace", "service", "pod", "node", "window", "metric_filter"]
  - tool_id: "tool.list_services"
    endpoint: "/api/tools/list-services"
    description: "List discovered services and their health context."
    params: ["namespace", "label_selector"]
  - tool_id: "tool.detect_anomalies"
    endpoint: "/api/tools/detect-anomalies"
    description: "Run anomaly detection against selected telemetry windows."
    params: ["scope", "window", "signals"]
  - tool_id: "tool.get_service_health"
    endpoint: "/api/tools/get-service-health"
    description: "Fetch service-level health summary and status."
    params: ["namespace", "service"]
  - tool_id: "tool.detect_log_spike"
    endpoint: "/api/tools/detect-log-spike"
    description: "Detect sudden spikes in log volume/error logs."
    params: ["namespace", "service", "window"]
  - tool_id: "tool.cluster_error_patterns"
    endpoint: "/api/tools/cluster-error-patterns"
    description: "Analyze recurring cluster-wide error signatures."
    params: ["window", "namespace", "service"]
  - tool_id: "tool.find_new_error_signatures"
    endpoint: "/api/tools/find-new-error-signatures"
    description: "Find newly emerging error signatures from logs."
    params: ["namespace", "service", "window"]
  - tool_id: "tool.capture_diagnostics"
    endpoint: "/api/tools/capture-diagnostics"
    description: "Capture consolidated diagnostics bundle."
    params: ["namespace", "service", "pod", "node"]
  - tool_id: "tool.generate_root_cause"
    endpoint: "/api/tools/generate-root-cause"
    description: "Generate root-cause analysis from collected telemetry."
