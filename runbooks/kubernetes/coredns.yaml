  - tool_id: "forge.describe_hpa"
    endpoint: "/api/tools/describe-hpa"
    description: "Describe HPA action API."
    params: ["namespace", "hpa"]
  - tool_id: "forge.drain_node"
    endpoint: "/api/tools/drain-node"
    description: "Drain node action API."
    params: ["node", "ignore_daemonsets", "delete_emptydir_data"]
  - tool_id: "forge.patch_resources"
    endpoint: "/api/tools/patch-resources"
    description: "Patch resource requests/limits action API."
    params: ["namespace", "kind", "name", "patch"]

key_metrics:
  - name: "up{job=~'.*coredns.*'}"
    threshold: "absent for 5m"
    severity: critical
  - name: "rate(coredns_panics_total[5m])"
    threshold: "> 0 for 5m"
    severity: critical
  - name: "histogram_quantile(0.99, coredns_dns_request_duration_seconds_bucket)"
    threshold: "> 0.5s for 5m"
    severity: warning
  - name: "SERVFAIL|REFUSED response ratio"
    threshold: "> 3% for 5m"
    severity: warning
  - name: "forwarder error ratio"
    threshold: "> 3% for 5m"
    severity: warning
  - name: "cache hit ratio"
    threshold: "< 50% for 30m"
    severity: warning

escalation:
  P0: "Immediate incident bridge. Cluster service discovery is down."
  P1: "Page platform networking owner; production DNS reliability at risk."
  P2: "Notify on-call SRE/platform channel and triage within 15 minutes."
  P3: "Schedule optimization follow-up for cache and DNS query hygiene."
