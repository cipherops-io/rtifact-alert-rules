# Elasticsearch self-hosted runbook: VictoriaMetrics evidence plus live
# read-only Elasticsearch MCP calls. VM is VictoriaMetrics. Every live call
# uses target: child; the MCP registry routes it to the alerting cluster's connection.
# Source: the 10 enabled Elasticsearch rules supplied on 2026-10-13.
# Query inputs: raw alert label $instance + the platform's scoped VM datasource.
# Installation target: runbooks/databases/elasticsearch.yaml
# Shared query anchors use the same pattern as the reference runbook.
# Core rule queries add only an instance matcher; thresholds/windows remain unchanged.
# Ratios and latency estimates retain source labels and exclude zero denominators.
# Supporting topk lists are target-scoped candidates; they are not full inventories.

tech_stack: elasticsearch
version: '2.0'
description: >-
  LIVE TOOLS: besides tool.query_metrics, each alert ends with a step of
  read-only mcp.elasticsearch.* calls. ROUTING: every live call specifies
  target: child, so the executor resolves the alerting cluster's Elasticsearch
  connection through the MCP config registry (one rule per connection, matched
  on the alert's impacted entities). With several Elasticsearch connections in
  one environment, a call with no matching or an ambiguous rule is NOT RUN
  rather than sent to another cluster. Unlike the Elastic Cloud runbook there is
  no parent (monitoring) deployment: the stored exporter samples come from VM
  and current state comes from the live child cluster. Compare cluster_name from
  live cluster_health with the alert's cluster label before using any live
  result. A failed, unauthorized or
  unreachable live call is recorded as NOT RUN evidence and does not stop the
  independent VM queries. Live readings are point-in-time, not the rule window;
  native counters are cumulative since node start. Optional calls that need
  $name (node), $index or a bound index are skipped when that value is missing.
  The VM sections below describe the original metric-only behaviour.
  Investigation runbook for the ten enabled rules in rules/metrics/databases/elasticsearch.yml.
  Intended for self-hosted Elasticsearch exported through prometheus-community/elasticsearch_exporter.
  Every VM call is tool.query_metrics; all queried metric names are in the supplied 229-metric
  inventory. The exporter already collects Elasticsearch statistics; VM steps read those stored samples.
  Live steps use the Elasticsearch MCP connection's own credentials. VM access and tenant routing remain the platform's responsibility.
  VictoriaMetrics is the evidence store, not an Elasticsearch parent deployment. EXECUTION AND IDENTITY:
  use the same common_alerts, diagnostic_steps, tool_calls, params.queries and panel fields as the reference
  ClickHouse runbook. The sole query placeholder is $instance. The runner MUST resolve it from the original
  firing series' instance label and escape it as a PromQL string value; do not use a mapped service name,
  Kubernetes node, Elasticsearch URL, platform cluster ID or a guessed value. The VM datasource MUST already
  enforce the incident's tenant/project/environment scope. An instance selector is not tenant isolation.
  Confirm it resolves to one Elasticsearch target in that scope. If it is missing, ambiguous or reused
  for multiple targets, mark scope unresolved and do not widen the query. This requirement must be checked
  in the real executor before rollout. No other placeholders or bindings are required. ATTRIBUTION: node
  stats normally use name for the Elasticsearch node; instance is the exporter scrape target and is not
  itself a database node. Preserve the full series labels, including job, cluster/exported_cluster, namespace/exported_namespace,
  name/host, index, breaker, type, mount and path when returned. Scrape relabeling may change which cluster/namespace
  label describes Elasticsearch versus Kubernetes; do not equate the two. Core queries retain all labels
  and read peer nodes through the same target for comparison. Select the firing series using all available
  alert labels before forming a conclusion. Do not sum duplicate exporter jobs or replicas, filesystem
  paths on the same mount, overlapping breaker estimates, or primary and total index metrics. Settings
  metrics may lack cluster and node labels. Node metrics depend on exporter collection coverage; a partial
  node scrape is not a cluster census. Topk queries are supporting candidate lists within this target
  only, never complete inventories or proof that the alerting object is healthy if it is not listed. TIME
  AND DATA QUALITY: use a range covering at least 30 minutes before the alert start and 15 minutes after
  it, or through the latest available sample for an active incident. Use a step no coarser than necessary
  for the rule (normally 30 seconds, or the actual scrape interval if slower). Evaluate the latest state
  separately. Do this through the query tool's existing incident time context; no unverified time-parameter
  names are added here. If the executor supplies only present-time instant results, report historical
  onset/order as unavailable rather than claiming the incident was reproduced. offset 30m is relative
  to each evaluation timestamp, not automatically a healthy baseline. Compare pre-onset values explicitly.
  Validate collector success, signal timestamps and observed sample counts against the configured scrape
  interval and ingestion delay. The alert rule's 30s evaluation interval is not proof of a 30s scrape
  interval. Timestamp freshness proves arrival at VM, not that an exporter successfully refreshed its
  cached source data. A reported collection failure can coexist with application availability; disappearance
  of the exporter is a different failure and is not detected by scrape_success == 0. Missing series, division
  exclusions, failed requests and truncated results mean unavailable evidence. Never fill missing evidence
  with zero. Continue independent VM queries when one collector or optional metric is unavailable. Collector
  success percentage is the fraction of observed samples that succeeded, not an uptime SLA; gaps are not
  counted as successful samples. Treat unsupported negative sentinel values, such as a CPU value of -1,
  as unavailable rather than low utilization. QUERY SEMANTICS: the rule-condition queries reproduce the
  supplied comparisons, rolling windows and volume gates, adding only the instance selector. The rule's
  for period is described in each entry; it is not a function encoded by an instant query. Use native
  VictoriaMetrics increase/rate semantics consistently with VM alert evaluation; do not silently replace
  them with increase_prometheus. If rules actually evaluate in a different engine, record its counter-window
  differences. Counters use rate/increase before any aggregation; resets and scrape gaps reduce confidence
  in event timing. Gauges such as disk bytes, shard counts, queue depth, heap and index store size are
  not event counters even when their name ends in _total. Gauge delta is net change and can reflect relocation,
  deletion or restart; it is not ingestion volume. Ratios exclude nonpositive denominators rather than
  manufacturing a value. The rule-condition values retain their original units: disk/heap/thread-pool
  ratios are fractions, while companion queries ending in _pct return 0-100 percentages. Search/index
  time divided by operation count is a mean internal operation time, not end-user latency or a percentile.
  GC time rate is reported collection time per second, not a proven stop-the-world percentage. RCA OUTPUT:
  state (1) the firing rule, exact object labels, incident time and threshold; (2) observed impact and
  peak/current values with units; (3) an evidence timeline using the query names, timestamps and matching
  series; (4) the best supported cause or contributing condition and a high/medium/low confidence level;
  (5) alternatives ruled out only by fresh, adequately scoped evidence; (6) missing evidence and what
  it prevents us from deciding; and (7) a proportionate owner action and measurable recovery criteria.
  High confidence in a measured symptom does not mean high confidence in its underlying cause. Correlation
  and temporal precedence support a hypothesis but do not prove an exact failed request, allocation decider,
  master election failure or disk error. Where metrics cannot decide, say root cause unconfirmed and list
  the specific missing evidence for the owner. This version does not call logs or Kubernetes diagnostics;
  live Elasticsearch APIs are limited to the read-only calls listed below. Remediation entries are conditional human recommendations, not executable
  actions. Never claim a change was applied, approve data loss, or close an incident only because the
  alert resolved, its rolling window expired or traffic stopped.
match_keywords:
  - elasticsearch
  - elastic search
  - elasticsearch exporter
  - self-hosted elasticsearch
  - elasticsearch_scrape_success
  - elasticsearch_cluster_health
  - elasticsearch_jvm
  - elasticsearch_breakers
  - elasticsearch_thread_pool
categories:
  - DATA
  - DATABASE
collection_quality_queries: &collection_quality_queries
  - name: collector_success
    query: 'elasticsearch_scrape_success{instance="$instance"}'
    panel: true
    panel_title: 'Collector Success: 1 = Successful'
    panel_id: es-collector-success
  - name: collector_sample_age_seconds
    unit: s
    query: 'time() - timestamp(elasticsearch_scrape_success{instance="$instance"})'
  - name: collector_samples_5m
    query: 'count_over_time(elasticsearch_scrape_success{instance="$instance"}[5m])'
  - name: collector_success_pct_15m
    unit: '%'
    query: '100 * avg_over_time(elasticsearch_scrape_success{instance="$instance"}[15m])'
  - name: collector_series_missing_5m
    query: 'absent_over_time(elasticsearch_scrape_success{instance="$instance"}[5m])'
cluster_health_queries: &cluster_health_queries
  - name: cluster_health_by_color
    query: 'elasticsearch_cluster_health_status{instance="$instance"}'
    panel: true
    panel_title: Cluster Health by Color
    panel_id: es-cluster-health-by-color
  - name: unassigned_shards
    query: 'elasticsearch_cluster_health_unassigned_shards{instance="$instance"}'
    panel: true
    panel_title: Unassigned Shards
    panel_id: es-unassigned-shards
  - name: active_primary_shards
    query: 'elasticsearch_cluster_health_active_primary_shards{instance="$instance"}'
  - name: active_shards_all_copies
    query: 'elasticsearch_cluster_health_active_shards{instance="$instance"}'
  - name: initializing_shards
    query: 'elasticsearch_cluster_health_initializing_shards{instance="$instance"}'
  - name: relocating_shards
    query: 'elasticsearch_cluster_health_relocating_shards{instance="$instance"}'
  - name: delayed_unassigned_shards
    query: 'elasticsearch_cluster_health_delayed_unassigned_shards{instance="$instance"}'
cluster_membership_queries: &cluster_membership_queries
  - name: cluster_nodes
    query: 'elasticsearch_cluster_health_number_of_nodes{instance="$instance"}'
    panel: true
    panel_title: Cluster Nodes
    panel_id: es-cluster-nodes
  - name: cluster_data_nodes
    query: 'elasticsearch_cluster_health_number_of_data_nodes{instance="$instance"}'
    panel: true
    panel_title: Cluster Data Nodes
    panel_id: es-cluster-data-nodes
  - name: cluster_data_nodes_30m_earlier
    query: 'elasticsearch_cluster_health_number_of_data_nodes{instance="$instance"} offset 30m'
  - name: cluster_nodes_high_water_1h
    query: 'max_over_time(elasticsearch_cluster_health_number_of_nodes{instance="$instance"}[1h])'
  - name: node_uptime_seconds
    unit: s
    query: 'elasticsearch_jvm_uptime_seconds{instance="$instance"}'
    panel: true
    panel_title: JVM Uptime by Node
    panel_id: es-node-uptime-seconds
  - name: node_cpu_counter_resets_1h
    query: 'resets(elasticsearch_process_cpu_seconds_total{instance="$instance"}[1h])'
  - name: previously_observed_nodes_now_missing
    unit: s
    query: '(elasticsearch_jvm_uptime_seconds{instance="$instance"} offset 30m) unless elasticsearch_jvm_uptime_seconds{instance="$instance"}'
disk_capacity_queries: &disk_capacity_queries
  - name: data_disk_used_pct
    unit: '%'
    query: >-
      (100 * (1 - elasticsearch_filesystem_data_available_bytes{instance="$instance"} / elasticsearch_filesystem_data_size_bytes{instance="$instance"}))
      and (elasticsearch_filesystem_data_size_bytes{instance="$instance"} > 0)
    panel: true
    panel_title: Data Disk Used % by Node and Path
    panel_id: es-data-disk-used-pct
  - name: data_disk_available_bytes
    unit: B
    query: 'elasticsearch_filesystem_data_available_bytes{instance="$instance"}'
    panel: true
    panel_title: Data Disk Available Bytes
    panel_id: es-data-disk-available-bytes
  - name: data_disk_capacity_bytes
    unit: B
    query: 'elasticsearch_filesystem_data_size_bytes{instance="$instance"}'
  - name: data_disk_available_change_1h
    unit: B
    query: 'delta(elasticsearch_filesystem_data_available_bytes{instance="$instance"}[1h])'
  - name: data_disk_capacity_changes_1h
    query: 'changes(elasticsearch_filesystem_data_size_bytes{instance="$instance"}[1h])'
  - name: data_disk_samples_1h
    query: 'count_over_time(elasticsearch_filesystem_data_available_bytes{instance="$instance"}[1h])'
node_memory_queries: &node_memory_queries
  - name: heap_used_pct
    unit: '%'
    query: >-
      (100 * (elasticsearch_jvm_memory_used_bytes{instance="$instance",area="heap"} / elasticsearch_jvm_memory_max_bytes{instance="$instance",area="heap"}))
      and (elasticsearch_jvm_memory_max_bytes{instance="$instance",area="heap"} > 0)
    panel: true
    panel_title: JVM Heap Used % by Node
    panel_id: es-heap-used-pct
  - name: heap_used_bytes
    unit: B
    query: 'elasticsearch_jvm_memory_used_bytes{instance="$instance",area="heap"}'
  - name: heap_max_bytes
    unit: B
    query: 'elasticsearch_jvm_memory_max_bytes{instance="$instance",area="heap"}'
  - name: gc_collection_seconds_per_second
    unit: s/s
    query: 'rate(elasticsearch_jvm_gc_collection_seconds_sum{instance="$instance"}[5m])'
    panel: true
    panel_title: GC Collection Time Rate by Collector
    panel_id: es-gc-collection-seconds-per-second
  - name: gc_collections_per_second
    unit: collections/s
    query: 'rate(elasticsearch_jvm_gc_collection_seconds_count{instance="$instance"}[5m])'
  - name: gc_mean_collection_seconds
    unit: s/collection
    query: >-
      (rate(elasticsearch_jvm_gc_collection_seconds_sum{instance="$instance"}[5m]) / rate(elasticsearch_jvm_gc_collection_seconds_count{instance="$instance"}[5m]))
      and (rate(elasticsearch_jvm_gc_collection_seconds_count{instance="$instance"}[5m]) > 0)
  - name: process_cpu_percent
    unit: '%'
    query: 'elasticsearch_process_cpu_percent{instance="$instance"}'
    panel: true
    panel_title: Elasticsearch Process CPU
    panel_id: es-process-cpu-percent
  - name: os_cpu_percent
    unit: '%'
    query: 'elasticsearch_os_cpu_percent{instance="$instance"}'
breaker_queries: &breaker_queries
  - name: breaker_trips_10m
    query: 'increase(elasticsearch_breakers_tripped{instance="$instance"}[10m])'
    panel: true
    panel_title: Circuit Breaker Trips in 10m
    panel_id: es-breaker-trips-10m
  - name: breaker_estimated_bytes
    unit: B
    query: 'elasticsearch_breakers_estimated_size_bytes{instance="$instance"}'
  - name: breaker_limit_bytes
    unit: B
    query: 'elasticsearch_breakers_limit_size_bytes{instance="$instance"}'
  - name: breaker_estimate_to_limit_pct
    unit: '%'
    query: >-
      (100 * (elasticsearch_breakers_estimated_size_bytes{instance="$instance"} / elasticsearch_breakers_limit_size_bytes{instance="$instance"}))
      and (elasticsearch_breakers_limit_size_bytes{instance="$instance"} > 0)
  - name: breaker_overhead_multiplier
    query: 'elasticsearch_breakers_overhead{instance="$instance"}'
thread_pool_queries: &thread_pool_queries
  - name: pool_rejected_tasks_per_second
    unit: tasks/s
    query: >-
      rate(elasticsearch_thread_pool_rejected_count{instance="$instance",type=~"search|search_coordination|search_throttled|write|write_coordination|bulk|index"}[5m])
  - name: pool_completed_tasks_per_second
    unit: tasks/s
    query: >-
      rate(elasticsearch_thread_pool_completed_count{instance="$instance",type=~"search|search_coordination|search_throttled|write|write_coordination|bulk|index"}[5m])
  - name: pool_rejection_ratio_pct
    unit: '%'
    query: >-
      (100 * (rate(elasticsearch_thread_pool_rejected_count{instance="$instance",type=~"search|search_coordination|search_throttled|write|write_coordination|bulk|index"}[5m])
      / (rate(elasticsearch_thread_pool_rejected_count{instance="$instance",type=~"search|search_coordination|search_throttled|write|write_coordination|bulk|index"}[5m])
      + rate(elasticsearch_thread_pool_completed_count{instance="$instance",type=~"search|search_coordination|search_throttled|write|write_coordination|bulk|index"}[5m]))))
      and ((rate(elasticsearch_thread_pool_rejected_count{instance="$instance",type=~"search|search_coordination|search_throttled|write|write_coordination|bulk|index"}[5m])
      + rate(elasticsearch_thread_pool_completed_count{instance="$instance",type=~"search|search_coordination|search_throttled|write|write_coordination|bulk|index"}[5m]))
      > 0)
    panel: true
    panel_title: Rejected / (Completed + Rejected) Tasks
    panel_id: es-pool-rejection-ratio-pct
  - name: pool_task_volume_5m
    query: >-
      increase(elasticsearch_thread_pool_rejected_count{instance="$instance",type=~"search|search_coordination|search_throttled|write|write_coordination|bulk|index"}[5m])
      + increase(elasticsearch_thread_pool_completed_count{instance="$instance",type=~"search|search_coordination|search_throttled|write|write_coordination|bulk|index"}[5m])
  - name: pool_queue_tasks
    unit: tasks
    query: 'elasticsearch_thread_pool_queue_count{instance="$instance",type=~"search|search_coordination|search_throttled|write|write_coordination|bulk|index"}'
    panel: true
    panel_title: Thread Pool Queue by Node and Pool
    panel_id: es-pool-queue-tasks
  - name: pool_active_threads
    query: 'elasticsearch_thread_pool_active_count{instance="$instance",type=~"search|search_coordination|search_throttled|write|write_coordination|bulk|index"}'
  - name: pool_current_threads
    query: 'elasticsearch_thread_pool_threads_count{instance="$instance",type=~"search|search_coordination|search_throttled|write|write_coordination|bulk|index"}'
node_workload_queries: &node_workload_queries
  - name: node_search_operations_per_second
    unit: operations/s
    query: 'rate(elasticsearch_indices_search_query_total{instance="$instance"}[5m])'
    panel: true
    panel_title: Search Shard Operation Rate by Node
    panel_id: es-node-search-operations-per-second
  - name: node_search_rate_30m_earlier
    unit: operations/s
    query: 'rate(elasticsearch_indices_search_query_total{instance="$instance"}[5m] offset 30m)'
  - name: node_index_operations_per_second
    unit: operations/s
    query: 'rate(elasticsearch_indices_indexing_index_total{instance="$instance"}[5m])'
    panel: true
    panel_title: Index Operation Rate by Node
    panel_id: es-node-index-operations-per-second
  - name: node_index_rate_30m_earlier
    unit: operations/s
    query: 'rate(elasticsearch_indices_indexing_index_total{instance="$instance"}[5m] offset 30m)'
  - name: node_search_mean_operation_seconds
    unit: s/operation
    query: >-
      (rate(elasticsearch_indices_search_query_time_seconds{instance="$instance"}[5m]) / rate(elasticsearch_indices_search_query_total{instance="$instance"}[5m]))
      and (rate(elasticsearch_indices_search_query_total{instance="$instance"}[5m]) > 0)
  - name: node_index_mean_operation_seconds
    unit: s/operation
    query: >-
      (rate(elasticsearch_indices_indexing_index_time_seconds_total{instance="$instance"}[5m]) / rate(elasticsearch_indices_indexing_index_total{instance="$instance"}[5m]))
      and (rate(elasticsearch_indices_indexing_index_total{instance="$instance"}[5m]) > 0)
storage_activity_queries: &storage_activity_queries
  - name: filesystem_device_read_bytes_per_second
    unit: B/s
    query: '1024 * rate(elasticsearch_filesystem_io_stats_device_read_size_kilobytes_sum{instance="$instance"}[5m])'
  - name: filesystem_device_write_bytes_per_second
    unit: B/s
    query: '1024 * rate(elasticsearch_filesystem_io_stats_device_write_size_kilobytes_sum{instance="$instance"}[5m])'
  - name: merges_in_progress
    query: 'elasticsearch_indices_merges_current{instance="$instance"}'
  - name: merge_working_bytes
    unit: B
    query: 'elasticsearch_indices_merges_current_size_in_bytes{instance="$instance"}'
  - name: merge_throttled_seconds_per_second
    unit: s/s
    query: 'rate(elasticsearch_indices_merges_total_throttled_time_seconds_total{instance="$instance"}[5m])'
  - name: indexing_throttled_seconds_per_second
    unit: s/s
    query: 'rate(elasticsearch_indices_indexing_throttle_time_seconds_total{instance="$instance"}[5m])'
  - name: node_translog_bytes
    unit: B
    query: 'elasticsearch_indices_translog_size_in_bytes{instance="$instance"}'
cluster_task_queries: &cluster_task_queries
  - name: cluster_task_max_wait_seconds
    unit: s
    query: 'elasticsearch_cluster_health_task_max_waiting_in_queue_millis{instance="$instance"} / 1000'
    panel: true
    panel_title: Longest Pending Cluster Task Wait
    panel_id: es-cluster-task-max-wait-seconds
  - name: cluster_pending_tasks
    unit: tasks
    query: 'elasticsearch_cluster_health_number_of_pending_tasks{instance="$instance"}'
    panel: true
    panel_title: Pending Cluster Management Tasks
    panel_id: es-cluster-pending-tasks
  - name: cluster_in_flight_shard_fetches
    query: 'elasticsearch_cluster_health_number_of_in_flight_fetch{instance="$instance"}'
  - name: cluster_task_wait_peak_30m_seconds
    unit: s
    query: 'max_over_time(elasticsearch_cluster_health_task_max_waiting_in_queue_millis{instance="$instance"}[30m])
      / 1000'
index_storage_queries: &index_storage_queries
  - name: largest_indices_all_copies_bytes
    unit: B
    query: 'topk(10, elasticsearch_indices_store_size_bytes_total{instance="$instance"})'
  - name: largest_primary_index_growth_1h_bytes
    unit: B
    query: 'topk(10, delta(elasticsearch_indices_store_size_bytes_primary{instance="$instance"}[1h]))'
  - name: largest_stored_shard_copies_bytes
    unit: B
    query: 'topk(10, elasticsearch_indices_shards_store_size_in_bytes{instance="$instance"})'
  - name: reported_read_only_indices
    query: 'elasticsearch_indices_settings_stats_read_only_indices{instance="$instance"}'
available_tools:
  - tool.query_metrics — VictoriaMetrics; scoped by the platform datasource
  - mcp.elasticsearch.cluster_health — read-only; route using target: child
  - mcp.elasticsearch.nodes_info — read-only; route using target: child
  - mcp.elasticsearch.nodes_stats — read-only; route using target: child
  - mcp.elasticsearch.nodes_hot_threads — read-only; route using target: child
  - mcp.elasticsearch.cat_shards — read-only; route using target: child
  - mcp.elasticsearch.cluster_get_settings — read-only; route using target: child
  - mcp.elasticsearch.cluster_allocation_explain — read-only; route using target: child
  - mcp.elasticsearch.get_index — read-only; route using target: child
  - mcp.elasticsearch.ilm_explain_lifecycle — read-only; route using target: child
  - mcp.elasticsearch.search_query_dsl — read-only; not used by this runbook (no monitoring indices)

# Live MCP calls. Same tools, arguments and target: child as the Elastic Cloud
# child calls; the registry rule selects the alerting cluster's connection.
live_health: &live_health
  tool_id: mcp.elasticsearch.cluster_health
  target: child
  description: >-
    Live: current health and aggregate shard/node/pending-task counts. Match
    cluster_name with the alert's cluster label before trusting other live calls.
  params:
    arguments:
      level: cluster
    summary_chars: 4000
    fields:
      - cluster=cluster_name
      - status=status
      - timed_out=timed_out
      - nodes=number_of_nodes
      - data_nodes=number_of_data_nodes
      - unassigned=unassigned_shards
      - unassigned_primaries=unassigned_primary_shards
      - active_primaries=active_primary_shards
      - initializing=initializing_shards
      - relocating=relocating_shards
      - delayed_unassigned=delayed_unassigned_shards
      - pending_tasks=number_of_pending_tasks
      - max_task_wait_ms=task_max_waiting_in_queue_millis

live_nodes_info: &live_nodes_info
  tool_id: mcp.elasticsearch.nodes_info
  target: child
  description: >-
    Live: node identities, roles and Elasticsearch versions. Inspect _nodes.failed;
    a truncated summary does not prove a node is missing.
  params:
    arguments:
      nodeId: _all
      metric: _none
    summary_chars: 4000

live_jvm_stats: &live_jvm_stats
  tool_id: mcp.elasticsearch.nodes_stats
  target: child
  description: >-
    Live: current heap, memory pools, GC counts/times and uptime per node. GC
    counters are cumulative since node start; use VM rates for the alert window.
  params:
    arguments:
      metric: jvm
    summary_chars: 4000

live_breaker_stats: &live_breaker_stats
  tool_id: mcp.elasticsearch.nodes_stats
  target: child
  description: >-
    Live: circuit breaker estimated size, limit, overhead and cumulative trips
    per node. Trips are cumulative; compare with the VM 10m increase.
  params:
    arguments:
      metric: breaker
    summary_chars: 4000

live_cpu_stats: &live_cpu_stats
  tool_id: mcp.elasticsearch.nodes_stats
  target: child
  description: >-
    Live: OS/process CPU, load average and cgroup throttling counters per node.
  params:
    arguments:
      metric: os,process
    summary_chars: 4000

live_disk_stats: &live_disk_stats
  tool_id: mcp.elasticsearch.nodes_stats
  target: child
  description: >-
    Live: available/total bytes for each data path and filesystem I/O counters.
  params:
    arguments:
      metric: fs
    summary_chars: 4000

live_pool_stats: &live_pool_stats
  tool_id: mcp.elasticsearch.nodes_stats
  target: child
  description: >-
    Live: thread-pool queue/active/rejected counts and indexing-pressure
    counters per node. Rejections are cumulative since node start.
  params:
    arguments:
      metric: thread_pool,indexing_pressure
    summary_chars: 4000

live_index_stats: &live_index_stats
  tool_id: mcp.elasticsearch.nodes_stats
  target: child
  description: >-
    Live: per-node fielddata, query/request cache, segments, merge, indexing and
    search statistics. Not a per-index breakdown.
  params:
    arguments:
      metric: indices
    summary_chars: 4000

live_hot_threads: &live_hot_threads
  tool_id: mcp.elasticsearch.nodes_hot_threads
  target: child
  description: >-
    Live: top CPU thread samples across all nodes. Current sample only; quiet
    output does not rule out an earlier spike.
  params:
    arguments:
      type: cpu
      threads: 3
      interval: 500ms
    summary_chars: 4000

live_node_hot_threads: &live_node_hot_threads
  tool_id: mcp.elasticsearch.nodes_hot_threads
  target: child
  description: >-
    Live: focused stacks for the alert's node (exporter label name). Missing
    $name skips only this optional call.
  params:
    arguments:
      nodeId: $name
      type: cpu
      threads: 3
      interval: 500ms
    summary_chars: 4000

live_shards: &live_shards
  tool_id: mcp.elasticsearch.cat_shards
  target: child
  description: >-
    Live: shard state, primary/replica flag, node placement and store size. Do not
    treat a summarized prefix as the full inventory.
  params:
    arguments: {}
    summary_chars: 4000

live_cluster_settings: &live_cluster_settings
  tool_id: mcp.elasticsearch.cluster_get_settings
  target: child
  description: >-
    Live: allocation and disk-watermark settings with defaults. Precedence is
    transient, then persistent, then defaults. Missing fields are unknown.
  params:
    arguments:
      include_defaults: true
      flat_settings: false
    summary_chars: 4000
    fields:
      - transient.cluster.routing.allocation.disk.threshold_enabled
      - transient.cluster.routing.allocation.disk.watermark.low
      - transient.cluster.routing.allocation.disk.watermark.high
      - transient.cluster.routing.allocation.disk.watermark.flood_stage
      - transient.cluster.routing.allocation.enable
      - transient.cluster.routing.rebalance.enable
      - transient.cluster.routing.allocation.awareness
      - transient.cluster.routing.allocation.include
      - transient.cluster.routing.allocation.exclude
      - transient.cluster.routing.allocation.require
      - transient.cluster.routing.allocation.total_shards_per_node
      - persistent.cluster.routing.allocation.disk.threshold_enabled
      - persistent.cluster.routing.allocation.disk.watermark.low
      - persistent.cluster.routing.allocation.disk.watermark.high
      - persistent.cluster.routing.allocation.disk.watermark.flood_stage
      - persistent.cluster.routing.allocation.enable
      - persistent.cluster.routing.rebalance.enable
      - persistent.cluster.routing.allocation.awareness
      - persistent.cluster.routing.allocation.include
      - persistent.cluster.routing.allocation.exclude
      - persistent.cluster.routing.allocation.require
      - persistent.cluster.routing.allocation.total_shards_per_node
      - defaults.cluster.routing.allocation.disk.threshold_enabled
      - defaults.cluster.routing.allocation.disk.watermark.low
      - defaults.cluster.routing.allocation.disk.watermark.high
      - defaults.cluster.routing.allocation.disk.watermark.flood_stage
      - defaults.cluster.routing.allocation.enable
      - defaults.cluster.routing.rebalance.enable
      - defaults.cluster.routing.allocation.total_shards_per_node

# Explains ONE automatically selected unassigned shard and binds its index.
# With no unassigned shard the API returns an error; that is not an outage.
live_allocation_explain: &live_allocation_explain
  tool_id: mcp.elasticsearch.cluster_allocation_explain
  target: child
  description: >-
    Live: allocation decision for one automatically selected unassigned shard.
    Deciders are evidence for that shard only.
  params:
    arguments: {}
    summary_chars: 4000
    fields:
      - index=index
      - shard=shard
      - primary=primary
      - state=current_state
      - reason=unassigned_info.reason
      - since=unassigned_info.at
      - details=unassigned_info.details
      - can_allocate=can_allocate
      - explanation=allocate_explanation
      - node_names=node_allocation_decisions[*].node_name
      - node_decisions=node_allocation_decisions[*].node_decision
      - deciders=node_allocation_decisions[*].deciders[*].decider
      - decisions=node_allocation_decisions[*].deciders[*].decision
      - reasons=node_allocation_decisions[*].deciders[*].explanation
    bind:
      rtfUnassignedIndex:
        pick: index

live_allocation_index: &live_allocation_index
  tool_id: mcp.elasticsearch.get_index
  target: child
  description: >-
    Live: settings for the index bound by allocation explain. Inspect
    number_of_replicas, routing filters/tier preference, index.blocks and
    index.lifecycle. Settings omitted by the summary are unknown, not defaults.
  params:
    arguments:
      index: $rtfUnassignedIndex
    summary_chars: 4000

live_allocation_ilm: &live_allocation_ilm
  tool_id: mcp.elasticsearch.ilm_explain_lifecycle
  target: child
  description: >-
    Live: ILM phase/action/step and any step error for the index bound by
    allocation explain. managed=false is not an error.
  params:
    arguments:
      index: $rtfUnassignedIndex
      only_errors: false
      only_managed: false
    summary_chars: 4000

live_alert_index: &live_alert_index
  tool_id: mcp.elasticsearch.get_index
  target: child
  description: >-
    Live: settings, mappings and aliases of the alert's index label. Missing
    $index skips this optional call.
  params:
    arguments:
      index: $index
    summary_chars: 4000

live_alert_shards: &live_alert_shards
  tool_id: mcp.elasticsearch.cat_shards
  target: child
  description: >-
    Live: shard state and placement for the alert's index label. Missing $index
    skips this optional call.
  params:
    arguments:
      index: $index
    summary_chars: 4000

live_alert_ilm: &live_alert_ilm
  tool_id: mcp.elasticsearch.ilm_explain_lifecycle
  target: child
  description: >-
    Live: ILM state and step error for the alert's index label. Missing $index
    skips this optional call.
  params:
    arguments:
      index: $index
      only_errors: false
      only_managed: false
    summary_chars: 4000

common_alerts:
  - name: ElasticsearchMetricsCollectionFailed
    patterns:
      - ElasticsearchMetricsCollectionFailed
      - Elasticsearch metric collection is failing
    priority: P1
    diagnostic_steps:
      - step: 1
        title: Confirm the failing collector and the extent of lost visibility
        description: >-
          Use the incident's VictoriaMetrics tenant/project/environment and bind $instance from the raw
          alert's instance label. Confirm the returned series belong to the firing exporter and match
          the alert's cluster and object labels wherever those labels exist. Check collector status, signal
          sample age and sample counts before interpreting any value. Missing, stale, failed or truncated
          evidence is unknown, never zero. Evaluate the condition at the incident time as well as at the
          latest time; an instant true result alone does not prove the rule's for duration. Use the range
          of the signal to separate the original incident from present recovery. This P1 rule requires
          scrape_success == 0 for 2 minutes. Read the collector label to identify the failed collection
          family. Success from other collectors demonstrates only that those families are still reporting.
          If no success series exists for 5 minutes, report a missing collection stream; that is additional
          evidence, not a reproduction of the zero-valued alert. A visibility incident does not establish
          that Elasticsearch is down.
        tool_calls:
          - tool_id: tool.query_metrics
            description: >-
              Collector status, freshness and coverage for the alerting exporter.
            params:
              queries: *collection_quality_queries
          - tool_id: tool.query_metrics
            description: >-
              Reproduce the failure and measure its recent frequency.
            params:
              queries:
                - name: metrics_collection_failed_rule_condition
                  query: 'elasticsearch_scrape_success{instance="$instance"} == 0'
                - name: metrics_collection_failed_signal_sample_age_seconds
                  unit: s
                  query: 'time() - timestamp(elasticsearch_scrape_success{instance="$instance"})'
                - name: metrics_collection_failed_signal_samples_5m
                  query: 'count_over_time(elasticsearch_scrape_success{instance="$instance"}[5m])'
                - name: collector_success_changes_30m
                  query: 'changes(elasticsearch_scrape_success{instance="$instance"}[30m])'
                - name: collector_duration_seconds
                  unit: s
                  query: 'elasticsearch_scrape_duration_seconds{instance="$instance"}'
                - name: collector_duration_peak_15m_seconds
                  unit: s
                  query: 'max_over_time(elasticsearch_scrape_duration_seconds{instance="$instance"}[15m])'
      - step: 2
        title: Compare cluster-information retrieval with the remaining evidence streams
        description: >-
          clusterinfo_up and its retrieval timestamps describe cluster-information collection only; they
          are not application health probes and may update on a separate schedule. Ignore timestamp values
          of zero (no recorded event). An increasing retrieval-failure timestamp and overdue success support
          a broader exporter-to-ES collection problem. A single failed collector while health and node
          samples remain fresh supports a partial collection failure. Rising scrape duration before failures
          is consistent with slow collection or timeout, but cannot prove a timeout. All series stale
          means visibility is lost; it cannot distinguish VM ingestion, exporter, network or database
          failure.
        tool_calls:
          - tool_id: tool.query_metrics
            description: >-
              Cluster-information retrieval history and exporter identity.
            params:
              queries:
                - name: clusterinfo_up
                  query: 'elasticsearch_clusterinfo_up{instance="$instance"}'
                - name: clusterinfo_last_success_age_seconds
                  unit: s
                  query: >-
                    (time() - elasticsearch_clusterinfo_last_retrieval_success_ts{instance="$instance"})
                    and (elasticsearch_clusterinfo_last_retrieval_success_ts{instance="$instance"} > 0)
                - name: clusterinfo_last_failure_timestamp
                  unit: unix_seconds
                  query: 'elasticsearch_clusterinfo_last_retrieval_failure_ts{instance="$instance"}'
                - name: cluster_health_sample_age_seconds
                  unit: s
                  query: 'time() - timestamp(elasticsearch_cluster_health_status{instance="$instance"})'
                - name: node_uptime_sample_age_seconds
                  unit: s
                  query: 'time() - timestamp(elasticsearch_jvm_uptime_seconds{instance="$instance"})'
                - name: exporter_build_identity
                  query: 'elasticsearch_exporter_build_info{instance="$instance"}'
      - step: 3
        title: Describe the last observed database state without filling the collection gap
        description: >-
          Use only fresh successful collector outputs for current impact. Historical status and uptime
          establish the last observed state and must carry their timestamps. Even fresh green cluster
          health means shards are assigned; it is not proof that all client traffic succeeds. Separate
          the verified monitoring failure from any separately observed shard or node problem. VM cannot
          identify the exact TLS/authentication/HTTP/parse error. State which collector failed and request
          that error text from the monitoring owner as the missing evidence; no additional tool is executed
          by this runbook.
        tool_calls:
          - tool_id: tool.query_metrics
            description: >-
              Last observed cluster state and node activity in the incident window.
            params:
              queries:
                - name: collection_incident_cluster_status
                  query: 'elasticsearch_cluster_health_status{instance="$instance"}'
                - name: collection_incident_cluster_nodes
                  query: 'elasticsearch_cluster_health_number_of_nodes{instance="$instance"}'
                - name: collection_incident_node_uptime
                  unit: s
                  query: 'elasticsearch_jvm_uptime_seconds{instance="$instance"}'
                - name: collection_incident_index_rate
                  unit: operations/s
                  query: 'rate(elasticsearch_indices_indexing_index_total{instance="$instance"}[5m])'
      - step: 4
        title: Test live cluster access independently of the exporter
        description: >-
          Query the cluster directly through the MCP connection. A healthy live
          response alongside a failed collector points to the exporter path
          (endpoint, credentials, TLS, timeouts or a collector-specific API)
          rather than an Elasticsearch outage. If live calls also fail, keep their
          actual errors; the MCP connection may use a different network path and
          credentials, so a shared failure suggests but does not prove a cluster
          outage. Confirm cluster_name matches the alert before relying on it.
        tool_calls:
          - *live_health
          - *live_nodes_info
    remediation:
      - action: repair_the_confirmed_collection_fault
        description: >-
          Ask the monitoring owner to inspect the failed collector's exporter error and fix the named
          endpoint, CA trust, credential permission, API compatibility or timeout issue. Use the collected
          timestamps to narrow that investigation. Do not select an auth/network diagnosis or restart
          Elasticsearch solely from scrape_success == 0.
        tool_id: ''
        requires_approval: true
    escalation: >-
      P1 to the exporter/monitoring owner. Involve the Elasticsearch owner if independent fresh metrics
      show a database impact. If all collection is unavailable, report impact unknown and identify the
      alert families that are temporarily blind.
    follow_up:
      - >-
        Require the affected collector to report success continuously for at least 5 minutes with normal
        sample counts and fresh dependent metrics.
      - >-
        Re-evaluate the database alerts after telemetry returns. Add or verify the platform's independent
        missing-target monitoring; this rule does not detect an exporter that disappears without emitting
        zero.
  - name: ElasticsearchClusterRed
    patterns:
      - ElasticsearchClusterRed
      - Elasticsearch primary shards are unavailable
    priority: P0
    diagnostic_steps:
      - step: 1
        title: Confirm primary-shard unavailability at the incident time
        description: >-
          Use the incident's VictoriaMetrics tenant/project/environment and bind $instance from the raw
          alert's instance label. Confirm the returned series belong to the firing exporter and match
          the alert's cluster and object labels wherever those labels exist. Check collector status, signal
          sample age and sample counts before interpreting any value. Missing, stale, failed or truncated
          evidence is unknown, never zero. Evaluate the condition at the incident time as well as at the
          latest time; an instant true result alone does not prove the rule's for duration. Use the range
          of the signal to separate the original incident from present recovery. This P0 rule requires
          red == 1 for 1 minute. Red establishes at least one unavailable primary shard, not permanent
          data loss or failure of every index. Read the status alongside primary and total active shards.
          The unassigned count includes both primary and replica shards; never report it as the number
          of missing primaries.
        tool_calls:
          - tool_id: tool.query_metrics
            description: >-
              Check collection integrity before trusting cluster status.
            params:
              queries: *collection_quality_queries
          - tool_id: tool.query_metrics
            description: >-
              Reproduce the red condition with its sample coverage.
            params:
              queries:
                - name: cluster_red_rule_condition
                  query: 'elasticsearch_cluster_health_status{instance="$instance",color="red"} == 1'
                - name: cluster_red_signal_sample_age_seconds
                  unit: s
                  query: 'time() - timestamp(elasticsearch_cluster_health_status{instance="$instance",color="red"})'
                - name: cluster_red_signal_samples_5m
                  query: 'count_over_time(elasticsearch_cluster_health_status{instance="$instance",color="red"}[5m])'
          - tool_id: tool.query_metrics
            description: >-
              Quantify shard impact and whether initialization or relocation is changing.
            params:
              queries: *cluster_health_queries
      - step: 2
        title: Check whether loss of cluster membership preceded the red state
        description: >-
          Compare authoritative cluster node/data-node counts before and during the incident. Falling
          membership before red supports node departure as a contributor. Low uptime and counter resets
          when the node returns are consistent with a restart; they do not identify OOM, a deployment
          or its cause. A previously seen node missing only from node-stat results may be an exporter
          coverage change. Corroborate it with cluster membership and collector success. The 1h maximum
          is an observed high-water mark, not a configured desired count. Stable counts do not exclude
          replacement of one node by another.
        tool_calls:
          - tool_id: tool.query_metrics
            description: >-
              Membership history and per-node uptime evidence.
            params:
              queries: *cluster_membership_queries
      - step: 3
        title: Look for disk or JVM pressure that coincides with the loss of allocation
        description: >-
          Compare each node against its own pre-onset baseline and reporting peers. A fall in available
          disk followed by red supports capacity-related allocation pressure, but the fixed 85/95 percent
          alert thresholds are not measured cluster watermarks. Heap and GC pressure before a membership
          drop support a resource-pressure hypothesis; they do not prove an OOM or GC-driven eviction.
          If these remain normal with adequate coverage, mark those hypotheses less supported and leave
          the allocation reason unresolved.
        tool_calls:
          - tool_id: tool.query_metrics
            description: >-
              Disk capacity by node and data path.
            params:
              queries: *disk_capacity_queries
          - tool_id: tool.query_metrics
            description: >-
              Heap, GC and CPU evidence by node.
            params:
              queries: *node_memory_queries
      - step: 4
        title: Separate ongoing recovery from stalled recovery and state the evidence gap
        description: >-
          Look for unassigned shards falling, active primaries rising and membership recovering across
          successive samples. Initializing/relocating > 0 alone is activity, not proof of progress. Growing
          management wait may be delaying allocation. Node-level workload indicates observed internal
          operations and cannot establish success for unavailable shards. Metrics do not identify the
          exact unassigned primary, allocation decider, corruption or validity of a shard copy. Report
          those as unknown and escalate with the evidence timeline; never infer no_valid_shard_copy or
          recommend accepting data loss.
        tool_calls:
          - tool_id: tool.query_metrics
            description: >-
              Cluster-management backlog associated with recovery.
            params:
              queries: *cluster_task_queries
          - tool_id: tool.query_metrics
            description: >-
              Observed search and indexing activity during the incident.
            params:
              queries:
                - name: red_search_operations_per_second
                  unit: operations/s
                  query: 'rate(elasticsearch_indices_search_query_total{instance="$instance"}[5m])'
                - name: red_index_operations_per_second
                  unit: operations/s
                  query: 'rate(elasticsearch_indices_indexing_index_total{instance="$instance"}[5m])'
      - step: 5
        title: Identify the unassigned primary and why it cannot allocate
        description: >-
          Read current health and shard placement, then the allocation explanation
          for one automatically selected unassigned shard. Prefer evidence where
          primary=true; a replica selection explains YELLOW, not RED. Deciders such
          as disk_threshold, filter, same_shard or max_retry name the blocking rule;
          no_valid_shard_copy means no on-disk copy is available and needs the
          owner, not a forced allocation. Inspect the bound index's settings and
          ILM state for routing filters, tier preference and lifecycle errors.
          Allocation explain selects one shard only; other red indices may have
          different causes.
        tool_calls:
          - *live_health
          - *live_shards
          - *live_allocation_explain
          - *live_allocation_index
          - *live_allocation_ilm
          - *live_cluster_settings
    remediation:
      - action: restore_confirmed_missing_capacity
        description: >-
          If membership fell, ask the Elasticsearch/platform owner to recover the missing node or its
          capacity after checking the underlying host/storage fault. If disk pressure is evidenced, restore
          usable capacity. Exact allocation repair requires the owner's allocation evidence; the runbook
          does not choose forced allocation or destructive recovery.
        tool_id: ''
        requires_approval: true
    escalation: >-
      Immediate P0 escalation to the Elasticsearch and platform owners. Include cluster/instance labels,
      the red onset, active-primary/unassigned counts, membership changes and the best-supported contributing
      condition. Unassigned primary data is currently unavailable; whether it is recoverable is not determined
      by these metrics.
    follow_up:
      - >-
        Require fresh red == 0 with recovered primary availability for at least 10 minutes; if yellow
        remains, continue the replica investigation rather than declaring full recovery.
      - >-
        For complete cluster recovery require green and zero unassigned shards with stable membership.
        The application owner must separately verify writes/searches against affected data; these metrics
        cannot prove end-to-end recovery.
  - name: ElasticsearchClusterYellow
    patterns:
      - ElasticsearchClusterYellow
      - Elasticsearch replica shards remain unavailable
    priority: P2
    diagnostic_steps:
      - step: 1
        title: Confirm replica unavailability and reduced redundancy
        description: >-
          Use the incident's VictoriaMetrics tenant/project/environment and bind $instance from the raw
          alert's instance label. Confirm the returned series belong to the firing exporter and match
          the alert's cluster and object labels wherever those labels exist. Check collector status, signal
          sample age and sample counts before interpreting any value. Missing, stale, failed or truncated
          evidence is unknown, never zero. Evaluate the condition at the incident time as well as at the
          latest time; an instant true result alone does not prove the rule's for duration. Use the range
          of the signal to separate the original incident from present recovery. This P2 rule requires
          yellow == 1 for 10 minutes. Primaries are assigned but some replicas are unavailable. Quantify
          the unassigned count and how it changes; do not describe yellow as total database downtime.
          This enabled rule deliberately includes a single data node with replicas configured. A change
          to red is an escalation, not recovery from yellow.
        tool_calls:
          - tool_id: tool.query_metrics
            description: >-
              Check freshness and successful collection.
            params:
              queries: *collection_quality_queries
          - tool_id: tool.query_metrics
            description: >-
              Reproduce the yellow condition.
            params:
              queries:
                - name: cluster_yellow_rule_condition
                  query: 'elasticsearch_cluster_health_status{instance="$instance",color="yellow"} ==
                    1'
                - name: cluster_yellow_signal_sample_age_seconds
                  unit: s
                  query: 'time() - timestamp(elasticsearch_cluster_health_status{instance="$instance",color="yellow"})'
                - name: cluster_yellow_signal_samples_5m
                  query: 'count_over_time(elasticsearch_cluster_health_status{instance="$instance",color="yellow"}[5m])'
          - tool_id: tool.query_metrics
            description: >-
              Shard availability and recovery movement.
            params:
              queries: *cluster_health_queries
      - step: 2
        title: Distinguish a longstanding topology limit from recent lost capacity
        description: >-
          Compare the current data-node count with its pre-onset value and inspect observed per-index
          replica settings. One data node plus positive replicas makes complete replica placement impossible;
          this explains a topology constraint, but not necessarily every unassigned replica. Even with
          several data nodes, tiers, filters and awareness can limit eligible nodes. Settings gauges may
          lack cluster labels; correlate through the scoped exporter and their index labels, not a many-to-many
          join. Missing settings mean topology cannot be confirmed. Node-count loss or recent uptime changes
          support a recent capacity event. A configured number_of_replicas is per primary shard, not a
          count of cluster-wide replica shards.
        tool_calls:
          - tool_id: tool.query_metrics
            description: >-
              Membership change and observed node restarts.
            params:
              queries: *cluster_membership_queries
          - tool_id: tool.query_metrics
            description: >-
              Configured per-index shard and replica counts, preserving index labels.
            params:
              queries:
                - name: index_configured_replicas
                  query: 'elasticsearch_indices_settings_replicas{instance="$instance"}'
                - name: index_configured_primary_shards
                  query: 'elasticsearch_indices_settings_shards{instance="$instance"}'
      - step: 3
        title: Evaluate disk pressure and whether allocation is making progress
        description: >-
          If disk usage rose before yellow and free space is scarce across peers, record capacity pressure
          as a likely contributor. The actual allocation decision, tier eligibility and watermarks are
          unavailable. Falling unassigned counts across fresh samples support recovery; initializing or
          relocating counts alone do not. Delayed-unassigned shards and recent node loss support delayed
          reallocation. Increasing management wait supports a separate control-plane backlog. A persistent
          yellow state with no supporting cause requires the owner to supply allocation reasoning; leave
          the cause unconfirmed.
        tool_calls:
          - tool_id: tool.query_metrics
            description: >-
              Disk capacity and recent net changes.
            params:
              queries: *disk_capacity_queries
          - tool_id: tool.query_metrics
            description: >-
              Cluster-management delays that may impede allocation.
            params:
              queries: *cluster_task_queries
      - step: 4
        title: Explain the unassigned replica against live topology and settings
        description: >-
          Compare data-node count from live nodes_info with the bound index's
          number_of_replicas: replicas plus one must not exceed eligible data
          nodes. Read the allocation decision for one unassigned shard; same_shard
          on a single-node cluster is the expected single-node case. Check disk
          watermark, awareness and allocation filter settings for other deciders.
          delayed_unassigned shards may still allocate after node_left timeout.
        tool_calls:
          - *live_health
          - *live_nodes_info
          - *live_allocation_explain
          - *live_allocation_index
          - *live_allocation_ilm
          - *live_cluster_settings
    remediation:
      - action: restore_replica_capacity
        description: >-
          If a node was lost or disk capacity is insufficient, restore eligible capacity. If this is an
          intentional single-node environment, discuss the accepted redundancy design with its owner.
          Reducing replicas trades away protection and requires that decision; do not recommend it merely
          to clear the alert. Allocation-setting changes need the owner's evidence.
        tool_id: ''
        requires_approval: true
    escalation: >-
      P2 to the Elasticsearch owner while only replicas are unavailable. Escalate urgently if red appears,
      more data nodes leave, or an additional observed incident threatens the remaining copies.
    follow_up:
      - >-
        Require green, zero unassigned shards and stable membership on fresh samples for at least 10 minutes,
        or document the owner's explicitly accepted single-node redundancy design with a separately reviewed
        alert policy.
      - >-
        Record whether the issue was a new loss of capacity or a pre-existing placement constraint; do
        not label a longstanding yellow baseline a new outage.
  - name: ElasticsearchDiskSpaceLow
    patterns:
      - ElasticsearchDiskSpaceLow
      - Elasticsearch data disk space is running low
    priority: P2
    diagnostic_steps:
      - step: 1
        title: Confirm available capacity on the exact firing node and filesystem
        description: >-
          Use the incident's VictoriaMetrics tenant/project/environment and bind $instance from the raw
          alert's instance label. Confirm the returned series belong to the firing exporter and match
          the alert's cluster and object labels wherever those labels exist. Check collector status, signal
          sample age and sample counts before interpreting any value. Missing, stale, failed or truncated
          evidence is unknown, never zero. Evaluate the condition at the incident time as well as at the
          latest time; an instant true result alone does not prove the rule's for duration. Use the range
          of the signal to separate the original incident from present recovery. This rule requires used
          capacity above 85% and below 95% for 10 minutes. The percentage is 100 * (1 - available / size),
          not physical bytes used calculated from free space. Retain name, mount and path; two data paths
          may refer to one filesystem and must not be added. Nonpositive capacity is excluded. Inspect
          available bytes as well as percentage. At 95% the warning condition clears and critical waits
          for its own 2-minute hold; warning resolution at that transition is not recovery.
        tool_calls:
          - tool_id: tool.query_metrics
            description: >-
              Verify successful collection and fresh evidence.
            params:
              queries: *collection_quality_queries
          - tool_id: tool.query_metrics
            description: >-
              Reproduce the exact capacity rule and check denominator freshness.
            params:
              queries:
                - name: disk_space_low_rule_condition
                  query: >-
                    (1 - elasticsearch_filesystem_data_available_bytes{instance="$instance"} / elasticsearch_filesystem_data_size_bytes{instance="$instance"})
                    > 0.85

                    and

                    (1 - elasticsearch_filesystem_data_available_bytes{instance="$instance"} / elasticsearch_filesystem_data_size_bytes{instance="$instance"})
                    < 0.95

                    and

                    elasticsearch_filesystem_data_size_bytes{instance="$instance"} > 0
                - name: disk_space_low_signal_sample_age_seconds
                  unit: s
                  query: 'time() - timestamp(elasticsearch_filesystem_data_available_bytes{instance="$instance"})'
                - name: disk_space_low_signal_samples_5m
                  query: 'count_over_time(elasticsearch_filesystem_data_available_bytes{instance="$instance"}[5m])'
                - name: low_disk_capacity_sample_age_seconds
                  unit: s
                  query: 'time() - timestamp(elasticsearch_filesystem_data_size_bytes{instance="$instance"})'
          - tool_id: tool.query_metrics
            description: >-
              Capacity, available bytes and net change by node/path.
            params:
              queries: *disk_capacity_queries
      - step: 2
        title: Find whether index growth, shard movement or merge work coincided with the fill
        description: >-
          Compare the disk trend with candidate index and shard sizes, merge activity and translog bytes.
          Negative available_change_1h means less space available; a capacity change invalidates simple
          growth comparisons. Index store bytes include only the represented index storage, not all files
          on the mount, and the all-copies series already includes replicas. Net primary-store growth
          can reflect indexing, merges, deletion or changed collection coverage. Top-ten indices are candidates
          across this ES target, not necessarily located on the firing disk. Shard rows may carry a node
          identifier; do not equate that to name without a verified mapping. High device throughput alone
          cannot prove I/O saturation or latency, and large store size alone cannot prove unexpected growth.
        tool_calls:
          - tool_id: tool.query_metrics
            description: >-
              Largest represented indices/shards and observed read-only index count.
            params:
              queries: *index_storage_queries
          - tool_id: tool.query_metrics
            description: >-
              Disk activity, merge pressure and translog size.
            params:
              queries: *storage_activity_queries
      - step: 3
        title: Measure correlated impact and qualify the storage diagnosis
        description: >-
          Check shard health and recently failed indexing operations. Red/yellow beginning after free
          space falls is consistent with allocation pressure; indexing failures are compatible with write
          problems but do not identify a disk-related error. The supplied read_only_indices metric counts
          index.blocks.read_only in the exporter implementation; it does not reliably measure read_only_allow_delete
          flood-stage blocks. Zero does not exclude those blocks. The metric inventory does not establish
          the effective watermarks, headroom, disk I/O latency, inode exhaustion or storage error. Never
          state that 95% alone proves a flood-stage block. State whether capacity exhaustion is observed,
          growth is ongoing and other impact is supported, then list any exact cause still unknown.
        tool_calls:
          - tool_id: tool.query_metrics
            description: >-
              Shard health plus recent indexing failure evidence.
            params:
              queries:
                - name: low_disk_cluster_status
                  query: 'elasticsearch_cluster_health_status{instance="$instance"}'
                - name: low_disk_unassigned_shards
                  query: 'elasticsearch_cluster_health_unassigned_shards{instance="$instance"}'
                - name: low_disk_relocating_shards
                  query: 'elasticsearch_cluster_health_relocating_shards{instance="$instance"}'
                - name: low_disk_index_failures_10m
                  query: 'increase(elasticsearch_index_stats_indexing_index_failed_total{instance="$instance"}[10m])'
      - step: 4
        title: Compare live free space with the effective disk watermarks
        description: >-
          Read live free/total bytes for each data path and the effective
          watermarks (transient, then persistent, then defaults; values may be
          percentages or absolute bytes, and max_headroom can apply). Locate the
          largest shards on the alerting node from cat_shards. This shows whether
          low or high watermark is currently exceeded and which shards relocation
          would move; it does not identify growth rate, which comes from VM.
        tool_calls:
          - *live_disk_stats
          - *live_cluster_settings
          - *live_shards
    remediation:
      - action: restore_usable_disk_capacity
        description: >-
          Have the storage and Elasticsearch owners expand capacity or remove data only through the approved
          retention process after verifying which data occupies the affected filesystem. If growth is
          ongoing, agree on temporary producer backpressure and durable capacity/retention changes. Never
          delete Elasticsearch data files manually, run a force merge as an emergency space fix, or clear
          write blocks without resolving the capacity issue and checking the effective settings.
        tool_id: ''
        requires_approval: true
    escalation: >-
      P2 to the Elasticsearch and storage owners for capacity correction. Escalate if usage reaches the
      critical threshold, available bytes keep falling rapidly, or shard/write symptoms appear.
    follow_up:
      - >-
        A critical-to-warning transition is improvement, not full capacity recovery. Verify a sustained
        positive space margin below the configured operational target with the owner; these metrics do
        not supply that target.
      - >-
        For this fixed warning/critical pair, require fresh usage at or below 85% for at least 10 minutes
        to clear both conditions, or document an explicitly approved alternative capacity target. Confirm
        available bytes remain stable or improving and associated shard/write symptoms have recovered.
  - name: ElasticsearchDiskSpaceCritical
    patterns:
