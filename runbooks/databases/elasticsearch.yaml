                  query: 'elasticsearch_cluster_health_status{instance="$instance"}'
                - name: critical_disk_unassigned_shards
                  query: 'elasticsearch_cluster_health_unassigned_shards{instance="$instance"}'
                - name: critical_disk_relocating_shards
                  query: 'elasticsearch_cluster_health_relocating_shards{instance="$instance"}'
                - name: critical_disk_index_failures_10m
                  query: 'increase(elasticsearch_index_stats_indexing_index_failed_total{instance="$instance"}[10m])'
      - step: 4
        title: Check live free space, flood-stage watermark and allocation impact
        description: >-
          Compare live free bytes on the alerting path with the effective
          flood_stage watermark. Above flood stage Elasticsearch sets
          index.blocks.read_only_allow_delete on indices with shards on that node.
          Check cluster health and shard placement for relocation or unassigned
          shards caused by disk deciders. Do not remove read-only blocks or delete
          indices automatically.
        tool_calls:
          - *live_disk_stats
          - *live_cluster_settings
          - *live_health
