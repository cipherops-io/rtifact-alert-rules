  - name: ElasticsearchJVMHeapHigh
    patterns:
      - ElasticsearchJVMHeapHigh
      - Elasticsearch JVM heap usage remains high
    priority: P2
    diagnostic_steps:
      - step: 1
        title: Confirm sustained heap pressure on the firing node
        description: >-
          Use the incident's VictoriaMetrics tenant/project/environment and bind $instance from the raw
          alert's instance label. Confirm the returned series belong to the firing exporter and match
          the alert's cluster and object labels wherever those labels exist. Check collector status, signal
          sample age and sample counts before interpreting any value. Missing, stale, failed or truncated
          evidence is unknown, never zero. Evaluate the condition at the incident time as well as at the
          latest time; an instant true result alone does not prove the rule's for duration. Use the range
          of the signal to separate the original incident from present recovery. This P2 rule requires
          heap used / max > 85% for 10 minutes with a positive maximum. It is total heap usage, not only
          old-generation usage. Select the alert's name series and compare peers. Do not average all nodes
          together: that can hide one saturated node. A short post-GC dip or a node restart can clear
          the signal without fixing the workload.
        tool_calls:
          - tool_id: tool.query_metrics
            description: >-
              Check freshness and collection coverage.
            params:
              queries: *collection_quality_queries
          - tool_id: tool.query_metrics
            description: >-
              Reproduce the heap rule and verify the configured maximum is fresh.
            params:
              queries:
                - name: j_v_m_heap_high_rule_condition
                  query: >-
                    elasticsearch_jvm_memory_used_bytes{instance="$instance",area="heap"} / elasticsearch_jvm_memory_max_bytes{instance="$instance",area="heap"}
                    > 0.85

                    and

                    elasticsearch_jvm_memory_max_bytes{instance="$instance",area="heap"} > 0
                - name: j_v_m_heap_high_signal_sample_age_seconds
                  unit: s
                  query: 'time() - timestamp(elasticsearch_jvm_memory_used_bytes{instance="$instance",area="heap"})'
                - name: j_v_m_heap_high_signal_samples_5m
                  query: 'count_over_time(elasticsearch_jvm_memory_used_bytes{instance="$instance",area="heap"}[5m])'
                - name: heap_max_sample_age_seconds
                  unit: s
                  query: 'time() - timestamp(elasticsearch_jvm_memory_max_bytes{instance="$instance",area="heap"})'
                - name: heap_max_changes_1h
                  query: 'changes(elasticsearch_jvm_memory_max_bytes{instance="$instance",area="heap"}[1h])'
          - tool_id: tool.query_metrics
            description: >-
              Heap bytes/percent, GC behavior and CPU by node.
            params:
              queries: *node_memory_queries
      - step: 2
        title: Separate retained memory pressure from transient activity
        description: >-
          Inspect the heap sawtooth over time and the old pool where it is exported with a positive maximum.
          A persistently high trough after GC supports retained memory pressure. GC collections without
          meaningful heap relief strengthen that hypothesis but cannot prove a leak. GC time/count gives
          mean reported collection duration, not a maximum pause. Fielddata, caches and segment memory
          can explain observed contributors, but are not mutually exclusive or a complete heap accounting.
          Never sum them and claim an exact heap breakdown. Use reported shard counts as layout context,
          preserving their returned node identifiers; correlate to name only with a verified mapping.
          Counts alone do not prove too many shards or an exact heap cost per shard. Missing/unsupported
          pool maxima mean that ratio is unavailable.
        tool_calls:
          - tool_id: tool.query_metrics
            description: >-
              Memory contributors and old-generation pressure.
            params:
              queries:
                - name: old_pool_used_pct
                  unit: '%'
                  query: >-
                    (100 * (elasticsearch_jvm_memory_pool_used_bytes{instance="$instance",pool="old"}
                    / elasticsearch_jvm_memory_pool_max_bytes{instance="$instance",pool="old"})) and (elasticsearch_jvm_memory_pool_max_bytes{instance="$instance",pool="old"}
                    > 0)
                - name: node_fielddata_bytes
                  unit: B
                  query: 'elasticsearch_indices_fielddata_memory_size_bytes{instance="$instance"}'
                - name: node_query_cache_bytes
                  unit: B
                  query: 'elasticsearch_indices_query_cache_memory_size_bytes{instance="$instance"}'
                - name: node_request_cache_bytes
                  unit: B
                  query: 'elasticsearch_indices_request_cache_memory_size_bytes{instance="$instance"}'
                - name: node_segment_memory_bytes
                  unit: B
                  query: 'elasticsearch_indices_segments_memory_bytes{instance="$instance"}'
                - name: node_segment_count
                  query: 'elasticsearch_indices_segments_count{instance="$instance"}'
                - name: reported_node_shard_count
                  query: 'elasticsearch_node_shards_total{instance="$instance"}'
                - name: heap_incident_node_uptime_seconds
                  unit: s
                  query: 'elasticsearch_jvm_uptime_seconds{instance="$instance"}'
      - step: 3
        title: Check workload changes and memory-protection consequences
        description: >-
          Compare search and indexing rates against the incident's pre-onset range. Increased traffic,
          longer internal operation time and pressure concentrated on one node support workload pressure
          or imbalance; operation rates alone cannot identify query cost or bulk size. Rising fielddata
          with fielddata breaker trips is stronger evidence for that specific memory category. A parent
          breaker is not an additional memory bucket to add to child breakers. Low current breaker estimates
          after a trip do not invalidate the earlier event. Report whether pressure persists under comparable
          workload and identify request text, allocation profiles or heap dump details as unavailable.
        tool_calls:
          - tool_id: tool.query_metrics
            description: >-
              Workload trend and mean internal operation times.
            params:
              queries: *node_workload_queries
          - tool_id: tool.query_metrics
            description: >-
              Named circuit breaker activity and current estimates.
            params:
              queries: *breaker_queries
      - step: 4
        title: Read live heap pools, breakers, caches and hot threads
        description: >-
          Compare live heap_used_percent with the VM ratio to confirm the
          connection reaches the same nodes. The old-generation pool's usage that
          stays high after collections indicates retained data; fielddata, query
          cache and segment memory in indices stats show common holders. Breaker
          estimates near their limits show which request type is consuming heap.
          Hot threads on the alerting node can reveal expensive aggregations or
          GC activity. All readings are a single point in time.
        tool_calls:
          - *live_jvm_stats
          - *live_breaker_stats
          - *live_index_stats
          - *live_node_hot_threads
    remediation:
      - action: reduce_confirmed_memory_demand
        description: >-
          With the owning application team, reduce concurrency or batch size when the evidence supports
          load-driven pressure; review expensive aggregations or fielddata use when those contributors
          are observed. Plan shard/workload balancing or capacity changes only after checking the actual
          topology. Heap sizing requires the node/container memory budget, which this runbook does not
          establish; do not prescribe a heap increase or blind restart from the percentage alone.
        tool_id: ''
        requires_approval: true
    escalation: >-
      P2 to the Elasticsearch owner and the team generating the correlated workload. Escalate when breaker/rejection
      activity persists, membership becomes unstable, or primary-shard availability degrades. Identify
      OOM or a memory leak as unconfirmed unless separate owner evidence establishes it.
    follow_up:
      - >-
        Require heap at or below 85% on fresh samples for at least 15 minutes under representative traffic,
        with repeatable post-GC relief and no rising breaker or rejection counters. A traffic pause or
        restart alone is not a durable fix.
      - >-
        Record the heap byte budget and observed contributor/workload changes so the owner can distinguish
        a capacity issue from a request or shard-layout issue.
  - name: ElasticsearchCircuitBreakerTripped
    patterns:
      - ElasticsearchCircuitBreakerTripped
      - Elasticsearch is repeatedly rejecting operations to protect memory
    priority: P2
    diagnostic_steps:
      - step: 1
        title: Confirm recent trips for the named breaker
        description: >-
          Use the incident's VictoriaMetrics tenant/project/environment and bind $instance from the raw
          alert's instance label. Confirm the returned series belong to the firing exporter and match
          the alert's cluster and object labels wherever those labels exist. Check collector status, signal
          sample age and sample counts before interpreting any value. Missing, stale, failed or truncated
          evidence is unknown, never zero. Evaluate the condition at the incident time as well as at the
          latest time; an instant true result alone does not prove the rule's for duration. Use the range
          of the signal to separate the original incident from present recovery. This P2 rule requires
          increase(tripped[10m]) >= 3 to hold for 5 minutes. That is a rolling-window condition; it does
          not mean three new trips every five minutes. Retain breaker and node name. Read the recent increase,
          raw counter and resets together: a cumulative nonzero total is historical, while a positive
          fresh increase supports recent rejection. A counter first appearing after a scrape gap does
          not reveal when its previously accumulated events happened.
        tool_calls:
          - tool_id: tool.query_metrics
            description: >-
              Collection integrity and sample coverage.
            params:
              queries: *collection_quality_queries
          - tool_id: tool.query_metrics
            description: >-
              Exact trip condition plus recent/reset evidence.
            params:
              queries:
                - name: circuit_breaker_tripped_rule_condition
                  query: 'increase(elasticsearch_breakers_tripped{instance="$instance"}[10m]) >= 3'
                - name: circuit_breaker_tripped_signal_sample_age_seconds
                  unit: s
                  query: 'time() - timestamp(elasticsearch_breakers_tripped{instance="$instance"})'
                - name: circuit_breaker_tripped_signal_samples_5m
                  query: 'count_over_time(elasticsearch_breakers_tripped{instance="$instance"}[5m])'
                - name: breaker_trips_5m
                  query: 'increase(elasticsearch_breakers_tripped{instance="$instance"}[5m])'
                - name: breaker_trips_cumulative
                  query: 'elasticsearch_breakers_tripped{instance="$instance"}'
                - name: breaker_counter_resets_30m
                  query: 'resets(elasticsearch_breakers_tripped{instance="$instance"}[30m])'
          - tool_id: tool.query_metrics
            description: >-
              Current estimates, configured limits and overhead by breaker.
            params:
              queries: *breaker_queries
      - step: 2
        title: Determine whether broad heap pressure or a specific memory category is implicated
        description: >-
          A parent trip with sustained heap/GC pressure supports broad memory pressure. A request, fielddata
          or in-flight-request breaker can trip from the size/concurrency of individual work even when
          a later heap snapshot is normal. Use the returned breaker name, not a guessed mapping. The estimate/limit
          percentage is a comparison of exported gauges; overhead and version-specific accounting matter,
          and it is not a guaranteed prediction of the next trip. Parent and child estimates overlap.
          A breaker protecting memory is observed; its precise rejected request is not.
        tool_calls:
          - tool_id: tool.query_metrics
            description: >-
              Heap/GC/CPU pressure on the same node and reporting peers.
            params:
              queries: *node_memory_queries
          - tool_id: tool.query_metrics
            description: >-
              Fielddata and indexing-memory context.
            params:
              queries:
                - name: breaker_node_fielddata_bytes
                  unit: B
                  query: 'elasticsearch_indices_fielddata_memory_size_bytes{instance="$instance"}'
                - name: breaker_fielddata_evictions_10m
                  query: 'increase(elasticsearch_indices_fielddata_evictions{instance="$instance"}[10m])'
                - name: indexing_pressure_current_bytes
                  unit: B
                  query: 'elasticsearch_indexing_pressure_current_all_in_bytes{instance="$instance"}'
                - name: indexing_pressure_limit_bytes
                  unit: B
                  query: 'elasticsearch_indexing_pressure_limit_in_bytes{instance="$instance"}'
      - step: 3
        title: Compare workload before and after the trips and qualify client impact
        description: >-
          Look for an increase in search/index work before trips and whether trips stopped when demand
          reduced. Aggregate operation rates do not reveal bulk request size, query clauses or client
          identity; low rate does not exclude a few expensive operations. Trips establish rejected protected
          operations, not a count of unique failed HTTP requests or unrecovered documents. If gauges and
          workload provide no clear explanation, report the named breaker and quantified rejection as
          confirmed with request-level cause unknown.
        tool_calls:
          - tool_id: tool.query_metrics
            description: >-
              Operation rates, comparison windows and mean operation time.
            params:
              queries: *node_workload_queries
      - step: 4
        title: Read live breaker usage, heap and cache holders
        description: >-
          Find the alert's breaker on the alerting node: compare estimated size
          with limit and the cumulative tripped count. A parent breaker near its
          limit reflects overall heap; fielddata or request breakers point to
          aggregations or large requests. Compare fielddata/segment memory from
          indices stats. Trips are cumulative since node start, so use the VM
          10-minute increase for the alert window. Do not raise breaker limits
          from this evidence alone.
        tool_calls:
          - *live_breaker_stats
          - *live_jvm_stats
          - *live_index_stats
    remediation:
      - action: reduce_the_implicated_request_memory
        description: >-
          Ask the application owner to reduce concurrency, bulk size or aggregation demand according to
          the observed breaker category and obtain the rejected request details. For sustained general
          heap pressure, follow the JVM investigation. Do not raise breaker limits or clear caches indiscriminately
          as the default fix; those changes can worsen memory risk or merely hide the symptom.
        tool_id: ''
        requires_approval: true
    escalation: >-
      P2 to the Elasticsearch and application owners. Escalate if trips continue under normal load, coincide
      with unstable nodes or prevent essential writes/searches. The exact exception/request must come
      from owner-provided evidence, not this metric set.
    follow_up:
      - >-
        Require zero new trips over at least a full 10-minute window with continuous successful collection
        and representative traffic. Verify stable heap and a usable margin in the implicated category.
      - >-
        A resolved rolling-window alert can mean events aged out. Confirm counters stopped increasing
        and ask the producer whether rejected operations recovered.
  - name: ElasticsearchThreadPoolRejections
    patterns:
      - ElasticsearchThreadPoolRejections
      - Elasticsearch search or write tasks are being rejected
    priority: P2
    diagnostic_steps:
      - step: 1
        title: Reproduce both the rejection ratio and minimum-volume gate
        description: >-
          Use the incident's VictoriaMetrics tenant/project/environment and bind $instance from the raw
          alert's instance label. Confirm the returned series belong to the firing exporter and match
          the alert's cluster and object labels wherever those labels exist. Check collector status, signal
          sample age and sample counts before interpreting any value. Missing, stale, failed or truncated
          evidence is unknown, never zero. Evaluate the condition at the incident time as well as at the
          latest time; an instant true result alone does not prove the rule's for duration. Use the range
          of the signal to separate the original incident from present recovery. This P2 rule uses a 5-minute
          rejected/(rejected+completed) task-rate ratio > 5%, with at least 100 completed+rejected tasks
          in that rolling window, and holds for 5 minutes. Preserve type and node name. It measures thread-pool
          tasks, not distinct HTTP requests. Some requests create work on several shards. A ratio returning
          no series can reflect zero traffic or missing inputs; use the raw rate and collection evidence
          to distinguish them. Falling below the volume gate does not prove overload has been fixed.
        tool_calls:
          - tool_id: tool.query_metrics
            description: >-
              Collection and freshness checks.
            params:
              queries: *collection_quality_queries
          - tool_id: tool.query_metrics
            description: >-
              Exact rule including supported pool names and the volume gate.
            params:
              queries:
                - name: thread_pool_rejections_rule_condition
                  query: >-
                    (
                      rate(elasticsearch_thread_pool_rejected_count{instance="$instance",type=~"search|search_coordination|search_throttled|write|write_coordination|bulk|index"}[5m])
                      /
                      (
                        rate(elasticsearch_thread_pool_rejected_count{instance="$instance",type=~"search|search_coordination|search_throttled|write|write_coordination|bulk|index"}[5m])
                        + rate(elasticsearch_thread_pool_completed_count{instance="$instance",type=~"search|search_coordination|search_throttled|write|write_coordination|bulk|index"}[5m])
                      )
                    ) > 0.05

                    and

                    (
                      increase(elasticsearch_thread_pool_rejected_count{instance="$instance",type=~"search|search_coordination|search_throttled|write|write_coordination|bulk|index"}[5m])
                      + increase(elasticsearch_thread_pool_completed_count{instance="$instance",type=~"search|search_coordination|search_throttled|write|write_coordination|bulk|index"}[5m])
                    ) >= 100
                - name: thread_pool_rejections_signal_sample_age_seconds
                  unit: s
                  query: >-
                    time() - timestamp(elasticsearch_thread_pool_rejected_count{instance="$instance",type=~"search|search_coordination|search_throttled|write|write_coordination|bulk|index"})
                - name: thread_pool_rejections_signal_samples_5m
                  query: >-
                    count_over_time(elasticsearch_thread_pool_rejected_count{instance="$instance",type=~"search|search_coordination|search_throttled|write|write_coordination|bulk|index"}[5m])
                - name: pool_rejection_counter_resets_30m
                  query: >-
                    resets(elasticsearch_thread_pool_rejected_count{instance="$instance",type=~"search|search_coordination|search_throttled|write|write_coordination|bulk|index"}[30m])
                - name: pool_completed_sample_age_seconds
                  unit: s
                  query: >-
                    time() - timestamp(elasticsearch_thread_pool_completed_count{instance="$instance",type=~"search|search_coordination|search_throttled|write|write_coordination|bulk|index"})
          - tool_id: tool.query_metrics
            description: >-
              Task rates, activity, queue depth and current thread count.
            params:
              queries: *thread_pool_queries
      - step: 2
        title: Distinguish increased demand from reduced processing capacity
        description: >-
          Compare the firing pool with its own pre-onset rate and peer nodes. Rising queue/rejections
          with higher operation rates supports increased demand. Similar demand but rising internal operation
          time with heap/GC or CPU pressure supports reduced service capacity. The current threads count
          is not the configured maximum and queue_count is not queue capacity, so do not invent an occupancy
          percentage. A zero sampled queue can miss bursts between scrapes. Search/write pool activity
          can be imbalanced across nodes, but proving a particular hot shard requires a valid node-to-shard
          mapping.
        tool_calls:
          - tool_id: tool.query_metrics
            description: >-
              CPU, heap and GC conditions that may reduce processing capacity.
            params:
              queries: *node_memory_queries
          - tool_id: tool.query_metrics
            description: >-
              Workload change and mean internal operation duration.
            params:
              queries: *node_workload_queries
      - step: 3
        title: Check storage and merge activity before attributing the bottleneck
        description: >-
          For write-related pools, correlate merge work, throttled time and disk activity with the onset
          of queue growth. For search pools, use the same data only when timing and workload make it relevant.
          Throughput is not disk utilization or latency; VM cannot prove a slow volume from these counters
          alone. Conclude either evidenced demand growth, a supported resource bottleneck hypothesis,
          or unconfirmed capacity loss. Exact slow requests, clients and hot-thread stacks are not in
          the supplied metrics.
        tool_calls:
          - tool_id: tool.query_metrics
            description: >-
              Storage and merge activity supporting the bottleneck assessment.
            params:
              queries: *storage_activity_queries
      - step: 4
        title: Read live queues, indexing pressure, CPU and hot threads
        description: >-
          For the alert's pool type, compare live queue size and active threads
          with the pool's configured size; a full queue with all threads active
          confirms saturation. indexing_pressure rejections point to bulk write
          memory limits rather than thread-pool queues. Compare CPU and cgroup
          throttling, then hot threads on the alerting node and cluster-wide to
          find the busy operation. Rejection counters are cumulative.
        tool_calls:
          - *live_pool_stats
          - *live_cpu_stats
          - *live_node_hot_threads
          - *live_hot_threads
    remediation:
      - action: reduce_overload_at_its_source
        description: >-
          Coordinate bounded concurrency, smaller write batches when appropriate, and backoff with the
          affected workload owner. Correct the evidenced CPU/memory/storage constraint or traffic imbalance
          after owner verification. Do not treat a larger thread-pool queue as a capacity fix; it can
          increase waiting and memory use without improving throughput.
        tool_id: ''
        requires_approval: true
    escalation: >-
      P2 to the Elasticsearch owner and the application owner for the implicated search or write pool.
      Raise urgency for sustained essential-work rejection or associated cluster/node availability problems;
      do not infer an exact client error rate from the pool-task ratio.
    follow_up:
      - >-
        Verify rejection ratio at or below 5% for at least 10 minutes under comparable workload, queue
        drainage and stable completed throughput. Prefer zero new rejections. A quiet workload or volume
        below 100 tasks is insufficient alone.
      - >-
        Ask the workload owner to confirm retry recovery and end-user latency, which these node-level
        operation metrics do not measure.
  - name: ElasticsearchIndexingFailures
    patterns:
      - ElasticsearchIndexingFailures
      - Elasticsearch is recording indexing failures
    priority: P2
    diagnostic_steps:
      - step: 1
        title: Identify affected index series and establish whether failures are still occurring
        description: >-
          Use the incident's VictoriaMetrics tenant/project/environment and bind $instance from the raw
          alert's instance label. Confirm the returned series belong to the firing exporter and match
          the alert's cluster and object labels wherever those labels exist. Check collector status, signal
          sample age and sample counts before interpreting any value. Missing, stale, failed or truncated
          evidence is unknown, never zero. Evaluate the condition at the incident time as well as at the
          latest time; an instant true result alone does not prove the rule's for duration. Use the range
          of the signal to separate the original incident from present recovery. This P2 rule requires
          increase(index_failed_total[10m]) >= 5 to hold for 5 minutes. Select the firing index among
          the returned series. The index-level total covers the exporter's represented shard copies; it
          is not a deduplicated count of client requests or permanently lost documents. Raw totals are
          lifetime evidence only. Index deletion/recreation, shard movement, resets and collection gaps
          can change counter continuity. Record resets and creation time; do not interpret a new or missing
          series as success.
        tool_calls:
          - tool_id: tool.query_metrics
            description: >-
              Verify collection quality before judging failure counts.
            params:
              queries: *collection_quality_queries
          - tool_id: tool.query_metrics
            description: >-
              Exact failure rule and event continuity.
            params:
              queries:
                - name: indexing_failures_rule_condition
                  query: 'increase(elasticsearch_index_stats_indexing_index_failed_total{instance="$instance"}[10m])
                    >= 5'
                - name: indexing_failures_signal_sample_age_seconds
                  unit: s
                  query: 'time() - timestamp(elasticsearch_index_stats_indexing_index_failed_total{instance="$instance"})'
                - name: indexing_failures_signal_samples_5m
                  query: 'count_over_time(elasticsearch_index_stats_indexing_index_failed_total{instance="$instance"}[5m])'
                - name: index_failed_operations_10m
                  query: 'increase(elasticsearch_index_stats_indexing_index_failed_total{instance="$instance"}[10m])'
                  panel: true
                  panel_title: Failed Index Operations in 10m
                  panel_id: es-index-failed-operations-10m
                - name: index_failed_operations_5m
                  query: 'increase(elasticsearch_index_stats_indexing_index_failed_total{instance="$instance"}[5m])'
                - name: index_failed_operations_cumulative
                  query: 'elasticsearch_index_stats_indexing_index_failed_total{instance="$instance"}'
                - name: index_failure_counter_resets_30m
                  query: 'resets(elasticsearch_index_stats_indexing_index_failed_total{instance="$instance"}[30m])'
                - name: index_creation_timestamp_seconds
                  unit: unix_seconds
                  query: 'elasticsearch_indices_settings_creation_timestamp_seconds{instance="$instance"}'
      - step: 2
        title: Compare the failing indices with their workload and successful collection
        description: >-
          Report which indices show fresh increases and whether the issue is isolated or widespread within
          this target. Compare per-index indexing operation rates and mean duration with the preceding
          window. No new failures while traffic is zero means idle, not verified recovery. Avoid constructing
          a failure percentage from index_total: the supplied inventory does not establish a consistent
          attempted-request denominator or coverage of all failure paths. Document counts include internal
          Lucene semantics and do not validate every expected application document. A rate increase is
          supporting evidence for load, not proof of a specific document error.
        tool_calls:
          - tool_id: tool.query_metrics
            description: >-
              Index-specific workload and operation-time evidence, retaining all index labels.
            params:
              queries:
                - name: index_operation_rate
                  unit: operations/s
                  query: 'rate(elasticsearch_index_stats_indexing_index_total{instance="$instance"}[5m])'
                - name: index_operation_rate_30m_earlier
                  unit: operations/s
                  query: 'rate(elasticsearch_index_stats_indexing_index_total{instance="$instance"}[5m]
                    offset 30m)'
                - name: index_mean_operation_seconds
                  unit: s/operation
                  query: >-
                    (rate(elasticsearch_index_stats_indexing_index_time_seconds_total{instance="$instance"}[5m])
                    / rate(elasticsearch_index_stats_indexing_index_total{instance="$instance"}[5m]))
                    and (rate(elasticsearch_index_stats_indexing_index_total{instance="$instance"}[5m])
                    > 0)
                - name: index_operations_in_progress
                  query: 'elasticsearch_index_stats_index_current{instance="$instance"}'
                - name: index_current_stats_sample_age_seconds
                  unit: s
                  query: 'time() - timestamp(elasticsearch_index_stats_indexing_index_total{instance="$instance"})'
      - step: 3
        title: Look for corroborating availability or resource symptoms
        description: >-
          Correlate failure onset with red/yellow status, low disk capacity, breaker trips and write-pool
          rejection. These indicate concurrent conditions and do not establish which path incremented
          this counter. Some requests can fail before reaching the indexed operation accounting. Node-level
          signals cannot be assigned to the failing index without a valid mapping. A healthy cluster with
          normal pressure leaves mapping/validation/conflict or other request errors as possibilities,
          not diagnoses. The read-only count does not prove or exclude flood-stage read_only_allow_delete
          blocks.
        tool_calls:
          - tool_id: tool.query_metrics
            description: >-
              Availability and capacity evidence for the same exporter target.
            params:
              queries:
                - name: index_failure_cluster_status
                  query: 'elasticsearch_cluster_health_status{instance="$instance"}'
                - name: index_failure_data_disk_used_pct
                  unit: '%'
                  query: >-
                    (100 * (1 - elasticsearch_filesystem_data_available_bytes{instance="$instance"} /
                    elasticsearch_filesystem_data_size_bytes{instance="$instance"})) and (elasticsearch_filesystem_data_size_bytes{instance="$instance"}
                    > 0)
                - name: index_failure_heap_used_pct
                  unit: '%'
                  query: >-
                    (100 * (elasticsearch_jvm_memory_used_bytes{instance="$instance",area="heap"} / elasticsearch_jvm_memory_max_bytes{instance="$instance",area="heap"}))
                    and (elasticsearch_jvm_memory_max_bytes{instance="$instance",area="heap"} > 0)
                - name: index_failure_breaker_trips_10m
                  query: 'increase(elasticsearch_breakers_tripped{instance="$instance"}[10m])'
                - name: index_failure_write_rejections_10m
                  query: 'increase(elasticsearch_thread_pool_rejected_count{instance="$instance",type=~"write|write_coordination|bulk|index"}[10m])'
                - name: index_failure_reported_read_only_indices
                  query: 'elasticsearch_indices_settings_stats_read_only_indices{instance="$instance"}'
      - step: 4
        title: State what is confirmed and whether data recovery can be established
        description: >-
          Conclude with failure count/window, affected index labels, workload level, correlated pressure
          and confidence. The metric does not contain per-item bulk errors, failed payloads or retry/dead-letter
          outcomes. A zero subsequent increase cannot prove failed documents were recovered. If no error
          reason is available, explicitly state indexing failures confirmed; exact cause and permanent
          data loss unconfirmed. Ask the producer/Elasticsearch owner for the corresponding item error
          and recovery status; no log or live API call is made by this runbook.
        tool_calls:
          - tool_id: tool.query_metrics
            description: >-
              Check recent failure activity and concurrent represented indexing work.
            params:
              queries:
                - name: index_recovery_failures_10m
                  query: 'increase(elasticsearch_index_stats_indexing_index_failed_total{instance="$instance"}[10m])'
                - name: index_recovery_operations_10m
                  query: 'increase(elasticsearch_index_stats_indexing_index_total{instance="$instance"}[10m])'
      - step: 5
        title: Inspect the alert index's live settings, shards and lifecycle
        description: >-
          Read the alert index's settings and mappings for index.blocks (write or
          read_only_allow_delete), strict dynamic mapping or field limits, and its
          lifecycle state for rollover or step errors. Check its shards are
          STARTED and cluster health is not red. Write pool and indexing-pressure
          rejections show capacity-related failures. None of these show the
          per-document error; the producer's bulk responses remain the source of
          the exact reason.
        tool_calls:
          - *live_alert_index
          - *live_alert_shards
          - *live_alert_ilm
          - *live_health
          - *live_pool_stats
    remediation:
      - action: repair_the_verified_error_and_recover_failed_items
        description: >-
          Use the producer's actual per-item error to choose document/mapping correction or the appropriate
          availability/capacity fix. Retry transient failures with bounded backoff; replay or correct
          items only under the application's idempotency and recovery policy. Do not change mappings,
          delete indices or assert data loss based solely on this counter. Resource remediation is justified
          only when its relationship is verified.
        tool_id: ''
        requires_approval: true
    escalation: >-
      P2 to the indexing producer and Elasticsearch owners. Escalate if critical ingestion is blocked
      or primary availability fails. Include exact index labels, time windows, sample/reset caveats and
      the missing item-error/retry evidence.
    follow_up:
      - >-
        Require no new failures for at least 10 minutes with continuous collection and representative
        indexing traffic. Keep idle and recovered as distinct states.
      - >-
        Obtain producer confirmation of retry/dead-letter recovery and document reconciliation before
        claiming that no data gaps remain.
  - name: ElasticsearchClusterTasksDelayed
    patterns:
      - ElasticsearchClusterTasksDelayed
      - Elasticsearch cluster management tasks are waiting too long
    priority: P2
    diagnostic_steps:
      - step: 1
        title: Confirm cluster-management queue delay and its duration
        description: >-
          Use the incident's VictoriaMetrics tenant/project/environment and bind $instance from the raw
          alert's instance label. Confirm the returned series belong to the firing exporter and match
          the alert's cluster and object labels wherever those labels exist. Check collector status, signal
          sample age and sample counts before interpreting any value. Missing, stale, failed or truncated
          evidence is unknown, never zero. Evaluate the condition at the incident time as well as at the
          latest time; an instant true result alone does not prove the rule's for duration. Use the range
          of the signal to separate the original incident from present recovery. This P2 rule requires
          the longest pending cluster-task wait to exceed 60 seconds for 5 minutes. The exported value
          is milliseconds and is divided by 1000. It measures waiting in the cluster management queue,
          not execution time, search latency or the search/write thread-pool queue. Compare both pending-task
          count and oldest wait: even one blocked task can matter. A falling maximum can mean the oldest
          task left while others remain.
        tool_calls:
          - tool_id: tool.query_metrics
            description: >-
              Collection freshness and sample coverage.
            params:
              queries: *collection_quality_queries
          - tool_id: tool.query_metrics
            description: >-
              Reproduce the exact queue-delay condition.
            params:
              queries:
                - name: cluster_tasks_delayed_rule_condition
                  query: 'elasticsearch_cluster_health_task_max_waiting_in_queue_millis{instance="$instance"}
                    / 1000 > 60'
                - name: cluster_tasks_delayed_signal_sample_age_seconds
                  unit: s
                  query: 'time() - timestamp(elasticsearch_cluster_health_task_max_waiting_in_queue_millis{instance="$instance"})'
                - name: cluster_tasks_delayed_signal_samples_5m
                  query: 'count_over_time(elasticsearch_cluster_health_task_max_waiting_in_queue_millis{instance="$instance"}[5m])'
          - tool_id: tool.query_metrics
            description: >-
              Queue length, age and shard-information activity.
            params:
              queries: *cluster_task_queries
      - step: 2
        title: Check master-eligible node pressure without claiming election identity
        description: >-
          Use es_master_node=true only as a master-eligible role indicator in this exporter schema. It
          does not identify the elected master. Compare CPU, heap, GC and uptime among the returned eligible
          nodes. If role labels are absent or collection excludes those nodes, report this evidence unavailable;
          do not substitute a random data node. Pressure beginning before the backlog on an eligible node
          supports a hypothesis, but cannot prove it was the elected master or that CPU/GC caused delayed
          cluster-state processing.
        tool_calls:
          - tool_id: tool.query_metrics
            description: >-
              Resource evidence on observed master-eligible nodes only.
            params:
              queries:
                - name: master_eligible_heap_used_pct
                  unit: '%'
                  query: >-
                    (100 * (elasticsearch_jvm_memory_used_bytes{instance="$instance",area="heap",es_master_node="true"}
                    / elasticsearch_jvm_memory_max_bytes{instance="$instance",area="heap",es_master_node="true"}))
                    and (elasticsearch_jvm_memory_max_bytes{instance="$instance",area="heap",es_master_node="true"}
                    > 0)
                - name: master_eligible_process_cpu_percent
                  unit: '%'
                  query: 'elasticsearch_process_cpu_percent{instance="$instance",es_master_node="true"}'
                - name: master_eligible_gc_seconds_per_second
                  unit: s/s
                  query: 'rate(elasticsearch_jvm_gc_collection_seconds_sum{instance="$instance",es_master_node="true"}[5m])'
                - name: master_eligible_node_uptime_seconds
                  unit: s
                  query: 'elasticsearch_jvm_uptime_seconds{instance="$instance",es_master_node="true"}'
      - step: 3
        title: Check membership instability and cluster-management work
        description: >-
          Membership changes, shard recovery and newly represented indices around onset support increased
          cluster-management work. A newly created index timestamp indicates an observed creation, not
          the exact time its request entered this queue. Index deletion, rollover and changed collection
          scope can also change inventories. Top-ten creation times are candidate examples, not a complete
          count. Network byte rates cannot prove healthy connectivity, and these metrics cannot identify
          task sources, task priority, publication acknowledgement delays or the elected master's identity.
        tool_calls:
          - tool_id: tool.query_metrics
            description: >-
              Membership and node continuity.
            params:
              queries: *cluster_membership_queries
          - tool_id: tool.query_metrics
            description: >-
              Shard recovery and recent index-creation candidates.
            params:
              queries:
                - name: task_delay_cluster_status
                  query: 'elasticsearch_cluster_health_status{instance="$instance"}'
                - name: task_delay_initializing_shards
                  query: 'elasticsearch_cluster_health_initializing_shards{instance="$instance"}'
                - name: task_delay_relocating_shards
                  query: 'elasticsearch_cluster_health_relocating_shards{instance="$instance"}'
                - name: task_delay_unassigned_shards
                  query: 'elasticsearch_cluster_health_unassigned_shards{instance="$instance"}'
                - name: task_delay_newest_index_creation_timestamps
                  unit: unix_seconds
                  query: 'topk(10, elasticsearch_indices_settings_creation_timestamp_seconds{instance="$instance"})'
      - step: 4
        title: Assess ongoing data activity and report the unresolved task source
        description: >-
          Existing shard operations may continue while index creation, mapping changes or allocation wait.
          Report observed search/index activity alongside queue delay rather than asserting a full database
          outage. Aggregate activity is not proof every request succeeds. If queue age/count do not improve,
          report a persistent management backlog with the supported workload/resource context. The exact
          queued operation and cause remain unknown without task details from the owner; the live
          cluster_health call reports only the pending-task count.
        tool_calls:
          - tool_id: tool.query_metrics
            description: >-
              Observed data-plane activity while management work is delayed.
            params:
              queries:
                - name: task_delay_search_operations_per_second
                  unit: operations/s
                  query: 'rate(elasticsearch_indices_search_query_total{instance="$instance"}[5m])'
                - name: task_delay_index_operations_per_second
                  unit: operations/s
                  query: 'rate(elasticsearch_indices_indexing_index_total{instance="$instance"}[5m])'
      - step: 5
        title: Read live pending tasks, master identity and master resources
        description: >-
          Live cluster_health reports the pending-task count and longest wait.
          Identify the elected master from nodes_info roles, then compare its heap,
          GC and CPU with peers and sample hot threads cluster-wide. A master under
          heap or GC pressure, or a large shard count, commonly delays cluster
          state updates. Pending task sources and priorities are not returned by
          these tools; request them from the owner if needed.
        tool_calls:
          - *live_health
          - *live_nodes_info
          - *live_jvm_stats
          - *live_cpu_stats
          - *live_hot_threads
    remediation:
      - action: reduce_verified_cluster_state_pressure
        description: >-
          Ask the Elasticsearch owner to identify the delayed task source and elected master. If the incident
          is correlated with a planned burst of index/mapping or topology changes, coordinate pausing
          or pacing that work. Correct verified master resource or connectivity problems. Do not increase
          timeouts, restart all master-eligible nodes or guess a task cancellation from a queue-length
          metric.
        tool_id: ''
        requires_approval: true
    escalation: >-
      P2 to the Elasticsearch control-plane owner. Escalate when queue delay is growing, critical index-management
      operations are blocked, membership is unstable, or red health appears. State whether ongoing shard
      operations are still observed and whether master-node evidence was complete.
    follow_up:
      - >-
        Require oldest wait at or below 60 seconds for at least 10 minutes with fresh samples and normal
        sample coverage, plus a draining or baseline queue under representative management activity.
      - >-
        Have the owner verify that the delayed creation/mapping/allocation work completed. A lower sampled
        wait alone does not prove each queued change succeeded.
general_diagnostic:
  steps:
    - step: 1
      title: Establish exporter scope and collection quality
      description: >-
        For an unmatched Elasticsearch alert, require $instance before querying VM.
        Report missing or stale evidence explicitly. No remediation runs automatically.
      tool_calls:
        - tool_id: tool.query_metrics
          description: Collector status, freshness and coverage.
          params:
            queries: *collection_quality_queries
        - tool_id: tool.query_metrics
          description: Cluster health and shard counts for the same target.
          params:
            queries: *cluster_health_queries
    - step: 2
      title: Read live cluster health and node identity
      description: >-
        Confirm the MCP connection reaches the alerting cluster by cluster_name,
        then record health, node roles and versions as point-in-time context.
      tool_calls:
        - *live_health
        - *live_nodes_info
    - step: 3
      title: Read a live resource snapshot
      description: >-
        Heap, disk and thread-pool readings for every node. They are context for
        an unmatched alert, not evidence for its window.
      tool_calls:
        - *live_jvm_stats
        - *live_disk_stats
        - *live_pool_stats

escalation: >-
  Route monitoring/collection failures to the exporter owner, capacity and cluster-availability incidents
  to the Elasticsearch/platform owner, and request-driven failures to the relevant application or producer
  owner. Preserve the rule's priority: cluster red P0; collection failure and critical disk P1; the other
  seven rules P2. Escalate on separately observed impact rather than inventing it from an empty query.
  Include object labels, time window, evidence query names/values/timestamps, coverage limitations, confidence
  and the exact unanswered question. Report live-call results separately from VM evidence, with any NOT RUN calls.
follow_up:
  - >-
    Before deployment, verify the real runner resolves raw alert labels.instance, the VictoriaMetrics
    tenant/project/environment context, alert-centered time ranges, full series labels and panel fields.
    The supplied reference establishes YAML shape, not the runner's actual placeholder or time-context
    behavior.
  - >-
    Run one representative alert from each scope (collector, cluster, node, disk path, breaker, thread
    pool and index) against VM. Check collector status, freshness, ratio label matching and that the alerting
    series survives result limits. Parser validation and a metric-name inventory cannot verify live samples,
    label values, permissions, ingestion delay or exporter coverage.
  - >-
    Keep missing evidence distinct from zero. Continue independent queries after optional-metric failures,
    retain gaps in the RCA and never broaden tenant or endpoint scope to make an empty query return data.
  - >-
    Only close with the per-alert recovery criteria and representative workload. Counter-window expiry,
    a quiet workload, collector failure or warning-to-critical transition can resolve an alert without
    resolving its underlying problem.
