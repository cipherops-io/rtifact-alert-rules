# Monitoring-only runbook: 13 alert rules.
tech_stack: elasticsearch-cloud
version: '2.0'
description: |-
  Monitoring-only Elasticsearch Cloud RCA runbook. All queries use the existing connection to commotion-observability (observed version 8.19.21). The four source deployments are represented only by their exported documents. No source deployment API calls and no writes. Preserve the tested search_query_dsl wrapper and params.arguments/bind/rows/fields shape. This revision has been statically validated; new queries have NOT been executed against the deployment.
  The core uses $cluster (exact display name), optional $node (alert node name/ID), and $rtfRunbookResolvedClusterUuid (bound by resolve_cluster). Reserve rtfRunbookResolvedClusterUuid for runbook binding; do not supply it as an alert/context label. Existing clusterUuid labels do not control query scoping. The supplied gateway bind_value requires one distinct UUID and the executor skips calls with unresolved placeholders. Missing $node skips only node-specific calls. Coverage and interpretation guidance in descriptions is not an executable condition.
  CORE TIME SCOPE: now-relative calls assess current/recent condition; they cannot reconstruct a delayed alert's onset. Preserve incoming alert time, threshold, duration, measured value, node/index and source UUID. For delayed/replayed alerts use the incident window catalog before explaining why the alert originally fired. Record execution time and the observation time/range of every result. Monitoring is not guaranteed to be ten seconds fresh. Measure staleness per metricset against observed/configured cadence. Missing, stale, partial, capped and failed results mean unknown evidence, never healthy/zero.
  IDENTITY: require an exact display name that resolves to one UUID within the seven-day lookup window. Zero or multiple UUIDs leave dependent queries NOT RUN. An incoming clusterUuid is retained as alert context but is not used for query filters or as a fallback. A disagreement between incoming UUID and resolved identity must be reported as an identity mismatch, not silently treated as reliable incident attribution. Automatic comparison of those two values is not supported by this executor. A missing or renamed display name can therefore produce insufficient evidence. Never remove UUID filters to get results or substitute the monitoring deployment identity for an unresolved source.
  LIMITS: search returns at most ten hits and its current wrapper drops aggregations. size is explicitly bounded to ten. A full result is possibly truncated; say 'up to ten returned' and do not infer total entities from hit count. Missing nodes/indices in capped lists prove nothing. No DSL aggregations, inner_hits or undocumented response extraction are required. ES|QL response handling is separate from hit-array handling.
  INTERPRETATION: latest-per-entity queries sort by timestamp; peak queries are labelled peaks. Filtered unhealthy rows are history, not guaranteed latest states. Counter deltas require same UUID/node ID, correct temporal order, matching epoch and no reset; resets can be missed if samples are sparse. No nonzero lifetime counter proves a current failure. Use numeric byte/elapsed-time formulas in the guide. Do not infer percentage scaling from the suffix pct or from a small number. Alert thresholds/durations come from the actual alert, never hard-code sample rule thresholds.
  RCA OUTPUT: source cluster/UUID and rule/instance; incident and evidence times; coverage/freshness; observed status and impact; evidence-supported likely cause with confidence; alternative causes and missing evidence; owner recommendations; recovery evidence. Distinguish confirmed finding, supported hypothesis and unknown. A correlation between two alerts is not a proven cause. The monitoring-only scope may identify a cause or narrow it down; it cannot guarantee the offending query, exact allocation decider, source ILM policy or Cloud plan history.
match_keywords:
- elasticcloud
- elastic cloud
- elasticsearch cloud
- stack monitoring
categories:
- DATA
- DATABASE
- SEARCH
available_tools:
- mcp.elasticsearch.search_query_dsl — existing tested hit-array adapter; actual MCP name elasticsearch-search-query-dsl-1;
  all targets on commotion-observability.
identity_candidates: &identity_candidates
  tool_id: mcp.elasticsearch.search_query_dsl
  description: 'Identity check, not a current-health query. Exact display-name matches in retained seven-day data;
    up to ten distinct UUIDs. More than one UUID means ambiguous identity: do not attribute an RCA automatically.'
  params:
    arguments:
      index: .monitoring-es-8-mb
      body:
        size: 10
        query:
          bool:
            filter:
            - term:
                metricset.name: cluster_stats
            - term:
                cluster_settings.cluster.metadata.display_name: $cluster
            - range:
                '@timestamp':
                  gte: now-7d
                  lte: now
        sort:
        - '@timestamp': desc
        _source:
        - '@timestamp'
        - elasticsearch.cluster.id
        - cluster_settings.cluster.metadata.display_name
        collapse:
          field: elasticsearch.cluster.id
    rows: '[*]._source'
    fields:
    - at=@timestamp
    - cluster_uuid=elasticsearch.cluster.id
    - display_name=cluster_settings.cluster.metadata.display_name
    summary_chars: 12000
resolve_cluster: &resolve_cluster
  tool_id: mcp.elasticsearch.search_query_dsl
  description: Resolve exact $cluster display name across retained seven-day cluster_stats. Return up to ten DISTINCT
    cluster UUIDs. The gateway bind_value accepts only one distinct UUID; zero or multiple candidates leave the
    dedicated runbook variable unresolved, so dependent calls are not sent. Do not fall back to an incoming clusterUuid.
    This is identity evidence, not current health.
  params:
    arguments:
      index: .monitoring-es-8-mb
      body:
        query:
          bool:
            filter:
            - term:
                metricset.name: cluster_stats
            - term:
                cluster_settings.cluster.metadata.display_name: $cluster
            - range:
                '@timestamp':
                  gte: now-7d
                  lte: now
        sort:
        - '@timestamp': desc
        _source: &id001
        - '@timestamp'
        - elasticsearch.cluster.id
        - cluster_settings.cluster.metadata.display_name
        - elasticsearch.cluster.stats.status
        - elasticsearch.cluster.stats.nodes.count
        - elasticsearch.cluster.stats.nodes.versions
        - elasticsearch.cluster.stats.nodes.fs
        - elasticsearch.cluster.stats.nodes.jvm.memory
        - elasticsearch.cluster.stats.nodes.jvm.max_uptime.ms
        - elasticsearch.cluster.stats.indices.shards
        - elasticsearch.cluster.stats.indices.docs.total
        - elasticsearch.cluster.stats.indices.store.size.bytes
        - elasticsearch.cluster.stats.license.status
        - elasticsearch.cluster.stats.license.type
        - elasticsearch.cluster.stats.license.expiry_date
        - elasticsearch.cluster.stats.indices.total
        - cluster_settings.cluster.routing.allocation
        size: 10
        collapse:
          field: elasticsearch.cluster.id
    bind:
      rtfRunbookResolvedClusterUuid:
        pick: _source.elasticsearch.cluster.id
    fields:
    - latest_sample_at=@timestamp
    - cluster=cluster_settings.cluster.metadata.display_name
    - cluster_uuid=elasticsearch.cluster.id
    - status=elasticsearch.cluster.stats.status
    - nodes=elasticsearch.cluster.stats.nodes.count
    - es_versions=elasticsearch.cluster.stats.nodes.versions
    - shards_total=elasticsearch.cluster.stats.indices.shards.count
    - shards_primary=elasticsearch.cluster.stats.indices.shards.primaries
    - docs=elasticsearch.cluster.stats.indices.docs.total
    - store_bytes=elasticsearch.cluster.stats.indices.store.size.bytes
    - disk_total_bytes=elasticsearch.cluster.stats.nodes.fs.total.bytes
    - disk_avail_bytes=elasticsearch.cluster.stats.nodes.fs.available.bytes
    - heap_used_bytes=elasticsearch.cluster.stats.nodes.jvm.memory.heap.used.bytes
    - heap_max_bytes=elasticsearch.cluster.stats.nodes.jvm.memory.heap.max.bytes
    - max_node_uptime_ms=elasticsearch.cluster.stats.nodes.jvm.max_uptime.ms
    - license=elasticsearch.cluster.stats.license.status
    - license_type=elasticsearch.cluster.stats.license.type
    - license_expiry=elasticsearch.cluster.stats.license.expiry_date
    summary_chars: 7000
    rows: '[*]._source'
cluster_current: &cluster_current
