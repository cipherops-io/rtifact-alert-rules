    - persistent.cluster.routing.allocation.disk.watermark.low.max_headroom
    - persistent.cluster.routing.allocation.disk.watermark.high
    - persistent.cluster.routing.allocation.disk.watermark.high.max_headroom
    - persistent.cluster.routing.allocation.disk.watermark.flood_stage
    - persistent.cluster.routing.allocation.disk.watermark.flood_stage.max_headroom
    - persistent.cluster.routing.allocation.disk.watermark.flood_stage.frozen
    - persistent.cluster.routing.allocation.disk.watermark.flood_stage.frozen.max_headroom
    - persistent.cluster.routing.allocation.enable
    - persistent.cluster.routing.rebalance.enable
    - persistent.cluster.routing.allocation.awareness
    - persistent.cluster.routing.allocation.include
    - persistent.cluster.routing.allocation.exclude
    - persistent.cluster.routing.allocation.require
    - persistent.cluster.routing.allocation.total_shards_per_node
    - defaults.cluster.routing.allocation.disk.threshold_enabled
    - defaults.cluster.routing.allocation.disk.watermark.low
    - defaults.cluster.routing.allocation.disk.watermark.low.max_headroom
    - defaults.cluster.routing.allocation.disk.watermark.high
    - defaults.cluster.routing.allocation.disk.watermark.high.max_headroom
    - defaults.cluster.routing.allocation.disk.watermark.flood_stage
    - defaults.cluster.routing.allocation.disk.watermark.flood_stage.max_headroom
    - defaults.cluster.routing.allocation.disk.watermark.flood_stage.frozen
    - defaults.cluster.routing.allocation.disk.watermark.flood_stage.frozen.max_headroom
    - defaults.cluster.routing.allocation.enable
    - defaults.cluster.routing.rebalance.enable
    - defaults.cluster.routing.allocation.awareness
    - defaults.cluster.routing.allocation.include
    - defaults.cluster.routing.allocation.exclude
    - defaults.cluster.routing.allocation.require
    - defaults.cluster.routing.allocation.total_shards_per_node
child_allocation_explain: &child_allocation_explain
  tool_id: mcp.elasticsearch.cluster_allocation_explain
  target: child
  description: 'Child: explain ONE automatically selected unassigned shard. The selected index/shard/primary and
    deciders are evidence only for that shard. If no unassigned shard exists, the expected no-shard error does not
    mean the cluster is down. There is no automatic condition or loop in this YAML.'
  params:
    arguments: {}
    summary_chars: 4000
    fields:
    - index=index
    - shard=shard
    - primary=primary
    - state=current_state
    - reason=unassigned_info.reason
    - since=unassigned_info.at
    - details=unassigned_info.details
    - can_allocate=can_allocate
    - explanation=allocate_explanation
    - node_names=node_allocation_decisions[*].node_name
    - node_decisions=node_allocation_decisions[*].node_decision
    - deciders=node_allocation_decisions[*].deciders[*].decider
    - decisions=node_allocation_decisions[*].deciders[*].decision
    - reasons=node_allocation_decisions[*].deciders[*].explanation
    bind:
      rtfUnassignedIndex:
        pick: index
child_allocation_index: &child_allocation_index
  tool_id: mcp.elasticsearch.get_index
  target: child
  description: 'Child: settings, mappings and aliases for the index selected by child allocation explain. Inspect
    number_of_replicas, allocation filters/tier preference, index.blocks and index.lifecycle settings in result.data.
    The generic summary can be dominated by mappings; if settings are omitted, report missing evidence, not default
    values.'
  params:
    arguments:
      index: $rtfUnassignedIndex
    summary_chars: 4000
child_allocation_ilm: &child_allocation_ilm
  tool_id: mcp.elasticsearch.ilm_explain_lifecycle
  target: child
  description: 'Child: ILM phase/action/step, policy and error for the index selected by child allocation explain.
    managed=false is not itself an error. A bound candidate is not automatically the alert index; this call does
    not retrieve the complete ILM policy definition.'
  params:
    arguments:
      index: $rtfUnassignedIndex
      only_errors: false
      only_managed: false
    summary_chars: 4000
child_large_index: &child_large_index
  tool_id: mcp.elasticsearch.get_index
  target: child
  description: 'Child: settings, mappings and aliases for the storage candidate selected from parent monitoring.
    Inspect number_of_replicas, allocation filters/tier preference, index.blocks and index.lifecycle settings in
    result.data. The generic summary can be dominated by mappings; if settings are omitted, report missing evidence,
    not default values.'
  params:
    arguments:
      index: $rtfLargeIndex
    summary_chars: 4000
child_large_ilm: &child_large_ilm
  tool_id: mcp.elasticsearch.ilm_explain_lifecycle
  target: child
  description: 'Child: ILM phase/action/step, policy and error for the storage candidate selected from parent monitoring.
    managed=false is not itself an error. A bound candidate is not automatically the alert index; this call does
    not retrieve the complete ILM policy definition.'
  params:
    arguments:
      index: $rtfLargeIndex
      only_errors: false
      only_managed: false
    summary_chars: 4000
child_large_shards: &child_large_shards
  tool_id: mcp.elasticsearch.cat_shards
  target: child
  description: 'Child: current individual primary/replica shard sizes for the one selected storage candidate. This
    is not a complete largest-shard ranking across the deployment.'
  params:
    arguments:
      index: $rtfLargeIndex
    summary_chars: 4000
child_alert_index: &child_alert_index
  tool_id: mcp.elasticsearch.get_index
  target: child
  description: 'Child: exact index from the incoming alert when an index field is available. Missing $index skips
    this optional call. Do not assume the storage candidate and alert index are the same.'
  params:
    arguments:
      index: $index
    summary_chars: 4000
child_alert_shards: &child_alert_shards
  tool_id: mcp.elasticsearch.cat_shards
  target: child
  description: 'Child: exact index from the incoming alert when an index field is available. Missing $index skips
    this optional call. Do not assume the storage candidate and alert index are the same.'
  params:
    arguments:
      index: $index
    summary_chars: 4000
child_alert_ilm: &child_alert_ilm
  tool_id: mcp.elasticsearch.ilm_explain_lifecycle
  target: child
  description: 'Child: exact index from the incoming alert when an index field is available. Missing $index skips
    this optional call. Do not assume the storage candidate and alert index are the same.'
  params:
    arguments:
      index: $index
      only_errors: false
      only_managed: false
    summary_chars: 4000
kibana_versions: &kibana_versions
  tool_id: mcp.elasticsearch.search_query_dsl
  target: parent
  description: 'Parent: recent Kibana instance/version observations. Flat and nested service fields are supported
    by the existing path walker. Repeated samples of one instance do not prove fleet-wide version consistency.'
  params:
    arguments:
      index: .monitoring-kibana-8-mb
      body:
        size: 10
        query:
          bool:
            filter:
            - range:
                '@timestamp':
                  gte: now-15m
                  lte: now
            - bool:
                should:
                - term:
                    elasticsearch.cluster.id: $rtfMonitoringClusterUuid
                - term:
                    cluster_uuid: $rtfMonitoringClusterUuid
                - term:
                    kibana.stats.elasticsearch.cluster.id: $rtfMonitoringClusterUuid
                minimum_should_match: 1
        sort:
        - '@timestamp': desc
        _source:
        - '@timestamp'
        - service.id
        - service.version
        - kibana.stats.uuid
        - kibana.stats.version
        - elasticsearch.cluster.id
        - cluster_uuid
    summary_chars: 4000
    fields:
    - at=@timestamp
    - id=service.id
    - version=service.version
    - legacy_id=kibana.stats.uuid
    - legacy_version=kibana.stats.version
    rows: '[*]._source'
common_alerts:
- name: ElasticCloudClusterHealth
  patterns:
  - Cluster health check
  - Cluster health rule
  - monitoring_alert_cluster_health
  priority: P2
  diagnostic_steps:
  - step: 1
    title: Compare the alert and recorded history with source health
    description: Resolve parent evidence and read the exact rule state. Child health establishes present state even
      if parent identity lookup fails. Green now does not reconstruct why the alert fired; cite observation times.
    tool_calls:
    - *resolve_cluster
    - *rule_alerts
    - *child_health
  - step: 2
    title: Compare historical shard symptoms with current source allocation
    description: Parent rows can be old or recovered; child shard rows establish present placement. Count only data-capable
      roles as possible shard hosts. Do not infer configured replicas from sampled shard totals.
    tool_calls:
    - *unassigned_shards
    - *yellow_indices
    - *child_shards
    - *child_nodes_info
  - step: 3
    title: Read allocation decisions and relevant configuration
    description: The executor runs these calls sequentially. Allocation explain chooses one unassigned shard; read
      its index/shard/primary and per-node NO deciders. Settings clarify disk limits, tiers and awareness. A no-unassigned-shard
      response can occur after recovery. The subsequent get_index is scoped to the returned index; no binding means
      that call is NOT RUN.
    tool_calls:
    - *child_allocation_explain
    - *child_cluster_settings
    - *child_allocation_index
    - *child_disk_stats
  remediation:
  - action: address_allocation_decider
    description: 'Have the owner address the actual NO decider for the named shard: eligible capacity/tier, awareness/filter
      rules, disk, or replica configuration. Do not reduce replicas without considering redundancy requirements.'
    tool_id: ''
    requires_approval: true
  - action: recover_unavailable_primaries
    description: For unassigned primaries, use the allocation explanation and valid-copy evidence to plan node recovery
      or snapshot restoration with the owner.
    tool_id: ''
    requires_approval: true
  escalation: Deployment owner urgently for unavailable primaries or confirmed request failures. Yellow indicates
    degraded redundancy; use the observed shard impact and allocation decisions.
  follow_up:
  - Confirm source health and affected shards recover, monitoring reflects recovery, and the Kibana rule moves to
    recovered.
- name: ElasticCloudNodesChanged
  patterns:
  - Nodes changed check
  - Nodes changed
  - monitoring_alert_nodes_changed
  priority: P3
  diagnostic_steps:
  - step: 1
    title: Compare earlier reporting with present membership
    description: Read the alert reason and earlier monitoring node IDs/counts, then the live source membership.
      A node absent from the sampled parent list is not necessarily absent from the source. Check failed-node counts
      and result truncation.
    tool_calls:
    - *resolve_cluster
    - *rule_alerts
    - *cluster_baseline
    - *nodes_baseline
    - *child_nodes_info
    - *child_health
  - step: 2
    title: Check reporting and allocation impact
    description: Compare latest parent reporters with current source shard placement. Health/shard changes can support
      a node-loss consequence but cannot prove an Elastic Cloud plan change. Activity/maintenance history must be
      supplied separately.
    tool_calls:
    - *nodes_latest
    - *child_shards
  remediation:
  - action: confirm_planned_change
    description: Check the Elastic Cloud deployment activity for a plan change / maintenance at the alert time;
      if none and a node is missing, open an Elastic support case.
    tool_id: ''
    requires_approval: true
  escalation: Deployment owner only if a node is still missing or health turned red.
  follow_up:
  - Confirm the node count is back to the expected size.
- name: ElasticCloudJvmMemoryHigh
  patterns:
  - JVM Memory Usage
  - Memory Usage (JVM)
  - monitoring_alert_jvm_memory_usage
  priority: P2
  diagnostic_steps:
  - step: 1
    title: Compare recorded heap pressure with current JVM evidence
    description: Use the threshold/duration from the incoming rule. nodes_by_heap contains recent peaks; nodes_latest
      is latest per node. Child JVM and breaker data show current heap/GC/uptime and cumulative breaker trips. One
      high sample does not prove sustained pressure or an undersized deployment.
    tool_calls:
    - *resolve_cluster
    - *nodes_by_heap
    - *nodes_latest
    - *nodes_baseline
    - *rule_alerts
    - *child_jvm_stats
    - *child_breaker_stats
  - step: 2
    title: Inspect cache/shard overhead and busy threads
    description: Child indices stats add cache, fielddata and segment evidence. Hot threads sample work now, not
      the original incident. Optional focused stacks use $node. Parent index sizes suggest data footprint only;
      no fixed shards-per-GB formula or assumed heap cap proves the cause.
    tool_calls:
    - *largest_indices
    - *child_index_stats
    - *child_hot_threads
    - *child_target_hot_threads
  remediation:
  - action: reduce_confirmed_memory_pressure
    description: Reduce evidence-supported query/indexing/cache or shard overhead; evaluate instance sizing with
      the owner. A single heap sample or fixed shards-per-GB rule is insufficient.
    tool_id: ''
    requires_approval: true
  escalation: Deployment owner for sustained heap pressure, new breaker trips, request failures or instability,
    using the actual rule threshold.
  follow_up:
  - Confirm heap_pct stays under the threshold and the rule alert recovers.
- name: ElasticCloudCpuHigh
  patterns:
  - CPU Usage >
  - CPU Usage rule
  - monitoring_alert_cpu_usage
  priority: P2
  diagnostic_steps:
  - step: 1
    title: Compare CPU observations and processor configuration
    description: Use alert CPU percentage/threshold with timestamps. A 1-minute load average is not CPU utilization.
      Child CPU stats and OS info supply current counters/configuration. Quota/period can describe CPU limits only
      if both values and units are known; do not assume a 100000-us period.
    tool_calls:
    - *resolve_cluster
    - *nodes_by_load
    - *nodes_latest
    - *nodes_baseline
    - *child_cpu_info
    - *child_cpu_stats
  - step: 2
    title: Sample the work and assess request pressure
    description: Read actual stack frames to identify search, indexing, merges or GC activity; do not infer the
      busiest workload from index size. Compare queues/rejection deltas and concurrent alerts. A quiet live sample
      cannot exclude a completed spike. Exact offending queries/client identity may need tasks or slow logs, which
      these calls do not provide.
    tool_calls:
    - *rule_alerts
    - *child_hot_threads
    - *child_target_hot_threads
    - *child_pool_stats
  remediation:
  - action: reduce_confirmed_cpu_work
    description: Use thread evidence and measured workload to adjust client concurrency, queries or deployment capacity.
      Do not assume a large index is the busy index.
    tool_id: ''
    requires_approval: true
  escalation: Deployment owner when CPU saturation causes queueing/rejections.
  follow_up:
  - Confirm the alert node CPU trend and queues recover; do not equate load average with percentage utilization.
- name: ElasticCloudDiskHigh
  patterns:
  - Disk Usage >
  - Disk Usage rule
  - monitoring_alert_disk_usage
  priority: P2
  diagnostic_steps:
  - step: 1
    title: Compare disk pressure with actual source thresholds
    description: Use the rule threshold and current fs.available_in_bytes/total_in_bytes per data path. nodes_by_disk
      is a historical minimum, not the current level. Child settings supply actual disk watermarks/headroom; the
      percentage alone does not prove a write block.
    tool_calls:
    - *resolve_cluster
    - *nodes_by_disk
    - *nodes_latest
    - *rule_alerts
    - *child_disk_stats
    - *child_cluster_settings
  - step: 2
    title: Inspect source placement and allocation decisions
    description: Compare shard stores on the affected node with allocation deciders. Allocation explanation concerns
      one selected unassigned shard and may find none. This does not itself indicate a workflow failure or explain
      every disk alert.
    tool_calls:
    - *largest_indices
    - *child_shards
    - *child_allocation_explain
    - *child_allocation_index
  - step: 3
    title: Check lifecycle and index configuration
    description: Exact $index calls are optional if supplied on the alert. Also inspect one explicitly labelled
      storage candidate and the allocation-explained index when available; neither is necessarily the index filling
      the alert node. managed=false is not an ILM failure, and a slow phase is not automatically an error. No deletion,
      force merge or setting change is executed.
    tool_calls:
    - *large_index_candidate
    - *child_large_index
    - *child_large_ilm
    - *child_allocation_ilm
    - *child_alert_index
    - *child_alert_ilm
  remediation:
  - action: restore_disk_headroom
    description: Have the owner add capacity or move/delete data only under approved retention requirements; investigate
      ILM failures on the named index. Force merge is not a default emergency disk remedy.
    tool_id: ''
    requires_approval: true
  - action: check_write_blocks_after_recovery
    description: After disk recovery, verify the actual index block state and have the owner address remaining blocks
      if required.
    tool_id: ''
    requires_approval: true
  escalation: Deployment owner urgently for confirmed write blocks, sustained disk growth or allocation failure;
    use actual source thresholds and impact.
  follow_up:
  - Verify disk headroom against the actual rule and allocation thresholds, index block state, and alert recovery.
- name: ElasticCloudThreadPoolRejections
  patterns:
  - Thread pool search rejections
  - Thread pool write rejections
  - rejections check
  - monitoring_alert_thread_pool_search_rejections
  - monitoring_alert_thread_pool_write_rejections
  priority: P2
  diagnostic_steps:
  - step: 1
    title: Compare rejection history with live queues and pressure
    description: Keep v1 search/write matching patterns. Rejected counters are cumulative; compare same node ID
      and counter epoch before claiming new failures. A nonzero queue shows queued work, not proof of ongoing rejections.
      Missing related alerts do not prove a traffic burst.
    tool_calls:
    - *resolve_cluster
    - *nodes_by_write_rejections
    - *nodes_by_search_rejections
    - *nodes_baseline
    - *rule_alerts
    - *child_pool_stats
  - step: 2
    title: Inspect resource pressure and thread samples
    description: Current CPU/JVM/breaker data and stack samples may explain pressure. Attribute causes only when
      evidence aligns in time and node; quiet current state may reflect recovery. Failed writes require client retry
      for eventual delivery; do not assert actual data loss without delivery evidence.
    tool_calls:
    - *child_cpu_stats
    - *child_jvm_stats
    - *child_breaker_stats
    - *child_hot_threads
    - *child_target_hot_threads
  remediation:
  - action: reduce_confirmed_request_pressure
    description: Have the owner tune expensive searches or bulk concurrency and implement bounded retries/backoff.
      Evaluate capacity and replica changes against measured CPU, disk and shard overhead; do not blindly enlarge
      queues.
    tool_id: ''
    requires_approval: true
  escalation: Owning client/service team for failed requests and retry behavior; deployment owner for sustained
    saturation or allocation/storage impact.
  follow_up:
  - Confirm queues drain, no new rejection increments occur for the same node/uptime, and client delivery and the
    rule recover.
- name: ElasticCloudLargeShard
  patterns:
  - Large Shard size
  - Shard size
  - monitoring_shard_size
  priority: P3
  diagnostic_steps:
  - step: 1
    title: Identify the alerted index and storage candidates
    description: Use the alert reason and configured threshold, not a hardcoded 55-GB value. Primary bytes divided
      by primary count is an average; it is not the largest shard. Candidate selection uses total primary-store
      bytes and remains explicitly separate from the alert index.
    tool_calls:
    - *resolve_cluster
    - *rule_alerts
    - *largest_indices
    - *large_index_candidate
  - step: 2
    title: Read source shard sizes, configuration and lifecycle
    description: Child shard rows supply individual store sizes. Inspect exact $index when the alert carries it;
      otherwise those optional calls are skipped. Independently inspect the single selected candidate. If neither
      identifies the alert index, report that coverage gap. Index metadata and ILM state guide owner follow-up;
      neither proves rollover settings that were not returned.
    tool_calls:
    - *child_alert_shards
    - *child_alert_index
    - *child_alert_ilm
    - *child_large_shards
    - *child_large_index
    - *child_large_ilm
  remediation:
  - action: review_rollover_or_shard_design
    description: Compare measured primary shard sizes, workload/recovery needs, index settings and ILM state. Have
      the owner plan rollover, split or reindex only where supported and justified.
    tool_id: ''
    requires_approval: true
  escalation: Owning team of the named index — not urgent unless recoveries are slow.
  follow_up:
  - Verify resulting shard sizes and recovery behavior against workload and rule requirements.
- name: ElasticCloudVersionMismatch
  patterns:
  - Elasticsearch version mismatch
  - Kibana version mismatch
  - Logstash version mismatch
  - version mismatch
  priority: P3
  diagnostic_steps:
  - step: 1
    title: Read the product-specific alert and recorded versions
    description: Keep all original version matching patterns, including the generic version mismatch phrase. Determine
      Elasticsearch/Kibana/Logstash from rule evidence; do not assume a product when the title is generic. Compare
      versions within the same product.
    tool_calls:
    - *resolve_cluster
    - *rule_alerts
  - step: 2
    title: Verify Elasticsearch membership and available Kibana evidence
    description: Child node information verifies Elasticsearch versions only. Parent Kibana samples can expose instance
      versions but ten recent records may all describe one instance. For Logstash version alerts, use the rule's
      reason and report that this runbook does not query Logstash telemetry; do not infer whether Logstash monitoring
      is available for the client. Mixed versions may be a rolling upgrade; check maintenance context before calling it stalled.
    tool_calls:
    - *child_nodes_info
    - *kibana_versions
  remediation:
  - action: complete_or_align_upgrade
    description: Finish the rolling upgrade in the Elastic Cloud console, or align the lagging instance's version.
    tool_id: ''
    requires_approval: true
  escalation: Deployment owner if the mismatch outlasts the upgrade window.
  follow_up:
  - Confirm versions are aligned within the affected product after its approved upgrade window and the rule recovers.
- name: ElasticCloudLicenseExpiration
  patterns:
  - License expiration
  - Cluster License expiration check
  - monitoring_alert_license_expiration
  priority: P3
  diagnostic_steps:
  - step: 1
    title: Read the source license from its exported cluster snapshot
    description: Cite source UUID, sample timestamp, status, type and expiry against the alert threshold. Old identity
      evidence is not current license confirmation. None of the 14 available tools is a dedicated get-license action,
      so no irrelevant child call is added. An approaching expiry does not prove a billing failure.
    tool_calls:
    - *resolve_cluster
    - *rule_alerts
  remediation:
  - action: verify_license_renewal
    description: Ask the Elastic Cloud account/deployment owner to verify renewal and license state against the
      reported expiry. Do not infer a subscription/billing fault from expiry alone.
    tool_id: ''
    requires_approval: true
  escalation: Account/billing owner.
  follow_up:
  - Confirm the new expiry date in cluster_stats.
- name: ElasticCloudMissingMonitoringData
  patterns:
  - Missing monitoring data
  - monitoring_alert_missing_monitoring_data
  priority: P2
  diagnostic_steps:
  - step: 1
    title: Check the source and collector independently
    description: Run both target health checks and source membership even if the parent name lookup finds nothing.
      A healthy responding child with absent/stale monitoring suggests a collection-path issue; it does not prove
      which exporter/configuration failed. A timeout or authorization failure is not proof the source is down.
    tool_calls:
    - *resolve_cluster
    - *rule_alerts
    - *child_health
    - *child_nodes_info
    - *parent_health
  - step: 2
    title: Measure the available monitoring gap
    description: 'Compare timestamps and metricsets: a fresh index record does not prove node_stats is fresh. Earlier/latest
      node lists are capped and cannot prove missing reporters if incomplete. If no monitoring UUID is bound, these
      calls are NOT RUN while the independent live checks remain useful.'
    tool_calls:
    - *latest_monitoring_record
    - *nodes_latest
    - *nodes_baseline
  remediation:
  - action: check_deployment_and_monitoring_settings
    description: Check the deployment's health in the Elastic Cloud console; if it is healthy, re-check Monitoring
      (logs & metrics) is enabled and shipping to the observability deployment.
    tool_id: ''
    requires_approval: true
  escalation: Observability owner for absent or stale collection; source deployment owner when live source failures
    or missing nodes are also confirmed. Identify which metricsets/rules lack evidence.
  follow_up:
  - Confirm the required cluster_stats, node_stats and affected metricsets are fresh again and the missing-monitoring
    rule recovers.
escalation: Use source deployment owner for source incidents and observability owner for collection failures. Report
  unavailable data, access errors and sampling gaps distinctly. All remediation is owner-reviewed advice only.
follow_up:
- Confirm target parent/child routing in the updated executor before rollout; it reads tool_calls[].target alongside
  tool_id.
- Verify fresh monitoring and source identity, current alert state and actual recovery evidence.
- Native dictionary/text summaries may be incomplete; validate result.data and RCA summaries during the first end-to-end
  test.
