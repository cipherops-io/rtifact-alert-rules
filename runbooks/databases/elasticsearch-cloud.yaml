- name: ElasticCloudLargeShard
  patterns:
  - Large Shard size
  - Shard size
  - monitoring_shard_size
  priority: P3
  diagnostic_steps:
  - step: 1
    title: Identify the source cluster and assess evidence freshness
    description: Resolve the exact $cluster display name to one distinct UUID using resolve_cluster. Use only the
      dedicated bound runbook UUID for subsequent source queries; do not fall back to the incoming clusterUuid.
      Zero or multiple candidates cause dependent calls to be NOT RUN. Preserve incoming UUID, rule, node, measured
      value, threshold, duration and alert time as context. Report any incoming/resolved UUID disagreement as an
      identity mismatch. Stale identity data does not establish current health. Match rule and instance in alert
      documents. Missing identity is insufficient evidence, not another incident.
    tool_calls:
    - *identity_candidates
    - *resolve_cluster
    - *rule_alerts
    - *cluster_current
  - step: 2
    title: Find high average primary-shard sizes
    description: Rank candidates by primary_store_bytes / primary_count, with primary_count>0. Report GiB=bytes/1073741824
      and use the alert threshold with its actual unit. Average primary size is not maximum per-shard size. If the
      alert names an index missing from these ten candidates, run the explicit index drilldown in the evidence catalog.
      Historical peak rows are not current snapshots.
    tool_calls:
    - *large_average_shard_observations
    - *indices_latest
  - step: 3
    title: Check impact without guessing the ILM policy
    description: Compare health/disk symptoms and source logs for long recovery or relocation. The monitoring deployment
      ILM API explains its local monitoring indices, not the parent index policy. Large size does not prove age-only
      rollover or an ILM failure.
    tool_calls:
    - *nodes_latest
    - *source_logs
  remediation:
  - action: review_rollover_and_shard_design
    description: Owner should review actual source lifecycle settings and workload. Size-based rollover can limit
      future growth; existing shards need a separate migration/split/reindex plan with capacity and prerequisites
      checked. Size targets are workload-dependent.
    tool_id: ''
    requires_approval: true
  escalation: Index owner; prioritize if large shards coincide with recovery delays or capacity pressure.
  follow_up:
  - Compare fresh average and actual maximum shard size if exported; verify future rollover behavior through monitoring.
- name: ElasticCloudElasticsearchVersionMismatch
  patterns:
  - Elasticsearch version mismatch
  priority: P3
  diagnostic_steps:
  - step: 1
    title: Identify the source cluster and assess evidence freshness
    description: Resolve the exact $cluster display name to one distinct UUID using resolve_cluster. Use only the
      dedicated bound runbook UUID for subsequent source queries; do not fall back to the incoming clusterUuid.
      Zero or multiple candidates cause dependent calls to be NOT RUN. Preserve incoming UUID, rule, node, measured
      value, threshold, duration and alert time as context. Report any incoming/resolved UUID disagreement as an
      identity mismatch. Stale identity data does not establish current health. Match rule and instance in alert
      documents. Missing identity is insufficient evidence, not another incident.
    tool_calls:
    - *identity_candidates
    - *resolve_cluster
    - *rule_alerts
    - *cluster_current
  - step: 2
    title: Compare versions of the same product at compatible times
    description: Use the node-version list within a single fresh source cluster_stats snapshot, and compare with
      baseline. A historical change of a version on one node is not simultaneous mismatch. Complete node coverage
      is required to say all nodes agree.
    tool_calls:
    - *cluster_baseline
  remediation:
  - action: review_product_upgrade
    description: Owner should confirm the Elasticsearch upgrade window and affected instance versions. A version
      mismatch can occur during a rolling change, but the change is not proven planned by version data alone. Escalate
      persistent mismatches; do not prescribe a downgrade.
    tool_id: ''
    requires_approval: true
  escalation: Deployment/product owner if mismatched versions persist beyond the agreed upgrade window or cause
    impact.
  follow_up:
  - Fresh latest versions agree for the covered instances and the exact Elasticsearch rule recovered; state any
    incomplete coverage.
