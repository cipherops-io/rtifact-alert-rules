        - elasticsearch.node.stats.thread_pool.search.rejected.count
        - elasticsearch.node.stats.thread_pool.search.queue.count
        - elasticsearch.node.stats.thread_pool.write.rejected.count
        - elasticsearch.node.stats.thread_pool.write.queue.count
        - elasticsearch.node.stats.indices.store.size.bytes
        - elasticsearch.node.stats.indices.docs.count
        - elasticsearch.node.id
        - elasticsearch.node.stats.jvm.mem.heap.used.bytes
        - elasticsearch.node.stats.jvm.uptime.ms
        - elasticsearch.node.stats.process.cpu.pct
        size: 10
    rows: '[*]._source'
    fields:
    - node=elasticsearch.node.name
    - master=elasticsearch.node.master
    - roles=elasticsearch.node.roles
    - heap_pct=elasticsearch.node.stats.jvm.mem.heap.used.pct
    - heap_max_bytes=elasticsearch.node.stats.jvm.mem.heap.max.bytes
    - load_1m=elasticsearch.node.stats.os.cpu.load_avg.1m
    - cpu_quota_us=elasticsearch.node.stats.os.cgroup.cpu.cfs.quota.us
    - cpu_throttled=elasticsearch.node.stats.os.cgroup.cpu.stat.times_throttled.count
    - disk_total_bytes=elasticsearch.node.stats.fs.summary.total.bytes
    - disk_avail_bytes=elasticsearch.node.stats.fs.summary.available.bytes
    - search_rejected=elasticsearch.node.stats.thread_pool.search.rejected.count
    - search_queue=elasticsearch.node.stats.thread_pool.search.queue.count
    - write_rejected=elasticsearch.node.stats.thread_pool.write.rejected.count
    - write_queue=elasticsearch.node.stats.thread_pool.write.queue.count
    - store_bytes=elasticsearch.node.stats.indices.store.size.bytes
    - at=@timestamp
    - node_id=elasticsearch.node.id
    - heap_used_bytes=elasticsearch.node.stats.jvm.mem.heap.used.bytes
    - uptime_ms_if_exported=elasticsearch.node.stats.jvm.uptime.ms
    - process_cpu_pct_if_exported=elasticsearch.node.stats.process.cpu.pct
    summary_chars: 4000
cluster_baseline: &cluster_baseline
  tool_id: mcp.elasticsearch.search_query_dsl
  target: parent
  description: 'Parent: earlier cluster_stats for the resolved source UUID, between two hours and fifteen minutes
    ago; not necessarily healthy.'
  params:
    arguments:
      index: .monitoring-es-8-mb
      body:
        query:
          bool:
            filter:
            - term:
                elasticsearch.cluster.id: $rtfMonitoringClusterUuid
            - term:
                metricset.name: cluster_stats
            - range:
                '@timestamp':
                  gte: now-2h
                  lte: now-15m
        sort:
        - '@timestamp': desc
        _source:
        - '@timestamp'
        - elasticsearch.cluster.id
        - cluster_settings.cluster.metadata.display_name
        - elasticsearch.cluster.stats.status
        - elasticsearch.cluster.stats.nodes.count
        - elasticsearch.cluster.stats.nodes.versions
        - elasticsearch.cluster.stats.nodes.fs
        - elasticsearch.cluster.stats.nodes.jvm.memory
        - elasticsearch.cluster.stats.nodes.jvm.max_uptime.ms
        - elasticsearch.cluster.stats.indices.shards
        - elasticsearch.cluster.stats.indices.docs.total
        - elasticsearch.cluster.stats.indices.store.size.bytes
        - elasticsearch.cluster.stats.license.status
        - elasticsearch.cluster.stats.license.type
        - elasticsearch.cluster.stats.license.expiry_date
        size: 1
    fields:
    - latest_sample_at=@timestamp
    - cluster=cluster_settings.cluster.metadata.display_name
    - cluster_uuid=elasticsearch.cluster.id
    - status=elasticsearch.cluster.stats.status
    - nodes=elasticsearch.cluster.stats.nodes.count
    - es_versions=elasticsearch.cluster.stats.nodes.versions
    - shards_total=elasticsearch.cluster.stats.indices.shards.count
    - shards_primary=elasticsearch.cluster.stats.indices.shards.primaries
    - docs=elasticsearch.cluster.stats.indices.docs.total
    - store_bytes=elasticsearch.cluster.stats.indices.store.size.bytes
    - disk_total_bytes=elasticsearch.cluster.stats.nodes.fs.total.bytes
    - disk_avail_bytes=elasticsearch.cluster.stats.nodes.fs.available.bytes
    - heap_used_bytes=elasticsearch.cluster.stats.nodes.jvm.memory.heap.used.bytes
    - heap_max_bytes=elasticsearch.cluster.stats.nodes.jvm.memory.heap.max.bytes
    - max_node_uptime_ms=elasticsearch.cluster.stats.nodes.jvm.max_uptime.ms
    - license=elasticsearch.cluster.stats.license.status
    - license_type=elasticsearch.cluster.stats.license.type
    - license_expiry=elasticsearch.cluster.stats.license.expiry_date
    summary_chars: 4000
    rows: '[*]._source'
latest_monitoring_record: &latest_monitoring_record
  tool_id: mcp.elasticsearch.search_query_dsl
  target: parent
  description: 'Parent: latest retained record of any metric type for the source. Fresh index metrics do not prove
    that node_stats or shard metrics are also fresh.'
  params:
    arguments:
      index: .monitoring-es-8-mb
      body:
        size: 1
        query:
          bool:
            filter:
            - term:
                elasticsearch.cluster.id: $rtfMonitoringClusterUuid
            - range:
                '@timestamp':
                  gte: now-7d
                  lte: now
        sort:
        - '@timestamp': desc
        _source:
        - '@timestamp'
        - metricset.name
        - elasticsearch.cluster.id
        - elasticsearch.node.id
        - elasticsearch.node.name
    summary_chars: 4000
    fields:
    - at=@timestamp
    - metricset=metricset.name
    - uuid=elasticsearch.cluster.id
    - node=elasticsearch.node.name
    rows: '[*]._source'
large_index_candidate: &large_index_candidate
  tool_id: mcp.elasticsearch.search_query_dsl
  target: parent
  description: 'Parent: select ONE recent storage candidate by highest observed total primary-store bytes. This
    is not necessarily the alerted index or the index with the largest individual shard. Child per-shard sizes must
    confirm the candidate.'
  params:
    arguments:
      index: .monitoring-es-8-mb
      body:
        query:
          bool:
            filter:
            - term:
                elasticsearch.cluster.id: $rtfMonitoringClusterUuid
            - term:
                metricset.name: index
            - range:
                '@timestamp':
                  gte: now-15m
            - exists:
                field: elasticsearch.index.primaries.store.size_in_bytes
        collapse:
          field: elasticsearch.index.name
        sort:
        - elasticsearch.index.primaries.store.size_in_bytes: desc
        - '@timestamp': desc
        _source:
        - elasticsearch.index.name
        - elasticsearch.index.status
        - elasticsearch.index.primaries.store.size_in_bytes
        - elasticsearch.index.total.store.size_in_bytes
        - elasticsearch.index.shards.primaries
        - elasticsearch.index.shards.total
        - elasticsearch.index.primaries.docs.count
        - '@timestamp'
        size: 1
    rows: '[*]._source'
    fields:
    - at=@timestamp
    - index=elasticsearch.index.name
    - primary_bytes=elasticsearch.index.primaries.store.size_in_bytes
    - total_bytes=elasticsearch.index.total.store.size_in_bytes
    - primary_shards=elasticsearch.index.shards.primaries
    - total_shards=elasticsearch.index.shards.total
    - docs=elasticsearch.index.primaries.docs.count
    - status=elasticsearch.index.status
    summary_chars: 2500
    bind:
      rtfLargeIndex:
        pick: _source.elasticsearch.index.name
child_health: &child_health
  tool_id: mcp.elasticsearch.cluster_health
  target: child
  description: 'Child: current health and aggregate shard/node counts of the alerting source deployment. This call
    does not depend on monitoring UUID resolution.'
  params:
    arguments:
      level: cluster
    summary_chars: 4000
    fields: &id001
    - cluster=cluster_name
    - status=status
    - timed_out=timed_out
    - nodes=number_of_nodes
    - data_nodes=number_of_data_nodes
    - unassigned=unassigned_shards
    - unassigned_primaries=unassigned_primary_shards
    - active_primaries=active_primary_shards
    - initializing=initializing_shards
    - relocating=relocating_shards
    - pending_tasks=number_of_pending_tasks
parent_health: &parent_health
  tool_id: mcp.elasticsearch.cluster_health
  target: parent
  description: 'Parent: health of the monitoring deployment itself, used only to investigate the collection path.
    Never attribute this status to the child.'
  params:
    arguments:
      level: cluster
    summary_chars: 4000
    fields: *id001
child_nodes_info: &child_nodes_info
  tool_id: mcp.elasticsearch.nodes_info
  target: child
  description: 'Child: node identities, roles and Elasticsearch versions, without extra metric sections. Inspect
    _nodes.failed. Dynamic node IDs use the existing generic summarizer; absent rows in a truncated summary do not
    prove missing nodes.'
  params:
    arguments:
      nodeId: _all
      metric: _none
    summary_chars: 4000
child_cpu_info: &child_cpu_info
  tool_id: mcp.elasticsearch.nodes_info
  target: child
  description: 'Child: processor allocation and node identities. Allocated processors are configuration evidence,
    not proof of the precise Cloud CPU entitlement.'
  params:
    arguments:
      nodeId: _all
      metric: os
    summary_chars: 4000
child_jvm_stats: &child_jvm_stats
  tool_id: mcp.elasticsearch.nodes_stats
  target: child
  description: 'Child: current heap, GC collection times/counts and uptime. Read returned node name/ID and timestamp;
    failed nodes and shortened summaries mean partial coverage. Native counters are cumulative and use different
    field paths from monitoring documents.'
  params:
    arguments:
      metric: jvm
    summary_chars: 4000
child_breaker_stats: &child_breaker_stats
  tool_id: mcp.elasticsearch.nodes_stats
  target: child
  description: 'Child: current circuit breaker estimated usage, limits and cumulative trips. Read returned node
    name/ID and timestamp; failed nodes and shortened summaries mean partial coverage. Native counters are cumulative
    and use different field paths from monitoring documents.'
  params:
    arguments:
      metric: breaker
    summary_chars: 4000
child_cpu_stats: &child_cpu_stats
  tool_id: mcp.elasticsearch.nodes_stats
  target: child
  description: 'Child: current CPU/load, cgroup counters and process CPU. Read returned node name/ID and timestamp;
    failed nodes and shortened summaries mean partial coverage. Native counters are cumulative and use different
    field paths from monitoring documents.'
  params:
    arguments:
      metric: os,process
    summary_chars: 4000
child_disk_stats: &child_disk_stats
  tool_id: mcp.elasticsearch.nodes_stats
  target: child
  description: 'Child: current available disk on each data path and filesystem I/O counters. Read returned node
    name/ID and timestamp; failed nodes and shortened summaries mean partial coverage. Native counters are cumulative
    and use different field paths from monitoring documents.'
  params:
    arguments:
      metric: fs
    summary_chars: 4000
child_pool_stats: &child_pool_stats
  tool_id: mcp.elasticsearch.nodes_stats
  target: child
  description: 'Child: current thread-pool queues/activity/rejections and indexing-pressure counters. Read returned
    node name/ID and timestamp; failed nodes and shortened summaries mean partial coverage. Native counters are
    cumulative and use different field paths from monitoring documents.'
  params:
    arguments:
      metric: thread_pool,indexing_pressure
    summary_chars: 4000
child_index_stats: &child_index_stats
  tool_id: mcp.elasticsearch.nodes_stats
  target: child
  description: 'Child: current per-node cache, fielddata, segments, merge/search/indexing statistics; metric selector
    does not provide a per-index breakdown. Read returned node name/ID and timestamp; failed nodes and shortened
    summaries mean partial coverage. Native counters are cumulative and use different field paths from monitoring
    documents.'
  params:
    arguments:
      metric: indices
    summary_chars: 4000
child_hot_threads: &child_hot_threads
  tool_id: mcp.elasticsearch.nodes_hot_threads
  target: child
  description: 'Child: top CPU thread samples across the selected source deployment. Plain-text stacks are current
    samples; missing activity does not rule out an earlier spike. A shortened summary may omit nodes/stacks.'
  params:
    arguments:
      type: cpu
      threads: 3
      interval: 500ms
    summary_chars: 4000
child_target_hot_threads: &child_target_hot_threads
  tool_id: mcp.elasticsearch.nodes_hot_threads
  target: child
  description: 'Child: focused stacks for the alert node name/ID. Missing $node skips only this optional call; the
    all-node sample remains independent.'
  params:
    arguments:
      nodeId: $node
      type: cpu
      threads: 3
      interval: 500ms
    summary_chars: 4000
child_shards: &child_shards
  tool_id: mcp.elasticsearch.cat_shards
  target: child
  description: 'Child: current shard state, primary/replica flag, placement and store sizes. May return JSON rows
    or CAT text. Do not count only the summarized prefix as the full cluster inventory.'
  params:
    arguments: {}
    summary_chars: 4000
child_cluster_settings: &child_cluster_settings
