- name: ElasticCloudLicenseExpiration
  patterns:
  - License expiration
  - Cluster License expiration check
  - monitoring_alert_license_expiration
  priority: P3
  diagnostic_steps:
  - step: 1
    title: Identify the source cluster and assess evidence freshness
    description: Resolve the exact $cluster display name to one distinct UUID using resolve_cluster. Use only the
      dedicated bound runbook UUID for subsequent source queries; do not fall back to the incoming clusterUuid.
      Zero or multiple candidates cause dependent calls to be NOT RUN. Preserve incoming UUID, rule, node, measured
      value, threshold, duration and alert time as context. Report any incoming/resolved UUID disagreement as an
      identity mismatch. Stale identity data does not establish current health. Match rule and instance in alert
      documents. Missing identity is insufficient evidence, not another incident.
    tool_calls:
    - *identity_candidates
    - *resolve_cluster
    - *rule_alerts
    - *cluster_current
  - step: 2
    title: Compare license status and expiry
    description: Read status, type and expiry from the source snapshot. Parse the supplied date/epoch explicitly
      in UTC; compare against the actual warning window in the alert. A missing expiry is unknown, not automatically
      expired. Compare baseline to see a renewal/change. Do not infer a billing failure from expiry alone.
    tool_calls:
    - *cluster_baseline
  remediation:
  - action: review_cloud_license_status
    description: Ask the Elastic Cloud account/deployment owner to verify subscription/license synchronization and
      any renewal requirement. Use Elastic support if status is unexpected. Do not install or change a license via
      this read-only runbook.
    tool_id: ''
    requires_approval: true
  escalation: Account/deployment owner; urgent if license-dependent features are actually impaired.
  follow_up:
  - A fresh source license observation reflects the expected state and the correct rule recovered.
- name: ElasticCloudMissingMonitoringData
  patterns:
  - Missing monitoring data
  - monitoring_alert_missing_monitoring_data
  priority: P2
  diagnostic_steps:
  - step: 1
    title: Identify the source cluster and assess evidence freshness
    description: Resolve the exact $cluster display name to one distinct UUID using resolve_cluster. Use only the
      dedicated bound runbook UUID for subsequent source queries; do not fall back to the incoming clusterUuid.
      Zero or multiple candidates cause dependent calls to be NOT RUN. Preserve incoming UUID, rule, node, measured
      value, threshold, duration and alert time as context. Report any incoming/resolved UUID disagreement as an
      identity mismatch. Stale identity data does not establish current health. Match rule and instance in alert
      documents. Missing identity is insufficient evidence, not another incident.
    tool_calls:
    - *identity_candidates
    - *resolve_cluster
    - *rule_alerts
    - *cluster_current
  - step: 2
    title: Check freshness separately for each metricset and node
    description: A stale cluster_stats stream alone is not proof that every metricset stopped. Compare latest_any_metric,
      cluster_current, newest shard sample, each node timestamp and the alert expected collection interval. The
      10-node cap prevents claiming missing nodes from list absence. If the cluster UUID cannot be resolved, still
      retain the alert reason and use catalog collector checks; do not turn placeholder failures into incidents.
    tool_calls:
    - *latest_any_metric
    - *nodes_latest
    - *nodes_baseline
    - *target_node_latest
    - *latest_shard_sample
  - step: 3
    title: Separate collector-side trouble from source shipping trouble
    description: Use source logs if available. The evidence catalog provides collector cluster-health/node-stats
      checks plus freshness grouped by source cluster and metricset. Multiple sources becoming stale together supports
      a shared collection issue; one affected source supports a source/transport/collection hypothesis. These are
      hypotheses unless direct evidence confirms them. Monitoring loss does not prove the source is down.
    tool_calls:
    - *source_logs
  remediation:
  - action: investigate_monitoring_path
    description: Owner should check monitoring collection/export configuration, permissions, network path, retention
      and collector capacity. All automated calls remain on commotion-observability. If the collector is healthy
      and only one source is stale, request owner investigation of that source without switching the MCP connection.
    tool_id: ''
    requires_approval: true
  escalation: Deployment/observability owner; prioritize broad visibility loss or simultaneous application impact.
  follow_up:
  - Confirm fresh samples resume for the affected metricsets and nodes over multiple collection intervals, then
    matching rule recovery.
escalation: Source deployment owner for evidence-supported source incidents; observability owner for collection-path
  issues. Action suggestions are manual and subject to the owner change process. The runbook executes no remediation.
follow_up:
- Use the guide and companion evidence catalog for incident-time windows, ES|QL summaries, source-index/shard drilldowns,
  schema discovery and collector checks.
- Validate new fields/queries and response adapters with read-only acceptance checks before enabling this revision.
- The 13 rules now have separate entries; generic version mismatch/rejections-only names are ambiguous and must
  not be silently routed to one product/pool.
