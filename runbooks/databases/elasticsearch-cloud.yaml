  description: Most recent cluster_stats within fifteen minutes. Cite the exact timestamp; an empty result does
    not prove downtime.
  params:
    arguments:
      index: .monitoring-es-8-mb
      body:
        size: 1
        query:
          bool:
            filter:
            - term:
                elasticsearch.cluster.id: $rtfRunbookResolvedClusterUuid
            - term:
                metricset.name: cluster_stats
            - range:
                '@timestamp':
                  gte: now-15m
                  lte: now
        sort:
        - '@timestamp': desc
        _source: *id001
    rows: '[*]._source'
    fields: &id002
    - latest_sample_at=@timestamp
    - cluster=cluster_settings.cluster.metadata.display_name
    - cluster_uuid=elasticsearch.cluster.id
    - status=elasticsearch.cluster.stats.status
    - nodes=elasticsearch.cluster.stats.nodes.count
    - es_versions=elasticsearch.cluster.stats.nodes.versions
    - shards_total=elasticsearch.cluster.stats.indices.shards.count
    - shards_primary=elasticsearch.cluster.stats.indices.shards.primaries
    - docs=elasticsearch.cluster.stats.indices.docs.total
    - store_bytes=elasticsearch.cluster.stats.indices.store.size.bytes
    - disk_total_bytes=elasticsearch.cluster.stats.nodes.fs.total.bytes
    - disk_avail_bytes=elasticsearch.cluster.stats.nodes.fs.available.bytes
    - heap_used_bytes=elasticsearch.cluster.stats.nodes.jvm.memory.heap.used.bytes
    - heap_max_bytes=elasticsearch.cluster.stats.nodes.jvm.memory.heap.max.bytes
    - max_node_uptime_ms=elasticsearch.cluster.stats.nodes.jvm.max_uptime.ms
    - license=elasticsearch.cluster.stats.license.status
    - license_type=elasticsearch.cluster.stats.license.type
    - license_expiry=elasticsearch.cluster.stats.license.expiry_date
    - allocation_settings_if_exported=cluster_settings.cluster.routing.allocation
    summary_chars: 12000
cluster_baseline: &cluster_baseline
  tool_id: mcp.elasticsearch.search_query_dsl
  description: One earlier cluster snapshot, at least fifteen minutes old, for comparison with current. This is
    a sample, not a complete incident timeline.
  params:
    arguments:
      index: .monitoring-es-8-mb
      body:
        size: 1
        query:
          bool:
            filter:
            - term:
                elasticsearch.cluster.id: $rtfRunbookResolvedClusterUuid
            - term:
                metricset.name: cluster_stats
            - range:
                '@timestamp':
                  gte: now-2h
                  lte: now-15m
        sort:
        - '@timestamp': desc
        _source: *id001
    rows: '[*]._source'
    fields: *id002
    summary_chars: 12000
cluster_unhealthy_history: &cluster_unhealthy_history
  tool_id: mcp.elasticsearch.search_query_dsl
  description: Up to ten yellow/red observations during the last hour. These are historical observations; use cluster_current
    to assess the latest recorded status.
  params:
    arguments:
      index: .monitoring-es-8-mb
      body:
        size: 10
        query:
          bool:
            filter:
            - term:
                elasticsearch.cluster.id: $rtfRunbookResolvedClusterUuid
            - term:
                metricset.name: cluster_stats
            - range:
                '@timestamp':
                  gte: now-1h
                  lte: now
            - terms:
                elasticsearch.cluster.stats.status:
                - yellow
                - red
        sort:
        - '@timestamp': desc
        _source: *id001
    rows: '[*]._source'
    fields: *id002
    summary_chars: 12000
latest_any_metric: &latest_any_metric
  tool_id: mcp.elasticsearch.search_query_dsl
  description: Latest retained document of ANY Elasticsearch metricset for the resolved source UUID. Distinguishes
    a missing cluster_stats stream from all monitored metricsets being stale.
  params:
    arguments:
      index: .monitoring-es-8-mb
      body:
        size: 1
        query:
          bool:
            filter:
            - term:
                elasticsearch.cluster.id: $rtfRunbookResolvedClusterUuid
            - range:
                '@timestamp':
                  gte: now-7d
                  lte: now
        sort:
        - '@timestamp': desc
        _source:
        - '@timestamp'
        - metricset.name
        - event.dataset
        - elasticsearch.cluster.id
        - elasticsearch.node.id
        - elasticsearch.node.name
    rows: '[*]._source'
    fields:
    - at=@timestamp
    - metricset=metricset.name
    - dataset=event.dataset
    - cluster_uuid=elasticsearch.cluster.id
    - node_id=elasticsearch.node.id
    - node=elasticsearch.node.name
    summary_chars: 12000
rule_alerts: &rule_alerts
  tool_id: mcp.elasticsearch.search_query_dsl
  description: 'Recent related alert records, plus still-active records even if older than seven days. The tested
    reason.text phrase match provides candidates: confirm the same cluster, exact rule, node/instance and incident.
    Empty results or ten capped results never prove no alert exists. Recovery requires the matching instance and
    a recorded end/recovery time.'
  params:
    arguments:
      index: .internal.alerts-default.alerts-default-*
      body:
        size: 10
        query:
          bool:
            filter:
            - match_phrase:
                kibana.alert.reason.text: $cluster
            - bool:
                should:
                - range:
                    '@timestamp':
                      gte: now-7d
                      lte: now
                - term:
                    kibana.alert.status: active
                minimum_should_match: 1
        sort:
        - '@timestamp': desc
        _source:
        - '@timestamp'
        - kibana.alert.uuid
        - kibana.alert.instance.id
        - kibana.alert.rule.name
        - kibana.alert.rule.rule_type_id
        - kibana.alert.rule.uuid
        - kibana.alert.status
        - kibana.alert.start
        - kibana.alert.end
        - kibana.alert.last_detected
        - kibana.alert.flapping
        - kibana.alert.reason
        - kibana.alert.rule.parameters
    rows: '[*]._source'
    fields:
    - at=@timestamp
    - alert_uuid=kibana.alert.uuid
    - instance=kibana.alert.instance.id
    - rule=kibana.alert.rule.name
    - rule_type=kibana.alert.rule.rule_type_id
    - status=kibana.alert.status
    - start=kibana.alert.start
    - end=kibana.alert.end
    - last_detected=kibana.alert.last_detected
    - flapping=kibana.alert.flapping
    - reason=kibana.alert.reason
    - parameters_if_exported=kibana.alert.rule.parameters
    summary_chars: 12000
nodes_latest: &nodes_latest
  tool_id: mcp.elasticsearch.search_query_dsl
  description: 'Actual latest node_stats per node: collapse by node ID, sort by timestamp descending. This is a
    capped sample of at most ten nodes, not the full inventory when the cap is reached.'
  params:
    arguments:
      index: .monitoring-es-8-mb
      body:
        size: 10
        query:
          bool:
            filter:
            - term:
                elasticsearch.cluster.id: $rtfRunbookResolvedClusterUuid
            - term:
                metricset.name: node_stats
            - range:
                '@timestamp':
                  gte: now-10m
                  lte: now
            - exists:
                field: elasticsearch.node.id
        sort:
        - '@timestamp': desc
        _source: &id003
        - '@timestamp'
        - elasticsearch.node.name
        - elasticsearch.node.master
        - elasticsearch.node.roles
        - elasticsearch.node.stats.jvm.mem.heap.used.pct
        - elasticsearch.node.stats.jvm.mem.heap.max.bytes
        - elasticsearch.node.stats.os.cpu.load_avg.1m
        - elasticsearch.node.stats.os.cgroup.cpu.cfs.quota.us
        - elasticsearch.node.stats.os.cgroup.cpu.stat.times_throttled.count
        - elasticsearch.node.stats.fs.summary.total.bytes
        - elasticsearch.node.stats.fs.summary.available.bytes
        - elasticsearch.node.stats.thread_pool.search.rejected.count
        - elasticsearch.node.stats.thread_pool.search.queue.count
        - elasticsearch.node.stats.thread_pool.write.rejected.count
        - elasticsearch.node.stats.thread_pool.write.queue.count
        - elasticsearch.node.stats.indices.store.size.bytes
        - elasticsearch.node.stats.indices.docs.count
        - elasticsearch.node.id
        - elasticsearch.node.stats.jvm.mem.heap.used.bytes
        - elasticsearch.node.stats.jvm.uptime.ms
        - node_stats.jvm.uptime_in_millis
        - elasticsearch.node.stats.jvm.gc
        - elasticsearch.node.stats.indices.fielddata
        - elasticsearch.node.stats.indices.query_cache
        - elasticsearch.node.stats.indices.request_cache
        - elasticsearch.node.stats.indices.segments
        - elasticsearch.node.stats.breakers
        - elasticsearch.node.stats.process.cpu.pct
        - elasticsearch.node.stats.os.cgroup.cpuacct.usage.ns
        - elasticsearch.node.stats.os.cgroup.cpu.stat.elapsed_periods.count
        - elasticsearch.node.stats.os.cgroup.cpu.stat.time_throttled.ns
        - elasticsearch.node.stats.os.cgroup.cpu.cfs.period.us
        - elasticsearch.node.stats.indices.indexing
        - elasticsearch.node.stats.indices.search
        collapse:
          field: elasticsearch.node.id
    rows: '[*]._source'
    fields: &id004
    - at=@timestamp
    - node_id=elasticsearch.node.id
    - node=elasticsearch.node.name
    - roles=elasticsearch.node.roles
    - heap_used_bytes=elasticsearch.node.stats.jvm.mem.heap.used.bytes
    - heap_max_bytes=elasticsearch.node.stats.jvm.mem.heap.max.bytes
    - heap_raw_pct=elasticsearch.node.stats.jvm.mem.heap.used.pct
    - uptime_if_exported=elasticsearch.node.stats.jvm.uptime.ms
    - legacy_uptime_if_exported=node_stats.jvm.uptime_in_millis
    - load_1m=elasticsearch.node.stats.os.cpu.load_avg.1m
    - process_cpu_raw_pct=elasticsearch.node.stats.process.cpu.pct
    - cpu_usage_ns=elasticsearch.node.stats.os.cgroup.cpuacct.usage.ns
    - cpu_quota_us=elasticsearch.node.stats.os.cgroup.cpu.cfs.quota.us
    - cpu_period_us_if_exported=elasticsearch.node.stats.os.cgroup.cpu.cfs.period.us
    - cpu_elapsed_periods=elasticsearch.node.stats.os.cgroup.cpu.stat.elapsed_periods.count
    - cpu_throttled_periods=elasticsearch.node.stats.os.cgroup.cpu.stat.times_throttled.count
    - disk_total_bytes=elasticsearch.node.stats.fs.summary.total.bytes
    - disk_avail_bytes=elasticsearch.node.stats.fs.summary.available.bytes
    - search_rejected=elasticsearch.node.stats.thread_pool.search.rejected.count
    - search_queue=elasticsearch.node.stats.thread_pool.search.queue.count
    - write_rejected=elasticsearch.node.stats.thread_pool.write.rejected.count
    - write_queue=elasticsearch.node.stats.thread_pool.write.queue.count
    - store_bytes=elasticsearch.node.stats.indices.store.size.bytes
    - gc_if_exported=elasticsearch.node.stats.jvm.gc
    - fielddata_if_exported=elasticsearch.node.stats.indices.fielddata
    - query_cache_if_exported=elasticsearch.node.stats.indices.query_cache
    - request_cache_if_exported=elasticsearch.node.stats.indices.request_cache
    - breakers_if_exported=elasticsearch.node.stats.breakers
    summary_chars: 12000
nodes_baseline: &nodes_baseline
  tool_id: mcp.elasticsearch.search_query_dsl
  description: Latest sample per node in an earlier 15-to-45-minute window. Compare by UUID plus node ID, never
    by node name alone. A capped list cannot establish that a node is absent.
  params:
    arguments:
      index: .monitoring-es-8-mb
      body:
        size: 10
        query:
          bool:
            filter:
            - term:
                elasticsearch.cluster.id: $rtfRunbookResolvedClusterUuid
            - term:
                metricset.name: node_stats
            - range:
                '@timestamp':
                  gte: now-45m
                  lte: now-15m
            - exists:
                field: elasticsearch.node.id
        sort:
        - '@timestamp': desc
        _source: *id003
        collapse:
          field: elasticsearch.node.id
    rows: '[*]._source'
    fields: *id004
    summary_chars: 12000
target_node_latest: &target_node_latest
  tool_id: mcp.elasticsearch.search_query_dsl
  description: Directly fetch the alert node even when it is not in the top ten cluster rows. $node is the name
    or ID supplied by the alert; if absent, skip this call and use the cluster sample with its limit. A seven-day
    result is last-known, not necessarily current.
  params:
    arguments:
      index: .monitoring-es-8-mb
      body:
        size: 1
        query:
          bool:
            filter:
            - term:
                elasticsearch.cluster.id: $rtfRunbookResolvedClusterUuid
            - term:
                metricset.name: node_stats
            - range:
                '@timestamp':
                  gte: now-7d
                  lte: now
            - &id005
              bool:
                should:
                - term:
                    elasticsearch.node.name: $node
                - term:
                    elasticsearch.node.id: $node
                minimum_should_match: 1
        sort:
        - '@timestamp': desc
        _source: *id003
    rows: '[*]._source'
    fields: *id004
    summary_chars: 12000
target_node_recent: &target_node_recent
  tool_id: mcp.elasticsearch.search_query_dsl
  description: 'Latest ten samples for the alert node within fifteen minutes. Ten hits may cover only seconds: report
    the actual first/last timestamps, not a guaranteed fifteen-minute duration. Order chronologically for calculations.'
  params:
    arguments:
      index: .monitoring-es-8-mb
      body:
        size: 10
        query:
          bool:
            filter:
            - term:
                elasticsearch.cluster.id: $rtfRunbookResolvedClusterUuid
            - term:
                metricset.name: node_stats
            - range:
                '@timestamp':
                  gte: now-15m
                  lte: now
            - *id005
        sort:
        - '@timestamp': desc
        _source: *id003
    rows: '[*]._source'
    fields: *id004
    summary_chars: 12000
target_node_baseline: &target_node_baseline
  tool_id: mcp.elasticsearch.search_query_dsl
  description: Latest available sample for the alert node between fifteen and forty-five minutes ago. Use only if
    node identity and counter epoch match the current sample.
  params:
    arguments:
      index: .monitoring-es-8-mb
      body:
        size: 1
        query:
          bool:
            filter:
            - term:
                elasticsearch.cluster.id: $rtfRunbookResolvedClusterUuid
            - term:
                metricset.name: node_stats
            - range:
                '@timestamp':
                  gte: now-45m
                  lte: now-15m
            - *id005
        sort:
        - '@timestamp': desc
        _source: *id003
    rows: '[*]._source'
    fields: *id004
    summary_chars: 12000
nodes_heap_peaks: &nodes_heap_peaks
  tool_id: mcp.elasticsearch.search_query_dsl
  description: Highest observed heap per node within fifteen minutes; a PEAK, not current usage.
  params:
    arguments:
      index: .monitoring-es-8-mb
      body:
        size: 10
        query:
          bool:
            filter:
            - term:
                elasticsearch.cluster.id: $rtfRunbookResolvedClusterUuid
            - term:
