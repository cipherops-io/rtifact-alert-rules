  params:
    arguments:
      index: .monitoring-es-8-mb
      body:
        size: 10
        query:
          bool:
            filter:
            - term:
                elasticsearch.cluster.id: $rtfRunbookResolvedClusterUuid
            - term:
                metricset.name: node_stats
            - range:
                '@timestamp':
                  gte: now-15m
                  lte: now
            - exists:
                field: elasticsearch.node.stats.fs.summary.available.bytes
            - exists:
                field: elasticsearch.node.id
        sort:
        - elasticsearch.node.stats.fs.summary.available.bytes: asc
        - '@timestamp': desc
        _source: *id003
        collapse:
          field: elasticsearch.node.id
    rows: '[*]._source'
    fields: *id004
    summary_chars: 12000
indices_latest: &indices_latest
  tool_id: mcp.elasticsearch.search_query_dsl
  description: Latest document per index within fifteen minutes. At most ten indices. Shard totals are observed
    monitoring statistics, not proof of configured number_of_replicas.
  params:
    arguments:
      index: .monitoring-es-8-mb
      body:
        size: 10
        query:
          bool:
            filter:
            - term:
                elasticsearch.cluster.id: $rtfRunbookResolvedClusterUuid
            - term:
                metricset.name: index
            - range:
                '@timestamp':
                  gte: now-15m
                  lte: now
            - exists:
                field: elasticsearch.index.name
        sort:
        - '@timestamp': desc
        _source: &id006
        - '@timestamp'
        - elasticsearch.cluster.id
        - elasticsearch.index.name
        - elasticsearch.index.uuid
        - elasticsearch.index.status
        - elasticsearch.index.primaries.store.size_in_bytes
        - elasticsearch.index.total.store.size_in_bytes
        - elasticsearch.index.shards.primaries
        - elasticsearch.index.shards.total
        - elasticsearch.index.primaries.docs.count
        collapse:
          field: elasticsearch.index.name
    rows: '[*]._source'
    fields: &id007
    - at=@timestamp
    - index=elasticsearch.index.name
    - index_uuid=elasticsearch.index.uuid
    - status=elasticsearch.index.status
    - primary_bytes=elasticsearch.index.primaries.store.size_in_bytes
    - total_bytes=elasticsearch.index.total.store.size_in_bytes
    - primary_shards=elasticsearch.index.shards.primaries
    - observed_total_shards=elasticsearch.index.shards.total
    - docs=elasticsearch.index.primaries.docs.count
    summary_chars: 12000
large_index_observations: &large_index_observations
  tool_id: mcp.elasticsearch.search_query_dsl
  description: Ten indices with the highest OBSERVED primary bytes in the last fifteen minutes. Candidate contributors
    to storage, not evidence of expensive queries or a bad ILM policy. Each row carries its observation time.
  params:
    arguments:
      index: .monitoring-es-8-mb
      body:
        size: 10
        query:
          bool:
            filter:
            - term:
                elasticsearch.cluster.id: $rtfRunbookResolvedClusterUuid
            - term:
                metricset.name: index
            - range:
                '@timestamp':
                  gte: now-15m
                  lte: now
            - exists:
                field: elasticsearch.index.primaries.store.size_in_bytes
        sort:
        - elasticsearch.index.primaries.store.size_in_bytes: desc
        - '@timestamp': desc
        _source: *id006
        collapse:
          field: elasticsearch.index.name
    rows: '[*]._source'
    fields: *id007
    summary_chars: 12000
large_average_shard_observations: &large_average_shard_observations
  tool_id: mcp.elasticsearch.search_query_dsl
  description: Candidates ranked by observed average PRIMARY bytes per primary shard, not by whole-index size. Historical
    peaks within fifteen minutes; average is not the largest individual shard. The read-only script sort requires
    the tested numeric fields and script sorting to be permitted; a script failure is an evidence gap, not no oversized
    shards.
  params:
    arguments:
      index: .monitoring-es-8-mb
      body:
        size: 10
        query:
          bool:
            filter:
            - term:
                elasticsearch.cluster.id: $rtfRunbookResolvedClusterUuid
            - term:
                metricset.name: index
            - range:
                '@timestamp':
                  gte: now-15m
                  lte: now
            - exists:
                field: elasticsearch.index.primaries.store.size_in_bytes
            - exists:
                field: elasticsearch.index.shards.primaries
        sort:
        - _script:
            type: number
            script:
              lang: painless
              source: if (doc['elasticsearch.index.shards.primaries'].size()==0 || doc['elasticsearch.index.primaries.store.size_in_bytes'].size()==0
                || doc['elasticsearch.index.shards.primaries'].value<=0) return -1; return (double)doc['elasticsearch.index.primaries.store.size_in_bytes'].value
                / doc['elasticsearch.index.shards.primaries'].value;
            order: desc
        - '@timestamp': desc
        _source: *id006
        collapse:
          field: elasticsearch.index.name
    rows: '[*]._source'
    fields: *id007
    summary_chars: 12000
nongreen_index_history: &nongreen_index_history
  tool_id: mcp.elasticsearch.search_query_dsl
  description: Recent non-green INDEX OBSERVATIONS, not a latest-state inventory. Filtering before collapse can
    retain old problems after recovery; corroborate using current cluster status and a direct latest-index query
    in the evidence catalog.
  params:
    arguments:
      index: .monitoring-es-8-mb
      body:
        size: 10
        query:
          bool:
            filter:
            - term:
                elasticsearch.cluster.id: $rtfRunbookResolvedClusterUuid
            - term:
                metricset.name: index
            - range:
                '@timestamp':
                  gte: now-15m
                  lte: now
            - terms:
                elasticsearch.index.status:
                - yellow
                - red
        sort:
        - '@timestamp': desc
        _source: *id006
        collapse:
          field: elasticsearch.index.name
    rows: '[*]._source'
    fields: *id007
    summary_chars: 12000
latest_shard_sample: &latest_shard_sample
  tool_id: mcp.elasticsearch.search_query_dsl
  description: Timestamp of the newest retained shard observation. It is one row, not proof that every shard has
    been observed or that a batch is complete.
  params:
    arguments:
      index: .monitoring-es-8-mb
      body:
        size: 1
        query:
          bool:
            filter:
            - term:
                elasticsearch.cluster.id: $rtfRunbookResolvedClusterUuid
            - term:
                metricset.name: shard
            - range:
                '@timestamp':
                  gte: now-1h
                  lte: now
        sort:
        - '@timestamp': desc
        _source: &id008
        - '@timestamp'
        - elasticsearch.cluster.id
        - elasticsearch.index.name
        - elasticsearch.index.uuid
        - elasticsearch.shard.number
        - elasticsearch.shard.primary
        - elasticsearch.shard.state
        - elasticsearch.node.id
        - elasticsearch.node.name
    rows: '[*]._source'
    fields: &id009
    - at=@timestamp
    - index=elasticsearch.index.name
    - index_uuid=elasticsearch.index.uuid
    - shard=elasticsearch.shard.number
    - primary=elasticsearch.shard.primary
    - state=elasticsearch.shard.state
    - node_id=elasticsearch.node.id
    - node=elasticsearch.node.name
    summary_chars: 12000
nonstarted_shard_history: &nonstarted_shard_history
  tool_id: mcp.elasticsearch.search_query_dsl
  description: Up to ten recent non-STARTED shard observations, with no per-index collapse. May include repeated
    observations and INITIALIZING/RELOCATING states. UNASSIGNED alone means unassigned. These are historical candidates
    until a newer matching shard observation or fresh cluster status corroborates them.
  params:
    arguments:
      index: .monitoring-es-8-mb
      body:
        size: 10
        query:
          bool:
            filter:
            - term:
                elasticsearch.cluster.id: $rtfRunbookResolvedClusterUuid
            - term:
                metricset.name: shard
            - range:
                '@timestamp':
                  gte: now-1h
                  lte: now
            - exists:
                field: elasticsearch.shard.state
            must_not:
            - term:
                elasticsearch.shard.state: STARTED
        sort:
        - '@timestamp': desc
        - elasticsearch.shard.primary: desc
        _source: *id008
    rows: '[*]._source'
    fields: *id009
    summary_chars: 12000
source_logs: &source_logs
  tool_id: mcp.elasticsearch.search_query_dsl
  description: Optional exported source-cluster log evidence. Only exact UUID matches are accepted. Zero hits can
    mean the cluster field is different or logs are not collected; never treat this as proof of no errors. Data-stream
    absence/403 is an evidence gap; other metric queries continue.
  params:
    arguments:
      index: elastic-cloud-logs-8
      body:
        size: 10
        query:
          bool:
            filter:
            - range:
                '@timestamp':
                  gte: now-1h
                  lte: now
            - bool:
                should:
                - term:
                    elasticsearch.cluster.id: $rtfRunbookResolvedClusterUuid
                - term:
                    elasticsearch.cluster.uuid: $rtfRunbookResolvedClusterUuid
                - term:
                    cluster.uuid: $rtfRunbookResolvedClusterUuid
                - term:
                    cluster_uuid: $rtfRunbookResolvedClusterUuid
                minimum_should_match: 1
            - bool:
                should:
                - terms:
                    log.level:
                    - WARN
                    - ERROR
                    - FATAL
                    - warn
                    - error
                    - fatal
                - match_phrase:
                    message: node-left
                - match_phrase:
                    message: node-join
                - match_phrase:
                    message: gc overhead
                minimum_should_match: 1
        sort:
        - '@timestamp': desc
        _source:
        - '@timestamp'
        - message
        - log.level
        - event.dataset
        - elasticsearch.cluster.id
        - elasticsearch.cluster.uuid
        - cluster.uuid
        - cluster_uuid
        - elasticsearch.node.id
        - elasticsearch.node.name
        - error.type
        - error.message
    rows: '[*]._source'
    fields:
    - at=@timestamp
    - level=log.level
    - dataset=event.dataset
    - node=elasticsearch.node.name
    - node_id=elasticsearch.node.id
    - message=message
    - error_type=error.type
    - error_message=error.message
    summary_chars: 12000
kibana_source_versions: &kibana_source_versions
  tool_id: mcp.elasticsearch.search_query_dsl
  description: Optional source-associated kibana version observations, at most ten raw rows. Exact source UUID filter.
    Discover actual schema before concluding absence; never compare agent.version. Deduplicate to latest per instance
    before comparing concurrent versions. Repeated rows may cover only one instance.
  params:
    arguments:
      index: .monitoring-kibana-8-mb
      body:
        size: 10
        query:
          bool:
            filter:
            - range:
                '@timestamp':
                  gte: now-15m
                  lte: now
            - bool:
                should:
                - term:
                    elasticsearch.cluster.id: $rtfRunbookResolvedClusterUuid
                - term:
                    cluster_uuid: $rtfRunbookResolvedClusterUuid
                - term:
                    kibana.stats.elasticsearch.cluster.id: $rtfRunbookResolvedClusterUuid
                minimum_should_match: 1
        sort:
        - '@timestamp': desc
        _source:
        - '@timestamp'
        - service.id
        - service.name
        - service.version
        - kibana.stats.uuid
        - kibana.stats.version
        - kibana.settings.uuid
        - kibana.settings.version
        - elasticsearch.cluster.id
        - cluster_uuid
    rows: '[*]._source'
    fields:
    - at=@timestamp
    - instance=service.id
    - service=service.name
    - version=service.version
    - legacy_instance=kibana.stats.uuid
    - legacy_version=kibana.stats.version
    - settings_instance=kibana.settings.uuid
    - settings_version=kibana.settings.version
    summary_chars: 12000
logstash_source_versions: &logstash_source_versions
  tool_id: mcp.elasticsearch.search_query_dsl
  description: Optional source-associated logstash version observations, at most ten raw rows. Exact source UUID
    filter. Discover actual schema before concluding absence; never compare agent.version. Deduplicate to latest
    per instance before comparing concurrent versions. Repeated rows may cover only one instance.
  params:
    arguments:
      index: .monitoring-logstash-8-mb
      body:
        size: 10
        query:
          bool:
            filter:
            - range:
                '@timestamp':
                  gte: now-15m
                  lte: now
            - bool:
                should:
                - term:
                    elasticsearch.cluster.id: $rtfRunbookResolvedClusterUuid
                - term:
                    cluster_uuid: $rtfRunbookResolvedClusterUuid
                - term:
                    logstash.elasticsearch.cluster.id: $rtfRunbookResolvedClusterUuid
                minimum_should_match: 1
        sort:
        - '@timestamp': desc
        _source:
        - '@timestamp'
        - service.id
        - service.name
        - service.version
        - logstash.node.id
        - logstash.node.version
        - logstash.node.stats.logstash.uuid
        - logstash.node.stats.logstash.version
        - logstash.elasticsearch.cluster.id
        - cluster_uuid
    rows: '[*]._source'
    fields:
    - at=@timestamp
    - instance=service.id
    - service=service.name
    - version=service.version
    - legacy_instance=logstash.node.id
    - legacy_version=logstash.node.version
    - stats_instance=logstash.node.stats.logstash.uuid
    - stats_version=logstash.node.stats.logstash.version
    summary_chars: 12000
common_alerts:
- name: ElasticCloudClusterHealth
  patterns:
  - Cluster health check
  - Cluster health rule
  - monitoring_alert_cluster_health
  priority: P2
  diagnostic_steps:
  - step: 1
    title: Identify the source cluster and assess evidence freshness
    description: Resolve the exact $cluster display name to one distinct UUID using resolve_cluster. Use only the
      dedicated bound runbook UUID for subsequent source queries; do not fall back to the incoming clusterUuid.
      Zero or multiple candidates cause dependent calls to be NOT RUN. Preserve incoming UUID, rule, node, measured
      value, threshold, duration and alert time as context. Report any incoming/resolved UUID disagreement as an
      identity mismatch. Stale identity data does not establish current health. Match rule and instance in alert
      documents. Missing identity is insufficient evidence, not another incident.
    tool_calls:
    - *identity_candidates
    - *resolve_cluster
    - *rule_alerts
    - *cluster_current
  - step: 2
    title: Compare earlier health with the latest observation
    description: Report current and earlier status, counts and timestamps. Green at a fresh timestamp is evidence
      of recovery of cluster health at that instant. Confirm the matching alert status separately. Missing or capped
      history does not establish duration or prove that the source is healthy.
    tool_calls:
    - *cluster_baseline
    - *cluster_unhealthy_history
  - step: 3
    title: Identify shard symptoms and possible resource constraints
    description: Distinguish UNASSIGNED from INITIALIZING and RELOCATING. All non-started rows are time-stamped
      historical observations; do not claim the list is current or complete. Do not infer configured replica count
      from observed shard totals. Count only data roles among actually covered nodes. Low disk, node-count changes
      and source log messages can support hypotheses; exact allocation deciders and allocation settings of the source
      may be unavailable. Never call the monitoring deployment allocation-explain API to diagnose these source shards.
    tool_calls:
    - *latest_shard_sample
    - *nonstarted_shard_history
    - *nongreen_index_history
    - *nodes_latest
    - *nodes_baseline
    - *source_logs
  remediation:
  - action: review_node_or_capacity_issue
    description: Owner should investigate an evidenced missing node, resource shortage or placement constraint.
      Restore capacity or wait for an identified planned transition. Adding an eligible data node may help replica
      placement; it is not proof that placement will succeed.
    tool_id: ''
    requires_approval: true
  - action: review_replica_policy
    description: 'Only if the SOURCE index replica settings and eligible-node constraints are independently confirmed:
      owner may add suitable capacity or deliberately change replicas. Reducing replicas reduces redundancy and
      is not an automatic fix.'
    tool_id: ''
    requires_approval: true
  - action: investigate_unavailable_primaries
    description: For confirmed source RED health, identify affected primary data and recovery options with the owner.
      Do not force-allocate stale primaries or suggest deleting data on this evidence alone.
    tool_id: ''
    requires_approval: true
  escalation: Urgent for fresh RED health or confirmed unavailable data/write impact; yellow is reduced redundancy.
    Raise severity using actual impact.
  follow_up:
  - Verify fresh source cluster_stats and the matching alert recovery. Treat stale shards separately.
- name: ElasticCloudNodesChanged
  patterns:
  - Nodes changed check
  - Nodes changed
  - monitoring_alert_nodes_changed
  priority: P3
  diagnostic_steps:
  - step: 1
    title: Identify the source cluster and assess evidence freshness
    description: Resolve the exact $cluster display name to one distinct UUID using resolve_cluster. Use only the
      dedicated bound runbook UUID for subsequent source queries; do not fall back to the incoming clusterUuid.
      Zero or multiple candidates cause dependent calls to be NOT RUN. Preserve incoming UUID, rule, node, measured
      value, threshold, duration and alert time as context. Report any incoming/resolved UUID disagreement as an
      identity mismatch. Stale identity data does not establish current health. Match rule and instance in alert
      documents. Missing identity is insufficient evidence, not another incident.
    tool_calls:
    - *identity_candidates
    - *resolve_cluster
    - *rule_alerts
    - *cluster_current
  - step: 2
    title: Compare node identities before and after
    description: Compare source UUID plus node ID across current and earlier samples, backed by cluster node counts.
      Node names can be reused. A node absent from a capped or stale list is NOT proven departed. Smaller maximum
      uptime does not identify a planned upgrade or prove every node restarted.
    tool_calls:
    - *cluster_baseline
    - *nodes_baseline
    - *nodes_latest
    - *target_node_latest
  - step: 3
    title: Look for an explanation and health impact
    description: Look for node-left/node-join, disconnect, restart or resource messages from this source in exported
      logs. A plan change is only confirmed by owner evidence or explicit event records; no logs or no related alert
      does not prove maintenance was planned.
    tool_calls:
    - *source_logs
    - *cluster_unhealthy_history
  remediation:
  - action: verify_change_and_restore_capacity
    description: Owner should check planned maintenance and expected topology. If loss is unplanned or health is
      degraded, investigate the missing instance and resource symptoms. This runbook does not connect to parent
      deployments.
    tool_id: ''
    requires_approval: true
  escalation: Deployment owner for sustained loss, unavailable data or unexplained change; informational if recovery
    and the planned change are both confirmed.
  follow_up:
  - Compare fresh counts and identities with expected topology; confirm recovered rule state.
- name: ElasticCloudJvmMemoryHigh
  patterns:
  - JVM Memory Usage
  - Memory Usage (JVM)
  - monitoring_alert_jvm_memory_usage
  priority: P2
  diagnostic_steps:
  - step: 1
    title: Identify the source cluster and assess evidence freshness
    description: Resolve the exact $cluster display name to one distinct UUID using resolve_cluster. Use only the
      dedicated bound runbook UUID for subsequent source queries; do not fall back to the incoming clusterUuid.
      Zero or multiple candidates cause dependent calls to be NOT RUN. Preserve incoming UUID, rule, node, measured
      value, threshold, duration and alert time as context. Report any incoming/resolved UUID disagreement as an
      identity mismatch. Stale identity data does not establish current health. Match rule and instance in alert
      documents. Missing identity is insufficient evidence, not another incident.
    tool_calls:
    - *identity_candidates
    - *resolve_cluster
    - *rule_alerts
    - *cluster_current
  - step: 2
    title: Read the alert node current usage and recent peak separately
    description: Directly query the named alert node. Compute heap percent from 100*used_bytes/max_bytes when both
      exist and max is positive. Otherwise keep pct raw until its scale is verified; .pct alone does not tell you
      whether it is 0..1 or 0..100. Use the actual alert threshold/duration. A single low sample shows easing at
      that instant, not sustained recovery.
    tool_calls:
    - *target_node_latest
    - *target_node_recent
    - *target_node_baseline
    - *nodes_latest
    - *nodes_heap_peaks
  - step: 3
    title: Look for GC, cache, rejection and data-load evidence
    description: Compare GC collection-time/count and rejection deltas only between samples of the same node and
      counter epoch. Optional caches/breakers are returned when exported; missing fields are unknown. Cluster-wide
      shard totals divided by one node heap cannot diagnose oversharding. Index size is storage context, not proof
      of the cause of heap pressure.
    tool_calls:
    - *large_index_observations
    - *source_logs
  remediation:
  - action: reduce_evidenced_memory_pressure
    description: Owner should reduce expensive concurrent work or mapping/shard overhead when supported by the evidence.
      Consolidate small indices only after checking per-node shard distribution and workload.
    tool_id: ''
    requires_approval: true
  - action: review_memory_capacity
    description: Consider capacity changes if fresh, sustained pressure affects the relevant nodes. Elastic Cloud
      manages heap; do not prescribe a fixed heap size from this runbook.
    tool_id: ''
    requires_approval: true
  escalation: Deployment owner for sustained pressure, OOM/breaker events or increasing rejections. Use actual impact
    and rule threshold.
  follow_up:
  - Require several fresh samples below the configured threshold and the correct rule instance recovered.
- name: ElasticCloudCpuHigh
  patterns:
  - CPU Usage >
  - CPU Usage rule
  - monitoring_alert_cpu_usage
  priority: P2
  diagnostic_steps:
  - step: 1
    title: Identify the source cluster and assess evidence freshness
    description: Resolve the exact $cluster display name to one distinct UUID using resolve_cluster. Use only the
      dedicated bound runbook UUID for subsequent source queries; do not fall back to the incoming clusterUuid.
      Zero or multiple candidates cause dependent calls to be NOT RUN. Preserve incoming UUID, rule, node, measured
      value, threshold, duration and alert time as context. Report any incoming/resolved UUID disagreement as an
      identity mismatch. Stale identity data does not establish current health. Match rule and instance in alert
      documents. Missing identity is insufficient evidence, not another incident.
    tool_calls:
    - *identity_candidates
    - *resolve_cluster
    - *rule_alerts
    - *cluster_current
  - step: 2
    title: Compare actual CPU evidence over time
    description: 'Use the alert measured CPU value as trigger evidence. Process CPU pct, if present, has a scope/scale
      that must be verified. Load average includes runnable and uninterruptible tasks and is not CPU percentage.
      Compare cgroup CPU usage and throttled-period counters across valid samples. No hard-coded 100000-us period:
      quota/period gives a quota equivalent only if the actual period exists and quota is positive.'
    tool_calls:
    - *target_node_latest
    - *target_node_recent
    - *target_node_baseline
    - *nodes_latest
    - *nodes_load_peaks
  - step: 3
    title: Correlate pressure with work and errors
    description: Look for fresh queue/rejection changes, GC activity and source log errors during the same period.
      Large indices alone do not identify the expensive query or a hot shard. Hot threads on commotion-observability
      describe that monitoring node only and cannot provide parent thread traces.
    tool_calls:
    - *source_logs
  remediation:
  - action: reduce_verified_workload_pressure
    description: Owner should reduce excessive concurrency, optimize an identified expensive query or adjust bulk
      size if evidence supports it. Consider capacity when sustained pressure spans nodes. Avoid naming a client
      or hot shard without evidence.
    tool_id: ''
    requires_approval: true
  escalation: Owning application and deployment teams when sustained CPU pressure affects request latency or rejection
    rates.
  follow_up:
  - Check fresh CPU/throttling evidence and queue/rejection trends, then the matching alert recovery.
- name: ElasticCloudDiskHigh
  patterns:
  - Disk Usage >
  - Disk Usage rule
  - monitoring_alert_disk_usage
  priority: P2
  diagnostic_steps:
  - step: 1
    title: Identify the source cluster and assess evidence freshness
    description: Resolve the exact $cluster display name to one distinct UUID using resolve_cluster. Use only the
      dedicated bound runbook UUID for subsequent source queries; do not fall back to the incoming clusterUuid.
      Zero or multiple candidates cause dependent calls to be NOT RUN. Preserve incoming UUID, rule, node, measured
      value, threshold, duration and alert time as context. Report any incoming/resolved UUID disagreement as an
      identity mismatch. Stale identity data does not establish current health. Match rule and instance in alert
      documents. Missing identity is insufficient evidence, not another incident.
    tool_calls:
    - *identity_candidates
    - *resolve_cluster
    - *rule_alerts
    - *cluster_current
  - step: 2
    title: Compute disk usage and compare an earlier sample
    description: Use 100*(1-available_bytes/total_bytes), with positive total and 0<=available<=total. Compare the
      same node ID and capacity; changed total bytes invalidate a simple growth estimate. Low absolute free bytes
      is not the same ranking as high percentage used. Alert threshold comes from the actual rule.
    tool_calls:
    - *target_node_latest
    - *target_node_recent
    - *target_node_baseline
    - *nodes_latest
    - *nodes_baseline
    - *nodes_disk_lows
  - step: 3
    title: Find storage contributors and evidence of allocation/write impact
    description: Name the observed largest stored indices with observation times. Compute growth only from comparable
      timestamped samples; it may be noisy from merges/relocation. 85/90/95% are Elasticsearch default low/high/flood
      examples, not confirmed source settings. Account for byte settings, max headroom and multiple data paths when
      available. A block needs source logs or exported settings/evidence; percentage alone does not prove writes
      are blocked.
    tool_calls:
    - *large_index_observations
    - *nonstarted_shard_history
    - *source_logs
  remediation:
  - action: review_storage_and_retention
    description: Owner should add suitable storage or safely expire data according to the approved retention policy.
      Validate retention, snapshot and data ownership before proposing specific deletions.
    tool_id: ''
    requires_approval: true
  - action: avoid_emergency_force_merge
    description: Do not use force merge as the default response to near-full disks; it may need substantial temporary
      space. After capacity is restored, verify whether blocks cleared before considering any manual change.
    tool_id: ''
    requires_approval: true
  escalation: Urgent if write blocks, capacity exhaustion or unavailable primaries are evidenced; otherwise use
    remaining space and sustained growth to prioritize.
  follow_up:
  - Fresh disk evidence, write/health recovery and matching alert recovery; disclose unavailable block settings.
- name: ElasticCloudThreadPoolSearchRejections
  patterns:
  - Thread pool search rejections
  - monitoring_alert_thread_pool_search_rejections
  priority: P2
  diagnostic_steps:
  - step: 1
    title: Identify the source cluster and assess evidence freshness
    description: Resolve the exact $cluster display name to one distinct UUID using resolve_cluster. Use only the
      dedicated bound runbook UUID for subsequent source queries; do not fall back to the incoming clusterUuid.
      Zero or multiple candidates cause dependent calls to be NOT RUN. Preserve incoming UUID, rule, node, measured
      value, threshold, duration and alert time as context. Report any incoming/resolved UUID disagreement as an
      identity mismatch. Stale identity data does not establish current health. Match rule and instance in alert
      documents. Missing identity is insufficient evidence, not another incident.
    tool_calls:
    - *identity_candidates
    - *resolve_cluster
    - *rule_alerts
    - *cluster_current
  - step: 2
    title: Measure NEW search rejections
    description: 'Compare search rejected counters for the same node across chronological samples. Positive delta
      means new rejected requests during that measured interval. A lower counter or restart/identity discontinuity
      means reset: no naive subtraction. A nonzero lifetime total does not prove ongoing rejection; queue>0 alone
      is not proof of failure. Absence of CPU/JVM alerts does not prove a traffic burst.'
    tool_calls:
    - *target_node_latest
    - *target_node_recent
    - *target_node_baseline
    - *nodes_latest
    - *nodes_baseline
  - step: 3
    title: Correlate the rejection interval with resource evidence
    description: Use heap, GC, load, CPU throttling, queue trend and source logs at compatible timestamps. State
      whether resource exhaustion is observed or only suspected. Differentiate client-facing failures from upstream
      retries; request loss cannot be inferred from the counter alone.
    tool_calls:
    - *source_logs
  remediation:
  - action: reduce_search_pressure
    description: Owner should lower excessive search concurrency and optimize identified expensive queries; consider
      read capacity only with placement and workload evidence.
    tool_id: ''
    requires_approval: true
  - action: review_resource_capacity
    description: If sustained resource pressure is evidenced, owner should review capacity and distribution. Increasing
      a thread-pool queue is not an automatic remedy.
    tool_id: ''
    requires_approval: true
  escalation: Owning application and deployment teams; prioritize confirmed user-facing errors or unretried rejected
    writes.
  follow_up:
  - No additional rejections across measured intervals, queues easing, and the matching search rule recovered.
