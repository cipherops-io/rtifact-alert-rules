        sort:
        - elasticsearch.node.stats.thread_pool.write.rejected.count: desc
        - '@timestamp': desc
        _source: *node_source
        size: 10
    rows: '[*]._source'
    fields: *node_fields
    summary_chars: 4000
nodes_by_search_rejections: &nodes_by_search_rejections
  tool_id: mcp.elasticsearch.search_query_dsl
  target: parent
  description: 'Parent: recent per-node extreme selected by this query sort, NOT the latest reading. Compare the
    timestamp and child node stats. Rejections/throttling are cumulative counters; an old nonzero value does not
    prove a current failure.'
  params:
    arguments:
      index: .monitoring-es-8-mb
      body:
        query:
          bool:
            filter: *node_filter
        collapse:
          field: elasticsearch.node.id
        sort:
        - elasticsearch.node.stats.thread_pool.search.rejected.count: desc
        - '@timestamp': desc
        _source: *node_source
        size: 10
    rows: '[*]._source'
    fields: *node_fields
    summary_chars: 4000
unassigned_shards: &unassigned_shards
  tool_id: mcp.elasticsearch.search_query_dsl
  target: parent
  description: 'Parent: up to ten historical non-STARTED shard records in the last hour; not proof of current unassignment.
    Distinguish UNASSIGNED from INITIALIZING/RELOCATING. Child cat_shards and allocation explain establish current
    state.'
  params:
    arguments:
      index: .monitoring-es-8-mb
      body:
        query:
          bool:
            filter:
            - term:
                elasticsearch.cluster.id: $rtfMonitoringClusterUuid
            - term:
                metricset.name: shard
            - range:
                '@timestamp':
                  gte: now-1h
            - exists:
                field: elasticsearch.shard.state
            must_not:
            - term:
                elasticsearch.shard.state: STARTED
        sort:
        - '@timestamp': desc
        - elasticsearch.shard.primary: desc
        _source:
        - '@timestamp'
        - elasticsearch.index.name
        - elasticsearch.shard.number
        - elasticsearch.shard.primary
        - elasticsearch.shard.state
        - elasticsearch.node.name
        size: 10
    rows: '[*]._source'
    fields:
    - index=elasticsearch.index.name
    - shard=elasticsearch.shard.number
    - primary=elasticsearch.shard.primary
    - state=elasticsearch.shard.state
    - at=@timestamp
    summary_chars: 2500
yellow_indices: &yellow_indices
  tool_id: mcp.elasticsearch.search_query_dsl
  target: parent
  description: 'Parent: latest non-green observation per returned index within fifteen minutes, which may have recovered
    later. Reported shard counts are not authoritative configured replica settings; get_index on the child supplies
    configuration.'
  params:
    arguments:
      index: .monitoring-es-8-mb
      body:
        query:
          bool:
            filter:
            - term:
                elasticsearch.cluster.id: $rtfMonitoringClusterUuid
            - term:
                metricset.name: index
            - range:
                '@timestamp':
                  gte: now-15m
            must_not:
            - term:
                elasticsearch.index.status: green
        collapse:
          field: elasticsearch.index.name
        sort:
        - '@timestamp': desc
        _source:
        - elasticsearch.index.name
        - elasticsearch.index.status
        - elasticsearch.index.shards.primaries
        - elasticsearch.index.shards.total
        - elasticsearch.index.primaries.store.size_in_bytes
        - '@timestamp'
        size: 10
    rows: '[*]._source'
    fields:
    - at=@timestamp
    - index=elasticsearch.index.name
    - status=elasticsearch.index.status
    - primary_shards=elasticsearch.index.shards.primaries
    - total_shards=elasticsearch.index.shards.total
    - primary_bytes=elasticsearch.index.primaries.store.size_in_bytes
    summary_chars: 2500
largest_indices: &largest_indices
  tool_id: mcp.elasticsearch.search_query_dsl
  target: parent
  description: 'Parent: largest observed primary store size per returned index in the last fifteen minutes. Historical
    candidate list; size alone does not identify a busy index or the largest individual shard.'
  params:
    arguments:
      index: .monitoring-es-8-mb
      body:
        query:
          bool:
            filter:
            - term:
                elasticsearch.cluster.id: $rtfMonitoringClusterUuid
            - term:
                metricset.name: index
            - range:
                '@timestamp':
                  gte: now-15m
        collapse:
          field: elasticsearch.index.name
        sort:
        - elasticsearch.index.primaries.store.size_in_bytes: desc
        - '@timestamp': desc
        _source:
        - elasticsearch.index.name
        - elasticsearch.index.status
        - elasticsearch.index.primaries.store.size_in_bytes
        - elasticsearch.index.total.store.size_in_bytes
        - elasticsearch.index.shards.primaries
        - elasticsearch.index.shards.total
        - elasticsearch.index.primaries.docs.count
        - '@timestamp'
        size: 10
    rows: '[*]._source'
    fields:
    - at=@timestamp
    - index=elasticsearch.index.name
    - primary_bytes=elasticsearch.index.primaries.store.size_in_bytes
    - total_bytes=elasticsearch.index.total.store.size_in_bytes
    - primary_shards=elasticsearch.index.shards.primaries
    - total_shards=elasticsearch.index.shards.total
    - docs=elasticsearch.index.primaries.docs.count
    - status=elasticsearch.index.status
    summary_chars: 2500
nodes_latest: &nodes_latest
  tool_id: mcp.elasticsearch.search_query_dsl
  target: parent
  description: 'Parent: most recent node_stats per node in ten minutes, up to ten distinct node IDs. This is a sampled
    reporting inventory, not a live membership list.'
  params:
    arguments:
      index: .monitoring-es-8-mb
      body:
        query:
          bool:
            filter:
            - term:
                elasticsearch.cluster.id: $rtfMonitoringClusterUuid
            - term:
                metricset.name: node_stats
            - range:
                '@timestamp':
                  gte: now-10m
        collapse:
          field: elasticsearch.node.id
        sort:
        - '@timestamp': desc
        _source:
        - '@timestamp'
        - elasticsearch.node.name
        - elasticsearch.node.master
        - elasticsearch.node.roles
        - elasticsearch.node.stats.jvm.mem.heap.used.pct
        - elasticsearch.node.stats.jvm.mem.heap.max.bytes
        - elasticsearch.node.stats.os.cpu.load_avg.1m
        - elasticsearch.node.stats.os.cgroup.cpu.cfs.quota.us
        - elasticsearch.node.stats.os.cgroup.cpu.stat.times_throttled.count
        - elasticsearch.node.stats.fs.summary.total.bytes
        - elasticsearch.node.stats.fs.summary.available.bytes
        - elasticsearch.node.stats.thread_pool.search.rejected.count
        - elasticsearch.node.stats.thread_pool.search.queue.count
        - elasticsearch.node.stats.thread_pool.write.rejected.count
        - elasticsearch.node.stats.thread_pool.write.queue.count
        - elasticsearch.node.stats.indices.store.size.bytes
        - elasticsearch.node.stats.indices.docs.count
        - elasticsearch.node.id
        - elasticsearch.node.stats.jvm.mem.heap.used.bytes
        - elasticsearch.node.stats.jvm.uptime.ms
        - elasticsearch.node.stats.process.cpu.pct
        size: 10
    rows: '[*]._source'
    fields:
    - node=elasticsearch.node.name
    - master=elasticsearch.node.master
    - roles=elasticsearch.node.roles
    - heap_pct=elasticsearch.node.stats.jvm.mem.heap.used.pct
    - heap_max_bytes=elasticsearch.node.stats.jvm.mem.heap.max.bytes
    - load_1m=elasticsearch.node.stats.os.cpu.load_avg.1m
    - cpu_quota_us=elasticsearch.node.stats.os.cgroup.cpu.cfs.quota.us
    - cpu_throttled=elasticsearch.node.stats.os.cgroup.cpu.stat.times_throttled.count
    - disk_total_bytes=elasticsearch.node.stats.fs.summary.total.bytes
    - disk_avail_bytes=elasticsearch.node.stats.fs.summary.available.bytes
    - search_rejected=elasticsearch.node.stats.thread_pool.search.rejected.count
    - search_queue=elasticsearch.node.stats.thread_pool.search.queue.count
    - write_rejected=elasticsearch.node.stats.thread_pool.write.rejected.count
    - write_queue=elasticsearch.node.stats.thread_pool.write.queue.count
    - store_bytes=elasticsearch.node.stats.indices.store.size.bytes
    - at=@timestamp
    - node_id=elasticsearch.node.id
    - heap_used_bytes=elasticsearch.node.stats.jvm.mem.heap.used.bytes
    - uptime_ms_if_exported=elasticsearch.node.stats.jvm.uptime.ms
    - process_cpu_pct_if_exported=elasticsearch.node.stats.process.cpu.pct
    summary_chars: 4000
