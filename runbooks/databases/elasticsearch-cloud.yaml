  params:
    arguments:
      index: .monitoring-es-8-mb
      body:
        query:
          bool:
            filter: *node_filter
        collapse:
          field: elasticsearch.node.id
        sort:
        - elasticsearch.node.stats.os.cpu.load_avg.1m: desc
        - '@timestamp': desc
        _source: *node_source
        size: 10
    rows: '[*]._source'
    fields: *node_fields
    summary_chars: 4000
nodes_by_write_rejections: &nodes_by_write_rejections
  tool_id: mcp.elasticsearch.search_query_dsl
  target: parent
  description: 'Parent: recent per-node extreme selected by this query sort, NOT the latest reading. Compare the
