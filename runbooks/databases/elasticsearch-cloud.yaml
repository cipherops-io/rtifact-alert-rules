# Elasticsearch Cloud runbook: parent = monitoring deployment; child = alerting source deployment.
tech_stack: elasticsearch-cloud
version: '2.0'
description: >-

  Runbook for Elastic Cloud (Elasticsearch Service) stack-monitoring alerts,
  covering the 13 recommended Kibana monitoring rules. Shared across clients
  using the same monitoring index structure and alert mappings.
  Titles arrive as "[ElasticCloud] <cluster>: <rule name>" (older alerts:
  "<cluster> / <node>: <rule name>"). impacted_entities.cluster contains the
  source deployment's display name, and node-scoped alerts also provide
  impacted_entities.node.

  ROUTING: every diagnostic tool call specifies target alongside tool_id.
  target: parent selects the client's monitoring deployment.
  target: child selects the source deployment associated with the alert.
  The executor resolves the correct client and deployment connection.
  Investigations are scoped to the alerting source deployment.

  WHERE THE DATA IS: source deployments ship stack-monitoring data to a
  separate monitoring deployment. Parent queries read Elasticsearch metrics
  from .monitoring-es-8-mb, Kibana version evidence from
  .monitoring-kibana-8-mb, and related alert records from
  .internal.alerts-default.alerts-default-*.
  Child calls collect current cluster health, node statistics, shard placement,
  allocation explanations, hot threads, cluster settings, index configuration
  and lifecycle state. Parent cluster_health is used only to investigate the
  monitoring deployment itself.

  CLUSTER RESOLUTION: the initial lookup matches
  cluster_settings.cluster.metadata.display_name against $cluster and searches
  cluster_stats records from the last seven days. Results are collapsed by
  elasticsearch.cluster.id. A unique match binds $rtfMonitoringClusterUuid
  for subsequent monitoring queries. These queries use the reserved binding
  instead of trusting an incoming clusterUuid label. Missing or ambiguous
  identity leaves dependent calls NOT RUN; independent live child calls can
  still execute. An older identity record does not establish current health.

  DEPENDENCIES: optional node- and index-specific calls require values from
  the alert or an earlier successful binding. Allocation explain can select
  one unassigned shard and bind its index. Monitoring queries can select one
  storage candidate, which is not necessarily the alerted index.
  Empty results, tool errors and unresolved placeholders must be reported
  as evidence gaps while the executor continues with independent calls.
  Step descriptions guide interpretation; they do not implement conditional
  execution or loops.

  TOOL LIMITS: parent searches request at most 10 hits, and the DSL tool
  returns hit arrays without aggregations. Full result lists and shortened
  summaries may provide only partial coverage. Missing summarized nodes,
  fields or stack frames do not prove their absence. Interpret units as
  returned; divide raw byte values by 1073741824 for GiB.

  EVIDENCE INTERPRETATION: distinguish historical peaks from latest readings
  and current source state. Rejection, garbage-collection, breaker and
  throttling counters are cumulative; compare matching nodes, timestamps
  and counter resets before claiming recent activity. Use actual rule
  thresholds, allocation decisions and returned settings when identifying
  causes. A quiet live sample cannot rule out an earlier incident.
  Elasticsearch node information verifies Elasticsearch versions only;
  report any missing Kibana or Logstash evidence explicitly.
  All diagnostic calls are read-only. Report findings against the alert's
  own source deployment and, where applicable, its node or index.

match_keywords:
- elasticcloud
- elastic cloud
- elasticsearch cloud
- stack monitoring

categories:
- DATA
- DATABASE
- SEARCH

available_tools:
- mcp.elasticsearch.search_query_dsl — read-only; route using each call target
- mcp.elasticsearch.cluster_health — read-only; route using each call target
- mcp.elasticsearch.nodes_info — read-only; route using each call target
- mcp.elasticsearch.nodes_stats — read-only; route using each call target
- mcp.elasticsearch.nodes_hot_threads — read-only; route using each call target
- mcp.elasticsearch.cat_shards — read-only; route using each call target
- mcp.elasticsearch.cluster_get_settings — read-only; route using each call target
- mcp.elasticsearch.cluster_allocation_explain — read-only; route using each call target
- mcp.elasticsearch.get_index — read-only; route using each call target
- mcp.elasticsearch.ilm_explain_lifecycle — read-only; route using each call target

node_source: &node_source
- '@timestamp'
- elasticsearch.node.name
- elasticsearch.node.master
- elasticsearch.node.roles
- elasticsearch.node.stats.jvm.mem.heap.used.pct
- elasticsearch.node.stats.jvm.mem.heap.max.bytes
- elasticsearch.node.stats.os.cpu.load_avg.1m
- elasticsearch.node.stats.os.cgroup.cpu.cfs.quota.us
- elasticsearch.node.stats.os.cgroup.cpu.stat.times_throttled.count
- elasticsearch.node.stats.fs.summary.total.bytes
- elasticsearch.node.stats.fs.summary.available.bytes
- elasticsearch.node.stats.thread_pool.search.rejected.count
- elasticsearch.node.stats.thread_pool.search.queue.count
- elasticsearch.node.stats.thread_pool.write.rejected.count
- elasticsearch.node.stats.thread_pool.write.queue.count
- elasticsearch.node.stats.indices.store.size.bytes
- elasticsearch.node.stats.indices.docs.count
- elasticsearch.node.id
- elasticsearch.node.stats.jvm.mem.heap.used.bytes
- elasticsearch.node.stats.jvm.uptime.ms
- elasticsearch.node.stats.process.cpu.pct

node_fields: &node_fields
- node=elasticsearch.node.name
- master=elasticsearch.node.master
- roles=elasticsearch.node.roles
- heap_pct=elasticsearch.node.stats.jvm.mem.heap.used.pct
- heap_max_bytes=elasticsearch.node.stats.jvm.mem.heap.max.bytes
- load_1m=elasticsearch.node.stats.os.cpu.load_avg.1m
- cpu_quota_us=elasticsearch.node.stats.os.cgroup.cpu.cfs.quota.us
- cpu_throttled=elasticsearch.node.stats.os.cgroup.cpu.stat.times_throttled.count
- disk_total_bytes=elasticsearch.node.stats.fs.summary.total.bytes
- disk_avail_bytes=elasticsearch.node.stats.fs.summary.available.bytes
- search_rejected=elasticsearch.node.stats.thread_pool.search.rejected.count
- search_queue=elasticsearch.node.stats.thread_pool.search.queue.count
- write_rejected=elasticsearch.node.stats.thread_pool.write.rejected.count
- write_queue=elasticsearch.node.stats.thread_pool.write.queue.count
- store_bytes=elasticsearch.node.stats.indices.store.size.bytes
- at=@timestamp
- node_id=elasticsearch.node.id
- heap_used_bytes=elasticsearch.node.stats.jvm.mem.heap.used.bytes
- uptime_ms_if_exported=elasticsearch.node.stats.jvm.uptime.ms
- process_cpu_pct_if_exported=elasticsearch.node.stats.process.cpu.pct

node_filter: &node_filter
- term:
    elasticsearch.cluster.id: $rtfMonitoringClusterUuid
- term:
    metricset.name: node_stats
- range:
    '@timestamp':
      gte: now-10m

resolve_cluster: &resolve_cluster
  tool_id: mcp.elasticsearch.search_query_dsl
  target: parent
  description: 'Parent: exact display-name lookup across seven days, collapsed to distinct source UUIDs. Bind the
    reserved monitoring UUID only when returned candidates agree on one UUID. Seven-day retention is an identity
    fallback, not proof of current health. Child tools are independently routed by the executor.'
  params:
    arguments:
      index: .monitoring-es-8-mb
      body:
        query:
          bool:
            filter:
            - term:
                metricset.name: cluster_stats
            - term:
                cluster_settings.cluster.metadata.display_name: $cluster
            - range:
                '@timestamp':
                  gte: now-7d
                  lte: now
        sort:
        - '@timestamp': desc
        _source:
        - '@timestamp'
        - elasticsearch.cluster.id
        - cluster_settings.cluster.metadata.display_name
        - elasticsearch.cluster.stats.status
        - elasticsearch.cluster.stats.nodes.count
        - elasticsearch.cluster.stats.nodes.versions
        - elasticsearch.cluster.stats.nodes.fs
        - elasticsearch.cluster.stats.nodes.jvm.memory
        - elasticsearch.cluster.stats.nodes.jvm.max_uptime.ms
        - elasticsearch.cluster.stats.indices.shards
        - elasticsearch.cluster.stats.indices.docs.total
        - elasticsearch.cluster.stats.indices.store.size.bytes
        - elasticsearch.cluster.stats.license.status
        - elasticsearch.cluster.stats.license.type
        - elasticsearch.cluster.stats.license.expiry_date
        size: 10
        collapse:
          field: elasticsearch.cluster.id
    bind:
      rtfMonitoringClusterUuid:
        pick: _source.elasticsearch.cluster.id
      clusterUuid:
        pick: _source.elasticsearch.cluster.id
    fields:
    - latest_sample_at=@timestamp
    - cluster=cluster_settings.cluster.metadata.display_name
    - cluster_uuid=elasticsearch.cluster.id
    - status=elasticsearch.cluster.stats.status
    - nodes=elasticsearch.cluster.stats.nodes.count
    - es_versions=elasticsearch.cluster.stats.nodes.versions
    - shards_total=elasticsearch.cluster.stats.indices.shards.count
    - shards_primary=elasticsearch.cluster.stats.indices.shards.primaries
    - docs=elasticsearch.cluster.stats.indices.docs.total
    - store_bytes=elasticsearch.cluster.stats.indices.store.size.bytes
    - disk_total_bytes=elasticsearch.cluster.stats.nodes.fs.total.bytes
    - disk_avail_bytes=elasticsearch.cluster.stats.nodes.fs.available.bytes
    - heap_used_bytes=elasticsearch.cluster.stats.nodes.jvm.memory.heap.used.bytes
    - heap_max_bytes=elasticsearch.cluster.stats.nodes.jvm.memory.heap.max.bytes
    - max_node_uptime_ms=elasticsearch.cluster.stats.nodes.jvm.max_uptime.ms
    - license=elasticsearch.cluster.stats.license.status
    - license_type=elasticsearch.cluster.stats.license.type
    - license_expiry=elasticsearch.cluster.stats.license.expiry_date
    summary_chars: 4000
    rows: '[*]._source'
rule_alerts: &rule_alerts
  tool_id: mcp.elasticsearch.search_query_dsl
  target: parent
  description: 'Parent: related Kibana alert records updated in the last 24h, plus older records still active. Match
    the exact rule/instance; a related alert is correlation, not proof of cause.'
  params:
    arguments:
      index: .internal.alerts-default.alerts-default-*
      body:
        query:
          bool:
            filter:
            - match_phrase:
                kibana.alert.reason.text: $cluster
            - bool:
                should:
                - range:
                    '@timestamp':
                      gte: now-24h
                      lte: now
                - term:
                    kibana.alert.status: active
                minimum_should_match: 1
        sort:
        - '@timestamp': desc
        _source:
        - '@timestamp'
        - kibana.alert.rule.name
        - kibana.alert.status
        - kibana.alert.start
        - kibana.alert.flapping
        - kibana.alert.reason
        - kibana.alert.instance.id
        - kibana.alert.rule.rule_type_id
        - kibana.alert.end
        - kibana.alert.rule.parameters
        size: 10
    rows: '[*]._source'
    fields:
    - rule=kibana.alert.rule.name
    - status=kibana.alert.status
    - since=kibana.alert.start
    - last=@timestamp
    - flapping=kibana.alert.flapping
    - reason=kibana.alert.reason
    - instance=kibana.alert.instance.id
    - rule_type=kibana.alert.rule.rule_type_id
    - end=kibana.alert.end
    - rule_parameters=kibana.alert.rule.parameters
    summary_chars: 4000
nodes_by_heap: &nodes_by_heap
  tool_id: mcp.elasticsearch.search_query_dsl
  target: parent
  description: 'Parent: recent per-node extreme selected by this query sort, NOT the latest reading. Compare the
    timestamp and child node stats. Rejections/throttling are cumulative counters; an old nonzero value does not
    prove a current failure.'
  params:
    arguments:
      index: .monitoring-es-8-mb
      body:
        query:
          bool:
            filter: *node_filter
        collapse:
          field: elasticsearch.node.id
        sort:
        - elasticsearch.node.stats.jvm.mem.heap.used.pct: desc
        - '@timestamp': desc
        _source: *node_source
        size: 10
    rows: '[*]._source'
    fields: *node_fields
    summary_chars: 4000
nodes_by_disk: &nodes_by_disk
  tool_id: mcp.elasticsearch.search_query_dsl
  target: parent
  description: 'Parent: recent per-node extreme selected by this query sort, NOT the latest reading. Compare the
    timestamp and child node stats. Rejections/throttling are cumulative counters; an old nonzero value does not
    prove a current failure.'
  params:
    arguments:
      index: .monitoring-es-8-mb
      body:
        query:
          bool:
            filter: *node_filter
        collapse:
          field: elasticsearch.node.id
        sort:
        - elasticsearch.node.stats.fs.summary.available.bytes: asc
        - '@timestamp': desc
        _source: *node_source
        size: 10
    rows: '[*]._source'
    fields: *node_fields
    summary_chars: 4000
nodes_by_load: &nodes_by_load
  tool_id: mcp.elasticsearch.search_query_dsl
  target: parent
  description: 'Parent: recent per-node extreme selected by this query sort, NOT the latest reading. Compare the
    timestamp and child node stats. Rejections/throttling are cumulative counters; an old nonzero value does not
