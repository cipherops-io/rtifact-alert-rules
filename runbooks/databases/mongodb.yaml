  - Confirm the creation rate is back to its normal level.
- name: MongoDBOperationsQueued
  patterns:
  - MongoDBOperationsQueued
  - MongoDB operations are queuing
  priority: P2
  diagnostic_steps:
  - step: 1
    title: Quantify the queue
    description: The rule fires when more than 10 operations have been waiting for a lock or an execution ticket for 5 minutes (globalLock.currentQueue). Requests wait before they start, so latency rises
      and timeouts follow.
    tool_calls:
    - tool_id: tool.query_metrics
      description: VictoriaMetrics evidence for this step.
      params:
        queries:
        - name: ops_queued_by_type
          query: mongodb_ss_globalLock_currentQueue{job="$job",instance="$instance"}
          panel: true
          panel_title: Operations Queued by Type
          panel_id: mongodb-ops-queued-by-type
        - name: tickets_in_use
          query: mongodb_ss_wt_concurrentTransactions_out{job="$job",instance="$instance"}
        - name: write_tickets_queued_rate
          query: rate(mongodb_ss_wt_concurrentTransactions_write_addedToQueue{job="$job",instance="$instance"}[5m])
  - step: 2
    title: Check what is holding resources
    description: Typical causes are long-running or unindexed queries, a write burst, WiredTiger cache pressure that slows every operation, or an exclusive lock taken by an index build or a collection-level
      command.
    tool_calls:
    - tool_id: tool.query_metrics
      description: VictoriaMetrics evidence for this step.
      params:
        queries:
        - name: cache_used_pct
          unit: '%'
          query: 100 * mongodb_ss_wt_cache_bytes_currently_in_the_cache{job="$job",instance="$instance"} / mongodb_ss_wt_cache_maximum_bytes_configured{job="$job",instance="$instance"}
          panel: true
          panel_title: WiredTiger Cache Used (%)
          panel_id: mongodb-cache-used-pct
        - name: cache_dirty_pct
          unit: '%'
          query: 100 * mongodb_ss_wt_cache_tracked_dirty_bytes_in_the_cache{job="$job",instance="$instance"} / mongodb_ss_wt_cache_maximum_bytes_configured{job="$job",instance="$instance"}
          panel: true
          panel_title: WiredTiger Cache Dirty (%)
          panel_id: mongodb-cache-dirty-pct
        - name: write_latency_avg_ms
          unit: ms
          query: (rate(mongodb_ss_opLatencies_latency{job="$job",instance="$instance",op_type="writes"}[5m]) / rate(mongodb_ss_opLatencies_ops{job="$job",instance="$instance",op_type="writes"}[5m])) / 1000
          panel: true
          panel_title: Average Write Latency (ms)
          panel_id: mongodb-write-latency-avg-ms
  - step: 3
    title: Read recent mongod log entries
    description: Look for 'Slow query' lines with long durations and for index builds or collection commands.
    tool_calls:
    - tool_id: mcp.mongodb-database.mongodb_logs
      description: 'Read at most the 50 most recent mongod log entries through the MongoDB database connector. This is getLog-style recent output from the member the connection reaches (a replica-set connection
        string usually selects the primary), not a historical or per-member log search, and the tool has no member selector. Use it only as supporting near-current evidence: a missing message does not prove
        an event did not happen earlier or on another member. Do not retry on failure and redact credentials and literals before model use. If the integration is missing or cannot reach the alerting deployment,
        record the call as NOT RUN.'
      params:
        arguments:
          type: global
          limit: 50
        timeout: 10
  remediation:
  - action: clear_queue_cause
    description: Find the blocking operation with db.currentOp() (waitingForLock, long secs_running) and, with the owner's approval, kill a runaway operation (db.killOp). Add the missing index or throttle
      the batch job that causes the load.
    tool_id: ''
    requires_approval: true
  escalation: MongoDB database owner; P2.
  follow_up:
  - Verify the queue returns to near zero.
  - Confirm write latency is back to normal.
- name: MongoDBWriteLatencyHigh
  patterns:
  - MongoDBWriteLatencyHigh
  - MongoDB average write latency is above 100 ms
  priority: P2
  diagnostic_steps:
  - step: 1
    title: Quantify write latency and volume
    description: The rule fires when the average write takes more than 100 ms over 5 minutes for 10 minutes, with at least 1 write per second. Read latency is not alerted on because change streams and tailable
      cursors inflate the read average.
    tool_calls:
    - tool_id: tool.query_metrics
      description: VictoriaMetrics evidence for this step.
      params:
        queries:
        - name: write_latency_avg_ms
          unit: ms
          query: (rate(mongodb_ss_opLatencies_latency{job="$job",instance="$instance",op_type="writes"}[5m]) / rate(mongodb_ss_opLatencies_ops{job="$job",instance="$instance",op_type="writes"}[5m])) / 1000
          panel: true
          panel_title: Average Write Latency (ms)
          panel_id: mongodb-write-latency-avg-ms
        - name: write_ops_rate
          query: rate(mongodb_ss_opLatencies_ops{job="$job",instance="$instance",op_type="writes"}[5m])
          panel: true
          panel_title: Writes per Second
          panel_id: mongodb-write-ops-rate
  - step: 2
    title: Check for replication and queue pressure
    description: Majority writes wait for secondaries, so lag or a lagging commit point shows up as write latency. Queues add waiting time.
    tool_calls:
    - tool_id: tool.query_metrics
      description: VictoriaMetrics evidence for this step.
      params:
        queries:
        - name: majority_commit_lag_seconds
          unit: s
          query: (mongodb_rs_optimes_lastAppliedWallTime{job="$job",instance="$instance"} - mongodb_rs_optimes_lastCommittedWallTime{job="$job",instance="$instance"}) / 1000
          panel: true
          panel_title: Majority Commit Point Lag (s)
          panel_id: mongodb-majority-commit-lag-seconds
        - name: ops_queued_by_type
          query: mongodb_ss_globalLock_currentQueue{job="$job",instance="$instance"}
          panel: true
          panel_title: Operations Queued by Type
          panel_id: mongodb-ops-queued-by-type
        - name: write_concern_timeouts_10m
          query: increase(mongodb_ss_metrics_getLastError_wtimeouts{job="$job",instance="$instance"}[10m])
          panel: true
          panel_title: Write Concern Timeouts (10m)
          panel_id: mongodb-write-concern-timeouts-10m
  - step: 3
    title: Check cache pressure
    description: A full or dirty cache forces application threads to evict pages, which adds latency to writes.
    tool_calls:
    - tool_id: tool.query_metrics
      description: VictoriaMetrics evidence for this step.
      params:
        queries:
        - name: cache_used_pct
          unit: '%'
          query: 100 * mongodb_ss_wt_cache_bytes_currently_in_the_cache{job="$job",instance="$instance"} / mongodb_ss_wt_cache_maximum_bytes_configured{job="$job",instance="$instance"}
          panel: true
          panel_title: WiredTiger Cache Used (%)
          panel_id: mongodb-cache-used-pct
        - name: cache_dirty_pct
          unit: '%'
          query: 100 * mongodb_ss_wt_cache_tracked_dirty_bytes_in_the_cache{job="$job",instance="$instance"} / mongodb_ss_wt_cache_maximum_bytes_configured{job="$job",instance="$instance"}
          panel: true
          panel_title: WiredTiger Cache Dirty (%)
          panel_id: mongodb-cache-dirty-pct
  - step: 4
    title: Read recent mongod log entries
    description: '''Slow query'' lines show which writes are slow and why (lock wait, replication wait, index count).'
    tool_calls:
    - tool_id: mcp.mongodb-database.mongodb_logs
      description: 'Read at most the 50 most recent mongod log entries through the MongoDB database connector. This is getLog-style recent output from the member the connection reaches (a replica-set connection
        string usually selects the primary), not a historical or per-member log search, and the tool has no member selector. Use it only as supporting near-current evidence: a missing message does not prove
        an event did not happen earlier or on another member. Do not retry on failure and redact credentials and literals before model use. If the integration is missing or cannot reach the alerting deployment,
        record the call as NOT RUN.'
      params:
        arguments:
          type: global
          limit: 50
        timeout: 10
  remediation:
  - action: reduce_write_latency
    description: Look at the slow write log lines or profiler, disk write latency, write concern waits, indexes on hot collections and the cache. Remember to set the profiler back to level 0 after investigation.
    tool_id: ''
    requires_approval: true
  escalation: MongoDB database owner; P2.
  follow_up:
  - Verify average write latency is below 100 ms for 30 minutes.
- name: MongoDBWiredTigerCacheFull
  patterns:
  - MongoDBWiredTigerCacheFull
  - MongoDB WiredTiger cache is above its eviction trigger
  priority: P2
  diagnostic_steps:
  - step: 1
    title: Quantify cache usage
    description: The rule fires when the WiredTiger cache has been above 95% (its eviction trigger) for 10 minutes. Above it, application threads are pulled into evicting pages, which adds latency to reads
      and writes.
    tool_calls:
    - tool_id: tool.query_metrics
      description: VictoriaMetrics evidence for this step.
      params:
        queries:
        - name: cache_used_pct
          unit: '%'
          query: 100 * mongodb_ss_wt_cache_bytes_currently_in_the_cache{job="$job",instance="$instance"} / mongodb_ss_wt_cache_maximum_bytes_configured{job="$job",instance="$instance"}
          panel: true
          panel_title: WiredTiger Cache Used (%)
          panel_id: mongodb-cache-used-pct
        - name: cache_max_bytes
          unit: B
          query: mongodb_ss_wt_cache_maximum_bytes_configured{job="$job",instance="$instance"}
        - name: mongod_resident_memory
          unit: MB
          query: mongodb_ss_mem_resident{job="$job",instance="$instance"}
  - step: 2
    title: Look for the cause
    description: The working set probably no longer fits, or a large scan or index build is churning the cache. Cache size defaults to 50% of RAM minus 1 GB; in a container it is derived from the memory
      limit.
    tool_calls:
    - tool_id: tool.query_metrics
      description: VictoriaMetrics evidence for this step.
      params:
        queries:
        - name: cache_dirty_pct
          unit: '%'
          query: 100 * mongodb_ss_wt_cache_tracked_dirty_bytes_in_the_cache{job="$job",instance="$instance"} / mongodb_ss_wt_cache_maximum_bytes_configured{job="$job",instance="$instance"}
          panel: true
          panel_title: WiredTiger Cache Dirty (%)
          panel_id: mongodb-cache-dirty-pct
        - name: write_latency_avg_ms
          unit: ms
          query: (rate(mongodb_ss_opLatencies_latency{job="$job",instance="$instance",op_type="writes"}[5m]) / rate(mongodb_ss_opLatencies_ops{job="$job",instance="$instance",op_type="writes"}[5m])) / 1000
          panel: true
          panel_title: Average Write Latency (ms)
          panel_id: mongodb-write-latency-avg-ms
        - name: ops_queued_by_type
          query: mongodb_ss_globalLock_currentQueue{job="$job",instance="$instance"}
          panel: true
          panel_title: Operations Queued by Type
          panel_id: mongodb-ops-queued-by-type
  - step: 3
    title: Check the container's memory
    description: The alert's pod and namespace identify the MongoDB pod only when they were derived from the member address (a cluster DNS name); otherwise they are the exporter's and the kube queries describe
      the exporter.
    tool_calls:
    - tool_id: tool.query_metrics
      description: VictoriaMetrics evidence for this step.
      params:
        queries:
        - name: pod_container_restarts
          query: kube_pod_container_status_restarts_total{namespace="$namespace",pod="$pod"}
          panel: true
          panel_title: Pod Container Restarts
          panel_id: mongodb-pod-container-restarts
        - name: pod_last_terminated_reason
          query: kube_pod_container_status_last_terminated_reason{namespace="$namespace",pod="$pod"}
  - step: 4
    title: Read recent mongod log entries
    description: Look for collection scans in 'Slow query' lines.
    tool_calls:
    - tool_id: mcp.mongodb-database.mongodb_logs
      description: 'Read at most the 50 most recent mongod log entries through the MongoDB database connector. This is getLog-style recent output from the member the connection reaches (a replica-set connection
        string usually selects the primary), not a historical or per-member log search, and the tool has no member selector. Use it only as supporting near-current evidence: a missing message does not prove
        an event did not happen earlier or on another member. Do not retry on failure and redact credentials and literals before model use. If the integration is missing or cannot reach the alerting deployment,
        record the call as NOT RUN.'
      params:
        arguments:
          type: global
          limit: 50
        timeout: 10
  remediation:
  - action: relieve_cache_pressure
    description: Find collection scans in the slow query log and add indexes, compare cacheSizeGB with the working set, and size the container memory limit accordingly. Give the node more memory or shard
      the data if the working set has outgrown it.
    tool_id: ''
    requires_approval: true
  escalation: MongoDB database owner; P2.
  follow_up:
  - Verify cache usage stays below 95%.
  - Confirm read and write latency are normal.
- name: MongoDBWiredTigerCacheDirtyHigh
  patterns:
  - MongoDBWiredTigerCacheDirtyHigh
  - MongoDB WiredTiger cache has too much dirty data
  priority: P2
  diagnostic_steps:
  - step: 1
    title: Quantify dirty cache
    description: The rule fires when dirty data is above 20% of the cache (the dirty eviction trigger) for 5 minutes. Application threads must write dirty pages before continuing, so operations stall.
    tool_calls:
    - tool_id: tool.query_metrics
      description: VictoriaMetrics evidence for this step.
      params:
        queries:
        - name: cache_dirty_pct
          unit: '%'
          query: 100 * mongodb_ss_wt_cache_tracked_dirty_bytes_in_the_cache{job="$job",instance="$instance"} / mongodb_ss_wt_cache_maximum_bytes_configured{job="$job",instance="$instance"}
          panel: true
          panel_title: WiredTiger Cache Dirty (%)
          panel_id: mongodb-cache-dirty-pct
        - name: cache_used_pct
          unit: '%'
          query: 100 * mongodb_ss_wt_cache_bytes_currently_in_the_cache{job="$job",instance="$instance"} / mongodb_ss_wt_cache_maximum_bytes_configured{job="$job",instance="$instance"}
          panel: true
          panel_title: WiredTiger Cache Used (%)
          panel_id: mongodb-cache-used-pct
        - name: write_ops_rate
          query: rate(mongodb_ss_opLatencies_ops{job="$job",instance="$instance",op_type="writes"}[5m])
          panel: true
          panel_title: Writes per Second
          panel_id: mongodb-write-ops-rate
  - step: 2
    title: Check for a lagging commit point
    description: A lagging majority commit point forces WiredTiger to retain history, which keeps pages dirty.
    tool_calls:
    - tool_id: tool.query_metrics
      description: VictoriaMetrics evidence for this step.
      params:
        queries:
        - name: majority_commit_lag_seconds
          unit: s
          query: (mongodb_rs_optimes_lastAppliedWallTime{job="$job",instance="$instance"} - mongodb_rs_optimes_lastCommittedWallTime{job="$job",instance="$instance"}) / 1000
          panel: true
          panel_title: Majority Commit Point Lag (s)
          panel_id: mongodb-majority-commit-lag-seconds
        - name: secondary_lag_by_member_seconds
          unit: s
          query: max by (member_idx) (max without (member_idx, member_state) (mongodb_rs_members_optimeDate{job="$job",rs_nm="$rs_nm",member_state="PRIMARY"}) - ignoring (member_idx, member_state) group_right
            mongodb_rs_members_optimeDate{job="$job",rs_nm="$rs_nm",member_state="SECONDARY"}) / 1000
          panel: true
          panel_title: Secondary Replication Lag by Member (s)
          panel_id: mongodb-secondary-lag-by-member-seconds
  - step: 3
    title: See the effect on latency
    description: Compare write latency and queues with the dirty ratio.
    tool_calls:
    - tool_id: tool.query_metrics
      description: VictoriaMetrics evidence for this step.
      params:
        queries:
        - name: write_latency_avg_ms
          unit: ms
          query: (rate(mongodb_ss_opLatencies_latency{job="$job",instance="$instance",op_type="writes"}[5m]) / rate(mongodb_ss_opLatencies_ops{job="$job",instance="$instance",op_type="writes"}[5m])) / 1000
          panel: true
          panel_title: Average Write Latency (ms)
          panel_id: mongodb-write-latency-avg-ms
        - name: ops_queued_by_type
          query: mongodb_ss_globalLock_currentQueue{job="$job",instance="$instance"}
          panel: true
          panel_title: Operations Queued by Type
          panel_id: mongodb-ops-queued-by-type
  remediation:
  - action: reduce_dirty_cache
    description: Check disk write latency and throughput on the data volume (slow or burst-limited volumes are a frequent cause), throttle the write burst, and fix a lagging commit point first if there
      is one.
    tool_id: ''
    requires_approval: true
  escalation: MongoDB database owner; P2. A node that stays here can become unresponsive.
  follow_up:
  - Verify dirty cache stays below 20%.
  - Confirm write latency is normal.
- name: MongoDBCursorsTimedOut
  patterns:
  - MongoDBCursorsTimedOut
  - MongoDB is timing out abandoned cursors
  priority: P3
  diagnostic_steps:
  - step: 1
    title: Quantify abandoned cursors
    description: The rule fires when more than 100 cursors timed out in 10 minutes (idle longer than the cursor timeout, 10 minutes by default). An application opens cursors and abandons them without reading
      them to the end or closing them.
    tool_calls:
    - tool_id: tool.query_metrics
      description: VictoriaMetrics evidence for this step.
      params:
        queries:
        - name: cursors_timed_out_10m
          query: increase(mongodb_ss_metrics_cursor_timedOut{job="$job",instance="$instance"}[10m])
          panel: true
          panel_title: Cursors Timed Out (10m)
          panel_id: mongodb-cursors-timed-out-10m
        - name: cursors_open
          query: mongodb_ss_metrics_cursor_open{job="$job",instance="$instance"}
  - step: 2
    title: Check the connection side
    description: Abandoned cursors often accompany many connections or a recent deployment.
    tool_calls:
    - tool_id: tool.query_metrics
      description: VictoriaMetrics evidence for this step.
      params:
        queries:
        - name: connections_current
          query: mongodb_ss_connections{job="$job",instance="$instance",conn_type="current"}
        - name: connections_created_rate
          query: rate(mongodb_ss_connections{job="$job",instance="$instance",conn_type="totalCreated"}[5m])
          panel: true
          panel_title: New Connections per Second
          panel_id: mongodb-connections-created-rate
  remediation:
  - action: fix_cursor_leak
    description: 'Find the client with $currentOp and idleCursors: true or in the slow query log, and fix the application to close its cursors, iterate them to the end or use a limit. Avoid noCursorTimeout
      cursors.'
    tool_id: ''
    requires_approval: true
  escalation: Application owner of the offending client, with the MongoDB database owner; P3.
  follow_up:
  - Verify the timed-out cursor count stays low for a day.
- name: MongoDBLowDiskSpace
  patterns:
  - MongoDBLowDiskSpace
  - MongoDB data volume is almost out of space
  priority: P1
  diagnostic_steps:
  - step: 1
    title: Confirm mongod's disk space monitor acted
    description: 'The rule fires when mongod''s disk space monitor took action in the last 5 minutes: free space on the data volume fell below indexBuildMinAvailableDiskSpaceMB (500 MB by default), which
      aborts running index builds. When the volume fills, mongod stops and this member is lost.'
    tool_calls:
    - tool_id: tool.query_metrics
      description: VictoriaMetrics evidence for this step.
      params:
        queries:
        - name: disk_monitor_actions_5m
          query: increase(mongodb_ss_metrics_diskSpaceMonitor_tookAction{job="$job",instance="$instance"}[5m])
          panel: true
          panel_title: Disk Space Monitor Actions (5m)
          panel_id: mongodb-disk-monitor-actions-5m
        - name: data_mount_available_reported
          query: mongodb_sys_mounts_data_db_available{job="$job",instance="$instance"}
  - step: 2
    title: Check the data volume
    description: The alert's pod and namespace identify the MongoDB pod only when they were derived from the member address (a cluster DNS name); otherwise they are the exporter's and the kube queries describe
      the exporter. The volume query matches the claim name that ends with the pod name.
    tool_calls:
    - tool_id: tool.query_metrics
      description: VictoriaMetrics evidence for this step.
      params:
        queries:
        - name: data_volume_used_pct
          unit: '%'
          query: 100 * kubelet_volume_stats_used_bytes{namespace="$namespace",persistentvolumeclaim=~".*$pod"} / kubelet_volume_stats_capacity_bytes{namespace="$namespace",persistentvolumeclaim=~".*$pod"}
          panel: true
          panel_title: Data Volume Used (%)
          panel_id: mongodb-data-volume-used-pct
        - name: oplog_storage_size_bytes
          unit: B
          query: mongodb_oplog_stats_storageStats_storageSize{job="$job",instance="$instance"}
  - step: 3
    title: Read recent log entries and database sizes
    description: Sizes are point-in-time allocations, not growth or filesystem usage, and the list may be a subset.
    tool_calls:
    - tool_id: mcp.mongodb-database.mongodb_logs
      description: 'Read at most the 50 most recent mongod log entries through the MongoDB database connector. This is getLog-style recent output from the member the connection reaches (a replica-set connection
        string usually selects the primary), not a historical or per-member log search, and the tool has no member selector. Use it only as supporting near-current evidence: a missing message does not prove
        an event did not happen earlier or on another member. Do not retry on failure and redact credentials and literals before model use. If the integration is missing or cannot reach the alerting deployment,
        record the call as NOT RUN.'
      params:
        arguments:
          type: global
          limit: 50
        timeout: 10
    - tool_id: mcp.mongodb-database.list_databases
      description: 'Bounded discovery of the databases visible to the connection, with sizes as returned. Sizes are point-in-time allocations: not growth, not working-set size and not filesystem usage.
        The returned list can be a subset; report partial coverage. Do not fan out into per-database calls.'
      params:
        arguments: {}
        timeout: 10
  remediation:
  - action: free_or_grow_data_volume
    description: Free space or grow the volume now. Check the size of the oplog, journal and diagnostic.data directory and the largest collections and indexes; grow the PVC if the storage class allows expansion.
      Dropping data or compacting needs the owner's approval.
    tool_id: ''
    requires_approval: true
  escalation: MongoDB database owner and platform on-call; P1. The member stops if the volume fills.
  follow_up:
  - Verify free space is well above the monitor threshold and no more actions are taken.
  - Confirm any aborted index builds were restarted.
- name: MongoDBPrimaryFsyncLocked
  patterns:
  - MongoDBPrimaryFsyncLocked
  - MongoDB primary is fsync-locked and blocking writes
  priority: P1
  diagnostic_steps:
  - step: 1
    title: Confirm the lock and the node's role
    description: The rule fires when a primary or standalone has been fsync-locked for 2 minutes. While the lock is held every write on the node blocks. Backup and snapshot tools take the lock with db.fsyncLock()
      and must release it.
    tool_calls:
    - tool_id: tool.query_metrics
      description: VictoriaMetrics evidence for this step.
      params:
        queries:
        - name: fsync_lock_state
          query: mongodb_currentop_fsync_lock_state{job="$job",instance="$instance"}
          panel: true
          panel_title: 'fsync Lock: 1 = Locked'
          panel_id: mongodb-fsync-lock-state
        - name: node_replset_state
          query: mongodb_rs_myState{job="$job",instance="$instance"}
          panel: true
          panel_title: Node Replica Set State (1 = PRIMARY, 2 = SECONDARY)
          panel_id: mongodb-node-replset-state
  - step: 2
    title: See the effect on writes
    description: Blocked writes show up as rising queues and latency.
    tool_calls:
    - tool_id: tool.query_metrics
      description: VictoriaMetrics evidence for this step.
      params:
        queries:
        - name: ops_queued_by_type
          query: mongodb_ss_globalLock_currentQueue{job="$job",instance="$instance"}
          panel: true
          panel_title: Operations Queued by Type
          panel_id: mongodb-ops-queued-by-type
        - name: write_latency_avg_ms
          unit: ms
          query: (rate(mongodb_ss_opLatencies_latency{job="$job",instance="$instance",op_type="writes"}[5m]) / rate(mongodb_ss_opLatencies_ops{job="$job",instance="$instance",op_type="writes"}[5m])) / 1000
          panel: true
          panel_title: Average Write Latency (ms)
          panel_id: mongodb-write-latency-avg-ms
        - name: write_ops_rate
          query: rate(mongodb_ss_opLatencies_ops{job="$job",instance="$instance",op_type="writes"}[5m])
          panel: true
          panel_title: Writes per Second
          panel_id: mongodb-write-ops-rate
  - step: 3
    title: Check whether a backup is running
    description: A backup in progress explains a lock; a stuck backup does not.
    tool_calls:
    - tool_id: tool.query_metrics
      description: VictoriaMetrics evidence for this step.
      params:
        queries:
        - name: pbm_backups_by_status
          query: max by (name, status, type) (mongodb_pbm_backup_last_transition_ts{job="$job"})
          panel: true
          panel_title: PBM Backups by Status (last transition, epoch s)
          panel_id: mongodb-pbm-backups-by-status
  - step: 4
    title: Read recent mongod log entries
    description: Look for fsync and lock messages.
    tool_calls:
    - tool_id: mcp.mongodb-database.mongodb_logs
      description: 'Read at most the 50 most recent mongod log entries through the MongoDB database connector. This is getLog-style recent output from the member the connection reaches (a replica-set connection
        string usually selects the primary), not a historical or per-member log search, and the tool has no member selector. Use it only as supporting near-current evidence: a missing message does not prove
        an event did not happen earlier or on another member. Do not retry on failure and redact credentials and literals before model use. If the integration is missing or cannot reach the alerting deployment,
        record the call as NOT RUN.'
      params:
        arguments:
          type: global
          limit: 50
        timeout: 10
  remediation:
  - action: release_fsync_lock
    description: Confirm with db.currentOp().fsyncLock and make sure no snapshot is still being taken, then run db.fsyncUnlock() until the lock count reaches zero. Find why the backup tool did not release
      it.
    tool_id: ''
    requires_approval: true
  escalation: MongoDB database owner and backup owner; P1. Applications cannot write.
  follow_up:
  - Verify mongodb_currentop_fsync_lock_state = 0.
  - Confirm queues and write latency return to normal.
- name: MongoDBSecondaryFsyncLocked
  patterns:
  - MongoDBSecondaryFsyncLocked
  - MongoDB secondary has been fsync-locked for 30 minutes
  priority: P2
  diagnostic_steps:
  - step: 1
    title: Confirm the lock and the member's role
    description: The rule fires when a secondary has been fsync-locked for 30 minutes. Backup tools normally hold the lock only for the few seconds a snapshot takes. While locked, the member cannot apply
      replicated writes.
    tool_calls:
    - tool_id: tool.query_metrics
      description: VictoriaMetrics evidence for this step.
      params:
        queries:
        - name: fsync_lock_state
          query: mongodb_currentop_fsync_lock_state{job="$job",instance="$instance"}
          panel: true
          panel_title: 'fsync Lock: 1 = Locked'
          panel_id: mongodb-fsync-lock-state
        - name: node_replset_state
          query: mongodb_rs_myState{job="$job",instance="$instance"}
          panel: true
          panel_title: Node Replica Set State (1 = PRIMARY, 2 = SECONDARY)
          panel_id: mongodb-node-replset-state
  - step: 2
    title: Check the replication impact
    description: Lag grows while the lock is held; a long lock can push the member off the oplog.
    tool_calls:
    - tool_id: tool.query_metrics
      description: VictoriaMetrics evidence for this step.
      params:
        queries:
        - name: secondary_lag_by_member_for_job
          unit: s
          query: max by (rs_nm, member_idx) (max without (member_idx, member_state) (mongodb_rs_members_optimeDate{job="$job",member_state="PRIMARY"}) - ignoring (member_idx, member_state) group_right mongodb_rs_members_optimeDate{job="$job",member_state="SECONDARY"})
            / 1000
        - name: oplog_window_seconds_estimate
          unit: s
          query: mongodb_oplog_stats_storageStats_maxSize{job="$job",instance="$instance"} / rate(mongodb_oplog_stats_wt_cursor_insert_key_and_value_bytes{job="$job",instance="$instance"}[1h])
          panel: true
          panel_title: Estimated Oplog Window (s)
          panel_id: mongodb-oplog-window-seconds-estimate
  - step: 3
    title: Check whether a backup is running
    description: A stuck backup job usually owns the lock.
    tool_calls:
    - tool_id: tool.query_metrics
      description: VictoriaMetrics evidence for this step.
      params:
        queries:
        - name: pbm_backups_by_status
          query: max by (name, status, type) (mongodb_pbm_backup_last_transition_ts{job="$job"})
          panel: true
          panel_title: PBM Backups by Status (last transition, epoch s)
          panel_id: mongodb-pbm-backups-by-status
  remediation:
  - action: release_fsync_lock
    description: Check the backup or snapshot job that locked this member, then run db.fsyncUnlock() until the lock count reaches zero.
    tool_id: ''
    requires_approval: true
  escalation: Backup owner with the MongoDB database owner; P2.
  follow_up:
  - Verify mongodb_currentop_fsync_lock_state = 0.
  - Confirm the member's lag returns below 30 seconds.
- name: MongoDBPBMBackupFailed
  patterns:
  - MongoDBPBMBackupFailed
  - MongoDB backup failed
  priority: P2
  diagnostic_steps:
  - step: 1
    title: Identify the failed backup
    description: The rule fires when the newest failed backup (status error or down) is newer than the newest successful one, or no backup has ever succeeded. PBM timestamps are in seconds.
    tool_calls:
    - tool_id: tool.query_metrics
      description: VictoriaMetrics evidence for this step.
      params:
        queries:
        - name: pbm_backups_by_status
          query: max by (name, status, type) (mongodb_pbm_backup_last_transition_ts{job="$job"})
          panel: true
          panel_title: PBM Backups by Status (last transition, epoch s)
          panel_id: mongodb-pbm-backups-by-status
        - name: pbm_last_failure_age_seconds
          unit: s
          query: time() - max by (job) (mongodb_pbm_backup_last_transition_ts{job="$job",status=~"error|down"})
        - name: pbm_last_success_age_seconds
          unit: s
          query: time() - max by (job) (mongodb_pbm_backup_last_transition_ts{job="$job",status="done"})
          panel: true
          panel_title: Age of Last Successful Backup (s)
          panel_id: mongodb-pbm-last-success-age-seconds
  - step: 2
    title: Check the agents and configuration
    description: A backup needs a healthy pbm-agent next to every mongod and a configured storage target.
    tool_calls:
    - tool_id: tool.query_metrics
      description: VictoriaMetrics evidence for this step.
      params:
        queries:
        - name: pbm_agent_status_all
          query: max by (replica_set, host) (mongodb_pbm_agent_status{job="$job"})
          panel: true
          panel_title: 'PBM Agent Status: 0 = OK, 1 = Error, 2 = Lost'
          panel_id: mongodb-pbm-agent-status-all
        - name: pbm_backup_configured
          query: max by (job) (mongodb_pbm_cluster_backup_configured{job="$job"})
        - name: pbm_backup_duration_seconds
          unit: s
          query: max by (name, status) (mongodb_pbm_backup_duration_seconds{job="$job"})
  remediation:
  - action: repair_backup
    description: Run pbm status and pbm logs --event=backup to see the failure. Check the remote storage credentials, free space and network, that pbm-agent runs next to every mongod, and then run a new
      backup.
    tool_id: ''
    requires_approval: true
  escalation: MongoDB database owner and backup owner; P2. The newest restore point is getting older.
  follow_up:
  - Verify a new backup finishes with status done.
  - Confirm the agents are healthy.
- name: MongoDBPBMNoRecentBackup
  patterns:
  - MongoDBPBMNoRecentBackup
  - MongoDB has no successful backup in the last 26 hours
  priority: P2
  diagnostic_steps:
  - step: 1
    title: Quantify the age of the last successful backup
    description: The rule fires when no backup has completed successfully for more than 26 hours (a daily schedule plus slack).
    tool_calls:
    - tool_id: tool.query_metrics
      description: VictoriaMetrics evidence for this step.
      params:
        queries:
        - name: pbm_last_success_age_seconds
          unit: s
          query: time() - max by (job) (mongodb_pbm_backup_last_transition_ts{job="$job",status="done"})
          panel: true
          panel_title: Age of Last Successful Backup (s)
          panel_id: mongodb-pbm-last-success-age-seconds
        - name: pbm_backups_by_status
          query: max by (name, status, type) (mongodb_pbm_backup_last_transition_ts{job="$job"})
          panel: true
          panel_title: PBM Backups by Status (last transition, epoch s)
          panel_id: mongodb-pbm-backups-by-status
        - name: pbm_backup_configured
          query: max by (job) (mongodb_pbm_cluster_backup_configured{job="$job"})
  - step: 2
    title: Check whether a backup is running or failing
    description: A backup stuck in a running state or repeated failures both stop new successes.
    tool_calls:
    - tool_id: tool.query_metrics
      description: VictoriaMetrics evidence for this step.
      params:
        queries:
        - name: pbm_backup_duration_seconds
          unit: s
          query: max by (name, status) (mongodb_pbm_backup_duration_seconds{job="$job"})
        - name: pbm_last_failure_age_seconds
          unit: s
          query: time() - max by (job) (mongodb_pbm_backup_last_transition_ts{job="$job",status=~"error|down"})
        - name: pbm_agent_status_all
          query: max by (replica_set, host) (mongodb_pbm_agent_status{job="$job"})
          panel: true
          panel_title: 'PBM Agent Status: 0 = OK, 1 = Error, 2 = Lost'
          panel_id: mongodb-pbm-agent-status-all
  remediation:
  - action: restore_backup_schedule
    description: Confirm the schedule still runs (CronJob, operator custom resource or system cron) and its last exit status, check pbm status for a stuck backup, and run a backup by hand if needed (pbm
      backup).
    tool_id: ''
    requires_approval: true
  escalation: MongoDB database owner and backup owner; P2.
  follow_up:
  - Verify a backup completes and the age of the last success resets.
  - Confirm the next scheduled backup runs.
- name: MongoDBPBMAgentUnhealthy
  patterns:
  - MongoDBPBMAgentUnhealthy
  - MongoDB backup agent is unhealthy
  priority: P2
  diagnostic_steps:
  - step: 1
    title: Confirm the agent state
    description: The rule fires when a PBM agent reports error (1) or lost (2) for 10 minutes. Backups and point-in-time-recovery oplog slicing need a healthy agent next to every mongod.
    tool_calls:
    - tool_id: tool.query_metrics
      description: VictoriaMetrics evidence for this step.
      params:
        queries:
        - name: pbm_agent_status_for_host
          query: max by (replica_set, host) (mongodb_pbm_agent_status{job="$job",replica_set="$replica_set",host="$host"})
          panel: true
          panel_title: 'PBM Agent Status: 0 = OK, 1 = Error, 2 = Lost'
          panel_id: mongodb-pbm-agent-status-for-host
        - name: pbm_agent_status_all
          query: max by (replica_set, host) (mongodb_pbm_agent_status{job="$job"})
          panel: true
          panel_title: 'PBM Agent Status: 0 = OK, 1 = Error, 2 = Lost'
          panel_id: mongodb-pbm-agent-status-all
  - step: 2
    title: Check the backups
    description: A missing agent can fail new backups or leave gaps.
    tool_calls:
    - tool_id: tool.query_metrics
      description: VictoriaMetrics evidence for this step.
      params:
        queries:
        - name: pbm_backups_by_status
          query: max by (name, status, type) (mongodb_pbm_backup_last_transition_ts{job="$job"})
          panel: true
          panel_title: PBM Backups by Status (last transition, epoch s)
          panel_id: mongodb-pbm-backups-by-status
        - name: pbm_last_success_age_seconds
          unit: s
          query: time() - max by (job) (mongodb_pbm_backup_last_transition_ts{job="$job",status="done"})
          panel: true
          panel_title: Age of Last Successful Backup (s)
          panel_id: mongodb-pbm-last-success-age-seconds
  remediation:
  - action: repair_pbm_agent
    description: Check that pbm-agent is running next to the affected mongod, its log and its connection to the remote storage and to mongod (pbm status). Restart the agent with the owner's approval.
    tool_id: ''
    requires_approval: true
  escalation: MongoDB database owner and backup owner; P2.
  follow_up:
  - Verify the agent status returns to 0.
  - Confirm the next backup completes.
- name: MongoDBInstanceRestarted
  patterns:
  - MongoDBInstanceRestarted
  - MongoDB instance restarted
  priority: P3
  diagnostic_steps:
  - step: 1
    title: Confirm the restart
    description: The rule fires while mongod's uptime is below 10 minutes. The WiredTiger cache starts empty, so queries are slower until the working set is loaded, and a primary restart forces an election.
    tool_calls:
    - tool_id: tool.query_metrics
      description: VictoriaMetrics evidence for this step.
      params:
        queries:
        - name: mongod_uptime_seconds
          unit: s
          query: mongodb_ss_uptime{job="$job",instance="$instance"}
          panel: true
          panel_title: mongod Uptime (s)
          panel_id: mongodb-mongod-uptime-seconds
        - name: mongodb_up_for_instance
          query: mongodb_up{job="$job",instance="$instance"}
          panel: true
          panel_title: 'MongoDB Reachable From Exporter: 1 = Up'
          panel_id: mongodb-mongodb-up-for-instance
        - name: node_replset_state
          query: mongodb_rs_myState{job="$job",instance="$instance"}
          panel: true
          panel_title: Node Replica Set State (1 = PRIMARY, 2 = SECONDARY)
          panel_id: mongodb-node-replset-state
  - step: 2
    title: Check how it ended
    description: The alert's pod and namespace identify the MongoDB pod only when they were derived from the member address (a cluster DNS name); otherwise they are the exporter's and the kube queries describe
      the exporter. OOMKilled or Error as the last termination reason points to a crash, not planned maintenance.
    tool_calls:
    - tool_id: tool.query_metrics
      description: VictoriaMetrics evidence for this step.
      params:
        queries:
        - name: pod_container_restarts
          query: kube_pod_container_status_restarts_total{namespace="$namespace",pod="$pod"}
          panel: true
          panel_title: Pod Container Restarts
          panel_id: mongodb-pod-container-restarts
        - name: pod_last_terminated_reason
          query: kube_pod_container_status_last_terminated_reason{namespace="$namespace",pod="$pod"}
        - name: pod_phase
          query: kube_pod_status_phase{namespace="$namespace",pod="$pod"} == 1
  - step: 3
    title: Check the effect on the set
    description: A restarted member must catch up; a restarted primary triggers an election.
    tool_calls:
    - tool_id: tool.query_metrics
      description: VictoriaMetrics evidence for this step.
      params:
        queries:
        - name: secondary_lag_by_member_seconds
          unit: s
          query: max by (member_idx) (max without (member_idx, member_state) (mongodb_rs_members_optimeDate{job="$job",rs_nm="$rs_nm",member_state="PRIMARY"}) - ignoring (member_idx, member_state) group_right
            mongodb_rs_members_optimeDate{job="$job",rs_nm="$rs_nm",member_state="SECONDARY"}) / 1000
          panel: true
          panel_title: Secondary Replication Lag by Member (s)
          panel_id: mongodb-secondary-lag-by-member-seconds
        - name: election_term_change_1h
          query: max by (rs_nm) (mongodb_rs_term{job="$job",rs_nm="$rs_nm"}) - max by (rs_nm) (mongodb_rs_term{job="$job",rs_nm="$rs_nm"} offset 1h)
          panel: true
          panel_title: Election Term Increase in 1h
          panel_id: mongodb-election-term-change-1h
  - step: 4
    title: Read startup warnings and recent log entries
    description: Look for unclean shutdown recovery and storage warnings.
    tool_calls:
    - tool_id: mcp.mongodb-database.mongodb_logs
      description: 'Read at most 20 startup warnings and errors from the mongod the connection reaches. Use it to see why a recent start was unclean (unclean shutdown recovery, storage warnings). Same limits
        as the global log call: no member selector, point-in-time, not historical.'
      params:
        arguments:
          type: startupWarnings
          limit: 20
        timeout: 10
    - tool_id: mcp.mongodb-database.mongodb_logs
      description: 'Read at most the 50 most recent mongod log entries through the MongoDB database connector. This is getLog-style recent output from the member the connection reaches (a replica-set connection
        string usually selects the primary), not a historical or per-member log search, and the tool has no member selector. Use it only as supporting near-current evidence: a missing message does not prove
        an event did not happen earlier or on another member. Do not retry on failure and redact credentials and literals before model use. If the integration is missing or cannot reach the alerting deployment,
        record the call as NOT RUN.'
      params:
        arguments:
          type: global
          limit: 50
        timeout: 10
  remediation:
  - action: review_unplanned_restart
    description: If the restart was not planned, check the end of the previous log and the pod's last termination reason (OOM kill, fatal assertion, liveness probe failure, node drain). No action is needed
      after planned maintenance.
    tool_id: ''
    requires_approval: true
  escalation: MongoDB database owner for awareness; P3.
  follow_up:
  - Verify the member is back to PRIMARY or SECONDARY with normal lag.
  - Confirm the restart does not repeat.
general_diagnostic:
  steps:
  - step: 1
    title: Establish the exact target and collection quality
    description: For an unmatched MongoDB alert, require job and instance before querying metrics. Report missing or historical evidence explicitly. No remediation runs automatically.
    tool_calls:
    - tool_id: tool.query_metrics
      description: VictoriaMetrics evidence for this step.
      params:
        queries:
        - name: mongodb_up_for_instance
          query: mongodb_up{job="$job",instance="$instance"}
          panel: true
          panel_title: 'MongoDB Reachable From Exporter: 1 = Up'
          panel_id: mongodb-mongodb-up-for-instance
        - name: mongodb_up_sample_age_seconds
          unit: s
          query: time() - timestamp(mongodb_up{job="$job",instance="$instance"})
        - name: mongod_uptime_seconds
          unit: s
          query: mongodb_ss_uptime{job="$job",instance="$instance"}
          panel: true
          panel_title: mongod Uptime (s)
          panel_id: mongodb-mongod-uptime-seconds
        - name: job_scrape_up_by_instance
          query: up{job="$job"}
          panel: true
          panel_title: 'Exporter Scrape by Target: 1 = Scraped'
          panel_id: mongodb-job-scrape-up-by-instance
  - step: 2
    title: Read the replica set view for the deployment
    description: Member states and health as reported by the exporters of this job. A standalone deployment returns no replica-set series.
    tool_calls:
    - tool_id: tool.query_metrics
      description: VictoriaMetrics evidence for this step.
      params:
        queries:
        - name: members_state_for_job
          query: max by (rs_nm, member_idx, member_state) (mongodb_rs_members_state{job="$job"})
        - name: members_health_for_job
          query: min by (rs_nm, member_idx) (mongodb_rs_members_health{job="$job"})
        - name: node_replset_state
          query: mongodb_rs_myState{job="$job",instance="$instance"}
          panel: true
          panel_title: Node Replica Set State (1 = PRIMARY, 2 = SECONDARY)
          panel_id: mongodb-node-replset-state
  - step: 3
    title: Read load, cache and connection context
    description: Point-in-time context for an unmatched alert, not evidence for its window.
    tool_calls:
    - tool_id: tool.query_metrics
      description: VictoriaMetrics evidence for this step.
      params:
        queries:
        - name: connections_used_pct
          unit: '%'
          query: 100 * mongodb_ss_connections{job="$job",instance="$instance",conn_type="current"} / ignoring (conn_type) (mongodb_ss_connections{job="$job",instance="$instance",conn_type="current"} + ignoring
            (conn_type) mongodb_ss_connections{job="$job",instance="$instance",conn_type="available"})
          panel: true
          panel_title: Connections Used of Limit (%)
          panel_id: mongodb-connections-used-pct
        - name: ops_queued_by_type
          query: mongodb_ss_globalLock_currentQueue{job="$job",instance="$instance"}
          panel: true
          panel_title: Operations Queued by Type
          panel_id: mongodb-ops-queued-by-type
        - name: write_latency_avg_ms
          unit: ms
          query: (rate(mongodb_ss_opLatencies_latency{job="$job",instance="$instance",op_type="writes"}[5m]) / rate(mongodb_ss_opLatencies_ops{job="$job",instance="$instance",op_type="writes"}[5m])) / 1000
          panel: true
          panel_title: Average Write Latency (ms)
          panel_id: mongodb-write-latency-avg-ms
        - name: cache_used_pct
          unit: '%'
          query: 100 * mongodb_ss_wt_cache_bytes_currently_in_the_cache{job="$job",instance="$instance"} / mongodb_ss_wt_cache_maximum_bytes_configured{job="$job",instance="$instance"}
          panel: true
          panel_title: WiredTiger Cache Used (%)
          panel_id: mongodb-cache-used-pct
        - name: cache_dirty_pct
          unit: '%'
          query: 100 * mongodb_ss_wt_cache_tracked_dirty_bytes_in_the_cache{job="$job",instance="$instance"} / mongodb_ss_wt_cache_maximum_bytes_configured{job="$job",instance="$instance"}
          panel: true
          panel_title: WiredTiger Cache Dirty (%)
          panel_id: mongodb-cache-dirty-pct
  - step: 4
    title: Read recent mongod log entries
    description: Near-current supporting evidence only; no member selector.
    tool_calls:
    - tool_id: mcp.mongodb-database.mongodb_logs
      description: 'Read at most the 50 most recent mongod log entries through the MongoDB database connector. This is getLog-style recent output from the member the connection reaches (a replica-set connection
        string usually selects the primary), not a historical or per-member log search, and the tool has no member selector. Use it only as supporting near-current evidence: a missing message does not prove
        an event did not happen earlier or on another member. Do not retry on failure and redact credentials and literals before model use. If the integration is missing or cannot reach the alerting deployment,
        record the call as NOT RUN.'
      params:
        arguments:
          type: global
          limit: 50
        timeout: 10
escalation: MongoDB database owner; include the exact job, instance, replica set and member, fresh VM evidence, available live results and unresolved scope or permission gaps.
