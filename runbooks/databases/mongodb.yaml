            mongodb_rs_members_optimeDate{job="$job",rs_nm="$rs_nm",member_idx="$member_idx",member_state="SECONDARY"}) / 1000
          panel: true
          panel_title: Secondary Replication Lag (s)
          panel_id: mongodb-member-lag-seconds
        - name: member_delay_config_seconds
          unit: s
          query: max by (member_idx) (mongodb_rs_cfg_members_secondaryDelaySecs{job="$job",rs_nm="$rs_nm",member_idx="$member_idx"})
        - name: member_state_for_member
          query: max by (member_idx, member_state) (mongodb_rs_members_state{job="$job",rs_nm="$rs_nm",member_idx="$member_idx"})
          panel: true
          panel_title: Member State (1 = PRIMARY, 2 = SECONDARY)
          panel_id: mongodb-member-state-for-member
  - step: 2
    title: Compare with the oplog window
    description: If the lag approaches the oplog window, the member can fall off the oplog, enter RECOVERING and need a full initial sync. Also see whether the primary's write rate recently increased.
    tool_calls:
    - tool_id: tool.query_metrics
      description: VictoriaMetrics evidence for this step.
      params:
        queries:
        - name: oplog_window_seconds_estimate_for_member
          unit: s
          query: mongodb_oplog_stats_storageStats_maxSize{job="$job",instance=~".*$member_idx.*"} / rate(mongodb_oplog_stats_wt_cursor_insert_key_and_value_bytes{job="$job",instance=~".*$member_idx.*"}[1h])
          panel: true
          panel_title: Estimated Oplog Window of This Member (s)
          panel_id: mongodb-oplog-window-seconds-estimate-for-member
        - name: secondary_lag_by_member_seconds
          unit: s
          query: max by (member_idx) (max without (member_idx, member_state) (mongodb_rs_members_optimeDate{job="$job",rs_nm="$rs_nm",member_state="PRIMARY"}) - ignoring (member_idx, member_state) group_right
            mongodb_rs_members_optimeDate{job="$job",rs_nm="$rs_nm",member_state="SECONDARY"}) / 1000
          panel: true
          panel_title: Secondary Replication Lag by Member (s)
          panel_id: mongodb-secondary-lag-by-member-seconds
  - step: 3
    title: Check for a write burst
    description: A burst the secondary cannot apply fast enough is the most common cause; also look at majority commit lag and flow control on the primary.
    tool_calls:
    - tool_id: tool.query_metrics
      description: VictoriaMetrics evidence for this step.
      params:
        queries:
        - name: majority_commit_lag_for_replica_set
          unit: s
          query: max by (rs_nm) ((mongodb_rs_optimes_lastAppliedWallTime{job="$job",rs_nm="$rs_nm"} - mongodb_rs_optimes_lastCommittedWallTime{job="$job",rs_nm="$rs_nm"}) / 1000)
        - name: flow_control_lagged_for_replica_set
          query: max by (rs_nm) (mongodb_ss_flowControl_isLagged{job="$job",rs_nm="$rs_nm"})
  - step: 4
    title: Read recent mongod log entries
    description: Look for replication errors, slow applied operations and sync source changes in what the connection returns.
    tool_calls:
    - tool_id: mcp.mongodb-database.mongodb_logs
      description: 'Read at most the 50 most recent mongod log entries through the MongoDB database connector. This is getLog-style recent output from the member the connection reaches (a replica-set connection
        string usually selects the primary), not a historical or per-member log search, and the tool has no member selector. Use it only as supporting near-current evidence: a missing message does not prove
        an event did not happen earlier or on another member. Do not retry on failure and redact credentials and literals before model use. If the integration is missing or cannot reach the alerting deployment,
        record the call as NOT RUN.'
      params:
        arguments:
          type: global
          limit: 50
        timeout: 10
  remediation:
  - action: reduce_replication_lag
    description: Check the secondary's disk latency, CPU and memory, missing indexes that make replicated updates and deletes slow, a poor sync source, and whether a write burst or batch job can be throttled.
      Add resources to the secondary if it is undersized compared with the primary. Resize the oplog if the window is too short for the lag.
    tool_id: ''
    requires_approval: true
  escalation: MongoDB database owner; P1. A member that falls off the oplog needs a full resync.
  follow_up:
  - Verify the lag stays below 30 seconds.
  - Confirm the member stays SECONDARY with health 1.
- name: MongoDBMajorityCommitLagging
  patterns:
  - MongoDBMajorityCommitLagging
  - MongoDB majority commit point is not advancing
  priority: P1
  diagnostic_steps:
  - step: 1
    title: Confirm the commit point is behind
    description: 'The rule compares the last applied write with the last majority-committed write on a primary: more than 60 seconds for 2 minutes. Majority writes (the default) wait for the commit point,
      so they hang or time out and majority reads are stale.'
    tool_calls:
    - tool_id: tool.query_metrics
      description: VictoriaMetrics evidence for this step.
      params:
        queries:
        - name: majority_commit_lag_seconds
          unit: s
          query: (mongodb_rs_optimes_lastAppliedWallTime{job="$job",instance="$instance"} - mongodb_rs_optimes_lastCommittedWallTime{job="$job",instance="$instance"}) / 1000
          panel: true
          panel_title: Majority Commit Point Lag (s)
          panel_id: mongodb-majority-commit-lag-seconds
        - name: node_replset_state
          query: mongodb_rs_myState{job="$job",instance="$instance"}
          panel: true
          panel_title: Node Replica Set State (1 = PRIMARY, 2 = SECONDARY)
          panel_id: mongodb-node-replset-state
  - step: 2
    title: Find the member holding the commit point back
    description: The commit point only advances when a majority of data-bearing voting members have applied the write. Typical causes are unhealthy or lagging secondaries, or a primary-secondary-arbiter
      set whose secondary is down.
    tool_calls:
    - tool_id: tool.query_metrics
      description: VictoriaMetrics evidence for this step.
      params:
        queries:
        - name: secondary_lag_by_member_seconds
          unit: s
          query: max by (member_idx) (max without (member_idx, member_state) (mongodb_rs_members_optimeDate{job="$job",rs_nm="$rs_nm",member_state="PRIMARY"}) - ignoring (member_idx, member_state) group_right
            mongodb_rs_members_optimeDate{job="$job",rs_nm="$rs_nm",member_state="SECONDARY"}) / 1000
          panel: true
          panel_title: Secondary Replication Lag by Member (s)
          panel_id: mongodb-secondary-lag-by-member-seconds
        - name: members_health_by_member
          query: min by (member_idx) (mongodb_rs_members_health{job="$job",rs_nm="$rs_nm"})
          panel: true
          panel_title: 'Member Health: 1 = Reachable'
          panel_id: mongodb-members-health-by-member
        - name: members_state_by_member
          query: max by (member_idx, member_state) (mongodb_rs_members_state{job="$job",rs_nm="$rs_nm"})
          panel: true
          panel_title: Replica Set Member State (1 = PRIMARY, 2 = SECONDARY)
          panel_id: mongodb-members-state-by-member
  - step: 3
    title: Check cache pressure on the primary
    description: While the commit point lags, WiredTiger must keep history for every write since it, which raises cache and dirty pressure.
    tool_calls:
    - tool_id: tool.query_metrics
      description: VictoriaMetrics evidence for this step.
      params:
        queries:
        - name: cache_used_pct
          unit: '%'
          query: 100 * mongodb_ss_wt_cache_bytes_currently_in_the_cache{job="$job",instance="$instance"} / mongodb_ss_wt_cache_maximum_bytes_configured{job="$job",instance="$instance"}
          panel: true
          panel_title: WiredTiger Cache Used (%)
          panel_id: mongodb-cache-used-pct
        - name: cache_dirty_pct
          unit: '%'
          query: 100 * mongodb_ss_wt_cache_tracked_dirty_bytes_in_the_cache{job="$job",instance="$instance"} / mongodb_ss_wt_cache_maximum_bytes_configured{job="$job",instance="$instance"}
          panel: true
          panel_title: WiredTiger Cache Dirty (%)
          panel_id: mongodb-cache-dirty-pct
  - step: 4
    title: Read recent mongod log entries
    description: Look for slow majority acknowledgements and replication errors.
    tool_calls:
    - tool_id: mcp.mongodb-database.mongodb_logs
      description: 'Read at most the 50 most recent mongod log entries through the MongoDB database connector. This is getLog-style recent output from the member the connection reaches (a replica-set connection
        string usually selects the primary), not a historical or per-member log search, and the tool has no member selector. Use it only as supporting near-current evidence: a missing message does not prove
        an event did not happen earlier or on another member. Do not retry on failure and redact credentials and literals before model use. If the integration is missing or cannot reach the alerting deployment,
        record the call as NOT RUN.'
      params:
        arguments:
          type: global
          limit: 50
        timeout: 10
  remediation:
  - action: restore_majority_commit
    description: Bring enough data-bearing voting members back in sync. In a primary-secondary-arbiter set with the secondary down, restore the secondary quickly; as a last resort the owner can temporarily
      set its votes and priority to 0 so the majority can advance, and must undo that afterwards.
    tool_id: ''
    requires_approval: true
  escalation: MongoDB database owner; P1. Majority writes are hanging.
  follow_up:
  - Verify the majority commit lag drops below a few seconds.
  - Confirm write latency returns to normal.
- name: MongoDBFlowControlEngaged
  patterns:
  - MongoDBFlowControlEngaged
  - MongoDB flow control is throttling writes
  priority: P2
  diagnostic_steps:
  - step: 1
    title: Confirm flow control is throttling writes
    description: 'The rule fires when flow control has been engaged on the primary for 5 minutes: the majority commit point lags by more than flowControlTargetLagSeconds (10 seconds by default), so the
      primary deliberately limits write throughput.'
    tool_calls:
    - tool_id: tool.query_metrics
      description: VictoriaMetrics evidence for this step.
      params:
        queries:
        - name: flow_control_lagged
          query: mongodb_ss_flowControl_isLagged{job="$job",instance="$instance"}
          panel: true
          panel_title: 'Flow Control Throttling: 1 = Engaged'
          panel_id: mongodb-flow-control-lagged
        - name: flow_control_locks_per_kilo_op
          query: mongodb_ss_flowControl_locksPerKiloOp{job="$job",instance="$instance"}
        - name: majority_commit_lag_seconds
          unit: s
          query: (mongodb_rs_optimes_lastAppliedWallTime{job="$job",instance="$instance"} - mongodb_rs_optimes_lastCommittedWallTime{job="$job",instance="$instance"}) / 1000
          panel: true
          panel_title: Majority Commit Point Lag (s)
          panel_id: mongodb-majority-commit-lag-seconds
  - step: 2
    title: Find the lagging secondary
    description: Flow control protects the set from a slow secondary; fix that secondary rather than disabling flow control.
    tool_calls:
    - tool_id: tool.query_metrics
      description: VictoriaMetrics evidence for this step.
      params:
        queries:
        - name: secondary_lag_by_member_seconds
          unit: s
          query: max by (member_idx) (max without (member_idx, member_state) (mongodb_rs_members_optimeDate{job="$job",rs_nm="$rs_nm",member_state="PRIMARY"}) - ignoring (member_idx, member_state) group_right
            mongodb_rs_members_optimeDate{job="$job",rs_nm="$rs_nm",member_state="SECONDARY"}) / 1000
          panel: true
          panel_title: Secondary Replication Lag by Member (s)
          panel_id: mongodb-secondary-lag-by-member-seconds
        - name: members_health_by_member
          query: min by (member_idx) (mongodb_rs_members_health{job="$job",rs_nm="$rs_nm"})
          panel: true
          panel_title: 'Member Health: 1 = Reachable'
          panel_id: mongodb-members-health-by-member
  - step: 3
    title: See the effect on writes
    description: Writes slow down while throttled; compare latency and the write rate.
    tool_calls:
    - tool_id: tool.query_metrics
      description: VictoriaMetrics evidence for this step.
      params:
        queries:
        - name: write_latency_avg_ms
          unit: ms
          query: (rate(mongodb_ss_opLatencies_latency{job="$job",instance="$instance",op_type="writes"}[5m]) / rate(mongodb_ss_opLatencies_ops{job="$job",instance="$instance",op_type="writes"}[5m])) / 1000
          panel: true
          panel_title: Average Write Latency (ms)
          panel_id: mongodb-write-latency-avg-ms
        - name: write_ops_rate
          query: rate(mongodb_ss_opLatencies_ops{job="$job",instance="$instance",op_type="writes"}[5m])
          panel: true
          panel_title: Writes per Second
          panel_id: mongodb-write-ops-rate
  remediation:
  - action: fix_lagging_secondary
    description: 'Follow the replication-lag steps for the slow secondary (resources, indexes, write burst). Do not disable flow control (enableFlowControl: false); that only moves the pressure to the WiredTiger
      cache.'
    tool_id: ''
    requires_approval: true
  escalation: MongoDB database owner; P2. Applications see slower writes.
  follow_up:
  - Verify mongodb_ss_flowControl_isLagged returns to 0.
  - Confirm secondary lag is back below 30 seconds.
- name: MongoDBOplogWindowLow
  patterns:
  - MongoDBOplogWindowLow
  - MongoDB oplog window is shorter than 24 hours
  priority: P2
  diagnostic_steps:
  - step: 1
    title: Quantify the estimated oplog window
    description: 'The rule estimates the window as the oplog''s maximum size divided by its insert byte rate over the last hour, below 24 hours for 30 minutes. It is an estimate: both numbers are uncompressed
      bytes, and if storage.oplogMinRetentionHours is set the real window can be longer. Confirm with rs.printReplicationInfo() on the member.'
    tool_calls:
    - tool_id: tool.query_metrics
      description: VictoriaMetrics evidence for this step.
      params:
        queries:
        - name: oplog_window_seconds_estimate
          unit: s
          query: mongodb_oplog_stats_storageStats_maxSize{job="$job",instance="$instance"} / rate(mongodb_oplog_stats_wt_cursor_insert_key_and_value_bytes{job="$job",instance="$instance"}[1h])
          panel: true
          panel_title: Estimated Oplog Window (s)
          panel_id: mongodb-oplog-window-seconds-estimate
        - name: oplog_max_size_bytes
          unit: B
          query: mongodb_oplog_stats_storageStats_maxSize{job="$job",instance="$instance"}
        - name: oplog_insert_bytes_per_second_1h
          unit: B/s
          query: rate(mongodb_oplog_stats_wt_cursor_insert_key_and_value_bytes{job="$job",instance="$instance"}[1h])
        - name: oplog_insert_bytes_per_second_5m
          unit: B/s
          query: rate(mongodb_oplog_stats_wt_cursor_insert_key_and_value_bytes{job="$job",instance="$instance"}[5m])
  - step: 2
    title: Compare with member lag
    description: A member down or lagging longer than the window cannot catch up and needs an initial sync. Compare the current lag of the secondaries with the window.
    tool_calls:
    - tool_id: tool.query_metrics
      description: VictoriaMetrics evidence for this step.
      params:
        queries:
        - name: secondary_lag_by_member_seconds
          unit: s
          query: max by (member_idx) (max without (member_idx, member_state) (mongodb_rs_members_optimeDate{job="$job",rs_nm="$rs_nm",member_state="PRIMARY"}) - ignoring (member_idx, member_state) group_right
            mongodb_rs_members_optimeDate{job="$job",rs_nm="$rs_nm",member_state="SECONDARY"}) / 1000
          panel: true
          panel_title: Secondary Replication Lag by Member (s)
          panel_id: mongodb-secondary-lag-by-member-seconds
        - name: oplog_storage_size_bytes
          unit: B
          query: mongodb_oplog_stats_storageStats_storageSize{job="$job",instance="$instance"}
  - step: 3
    title: Check the write rate
    description: A recent change in write volume (batch job, migration, new feature) usually explains a shrinking window.
    tool_calls:
    - tool_id: tool.query_metrics
      description: VictoriaMetrics evidence for this step.
      params:
        queries:
        - name: write_ops_rate
          query: rate(mongodb_ss_opLatencies_ops{job="$job",instance="$instance",op_type="writes"}[5m])
          panel: true
          panel_title: Writes per Second
          panel_id: mongodb-write-ops-rate
  remediation:
  - action: extend_oplog_window
    description: Grow the oplog on every member (replSetResizeOplog, no restart needed) or reduce the write burst's volume. Plan the size from the write rate and the longest outage you want to survive.
    tool_id: ''
    requires_approval: true
  escalation: MongoDB database owner; P2. Not urgent, but a member that is down longer than the window needs a full resync.
  follow_up:
  - Verify the estimated window is above 24 hours at the current write rate.
  - Confirm no secondary is close to the window.
- name: MongoDBWriteConcernTimeouts
  patterns:
  - MongoDBWriteConcernTimeouts
  - MongoDB writes are timing out waiting for write concern
  priority: P2
  diagnostic_steps:
  - step: 1
    title: Confirm the timeouts
    description: The rule fires when writes exceeded their write concern wtimeout in the last 10 minutes. These writes were applied on the primary but not confirmed by enough members in time, and applications
      received a writeConcernError.
    tool_calls:
    - tool_id: tool.query_metrics
      description: VictoriaMetrics evidence for this step.
      params:
        queries:
        - name: write_concern_timeouts_10m
          query: increase(mongodb_ss_metrics_getLastError_wtimeouts{job="$job",instance="$instance"}[10m])
          panel: true
          panel_title: Write Concern Timeouts (10m)
          panel_id: mongodb-write-concern-timeouts-10m
        - name: node_replset_state
          query: mongodb_rs_myState{job="$job",instance="$instance"}
          panel: true
          panel_title: Node Replica Set State (1 = PRIMARY, 2 = SECONDARY)
          panel_id: mongodb-node-replset-state
  - step: 2
    title: Check the members that must acknowledge
    description: Timeouts usually mean secondaries are lagging, down or slow, so the requested number of members cannot acknowledge in time.
    tool_calls:
    - tool_id: tool.query_metrics
      description: VictoriaMetrics evidence for this step.
      params:
        queries:
        - name: secondary_lag_by_member_seconds
          unit: s
          query: max by (member_idx) (max without (member_idx, member_state) (mongodb_rs_members_optimeDate{job="$job",rs_nm="$rs_nm",member_state="PRIMARY"}) - ignoring (member_idx, member_state) group_right
            mongodb_rs_members_optimeDate{job="$job",rs_nm="$rs_nm",member_state="SECONDARY"}) / 1000
          panel: true
          panel_title: Secondary Replication Lag by Member (s)
          panel_id: mongodb-secondary-lag-by-member-seconds
        - name: members_health_by_member
          query: min by (member_idx) (mongodb_rs_members_health{job="$job",rs_nm="$rs_nm"})
          panel: true
          panel_title: 'Member Health: 1 = Reachable'
          panel_id: mongodb-members-health-by-member
        - name: majority_commit_lag_seconds
          unit: s
          query: (mongodb_rs_optimes_lastAppliedWallTime{job="$job",instance="$instance"} - mongodb_rs_optimes_lastCommittedWallTime{job="$job",instance="$instance"}) / 1000
          panel: true
          panel_title: Majority Commit Point Lag (s)
          panel_id: mongodb-majority-commit-lag-seconds
  - step: 3
    title: See the effect on write latency
    description: Compare write latency with the number of timeouts.
    tool_calls:
    - tool_id: tool.query_metrics
      description: VictoriaMetrics evidence for this step.
      params:
        queries:
        - name: write_latency_avg_ms
          unit: ms
          query: (rate(mongodb_ss_opLatencies_latency{job="$job",instance="$instance",op_type="writes"}[5m]) / rate(mongodb_ss_opLatencies_ops{job="$job",instance="$instance",op_type="writes"}[5m])) / 1000
          panel: true
          panel_title: Average Write Latency (ms)
          panel_id: mongodb-write-latency-avg-ms
        - name: write_ops_rate
          query: rate(mongodb_ss_opLatencies_ops{job="$job",instance="$instance",op_type="writes"}[5m])
          panel: true
          panel_title: Writes per Second
          panel_id: mongodb-write-ops-rate
  remediation:
  - action: restore_write_acknowledgement
    description: Fix the slow or unavailable members first. Raising wtimeout only hides the problem; review it with the application owner once replication is healthy.
    tool_id: ''
    requires_approval: true
  escalation: MongoDB database owner; P2.
  follow_up:
  - Verify no new write concern timeouts in 30 minutes.
  - Confirm secondary lag is below 30 seconds.
- name: MongoDBConnectionsHigh
  patterns:
  - MongoDBConnectionsHigh
  - MongoDB connection usage is above 80% of the limit
  priority: P2
  diagnostic_steps:
  - step: 1
    title: Quantify connection usage
    description: The rule fires when current / (current + available) is above 80%. mongod refuses new connections at the limit (net.maxIncomingConnections, capped by the process open-file limit).
    tool_calls:
    - tool_id: tool.query_metrics
      description: VictoriaMetrics evidence for this step.
      params:
        queries:
        - name: connections_used_pct
          unit: '%'
          query: 100 * mongodb_ss_connections{job="$job",instance="$instance",conn_type="current"} / ignoring (conn_type) (mongodb_ss_connections{job="$job",instance="$instance",conn_type="current"} + ignoring
            (conn_type) mongodb_ss_connections{job="$job",instance="$instance",conn_type="available"})
          panel: true
          panel_title: Connections Used of Limit (%)
          panel_id: mongodb-connections-used-pct
        - name: connections_current
          query: mongodb_ss_connections{job="$job",instance="$instance",conn_type="current"}
        - name: connections_available
          query: mongodb_ss_connections{job="$job",instance="$instance",conn_type="available"}
  - step: 2
    title: Check for a connection storm or leak
    description: A fast rise in new connections points to a storm (for example pools reconnecting after a failover); a steady high count with a low creation rate points to leaked or oversized pools. Total
      pool size is maxPoolSize multiplied by the number of application instances.
    tool_calls:
    - tool_id: tool.query_metrics
      description: VictoriaMetrics evidence for this step.
      params:
        queries:
        - name: connections_created_rate
          query: rate(mongodb_ss_connections{job="$job",instance="$instance",conn_type="totalCreated"}[5m])
          panel: true
          panel_title: New Connections per Second
          panel_id: mongodb-connections-created-rate
        - name: ops_queued_by_type
          query: mongodb_ss_globalLock_currentQueue{job="$job",instance="$instance"}
          panel: true
          panel_title: Operations Queued by Type
          panel_id: mongodb-ops-queued-by-type
  - step: 3
    title: Read recent mongod log entries
    description: Connection accepted and ended lines show the busiest client addresses and application names; look for 'Too many open connections'.
    tool_calls:
    - tool_id: mcp.mongodb-database.mongodb_logs
      description: 'Read at most the 50 most recent mongod log entries through the MongoDB database connector. This is getLog-style recent output from the member the connection reaches (a replica-set connection
        string usually selects the primary), not a historical or per-member log search, and the tool has no member selector. Use it only as supporting near-current evidence: a missing message does not prove
        an event did not happen earlier or on another member. Do not retry on failure and redact credentials and literals before model use. If the integration is missing or cannot reach the alerting deployment,
        record the call as NOT RUN.'
      params:
        arguments:
          type: global
          limit: 50
        timeout: 10
  remediation:
  - action: reduce_connection_usage
    description: Identify the clients holding the most connections (db.currentOp(true) grouped by client and appName) and reduce their pool sizes or restart the leaking ones. Raise net.maxIncomingConnections
      only if the host has memory and file-descriptor headroom.
    tool_id: ''
    requires_approval: true
  escalation: MongoDB database owner; P2.
  follow_up:
  - Verify connection usage stays below 80%.
  - Confirm the creation rate is back to its normal level.
