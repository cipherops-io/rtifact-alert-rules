                - "disk_autoscaling=replicationSpecs[0].regionConfigs[0].autoScaling.diskGB.enabled"
      - step: 3
        title: Inspect recent replication-related mongod messages
        description: Use one bounded recent log snapshot only when the database binding is reachable. Returned
          replication, heartbeat, rollback, initial-sync, storage or network messages may support a
          replication-pressure hypothesis. The tool does not provide complete per-secondary history; no
