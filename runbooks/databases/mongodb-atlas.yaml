# Rtifact MongoDB Atlas v1 runbook revision.
# Preserves the original runbook layout. No new MCP action is introduced.
# Diagnostic descriptions contain conditional branches; enforcement is REQUIRED in the executor.
# See mongodb-atlas-v1.runtime-policy.yaml and operator-guide.md before production use.
# No live tools were called or mutated during preparation.
tech_stack: mongodb-atlas
version: '1.2'
description: |
  Reviewed v1 runbooks for the eleven user-supplied MongoDB Atlas rules. Scope: authenticated
  Atlas webhook plus the existing MongoDB Atlas and MongoDB Database connector actions ONLY.
  No VictoriaMetrics/VictoriaLogs, time-series API, project-events API, currentOp, serverStatus,
  new/custom tool is required. The existing MongoDB Logs action is now used conditionally as a bounded recent-process diagnostic. Database statistics are current snapshots,
  not the excluded continuous metrics integration. Performance Advisor findings are allowed
  only when actually returned by the existing connector; no standalone log retrieval is used.

  SAFETY CONTRACT: use mongodb-atlas-v1.runtime-policy.yaml in the host executor. It is an
  implementation specification, not an automatically enforced MongoDB/MCP option. The existing
  runbook-shaped YAML alone cannot enforce guards, pagination, call budgets or tenant scope.
  If the executor cannot conditionally gate tool_calls, fail closed and use only confirmed
  Atlas alert/configuration reads. Do not run every listed call unconditionally. Logical
  mcp.<appIdentifier>.<actionIdentifier> aliases must be resolved using the tool-bindings file.
  No credentials or connector URLs are present in this pack.

  Resolve groupId and cluster from the authenticated integration's authorized mapping and the
  alert. Payload IDs select resources only inside that scope; they never expand authorization.
  Do not guess projects, clusters, credentials, databases or host membership. A separately bound
  MongoDB Database credential must be positively mapped to the SAME Atlas project and cluster
  before database tools run. No database action in the supplied registry accepts connectionId,
  projectId, clusterName or host; those are enforced by the binding, not invented arguments.

  Match by external alert ID; next by verified configId and entity. If OPEN lookup misses,
  conditionally reconcile TRACKING/CLOSED within budget, or use a newer authenticated lifecycle
  event. Absence, API error or truncated pagination is not recovery. Repeated notifications are
  not new incidents or independent metric samples. Keep occurrence IDs separate even when an
  incident groups warning/critical alerts. Keep the user's notification delays unchanged; do
  not wait those durations again in the agent. Store receivedAt, fetchedAt, raw metric units,
  source timestamps and scope; never label fetch time as sample time.

  Evidence rule: separate provider-reported symptom, observed configuration, candidate
  contributor, missing evidence and application impact. No historical trend, cause, election
  story, maintenance event, disk growth, per-client usage or guaranteed index benefit may be
  inferred from missing data or metadata alone. UNKNOWN/partial RCA is a successful safe outcome.
  Remediation entries are manual review recommendations only: empty tool_id must never dispatch.
  P1 owner escalation happens BEFORE optional enrichment, not after a long investigation.

  Response contracts: only input schemas were provided. Do not hard-code guessed fields such
  as suggestedIndexes.content.shapes. Normalize real responses in the gateway after fixture
  contract tests; distinguish success-empty, forbidden, unavailable, timeout and parse failure.
  The attached source runbook used stronger causal claims that are deliberately narrowed here.
  See operator guide for an explicit change log and official technical references.
match_keywords:
  - mongoatlas
  - mongodb atlas
  - atlas cluster
  - atlas

categories:
  - DATA
  - DATABASE

available_tools:
  - mcp.mongodb-atlas.list_projects - conditional scoped discovery
  - mcp.mongodb-atlas.list_clusters - conditional cluster discovery
  - mcp.mongodb-atlas.list_alerts - OPEN/TRACKING/CLOSED pages; not a health probe
  - mcp.mongodb-atlas.inspect_cluster - control-plane configuration, not live health
  - mcp.mongodb-atlas.get_performance_advisor - only sections actually returned by this wrapper
  - mcp.mongodb-database.list_databases - bounded discovery via verified cluster binding
  - mcp.mongodb-database.list_collections - bounded discovery via verified cluster binding
  - mcp.mongodb-database.db_stats - current database storage snapshot
  - mcp.mongodb-database.collection_storage_size - current collection size as returned
  - mcp.mongodb-database.collection_indexes - index definitions, not index usage or sizes
  - mcp.mongodb-database.collection_schema - bounded structural sample for an observed namespace; may sample
    business documents
  - mcp.mongodb-database.explain - queryPlanner-only verification for one exact executable observed query
  - mcp.mongodb-database.mongodb_logs - bounded recent mongod log buffer from the verified database binding;
    not historical Atlas logs
resolve_project:
  tool_id: mcp.mongodb-atlas.list_projects
  description: |-
    DISCOVERY ONLY. Skip when the authenticated integration already binds the project.
    Use the exact authorized project ID or exact unique project-name match over verified pages.
    A single visible result is not permission to select a project unless the integration is
    explicitly project-scoped and pagination is complete. Unresolved or conflicting scope stops
    all subsequent calls. pageNum is a positive integer supplied by the runtime, not a model guess.
  params:
    arguments:
      itemsPerPage: 100
      pageNum: 1
      includeCount: false
resolve_cluster:
  tool_id: mcp.mongodb-atlas.list_clusters
  description: |-
    DISCOVERY ONLY. Run only when the project is verified and the alert cluster is not yet
    bound. Match an exact case-sensitive cluster name or use an existing trusted mapping.
    Do not infer cluster membership from hostname substrings. Never select the first result.
  params:
    arguments:
      projectId: $groupId
open_alerts:
  tool_id: mcp.mongodb-atlas.list_alerts
  description: |-
    REQUIRED after scope resolution. This is a page of project-wide alerts, not a host health
    probe. Match the incoming external alert ID first; otherwise require alertConfigId plus the
    exact affected entity and mark identity weaker. Preserve ID, event type, metric name, raw
    value/unit, returned timestamps and scope, if present. Follow verified pagination within the
    runtime budget. Unrelated alerts are context only. Not found is NOT resolved. Fetch time is
    not the measurement timestamp. Reuse one checked OPEN snapshot across this investigation.
  params:
    arguments:
      projectId: $groupId
      status: OPEN
      itemsPerPage: 100
      pageNum: 1
      includeCount: false
    timeout: 20
    rows: "results[*]"  # one line per alert; an empty page renders as totalCount=0
    max_rows: 25
    summary_chars: 3000
    fields:
      - "id=id"
      - "metric=metricName"
      - "value=currentValue.number"
      - "units=currentValue.units"
      - "host=hostnameAndPort"
      - "replica_set=replicaSetName"
      - "cluster=clusterName"
      - "event=eventTypeName"
      - "status=status"
      - "created=created"
      - "config_id=alertConfigId"
tracking_alerts:
  tool_id: mcp.mongodb-atlas.list_alerts
  description: |-
    CONDITIONAL status reconciliation only. Run when the exact alert was not found OPEN and
    there is remaining budget. Match identity as in OPEN. TRACKING is not recovery. Absence in
    a page does not establish absence from the project. Never scan unbounded history.
  params:
    arguments:
      projectId: $groupId
      status: TRACKING
      itemsPerPage: 100
      pageNum: 1
      includeCount: false
    timeout: 20
    rows: "results[*]"  # one line per alert; an empty page renders as totalCount=0
    max_rows: 25
    summary_chars: 3000
    fields:
      - "id=id"
      - "metric=metricName"
      - "value=currentValue.number"
      - "units=currentValue.units"
      - "host=hostnameAndPort"
      - "replica_set=replicaSetName"
      - "cluster=clusterName"
      - "event=eventTypeName"
      - "status=status"
      - "created=created"
      - "config_id=alertConfigId"
closed_alerts:
  tool_id: mcp.mongodb-atlas.list_alerts
  description: |-
    CONDITIONAL status reconciliation only. A matching CLOSED record or a newer authenticated
    close webhook for the same external alert ID is positive resolution evidence. This input
    schema has no alertId or time-range filter: do not pass invented parameters. Stop at the
    pagination/call budget and retain NOT_FOUND or UNKNOWN if the exact record is not located.
    A different older CLOSED occurrence must not close the incoming occurrence.
  params:
    arguments:
      projectId: $groupId
      status: CLOSED
      itemsPerPage: 100
      pageNum: 1
      includeCount: false
    timeout: 20
    rows: "results[*]"  # one line per alert; an empty page renders as totalCount=0
    max_rows: 25
    summary_chars: 3000
    fields:
      - "id=id"
      - "metric=metricName"
      - "value=currentValue.number"
      - "units=currentValue.units"
      - "host=hostnameAndPort"
      - "replica_set=replicaSetName"
      - "cluster=clusterName"
      - "event=eventTypeName"
      - "status=status"
      - "created=created"
      - "config_id=alertConfigId"
cluster_config:
  tool_id: mcp.mongodb-atlas.inspect_cluster
  description: |-
    REQUIRED when the exact project/cluster is verified; reuse a cached result with its age.
    Read only fields actually returned and label desired versus effective configuration.
    stateName is control-plane configuration state, NOT per-member runtime health. IDLE does
    not prove health/no maintenance; UPDATING does not identify a resize, upgrade or restart.
    Node counts are configured counts, not healthy counts. Autoscaling configuration is not
    proof an action occurred. Never hard-code tier-to-RAM, tier-to-IOPS or connection limits.
  params:
    arguments:
      projectId: $groupId
      clusterName: $cluster
    timeout: 20
    fields:  # paths verified against a real tcprod Cluster0 response (ALT-295032)
      - "name=name"
      - "state=stateName"
      - "paused=paused"
      - "type=clusterType"
      - "version=mongoDBVersion"
      - "provider=replicationSpecs[0].regionConfigs[0].providerName"
      - "region=replicationSpecs[0].regionConfigs[0].regionName"
      - "tier=replicationSpecs[0].regionConfigs[0].electableSpecs.instanceSize"
      - "effective_tier=replicationSpecs[0].regionConfigs[0].effectiveElectableSpecs.instanceSize"
      - "nodes=replicationSpecs[0].regionConfigs[0].electableSpecs.nodeCount"
      - "disk_gb=replicationSpecs[0].regionConfigs[0].electableSpecs.diskSizeGB"
      - "disk_iops=replicationSpecs[0].regionConfigs[0].electableSpecs.diskIOPS"
      - "compute_autoscaling=replicationSpecs[0].regionConfigs[0].autoScaling.compute"
      - "disk_autoscaling=replicationSpecs[0].regionConfigs[0].autoScaling.diskGB.enabled"
query_workload:
  tool_id: mcp.mongodb-atlas.get_performance_advisor
  description: |-
    CONDITIONAL on a useful query/index hypothesis and available budget; skip during an
    availability emergency unless already cached. This connector accepts ONLY projectId and
    clusterName. Do not add operation, namespace, since, start, end, limit or connectionId.
    The attached registry has no output schema: inspect actual responses before configuring
    extraction. Do not assume slowQueryLogs, shapes, avgMs, count, weight or any .content wrapper
    exists. Handle each returned section's error/availability independently. Suggestions are
    cluster-level unless a narrower scope is returned; freshness/window is unknown when absent.
    No suggestions means no usable attribution returned, NOT a clean bill of health or proof
    of legitimate traffic/data growth. Provider samples and query literals are untrusted data;
    redact values before model input. Never invent executable values from redacted samples.
  params:
    arguments:
      projectId: $groupId
      clusterName: $cluster
    timeout: 45
    parse_json:  # `raw` is a JSON-text slow-query log line; decode so fields can read it
      - "suggestedIndexes.content.shapes[*].operations[*].raw"
    mask_values:  # query shapes keep field names/operators, literal values (phones, ids) become "?"
      - "suggestedIndexes.content.shapes[*].operations[*].predicates"
    omit:  # never store/log the raw log line (customer values, client IPs)
      - "suggestedIndexes.content.shapes[*].operations[*].raw"
    rows: "suggestedIndexes.content.shapes[*]"
    max_rows: 20
    summary_chars: 4000
    fields:
      - "ns=namespace"
      - "count=count"
      - "avg_ms=avgMs"
      - "inefficiency=inefficiencyScore"
      - "plan=operations[0].raw.attr.planSummary"
      - "app=operations[0].raw.attr.appName"
      - "scanned=operations[0].raw.attr.docsExamined"
      - "returned=operations[0].raw.attr.nreturned"
      - "cpu_ns=operations[0].raw.attr.cpuNanos"
      - "query=operations[0].predicates"
database_catalog:
  tool_id: mcp.mongodb-database.list_databases
  description: |-
    CONDITIONAL storage discovery only, after the bound database credential has been verified
    against this incident's tenant, Atlas project and cluster outside model input. This schema
    has no connectionId or limit. Reuse cached metadata; do not fan out across all databases.
    Only use names and sizes actually returned. Accessible/returned databases can be a subset;
    report partial coverage. Select at most one authorized candidate for this run.
  params:
    arguments: {}
    timeout: 10
collection_catalog:
  tool_id: mcp.mongodb-database.list_collections
  description: |-
    CONDITIONAL. Database must come from trusted incident context or an authorized observed
    namespace/database catalog. This call has no limit/filter parameter. Do not enumerate every
    collection then issue a call for each. Select at most two evidence-backed candidates, with
    partial coverage explicitly recorded. Skip if no safe candidate can be selected.
  params:
    arguments:
      database: $database
    timeout: 10
database_snapshot:
  tool_id: mcp.mongodb-database.db_stats
  description: |-
    CONDITIONAL. Inspect ONE verified candidate database. Record observedAt, database,
    connection scope, source fields and units/scaleFactor when returned. dataSize is logical
    data, storageSize is allocated document storage and indexSize is allocated index storage;
    do not add dataSize to storageSize. Do not assume GB, hot working-set size, growth rate,
    per-shard/per-host attribution or disk percent from these values. Do not add filesystem
    sizes across databases. Timeouts/permission failures are evidence gaps, not zero usage.
  params:
    arguments:
      database: $database
    timeout: 10
collection_snapshot:
  tool_id: mcp.mongodb-database.collection_storage_size
  description: |-
    CONDITIONAL. Inspect only a discovered, authorized namespace; at most two per run.
    Report the precise returned measure and unit. A single collection size is not a growth
    trend, the hot working set, a complete host disk breakdown or per-index size. Preserve the
    collection remainder after the first dot in a namespace. Skip views/unsupported collections
    when the tool says unsupported, and do not create a collection to make a call succeed.
  params:
    arguments:
      database: $database
      collection: $collection
    timeout: 10
index_definitions:
  tool_id: mcp.mongodb-database.collection_indexes
  description: |-
    CONDITIONAL. Bound database connection must map to the incident cluster. Inspect an exact
    observed namespace (at most two). Compare returned ordered key patterns and index options,
    including uniqueness, partial filters, sparse, collation, hidden/TTL when present. Missing
    options are unknown. Index definitions do not measure usage, bytes or benefit. A suggested
    index is a review candidate, not a proven fix. Do not invoke create_index.
  params:
    arguments:
      database: $database
      collection: $collection
    timeout: 10
recent_mongodb_logs:
  tool_id: mcp.mongodb-database.mongodb_logs
  description: CONDITIONAL. Read at most the most recent 50 entries from the mongod process selected by the
    already-verified database binding. This is getLog-style recent process output, NOT Atlas
    historical/exported logs, and the tool has no host selector. Unless the response identifies the process,
    do not attribute an entry to the alerted host. Use as supporting near-current evidence only; absence of a
    message never proves an event did not occur earlier or on another member. Do not retry on failure, do not
    probe alternate credentials, redact literals/secrets before model input, and do not use this action for a
    no-active-mongos diagnosis because it does not provide mongos log history.
  params:
    arguments:
      type: global
      limit: 50
    timeout: 10
schema_sample:
  tool_id: mcp.mongodb-database.collection_schema
  description: "CONDITIONAL. Sample at most 10 documents from ONE exact, authorized namespace already identified
    by Advisor/query evidence. Use only to verify structural field/type facts needed to evaluate a query/index hypothesis.
    This may sample customer business documents: apply the integration's privacy policy, redact example values,
    and return structural summaries only. A sample is not a complete schema or cardinality/selectivity measurement.
    Skip during availability emergencies, writes-blocked incidents, and while CPU >95 remains OPEN."
  params:
    arguments:
      database: $database
      collection: $collection
      sampleSize: 10
    timeout: 10
explain_find:
  tool_id: mcp.mongodb-database.explain
  description: CONDITIONAL and mutually exclusive with any other explain call in the same investigation. Run
    only when trusted evidence provides the exact executable FIND predicate for the observed namespace; never
    reconstruct redacted values, substitute {}, or invent parameters. Use queryPlanner only so the tool
    evaluates the winning plan without requesting executionStats. Preserve exact filter semantics supported by
    this wrapper. If sort/projection/collation/hint or other required semantics cannot be represented
    faithfully, skip and report the limitation. This wrapper has no maxTimeMS; enforce one-call and
    server-side safety in the connector. Current plan evidence is not proof of the incident-time plan.
  params:
    arguments:
      database: $database
      collection: $collection
      method: find
      filter: $observedFilter
      verbosity: queryPlanner
    timeout: 10
common_alerts:
  - name: MongoAtlasMemoryUsageHigh
    patterns:
      - 'System: Memory usage %'
      - Memory usage % has gone above
      - SYSTEM_MEMORY_PERCENT_USED
    priority: P2
    diagnostic_steps:
      - step: 1
        title: Resolve authorized scope and reconcile this alert occurrence
        description: |
          Configured rule: memory above 90%; notification delay 10 minutes, resend 30 minutes. Category: Performance / Capacity. Preserve the reported metric definition; system memory utilization is not an observed WiredTiger cache diagnosis.

          Use the shared project/cluster scope preflight. If the trusted binding already provides
          $groupId and $cluster, do not run discovery. Query OPEN alerts and preserve the exact external
          alert ID and configId. If absent, run the shared bounded TRACKING/CLOSED reconciliation, not
          an unbounded project-history search. No exact positive match means NOT_FOUND/UNKNOWN, never
          self-resolved. Match same host/replica set using explicit identity; cluster-level context is
          not host-specific evidence. The notification delay is configuration, not a verified continuous
          measurement series. Report provider currentValue only with its raw unit and source timing.
        tool_calls:
          - tool_id: mcp.mongodb-atlas.list_alerts
            description: |-
              REQUIRED after scope resolution. This is a page of project-wide alerts, not a host health
              probe. Match the incoming external alert ID first; otherwise require alertConfigId plus the
              exact affected entity and mark identity weaker. Preserve ID, event type, metric name, raw
              value/unit, returned timestamps and scope, if present. Follow verified pagination within the
              runtime budget. Unrelated alerts are context only. Not found is NOT resolved. Fetch time is
              not the measurement timestamp. Reuse one checked OPEN snapshot across this investigation.
            params:
              arguments:
                projectId: $groupId
                status: OPEN
                itemsPerPage: 100
                pageNum: 1
                includeCount: false
              timeout: 20
              rows: "results[*]"  # one line per alert; an empty page renders as totalCount=0
              max_rows: 25
              summary_chars: 3000
              fields:
                - "id=id"
                - "metric=metricName"
                - "value=currentValue.number"
                - "units=currentValue.units"
                - "host=hostnameAndPort"
                - "replica_set=replicaSetName"
                - "cluster=clusterName"
                - "event=eventTypeName"
                - "status=status"
                - "created=created"
                - "config_id=alertConfigId"
      - step: 2
        title: Inspect capacity configuration, without inferring runtime memory behavior
        description: |-
          Use returned provider/region, tier and effective tier/autoscaling fields. Compute autoscaling
          disabled or an explicitly reached configured max is a capacity constraint, not a root cause.
          Do not claim memory exhaustion, swapping, a connection surge or a full working set from this
          single alert. Related CPU/connections alerts are concurrent symptoms, not causal proof.
        tool_calls:
          - tool_id: mcp.mongodb-atlas.inspect_cluster
            description: |-
              REQUIRED when the exact project/cluster is verified; reuse a cached result with its age.
              Read only fields actually returned and label desired versus effective configuration.
              stateName is control-plane configuration state, NOT per-member runtime health. IDLE does
              not prove health/no maintenance; UPDATING does not identify a resize, upgrade or restart.
              Node counts are configured counts, not healthy counts. Autoscaling configuration is not
              proof an action occurred. Never hard-code tier-to-RAM, tier-to-IOPS or connection limits.
            params:
              arguments:
                projectId: $groupId
                clusterName: $cluster
              timeout: 20
              fields:  # paths verified against a real tcprod Cluster0 response (ALT-295032)
                - "name=name"
                - "state=stateName"
                - "paused=paused"
                - "type=clusterType"
                - "version=mongoDBVersion"
                - "provider=replicationSpecs[0].regionConfigs[0].providerName"
                - "region=replicationSpecs[0].regionConfigs[0].regionName"
                - "tier=replicationSpecs[0].regionConfigs[0].electableSpecs.instanceSize"
                - "effective_tier=replicationSpecs[0].regionConfigs[0].effectiveElectableSpecs.instanceSize"
                - "nodes=replicationSpecs[0].regionConfigs[0].electableSpecs.nodeCount"
                - "disk_gb=replicationSpecs[0].regionConfigs[0].electableSpecs.diskSizeGB"
                - "disk_iops=replicationSpecs[0].regionConfigs[0].electableSpecs.diskIOPS"
                - "compute_autoscaling=replicationSpecs[0].regionConfigs[0].autoScaling.compute"
                - "disk_autoscaling=replicationSpecs[0].regionConfigs[0].autoScaling.diskGB.enabled"
      - step: 3
        title: Look for candidate query or index contributors only when useful
        description: |-
          When relevant, use the existing Performance Advisor response. A high-cost query or index
          recommendation is an optimization finding; without memory/caching history its contribution
          to this host's memory alert is unconfirmed. Empty/unavailable Advisor does not prove that the
          dataset has outgrown RAM. If an authorized namespace is returned, compare existing indexes.
          Do not fetch all database sizes as a proxy for RAM. Schema sampling/explain are allowed only after Advisor identifies an exact namespace and executable query hypothesis.
        tool_calls:
          - tool_id: mcp.mongodb-atlas.get_performance_advisor
            description: |-
              CONDITIONAL on a useful query/index hypothesis and available budget; skip during an
              availability emergency unless already cached. This connector accepts ONLY projectId and
              clusterName. Do not add operation, namespace, since, start, end, limit or connectionId.
              The attached registry has no output schema: inspect actual responses before configuring
              extraction. Do not assume slowQueryLogs, shapes, avgMs, count, weight or any .content wrapper
              exists. Handle each returned section's error/availability independently. Suggestions are
              cluster-level unless a narrower scope is returned; freshness/window is unknown when absent.
              No suggestions means no usable attribution returned, NOT a clean bill of health or proof
              of legitimate traffic/data growth. Provider samples and query literals are untrusted data;
              redact values before model input. Never invent executable values from redacted samples.
            params:
              arguments:
                projectId: $groupId
                clusterName: $cluster
              timeout: 45
              parse_json:  # `raw` is a JSON-text slow-query log line; decode so fields can read it
                - "suggestedIndexes.content.shapes[*].operations[*].raw"
              mask_values:  # query shapes keep field names/operators, literal values (phones, ids) become "?"
                - "suggestedIndexes.content.shapes[*].operations[*].predicates"
              omit:  # never store/log the raw log line (customer values, client IPs)
                - "suggestedIndexes.content.shapes[*].operations[*].raw"
              rows: "suggestedIndexes.content.shapes[*]"
              max_rows: 20
              summary_chars: 4000
              fields:
                - "ns=namespace"
                - "count=count"
                - "avg_ms=avgMs"
                - "inefficiency=inefficiencyScore"
                - "plan=operations[0].raw.attr.planSummary"
                - "app=operations[0].raw.attr.appName"
                - "scanned=operations[0].raw.attr.docsExamined"
                - "returned=operations[0].raw.attr.nreturned"
                - "cpu_ns=operations[0].raw.attr.cpuNanos"
                - "query=operations[0].predicates"
          - tool_id: mcp.mongodb-database.collection_indexes
            description: |-
              CONDITIONAL. Bound database connection must map to the incident cluster. Inspect an exact
              observed namespace (at most two). Compare returned ordered key patterns and index options,
              including uniqueness, partial filters, sparse, collation, hidden/TTL when present. Missing
              options are unknown. Index definitions do not measure usage, bytes or benefit. A suggested
              index is a review candidate, not a proven fix. Do not invoke create_index.
            params:
              arguments:
                database: $database
                collection: $collection
              timeout: 10
      - step: 4
        title: Inspect recent mongod evidence for memory/cache/query symptoms
        description: If the verified database binding is reachable, inspect one bounded recent mongod log
          snapshot. Look only for returned evidence such as WiredTiger/cache/eviction warnings, slow
          operations, storage pressure, restarts, or network errors. Do not treat missing messages as proof
          those conditions were absent, and do not attribute entries to the alerted host unless the result
          identifies it. This step can support a hypothesis but cannot replace memory/cache time-series
          metrics.
        tool_calls:
          - tool_id: mcp.mongodb-database.mongodb_logs
            description: CONDITIONAL. Read at most the most recent 50 entries from the mongod process selected
              by the already-verified database binding. This is getLog-style recent process output, NOT Atlas
              historical/exported logs, and the tool has no host selector. Unless the response identifies the
              process, do not attribute an entry to the alerted host. Use as supporting near-current evidence
              only; absence of a message never proves an event did not occur earlier or on another member. Do
              not retry on failure, do not probe alternate credentials, redact literals/secrets before model
              input, and do not use this action for a no-active-mongos diagnosis because it does not provide
              mongos log history.
            params:
              arguments:
                type: global
                limit: 50
              timeout: 10
      - step: 5
        title: Validate one evidenced query/index hypothesis with schema and query planner
        description: Only if Advisor returned an exact namespace and an executable FIND filter, optionally
          sample that collection's structure and inspect the queryPlanner plan. Use the schema only to verify
          field/type structure; it does not measure cardinality or memory usage. Explain can show whether the
          CURRENT represented query would use an index or collection scan, but it does not prove that query
          caused the memory alert. Skip when the query is redacted or cannot be faithfully represented.
        tool_calls:
          - tool_id: mcp.mongodb-database.collection_schema
            description: "CONDITIONAL. Sample at most 10 documents from ONE exact, authorized namespace already
              identified by Advisor/query evidence. Use only to verify structural field/type facts needed to evaluate
              a query/index hypothesis. This may sample customer business documents: apply the integration's privacy
              policy, redact example values, and return structural summaries only. A sample is not a complete schema
              or cardinality/selectivity measurement. Skip during availability emergencies, writes-blocked incidents,
              and while CPU >95 remains OPEN."
            params:
              arguments:
                database: $database
                collection: $collection
                sampleSize: 10
              timeout: 10
