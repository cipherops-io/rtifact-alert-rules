        description: Have the DB owner verify real memory/cache/swap history and capacity/autoscaling
          constraints in Atlas before selecting a tier change.
        tool_id: ''
        requires_approval: true
    escalation: P2 DB owner; involve service owner for an evidenced query candidate. Raise urgency for
      independently reported application failures or active Core availability alerts, not a guessed
      working-set cause.
    follow_up:
      - 'Use a matching newer CLOSED observation/close webhook for this occurrence, not its absence

        from one OPEN page. Closure is symptom recovery, not proof that a recommended fix worked.

        For customer-impacting alerts, ask the owning team to confirm application recovery separately.

        Keep the final report and evidence references even when the cause is not established.'
      - Report root cause as not established when only the memory alert and static capacity settings are
