        title: Optionally inspect one recent mongod log buffer after P1 escalation
        description: After owner escalation, and only when an already-verified same-cluster database
          connection can answer without connection probing, make at most one no-retry recent-log call.
          Returned REPL/ELECTION/NETWORK/CONTROL messages can support a failover/member-availability
          hypothesis, but this tool is not a replica-set-wide historical log source and may fail while no
