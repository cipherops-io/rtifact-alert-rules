              not prove health/no maintenance; UPDATING does not identify a resize, upgrade or restart.
              Node counts are configured counts, not healthy counts. Autoscaling configuration is not
              proof an action occurred. Never hard-code tier-to-RAM, tier-to-IOPS or connection limits.
            params:
              arguments:
                projectId: $groupId
                clusterName: $cluster
              timeout: 20
              fields:  # paths verified against a real tcprod Cluster0 response (ALT-295032)
                - "name=name"
                - "state=stateName"
                - "paused=paused"
                - "type=clusterType"
                - "version=mongoDBVersion"
                - "provider=replicationSpecs[0].regionConfigs[0].providerName"
                - "region=replicationSpecs[0].regionConfigs[0].regionName"
                - "tier=replicationSpecs[0].regionConfigs[0].electableSpecs.instanceSize"
                - "effective_tier=replicationSpecs[0].regionConfigs[0].effectiveElectableSpecs.instanceSize"
                - "nodes=replicationSpecs[0].regionConfigs[0].electableSpecs.nodeCount"
                - "disk_gb=replicationSpecs[0].regionConfigs[0].electableSpecs.diskSizeGB"
                - "disk_iops=replicationSpecs[0].regionConfigs[0].electableSpecs.diskIOPS"
                - "compute_autoscaling=replicationSpecs[0].regionConfigs[0].autoScaling.compute"
                - "disk_autoscaling=replicationSpecs[0].regionConfigs[0].autoScaling.diskGB.enabled"
      - step: 3
        title: Inspect a bounded database storage snapshot
        description: |-
          Only with verified database credential mapping and no emergency: reuse a cached catalog
          or list databases once. Select at most one candidate from explicit evidence or returned
          size metadata; never assume first means largest. Read db_stats for that database. Report
          logical data, allocated document storage, index storage and units separately. A mongos
          aggregate must not be labeled as the firing shard/member's local disk. Permission-limited
          visibility means partial coverage, not a complete storage inventory.
        tool_calls:
          - tool_id: mcp.mongodb-database.list_databases
            description: |-
              CONDITIONAL storage discovery only, after the bound database credential has been verified
              against this incident's tenant, Atlas project and cluster outside model input. This schema
              has no connectionId or limit. Reuse cached metadata; do not fan out across all databases.
              Only use names and sizes actually returned. Accessible/returned databases can be a subset;
              report partial coverage. Select at most one authorized candidate for this run.
            params:
              arguments: {}
              timeout: 10
          - tool_id: mcp.mongodb-database.db_stats
            description: |-
              CONDITIONAL. Inspect ONE verified candidate database. Record observedAt, database,
              connection scope, source fields and units/scaleFactor when returned. dataSize is logical
              data, storageSize is allocated document storage and indexSize is allocated index storage;
              do not add dataSize to storageSize. Do not assume GB, hot working-set size, growth rate,
              per-shard/per-host attribution or disk percent from these values. Do not add filesystem
              sizes across databases. Timeouts/permission failures are evidence gaps, not zero usage.
            params:
              arguments:
                database: $database
              timeout: 10
      - step: 4
        title: Inspect only a few evidence-backed collection candidates
        description: |-
          Use a namespace already present in evidence; otherwise list collections in the selected
          database once. Choose at most two, not an unbounded fan-out. collection_storage_size reports
          only what its actual output says; list_collection_indexes does not supply per-index bytes.
          Say largest among inspected items, not largest in cluster. Do not infer growth or unused
          space from a single snapshot. Optional cached Advisor drop-index findings are review leads,
          not guaranteed reclaimable filesystem space. Do not delay capacity escalation for a full
          inventory.
        tool_calls:
          - tool_id: mcp.mongodb-database.list_collections
            description: |-
              CONDITIONAL. Database must come from trusted incident context or an authorized observed
              namespace/database catalog. This call has no limit/filter parameter. Do not enumerate every
              collection then issue a call for each. Select at most two evidence-backed candidates, with
              partial coverage explicitly recorded. Skip if no safe candidate can be selected.
            params:
              arguments:
                database: $database
              timeout: 10
          - tool_id: mcp.mongodb-database.collection_storage_size
            description: |-
              CONDITIONAL. Inspect only a discovered, authorized namespace; at most two per run.
              Report the precise returned measure and unit. A single collection size is not a growth
              trend, the hot working set, a complete host disk breakdown or per-index size. Preserve the
              collection remainder after the first dot in a namespace. Skip views/unsupported collections
              when the tool says unsupported, and do not create a collection to make a call succeed.
            params:
              arguments:
                database: $database
                collection: $collection
              timeout: 10
      - step: 5
        title: Inspect recent storage-engine messages as supporting evidence
        description: After bounded storage snapshots, inspect one recent mongod log buffer for returned
          WiredTiger, checkpoint, storage, journal, recovery, or disk-related warnings/errors. Logs can
          explain contemporaneous storage-engine trouble but cannot identify historical growth rate or
          complete filesystem consumers. No matching messages is not a clean bill of health.
        tool_calls:
          - tool_id: mcp.mongodb-database.mongodb_logs
            description: CONDITIONAL. Read at most the most recent 50 entries from the mongod process selected
              by the already-verified database binding. This is getLog-style recent process output, NOT Atlas
              historical/exported logs, and the tool has no host selector. Unless the response identifies the
              process, do not attribute an entry to the alerted host. Use as supporting near-current evidence
              only; absence of a message never proves an event did not occur earlier or on another member. Do
              not retry on failure, do not probe alternate credentials, redact literals/secrets before model
              input, and do not use this action for a no-active-mongos diagnosis because it does not provide
              mongos log history.
            params:
              arguments:
                type: global
                limit: 50
              timeout: 10
    remediation:
      - action: review_storage_capacity
        description: DB owner should assess storage headroom and permitted expansion/autoscaling promptly;
          select a remedy after verifying current capacity and deployment constraints.
        tool_id: ''
        requires_approval: true
      - action: review_retention_after_stabilizing
        description: Use observed footprints to plan retention/archival/index review with the data owner.
          Document deletion does not necessarily release filesystem space; no automatic delete, compact or
          drop operations.
        tool_id: ''
        requires_approval: true
    escalation: P2 DB owner for disk pressure. P1 when a current write-blocking or other availability event is
      positively reported; escalate first and stop additional database work.
    follow_up:
      - 'Use a matching newer CLOSED observation/close webhook for this occurrence, not its absence

