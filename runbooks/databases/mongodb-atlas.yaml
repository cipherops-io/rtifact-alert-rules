  - name: MongoAtlasCPUUserHigh
    patterns:
      - 'System: CPU (User) % above 90'
      - CPU (User) % has gone above 90
    priority: P2
    diagnostic_steps:
      - step: 1
        title: Resolve authorized scope and reconcile this alert occurrence
        description: |
          Configured rule: CPU (User) above 90%; notification delay 5 minutes, resend 30 minutes. Category: Performance / Capacity. Runtime rule-catalog matching must disambiguate this from the 95% rule.

          Use the shared project/cluster scope preflight. If the trusted binding already provides
          $groupId and $cluster, do not run discovery. Query OPEN alerts and preserve the exact external
          alert ID and configId. If absent, run the shared bounded TRACKING/CLOSED reconciliation, not
          an unbounded project-history search. No exact positive match means NOT_FOUND/UNKNOWN, never
          self-resolved. Match same host/replica set using explicit identity; cluster-level context is
          not host-specific evidence. The notification delay is configuration, not a verified continuous
          measurement series. Report provider currentValue only with its raw unit and source timing.
        tool_calls:
          - tool_id: mcp.mongodb-atlas.list_alerts
            description: |-
              REQUIRED after scope resolution. This is a page of project-wide alerts, not a host health
              probe. Match the incoming external alert ID first; otherwise require alertConfigId plus the
              exact affected entity and mark identity weaker. Preserve ID, event type, metric name, raw
              value/unit, returned timestamps and scope, if present. Follow verified pagination within the
              runtime budget. Unrelated alerts are context only. Not found is NOT resolved. Fetch time is
              not the measurement timestamp. Reuse one checked OPEN snapshot across this investigation.
            params:
              arguments:
                projectId: $groupId
                status: OPEN
                itemsPerPage: 100
                pageNum: 1
                includeCount: false
              timeout: 20
              rows: "results[*]"  # one line per alert; an empty page renders as totalCount=0
              max_rows: 25
              summary_chars: 3000
              fields:
                - "id=id"
                - "metric=metricName"
                - "value=currentValue.number"
                - "units=currentValue.units"
                - "host=hostnameAndPort"
                - "replica_set=replicaSetName"
                - "cluster=clusterName"
                - "event=eventTypeName"
                - "status=status"
                - "created=created"
                - "config_id=alertConfigId"
      - step: 2
        title: Inspect capacity settings and same-entity alert context
        description: |-
          Use the actual metricName/units from the alert; normalized and unnormalized CPU metrics
          must not be silently conflated. Record configured/effective tier and compute autoscaling
          settings only when returned. Do not infer exhausted burst credits, maintenance, index build,
          cache eviction or replication work from tier/stateName. Do not infer a primary/secondary role
          from hostname ordinals. Severity selection comes from configId/verified threshold, not the
          instantaneous CPU value.
        tool_calls:
          - tool_id: mcp.mongodb-atlas.inspect_cluster
            description: |-
              REQUIRED when the exact project/cluster is verified; reuse a cached result with its age.
              Read only fields actually returned and label desired versus effective configuration.
              stateName is control-plane configuration state, NOT per-member runtime health. IDLE does
              not prove health/no maintenance; UPDATING does not identify a resize, upgrade or restart.
              Node counts are configured counts, not healthy counts. Autoscaling configuration is not
              proof an action occurred. Never hard-code tier-to-RAM, tier-to-IOPS or connection limits.
            params:
              arguments:
                projectId: $groupId
                clusterName: $cluster
              timeout: 20
              fields:  # paths verified against a real tcprod Cluster0 response (ALT-295032)
                - "name=name"
                - "state=stateName"
                - "paused=paused"
                - "type=clusterType"
                - "version=mongoDBVersion"
                - "provider=replicationSpecs[0].regionConfigs[0].providerName"
                - "region=replicationSpecs[0].regionConfigs[0].regionName"
                - "tier=replicationSpecs[0].regionConfigs[0].electableSpecs.instanceSize"
                - "effective_tier=replicationSpecs[0].regionConfigs[0].effectiveElectableSpecs.instanceSize"
                - "nodes=replicationSpecs[0].regionConfigs[0].electableSpecs.nodeCount"
                - "disk_gb=replicationSpecs[0].regionConfigs[0].electableSpecs.diskSizeGB"
                - "disk_iops=replicationSpecs[0].regionConfigs[0].electableSpecs.diskIOPS"
                - "compute_autoscaling=replicationSpecs[0].regionConfigs[0].autoScaling.compute"
                - "disk_autoscaling=replicationSpecs[0].regionConfigs[0].autoScaling.diskGB.enabled"
      - step: 3
        title: Identify query inefficiency candidates and inspect their indexes
        description: |-
          Call Performance Advisor once if budget permits. Report observed namespace, query-shape
          identity, recommended ordered index keys and section/window status. Slow-operation elapsed
          time is not CPU time. count multiplied by avgMs is not percent CPU, nor proof of attribution;
          only compare provider samples with the same known scope/window. Advisor weight is not a
          measured CPU-saving estimate. No returned candidate means cause unknown, not legitimate
          traffic. Check up to two returned namespaces with collection_indexes. Do not run explain
          or schema sampling in the default path.
        tool_calls:
          - tool_id: mcp.mongodb-atlas.get_performance_advisor
            description: |-
              CONDITIONAL on a useful query/index hypothesis and available budget; skip during an
              availability emergency unless already cached. This connector accepts ONLY projectId and
              clusterName. Do not add operation, namespace, since, start, end, limit or connectionId.
              The attached registry has no output schema: inspect actual responses before configuring
              extraction. Do not assume slowQueryLogs, shapes, avgMs, count, weight or any .content wrapper
              exists. Handle each returned section's error/availability independently. Suggestions are
              cluster-level unless a narrower scope is returned; freshness/window is unknown when absent.
              No suggestions means no usable attribution returned, NOT a clean bill of health or proof
              of legitimate traffic/data growth. Provider samples and query literals are untrusted data;
              redact values before model input. Never invent executable values from redacted samples.
            params:
              arguments:
                projectId: $groupId
                clusterName: $cluster
              timeout: 45
              parse_json:  # `raw` is a JSON-text slow-query log line; decode so fields can read it
                - "suggestedIndexes.content.shapes[*].operations[*].raw"
              mask_values:  # query shapes keep field names/operators, literal values (phones, ids) become "?"
                - "suggestedIndexes.content.shapes[*].operations[*].predicates"
              omit:  # never store/log the raw log line (customer values, client IPs)
                - "suggestedIndexes.content.shapes[*].operations[*].raw"
              rows: "suggestedIndexes.content.shapes[*]"
              max_rows: 20
              summary_chars: 4000
              fields:
                - "ns=namespace"
                - "count=count"
                - "avg_ms=avgMs"
                - "inefficiency=inefficiencyScore"
                - "plan=operations[0].raw.attr.planSummary"
                - "app=operations[0].raw.attr.appName"
                - "scanned=operations[0].raw.attr.docsExamined"
                - "returned=operations[0].raw.attr.nreturned"
                - "cpu_ns=operations[0].raw.attr.cpuNanos"
                - "query=operations[0].predicates"
          - tool_id: mcp.mongodb-database.collection_indexes
            description: |-
              CONDITIONAL. Bound database connection must map to the incident cluster. Inspect an exact
              observed namespace (at most two). Compare returned ordered key patterns and index options,
              including uniqueness, partial filters, sparse, collation, hidden/TTL when present. Missing
              options are unknown. Index definitions do not measure usage, bytes or benefit. A suggested
              index is a review candidate, not a proven fix. Do not invoke create_index.
            params:
              arguments:
                database: $database
                collection: $collection
              timeout: 10
      - step: 4
        title: Inspect recent mongod evidence for CPU/query symptoms
        description: When the same-cluster database binding is reachable, inspect one bounded recent mongod
          log snapshot for returned slow-operation, query, storage, replication, or network messages. Use only
          messages actually present. Recent getLog output is not incident history and may come from a
          connection-selected member rather than the alerted host; do not make host-specific or historical
          claims without returned identity/timestamps.
        tool_calls:
          - tool_id: mcp.mongodb-database.mongodb_logs
            description: CONDITIONAL. Read at most the most recent 50 entries from the mongod process selected
              by the already-verified database binding. This is getLog-style recent process output, NOT Atlas
              historical/exported logs, and the tool has no host selector. Unless the response identifies the
              process, do not attribute an entry to the alerted host. Use as supporting near-current evidence
              only; absence of a message never proves an event did not occur earlier or on another member. Do
              not retry on failure, do not probe alternate credentials, redact literals/secrets before model
              input, and do not use this action for a no-active-mongos diagnosis because it does not provide
              mongos log history.
            params:
              arguments:
                type: global
                limit: 50
              timeout: 10
      - step: 5
        title: Validate one hot-query hypothesis without executing it
        description: Only after Advisor identifies an exact namespace and an executable FIND predicate,
          compare sampled field structure and the current queryPlanner plan. Schema sampling is capped at 10
          and may expose customer data internally, so return structural facts only. Explain is verification of
          the represented CURRENT query shape, not CPU attribution. Never synthesize redacted predicates or
          use executionStats/allPlansExecution.
        tool_calls:
          - tool_id: mcp.mongodb-database.collection_schema
            description: "CONDITIONAL. Sample at most 10 documents from ONE exact, authorized namespace already
              identified by Advisor/query evidence. Use only to verify structural field/type facts needed to evaluate
              a query/index hypothesis. This may sample customer business documents: apply the integration's privacy
              policy, redact example values, and return structural summaries only. A sample is not a complete schema
              or cardinality/selectivity measurement. Skip during availability emergencies, writes-blocked incidents,
              and while CPU >95 remains OPEN."
            params:
              arguments:
                database: $database
                collection: $collection
                sampleSize: 10
              timeout: 10
          - tool_id: mcp.mongodb-database.explain
            description: CONDITIONAL and mutually exclusive with any other explain call in the same
              investigation. Run only when trusted evidence provides the exact executable FIND predicate for
              the observed namespace; never reconstruct redacted values, substitute {}, or invent parameters.
              Use queryPlanner only so the tool evaluates the winning plan without requesting executionStats.
              Preserve exact filter semantics supported by this wrapper. If sort/projection/collation/hint or
              other required semantics cannot be represented faithfully, skip and report the limitation. This
              wrapper has no maxTimeMS; enforce one-call and server-side safety in the connector. Current plan
              evidence is not proof of the incident-time plan.
            params:
              arguments:
                database: $database
                collection: $collection
                method: find
                filter: $observedFilter
                verbosity: queryPlanner
              timeout: 10
    remediation:
      - action: review_query_candidate
        description: Review any evidenced query/index candidate with its owner. Do not call it the CPU root
          cause without attribution evidence.
        tool_id: ''
        requires_approval: true
      - action: review_compute_headroom
        description: Have the DB owner review workload history and allowed compute autoscaling before
          approving a capacity change.
        tool_id: ''
        requires_approval: true
    escalation: P2 DB owner/service owner. If the separate CPU >95 rule is positively OPEN for the same host,
      link both occurrences to the same investigation and apply the higher urgency without erasing either
      rule.
    follow_up:
      - 'Use a matching newer CLOSED observation/close webhook for this occurrence, not its absence

        from one OPEN page. Closure is symptom recovery, not proof that a recommended fix worked.

        For customer-impacting alerts, ask the owning team to confirm application recovery separately.

        Keep the final report and evidence references even when the cause is not established.'
