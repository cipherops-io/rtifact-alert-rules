        title: Resolve authorized scope and reconcile this alert occurrence
        description: |
          Configured rule: scanned objects / returned above 1000; notification delay 10 minutes, resend 30 minutes. Category: Performance / Capacity. The host ratio flags efficiency risk but does not identify a query.

          Use the shared project/cluster scope preflight. If the trusted binding already provides
