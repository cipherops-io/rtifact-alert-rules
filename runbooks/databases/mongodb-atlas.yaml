                status: OPEN
                itemsPerPage: 100
                pageNum: 1
                includeCount: false
              timeout: 20
              rows: "results[*]"  # one line per alert; an empty page renders as totalCount=0
              max_rows: 25
              summary_chars: 3000
              fields:
                - "id=id"
                - "metric=metricName"
                - "value=currentValue.number"
                - "units=currentValue.units"
                - "host=hostnameAndPort"
                - "replica_set=replicaSetName"
                - "cluster=clusterName"
                - "event=eventTypeName"
                - "status=status"
                - "created=created"
                - "config_id=alertConfigId"
      - step: 2
        title: Check write-blocking precedence and storage/autoscaling configuration
        description: |-
          If write-blocking/no-primary/no-mongos is active or suspected, switch to the emergency
          Atlas-only path and skip all subsequent database calls. Otherwise inspect returned disk and
          autoscaling settings. Disabled autoscaling is a constraint, not proven cause of disk growth.
          Enabled autoscaling plus a disk alert does not prove failure, tier maximum, or a resize in
          progress. Do not compute time-to-full from one percentage or from notification recurrence.
        tool_calls:
          - tool_id: mcp.mongodb-atlas.inspect_cluster
            description: |-
              REQUIRED when the exact project/cluster is verified; reuse a cached result with its age.
              Read only fields actually returned and label desired versus effective configuration.
