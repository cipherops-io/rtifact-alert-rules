groups:
  - name: kubernetes-workloads.rules
    interval: 30s
    rules:
      - alert: KubePodCrashLooping
        expr: |
          max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[5m]) >= 1
          or
          increase(kube_pod_container_status_restarts_total[15m]) > 5
        for: 5m
        labels:
          severity: critical
          priority: P1
          tech_stack: kubernetes
          signal: symptom
          category: workload
          runbook: runbooks/kubernetes/workloads.md
        annotations:
          summary: "Pod container is crash-looping"
          description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} is crash-looping or restarting too frequently."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/kubernetes/workloads.md#kubepodcrashlooping"

      - alert: KubePodOOMKilled
        expr: |
          increase(kube_pod_container_status_restarts_total[10m]) > 0
          and on(namespace, pod, container)
          max_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
        for: 0m
        labels:
          severity: critical
          priority: P1
          tech_stack: kubernetes
          signal: symptom
          category: workload
          runbook: runbooks/kubernetes/workloads.md
        annotations:
          summary: "Pod container was OOMKilled"
          description: "Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} was OOMKilled. Increase memory limit or fix memory leak."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/kubernetes/workloads.md#kubepodoomkilled"

      - alert: KubeContainerWaiting
        expr: kube_pod_container_status_waiting_reason{reason!="ContainerCreating"} == 1
        for: 1h
        labels:
          severity: warning
          priority: P2
          tech_stack: kubernetes
          signal: cause
          category: workload
          runbook: runbooks/kubernetes/workloads.md
        annotations:
          summary: "Pod container has been waiting too long"
          description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} has been waiting for more than 1 hour (reason: {{ $labels.reason }})."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/kubernetes/workloads.md#kubecontainerwaiting"

      - alert: KubePodNotReady
        expr: kube_pod_status_ready{condition="true"} == 0
        for: 15m
        labels:
          severity: warning
          priority: P2
          tech_stack: kubernetes
          signal: symptom
          category: workload
          runbook: runbooks/kubernetes/workloads.md
        annotations:
          summary: "Pod has not been ready for too long"
          description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has not been ready for 15 minutes."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/kubernetes/workloads.md#kubepodnotready"

      - alert: KubeDeploymentReplicasMismatch
        expr: kube_deployment_spec_replicas != kube_deployment_status_replicas_available
        for: 15m
        labels:
          severity: warning
          priority: P2
          tech_stack: kubernetes
          signal: symptom
          category: rollout
          runbook: runbooks/kubernetes/workloads.md
        annotations:
          summary: "Deployment available replicas do not match desired spec"
          description: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has fewer available replicas than desired."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/kubernetes/workloads.md#kubedeploymentreplicasmismatch"

      - alert: KubeDeploymentRolloutStuck
        expr: kube_deployment_status_condition{condition="Progressing",status="false"} == 1
        for: 15m
        labels:
          severity: warning
          priority: P2
          tech_stack: kubernetes
          signal: cause
          category: rollout
          runbook: runbooks/kubernetes/workloads.md
        annotations:
          summary: "Deployment rollout is stuck"
          description: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} rollout has been stuck for 15 minutes."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/kubernetes/workloads.md#kubedeploymentrolloutstuck"

      - alert: KubeStatefulSetReplicasMismatch
        expr: kube_statefulset_status_replicas_ready != kube_statefulset_replicas
        for: 10m
        labels:
          severity: critical
          priority: P1
          tech_stack: kubernetes
          signal: symptom
          category: rollout
          runbook: runbooks/kubernetes/workloads.md
        annotations:
          summary: "StatefulSet has fewer ready replicas than desired"
          description: "StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }} does not have all replicas ready."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/kubernetes/workloads.md#kubestatefulsetreplicasmismatch"

      - alert: KubeDaemonSetNotScheduled
        expr: kube_daemonset_status_desired_number_scheduled != kube_daemonset_status_number_ready
        for: 15m
        labels:
          severity: warning
          priority: P2
          tech_stack: kubernetes
          signal: symptom
          category: rollout
          runbook: runbooks/kubernetes/workloads.md
        annotations:
          summary: "DaemonSet not ready on all desired nodes"
          description: "DaemonSet {{ $labels.namespace }}/{{ $labels.daemonset }} is not ready on all desired nodes."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/kubernetes/workloads.md#kubedaemonsetnotscheduled"

      - alert: KubePodImagePullBackOff
        expr: kube_pod_container_status_waiting_reason{reason=~"ImagePullBackOff|ErrImagePull"} == 1
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: kubernetes
          signal: symptom
          category: workload
          runbook: runbooks/kubernetes/workloads.md
        annotations:
          summary: "Pod cannot pull its container image"
          description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} cannot pull image (reason: {{ $labels.reason }}) — check registry credentials and image tag."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/kubernetes/workloads.md#kubepodimagepullbackoff"

      - alert: KubeJobFailed
        expr: kube_job_status_failed > 0 and kube_job_status_succeeded == 0
        for: 15m
        labels:
          severity: warning
          priority: P2
          tech_stack: kubernetes
          signal: symptom
          category: batch
          runbook: runbooks/kubernetes/workloads.md
        annotations:
          summary: "Kubernetes Job has failed"
          description: "Kubernetes Job {{ $labels.namespace }}/{{ $labels.job_name }} has failed {{ $value }} times."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/kubernetes/workloads.md#kubejobfailed"

      - alert: KubeCronJobSuspended
        expr: kube_cronjob_spec_suspend == 1
        for: 1h
        labels:
          severity: warning
          priority: P3
          tech_stack: kubernetes
          signal: cause
          category: batch
          runbook: runbooks/kubernetes/workloads.md
        annotations:
          summary: "CronJob is suspended"
          description: "CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} is suspended — scheduled runs are not happening."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/kubernetes/workloads.md#kubecronjobsuspended"

      - alert: KubePodEvicted
        expr: kube_pod_status_reason{reason="Evicted"} == 1
        for: 0m
        labels:
          severity: warning
          priority: P2
          tech_stack: kubernetes
          signal: symptom
          category: workload
          runbook: runbooks/kubernetes/workloads.md
        annotations:
          summary: "Pod has been evicted from its node"
          description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been evicted from its node."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/kubernetes/workloads.md#kubepodevicted"

      - alert: KubePodPendingTooLong
        expr: kube_pod_status_phase{phase="Pending"} == 1
        for: 15m
        labels:
          severity: warning
          priority: P2
          tech_stack: kubernetes
          signal: cause
          category: scheduling
          runbook: runbooks/kubernetes/workloads.md
        annotations:
          summary: "Pod has been Pending for too long"
          description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been Pending for more than 15 minutes — check scheduler events for insufficient resources or affinity issues."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/kubernetes/workloads.md#kubepodpendingtoolong"

      - alert: KubePersistentVolumeError
        expr: kube_persistentvolume_status_phase{phase=~"Failed|Lost|Pending"} == 1
        for: 10m
        labels:
          severity: critical
          priority: P1
          tech_stack: kubernetes
          signal: symptom
          category: storage
          runbook: runbooks/kubernetes/workloads.md
        annotations:
          summary: "PersistentVolume is in an unhealthy state"
          description: "PersistentVolume {{ $labels.persistentvolume }} is in {{ $labels.phase }} state — pods using this PV cannot mount storage."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/kubernetes/workloads.md#kubepersistentvolumeerror"

      - alert: KubePVCFillingUp
        expr: kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.15
        for: 15m
        labels:
          severity: warning
          priority: P2
          tech_stack: kubernetes
          signal: cause
          category: storage
          runbook: runbooks/kubernetes/workloads.md
        annotations:
          summary: "PVC has less than 15% free space"
          description: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has less than 15% free space remaining."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/kubernetes/workloads.md#kubepvcfillingup"

      - alert: KubePVCCriticalFull
        expr: kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.05
        for: 5m
        labels:
          severity: critical
          priority: P1
          tech_stack: kubernetes
          signal: cause
          category: storage
          runbook: runbooks/kubernetes/workloads.md
        annotations:
          summary: "PVC has less than 5% free space"
          description: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has less than 5% free space remaining."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/kubernetes/workloads.md#kubepvccriticalfull"

      - alert: KubeHpaMaxedOut
        expr: |
          kube_horizontalpodautoscaler_status_desired_replicas
            >= kube_horizontalpodautoscaler_spec_max_replicas
          and kube_horizontalpodautoscaler_spec_max_replicas > 1
          and kube_horizontalpodautoscaler_spec_min_replicas
            != kube_horizontalpodautoscaler_spec_max_replicas
        for: 15m
        labels:
          severity: warning
          priority: P2
          tech_stack: kubernetes
          signal: cause
          category: autoscaling
          runbook: runbooks/kubernetes/workloads.md
        annotations:
          summary: "HPA has been at max replicas"
          description: "HPA {{ $labels.namespace }}/{{ $labels.horizontalpodautoscaler }} has been at max replicas for over 15 minutes."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/kubernetes/workloads.md#kubehpamaxedout"
