groups:
  - name: kubelet.rules
    interval: 30s
    rules:
      - alert: KubeletDown
        expr: absent(up{job="kubelet"} == 1)
        for: 5m
        labels:
          severity: critical
          priority: P0
          tech_stack: kubelet
          signal: symptom
          category: node
          runbook: runbooks/kubernetes/kubelet.md
        annotations:
          summary: "All kubelet instances are unreachable"
          description: "No kubelet instance has been reachable for 5 minutes — node-level visibility lost cluster-wide."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/kubernetes/kubelet.md#kubeletdown"

      - alert: KubeletNodeNotReady
        expr: kube_node_status_condition{condition="Ready",status="true"} == 0
        for: 10m
        labels:
          severity: critical
          priority: P1
          tech_stack: kubelet
          signal: symptom
          category: node
          runbook: runbooks/kubernetes/kubelet.md
        annotations:
          summary: "Kubernetes node is NotReady"
          description: "Node {{ $labels.node }} has been NotReady for more than 10 minutes — pods on this node may be evicted."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/kubernetes/kubelet.md#kubeletnodenotready"

      - alert: KubeletMemoryPressure
        expr: kube_node_status_condition{condition="MemoryPressure",status="true"} == 1
        for: 5m
        labels:
          severity: critical
          priority: P1
          tech_stack: kubelet
          signal: cause
          category: node
          runbook: runbooks/kubernetes/kubelet.md
        annotations:
          summary: "Node has MemoryPressure"
          description: "Node {{ $labels.node }} is under MemoryPressure — pods will be evicted."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/kubernetes/kubelet.md#kubeletmemorypressure"

      - alert: KubeletDiskPressure
        expr: kube_node_status_condition{condition="DiskPressure",status="true"} == 1
        for: 5m
        labels:
          severity: critical
          priority: P1
          tech_stack: kubelet
          signal: cause
          category: node
          runbook: runbooks/kubernetes/kubelet.md
        annotations:
          summary: "Node has DiskPressure"
          description: "Node {{ $labels.node }} is under DiskPressure — pods will be evicted. Check disk usage and log accumulation."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/kubernetes/kubelet.md#kubeletdiskpressure"

      - alert: KubeletPIDPressure
        expr: kube_node_status_condition{condition="PIDPressure",status="true"} == 1
        for: 5m
        labels:
          severity: critical
          priority: P1
          tech_stack: kubelet
          signal: cause
          category: node
          runbook: runbooks/kubernetes/kubelet.md
        annotations:
          summary: "Node has PIDPressure"
          description: "Node {{ $labels.node }} is under PIDPressure — process limit on the node is being approached."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/kubernetes/kubelet.md#kubeletpidpressure"

      - alert: KubeletNetworkUnavailable
        expr: kube_node_status_condition{condition="NetworkUnavailable",status="true"} == 1
        for: 5m
        labels:
          severity: critical
          priority: P1
          tech_stack: kubelet
          signal: symptom
          category: network
          runbook: runbooks/kubernetes/kubelet.md
        annotations:
          summary: "Node network is unavailable"
          description: "Node {{ $labels.node }} reports NetworkUnavailable."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/kubernetes/kubelet.md#kubeletnetworkunavailable"

      - alert: KubeletPodLifecycleEventGeneratorLatencyHigh
        expr: |
          histogram_quantile(0.99,
            rate(kubelet_pleg_relist_duration_seconds_bucket{job="kubelet"}[5m])
          ) > 10
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: kubelet
          signal: cause
          category: node
          runbook: runbooks/kubernetes/kubelet.md
        annotations:
          summary: "Kubelet PLEG relist latency is high"
          description: "Kubelet PLEG p99 relist duration on {{ $labels.node }} is {{ $value | humanizeDuration }} — node may go NotReady."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/kubernetes/kubelet.md#kubeletpodlifecycleeventgeneratorlatencyhigh"

      - alert: KubeletPodStartupLatencyHigh
        expr: |
          histogram_quantile(0.99,
            rate(kubelet_pod_start_duration_seconds_bucket{job="kubelet"}[5m])
          ) > 60
        for: 15m
        labels:
          severity: warning
          priority: P2
          tech_stack: kubelet
          signal: cause
          category: node
          runbook: runbooks/kubernetes/kubelet.md
        annotations:
          summary: "Kubelet pod startup p99 latency is high"
          description: "Kubelet pod startup p99 latency on {{ $labels.node }} is {{ $value | humanizeDuration }}."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/kubernetes/kubelet.md#kubeletpodstartuplatencyhigh"

      - alert: KubeletTooManyPods
        expr: |
          max by (node) (kubelet_running_pods{job="kubelet"})
          / max by (node) (kube_node_status_capacity{resource="pods"}) > 0.95
        for: 15m
        labels:
          severity: warning
          priority: P2
          tech_stack: kubelet
          signal: cause
          category: node
          runbook: runbooks/kubernetes/kubelet.md
        annotations:
          summary: "Node is at >95% pod capacity"
          description: "Node {{ $labels.node }} is running at {{ $value | humanizePercentage }} of its pod capacity."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/kubernetes/kubelet.md#kubelettoomanypods"

      - alert: KubeletClientCertExpiring
        expr: kubelet_certificate_manager_client_ttl_seconds < 86400 * 7
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: kubelet
          signal: cause
          category: security
          runbook: runbooks/kubernetes/kubelet.md
        annotations:
          summary: "Kubelet client certificate expires within 7 days"
          description: "Kubelet client certificate on {{ $labels.node }} expires in {{ $value | humanizeDuration }}."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/kubernetes/kubelet.md#kubeletclientcertexpiring"
