groups:
  - name: redis.rules
    interval: 30s
    rules:
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
          priority: P1
          tech_stack: redis
          signal: symptom
          category: data
          runbook: runbooks/databases/redis.yaml
        annotations:
          summary: "Redis instance is down"
          description: "Redis instance {{ $labels.instance }} has been unreachable for more than 1 minute. Applications using this Redis endpoint may fail cache reads/writes, sessions, locks, queues, rate limits, or pub/sub."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/redis.yaml#redisdown"

      - alert: RedisMissingMaster
        expr: (count(redis_instance_info{role="master"}) or vector(0)) < 1
        for: 1m
        labels:
          severity: critical
          priority: P1
          tech_stack: redis
          signal: symptom
          category: data
          runbook: runbooks/databases/redis.yaml
        annotations:
          summary: "Redis master is missing"
          description: "No Redis instance is currently reported with role=master. Write traffic may be unavailable and failover/promotion may be broken."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/redis.yaml#redismissingmaster"

      - alert: RedisTooManyMasters
        expr: count(redis_instance_info{role="master"}) > 1
        for: 1m
        labels:
          severity: critical
          priority: P1
          tech_stack: redis
          signal: symptom
          category: data
          runbook: runbooks/databases/redis.yaml
        annotations:
          summary: "Redis has too many masters"
          description: "More than one Redis instance is reported with role=master — possible split-brain, failed failover cleanup, or (in a multi-instance fleet) independent standalone instances counted together."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/redis.yaml#redistoomanymasters"

      - alert: RedisReplicationBroken
        expr: delta(redis_connected_slaves[1m]) < 0
        for: 1m
        labels:
          severity: critical
          priority: P1
          tech_stack: redis
          signal: symptom
          category: data
          runbook: runbooks/databases/redis.yaml
        annotations:
          summary: "Redis replication broken"
          description: "Redis instance {{ $labels.instance }} lost one or more connected replicas in the last minute. Replication redundancy and failover safety are degraded."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/redis.yaml#redisreplicationbroken"

      - alert: RedisClusterFlapping
        expr: changes(redis_connected_slaves[2m]) > 2
        for: 2m
        labels:
          severity: critical
          priority: P1
          tech_stack: redis
          signal: symptom
          category: data
          runbook: runbooks/databases/redis.yaml
        annotations:
          summary: "Redis replica connection is flapping"
          description: "Redis replica connection count is changing frequently on {{ $labels.instance }} — replicas may be repeatedly disconnecting/reconnecting, loading the master with resync work."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/redis.yaml#redisclusterflapping"

      - alert: RedisMissingBackup
        expr: time() - redis_rdb_last_save_timestamp_seconds > 60 * 60 * 48
        for: 5m
        labels:
          severity: critical
          priority: P1
          tech_stack: redis
          signal: cause
          category: data
          runbook: runbooks/databases/redis.yaml
        annotations:
          summary: "Redis RDB backup is stale"
          description: "Redis has not completed an RDB save for more than 48 hours on {{ $labels.instance }} — recoverable dataset may be older than the expected RPO."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/redis.yaml#redismissingbackup"

      - alert: RedisHighMemoryUsage
        expr: |
          redis_memory_max_bytes > 0
          and
          redis_memory_used_bytes / redis_memory_max_bytes > 0.80
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: redis
          signal: cause
          category: data
          runbook: runbooks/databases/redis.yaml
        annotations:
          summary: "Redis memory usage is high"
          description: "Redis memory usage is above 80% of configured maxmemory on {{ $labels.instance }} — approaching eviction/rejection risk."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/redis.yaml#redishighmemoryusage"

      - alert: RedisOutOfConfiguredMaxmemory
        expr: |
          redis_memory_max_bytes > 0
          and
          redis_memory_used_bytes / redis_memory_max_bytes > 0.90
        for: 2m
        labels:
          severity: critical
          priority: P1
          tech_stack: redis
          signal: cause
          category: data
          runbook: runbooks/databases/redis.yaml
        annotations:
          summary: "Redis is close to configured maxmemory"
          description: "Redis memory usage is above 90% of configured maxmemory on {{ $labels.instance }} — Redis may evict hot keys or reject writes depending on maxmemory-policy."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/redis.yaml#redisoutofconfiguredmaxmemory"

      - alert: RedisMemoryFragmentationHigh
        expr: redis_mem_fragmentation_ratio > 1.5
        for: 10m
        labels:
          severity: warning
          priority: P3
          tech_stack: redis
          signal: cause
          category: data
          runbook: runbooks/databases/redis.yaml
        annotations:
          summary: "Redis memory fragmentation is high"
          description: "Redis memory fragmentation ratio is {{ $value }} on {{ $labels.instance }} — RSS much larger than used_memory; node-level memory pressure / OOM risk. Consider MEMORY PURGE or a controlled restart."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/redis.yaml#redismemoryfragmentationhigh"

      - alert: RedisEvictedKeysHigh
        expr: rate(redis_evicted_keys_total[5m]) > 100
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: redis
          signal: cause
          category: data
          runbook: runbooks/databases/redis.yaml
        annotations:
          summary: "Redis is evicting keys at a high rate"
          description: "Redis is evicting more than 100 keys/s on {{ $labels.instance }} — cache entries, sessions, locks, or queue metadata may be removed early. Check memory growth, TTLs, large keys, and maxmemory-policy."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/redis.yaml#redisevictedkeyshigh"

      - alert: RedisKeyspaceHitRatioLow
        expr: |
          (
            rate(redis_keyspace_hits_total[5m])
            /
            (
              rate(redis_keyspace_hits_total[5m])
              +
              rate(redis_keyspace_misses_total[5m])
            )
          ) < 0.80
          and
          (
            rate(redis_keyspace_hits_total[5m])
            +
            rate(redis_keyspace_misses_total[5m])
          ) > 0
        for: 10m
        labels:
          severity: warning
          priority: P2
          tech_stack: redis
          signal: cause
          category: data
          runbook: runbooks/databases/redis.yaml
        annotations:
          summary: "Redis keyspace hit ratio is low"
          description: "Redis keyspace hit ratio is below 80% on {{ $labels.instance }} — applications fall back to backing stores more often, increasing upstream latency/load."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/redis.yaml#rediskeyspacehitratiolow"

      - alert: RedisTooManyConnections
        expr: |
          redis_config_maxclients > 0
          and
          redis_connected_clients / redis_config_maxclients > 0.90
        for: 2m
        labels:
          severity: warning
          priority: P2
          tech_stack: redis
          signal: cause
          category: data
          runbook: runbooks/databases/redis.yaml
        annotations:
          summary: "Redis has too many connections"
          description: "Redis connected clients are above 90% of maxclients on {{ $labels.instance }} — close to refusing new connections. Often a connection leak, missing pooling, or scale-out."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/redis.yaml#redistoomanyconnections"

      - alert: RedisConnectedClientsHigh
        expr: |
          redis_config_maxclients > 0
          and
          redis_connected_clients / redis_config_maxclients > 0.80
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: redis
          signal: cause
          category: data
          runbook: runbooks/databases/redis.yaml
        annotations:
          summary: "Redis connected clients are high"
          description: "Redis connected clients are above 80% of maxclients on {{ $labels.instance }} — early warning for connection leaks or aggressive client pools."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/redis.yaml#redisconnectedclientshigh"

      - alert: RedisNotEnoughConnections
        expr: redis_connected_clients < 5
        for: 5m
        labels:
          severity: warning
          priority: P3
          tech_stack: redis
          signal: symptom
          category: data
          runbook: runbooks/databases/redis.yaml
        annotations:
          summary: "Redis has very few client connections"
          description: "Redis instance {{ $labels.instance }} has fewer than 5 connected clients for 5 minutes. For a normally-busy instance this may indicate client connectivity failures; for idle/standby instances it may be expected and should be filtered."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/redis.yaml#redisnotenoughconnections"

      - alert: RedisRejectedConnections
        expr: increase(redis_rejected_connections_total[1m]) > 5
        for: 1m
        labels:
          severity: warning
          priority: P2
          tech_stack: redis
          signal: symptom
          category: data
          runbook: runbooks/databases/redis.yaml
        annotations:
          summary: "Redis is rejecting connections"
          description: "Redis rejected more than 5 connections in the last minute on {{ $labels.instance }} — new connections may fail. Commonly maxclients exhaustion, connection leaks, or oversized pools."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/redis.yaml#redisrejectedconnections"

      - alert: RedisBlockedClientsHigh
        expr: redis_blocked_clients > 10
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: redis
          signal: symptom
          category: data
          runbook: runbooks/databases/redis.yaml
        annotations:
          summary: "Redis has many blocked clients"
          description: "Redis has more than 10 blocked clients on {{ $labels.instance }} — clients waiting on blocking operations (BLPOP/BRPOP/XREAD). May indicate consumer/downstream slowness."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/redis.yaml#redisblockedclientshigh"

      - alert: RedisSlowLogGrowing
        expr: increase(redis_slowlog_last_id[5m]) > 0
        for: 5m
        labels:
          severity: warning
          priority: P3
          tech_stack: redis
          signal: cause
          category: data
          runbook: runbooks/databases/redis.yaml
        annotations:
          summary: "Redis slowlog is growing"
          description: "New Redis slowlog entries observed on {{ $labels.instance }} — commands exceeding the slowlog threshold may raise latency for all clients (Redis command execution is largely single-threaded)."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/redis.yaml#redisslowloggrowing"

      - alert: RedisRDBSaveError
        expr: redis_rdb_last_bgsave_status == 0
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: redis
          signal: cause
          category: data
          runbook: runbooks/databases/redis.yaml
        annotations:
          summary: "Redis RDB background save failed"
          description: "Redis RDB background save failed on {{ $labels.instance }} — persistence degraded; recovery may use an older snapshot. Check disk space, permissions, fork failures, and memory pressure."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/redis.yaml#redisrdbsaveerror"

      - alert: RedisAOFRewriteRunningLong
        expr: redis_aof_rewrite_in_progress == 1
        for: 10m
        labels:
          severity: warning
          priority: P3
          tech_stack: redis
          signal: cause
          category: data
          runbook: runbooks/databases/redis.yaml
        annotations:
          summary: "Redis AOF rewrite is running for too long"
          description: "Redis AOF rewrite has been running for more than 10 minutes on {{ $labels.instance }} — may indicate slow disk I/O, large AOF, or fork/memory pressure."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/redis.yaml#redisaofrewriterunninglong"

      - alert: RedisCPUSaturation
        expr: rate(redis_cpu_sys_seconds_total[5m]) + rate(redis_cpu_user_seconds_total[5m]) > 0.80
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: redis
          signal: cause
          category: data
          runbook: runbooks/databases/redis.yaml
        annotations:
          summary: "Redis CPU usage is high"
          description: "Redis CPU usage is above 80% on {{ $labels.instance }} — the single-threaded command loop can bottleneck, raising command/replication/application latency. Check hot keys, large payloads, expensive commands, Lua, or sharding."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/redis.yaml#rediscpusaturation"
