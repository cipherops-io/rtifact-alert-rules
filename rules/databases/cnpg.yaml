groups:
  - name: cnpg.rules
    interval: 30s
    rules:
      - alert: CNPGClusterDown
        expr: cnpg_collector_up == 0
        for: 1m
        labels:
          severity: critical
          priority: P1
          tech_stack: cnpg
          signal: symptom
          category: data
          runbook: runbooks/databases/cnpg.md
        annotations:
          summary: "CloudNativePG cluster collector is down"
          description: "CloudNativePG cluster {{ $labels.cnpg_cluster }} collector is down — pod {{ $labels.pod }}."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/cnpg.md#cnpgclusterdown"

      - alert: CNPGClusterDegraded
        expr: cnpg_cluster_ready_instances < cnpg_cluster_instances
        for: 5m
        labels:
          severity: critical
          priority: P1
          tech_stack: cnpg
          signal: symptom
          category: data
          runbook: runbooks/databases/cnpg.md
        annotations:
          summary: "CloudNativePG cluster has fewer ready instances than desired"
          description: "CNPG cluster {{ $labels.cnpg_cluster }} has {{ $value }} ready instances, less than desired."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/cnpg.md#cnpgclusterdegraded"

      - alert: CNPGClusterHAWarning
        expr: cnpg_cluster_instances == 1
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: cnpg
          signal: cause
          category: data
          runbook: runbooks/databases/cnpg.md
        annotations:
          summary: "CloudNativePG cluster is running without high availability"
          description: "CNPG cluster {{ $labels.cnpg_cluster }} is running with a single instance — no high availability."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/cnpg.md#cnpgclusterhawarning"

      - alert: CNPGClusterLongRunningTransactionWarning
        expr: cnpg_backends_max_tx_duration_seconds{state!="idle"} > 300
        for: 1m
        labels:
          severity: warning
          priority: P2
          tech_stack: cnpg
          signal: cause
          category: data
          runbook: runbooks/databases/cnpg.md
        annotations:
          summary: "CloudNativePG cluster has a long-running transaction"
          description: "CNPG cluster {{ $labels.cnpg_cluster }} pod {{ $labels.pod }} has a transaction running for {{ $value | humanizeDuration }}."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/cnpg.md#cnpgclusterlongrunningtransactionwarning"

      - alert: CNPGClusterLongRunningTransactionCritical
        expr: cnpg_backends_max_tx_duration_seconds{state!="idle"} > 1800
        for: 1m
        labels:
          severity: critical
          priority: P1
          tech_stack: cnpg
          signal: cause
          category: data
          runbook: runbooks/databases/cnpg.md
        annotations:
          summary: "CloudNativePG cluster has a critically long-running transaction"
          description: "CNPG cluster {{ $labels.cnpg_cluster }} pod {{ $labels.pod }} has a transaction running for {{ $value | humanizeDuration }} — exceeds 30-minute threshold. Investigate for lock contention or runaway queries."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/cnpg.md#cnpgclusterlongrunningtransactioncritical"

      - alert: CNPGClusterReplicationLagWarning
        expr: cnpg_pg_replication_lag > 30
        for: 2m
        labels:
          severity: warning
          priority: P2
          tech_stack: cnpg
          signal: cause
          category: data
          runbook: runbooks/databases/cnpg.md
        annotations:
          summary: "CloudNativePG replica is lagging behind primary"
          description: "CNPG cluster {{ $labels.cnpg_cluster }} replica is {{ $value | humanizeDuration }} behind primary."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/cnpg.md#cnpgclusterreplicationlagwarning"

      - alert: CNPGClusterReplicationLagCritical
        expr: cnpg_pg_replication_lag > 120
        for: 2m
        labels:
          severity: critical
          priority: P1
          tech_stack: cnpg
          signal: cause
          category: data
          runbook: runbooks/databases/cnpg.md
        annotations:
          summary: "CloudNativePG replica replication lag is critical"
          description: "CNPG cluster {{ $labels.cnpg_cluster }} replica is {{ $value | humanizeDuration }} behind primary — exceeds 2-minute critical threshold. Failover RPO is at risk."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/cnpg.md#cnpgclusterreplicationlagcritical"

      - alert: CNPGClusterBackupOverdue
        expr: time() - cnpg_cluster_last_successful_backup_timestamp > 86400
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: cnpg
          signal: cause
          category: data
          runbook: runbooks/databases/cnpg.md
        annotations:
          summary: "CloudNativePG cluster backup is overdue"
          description: "CNPG cluster {{ $labels.cnpg_cluster }} last successful backup was more than 24 hours ago."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/cnpg.md#cnpgclusterbackupoverdue"

      - alert: CNPGClusterHighWALDiskUsage
        expr: cnpg_cluster_pg_wal_volume_size_bytes / cnpg_cluster_pg_wal_volume_total_size_bytes > 0.80
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: cnpg
          signal: cause
          category: storage
          runbook: runbooks/databases/cnpg.md
        annotations:
          summary: "CloudNativePG WAL volume disk usage is high"
          description: "CNPG cluster {{ $labels.cnpg_cluster }} WAL volume usage is {{ $value | humanizePercentage }} on pod {{ $labels.pod }}. Risk of WAL volume filling up."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/cnpg.md#cnpgclusterhighwaldiskusage"

      - alert: CNPGClusterWALArchiveFailing
        expr: rate(cnpg_pg_stat_archiver_failed_count[5m]) > 0
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: cnpg
          signal: cause
          category: data
          runbook: runbooks/databases/cnpg.md
        annotations:
          summary: "CloudNativePG WAL archiving is failing"
          description: "CNPG cluster {{ $labels.cnpg_cluster }} WAL archiving is failing."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/cnpg.md#cnpgclusterwalarchivefailing"

      - alert: CNPGClusterDeadReplicationSlot
        expr: cnpg_pg_replication_slots_active == 0
        for: 10m
        labels:
          severity: critical
          priority: P1
          tech_stack: cnpg
          signal: cause
          category: data
          runbook: runbooks/databases/cnpg.md
        annotations:
          summary: "CloudNativePG has an inactive replication slot"
          description: "CNPG cluster {{ $labels.cnpg_cluster }} has an inactive replication slot holding WAL — pg_wal will grow unboundedly."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/cnpg.md#cnpgclusterdeadreplicationslot"

      - alert: CNPGClusterHighConnections
        expr: cnpg_backends_total / cnpg_pg_settings_max_connections > 0.80
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: cnpg
          signal: cause
          category: data
          runbook: runbooks/databases/cnpg.md
        annotations:
          summary: "CloudNativePG connection count is approaching the limit"
          description: "CNPG cluster {{ $labels.cnpg_cluster }} connection utilization is {{ $value | humanizePercentage }} of max_connections on pod {{ $labels.pod }}."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/cnpg.md#cnpgclusterhighconnections"

      - alert: CNPGClusterPrimaryNotReady
        expr: cnpg_cluster_primary_uptime_seconds == 0
        for: 2m
        labels:
          severity: critical
          priority: P0
          tech_stack: cnpg
          signal: symptom
          category: data
          runbook: runbooks/databases/cnpg.md
        annotations:
          summary: "CloudNativePG primary pod is not ready"
          description: "CNPG cluster {{ $labels.cnpg_cluster }} primary pod is not ready — writes are failing."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/cnpg.md#cnpgclusterprimarynotready"

      - alert: CNPGClusterFailoverOccurred
        expr: increase(cnpg_cluster_switchover_count[10m]) > 0
        for: 0m
        labels:
          severity: info
          priority: P3
          tech_stack: cnpg
          signal: cause
          category: data
          runbook: runbooks/databases/cnpg.md
        annotations:
          summary: "CloudNativePG cluster switchover or failover occurred"
          description: "CNPG cluster {{ $labels.cnpg_cluster }} has undergone a switchover/failover event."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/cnpg.md#cnpgclusterfailoveroccurred"

      - alert: CNPGClusterDataVolumeNearFull
        expr: cnpg_cluster_pg_data_volume_used_bytes / cnpg_cluster_pg_data_volume_total_size_bytes > 0.85
        for: 10m
        labels:
          severity: warning
          priority: P2
          tech_stack: cnpg
          signal: cause
          category: storage
          runbook: runbooks/databases/cnpg.md
        annotations:
          summary: "CloudNativePG data volume is nearly full"
          description: "CNPG cluster {{ $labels.cnpg_cluster }} data volume usage is {{ $value | humanizePercentage }} on pod {{ $labels.pod }}. Expand volume before writes are rejected."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/cnpg.md#cnpgclusterdatavolumenearfull"
