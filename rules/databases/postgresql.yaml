groups:
  - name: postgresql.rules
    interval: 30s
    rules:
      - alert: PostgreSQLDown
        expr: up{job=~"postgres.*"} == 0
        for: 1m
        labels:
          severity: critical
          priority: P1
          tech_stack: postgresql
          signal: symptom
          category: data
          runbook: runbooks/databases/postgresql.md
        annotations:
          summary: "PostgreSQL instance is down"
          description: "PostgreSQL instance {{ $labels.instance }} has been unreachable for more than 1 minute."
          runbook_url: "https://github.com/rtifact/rtifact-alert-rules/blob/main/runbooks/databases/postgresql.md#postgresqldown"

      - alert: PostgreSQLTooManyConnections
        expr: pg_stat_activity_count / pg_settings_max_connections > 0.80
        for: 2m
        labels:
          severity: warning
          priority: P2
          tech_stack: postgresql
          signal: cause
          category: data
          runbook: runbooks/databases/postgresql.md
        annotations:
          summary: "PostgreSQL connection count is approaching the limit"
          description: "PostgreSQL connections at {{ $value | humanizePercentage }} of max_connections on {{ $labels.instance }}."
          runbook_url: "https://github.com/rtifact/rtifact-alert-rules/blob/main/runbooks/databases/postgresql.md#postgresqltoomanyconnections"

      - alert: PostgreSQLDeadlockDetected
        expr: rate(pg_stat_database_deadlocks[5m]) > 0
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: postgresql
          signal: symptom
          category: data
          runbook: runbooks/databases/postgresql.md
        annotations:
          summary: "PostgreSQL deadlocks are being detected"
          description: "PostgreSQL is experiencing deadlocks on {{ $labels.instance }} at {{ $value | humanize }} deadlocks/s. Review transaction ordering in the application."
          runbook_url: "https://github.com/rtifact/rtifact-alert-rules/blob/main/runbooks/databases/postgresql.md#postgresqldeadlockdetected"

      - alert: PostgreSQLLongRunningTransaction
        expr: pg_stat_activity_max_tx_duration{state!="idle"} > 300
        for: 1m
        labels:
          severity: warning
          priority: P2
          tech_stack: postgresql
          signal: cause
          category: data
          runbook: runbooks/databases/postgresql.md
        annotations:
          summary: "PostgreSQL long-running transaction detected"
          description: "PostgreSQL transaction running for {{ $value | humanizeDuration }} on {{ $labels.instance }}."
          runbook_url: "https://github.com/rtifact/rtifact-alert-rules/blob/main/runbooks/databases/postgresql.md#postgresqllongrunningtransaction"

      - alert: PostgreSQLIdleInTransaction
        expr: count(pg_stat_activity_count{state="idle in transaction"}) > 5
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: postgresql
          signal: cause
          category: data
          runbook: runbooks/databases/postgresql.md
        annotations:
          summary: "PostgreSQL has many sessions idle in transaction"
          description: "PostgreSQL has {{ $value }} sessions in 'idle in transaction' state on {{ $labels.instance }}. These hold locks and prevent autovacuum."
          runbook_url: "https://github.com/rtifact/rtifact-alert-rules/blob/main/runbooks/databases/postgresql.md#postgresqlidleintransaction"

      - alert: PostgreSQLReplicationLag
        expr: pg_replication_lag > 30
        for: 2m
        labels:
          severity: warning
          priority: P2
          tech_stack: postgresql
          signal: cause
          category: data
          runbook: runbooks/databases/postgresql.md
        annotations:
          summary: "PostgreSQL replica is lagging behind primary"
          description: "PostgreSQL replica is {{ $value | humanizeDuration }} behind primary."
          runbook_url: "https://github.com/rtifact/rtifact-alert-rules/blob/main/runbooks/databases/postgresql.md#postgresqlreplicationlag"

      - alert: PostgreSQLReplicationSlotLag
        expr: pg_replication_slots_pg_wal_lsn_diff > 1073741824
        for: 5m
        labels:
          severity: critical
          priority: P1
          tech_stack: postgresql
          signal: cause
          category: data
          runbook: runbooks/databases/postgresql.md
        annotations:
          summary: "PostgreSQL replication slot lag exceeds 1GB"
          description: "PostgreSQL replication slot lag exceeds 1GB — pg_wal will grow unboundedly on {{ $labels.instance }}."
          runbook_url: "https://github.com/rtifact/rtifact-alert-rules/blob/main/runbooks/databases/postgresql.md#postgresqlreplicationslotlag"

      - alert: PostgreSQLHighDiskUsage
        expr: |
          (node_filesystem_size_bytes{mountpoint="/var/lib/postgresql"}
            - node_filesystem_free_bytes{mountpoint="/var/lib/postgresql"})
          / node_filesystem_size_bytes{mountpoint="/var/lib/postgresql"} > 0.80
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: postgresql
          signal: cause
          category: storage
          runbook: runbooks/databases/postgresql.md
        annotations:
          summary: "PostgreSQL data directory disk usage is high"
          description: "Disk usage for PostgreSQL data directory (/var/lib/postgresql) on {{ $labels.instance }} is {{ $value | humanizePercentage }}. Plan capacity expansion."
          runbook_url: "https://github.com/rtifact/rtifact-alert-rules/blob/main/runbooks/databases/postgresql.md#postgresqlhighdiskusage"

      - alert: PostgreSQLAutovacuumOverdue
        expr: time() - pg_stat_user_tables_last_autovacuum > 43200
        for: 1h
        labels:
          severity: warning
          priority: P3
          tech_stack: postgresql
          signal: cause
          category: data
          runbook: runbooks/databases/postgresql.md
        annotations:
          summary: "PostgreSQL table has not been autovacuumed recently"
          description: "Table {{ $labels.relname }} has not been autovacuumed in more than 12 hours."
          runbook_url: "https://github.com/rtifact/rtifact-alert-rules/blob/main/runbooks/databases/postgresql.md#postgresqlautovacuumoverdue"

      - alert: PostgreSQLHighCheckpointWriteRatio
        expr: pg_stat_bgwriter_checkpoint_write_time / pg_stat_bgwriter_checkpoints_timed > 0.9
        for: 10m
        labels:
          severity: warning
          priority: P2
          tech_stack: postgresql
          signal: cause
          category: data
          runbook: runbooks/databases/postgresql.md
        annotations:
          summary: "PostgreSQL checkpoint write time ratio is high"
          description: "PostgreSQL checkpoint write time ratio is {{ $value | humanizePercentage }} on {{ $labels.instance }}. Consider tuning checkpoint_completion_target or increasing shared_buffers."
          runbook_url: "https://github.com/rtifact/rtifact-alert-rules/blob/main/runbooks/databases/postgresql.md#postgresqlhighcheckpointwriteratio"

      - alert: PostgreSQLHighWALSize
        expr: pg_wal_size_bytes > 5368709120
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: postgresql
          signal: cause
          category: storage
          runbook: runbooks/databases/postgresql.md
        annotations:
          summary: "PostgreSQL WAL directory size is high"
          description: "PostgreSQL WAL size is {{ $value | humanize1024 }}B — check for inactive replication slots."
          runbook_url: "https://github.com/rtifact/rtifact-alert-rules/blob/main/runbooks/databases/postgresql.md#postgresqlhighwalsize"

      - alert: PostgreSQLCommitRatioLow
        expr: |
          rate(pg_stat_database_xact_commit[5m])
          / (rate(pg_stat_database_xact_commit[5m])
            + rate(pg_stat_database_xact_rollback[5m])) < 0.95
        for: 10m
        labels:
          severity: warning
          priority: P3
          tech_stack: postgresql
          signal: symptom
          category: data
          runbook: runbooks/databases/postgresql.md
        annotations:
          summary: "PostgreSQL transaction commit ratio is low"
          description: "PostgreSQL commit ratio is {{ $value | humanizePercentage }} on {{ $labels.instance }}. High rollback rate may indicate application errors or deadlocks."
          runbook_url: "https://github.com/rtifact/rtifact-alert-rules/blob/main/runbooks/databases/postgresql.md#postgresqlcommitratiolow"

      - alert: PgBouncerHighWaitingClients
        expr: pgbouncer_pools_cl_waiting > 10
        for: 2m
        labels:
          severity: warning
          priority: P2
          tech_stack: postgresql
          signal: symptom
          category: data
          runbook: runbooks/databases/postgresql.md
        annotations:
          summary: "PgBouncer has many clients waiting for connections"
          description: "PgBouncer has {{ $value }} clients waiting for a connection on {{ $labels.instance }}."
          runbook_url: "https://github.com/rtifact/rtifact-alert-rules/blob/main/runbooks/databases/postgresql.md#pgbouncerhighwaitingclients"
