groups:
  - name: mysql.rules
    interval: 30s
    rules:
      - alert: MySQLDown
        expr: up{job=~"mysql.*"} == 0
        for: 1m
        labels:
          severity: critical
          priority: P1
          tech_stack: mysql
          signal: symptom
          category: data
          runbook: runbooks/databases/mysql.md
        annotations:
          summary: "MySQL instance is down"
          description: "MySQL instance {{ $labels.instance }} has been unreachable for more than 1 minute."
          runbook_url: "https://github.com/rtifact/rtifact-alert-rules/blob/main/runbooks/databases/mysql.md#mysqldown"

      - alert: MySQLTooManyConnections
        expr: mysql_global_status_threads_connected / mysql_global_variables_max_connections > 0.80
        for: 2m
        labels:
          severity: warning
          priority: P2
          tech_stack: mysql
          signal: cause
          category: data
          runbook: runbooks/databases/mysql.md
        annotations:
          summary: "MySQL connection count is approaching the limit"
          description: "MySQL connections at {{ $value | humanizePercentage }} of max_connections on {{ $labels.instance }}."
          runbook_url: "https://github.com/rtifact/rtifact-alert-rules/blob/main/runbooks/databases/mysql.md#mysqltoomanyconnections"

      - alert: MySQLHighThreadsRunning
        expr: mysql_global_status_threads_running > 60
        for: 2m
        labels:
          severity: warning
          priority: P2
          tech_stack: mysql
          signal: cause
          category: data
          runbook: runbooks/databases/mysql.md
        annotations:
          summary: "MySQL has a high number of threads running"
          description: "MySQL has {{ $value }} threads running on {{ $labels.instance }}, which may indicate query contention or an overloaded instance."
          runbook_url: "https://github.com/rtifact/rtifact-alert-rules/blob/main/runbooks/databases/mysql.md#mysqlhighthreadsrunning"

      - alert: MySQLSlowQueries
        expr: rate(mysql_global_status_slow_queries[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: mysql
          signal: symptom
          category: data
          runbook: runbooks/databases/mysql.md
        annotations:
          summary: "MySQL slow query rate is elevated"
          description: "MySQL slow query rate is {{ $value | humanize }} queries/s on {{ $labels.instance }}. Review and optimize slow queries."
          runbook_url: "https://github.com/rtifact/rtifact-alert-rules/blob/main/runbooks/databases/mysql.md#mysqlslowqueries"

      - alert: MySQLReplicationLag
        expr: mysql_slave_status_seconds_behind_master > 30
        for: 2m
        labels:
          severity: warning
          priority: P2
          tech_stack: mysql
          signal: cause
          category: data
          runbook: runbooks/databases/mysql.md
        annotations:
          summary: "MySQL replica is lagging behind master"
          description: "MySQL replica is {{ $value }}s behind master on {{ $labels.instance }}."
          runbook_url: "https://github.com/rtifact/rtifact-alert-rules/blob/main/runbooks/databases/mysql.md#mysqlreplicationlag"

      - alert: MySQLReplicationNotRunning
        expr: mysql_slave_status_slave_sql_running == 0 or mysql_slave_status_slave_io_running == 0
        for: 1m
        labels:
          severity: critical
          priority: P1
          tech_stack: mysql
          signal: symptom
          category: data
          runbook: runbooks/databases/mysql.md
        annotations:
          summary: "MySQL replication is not running"
          description: "MySQL replication SQL or IO thread is stopped on {{ $labels.instance }}. Data divergence may occur."
          runbook_url: "https://github.com/rtifact/rtifact-alert-rules/blob/main/runbooks/databases/mysql.md#mysqlreplicationnotrunning"

      - alert: MySQLInnoDBLogWaits
        expr: rate(mysql_global_status_innodb_log_waits[5m]) > 10
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: mysql
          signal: cause
          category: data
          runbook: runbooks/databases/mysql.md
        annotations:
          summary: "MySQL InnoDB log waits are elevated"
          description: "MySQL InnoDB log wait rate is {{ $value | humanize }} waits/s on {{ $labels.instance }}. Consider increasing innodb_log_buffer_size."
          runbook_url: "https://github.com/rtifact/rtifact-alert-rules/blob/main/runbooks/databases/mysql.md#mysqlinnodblogwaits"

      - alert: MySQLHighDiskUsage
        expr: |
          (node_filesystem_size_bytes{mountpoint="/var/lib/mysql"}
            - node_filesystem_free_bytes{mountpoint="/var/lib/mysql"})
          / node_filesystem_size_bytes{mountpoint="/var/lib/mysql"} > 0.80
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: mysql
          signal: cause
          category: storage
          runbook: runbooks/databases/mysql.md
        annotations:
          summary: "MySQL data directory disk usage is high"
          description: "Disk usage for MySQL data directory (/var/lib/mysql) on {{ $labels.instance }} is {{ $value | humanizePercentage }} — plan capacity expansion."
          runbook_url: "https://github.com/rtifact/rtifact-alert-rules/blob/main/runbooks/databases/mysql.md#mysqlhighdiskusage"

      - alert: MySQLBufferPoolHighUsage
        expr: mysql_global_status_innodb_buffer_pool_bytes_data / mysql_global_variables_innodb_buffer_pool_size > 0.90
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: mysql
          signal: cause
          category: data
          runbook: runbooks/databases/mysql.md
        annotations:
          summary: "MySQL InnoDB buffer pool is nearly full"
          description: "MySQL InnoDB buffer pool utilization is {{ $value | humanizePercentage }} on {{ $labels.instance }}. Read performance may degrade."
          runbook_url: "https://github.com/rtifact/rtifact-alert-rules/blob/main/runbooks/databases/mysql.md#mysqlbufferpoolhighusage"

      - alert: MySQLDeadlocks
        expr: rate(mysql_global_status_innodb_deadlocks[5m]) > 0
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: mysql
          signal: symptom
          category: data
          runbook: runbooks/databases/mysql.md
        annotations:
          summary: "MySQL InnoDB deadlocks detected"
          description: "MySQL is experiencing InnoDB deadlocks on {{ $labels.instance }} at {{ $value | humanize }} deadlocks/s. Review application transaction ordering."
          runbook_url: "https://github.com/rtifact/rtifact-alert-rules/blob/main/runbooks/databases/mysql.md#mysqldeadlocks"

      - alert: MySQLTableLockWaits
        expr: rate(mysql_global_status_table_locks_waited[5m]) > 100
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: mysql
          signal: cause
          category: data
          runbook: runbooks/databases/mysql.md
        annotations:
          summary: "MySQL table lock wait rate is high"
          description: "MySQL table lock wait rate is {{ $value | humanize }} waits/s on {{ $labels.instance }}. Review long-running queries and locking patterns."
          runbook_url: "https://github.com/rtifact/rtifact-alert-rules/blob/main/runbooks/databases/mysql.md#mysqltablelockwaits"

      - alert: MySQLAbortedConnections
        expr: rate(mysql_global_status_aborted_connects[5m]) > 5
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: mysql
          signal: cause
          category: data
          runbook: runbooks/databases/mysql.md
        annotations:
          summary: "MySQL aborted connection rate is elevated"
          description: "MySQL aborted connection rate is {{ $value | humanize }} connections/s on {{ $labels.instance }}. Check authentication failures and network issues."
          runbook_url: "https://github.com/rtifact/rtifact-alert-rules/blob/main/runbooks/databases/mysql.md#mysqlabortedconnections"

      - alert: MySQLLongRunningTransaction
        expr: mysql_info_schema_innodb_trx_wait_time_seconds > 300
        for: 1m
        labels:
          severity: warning
          priority: P2
          tech_stack: mysql
          signal: cause
          category: data
          runbook: runbooks/databases/mysql.md
        annotations:
          summary: "MySQL long-running transaction detected"
          description: "MySQL has a transaction running for more than 5 minutes on {{ $labels.instance }}."
          runbook_url: "https://github.com/rtifact/rtifact-alert-rules/blob/main/runbooks/databases/mysql.md#mysqllongrunningtransaction"
