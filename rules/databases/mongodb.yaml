groups:
  - name: mongodb.rules
    interval: 30s
    rules:
      - alert: MongoDBDown
        expr: up{job=~"mongodb.*"} == 0
        for: 1m
        labels:
          severity: critical
          priority: P1
          tech_stack: mongodb
          signal: symptom
          category: data
          runbook: runbooks/databases/mongodb.md
          query: up{job=~"mongodb.*"} == 0
        annotations:
          summary: "MongoDB instance is down"
          description: "MongoDB instance {{ $labels.instance }} has been unreachable for more than 1 minute."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/mongodb.md#mongodbdown"

      - alert: MongoDBReplicationMemberUnhealthy
        expr: mongodb_rs_members_health == 0
        for: 1m
        labels:
          severity: critical
          priority: P1
          tech_stack: mongodb
          signal: symptom
          category: data
          runbook: runbooks/databases/mongodb.md
          query: mongodb_rs_members_health == 0
        annotations:
          summary: "MongoDB replica set member is unhealthy"
          description: "MongoDB replica set member {{ $labels.name }} is unhealthy (state: {{ $labels.state }})."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/mongodb.md#mongodbreplicationmemberunhealthy"

      - alert: MongoDBConnectionsHigh
        expr: mongodb_connections{state="current"} / mongodb_connections{state="available"} > 0.80
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: mongodb
          signal: cause
          category: data
          runbook: runbooks/databases/mongodb.md
          query: mongodb_connections{state="current"} / mongodb_connections{state="available"} > 0.80
        annotations:
          summary: "MongoDB connection usage is high"
          description: "MongoDB connection usage is {{ $value | humanizePercentage }} of available connections on {{ $labels.instance
            }}."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/mongodb.md#mongodbconnectionshigh"

      - alert: MongoDBCursorsTimedOut
        expr: rate(mongodb_metrics_cursor_timed_out_total[5m]) > 5
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: mongodb
          signal: symptom
          category: data
          runbook: runbooks/databases/mongodb.md
          query: rate(mongodb_metrics_cursor_timed_out_total[5m]) > 5
        annotations:
          summary: "MongoDB cursors are timing out at a high rate"
          description: "MongoDB cursor timeout rate is {{ $value | humanize }}/s on {{ $labels.instance }}. Check for slow
            queries holding open cursors."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/mongodb.md#mongodbcursorstimedout"

      - alert: MongoDBHighDiskUsage
        expr: |
          (node_filesystem_size_bytes{mountpoint="/data/db"}
            - node_filesystem_free_bytes{mountpoint="/data/db"})
          / node_filesystem_size_bytes{mountpoint="/data/db"} > 0.80
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: mongodb
          signal: cause
          category: storage
          runbook: runbooks/databases/mongodb.md
          query: |
            (node_filesystem_size_bytes{mountpoint="/data/db"}
              - node_filesystem_free_bytes{mountpoint="/data/db"})
            / node_filesystem_size_bytes{mountpoint="/data/db"} > 0.80
        annotations:
          summary: "MongoDB data directory disk usage is high"
          description: "Disk usage for MongoDB data directory (/data/db) on {{ $labels.instance }} is {{ $value | humanizePercentage
            }}. Plan capacity expansion."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/mongodb.md#mongodbhighdiskusage"

      - alert: MongoDBOplogWindowLow
        expr: mongodb_mongod_replset_oplog_tail_timestamp - mongodb_mongod_replset_oplog_head_timestamp < 28800
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: mongodb
          signal: cause
          category: data
          runbook: runbooks/databases/mongodb.md
          query: mongodb_mongod_replset_oplog_tail_timestamp - mongodb_mongod_replset_oplog_head_timestamp < 28800
        annotations:
          summary: "MongoDB oplog window is dangerously short"
          description: "MongoDB oplog window is {{ $value | humanizeDuration }} — less than 8 hours. Replica resync window
            is dangerously short."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/mongodb.md#mongodboplogwindowlow"

      - alert: MongoDBLockRatioHigh
        expr: mongodb_mongod_global_lock_ratio > 0.50
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: mongodb
          signal: cause
          category: data
          runbook: runbooks/databases/mongodb.md
          query: mongodb_mongod_global_lock_ratio > 0.50
        annotations:
          summary: "MongoDB global lock ratio is high"
          description: "MongoDB global lock ratio is {{ $value | humanizePercentage }} on {{ $labels.instance }}. High lock
            contention indicates concurrent write pressure."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/mongodb.md#mongodblockratiohigh"

      - alert: MongoDBFlushAverageMsHigh
        expr: mongodb_mongod_background_flushing_average_ms > 100
        for: 10m
        labels:
          severity: warning
          priority: P3
          tech_stack: mongodb
          signal: cause
          category: data
          runbook: runbooks/databases/mongodb.md
          query: mongodb_mongod_background_flushing_average_ms > 100
        annotations:
          summary: "MongoDB background flush average duration is high"
          description: "MongoDB background flush average is {{ $value | humanize }}ms on {{ $labels.instance }}. Slow disk
            I/O may be impacting write performance."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/mongodb.md#mongodbflushaveragemshigh"

      - alert: MongoDBWiredTigerCacheEvictions
        expr: rate(mongodb_mongod_wiredtiger_cache_evicted_total[5m]) > 100
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: mongodb
          signal: cause
          category: data
          runbook: runbooks/databases/mongodb.md
          query: rate(mongodb_mongod_wiredtiger_cache_evicted_total[5m]) > 100
        annotations:
          summary: "MongoDB WiredTiger cache eviction rate is high"
          description: "MongoDB WiredTiger cache eviction rate is high — working set may not fit in cache."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/mongodb.md#mongodbwiredtigercacheevictions"
