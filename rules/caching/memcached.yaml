groups:
  - name: memcached.rules
    interval: 30s
    rules:
      - alert: MemcachedDown
        expr: up{job=~"memcached.*"} == 0
        for: 1m
        labels:
          severity: critical
          priority: P1
          tech_stack: memcached
          signal: symptom
          category: caching
          runbook: runbooks/caching/memcached.md
        annotations:
          summary: "Memcached instance is down"
          description: "Memcached instance {{ $labels.instance }} has been unreachable for more than 1 minute."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/caching/memcached.md#memcacheddown"

      - alert: MemcachedHighMemoryUsage
        expr: memcached_current_bytes / memcached_limit_bytes > 0.90
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: memcached
          signal: cause
          category: caching
          runbook: runbooks/caching/memcached.md
        annotations:
          summary: "Memcached memory usage is near the limit"
          description: "Memcached memory usage is {{ $value | humanizePercentage }} of limit on {{ $labels.instance }}."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/caching/memcached.md#memcachedhighmemoryusage"

      - alert: MemcachedHighEvictionRate
        expr: rate(memcached_items_evicted_total[5m]) > 100
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: memcached
          signal: cause
          category: caching
          runbook: runbooks/caching/memcached.md
        annotations:
          summary: "Memcached is evicting items at a high rate"
          description: "Memcached is evicting {{ $value | humanize }} items/s — memory limit is too low for the working set."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/caching/memcached.md#memcachedhighevictionrate"

      - alert: MemcachedLowHitRatio
        expr: |
          rate(memcached_commands_total{command="get",status="hit"}[5m])
          / rate(memcached_commands_total{command="get"}[5m]) < 0.70
        for: 10m
        labels:
          severity: warning
          priority: P2
          tech_stack: memcached
          signal: cause
          category: caching
          runbook: runbooks/caching/memcached.md
        annotations:
          summary: "Memcached cache hit ratio is low"
          description: "Memcached hit ratio is {{ $value | humanizePercentage }} — cache is not effective."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/caching/memcached.md#memcachedlowhitratio"

      - alert: MemcachedConnectionsHigh
        expr: memcached_current_connections / memcached_max_connections > 0.80
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: memcached
          signal: cause
          category: caching
          runbook: runbooks/caching/memcached.md
        annotations:
          summary: "Memcached connection usage is high"
          description: "Memcached connection usage is {{ $value | humanizePercentage }} of max_connections on {{ $labels.instance }}. Risk of connection refusal."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/caching/memcached.md#memcachedconnectionshigh"

      - alert: MemcachedCPUSaturation
        expr: rate(memcached_process_cpu_seconds_total[5m]) > 0.80
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: memcached
          signal: cause
          category: caching
          runbook: runbooks/caching/memcached.md
        annotations:
          summary: "Memcached CPU usage is high"
          description: "Memcached CPU utilization is {{ $value | humanizePercentage }} on {{ $labels.instance }}. Consider scaling horizontally or increasing thread count."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/caching/memcached.md#memcachedcpusaturation"

      - alert: MemcachedHighItemExpiry
        expr: rate(memcached_items_expired_unfetched_total[5m]) > 500
        for: 5m
        labels:
          severity: warning
          priority: P3
          tech_stack: memcached
          signal: cause
          category: caching
          runbook: runbooks/caching/memcached.md
        annotations:
          summary: "Memcached items are expiring before being fetched at a high rate"
          description: "Memcached has {{ $value | humanize }} items/s expiring before being fetched — TTLs may be too short."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/caching/memcached.md#memcachedhighitemexpiry"

      - alert: MemcachedSetFailureHigh
        expr: |
          rate(memcached_commands_total{command="set",status="miss"}[5m])
          / rate(memcached_commands_total{command="set"}[5m]) > 0.01
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: memcached
          signal: symptom
          category: caching
          runbook: runbooks/caching/memcached.md
        annotations:
          summary: "Memcached set command failure rate is elevated"
          description: "Memcached set failure rate is {{ $value | humanizePercentage }} on {{ $labels.instance }}. Items may be too large or memory is exhausted."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/caching/memcached.md#memcachedsetfailurehigh"

      - alert: MemcachedRejectedConnections
        expr: rate(memcached_connections_listener_disabled_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: memcached
          signal: symptom
          category: caching
          runbook: runbooks/caching/memcached.md
        annotations:
          summary: "Memcached is rejecting incoming connections"
          description: "Memcached is rejecting connections (listen_disabled_num increasing) on {{ $labels.instance }}."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/caching/memcached.md#memcachedrejectedconnections"

      - alert: MemcachedRestartDetected
        expr: memcached_uptime_seconds < 60
        for: 0m
        labels:
          severity: warning
          priority: P2
          tech_stack: memcached
          signal: cause
          category: caching
          runbook: runbooks/caching/memcached.md
        annotations:
          summary: "Memcached has recently restarted"
          description: "Memcached on {{ $labels.instance }} has restarted (uptime < 60s) — all cached data lost."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/caching/memcached.md#memcachedrestartdetected"
