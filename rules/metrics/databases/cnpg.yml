groups:
  - name: cnpg.rules
    interval: 30s
    rules:
      - alert: CNPGClusterDown
        expr: cnpg_collector_up == 0
        for: 1m
        labels:
          severity: critical
          priority: P1
          tech_stack: cnpg
          signal: symptom
          category: data
          runbook: runbooks/databases/cnpg.yaml
          query: cnpg_collector_up == 0
        annotations:
          summary: "CloudNativePG cluster collector is down"
          description: "CloudNativePG cluster {{ $labels.cnpg_cluster }} collector is down — pod {{ $labels.pod }}."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/cnpg.yaml#cnpgclusterdown"

