#          runbook: runbooks/databases/cnpg.yaml
#          query: cnpg_cluster_pg_wal_volume_size_bytes / cnpg_cluster_pg_wal_volume_total_size_bytes > 0.80
#        annotations:
#          summary: "CloudNativePG WAL volume disk usage is high"
#          description: "CNPG cluster {{ $labels.cnpg_cluster }} WAL volume usage is {{ $value | humanizePercentage }} on pod
#            {{ $labels.pod }}. Risk of WAL volume filling up."
#          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/cnpg.yaml#cnpgclusterhighwaldiskusage"

      - alert: CNPGClusterWALArchiveFailing
        expr: rate(cnpg_pg_stat_archiver_failed_count[5m]) > 0
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: cnpg
          signal: cause
          category: data
          runbook: runbooks/databases/cnpg.yaml
          query: rate(cnpg_pg_stat_archiver_failed_count[5m]) > 0
        annotations:
          summary: "CloudNativePG WAL archiving is failing"
          description: "CNPG cluster {{ $labels.cnpg_cluster }} WAL archiving is failing."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/cnpg.yaml#cnpgclusterwalarchivefailing"

      - alert: CNPGClusterDeadReplicationSlot
        expr: |
          cnpg_pg_replication_slots_active == 0
          and cnpg_pg_replication_slots_pg_wal_lsn_diff > 0
        for: 10m
        labels:
          severity: critical
          priority: P1
          tech_stack: cnpg
          signal: cause
          category: data
          runbook: runbooks/databases/cnpg.yaml
          query: |
            cnpg_pg_replication_slots_active == 0
            and cnpg_pg_replication_slots_pg_wal_lsn_diff > 0
        annotations:
          summary: "CloudNativePG has an inactive replication slot"
          description: "CNPG cluster {{ $labels.cnpg_cluster }} has an inactive replication slot holding WAL — pg_wal will
            grow unboundedly."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/cnpg.yaml#cnpgclusterdeadreplicationslot"

      - alert: CNPGClusterHighConnections
        expr: |
          sum by (cnpg_cluster, namespace, pod) (cnpg_backends_total)
          / on (cnpg_cluster, namespace, pod)
          max by (cnpg_cluster, namespace, pod) (cnpg_pg_settings_setting{name="max_connections"})
          > 0.80
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: cnpg
          signal: cause
          category: data
          runbook: runbooks/databases/cnpg.yaml
          query: |
            sum by (cnpg_cluster, namespace, pod) (cnpg_backends_total)
            / on (cnpg_cluster, namespace, pod)
            max by (cnpg_cluster, namespace, pod) (cnpg_pg_settings_setting{name="max_connections"})
            > 0.80
        annotations:
          summary: "CloudNativePG connection count is approaching the limit"
          description: "CNPG cluster {{ $labels.cnpg_cluster }} connection utilization is {{ $value | humanizePercentage }}
            of max_connections on pod {{ $labels.pod }}."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/cnpg.yaml#cnpgclusterhighconnections"

#      - alert: CNPGClusterPrimaryNotReady
#        expr: cnpg_cluster_primary_uptime_seconds == 0
#        for: 2m
