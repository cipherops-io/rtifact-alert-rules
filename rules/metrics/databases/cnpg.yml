#      - alert: CNPGClusterDataVolumeNearFull
#        expr: cnpg_cluster_pg_data_volume_used_bytes / cnpg_cluster_pg_data_volume_total_size_bytes > 0.85
#        for: 10m
#        labels:
#          severity: warning
