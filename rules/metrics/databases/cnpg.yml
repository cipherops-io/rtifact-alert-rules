#          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/cnpg.yaml#cnpgclusterhawarning"

      - alert: CNPGClusterLongRunningTransactionWarning
        expr: cnpg_backends_max_tx_duration_seconds{state!="idle"} > 300
        for: 1m
        labels:
          severity: warning
          priority: P2
          tech_stack: cnpg
          signal: cause
          category: data
          runbook: runbooks/databases/cnpg.yaml
          query: cnpg_backends_max_tx_duration_seconds{state!="idle"} > 300
        annotations:
          summary: "CloudNativePG cluster has a long-running transaction"
          description: "CNPG cluster {{ $labels.cnpg_cluster }} pod {{ $labels.pod }} has a transaction running for {{ $value
            | humanizeDuration }}."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/cnpg.yaml#cnpgclusterlongrunningtransactionwarning"

      - alert: CNPGClusterLongRunningTransactionCritical
        expr: cnpg_backends_max_tx_duration_seconds{state!="idle"} > 1800
        for: 1m
        labels:
          severity: critical
          priority: P1
          tech_stack: cnpg
          signal: cause
          category: data
          runbook: runbooks/databases/cnpg.yaml
          query: cnpg_backends_max_tx_duration_seconds{state!="idle"} > 1800
        annotations:
          summary: "CloudNativePG cluster has a critically long-running transaction"
          description: "CNPG cluster {{ $labels.cnpg_cluster }} pod {{ $labels.pod }} has a transaction running for {{ $value
            | humanizeDuration }} — exceeds 30-minute threshold. Investigate for lock contention or runaway queries."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/cnpg.yaml#cnpgclusterlongrunningtransactioncritical"

      - alert: CNPGClusterReplicationLagWarning
        expr: cnpg_pg_replication_lag > 30
        for: 2m
        labels:
          severity: warning
          priority: P2
          tech_stack: cnpg
          signal: cause
          category: data
          runbook: runbooks/databases/cnpg.yaml
          query: cnpg_pg_replication_lag > 30
        annotations:
          summary: "CloudNativePG replica is lagging behind primary"
          description: "CNPG cluster {{ $labels.cnpg_cluster }} replica is {{ $value | humanizeDuration }} behind primary."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/cnpg.yaml#cnpgclusterreplicationlagwarning"

      - alert: CNPGClusterReplicationLagCritical
        expr: cnpg_pg_replication_lag > 120
        for: 2m
        labels:
          severity: critical
          priority: P1
          tech_stack: cnpg
          signal: cause
          category: data
          runbook: runbooks/databases/cnpg.yaml
          query: cnpg_pg_replication_lag > 120
        annotations:
          summary: "CloudNativePG replica replication lag is critical"
          description: "CNPG cluster {{ $labels.cnpg_cluster }} replica is {{ $value | humanizeDuration }} behind primary
            — exceeds 2-minute critical threshold. Failover RPO is at risk."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/cnpg.yaml#cnpgclusterreplicationlagcritical"

#      - alert: CNPGClusterBackupOverdue
#        expr: time() - cnpg_cluster_last_successful_backup_timestamp > 86400
