#          description: "CNPG cluster {{ $labels.cnpg_cluster }} last successful backup was more than 24 hours ago."
#          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/cnpg.yaml#cnpgclusterbackupoverdue"

#      - alert: CNPGClusterHighWALDiskUsage
#        expr: cnpg_cluster_pg_wal_volume_size_bytes / cnpg_cluster_pg_wal_volume_total_size_bytes > 0.80
#        for: 5m
