      #       views behind those Kafka tables stop ingesting, so the destination tables fall behind the topic and consumer
      #       lag grows until the broker's retention drops messages that were never read."
      #     runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/clickhouse.yaml#clickhousekafkaconsumererrors"

      # DISABLED: chi_clickhouse_event_KafkaCommitFailures is not exported in either
      # environment (see the note at the top of this group).
      # - alert: ClickHouseKafkaCommitFailures
      #   expr: |
      #     increase(chi_clickhouse_event_KafkaCommitFailures[30m]) > 0
      #     or
      #     (chi_clickhouse_event_KafkaCommitFailures > 0 unless chi_clickhouse_event_KafkaCommitFailures offset 30m)
      #   for: 10m
      #   labels:
      #     sourceType: metric
      #     severity: warning
      #     priority: P2
      #     tech_stack: clickhouse
      #     signal: symptom
      #     category: data
