      #       or (chi_clickhouse_event_DistributedConnectionFailAtAll > 0 unless chi_clickhouse_event_DistributedConnectionFailAtAll offset 10m)
      #   annotations:
      #     summary: "ClickHouse cannot reach a remote shard"
      #     description: "Host {{ $labels.hostname }} (CHI {{ $labels.chi }}) gave up connecting to a remote shard
      #       {{ $value | humanize }} time(s) in the last 10m after exhausting its retries. Distributed queries that need
      #       that shard either fail or, with skip_unavailable_shards enabled, quietly return partial results. Check
      #       whether the shard's pods are running and whether the interserver/native port is reachable between them."
      #     runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/clickhouse.yaml#clickhousedistributedconnectionexceptions"

      - alert: ClickHouseNetworkErrors
        expr: |
          increase(chi_clickhouse_metric_SystemErrors_NETWORK_ERROR[10m]) > 0
          or
          increase(chi_clickhouse_event_DNSError[10m]) > 0
          or
          (chi_clickhouse_metric_SystemErrors_NETWORK_ERROR > 0 unless chi_clickhouse_metric_SystemErrors_NETWORK_ERROR offset 10m)
          or
          (chi_clickhouse_event_DNSError > 0 unless chi_clickhouse_event_DNSError offset 10m)
        for: 5m
        labels:
          sourceType: metric
          severity: warning
          priority: P3
          tech_stack: clickhouse
          signal: cause
          category: network
          runbook: runbooks/databases/clickhouse.yaml
          query: |
            increase(chi_clickhouse_metric_SystemErrors_NETWORK_ERROR[10m]) > 0 or increase(chi_clickhouse_event_DNSError[10m]) > 0
            or (chi_clickhouse_metric_SystemErrors_NETWORK_ERROR > 0 unless chi_clickhouse_metric_SystemErrors_NETWORK_ERROR offset 10m)
            or (chi_clickhouse_event_DNSError > 0 unless chi_clickhouse_event_DNSError offset 10m)
        annotations:
          summary: "ClickHouse is hitting network or DNS errors"
          description: "Host {{ $labels.hostname }} (CHI {{ $labels.chi }}) recorded {{ $value | humanize }} network or
            DNS error(s) in the last 10m — NETWORK_ERROR in system.errors, or DNSError in system.events. ClickHouse
            resolves replica and shard hostnames through cluster DNS on every new connection, so DNS or network
            flakiness shows up as failed fetches, failed distributed queries and dropped Keeper sessions before it
            shows up as anything else."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/clickhouse.yaml#clickhousenetworkerrors"

      # --------------------------------------------------------------------------
      # Kafka table engine — both rules disabled, see below
      # --------------------------------------------------------------------------

      # DISABLED: chi_clickhouse_event_KafkaConsumerErrors is not exported in either
      # environment (see the note at the top of this group).
      # - alert: ClickHouseKafkaConsumerErrors
