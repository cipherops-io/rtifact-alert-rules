      #     query: |
      #       increase(chi_clickhouse_event_KafkaCommitFailures[30m]) > 0
      #       or (chi_clickhouse_event_KafkaCommitFailures > 0 unless chi_clickhouse_event_KafkaCommitFailures offset 30m)
      #   annotations:
      #     summary: "ClickHouse Kafka engine cannot commit offsets"
      #     description: "The Kafka engine on host {{ $labels.hostname }} (CHI {{ $labels.chi }}) failed to commit offsets
      #       {{ $value | humanize }} time(s) in the last 30m. Uncommitted offsets are re-read after the next rebalance, so
      #       the same messages are inserted again — duplicate rows in the destination table — and the consumer group may
      #       rebalance repeatedly instead of making progress."
      #     runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/clickhouse.yaml#clickhousekafkacommitfailures"
