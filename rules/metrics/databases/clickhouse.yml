groups:
  - name: clickhouse-operator.rules
    interval: 30s
    rules:
      # ==========================================================================
      # These rules cover the Altinity clickhouse-operator CONTROL PLANE only.
      # The operator exports clickhouse_operator_* metrics describing whether it
      # can converge ClickHouseInstallation (CHI) objects onto the cluster.
      # ==========================================================================

      - alert: ClickHouseOperatorMetricsAbsent
        expr: absent(clickhouse_operator_chi)
        for: 10m
        labels:
          sourceType: metric
          severity: warning
          priority: P2
          tech_stack: clickhouse
          signal: cause
          category: data
          runbook: runbooks/databases/clickhouse.md
          query: absent(clickhouse_operator_chi)
        annotations:
          summary: "clickhouse-operator is exporting no metrics"
          description: "No clickhouse_operator_chi series has been scraped for 10 minutes. Either the clickhouse-operator
            deployment is down or its metrics endpoint is unreachable. While this is firing, every other ClickHouse operator
            alert is blind: reconcile failures, aborted reconciles, and host restarts will go undetected, and CHI spec
            changes may not be applied to the cluster at all."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/clickhouse.md#clickhouseoperatormetricsabsent"

      - alert: ClickHouseOperatorHostReconcileErrors
        expr: increase(clickhouse_operator_host_reconciles_errors[15m]) > 0
        for: 5m
        labels:
          sourceType: metric
          severity: warning
          priority: P2
          tech_stack: clickhouse
          signal: cause
          category: data
          runbook: runbooks/databases/clickhouse.md
          query: increase(clickhouse_operator_host_reconciles_errors[15m]) > 0
        annotations:
          summary: "clickhouse-operator is failing to reconcile a ClickHouse host"
          description: "clickhouse-operator recorded {{ $value | humanize }} host reconcile error(s) in the last 15m for
            CHI {{ $labels.chi }} in namespace {{ $labels.namespace }}. The desired StatefulSet/ConfigMap/service state is
            not being applied to at least one host, so recent CHI changes (image, settings, resources, topology) may be
            partially or entirely unapplied while the cluster still reports as running."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/clickhouse.md#clickhouseoperatorhostreconcileerrors"

      - alert: ClickHouseOperatorHostReconcileErrorsSustained
        expr: increase(clickhouse_operator_host_reconciles_errors[1h]) >= 5
        for: 10m
        labels:
          sourceType: metric
          severity: critical
          priority: P1
          tech_stack: clickhouse
          signal: cause
          category: data
          runbook: runbooks/databases/clickhouse.md
          query: increase(clickhouse_operator_host_reconciles_errors[1h]) >= 5
        annotations:
          summary: "clickhouse-operator cannot converge a ClickHouse host"
          description: "clickhouse-operator recorded {{ $value | humanize }} host reconcile errors in the last hour for CHI
            {{ $labels.chi }} in namespace {{ $labels.namespace }} — it is retrying and failing, not making progress. The
            cluster is stuck between its current and desired state; a rolling upgrade may be halted midway, leaving hosts
            on mixed configurations or mixed versions."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/clickhouse.md#clickhouseoperatorhostreconcileerrorssustained"

      - alert: ClickHouseOperatorCHIReconcileAborted
        expr: increase(clickhouse_operator_chi_reconciles_aborted[15m]) > 0
        for: 5m
        labels:
          sourceType: metric
          severity: warning
          priority: P2
          tech_stack: clickhouse
          signal: cause
          category: data
          runbook: runbooks/databases/clickhouse.md
          query: increase(clickhouse_operator_chi_reconciles_aborted[15m]) > 0
        annotations:
          summary: "A ClickHouseInstallation reconcile was aborted"
          description: "{{ $value | humanize }} CHI reconcile(s) were aborted in the last 15m for CHI {{ $labels.chi }} in
            namespace {{ $labels.namespace }}. An aborted reconcile never reaches completion, so the CHI spec on the cluster
            is not what is committed in Git/the CRD. Common causes: the CHI was edited again mid-reconcile, the operator
            restarted, or a host became unreachable partway through the rollout."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/clickhouse.md#clickhouseoperatorchireconcileaborted"

      - alert: ClickHouseOperatorCHIReconcileStuck
        expr: |
          sum by (namespace, chi) (increase(clickhouse_operator_chi_reconciles_started[1h]))
          - sum by (namespace, chi) (increase(clickhouse_operator_chi_reconciles_completed[1h]))
          - sum by (namespace, chi) (increase(clickhouse_operator_chi_reconciles_aborted[1h]))
          > 0
        for: 15m
        labels:
          sourceType: metric
          severity: warning
          priority: P2
          tech_stack: clickhouse
          signal: cause
          category: data
          runbook: runbooks/databases/clickhouse.md
          query: |
            sum by (namespace, chi) (increase(clickhouse_operator_chi_reconciles_started[1h]))
            - sum by (namespace, chi) (increase(clickhouse_operator_chi_reconciles_completed[1h]))
            - sum by (namespace, chi) (increase(clickhouse_operator_chi_reconciles_aborted[1h]))
            > 0
        annotations:
          summary: "A ClickHouseInstallation reconcile started but never finished"
          description: "{{ $value | humanize }} CHI reconcile(s) for {{ $labels.chi }} in namespace {{ $labels.namespace }}
            started in the last hour and have neither completed nor aborted — the rollout is hung. Hosts may be sitting
            partially updated, and subsequent CHI edits will queue behind this one. A healthy reconcile finishes in seconds
            to a few minutes; anything pending for over 15 minutes is stuck."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/clickhouse.md#clickhouseoperatorchireconcilestuck"

      - alert: ClickHouseOperatorHostReconcileSlow
        expr: |
          increase(clickhouse_operator_host_reconciles_timings_sum[1h])
          / increase(clickhouse_operator_host_reconciles_timings_count[1h])
          > 600
        for: 15m
        labels:
          sourceType: metric
          severity: warning
          priority: P3
          tech_stack: clickhouse
          signal: cause
          category: data
          runbook: runbooks/databases/clickhouse.md
          query: |
            increase(clickhouse_operator_host_reconciles_timings_sum[1h])
            / increase(clickhouse_operator_host_reconciles_timings_count[1h])
            > 600
        annotations:
          summary: "clickhouse-operator host reconciles are taking too long"
          description: "Host reconciles for CHI {{ $labels.chi }} in namespace {{ $labels.namespace }} are averaging
            {{ $value | humanizeDuration }} over the last hour (threshold 10m). Slow reconciles stretch rolling upgrades far
            beyond their maintenance window and usually mean hosts are slow to become ready — long ClickHouse startup,
            replica resync after restart, image pull delays, or pods stuck Pending on scheduling/PVC binding."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/clickhouse.md#clickhouseoperatorhostreconcileslow"

      - alert: ClickHouseOperatorHostRestartsHigh
        expr: increase(clickhouse_operator_host_reconciles_restarts[1h]) > 2
        for: 5m
        labels:
          sourceType: metric
          severity: warning
          priority: P2
          tech_stack: clickhouse
          signal: symptom
          category: data
          runbook: runbooks/databases/clickhouse.md
          query: increase(clickhouse_operator_host_reconciles_restarts[1h]) > 2
        annotations:
          summary: "clickhouse-operator is repeatedly restarting a ClickHouse host"
          description: "clickhouse-operator restarted hosts of CHI {{ $labels.chi }} in namespace {{ $labels.namespace }}
            {{ $value | humanize }} times in the last hour — more than a planned rolling upgrade would need. Every restart
            drops in-flight queries, breaks client connections, and forces the replica to resync on startup. Repeated
            restarts point at a crash-looping ClickHouse container, a failing readiness probe, or a reconcile loop that
            keeps deciding the host needs to be recreated."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/clickhouse.md#clickhouseoperatorhostrestartshigh"

      - alert: ClickHouseOperatorPodsDisappearing
        expr: |
          sum by (namespace, chi) (increase(clickhouse_operator_pod_delete_events[30m]))
          - sum by (namespace, chi) (increase(clickhouse_operator_pod_add_events[30m]))
          > 0
        for: 10m
        labels:
          sourceType: metric
          severity: warning
          priority: P2
          tech_stack: clickhouse
          signal: symptom
          category: data
          runbook: runbooks/databases/clickhouse.md
          query: |
            sum by (namespace, chi) (increase(clickhouse_operator_pod_delete_events[30m]))
            - sum by (namespace, chi) (increase(clickhouse_operator_pod_add_events[30m]))
            > 0
        annotations:
          summary: "ClickHouse pods are being deleted and not coming back"
          description: "CHI {{ $labels.chi }} in namespace {{ $labels.namespace }} saw {{ $value | humanize }} more pod
            delete than pod add event(s) over the last 30m — the cluster is losing hosts rather than cycling them. During a
            healthy rolling restart deletes and adds balance out within minutes. A sustained deficit means pods are being
            evicted, descheduled, or failing to be recreated, which reduces replica count and query capacity."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/databases/clickhouse.md#clickhouseoperatorpodsdisappearing"
