groups:
  - name: kube-state-metrics.rules
    interval: 30s
    rules:
      - alert: KubeStateMetricsDown
        expr: |
          sum by (rtf_cluster_id, rtf_env, rtf_service) (up{job=~".*kube-state-metrics.*"}) == 0
          or
          absent(up{job=~".*kube-state-metrics.*"})
        for: 10m
        labels:
          sourceType: metric
          severity: warning
          priority: P2
          tech_stack: kube-state-metrics
          signal: symptom
          category: monitoring
          runbook: runbooks/kubernetes/kube-state-metrics.yaml
          query: |
            sum by (rtf_cluster_id, rtf_env, rtf_service) (up{job=~".*kube-state-metrics.*"}) == 0
            or
            absent(up{job=~".*kube-state-metrics.*"})
        annotations:
          summary: "kube-state-metrics down: cluster={{ $labels.rtf_cluster_id }} env={{ $labels.rtf_env }} svc={{ $labels.rtf_service }}"
          description: "No healthy kube-state-metrics target for >10m. Context: cluster={{ $labels.rtf_cluster_id }}, env={{
            $labels.rtf_env }}, service={{ $labels.rtf_service }}. Most Kubernetes state-based alerts (pods, deployments,
            daemonsets, HPA, PVC, jobs) will become stale or stop firing, reducing observability and incident detection."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/kubernetes/kube-state-metrics.yaml"

      - alert: KubeStateMetricsListErrors
        expr: |
          sum by (rtf_cluster_id, rtf_env, rtf_service) (rate(kube_state_metrics_list_total{result="error"}[5m]))
          / sum by (rtf_cluster_id, rtf_env, rtf_service) (rate(kube_state_metrics_list_total[5m])) > 0.01
        for: 15m
        labels:
          sourceType: metric
          severity: warning
          priority: P2
          tech_stack: kube-state-metrics
          signal: symptom
          category: monitoring
          runbook: runbooks/kubernetes/kube-state-metrics.yaml
          query: |
            sum by (rtf_cluster_id, rtf_env, rtf_service) (rate(kube_state_metrics_list_total{result="error"}[5m]))
            / sum by (rtf_cluster_id, rtf_env, rtf_service) (rate(kube_state_metrics_list_total[5m])) > 0.01
        annotations:
          summary: "kube-state-metrics LIST errors high: {{ $value | humanizePercentage }} cluster={{ $labels.rtf_cluster_id }} env={{ $labels.rtf_env }}"
          description: "kube-state-metrics LIST calls to API server are failing at {{ $value | humanizePercentage }} over 15m
            (threshold: >1%). Context: cluster={{ $labels.rtf_cluster_id }}, env={{ $labels.rtf_env }}, service={{ $labels.rtf_service
            }}. LIST failures prevent inventory refresh and can make Kubernetes alerts incomplete or delayed."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/kubernetes/kube-state-metrics.yaml"

      - alert: KubeStateMetricsWatchErrors
        expr: |
          sum by (rtf_cluster_id, rtf_env, rtf_service) (rate(kube_state_metrics_watch_total{result="error"}[5m]))
          / sum by (rtf_cluster_id, rtf_env, rtf_service) (rate(kube_state_metrics_watch_total[5m])) > 0.01
        for: 15m
        labels:
          sourceType: metric
          severity: warning
          priority: P2
          tech_stack: kube-state-metrics
          signal: symptom
          category: monitoring
          runbook: runbooks/kubernetes/kube-state-metrics.yaml
          query: |
            sum by (rtf_cluster_id, rtf_env, rtf_service) (rate(kube_state_metrics_watch_total{result="error"}[5m]))
            / sum by (rtf_cluster_id, rtf_env, rtf_service) (rate(kube_state_metrics_watch_total[5m])) > 0.01
        annotations:
          summary: "kube-state-metrics WATCH errors high: {{ $value | humanizePercentage }} cluster={{ $labels.rtf_cluster_id }} env={{ $labels.rtf_env }}"
          description: "kube-state-metrics WATCH stream errors are {{ $value | humanizePercentage }} over 15m (threshold: >1%).
            Context: cluster={{ $labels.rtf_cluster_id }}, env={{ $labels.rtf_env }}, service={{ $labels.rtf_service }}.
            WATCH instability causes stale object state and delayed change detection for Kubernetes monitoring."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/kubernetes/kube-state-metrics.yaml"

      - alert: KubeStateMetricsShardingMismatch
        expr: stdvar by (rtf_cluster_id, rtf_env, rtf_service) (kube_state_metrics_total_shards) != 0
        for: 15m
        labels:
          sourceType: metric
          severity: warning
          priority: P3
          tech_stack: kube-state-metrics
          signal: cause
          category: monitoring
          runbook: runbooks/kubernetes/kube-state-metrics.yaml
          query: stdvar by (rtf_cluster_id, rtf_env, rtf_service) (kube_state_metrics_total_shards) != 0
        annotations:
          summary: "kube-state-metrics shard config mismatch: cluster={{ $labels.rtf_cluster_id }} env={{ $labels.rtf_env }} svc={{ $labels.rtf_service }}"
          description: "kube-state-metrics shards report inconsistent `total_shards` values for >15m. Context: cluster={{
            $labels.rtf_cluster_id }}, env={{ $labels.rtf_env }}, service={{ $labels.rtf_service }}. Shard disagreement indicates
            rollout/config drift and can produce duplicate or missing Kubernetes state metrics."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/kubernetes/kube-state-metrics.yaml"

      - alert: KubeStateMetricsShardsMissing
        expr: |
          2 ^ max by (rtf_cluster_id, rtf_env, rtf_service) (kube_state_metrics_total_shards) - 1
          - sum by (rtf_cluster_id, rtf_env, rtf_service) (2 ^ max by (rtf_cluster_id, rtf_env, rtf_service, shard_ordinal) (kube_state_metrics_shard_ordinal)) != 0
        for: 15m
        labels:
          sourceType: metric
          severity: warning
          priority: P2
          tech_stack: kube-state-metrics
          signal: symptom
          category: monitoring
          runbook: runbooks/kubernetes/kube-state-metrics.yaml
          query: |
            2 ^ max by (rtf_cluster_id, rtf_env, rtf_service) (kube_state_metrics_total_shards) - 1
            - sum by (rtf_cluster_id, rtf_env, rtf_service) (2 ^ max by (rtf_cluster_id, rtf_env, rtf_service, shard_ordinal) (kube_state_metrics_shard_ordinal)) != 0
        annotations:
          summary: "kube-state-metrics missing shards: cluster={{ $labels.rtf_cluster_id }} env={{ $labels.rtf_env }} svc={{ $labels.rtf_service }}"
          description: "At least one kube-state-metrics shard ordinal is missing for >15m. Context: cluster={{ $labels.rtf_cluster_id
            }}, env={{ $labels.rtf_env }}, service={{ $labels.rtf_service }}. Missing shards reduce object coverage and lead
            to blind spots or false negatives in Kubernetes alerts."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/kubernetes/kube-state-metrics.yaml"
