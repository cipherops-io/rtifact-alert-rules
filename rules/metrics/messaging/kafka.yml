  - name: kafka-exporter.metadata
    interval: 30s
    rules:
      - alert: KafkaBrokerCountChanged
        expr: |
          changes(kafka_brokers[15m]) > 0
        for: 5m
        labels:
          sourceType: metric
          severity: warning
          priority: P2
          tech_stack: kafka
          signal: cause
          category: messaging
          runbook: runbooks/messaging/kafka.yaml
          query: changes(kafka_brokers[15m]) > 0
        annotations:
          summary: "Kafka broker count changed"
          description: "Kafka exporter observed a broker count change within the last 15 minutes. This may be expected during planned maintenance, autoscaling, broker replacement, or rolling restarts, but if unplanned it can indicate broker failure, network isolation, failed broker registration, controller instability, or exporter connectivity problems. Confirm whether maintenance or scaling was planned, then check broker pod or node readiness, controller logs, and exporter connectivity to all configured brokers."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/messaging/kafka.yaml#kafkabrokercountchanged"
