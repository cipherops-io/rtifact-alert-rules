groups:
  - name: prometheus.rules
    interval: 30s
    rules:
      - alert: PrometheusDown
        expr: up{job=~"prometheus|prometheus.*"} == 0
        for: 1m
        labels:
          severity: critical
          priority: P1
          tech_stack: prometheus
          signal: symptom
          category: observability
          runbook: runbooks/observability/prometheus.md
        annotations:
          summary: "Prometheus is down"
          description: "Prometheus instance {{ $labels.instance }} has been unreachable for more than 1 minute."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/observability/prometheus.md#prometheusdown"

      - alert: PrometheusTargetDown
        expr: up == 0
        for: 10m
        labels:
          severity: warning
          priority: P2
          tech_stack: prometheus
          signal: symptom
          category: observability
          runbook: runbooks/observability/prometheus.md
        annotations:
          summary: "Prometheus scrape target is down"
          description: "Prometheus target {{ $labels.job }}/{{ $labels.instance }} has been down for more than 10 minutes."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/observability/prometheus.md#prometheustargetdown"

      - alert: PrometheusScrapeLimitsExceeded
        expr: |
          rate(prometheus_target_scrapes_exceeded_body_size_limit_total[5m])
          + rate(prometheus_target_scrapes_exceeded_sample_limit_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: prometheus
          signal: symptom
          category: observability
          runbook: runbooks/observability/prometheus.md
        annotations:
          summary: "Prometheus scrape errors due to exceeded limits"
          description: "Prometheus is dropping scrapes because targets are exceeding body size or sample limits."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/observability/prometheus.md#prometheusscrapelimitsexceeded"

      - alert: PrometheusRuleEvaluationSlow
        expr: prometheus_rule_group_last_duration_seconds > prometheus_rule_group_interval_seconds
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: prometheus
          signal: cause
          category: observability
          runbook: runbooks/observability/prometheus.md
        annotations:
          summary: "Prometheus rule group evaluation is slower than its interval"
          description: "Prometheus rule group {{ $labels.rule_group }} is taking longer than its evaluation interval."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/observability/prometheus.md#prometheusruleevaluationslow"

      - alert: PrometheusWALCorruption
        expr: prometheus_tsdb_wal_corruptions_total > 0
        for: 1m
        labels:
          severity: critical
          priority: P1
          tech_stack: prometheus
          signal: symptom
          category: observability
          runbook: runbooks/observability/prometheus.md
        annotations:
          summary: "Prometheus WAL corruption detected"
          description: "Prometheus WAL has {{ $value }} corruption events — data loss may occur. Restart Prometheus to attempt recovery."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/observability/prometheus.md#prometheuswalcorruption"

      - alert: PrometheusTSDBCompactionFailed
        expr: rate(prometheus_tsdb_compactions_failed_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: prometheus
          signal: cause
          category: observability
          runbook: runbooks/observability/prometheus.md
        annotations:
          summary: "Prometheus TSDB compaction is failing"
          description: "Prometheus TSDB compaction is failing — disk I/O or storage issue."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/observability/prometheus.md#prometheustsdbcompactionfailed"

      - alert: PrometheusHighCardinality
        expr: prometheus_tsdb_head_series > 2000000
        for: 10m
        labels:
          severity: warning
          priority: P2
          tech_stack: prometheus
          signal: cause
          category: observability
          runbook: runbooks/observability/prometheus.md
        annotations:
          summary: "Prometheus has too many active time series"
          description: "Prometheus has {{ $value | humanize }} active time series — high cardinality may cause OOM."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/observability/prometheus.md#prometheushighcardinality"

      - alert: PrometheusMissedScrapes
        expr: rate(prometheus_target_scrapes_missed_by_target_limit_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: prometheus
          signal: symptom
          category: observability
          runbook: runbooks/observability/prometheus.md
        annotations:
          summary: "Prometheus is missing scrapes due to target limits"
          description: "Prometheus is missing scrapes due to target limits."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/observability/prometheus.md#prometheusmissedscrapes"

      - alert: PrometheusRemoteWriteErrors
        expr: rate(prometheus_remote_storage_samples_failed_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: prometheus
          signal: symptom
          category: observability
          runbook: runbooks/observability/prometheus.md
        annotations:
          summary: "Prometheus remote write is failing"
          description: "Prometheus remote write is failing at {{ $value }} samples/s."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/observability/prometheus.md#prometheusremotewriteerrors"

      - alert: PrometheusRemoteWriteBehind
        expr: (time() - prometheus_remote_storage_queue_highest_sent_timestamp_seconds) > 120
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: prometheus
          signal: cause
          category: observability
          runbook: runbooks/observability/prometheus.md
        annotations:
          summary: "Prometheus remote write queue is lagging"
          description: "Prometheus remote write queue is {{ $value | humanizeDuration }} behind — check remote storage endpoint."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/observability/prometheus.md#prometheusremotewritebehind"
