groups:
  - name: alertmanager.rules
    interval: 30s
    rules:
      - alert: AlertmanagerDown
        expr: absent(up{job=~"alertmanager|.*alertmanager.*"} == 1)
        for: 5m
        labels:
          severity: critical
          priority: P0
          tech_stack: alertmanager
          signal: symptom
          category: observability
          runbook: runbooks/observability/alertmanager.md
        annotations:
          summary: "All Alertmanager instances are down"
          description: "No Alertmanager has been reachable for 5 minutes — alerts are not being routed or sent anywhere."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/observability/alertmanager.md#alertmanagerdown"

      - alert: AlertmanagerConfigReloadFailed
        expr: alertmanager_config_last_reload_successful == 0
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: alertmanager
          signal: symptom
          category: observability
          runbook: runbooks/observability/alertmanager.md
        annotations:
          summary: "Alertmanager config reload failed"
          description: "Alertmanager on {{ $labels.instance }} failed to reload its configuration — running on the previous version."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/observability/alertmanager.md#alertmanagerconfigreloadfailed"

      - alert: AlertmanagerNotificationsFailing
        expr: |
          sum by (integration) (rate(alertmanager_notifications_failed_total[5m]))
          / sum by (integration) (rate(alertmanager_notifications_total[5m])) > 0.01
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: alertmanager
          signal: symptom
          category: observability
          runbook: runbooks/observability/alertmanager.md
        annotations:
          summary: "Alertmanager notification delivery is failing"
          description: "Alertmanager is failing to send {{ $value | humanizePercentage }} of notifications via {{ $labels.integration }}."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/observability/alertmanager.md#alertmanagernotificationsfailing"

      - alert: AlertmanagerClusterFailedPeers
        expr: max_over_time(alertmanager_cluster_failed_peers[5m]) > 0
        for: 10m
        labels:
          severity: warning
          priority: P2
          tech_stack: alertmanager
          signal: symptom
          category: observability
          runbook: runbooks/observability/alertmanager.md
        annotations:
          summary: "Alertmanager cluster has failed peers"
          description: "Alertmanager {{ $labels.instance }} reports {{ $value }} failed peer(s) — duplicate notifications likely."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/observability/alertmanager.md#alertmanagerclusterfailedpeers"

      - alert: AlertmanagerClusterDown
        expr: |
          (count by (job) (avg_over_time(up{job=~".*alertmanager.*"}[5m]) < 0.5)
          / count by (job) (up{job=~".*alertmanager.*"})) >= 0.5
        for: 5m
        labels:
          severity: critical
          priority: P1
          tech_stack: alertmanager
          signal: symptom
          category: observability
          runbook: runbooks/observability/alertmanager.md
        annotations:
          summary: "Half or more of the Alertmanager cluster is down"
          description: "{{ $value | humanizePercentage }} of the Alertmanager replicas in job {{ $labels.job }} have been down for at least the last 5 minutes."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/observability/alertmanager.md#alertmanagerclusterdown"

      - alert: AlertmanagerSilencesGrowing
        expr: rate(alertmanager_silences[1h]) > 0.5
        for: 1h
        labels:
          severity: warning
          priority: P3
          tech_stack: alertmanager
          signal: cause
          category: observability
          runbook: runbooks/observability/alertmanager.md
        annotations:
          summary: "Alertmanager silence count is growing rapidly"
          description: "Alertmanager silence count is growing at {{ $value | humanize }}/s — review for stale silences."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/observability/alertmanager.md#alertmanagersilencesgrowing"
