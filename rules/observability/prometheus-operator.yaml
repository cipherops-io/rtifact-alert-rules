groups:
  - name: prometheus-operator.rules
    interval: 30s
    rules:
      - alert: PrometheusOperatorDown
        expr: absent(up{job=~".*prometheus-operator.*"} == 1)
        for: 10m
        labels:
          severity: warning
          priority: P2
          tech_stack: prometheus-operator
          signal: symptom
          category: observability
          runbook: runbooks/observability/prometheus-operator.md
        annotations:
          summary: "Prometheus Operator is unreachable"
          description: "Prometheus Operator has been unreachable for 10 minutes — CRD reconciliation is stopped."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/observability/prometheus-operator.md#prometheusoperatordown"

      - alert: PrometheusOperatorListErrors
        expr: |
          sum by (controller, namespace) (rate(prometheus_operator_list_operations_failed_total[10m]))
          / sum by (controller, namespace) (rate(prometheus_operator_list_operations_total[10m])) > 0.4
        for: 15m
        labels:
          severity: warning
          priority: P2
          tech_stack: prometheus-operator
          signal: symptom
          category: observability
          runbook: runbooks/observability/prometheus-operator.md
        annotations:
          summary: "Prometheus Operator list operation error rate is high"
          description: "Errors while performing list operations in controller {{ $labels.controller }} in {{ $labels.namespace }}."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/observability/prometheus-operator.md#prometheusoperatorlisterrors"

      - alert: PrometheusOperatorWatchErrors
        expr: |
          sum by (controller, namespace) (rate(prometheus_operator_watch_operations_failed_total[10m]))
          / sum by (controller, namespace) (rate(prometheus_operator_watch_operations_total[10m])) > 0.4
        for: 15m
        labels:
          severity: warning
          priority: P2
          tech_stack: prometheus-operator
          signal: symptom
          category: observability
          runbook: runbooks/observability/prometheus-operator.md
        annotations:
          summary: "Prometheus Operator watch operation error rate is high"
          description: "Errors while performing watch operations in controller {{ $labels.controller }} in {{ $labels.namespace }}."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/observability/prometheus-operator.md#prometheusoperatorwatcherrors"

      - alert: PrometheusOperatorReconcileErrors
        expr: |
          (sum by (controller, namespace) (rate(prometheus_operator_reconcile_errors_total[5m])))
          / (sum by (controller, namespace) (rate(prometheus_operator_reconcile_operations_total[5m]))) > 0.1
        for: 10m
        labels:
          severity: warning
          priority: P2
          tech_stack: prometheus-operator
          signal: symptom
          category: observability
          runbook: runbooks/observability/prometheus-operator.md
        annotations:
          summary: "Prometheus Operator reconcile error rate is high"
          description: "Reconcile errors in controller {{ $labels.controller }} in {{ $labels.namespace }} at {{ $value | humanizePercentage }}."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/observability/prometheus-operator.md#prometheusoperatorreconcileerrors"

      - alert: PrometheusOperatorRejectedResources
        expr: min_over_time(prometheus_operator_managed_resources{state="rejected"}[5m]) > 0
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: prometheus-operator
          signal: symptom
          category: observability
          runbook: runbooks/observability/prometheus-operator.md
        annotations:
          summary: "Prometheus Operator has rejected managed resources"
          description: "Prometheus Operator in {{ $labels.namespace }} has rejected resources of type {{ $labels.resource }}/{{ $labels.controller }}."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/observability/prometheus-operator.md#prometheusoperatorrejectedresources"
