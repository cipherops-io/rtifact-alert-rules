groups:
  - name: argocd.rules
    interval: 30s
    rules:
      - alert: ArgoCDAppOutOfSync
        expr: argocd_app_info{sync_status="OutOfSync"} == 1
        for: 10m
        labels:
          severity: warning
          priority: P2
          tech_stack: argocd
          signal: cause
          category: gitops
          runbook: runbooks/gitops/argocd.yaml
        annotations:
          summary: "argocd app OutOfSync: app={{ $labels.name }} project={{ $labels.project }}"
          description: "ArgoCD application {{ $labels.name }} (project {{ $labels.project }}, repo {{ $labels.repo }}) has remained OutOfSync for more than 10 minutes — the desired state in Git does not match the live state. May indicate unapplied changes, drift, disabled auto-sync, or a failing sync."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/gitops/argocd.yaml#argocdappoutofsync"

      - alert: ArgoCDAppDegraded
        expr: argocd_app_info{health_status="Degraded"} == 1
        for: 5m
        labels:
          severity: critical
          priority: P1
          tech_stack: argocd
          signal: symptom
          category: gitops
          runbook: runbooks/gitops/argocd.yaml
        annotations:
          summary: "argocd app Degraded: app={{ $labels.name }} project={{ $labels.project }}"
          description: "ArgoCD application {{ $labels.name }} health is Degraded for more than 5 minutes — one or more managed Kubernetes resources are unhealthy. User-facing impact is likely; review sync history, rollout events, and pod status in the destination namespace."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/gitops/argocd.yaml#argocdappdegraded"

      - alert: ArgoCDAppHealthUnknown
        expr: argocd_app_info{health_status="Unknown"} == 1
        for: 15m
        labels:
          severity: warning
          priority: P2
          tech_stack: argocd
          signal: cause
          category: gitops
          runbook: runbooks/gitops/argocd.yaml
        annotations:
          summary: "argocd app health Unknown: app={{ $labels.name }} project={{ $labels.project }}"
          description: "ArgoCD app {{ $labels.name }} health has been Unknown for more than 15m. Often indicates a connectivity issue between ArgoCD and the destination cluster (or a custom resource without a health check)."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/gitops/argocd.yaml#argocdapphealthunknown"

      - alert: ArgoCDSyncFailed
        expr: |
          sum by (rtf_cluster_id, rtf_env, rtf_service, name, project, phase) (
            increase(argocd_app_sync_total{phase=~"Error|Failed"}[1h])
          ) > 3
        for: 0s
        labels:
          severity: warning
          priority: P2
          tech_stack: argocd
          signal: symptom
          category: gitops
          runbook: runbooks/gitops/argocd.yaml
        annotations:
          summary: "argocd app sync failed: app={{ $labels.name }} project={{ $labels.project }} phase={{ $labels.phase }}"
          description: "ArgoCD sync operations for {{ $labels.name }} have failed more than 3 times in the last hour (phase {{ $labels.phase }}). Repeated sync failures block deployment automation until the underlying cause (manifest errors, failed hooks, unreachable resources, or destination cluster issues) is resolved."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/gitops/argocd.yaml#argocdsyncfailed"

      - alert: ArgocdControllerDown
        expr: |
          sum by (rtf_cluster_id, rtf_env, rtf_service) (up{job=~".*argocd-application-controller-metrics"}) == 0
          or
          absent(up{job=~".*argocd-application-controller-metrics"})
        for: 5m
        labels:
          severity: critical
          priority: P1
          tech_stack: argocd
          signal: symptom
          category: gitops
          runbook: runbooks/gitops/argocd.yaml
        annotations:
          summary: "argocd application-controller down: cluster={{ $labels.rtf_cluster_id }} env={{ $labels.rtf_env }}"
          description: "The ArgoCD application-controller has been down or unscraped for more than 5m. Reconciliation and sync are halted: drift is no longer detected or corrected and app health/sync status goes stale until it recovers."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/gitops/argocd.yaml#argocdcontrollerdown"

      - alert: ArgocdServerDown
        expr: |
          sum by (rtf_cluster_id, rtf_env, rtf_service) (up{job=~".*argocd-server-metrics"}) == 0
          or
          absent(up{job=~".*argocd-server-metrics"})
        for: 5m
        labels:
          severity: critical
          priority: P1
          tech_stack: argocd
          signal: symptom
          category: gitops
          runbook: runbooks/gitops/argocd.yaml
        annotations:
          summary: "argocd server down: cluster={{ $labels.rtf_cluster_id }} env={{ $labels.rtf_env }}"
          description: "The ArgoCD API/UI server has been down or unscraped for more than 5m. Operators lose UI/CLI/API access and webhook-triggered syncs stop, though the controller may still reconcile in the background."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/gitops/argocd.yaml#argocdserverdown"

      - alert: ArgocdRepoServerDown
        expr: |
          sum by (rtf_cluster_id, rtf_env, rtf_service) (up{job=~".*argocd-repo-server-metrics"}) == 0
          or
          absent(up{job=~".*argocd-repo-server-metrics"})
        for: 5m
        labels:
          severity: critical
          priority: P1
          tech_stack: argocd
          signal: symptom
          category: gitops
          runbook: runbooks/gitops/argocd.yaml
        annotations:
          summary: "argocd repo-server down: cluster={{ $labels.rtf_cluster_id }} env={{ $labels.rtf_env }}"
          description: "The ArgoCD repo-server has been down or unscraped for more than 5m. Manifest generation and Git access fail, so sync and reconcile operations error out or stall until it recovers."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/gitops/argocd.yaml#argocdreposerverdown"

      - alert: ArgocdGitFetchErrors
        expr: |
          sum by (rtf_cluster_id, rtf_env, rtf_service, repo) (
            increase(argocd_git_fetch_fail_total[15m])
          ) > 5
        for: 0s
        labels:
          severity: warning
          priority: P2
          tech_stack: argocd
          signal: cause
          category: gitops
          runbook: runbooks/gitops/argocd.yaml
        annotations:
          summary: "argocd git fetch errors: repo={{ $labels.repo }}"
          description: "ArgoCD repo-server git fetches have failed more than 5 times in the last 15m (repo {{ $labels.repo }}). Usually indicates repository connectivity or authentication problems; sync/reconcile for apps on this repo can fail or stay stale until resolved."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/gitops/argocd.yaml#argocdgitfetcherrors"

      - alert: ArgocdSlowReconciliation
        expr: |
          histogram_quantile(0.95,
            sum by (rtf_cluster_id, rtf_env, rtf_service, le) (
              rate(argocd_app_reconcile_bucket[5m])
            )
          ) > 120
        for: 15m
        labels:
          severity: warning
          priority: P2
          tech_stack: argocd
          signal: cause
          category: gitops
          runbook: runbooks/gitops/argocd.yaml
        annotations:
          summary: "argocd slow reconciliation: p95={{ $value | humanizeDuration }}"
          description: "ArgoCD application-controller p95 reconciliation time has exceeded 120s for more than 15m. Drift detection and sync are delayed. Common causes: controller CPU/memory pressure, too few controller shards, slow destination-cluster API, or large/expensive manifests."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/gitops/argocd.yaml#argocdslowreconciliation"

      - alert: ArgocdRedisConnectionErrors
        expr: |
          sum by (rtf_cluster_id, rtf_env, rtf_service) (
            increase(argocd_redis_request_total{failed="true"}[5m])
          ) > 0
        for: 10m
        labels:
          severity: warning
          priority: P2
          tech_stack: argocd
          signal: cause
          category: gitops
          runbook: runbooks/gitops/argocd.yaml
        annotations:
          summary: "argocd redis connection errors: initiator={{ $labels.rtf_service }}"
          description: "ArgoCD has reported failed Redis requests for more than 10m. Redis backs manifest/app-state caching; failed requests force expensive recomputation and degrade API/UI responsiveness and reconcile throughput. Check the argocd-redis pod health, connectivity, and memory/eviction pressure."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/gitops/argocd.yaml#argocdredisdown"

      - alert: ArgoCDDexDown
        expr: |
          sum by (rtf_cluster_id, rtf_env, rtf_service, job, instance) (up{job=~".*argocd-dex.*"}) == 0
          or
          absent(up{job=~".*argocd-dex.*"})
        for: 2m
        labels:
          severity: warning
          priority: P2
          tech_stack: argocd
          signal: symptom
          category: gitops
          runbook: runbooks/gitops/argocd.yaml
        annotations:
          summary: "argocd dex down: instance={{ $labels.instance }} cluster={{ $labels.rtf_cluster_id }} env={{ $labels.rtf_env }}"
          description: "The ArgoCD Dex server (bundled OIDC/SSO identity broker) has been down or unscraped for more than 2m. SSO logins to the UI/CLI/API fail; reconciliation of configured apps continues, and local admin credentials (if enabled) remain a break-glass path. Likely causes: crashed/OOMKilled dex pod, misconfigured connector/client secret, or an unreachable upstream IdP."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/gitops/argocd.yaml#argocddexdown"

      - alert: ArgoCDRedisDown
        expr: |
          sum by (rtf_cluster_id, rtf_env, rtf_service, job, instance) (up{job=~".*argocd-redis.*"}) == 0
          or
          absent(up{job=~".*argocd-redis.*"})
        for: 2m
        labels:
          severity: warning
          priority: P2
          tech_stack: argocd
          signal: cause
          category: gitops
          runbook: runbooks/gitops/argocd.yaml
        annotations:
          summary: "argocd redis down: instance={{ $labels.instance }} cluster={{ $labels.rtf_cluster_id }} env={{ $labels.rtf_env }}"
          description: "The ArgoCD Redis cache has been down or unscraped for more than 2m. The controller and repo-server must recompute manifests/resource trees on every request, driving up CPU and Git/Kubernetes API load, slowing reconciliation, and degrading UI/API responsiveness. Cache is ephemeral (no desired state lost), but sustained downtime causes reconcile backlogs. Likely causes: crashed/OOMKilled/evicted redis pod, redis-ha failover, or a resource/PDB issue."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/gitops/argocd.yaml#argocdredisdown"
