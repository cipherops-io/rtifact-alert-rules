groups:
  - name: python-fastapi.rules
    interval: 30s
    rules:
      - alert: FastAPIAppDown
        expr: up{job=~"fastapi.*|python.*"} == 0
        for: 1m
        labels:
          severity: critical
          priority: P1
          tech_stack: python-fastapi
          signal: symptom
          category: app
          runbook: runbooks/runtimes/python-fastapi.md
          query: up{job=~"fastapi.*|python.*"} == 0
        annotations:
          summary: "FastAPI application is down"
          description: "FastAPI application {{ $labels.job }}/{{ $labels.instance }} is down."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/runtimes/python-fastapi.md#fastapiappdown"

      - alert: FastAPIHighErrorRate
        expr: |
          rate(http_requests_total{status_code=~"5..",job=~"fastapi.*|python.*"}[5m])
          / rate(http_requests_total{job=~"fastapi.*|python.*"}[5m]) > 0.01
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: python-fastapi
          signal: symptom
          category: app
          runbook: runbooks/runtimes/python-fastapi.md
          query: |
            rate(http_requests_total{status_code=~"5..",job=~"fastapi.*|python.*"}[5m])
            / rate(http_requests_total{job=~"fastapi.*|python.*"}[5m]) > 0.01
        annotations:
          summary: "FastAPI HTTP 5xx error rate is high"
          description: "FastAPI app {{ $labels.instance }} HTTP 5xx error rate is {{ $value | humanizePercentage }}."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/runtimes/python-fastapi.md#fastapihigherrorrate"

      - alert: FastAPIHighResponseTime
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket{job=~"fastapi.*|python.*"}[5m])) > 2
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: python-fastapi
          signal: symptom
          category: app
          runbook: runbooks/runtimes/python-fastapi.md
          query: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket{job=~"fastapi.*|python.*"}[5m])) > 2
        annotations:
          summary: "FastAPI HTTP p99 latency is high"
          description: "FastAPI app {{ $labels.instance }} HTTP p99 latency is {{ $value | humanizeDuration }}."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/runtimes/python-fastapi.md#fastapihighresponsetime"

      - alert: FastAPIHighCPUUsage
        expr: rate(process_cpu_seconds_total{job=~"fastapi.*|python.*"}[5m]) > 0.80
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: python-fastapi
          signal: cause
          category: app
          runbook: runbooks/runtimes/python-fastapi.md
          query: rate(process_cpu_seconds_total{job=~"fastapi.*|python.*"}[5m]) > 0.80
        annotations:
          summary: "FastAPI process CPU usage is high"
          description: "FastAPI app {{ $labels.instance }} CPU usage is {{ $value | humanizePercentage }} — check for blocking
            sync code in async handlers."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/runtimes/python-fastapi.md#fastapihighcpuusage"

      - alert: FastAPIDBConnectionPoolExhausted
        expr: |
          sqlalchemy_pool_checkedout{job=~"fastapi.*|python.*"}
          / sqlalchemy_pool_size{job=~"fastapi.*|python.*"} > 0.95
        for: 2m
        labels:
          severity: critical
          priority: P1
          tech_stack: python-fastapi
          signal: symptom
          category: app
          runbook: runbooks/runtimes/python-fastapi.md
          query: |
            sqlalchemy_pool_checkedout{job=~"fastapi.*|python.*"}
            / sqlalchemy_pool_size{job=~"fastapi.*|python.*"} > 0.95
        annotations:
          summary: "FastAPI SQLAlchemy connection pool is nearly exhausted"
          description: "FastAPI app {{ $labels.instance }} SQLAlchemy pool is {{ $value | humanizePercentage }} used — DB
            queries are queuing."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/runtimes/python-fastapi.md#fastapidbconnectionpoolexhausted"

      - alert: FastAPIKafkaConsumerLagHigh
        expr: kafka_consumergroup_lag{job=~"fastapi.*|python.*"} > 10000
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: python-fastapi
          signal: cause
          category: app
          runbook: runbooks/runtimes/python-fastapi.md
          query: kafka_consumergroup_lag{job=~"fastapi.*|python.*"} > 10000
        annotations:
          summary: "FastAPI Kafka consumer group lag is high"
          description: "FastAPI Kafka consumer group {{ $labels.consumergroup }} lag is {{ $value }} messages."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/runtimes/python-fastapi.md#fastapikafkaconsumerlaghigh"

      - alert: FastAPIBackgroundTaskFailing
        expr: rate(celery_task_failed_total{job=~"fastapi.*|python.*|celery.*"}[5m]) > 0
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: python-fastapi
          signal: symptom
          category: app
          runbook: runbooks/runtimes/python-fastapi.md
          query: rate(celery_task_failed_total{job=~"fastapi.*|python.*|celery.*"}[5m]) > 0
        annotations:
          summary: "FastAPI background or Celery tasks are failing"
          description: "FastAPI background/Celery tasks are failing at {{ $value }}/s on {{ $labels.instance }}."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/runtimes/python-fastapi.md#fastapibackgroundtaskfailing"

      - alert: FastAPIHighOpenConnections
        expr: |
          process_open_fds{job=~"fastapi.*|python.*"}
          / process_max_fds{job=~"fastapi.*|python.*"} > 0.80
        for: 5m
        labels:
          severity: warning
          priority: P2
          tech_stack: python-fastapi
          signal: cause
          category: app
          runbook: runbooks/runtimes/python-fastapi.md
          query: |
            process_open_fds{job=~"fastapi.*|python.*"}
            / process_max_fds{job=~"fastapi.*|python.*"} > 0.80
        annotations:
          summary: "FastAPI open file descriptors are near the limit"
          description: "FastAPI app {{ $labels.instance }} open file descriptors at {{ $value | humanizePercentage }} of limit
            — check for connection leaks."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/runtimes/python-fastapi.md#fastapihighopenconnections"

      - alert: FastAPIErrorRateCritical
        expr: |
          rate(http_requests_total{status_code=~"5..",job=~"fastapi.*|python.*"}[5m])
          / rate(http_requests_total{job=~"fastapi.*|python.*"}[5m]) > 0.50
        for: 1m
        labels:
          severity: critical
          priority: P1
          tech_stack: python-fastapi
          signal: symptom
          category: app
          runbook: runbooks/runtimes/python-fastapi.md
          query: |
            rate(http_requests_total{status_code=~"5..",job=~"fastapi.*|python.*"}[5m])
            / rate(http_requests_total{job=~"fastapi.*|python.*"}[5m]) > 0.50
        annotations:
          summary: "FastAPI error rate exceeds 50% — circuit breaker or total downstream failure"
          description: "FastAPI app {{ $labels.instance }} has > 50% error rate — likely circuit breaker open or downstream
            total failure."
          runbook_url: "https://github.com/cipherops-io/rtifact-alert-rules/blob/main/runbooks/runtimes/python-fastapi.md#fastapierrorratecritical"
